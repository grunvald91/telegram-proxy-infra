# Desired RU nginx stream server for selected media.bandbook.site fastpath.
# 2026-11-12 live repair: route to DE SNI dispatcher over WG (not DE loopback 9470).
# This file is a sanitized reference, not an automatic deployment target.
# Historical live-snapshot retains the original broken route for audit.
server {
    listen 10443 so_keepalive=30s:10s:3;
    listen [::]:10443 so_keepalive=30s:10s:3;
    proxy_pass 10.66.77.1:443;
    proxy_connect_timeout 5s;
    proxy_timeout 15m;
    proxy_socket_keepalive on;
    tcp_nodelay on;
}
