name: RU188 AWG worker scoped DB and disabled environment stage
"on":
  push:
    branches: [main]
    paths:
      - '.github/workflows/fi-awg-worker-db-stage.yml'
      - 'nodekit/fi_awg_worker_db_stage.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ru188-awg-worker-db-provision
  cancel-in-progress: false
jobs:
  stage:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: node-fi
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test DB role and no-release safety offline
        run: |
          set -Eeuo pipefail
          python3 -m py_compile nodekit/fi_awg_worker_db_stage.py
          python3 -m unittest discover -s nodekit/tests -p 'test_fi_awg_worker_db_stage.py' -v
          bash -n <(python3 - <<'PY'
          from pathlib import Path
          lines=Path('.github/workflows/fi-awg-worker-db-stage.yml').read_text().splitlines()
          start=next(i for i,v in enumerate(lines) if v=='      - name: Stage role and env on existing pinned RU188')
          body=next(i for i in range(start+1,len(lines)) if lines[i]=='        run: |')+1
          print('\n'.join(v[10:] for v in lines[body:]))
          PY
          )
      - name: Install ephemeral SSH password client
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends sshpass >/dev/null
      - name: Stage role and env on existing pinned RU188
        shell: bash
        env:
          RU_PASSWORD: ${{ secrets.SERVER188_SSH_PASSWORD }}
        run: |
          set -Eeuo pipefail
          umask 077
          [[ -n "$RU_PASSWORD" ]] || exit 2
          grep -q '^188\.120\.254\.223 ssh-ed25519 ' ops/mnebydns-owner-ssh-known_hosts
          work="$RUNNER_TEMP/fi-awg-db-worker"
          mkdir -m 0700 "$work"
          cleanup() { rm -rf -- "$work"; }
          trap cleanup EXIT
          cat > "$work/ssh.conf" <<CFG
          Host ru188
            HostName 188.120.254.223
            User root
            UserKnownHostsFile $PWD/ops/mnebydns-owner-ssh-known_hosts
            GlobalKnownHostsFile /dev/null
            HostKeyAlgorithms ssh-ed25519
            StrictHostKeyChecking yes
            UpdateHostKeys no
            BatchMode no
            PasswordAuthentication yes
            PubkeyAuthentication no
            KbdInteractiveAuthentication no
            ForwardAgent no
            ClearAllForwardings yes
            ControlMaster no
            ProxyCommand none
            ConnectTimeout 12
            ServerAliveInterval 10
            ServerAliveCountMax 3
            LogLevel ERROR
          CFG
          export SSHPASS="$RU_PASSWORD"
          # The checked script is passed via SSH stdin, with no credentials or
          # SQL files staged on the runner. Password is the EXISTING bootstrap
          # transport; the generated DB role password stays on RU188 only.
          sshpass -e ssh -T -F "$work/ssh.conf" ru188 \
            'python3 -' < nodekit/fi_awg_worker_db_stage.py
          echo 'FI_AWG_WORKER_DB_STAGING=completed;SERVICE_STARTED=false;CUSTOMER_RELEASE_UNCHANGED=true'
