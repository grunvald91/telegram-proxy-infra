name: Meta v22 RU first-hop SNI router and nft receive-window readiness READ ONLY
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: meta-v22-ru-stream-readonly
  cancel-in-progress: false
jobs:
  inspect-ru:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      RU_PASS: ${{ secrets.SERVER188_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Prepare pinned SSH
        run: |
          set -Eeuo pipefail
          test -n "$RU_PASS" && test -s ops/mnebydns-owner-ssh-known_hosts
          if ! command -v sshpass >/dev/null; then
            timeout 35s sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=7 update -qq || true
            timeout 55s sudo DEBIAN_FRONTEND=noninteractive apt-get install -qq -y sshpass >/dev/null
          fi
      - name: Check exact router capability and prequeue mark without printing configs
        run: |
          set -Eeuo pipefail
          export SSHPASS="$RU_PASS"
          opts=(-T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes
            -o HostKeyAlgorithms=ssh-ed25519
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts"
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR)
          echo '### RU exact-host passthrough SNI mapping capability (no writes)' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          sshpass -e ssh "${opts[@]}" root@188.120.254.223 'python3 -' <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import subprocess,json,re
          def cmd(a,t=12):
              return subprocess.run(a,capture_output=True,text=True,timeout=t,check=False)
          def out(k,v):print("meta_v22_"+k+"="+str(v),flush=True)
          nx=cmd(["nginx","-T"])
          full=nx.stdout+"\n"+nx.stderr
          out("nginx_test_pass",nx.returncode==0)
          anchor="map $ssl_preread_server_name $direct_mtproxy_backend {"
          out("stream_map_anchor_count",full.count(anchor))
          out("stream_proxy_pass_anchor_count",len(re.findall(r"proxy_pass\\s+\\$direct_mtproxy_backend\\s*;",full)))
          out("stream_ssl_preread_enabled",bool(re.search(r"ssl_preread\\s+on\\s*;",full)))
          out("direct_sni_map_has_default",bool(re.search(r"(?m)^\\s*default\\s+[^;]+;",full)))
          out("tcp443_bind_count",len(re.findall(r"listen\\s+(?:[0-9.]+:)?443\\s*;",full)))
          rule=cmd(["nft","-j","list","ruleset"])
          out("nft_json_available",rule.returncode==0)
          if rule.returncode==0:
              try:
                  data=json.loads(rule.stdout)
                  queues=[]
                  for row in data.get("nftables",[]):
                      v=row.get("rule",{})
                      for i,e in enumerate(v.get("expr",[])):
                          if e.get("queue",{}).get("num")==210:
                              queues.append((v,i))
                  out("queue210_rule_count",len(queues))
                  for v,i in queues[:2]:
                      good={"op":"==","left":{"&":[{"meta":{"key":"mark"}},1073741824]},"right":0}
                      out("queue210_bypass_before_queue",any(x.get("match")==good for x in v.get("expr",[])[:i]))
              except Exception as e:out("nft_parse_error",type(e).__name__)
          out("experiment_table_absent",cmd(["nft","list","table","inet","mneby_meta_v20_public"]).returncode!=0)
          print("meta_v22_writes=none")
          PY
          echo '```' >> "$GITHUB_STEP_SUMMARY"
