name: Diagnose RU WEB mirror

"on":
  push:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-ru-web-mirror.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET_HOST: "188.120.254.223"
      TARGET_PASSWORD: ${{ secrets.SERVER188_SSH_PASSWORD }}

    steps:
      - name: Install SSH helper
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Inspect mirror state
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$TARGET_PASSWORD"
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10             "root@$TARGET_HOST" 'bash -s' <<'REMOTE'
          set +e
          echo "===== WG ====="
          ip -brief address
          wg show
          echo "===== MIRROR FILE ====="
          cat /etc/nginx/conf.d/tproxy-web-ru-mirror-only.conf 2>/dev/null
          echo "===== NGINX TEST ====="
          nginx -t
          echo "===== NGINX STATUS ====="
          systemctl --no-pager --full status nginx | tail -80
          echo "===== PORT 3001 ====="
          ss -lntp | grep ':3001' || true
          echo "===== NGINX ERROR TAIL ====="
          tail -100 /var/log/nginx/error.log 2>/dev/null
          echo "===== LOCAL CURLS ====="
          curl -sv --max-time 5 http://10.66.77.2:3001/ -o /dev/null 2>&1 | tail -40
          curl -sv --max-time 5 http://127.0.0.1:3001/ -o /dev/null 2>&1 | tail -40
          REMOTE
