name: MNEBYVPN stage private Prodamus merchant signing secret on server188
on:
  push:
    branches: [main]
    paths: ['.github/workflows/mnebyvpn-prodamus-secret-stage.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      HOST: '188.120.254.223'
      SSH_PASSWORD: ${{ secrets.SERVER188_SSH_PASSWORD }}
      PRODAMUS_HMAC: ${{ secrets.PRODAMUS_SIGN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate non-secret deployment files and existing SSH credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_PASSWORD"
          test -n "$PRODAMUS_HMAC" || { echo 'Add PRODAMUS_SIGN_SECRET in repository Actions secrets first'; exit 2; }
          bash -n scripts/mnebyvpn-prodamus-secret-stage.sh
          sudo apt-get update -qq && sudo apt-get install -qq -y sshpass
      - name: Transfer HMAC key via encrypted SSH standard input without printing
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$SSH_PASSWORD"
          opts=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=12 -o LogLevel=ERROR)
          sshpass -e scp "${opts[@]}" scripts/mnebyvpn-prodamus-secret-stage.sh \
            "root@$HOST:/tmp/mnebyvpn-prodamus-secret-stage.sh"
          printf %s "$PRODAMUS_HMAC" | sshpass -e ssh -T "${opts[@]}" \
            "root@$HOST" 'bash /tmp/mnebyvpn-prodamus-secret-stage.sh'
      - name: Clean dedicated upload
        if: always()
        shell: bash
        run: |
          if [[ -n "$SSH_PASSWORD" ]]; then
            SSHPASS="$SSH_PASSWORD" sshpass -e ssh -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=9 -o LogLevel=ERROR "root@$HOST" \
              'rm -f /tmp/mnebyvpn-prodamus-secret-stage.sh' || true
          fi
