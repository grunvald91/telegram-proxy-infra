name: MNEBYVPN publish website guest-trial VPN worker on server188
on:
  push:
    paths:
      - '.github/workflows/mnebyvpn-guest-worker-publish.yml'
      - 'scripts/mnebyvpn-main-node-guest-worker-promote.sh'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mnebyvpn-live-node-worker-main
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HOST: '188.120.254.223'
      PASSWORD: ${{ secrets.SERVER188_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify reviewed release and non-destructive worker script
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PASSWORD"
          bash -n scripts/mnebyvpn-main-node-guest-worker-promote.sh
          curl -fsSL --retry 2 --max-time 20 \
            https://api.github.com/repos/grunvald91/Mnebyvpn/commits/main \
            -o "$RUNNER_TEMP/main.json"
          sha="$(python3 - "$RUNNER_TEMP/main.json" <<'PY'
          import sys,json
          print(json.load(open(sys.argv[1]))['sha'])
          PY
          )"
          test "$sha" = fd6b1d44ca65b1cf82efbde8ab606793d958d760
          echo "sha=$sha" >> "$GITHUB_ENV"
          test -n "$sha"
          sudo apt-get update -qq && sudo apt-get install -qq -y sshpass
      - name: Replace only signed VPN worker (foreign node untouched)
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$PASSWORD"
          opts=(-o ConnectTimeout=12 -o StrictHostKeyChecking=accept-new -o LogLevel=ERROR)
          sshpass -e scp "${opts[@]}" scripts/mnebyvpn-main-node-guest-worker-promote.sh \
            "root@$HOST:/tmp/mnebyvpn-main-node-guest-worker-$sha.sh"
          sshpass -e ssh "${opts[@]}" "root@$HOST" \
            "bash /tmp/mnebyvpn-main-node-guest-worker-$sha.sh '$sha'"
          echo "guest_worker_sha=$sha" >> "$GITHUB_STEP_SUMMARY"
      - name: Confirm authenticated guest trial endpoints reject strangers
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$PASSWORD"
          sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 \
            -o LogLevel=ERROR "root@$HOST" 'bash -se' <<'SH'
          set -euo pipefail
          for route in guest-trial guest-status profile; do
            code="$(curl --noproxy '*' -s -o /dev/null -w '%{http_code}' \
              --max-time 5 -X POST -H 'Content-Type: application/json' \
              -d '{"guestToken":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"}' \
              "http://127.0.0.1:8794/$route")"
            test "$code" = 401
          done
          test "$(curl --noproxy '*' -s -o /dev/null -w '%{http_code}' \
            --max-time 5 http://127.0.0.1:8794/readyz)" = 200
          echo 'guest_worker_private_endpoints_unauthorized=401'
          echo 'guest_worker_readyz=200'
          SH
      - name: Clean release script
        if: always()
        shell: bash
        run: |
          if [[ -n "$PASSWORD" && -n "${sha:-}" ]]; then
            SSHPASS="$PASSWORD" sshpass -e ssh -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=8 -o LogLevel=ERROR "root@$HOST" \
              "rm -f /tmp/mnebyvpn-main-node-guest-worker-$sha.sh" || true
          fi
