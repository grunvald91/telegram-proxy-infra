name: "MNEBYDNS synchronize verified Antigravity shared routes to COVERED"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mnebydns-antigravity-mark-covered-20261110.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/mnebydns-antigravity-mark-covered-20261110.yml"
      - "scripts/mnebydns-antigravity-mark-covered-20261110.py"
permissions:
  contents: read
concurrency:
  group: mnebydns-google-public-443-change
  cancel-in-progress: false
jobs:
  sync:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RU_PASS: ${{ secrets.SERVER188_SSH_PASSWORD }}
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify all live Antigravity domains then update canonical owner status only
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$RU_PASS" && test -n "$DE_PASS"
          sudo apt-get update -qq && sudo apt-get install -qq -y sshpass >/dev/null
          python3 -m py_compile scripts/mnebydns-antigravity-mark-covered-20261110.py
          python3 scripts/mnebydns-antigravity-mark-covered-20261110.py
