name: Owner Telemt worker live readiness (read-only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/mnebyvpn-owner-telemt-worker-preflight.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PASS: ${{ secrets.SERVER188_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect socket UID, image, database privileges without secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s ops/mnebydns-owner-ssh-known_hosts
          test -n "$PASS"
          sudo apt-get update -qq && sudo apt-get install -qq -y sshpass >/dev/null
          export SSHPASS="$PASS"
          sshpass -e ssh -T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes \
            -o HostKeyAlgorithms=ssh-ed25519 \
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR \
            root@188.120.254.223 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          echo 'worker_preflight=read_only'
          if systemctl is-active -q mnebyvpn-owner-telemt-tunnel; then
            echo 'telemt_tunnel=active'
          else
            echo 'telemt_tunnel=inactive'
          fi
          sock=/run/mnebyvpn-owner-mtproxy/telemt.sock
          if test -S "$sock"; then echo 'private_socket_exists=true'; else echo 'private_socket_exists=false'; fi
          if test -S "$sock"; then
            owner="$(stat -c '%u:%g:%a' "$sock")"
            if [[ "$owner" == '13096:13096:600' ]]; then echo 'socket_owner_mode=verified'; else echo 'socket_owner_mode=unexpected'; fi
            if command -v setpriv >/dev/null; then
              if setpriv --reuid=13096 --regid=13096 --clear-groups \
                curl --noproxy '*' --unix-socket "$sock" -fsS --max-time 6 \
                  http://localhost/v1/system/info | python3 -c \
                  'import json,sys; assert json.load(sys.stdin).get("ok") is True'; then
                echo 'worker_uid_uds_api=verified'
              else echo 'worker_uid_uds_api=failed'; fi
            else echo 'setpriv=missing'; fi
          fi
          image="$(docker inspect --format '{{.Config.Image}}' mnebyvpn-bot-info)"
          if [[ "$image" =~ ^mnebyvpn-stage-web:[0-9a-f]{40}$ ]]; then
            sha="${image##*:}"
            echo "current_source_sha=$sha"
            if test -r "/opt/mnebyvpn/releases/$sha/apps/service/src/dns-mtproxy-bonus-worker.ts" \
              && test -r "/opt/mnebyvpn/releases/$sha/packages/web/src/telegram-proxy-unix-transport.ts"; then
              echo 'worker_source=ready'
            else echo 'worker_source=missing'; fi
          else echo 'worker_source=invalid_image'; fi
          echo "existing_proxy_worker=$(docker inspect -f '{{.State.Status}}' mnebyvpn-dns-mtproxy-bonus-worker 2>/dev/null || echo missing)"

          worker_name=mnebyvpn-dns-mtproxy-bonus-worker
          private_env=/etc/mnebyvpn-owner-mtproxy/worker.env
          bot_env=/opt/mnebyvpn/bot/web.env
          if docker inspect "$worker_name" >/dev/null 2>&1; then
            echo "worker_restart_count=$(docker inspect -f '{{.RestartCount}}' "$worker_name")"
            echo "worker_exit_code=$(docker inspect -f '{{.State.ExitCode}}' "$worker_name")"
            echo "worker_uid=$(docker inspect -f '{{.Config.User}}' "$worker_name")"
            worker_img="$(docker inspect -f '{{.Config.Image}}' "$worker_name")"
            if [[ "$worker_img" == "$image" ]]; then echo 'worker_image_matches_bot=yes'; else echo 'worker_image_matches_bot=no'; fi
            if docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$worker_name" | grep -Fxq 'DNS_MT_PROXY_OWNER_ONLY=yes';then echo 'worker_scope_owner_only=yes';else echo 'worker_scope_owner_only=no';fi
            if docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$worker_name" | grep -Fxq 'DNS_MT_PROXY_BONUS_WORKER=enabled';then echo 'worker_feature_enabled=yes';else echo 'worker_feature_enabled=no';fi
            logs="$(docker logs --since 15m "$worker_name" 2>&1 || true)"
            if grep -Fq 'MNEBYVPN_DNS_MTPROXY_WORKER_STOPPED' <<<"$logs";then echo 'worker_startup_errors=yes';else echo 'worker_startup_errors=no';fi
            if grep -Fq 'MNEBYVPN_DNS_MTPROXY_RECONCILE_RETRY' <<<"$logs";then echo 'worker_reconcile_errors=yes';else echo 'worker_reconcile_errors=no';fi
          fi
          if [[ -r "$private_env" ]];then
            echo 'worker_secret_file=present'
            if [[ "$(stat -c '%a' "$private_env")" == 600 ]];then echo 'worker_secret_file_mode=secure';else echo 'worker_secret_file_mode=unexpected';fi
            wkey="$(sed -n 's/^WEB_DNS_MT_PROXY_BONUS_KEY=//p' "$private_env")"
            bkey="$(sed -n 's/^WEB_DNS_MT_PROXY_BONUS_KEY=//p' "$bot_env")"
            if [[ "$wkey" =~ ^[a-f0-9]{64}$ ]];then echo 'worker_key_valid=yes';else echo 'worker_key_valid=no';fi
            if [[ -n "$bkey" && "$bkey" == "$wkey" ]];then echo 'bot_worker_keys_equal=yes';else echo 'bot_worker_keys_equal=no';fi
            dbpw="$(python3 - "$private_env" <<'PY'
          from pathlib import Path
          from urllib.parse import urlsplit
          import sys
          d=dict(x.split('=',1) for x in Path(sys.argv[1]).read_text().splitlines() if '=' in x)
          url=urlsplit(d.get('DATABASE_URL',''))
          assert url.hostname=='127.0.0.1' and url.username=='mnebyvpn_owner_telemt'
          print(url.password)
          PY
          )"
            if docker exec -e PGPASSWORD="$dbpw" mnebyvpn-stage-postgres \
              psql -h 127.0.0.1 -qAtX -v ON_ERROR_STOP=1 \
              -U mnebyvpn_owner_telemt -d mnebyvpn_stage \
              -c 'SELECT count(*) FROM manual_sales' >/dev/null 2>&1;then
              echo 'worker_db_login_and_manual_sales_read=pass'
            else echo 'worker_db_login_and_manual_sales_read=fail';fi
            if docker exec -e PGPASSWORD="$dbpw" mnebyvpn-stage-postgres \
              psql -h 127.0.0.1 -qAtX -v ON_ERROR_STOP=1 \
              -U mnebyvpn_owner_telemt -d mnebyvpn_stage \
              -c 'SELECT count(*) FROM dns_mtproxy_bonus_credentials' >/dev/null 2>&1;then
              echo 'worker_db_proxy_read=pass'
            else echo 'worker_db_proxy_read=fail';fi
            unset dbpw wkey bkey
          else echo 'worker_secret_file=missing';fi
          if [[ -r "$private_env" && -n "$image" ]];then
            docker run --rm --network host --user 13096:13096 --env-file "$private_env" \
              --entrypoint node "$image" --experimental-strip-types --input-type=module -e '
              import {Pool} from "pg";
              const db=new Pool({connectionString:process.env.DATABASE_URL,max:1,connectionTimeoutMillis:2500});
              for(const [label,sql] of [["connect","SELECT 1"],["credential_table","SELECT 1 FROM dns_mtproxy_bonus_credentials LIMIT 1"]]){
                try{await db.query(sql);console.log("worker_network_"+label+"=pass");}
                catch(e){const code=String(e?.code??"UNKNOWN");
                  console.log("worker_network_"+label+"=fail;code="+(/^[A-Z0-9_]{1,18}$/.test(code)?code:"UNKNOWN"));}
              }
              await db.end();
              ' || echo 'worker_network_diagnostic_failed=true'
          fi

          docker exec -i mnebyvpn-stage-postgres psql -qAtX -v ON_ERROR_STOP=1 \
            -U mnebyvpn_stage -d mnebyvpn_stage <<'SQL'
          SELECT 'role_super='||rolsuper::text||' role_create='||rolcreaterole::text
            FROM pg_roles WHERE rolname=current_user;
          SELECT 'can_grant_proxy='||has_table_privilege(current_user,
            'dns_mtproxy_bonus_credentials','INSERT')::text;
          SELECT 'can_grant_owner='||has_table_privilege(current_user,
            'manual_sales','SELECT')::text;
          SELECT 'manual_sales='||count(*)::text FROM manual_sales;
          SELECT 'existing_proxy_secrets='||count(*)::text
            FROM dns_mtproxy_bonus_credentials;
          SQL
          REMOTE
