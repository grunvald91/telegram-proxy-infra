name: MNEBYDNS Meta 2026-11-10 sidecar startup forensic read-only
on:
  push:
    branches: [diagnostics/mnebydns-meta-rootcause-20261109]
    paths: [.github/workflows/mnebydns-meta-sidecar-failure-readonly-20261110.yml]
permissions:
  contents: read
jobs:
  forensic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - name: Read DE archived Nginx startup error, stable state and leftover units
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$DE_PASS"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          SSHPASS="$DE_PASS" sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=12 -o LogLevel=ERROR root@89.125.90.101 'python3 -' <<'PY'
          import subprocess,re,os,pathlib
          id='42793798436'
          def run(*args):
              try:return subprocess.run(args,capture_output=True,text=True,timeout=10)
              except Exception as e:return None
          p=run('journalctl','-u','mnebydns-meta-pilot-'+id+'.service','--no-pager','-o','cat','--since','2026-11-10 09:47:00 UTC','--until','2026-11-10 09:51:00 UTC')
          if p:
              rows=p.stdout.splitlines()
              print('meta_sidecar_log_rows='+str(len(rows)),flush=True)
              relevant=[x for x in rows if re.search(r'error|failed|denied|bind|open\(|permission|emerg|crit|nginx|exit',x,re.I)]
              print('meta_sidecar_relevant_log_count='+str(len(relevant)),flush=True)
              for x in relevant[-24:]:
                  x=re.sub(r'\b(?:\d{1,3}\.){3}\d{1,3}\b','IPv4_REDACTED',x)
                  print('meta_sidecar_log='+x[:250],flush=True)
          p=run('systemctl','is-active','mnebydns-dot.service')
          print('meta_stable_DoT_active='+str(bool(p and p.stdout.strip()=='active')).lower(),flush=True)
          p=run('systemctl','is-active','mnebydns-googlepilot.service')
          print('meta_stable_googlepilot_active='+str(bool(p and p.stdout.strip()=='active')).lower(),flush=True)
          print('meta_sidecar_config_still_present='+str(pathlib.Path('/etc/mnebydns-meta-pilot/nginx.conf').exists()).lower(),flush=True)
          stable=pathlib.Path('/opt/mnebydns-stable-checkpoints/current').read_text().strip()
          for name,live in [('dns','/opt/mnebydns-dot/Corefile'),('nginx','/etc/nginx/nginx.conf'),('proxy','/etc/mnebydns-googlepilot/nginx.conf')]:
              p=run('cmp','-s',str(pathlib.Path(stable)/(name+'.stable')),live)
              print('meta_stable_checkpoint_'+name+'_matched='+str(bool(p and p.returncode==0)).lower(),flush=True)
          print('meta_startup_forensic_read_only=true',flush=True)
          PY
