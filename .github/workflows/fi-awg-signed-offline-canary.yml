name: FI217 signed AWG grant revoke offline canary (no clients)
"on":
  push:
    branches: [main]
    paths:
      - .github/workflows/fi-awg-signed-offline-canary.yml
      - nodekit/fi_awg_signed_canary.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fi217-awg-offline-nonpublishing-canary
  cancel-in-progress: false
jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: node-fi
    env:
      RU_SSH_PASSWORD: ${{ secrets.SERVER188_SSH_PASSWORD }}
      FI_SSH_PASSWORD: ${{ secrets.MNEBYVPN_NEW_NODE_SSH_PASSWORD }}
      FI_SSH_USER: ${{ secrets.MNEBYVPN_NEW_NODE_SSH_USER }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test disposable Ed25519 commands offline
        run: |
          set -Eeuo pipefail
          python3 -m py_compile nodekit/fi_awg_signed_canary.py
          python3 -m unittest discover -s nodekit/tests -p 'test_fi_awg_signed_canary.py' -v
      - name: Install ephemeral SSH client
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends sshpass >/dev/null
      - name: Sign on RU188 and verify grant revoke expiry on FI217 without installing peers
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          [[ -n "$RU_SSH_PASSWORD" && -n "$FI_SSH_PASSWORD" && "$FI_SSH_USER" == root ]] || exit 2
          grep -q '^188\.120\.254\.223 ssh-ed25519 ' ops/mnebydns-owner-ssh-known_hosts
          work="$RUNNER_TEMP/fi-awg-offline"
          mkdir -m 0700 "$work"
          known="$work/fi-known-hosts"
          signed="$work/signed.json"
          cat > "$work/ru-ssh-config" <<CFG
          Host ru-controller
            HostName 188.120.254.223
            User root
            UserKnownHostsFile $PWD/ops/mnebydns-owner-ssh-known_hosts
            GlobalKnownHostsFile /dev/null
            HostKeyAlgorithms ssh-ed25519
            StrictHostKeyChecking yes
            UpdateHostKeys no
            BatchMode no
            PasswordAuthentication yes
            PubkeyAuthentication no
            KbdInteractiveAuthentication no
            ForwardAgent no
            ClearAllForwardings yes
            ControlMaster no
            ProxyCommand none
            ConnectTimeout 12
            LogLevel ERROR
          CFG
          export SSHPASS="$RU_SSH_PASSWORD"
          sshpass -e ssh -T -F "$work/ru-ssh-config" ru-controller \
            'cat /root/mnebyvpn-controller/fi-known_hosts' > "$known"
          chmod 0600 "$known"
          [[ "$(wc -l < "$known")" == 1 ]] || exit 2
          grep -Eq '^fi\.mnebyvpn\.site ssh-ed25519 [A-Za-z0-9+/]+={0,2}$' "$known" || exit 2
          sshpass -e ssh -T -F "$work/ru-ssh-config" ru-controller \
            'python3 - --mode issue' < nodekit/fi_awg_signed_canary.py > "$signed"
          chmod 0600 "$signed"
          python3 - "$signed" <<'PY'
          import json,pathlib,sys
          raw=pathlib.Path(sys.argv[1]).read_bytes()
          assert 500 < len(raw) < 6000
          data=json.loads(raw)
          assert set(data)=={'version','nodeId','grant','revoke'}
          assert data['nodeId']=='fi-test-01'
          assert data['grant']['op']=='grant' and data['revoke']['op']=='revoke'
          PY
          cat > "$work/fi-ssh-config" <<CFG
          Host fi-node
            HostName 217.11.167.91
            User root
            UserKnownHostsFile $known
            HostKeyAlias fi.mnebyvpn.site
            GlobalKnownHostsFile /dev/null
            HostKeyAlgorithms ssh-ed25519
            StrictHostKeyChecking yes
            UpdateHostKeys no
            BatchMode no
            PasswordAuthentication yes
            PubkeyAuthentication no
            KbdInteractiveAuthentication no
            ForwardAgent no
            ClearAllForwardings yes
            ControlMaster no
            ProxyCommand none
            ConnectTimeout 12
            LogLevel ERROR
          CFG
          export SSHPASS="$FI_SSH_PASSWORD"
          remote() { sshpass -e ssh -T -F "$work/fi-ssh-config" fi-node "$@"; }
          remote_dir=""
          cleanup() {
            set +e
            if [[ "$remote_dir" =~ ^/run/fi-awg-signed-canary\.[A-Za-z0-9]{8}$ ]]; then
              remote "rm -rf -- '$remote_dir'" >/dev/null 2>&1
            fi
            rm -rf -- "$work"
          }
          trap cleanup EXIT
          remote 'set -eu; ! systemctl is-active --quiet mnebyvpn-nodekit-awg@fi-test-01.service; ! systemctl is-active --quiet mnebyvpn-nodekit-awg-watchdog@fi-test-01.service'
          remote_dir=$(remote 'umask 077; mktemp -d /run/fi-awg-signed-canary.XXXXXXXX')
          [[ "$remote_dir" =~ ^/run/fi-awg-signed-canary\.[A-Za-z0-9]{8}$ ]] || exit 2
          sshpass -e scp -F "$work/fi-ssh-config" \
            nodekit/fi_awg_signed_canary.py nodekit/awg_peer_grants.py \
            nodekit/awg_lifecycle.py nodekit/install_components.py "$signed" \
            "fi-node:$remote_dir/"
          remote "python3 '$remote_dir/fi_awg_signed_canary.py' --mode verify --signed '$remote_dir/signed.json'"
          remote 'set -eu; ! systemctl is-active --quiet mnebyvpn-nodekit-awg@fi-test-01.service; ! systemctl is-active --quiet mnebyvpn-nodekit-awg-watchdog@fi-test-01.service'
          export SSHPASS="$RU_SSH_PASSWORD"
          sshpass -e ssh -T -F "$work/ru-ssh-config" ru-controller 'python3 -' <<'PY'
          from pathlib import Path
          import stat,subprocess
          root=Path('/root/mnebyvpn-controller')
          def secure(path):
              try: mode=path.lstat()
              except OSError:return False
              return (stat.S_ISREG(mode.st_mode) and mode.st_uid==0 and
                      (mode.st_mode & 0o077)==0 and mode.st_nlink==1)
          def env_field(path,name):
              if not secure(path):return None
              data=path.read_bytes()
              if not 0<len(data)<=8192:return None
              for line in data.decode('ascii').splitlines():
                  if line.startswith(name+'='):return line.partition('=')[2]
              return None
          unit=Path('/etc/systemd/system/mnebyvpn-awg-delivery.service')
          worker=Path('/opt/mnebyvpn-controller/current/apps/service/src/awg-controller-delivery-worker.ts')
          awg_env=root/'config/awg-delivery.env'
          fi_env=root/'config/fi-enrollment.env'
          signer=root/'controller-signing-key.pem'
          hostpin=root/'fi-known_hosts'
          approval=root/'approvals/awg-delivery.enable'
          identity=env_field(awg_env,'AWG_CONTROLLER_SSH_IDENTITY_FILE')
          node_pin=env_field(awg_env,'AWG_CONTROLLER_SSH_KNOWN_HOSTS_FILE')
          awg_db=env_field(awg_env,'DATABASE_URL')
          fi_db=env_field(fi_env,'DATABASE_URL')
          try:
              active=subprocess.run(['systemctl','is-active','--quiet',
                  'mnebyvpn-awg-delivery.service'],timeout=7).returncode==0
          except (OSError,subprocess.TimeoutExpired):active=False
          db_same=bool(awg_db and fi_db and awg_db==fi_db)
          key_ready=bool(identity and identity.startswith('/root/') and
                         secure(Path(identity)))
          pin_ready=bool(node_pin and node_pin.startswith('/root/') and
                         secure(Path(node_pin)))
          print('FI_AWG_CTRL_SYSTEMD_UNIT_READY='+str(secure(unit)).lower())
          print('FI_AWG_CTRL_SIGNER_READY='+str(secure(signer)).lower())
          print('FI_AWG_CTRL_FI_HOST_PIN_READY='+str(secure(hostpin)).lower())
          print('FI_AWG_CTRL_WORKER_SOURCE_READY='+str(worker.is_file()).lower())
          print('FI_AWG_CTRL_WORKER_ACTIVE='+str(active).lower())
          print('FI_AWG_CTRL_ENV_READY='+str(secure(awg_env)).lower())
          print('FI_AWG_CTRL_SSH_IDENTITY_READY='+str(key_ready).lower())
          print('FI_AWG_CTRL_SSH_PIN_READY='+str(pin_ready).lower())
          print('FI_AWG_CTRL_APPROVAL_READY='+str(secure(approval)).lower())
          print('FI_AWG_CTRL_SAME_CANONICAL_DB='+str(db_same).lower())
          PY
          echo 'FI_AWG_LIVE_CUSTOMER_RELEASE=false;NO_PEERS_INSTALLED=true'
