name: FI217 signed AWG grant revoke offline canary (no clients)
"on":
  push:
    branches: [main]
    paths:
      - .github/workflows/fi-awg-signed-offline-canary.yml
      - nodekit/fi_awg_signed_canary.py
      - nodekit/fi_awg_node_attestation.py
      - nodekit/fi_awg_node_pool_stage.py
      - nodekit/tests/test_fi_awg_node_pool_stage.py
      - nodekit/tests/test_fi_awg_node_attestation.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fi217-awg-offline-nonpublishing-canary
  cancel-in-progress: false
jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: node-fi
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test disposable Ed25519 commands offline
        run: |
          set -Eeuo pipefail
          python3 -m py_compile nodekit/fi_awg_signed_canary.py nodekit/fi_awg_node_attestation.py nodekit/fi_awg_node_pool_stage.py
          python3 -m unittest discover -s nodekit/tests -p 'test_fi_awg_node_pool_stage.py' -v
          python3 -m unittest discover -s nodekit/tests -p 'test_fi_awg_signed_canary.py' -v
          python3 -m unittest discover -s nodekit/tests -p 'test_fi_awg_node_attestation.py' -v
      - name: Install ephemeral SSH client
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends sshpass >/dev/null
      - name: Sign on RU188 and verify grant revoke expiry on FI217 without installing peers
        # Secrets are unavailable to checkout, package installation and all offline tests.
        env:
          RU_SSH_PASSWORD: ${{ secrets.SERVER188_SSH_PASSWORD }}
          FI_SSH_PASSWORD: ${{ secrets.MNEBYVPN_NEW_NODE_SSH_PASSWORD }}
          FI_SSH_USER: ${{ secrets.MNEBYVPN_NEW_NODE_SSH_USER }}
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          [[ -n "$RU_SSH_PASSWORD" && -n "$FI_SSH_PASSWORD" && "$FI_SSH_USER" == root ]] || exit 2
          grep -q '^188\.120\.254\.223 ssh-ed25519 ' ops/mnebydns-owner-ssh-known_hosts
          work="$RUNNER_TEMP/fi-awg-offline"
          mkdir -m 0700 "$work"
          known="$work/fi-known-hosts"
          signed="$work/signed.json"
          cat > "$work/ru-ssh-config" <<CFG
          Host ru-controller
            HostName 188.120.254.223
            User root
            UserKnownHostsFile $PWD/ops/mnebydns-owner-ssh-known_hosts
            GlobalKnownHostsFile /dev/null
            HostKeyAlgorithms ssh-ed25519
            StrictHostKeyChecking yes
            UpdateHostKeys no
            BatchMode no
            PasswordAuthentication yes
            PubkeyAuthentication no
            KbdInteractiveAuthentication no
            ForwardAgent no
            ClearAllForwardings yes
            ControlMaster no
            ProxyCommand none
            ConnectTimeout 12
            LogLevel ERROR
            ServerAliveInterval 10
            ServerAliveCountMax 3
          CFG
          export SSHPASS="$RU_SSH_PASSWORD"
          sshpass -e ssh -T -F "$work/ru-ssh-config" ru-controller \
            'cat /root/mnebyvpn-controller/fi-known_hosts' > "$known"
          chmod 0600 "$known"
          [[ "$(wc -l < "$known")" == 1 ]] || exit 2
          grep -Eq '^fi\.mnebyvpn\.site ssh-ed25519 [A-Za-z0-9+/]+={0,2}$' "$known" || exit 2
          sshpass -e ssh -T -F "$work/ru-ssh-config" ru-controller \
            'python3 - --mode issue' < nodekit/fi_awg_signed_canary.py > "$signed"
          chmod 0600 "$signed"
          python3 - "$signed" <<'PY'
          import json,pathlib,sys
          raw=pathlib.Path(sys.argv[1]).read_bytes()
          assert 500 < len(raw) < 6000
          data=json.loads(raw)
          assert set(data)=={'version','nodeId','grant','revoke'}
          assert data['nodeId']=='fi-test-01'
          assert data['grant']['op']=='grant' and data['revoke']['op']=='revoke'
          PY
          cat > "$work/fi-ssh-config" <<CFG
          Host fi-node
            HostName 217.11.167.91
            User root
            UserKnownHostsFile $known
            HostKeyAlias fi.mnebyvpn.site
            GlobalKnownHostsFile /dev/null
            HostKeyAlgorithms ssh-ed25519
            StrictHostKeyChecking yes
            UpdateHostKeys no
            BatchMode no
            PasswordAuthentication yes
            PubkeyAuthentication no
            KbdInteractiveAuthentication no
            ForwardAgent no
            ClearAllForwardings yes
            ControlMaster no
            ProxyCommand none
            ConnectTimeout 12
            LogLevel ERROR
          CFG
          export SSHPASS="$FI_SSH_PASSWORD"
          remote() { sshpass -e ssh -T -F "$work/fi-ssh-config" fi-node "$@"; }
          remote_dir=""
          ru_pool_dir=""
          cleanup() {
            set +e
            # RU188 audit may have switched SSHPASS; always clean FI with FI credentials.
            export SSHPASS="$FI_SSH_PASSWORD"
            if [[ "$remote_dir" =~ ^/run/fi-awg-signed-canary\.[A-Za-z0-9]{8}$ ]]; then
              remote "rm -rf -- '$remote_dir'" >/dev/null 2>&1
            fi
            if [[ "$ru_pool_dir" =~ ^/run/fi-awg-pool.[A-Za-z0-9]{8}$ ]]; then
              export SSHPASS="$RU_SSH_PASSWORD"
              sshpass -e ssh -T -F "$work/ru-ssh-config" ru-controller \
                "rm -rf -- '$ru_pool_dir'" >/dev/null 2>&1 || true
            fi
            rm -rf -- "$work"
          }
          trap cleanup EXIT
          remote 'set -eu; ! systemctl is-active --quiet mnebyvpn-nodekit-awg@fi-test-01.service; ! systemctl is-active --quiet mnebyvpn-nodekit-awg-watchdog@fi-test-01.service'
          remote_dir=$(remote 'umask 077; mktemp -d /run/fi-awg-signed-canary.XXXXXXXX')
          [[ "$remote_dir" =~ ^/run/fi-awg-signed-canary\.[A-Za-z0-9]{8}$ ]] || exit 2
          sshpass -e scp -F "$work/fi-ssh-config" \
            nodekit/fi_awg_signed_canary.py nodekit/awg_peer_grants.py \
            nodekit/awg_lifecycle.py nodekit/install_components.py "$signed" \
            "fi-node:$remote_dir/"
          remote "python3 '$remote_dir/fi_awg_signed_canary.py' --mode verify --signed '$remote_dir/signed.json'"
          # The FI node now proves it checked both real signed controller
          # commands with its *actual enrolled* private key. This signature
          # uses a separate TEST_PROOF_V1 domain and must never count as an
          # APPLIED_V1 ACK or alter the real node AWG ledger.
          python3 nodekit/fi_awg_node_attestation.py --mode issue --signed "$signed" > "$work/challenge.json"
          chmod 0600 "$work/challenge.json"
          sshpass -e scp -F "$work/fi-ssh-config" \
            nodekit/fi_awg_node_attestation.py "$work/challenge.json" \
            "fi-node:$remote_dir/"
          remote "chmod 0600 '$remote_dir/fi_awg_node_attestation.py' '$remote_dir/challenge.json'; python3 '$remote_dir/fi_awg_node_attestation.py' --mode respond --signed '$remote_dir/signed.json' --challenge '$remote_dir/challenge.json'" > "$work/proof.json"
          chmod 0600 "$work/proof.json"
          export SSHPASS="$RU_SSH_PASSWORD"
          sshpass -e ssh -T -F "$work/ru-ssh-config" ru-controller \
            'cat /root/mnebyvpn-controller/fi-node-public.spki' > "$work/fi-node-public.spki"
          chmod 0600 "$work/fi-node-public.spki"
          python3 nodekit/fi_awg_node_attestation.py --mode verify \
            --signed "$signed" --challenge "$work/challenge.json" \
            --proof "$work/proof.json" --node-public "$work/fi-node-public.spki"
          # The dedicated RU188 SSH transport is independently verified.
          # Invalid payload must fail even when AWG is not running.
          sshpass -e ssh -T -F "$work/ru-ssh-config" ru-controller \
            'python3 - --mode probe' < nodekit/fi_awg_ssh_stage.py
          export SSHPASS="$FI_SSH_PASSWORD"
          remote 'set -eu; ! systemctl is-active --quiet mnebyvpn-nodekit-awg@fi-test-01.service; ! systemctl is-active --quiet mnebyvpn-nodekit-awg-watchdog@fi-test-01.service'
          echo 'FI_AWG_REAL_RU_FI_KEY_ATTESTATION=PASS;APPLIED_ACK=false;CUSTOMER_RELEASE=false'
          export SSHPASS="$RU_SSH_PASSWORD"
          sshpass -e ssh -T -F "$work/ru-ssh-config" ru-controller 'python3 -' <<'PY'
          from pathlib import Path
          from urllib.parse import urlsplit
          import shlex,stat,subprocess
          root=Path('/root/mnebyvpn-controller')
          def secure(path):
              try: mode=path.lstat()
              except OSError:return False
              return (stat.S_ISREG(mode.st_mode) and mode.st_uid==0 and
                      (mode.st_mode & 0o077)==0 and mode.st_nlink==1)
          def env_field(path,name):
              if not secure(path):return None
              data=path.read_bytes()
              if not 0<len(data)<=8192:return None
              for line in data.decode('utf-8').splitlines():
                  line=line.strip()
                  if line.startswith('export '):line=line[7:].lstrip()
                  if line.startswith(name+'='):
                      raw=line.partition('=')[2]
                      try:
                          fields=shlex.split(raw,comments=True,posix=True)
                      except ValueError:return None
                      return fields[0] if len(fields)==1 else None
              return None
          unit=Path('/etc/systemd/system/mnebyvpn-awg-delivery.service')
          worker=Path('/opt/mnebyvpn-controller/current/apps/service/src/awg-controller-delivery-worker.ts')
          awg_env=root/'config/awg-delivery.env'
          fi_env=root/'config/fi-enrollment.env'
          signer=root/'controller-signing-key.pem'
          hostpin=root/'fi-known_hosts'
          approval=root/'approvals/awg-delivery.enable'
          identity=env_field(awg_env,'AWG_CONTROLLER_SSH_IDENTITY_FILE')
          node_pin=env_field(awg_env,'AWG_CONTROLLER_SSH_KNOWN_HOSTS_FILE')
          awg_db=env_field(awg_env,'DATABASE_URL')
          fi_db=env_field(fi_env,'DATABASE_URL')
          try:
              active=subprocess.run(['systemctl','is-active','--quiet',
                  'mnebyvpn-awg-delivery.service'],timeout=7).returncode==0
          except (OSError,subprocess.TimeoutExpired):active=False
          def target(url):
              if not url:return None
              try:
                  parts=urlsplit(url)
                  # Connection parameters may override the URL host/dbname.
                  # Treat those URLs as unverified instead of claiming an exact match.
                  from urllib.parse import parse_qsl
                  query=dict(parse_qsl(parts.query,keep_blank_values=True))
                  if (parts.scheme not in ('postgresql','postgres') or
                      not parts.hostname or not parts.path.strip('/') or
                      any(k in query for k in ('host','hostaddr','port','dbname'))):
                      return None
                  return (parts.hostname.lower(),parts.port or 5432,parts.path)
              except ValueError:return None
          if not secure(awg_env) or not secure(fi_env):
              db_status='unconfigured'
          else:
              awg_target,fi_target=target(awg_db),target(fi_db)
              db_status=('unverified' if not awg_target or not fi_target else
                         'match' if awg_target==fi_target else 'mismatch')
          key_ready=bool(identity and identity.startswith('/root/') and
                         secure(Path(identity)))
          pin_ready=bool(node_pin and node_pin.startswith('/root/') and
                         secure(Path(node_pin)))
          print('FI_AWG_CTRL_SYSTEMD_UNIT_READY='+str(secure(unit)).lower())
          print('FI_AWG_CTRL_SIGNER_READY='+str(secure(signer)).lower())
          print('FI_AWG_CTRL_FI_HOST_PIN_READY='+str(secure(hostpin)).lower())
          print('FI_AWG_CTRL_WORKER_SOURCE_READY='+str(worker.is_file()).lower())
          print('FI_AWG_CTRL_WORKER_ACTIVE='+str(active).lower())
          print('FI_AWG_CTRL_ENV_READY='+str(secure(awg_env)).lower())
          print('FI_AWG_CTRL_SSH_IDENTITY_READY='+str(key_ready).lower())
          print('FI_AWG_CTRL_SSH_PIN_READY='+str(pin_ready).lower())
          print('FI_AWG_CTRL_APPROVAL_READY='+str(secure(approval)).lower())
          print('FI_AWG_CTRL_CANONICAL_DB_URI_STATUS='+db_status)
          PY
          # Register FI217's immutable staged AWG server identity after
          # successful real RU->FI signed roundtrip. This is deliberately
          # NOT a verification of current external egress: no clients.
          export SSHPASS="$FI_SSH_PASSWORD"
          sshpass -e scp -F "$work/fi-ssh-config" \
            nodekit/fi_awg_node_pool_stage.py "fi-node:$remote_dir/"
          remote "python3 '$remote_dir/fi_awg_node_pool_stage.py' --mode export-fi" > "$work/fi-pool.json"
          chmod 0600 "$work/fi-pool.json"
          python3 - "$work/fi-pool.json" <<'PYPOOL'
          import base64,json,pathlib,re,sys
          p=pathlib.Path(sys.argv[1])
          x=json.loads(p.read_text())
          assert set(x)=={'node_id','endpoint_host','server_public_key','subnet_cidr','listen_port','state'}
          assert (x['node_id'],x['endpoint_host'],x['subnet_cidr'],x['listen_port'],x['state'])==(
              'fi-test-01','fi.mnebyvpn.site','10.73.91.0/24',51821,'staged')
          value=x['server_public_key']
          assert re.fullmatch(r'[A-Za-z0-9+/]{43}=',value)
          raw=base64.b64decode(value,validate=True)
          assert len(raw)==32 and base64.b64encode(raw).decode()==value
          print('FI_AWG_STAGED_PUBLIC_IDENTITY=VERIFIED;CLIENTS=false')
          PYPOOL
          export SSHPASS="$RU_SSH_PASSWORD"
          ru_pool_dir=$(sshpass -e ssh -T -F "$work/ru-ssh-config" ru-controller \
            'umask 077; mktemp -d /run/fi-awg-pool.XXXXXXXX')
          [[ "$ru_pool_dir" =~ ^/run/fi-awg-pool\.[A-Za-z0-9]{8}$ ]] || exit 2
          sshpass -e scp -F "$work/ru-ssh-config" \
            nodekit/fi_awg_node_pool_stage.py nodekit/fi_awg_signed_canary.py \
            nodekit/fi_awg_worker_source_stage.py "$work/fi-pool.json" \
            "ru-controller:$ru_pool_dir/"
          sshpass -e ssh -T -F "$work/ru-ssh-config" ru-controller \
            "python3 '$ru_pool_dir/fi_awg_node_pool_stage.py' --mode stage-ru --material '$ru_pool_dir/fi-pool.json'"
          # Repeated installer action must not change previously verified rows
          # or silently widen release flags and subscriptions.
          sshpass -e ssh -T -F "$work/ru-ssh-config" ru-controller \
            "python3 '$ru_pool_dir/fi_awg_node_pool_stage.py' --mode stage-ru --material '$ru_pool_dir/fi-pool.json'"
          export SSHPASS="$FI_SSH_PASSWORD"
          echo 'FI_AWG_CLIENT_RELEASE_UNCHANGED=true;CANARY_PEERS_INSTALLED=false'
