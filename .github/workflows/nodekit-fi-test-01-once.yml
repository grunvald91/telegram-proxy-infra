# One-shot operator-approved dispatcher for isolated NEW VPS only.
# No SSH secrets are used by this workflow. The target Nodekit workflow
# enforces its own host allowlist and excludes production addresses.
name: Nodekit FI test preflight dispatcher (isolated branch)
on:
  push:
    branches:
      - nodekit-fi-test-01-20261117
    paths:
      - .github/workflows/nodekit-fi-test-01-once.yml
permissions:
  contents: read
  actions: write
jobs:
  dispatch-preflight:
    if: github.repository == 'grunvald91/telegram-proxy-infra'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Dispatch preflight on approved new VPS
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api --method POST \
            repos/grunvald91/telegram-proxy-infra/actions/workflows/nodekit-prepare-new-vps.yml/dispatches \
            -f ref=main \
            -f "inputs[host]=217.11.167.91" \
            -f "inputs[node_id]=fi-test-01" \
            -f "inputs[advertise_host]=fi-test.mnebyvpn.site" \
            -f "inputs[mode]=preflight"
