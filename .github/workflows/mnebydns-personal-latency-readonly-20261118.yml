name: MNEBYDNS personal DoT latency read-only v1
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/mnebydns-personal-latency-readonly-20261118.yml'
      - 'scripts/mnebydns-personal-latency-readonly-20261118.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/mnebydns-personal-latency-readonly-20261118.yml'
      - 'scripts/mnebydns-personal-latency-readonly-20261118.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mnebydns-personal-latency-readonly
  cancel-in-progress: true
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify bounded read-only synthetic probe
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/mnebydns-personal-latency-readonly-20261118.py
          python3 scripts/mnebydns-personal-latency-readonly-20261118.py --vantage runner --self-test
          ! grep -E 'systemctl (restart|stop|start)|iptables|nft add|docker (run|restart|exec)' scripts/mnebydns-personal-latency-readonly-20261118.py
  sample:
    needs: offline
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      RU_PASS: ${{ secrets.SERVER188_SSH_PASSWORD }}
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: External personal DoT TLS and unknown-identity denial
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/mnebydns-personal-latency-readonly-20261118.py --vantage runner
      - name: Existing read-only SSH for personal ingress and private endpoint
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s ops/mnebydns-owner-ssh-known_hosts
          test -n "$RU_PASS" && test -n "$DE_PASS"
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -qq -y sshpass >/dev/null
          for role in ru de; do
            if [[ "$role" == ru ]]; then export SSHPASS="$RU_PASS"; host=188.120.254.223
            else export SSHPASS="$DE_PASS"; host=89.125.90.101; fi
            sshpass -e ssh -T -o ConnectTimeout=12 \
              -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 \
              -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts" \
              -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR \
              "root@$host" "python3 - --vantage $role" \
              < scripts/mnebydns-personal-latency-readonly-20261118.py
          done
