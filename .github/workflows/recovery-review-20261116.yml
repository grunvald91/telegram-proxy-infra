name: VPN DNS proxy consolidated recovery review read-only
# Completed one-shot; no automatic rerun on future edits.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mnebyvpn-recovery-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
      RU_PASS: ${{ secrets.SERVER188_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read bounded live evidence without configuration changes
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/recovery-review-20261116.py
          if ! command -v sshpass >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass >/dev/null
          fi
          opts=(-T -o ConnectTimeout=10 -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts" -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR)
          mkdir output
          SSHPASS="$DE_PASS" sshpass -e ssh "${opts[@]}" root@89.125.90.101 'python3 -B - DE' < scripts/recovery-review-20261116.py > output/DE.json
          SSHPASS="$RU_PASS" sshpass -e ssh "${opts[@]}" root@188.120.254.223 'python3 -B - RU' < scripts/recovery-review-20261116.py > output/RU.json
          python3 - <<'PY'
          import json,pathlib
          for p in pathlib.Path('output').glob('*.json'):
              d=json.loads(p.read_text());assert d['done']
              print(d['role'],d['utc'],'services='+str(len(d['services'])))
          print('PRODUCTION_CONFIG_MUTATIONS=false')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-review-sanitized
          path: output/*.json
          retention-days: 3
          if-no-files-found: error
