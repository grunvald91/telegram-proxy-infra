name: MNEBYDNS guarded two ChatGPT exact premium mappings on existing DNS route
on:
  push:
    branches: [fix/mnebydns-chatgpt-premium-mapping-20261114]
    paths:
      - 'scripts/mnebydns-chatgpt-exact-route-remediate-20261114.py'
      - '.github/workflows/mnebydns-chatgpt-exact-route-fix-20261114.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mnebydns-production-legacy-core-route-two-chatgpt-20261114
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RU_PASS: ${{ secrets.SERVER188_SSH_PASSWORD }}
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Offline guarded renderer and script validation
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/mnebydns-chatgpt-exact-route-remediate-20261114.py
          python3 scripts/mnebydns-chatgpt-exact-route-remediate-20261114.py self-test
          bash -n scripts/mnebydns-owner-domain-stage-20261110.sh
          bash -n scripts/mnebydns-owner-domain-confirm-20261110.sh
          bash -n scripts/mnebydns-owner-domain-rollback-20261110.sh
          bash -n scripts/mnebydns-dot-config-change-20261111.sh
          test -s ops/mnebydns-owner-ssh-known_hosts
          test -n "$RU_PASS" && test -n "$DE_PASS"
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass >/dev/null
          echo 'EXACT_CHATGPT_TWO_OFFLINE_CHECKS=PASS'
      - name: Guarded incremental CoreDNS and SNI mapping, with automatic rollback per domain
        id: apply
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/mnebydns-chatgpt-exact-route-remediate-20261114.py deploy
      - name: Confirm live personal policy still includes both domains, same 60s cache, and original endpoint
        shell: bash
        run: |
          set -Eeuo pipefail
          export SSHPASS="$RU_PASS"
          sshpass -e ssh -T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts" -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR root@188.120.254.223 'python3 -' <<'PY'
          import subprocess,pathlib,json
          name='mnebydns-personal-dot-private'
          report=json.loads(subprocess.check_output(['docker','inspect',name],text=True))[0]
          assert report['State']['Running']
          env=dict(x.split('=',1) for x in report['Config']['Env'] if '=' in x)
          assert env['MNEBYDNS_PERSONAL_DOT_PORT']=='8856'
          assert env['MNEBYDNS_PERSONAL_MAPPED_DOT_PORT']=='1853'
          policy=json.loads(pathlib.Path('/etc/mnebydns/personal-dot/policy-chatgpt-two-20261114.json').read_text())
          assert 'chatgpt.com' in policy and 'auth.openai.com' in policy and len(policy)==153
          overlay=[m for m in report['Mounts'] if m['Destination'].endswith('/personal-dot-listener.ts')]
          assert len(overlay)==1 and not overlay[0]['RW']
          assert 'const AUTH_RECHECK_MS=60000;' in pathlib.Path(overlay[0]['Source']).read_text()
          print('EXISTING_PERSONAL_DNS_AND_CACHE_UNCHANGED=PASS',flush=True)
          print('PERSONAL_BOTH_CHATGPT_NAMES_PRESENT=true',flush=True)
          PY
          echo 'Both previously missing premium ChatGPT names now have verified foreign CoreDNS A mapping and HTTPS SNI upstream. Existing personalized address, 60s auth cache, query billing, legacy hostname and unrelated DNS rules untouched.' >> "$GITHUB_STEP_SUMMARY"
