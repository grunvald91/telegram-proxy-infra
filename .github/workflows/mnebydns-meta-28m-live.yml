name: MNEBYDNS Meta PCAP six SNI 28-minute protected canary
on:
  push:
    branches: [diagnostics/mnebydns-meta-ingress-matrix-20261109]
    paths: [.github/workflows/mnebydns-meta-28m-live.yml]
permissions:
  contents: read
concurrency:
  group: mnebydns-google-public-443-change
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
      RU_PASS: ${{ secrets.SERVER188_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: grunvald91/Mnebyvpn
          ref: 0dbe6e4e35c2923228c250bf6cfc870ce71198d6
          path: vpn
          persist-credentials: false
      - name: Deploy guarded RU and DE Meta ingress, validate, auto-restore after 28 minutes
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$DE_PASS" && test -n "$RU_PASS"
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
          bash -n scripts/mnebydns-meta-de-stage.sh
          bash -n scripts/mnebydns-meta-de-activate.sh
          bash -n scripts/mnebydns-meta-de-rollback.sh
          bash -n scripts/mnebydns-meta-ru-deploy.sh
          bash -n scripts/mnebydns-meta-ru-rollback.sh
          python3 scripts/mnebydns-meta-overlay.py self-test
          sudo apt-get update -qq
          sudo apt-get install -qq -y sshpass
          id="$GITHUB_RUN_ID"
          deadline="$(date -u -d '+28 minutes' +'%Y-%m-%d %H:%M:%S UTC')"
          dework="/tmp/mnebydns-meta-de-$id"
          ruwork="/tmp/mnebydns-meta-ru-$id"
          debase="/opt/mnebydns-experiment-backups/$id"
          rubase="/opt/mnebydns-meta-ru-backups/$id"
          de_ssh() {
            SSHPASS="$DE_PASS" sshpass -e ssh -o ConnectTimeout=12 -o LogLevel=ERROR -o StrictHostKeyChecking=accept-new root@89.125.90.101 "$@"
          }
          ru_ssh() {
            SSHPASS="$RU_PASS" sshpass -e ssh -o ConnectTimeout=12 -o LogLevel=ERROR -o StrictHostKeyChecking=accept-new root@188.120.254.223 "$@"
          }
          abort() {
            rc=$?
            trap - EXIT
            if [ "$rc" -ne 0 ]; then
              echo "live_Meta_canary_failed_starting_scoped_rollback=true"
              ru_ssh "test ! -s '$rubase/rollback.sh' || bash '$rubase/rollback.sh' '$rubase'" || echo "RU_rollback_NOT_CONFIRMED=true"
              de_ssh "test ! -s '$debase/rollback.sh' || bash '$debase/rollback.sh' '$debase'" || echo "DE_rollback_NOT_CONFIRMED=true"
            fi
            exit "$rc"
          }
          trap abort EXIT
          echo "shared_Meta_canary_deadline_UTC=$deadline"
          de_ssh "test ! -e '$dework' && mkdir -m 700 '$dework'"
          tar -czf - -C scripts mnebydns-meta-overlay.py mnebydns-four-google-canary.py mnebydns-meta-de-stage.sh mnebydns-meta-de-activate.sh mnebydns-meta-de-rollback.sh |
            de_ssh "tar -xzf - -C '$dework'"
          de_ssh "bash '$dework/mnebydns-meta-de-stage.sh' '$dework' '$deadline'"
          ru_ssh 'python3 -' <<'PY'
          import socket,ssl,concurrent.futures
          names=('instagram.com','www.instagram.com','i.instagram.com','graph.instagram.com',
                 'edge-mqtt.facebook.com','threads.com','threads.net','graph.threads.net',
                 'iglite-z.instagram.com','test-gateway.instagram.com',
                 'z-m-gateway.facebook.com','graph.facebook.com')
          def check(name):
              try:
                  with socket.create_connection(('10.66.77.1',19443),timeout=7) as sock:
                      sock.settimeout(7)
                      with ssl.create_default_context().wrap_socket(sock,server_hostname=name):
                          return name,True
              except Exception:return name,False
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              results=list(pool.map(check,names))
          for name,ok in results:print('RU_to_private_DE_Meta_TLS_'+name+'='+str(ok).lower(),flush=True)
          if not all(ok for _,ok in results):raise SystemExit('private Meta TLS not ready')
          print('DE_private_Meta_12_of_12=PASS',flush=True)
          PY
          ru_ssh "test ! -e '$ruwork' && mkdir -m 700 '$ruwork'"
          tar -czf - -C scripts mnebydns-meta-ru-deploy.sh mnebydns-meta-ru-rollback.sh |
            ru_ssh "tar -xzf - -C '$ruwork'"
          ru_ssh "bash '$ruwork/mnebydns-meta-ru-deploy.sh' '$ruwork' '$deadline'"
          ru_ssh 'python3 -' <<'PY'
          import socket,ssl,concurrent.futures
          hosts=('instagram.com','www.instagram.com','i.instagram.com','graph.instagram.com',
                 'edge-mqtt.facebook.com','threads.com','threads.net','graph.threads.net',
                 'iglite-z.instagram.com','test-gateway.instagram.com',
                 'z-m-gateway.facebook.com','graph.facebook.com')
          def check(host):
              try:
                  with socket.create_connection(('127.0.0.1',443),timeout=7) as s:
                      s.settimeout(7)
                      with ssl.create_default_context().wrap_socket(s,server_hostname=host):
                          return host,True
              except Exception:return host,False
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              rows=list(pool.map(check,hosts))
          for host,ok in rows:print('RU_local443_Meta_certificate_'+host+'='+str(ok).lower(),flush=True)
          if not all(ok for _,ok in rows):raise SystemExit('RU Meta public ingress test failed')
          print('RU_to_DE_public_ingress_TLS_12_of_12=PASS',flush=True)
          PY
          de_ssh "bash '$dework/mnebydns-meta-de-activate.sh' '$debase'"
          # The GitHub runner cannot probe public 853: certificate-validated
          # DNS-over-TLS is checked on the German server without changing it.
          de_ssh "cat > '$dework/dot-probe.py'" < vpn/ops/smart-dns-poc/probe-gemini-canary.py
          de_ssh "python3 - '$dework/dot-probe.py'" <<'PY'
          import importlib.util,pathlib,socket,sys,concurrent.futures
          f=pathlib.Path(sys.argv[1])
          spec=importlib.util.spec_from_file_location('dot',f)
          assert spec and spec.loader
          dot=importlib.util.module_from_spec(spec);spec.loader.exec_module(dot)
          DE='89.125.90.101';RU='188.120.254.223'
          meta=('instagram.com','www.instagram.com','i.instagram.com',
                'graph.instagram.com','edge-mqtt.facebook.com','threads.com',
                'threads.net','graph.threads.net','iglite-z.instagram.com',
                'test-gateway.instagram.com','z-m-gateway.facebook.com',
                'graph.facebook.com')
          stable=('chatgpt.com','gemini.google.com','claude.ai','grok.com',
                  'x.com','www.tiktok.com')
          cases=[(h,RU) for h in meta]+[(h,DE) for h in stable]
          def probe(item):
              h,expected=item
              try:
                  code,_,rr=dot.query(h,1,DE,853,'dns.mnebyvpn.site',None)
                  ips=[socket.inet_ntoa(v) for typ,ttl,v in rr if typ==1]
                  return h,code==0 and ips==[expected],ips
              except Exception as e:return h,False,[type(e).__name__]
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as pool:
              rows=list(pool.map(probe,cases))
          for h,ok,ips in rows:
              print('Meta_PCAP_DoT_'+h+'='+str(ok).lower()+' answer='+','.join(ips),flush=True)
          if not all(ok for _,ok,_ in rows):
              raise SystemExit('DoT regression or unverified PCAP Meta routes')
          for h in ('api.telegram.org','t.me'):
              try:
                  code,_,rr=dot.query(h,1,DE,853,'dns.mnebyvpn.site',None)
                  ips=[socket.inet_ntoa(v) for typ,ttl,v in rr if typ==1]
                  if DE in ips or RU in ips:raise SystemExit('Telegram route modified')
                  print('Telegram_still_unrewritten_'+h+'=true',flush=True)
              except (OSError,TimeoutError) as e:
                  print('Telegram_external_resolver_unavailable_'+h+'='+type(e).__name__,flush=True)
          for h in ('instagram.com','threads.com'):
              for kind in (28,64,65):
                  code,_,rr=dot.query(h,kind,DE,853,'dns.mnebyvpn.site',None)
                  if code!=0 or any(typ==1 for typ,ttl,v in rr):
                      raise SystemExit('Meta alternative-RR regression '+h)
          print('Meta_PCAP_12_plus_stable_6_verified_DNS=PASS',flush=True)
          PY
          de_ssh "systemctl is-active --quiet 'mnebydns-meta-de-watchdog-$id.timer' && echo DE_rollback_armed=true"
          ru_ssh "systemctl is-active --quiet 'mnebydns-meta-ru-watchdog-$id.timer' && echo RU_rollback_armed=true"
          echo "Meta_QUIC_UDP443_not_in_this_TCP_pilot=true"
          echo "Meta_Instagram_Threads_public_test_ACTIVE_UNTIL=$deadline"
          echo "Meta_android_application_NOT_YET_TESTED=true"
          echo "persistent_rollback_on_both_servers_armed=true"
          trap - EXIT
