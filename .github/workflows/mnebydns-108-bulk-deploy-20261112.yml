name: MNEBYDNS one-time guarded 108 research bulk deployment
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - ".github/workflows/mnebydns-108-bulk-deploy-20261112.yml"
      - "scripts/mnebydns-108-bulk-*.sh"
      - "scripts/mnebydns-108-bulk-deploy-20261112.py"
      - "data/mnebydns-bulk-108-mode-20261112.txt"
  push:
    branches: [main]
    paths:
      - ".github/workflows/mnebydns-108-bulk-deploy-20261112.yml"
      - "scripts/mnebydns-108-bulk-*.sh"
      - "scripts/mnebydns-108-bulk-deploy-20261112.py"
      - "data/mnebydns-bulk-108-mode-20261112.txt"
  workflow_dispatch:
    inputs:
      mode:
        description: "plan (read-only) or deploy (single guarded 60min rollback)"
        type: choice
        options: [plan, deploy]
        default: plan
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('mnebydns-bulk-deploy-offline-{0}',github.ref) || 'mnebydns-google-public-443-change' }}
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Syntax, rollback, exact-host and atomic database smoke tests
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/mnebydns-108-bulk-prepare-20261112.py scripts/mnebydns-108-bulk-deploy-20261112.py
          python3 scripts/mnebydns-108-bulk-prepare-20261112.py self-test
          python3 scripts/mnebydns-108-bulk-deploy-20261112.py self-test
          bash -n scripts/mnebydns-108-bulk-stage-20261112.sh
          bash -n scripts/mnebydns-108-bulk-compensate-20261112.sh
          bash -n scripts/mnebydns-108-bulk-rollback-20261112.sh
          python3 scripts/mnebydns-owner-domain-render-20261110.py self-test
          python3 scripts/mnebydns-batch-108-canary-20261112.py self-test
          test "$(grep -c ' ssh-ed25519 ' ops/mnebydns-owner-ssh-known_hosts)" -eq 2
          test "$(cat data/mnebydns-bulk-108-mode-20261112.txt)" = plan || test "$(cat data/mnebydns-bulk-108-mode-20261112.txt)" = deploy-once-20261112-r3
          echo MNEBYDNS_BULK_OFFLINE_TESTS=PASS
      - name: Exercise atomic 99-host-style SQL CAS on disposable PostgreSQL
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run -d --rm --name mnebydns-bulk-pg -e POSTGRES_PASSWORD=localtest -p 127.0.0.1:54329:5432 postgres:16-alpine >/dev/null
          trap 'docker rm -f mnebydns-bulk-pg >/dev/null 2>&1 || true' EXIT
          # The official PostgreSQL container briefly starts a temporary
          # init server before restarting its final instance. pg_isready can
          # falsely succeed in that gap. Require two stable real SQL queries.
          ready=0
          for attempt in $(seq 1 90); do
            if docker exec mnebydns-bulk-pg psql -XqAt -v ON_ERROR_STOP=1 -U postgres -c 'SELECT 1' 2>/dev/null | grep -qx 1; then
              sleep 2
              if docker exec mnebydns-bulk-pg psql -XqAt -v ON_ERROR_STOP=1 -U postgres -c 'SELECT 1' 2>/dev/null | grep -qx 1; then
                ready=1
                break
              fi
            fi
            sleep .5
          done
          test "$ready" -eq 1
          docker exec -i mnebydns-bulk-pg psql -Xq -v ON_ERROR_STOP=1 -U postgres <<'SQL'
          CREATE TABLE dns_admin_domains (
            domain text PRIMARY KEY, product text NOT NULL,
            status text NOT NULL, revision bigint NOT NULL DEFAULT 1,
            updated_at timestamptz, applied_at timestamptz,
            confirmed_at timestamptz, verified_origin_ip inet,
            last_error_code text, canary_run_id bigint,
            canary_expires_at timestamptz
          );
          INSERT INTO dns_admin_domains(domain,product,status) VALUES
            ('alpha.example.com','Research 2026-11','PENDING'),
            ('beta.example.com','Research 2026-11','PENDING'),
            ('oracle.example.com','Oracle','PENDING');
          SQL
          python3 - <<'PY' > /tmp/mnebydns-bulk-cas.sql
          import importlib.util
          p='scripts/mnebydns-108-bulk-deploy-20261112.py'
          spec=importlib.util.spec_from_file_location('bulk',p)
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          print(module.bulk_sql([
            {'domain':'alpha.example.com','ip':'93.184.215.14'},
            {'domain':'beta.example.com','ip':'104.18.0.1'}
          ]))
          PY
          docker exec -i mnebydns-bulk-pg psql -Xq -v ON_ERROR_STOP=1 -U postgres < /tmp/mnebydns-bulk-cas.sql
          result="$(docker exec mnebydns-bulk-pg psql -XqAt -v ON_ERROR_STOP=1 -U postgres -c "SELECT status||':'||count(*) FROM dns_admin_domains GROUP BY status ORDER BY status")"
          grep -qx 'ACTIVE:2' <<< "$result"
          grep -qx 'PENDING:1' <<< "$result"
          if docker exec -i mnebydns-bulk-pg psql -Xq -v ON_ERROR_STOP=1 -U postgres < /tmp/mnebydns-bulk-cas.sql >/dev/null 2>&1; then
            echo 'Second compare-and-swap unexpectedly succeeded' >&2
            exit 1
          fi
          echo MNEBYDNS_BULK_ATOMIC_DB_CAS_TEST=PASS
  guarded:
    if: github.event_name != 'pull_request'
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 42
    env:
      RU_PASS: ${{ secrets.SERVER188_SSH_PASSWORD }}
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
      DISPATCH_MODE: ${{ github.event.inputs.mode }}
      HEAD_COMMIT_TITLE: ${{ github.event.head_commit.message }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve explicit one-time rollout gate
        shell: bash
        run: |
          set -Eeuo pipefail
          mode=plan
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "${DISPATCH_MODE:-plan}" == deploy ]]; then
            mode=deploy
          elif [[ "$GITHUB_EVENT_NAME" == push &&
                  "$HEAD_COMMIT_TITLE" == "deploy(MNEBYDNS): one-time 108 exact-host bulk" &&
                  "$(cat data/mnebydns-bulk-108-mode-20261112.txt)" == deploy-once-20261112-r3 ]]; then
            mode=deploy
          fi
          [[ "$mode" =~ ^(plan|deploy)$ ]]
          echo "BULK_MODE=$mode" >> "$GITHUB_ENV"
          echo "MNEBYDNS_BULK_MODE=$mode"
      - name: Verify authorized pinned SSH credentials and dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$RU_PASS" && test -n "$DE_PASS"
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sshpass >/dev/null
      - name: LIVE preflight existing DoT and route checkpoint
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/mnebydns-batch-108-live-status-20261112.py inspect
      - name: Fresh strict RU and DE 108 exact-host HTTP scan
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/mnebydns-108-mass-readonly-20261112.py --run
      - name: Build complete additive DNS and Nginx pilot in memory
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/mnebydns-108-bulk-prepare-20261112.py plan
      - name: Guarded staged mass apply and per-host verification, only on signed one-time gate
        if: env.BULK_MODE == 'deploy'
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/mnebydns-108-bulk-deploy-20261112.py deploy
      - name: Confirm current live status after successful bulk apply
        if: env.BULK_MODE == 'deploy' && success()
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/mnebydns-batch-108-live-status-20261112.py inspect
      - name: Preserve exact audit result
        if: always()
        shell: bash
        run: |
          {
            echo "## MNEBYDNS one-time bulk routing"
            echo "Mode: ${BULK_MODE:-unresolved}"
            if [ -f bulk-108-work/report.md ]; then cat bulk-108-work/report.md; fi
            if [ -f bulk-108-work/deploy-events.jsonl ]; then tail -n 40 bulk-108-work/deploy-events.jsonl; fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload non-secret per-host plan and deployment statuses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mnebydns-bulk-108-result-${{ github.run_id }}
          path: |
            bulk-108-work/plan.json
            bulk-108-work/report.md
            bulk-108-work/deploy-events.jsonl
            mass-108-results/report.md
            mnebydns-108-live-status/report.md
          if-no-files-found: warn
          retention-days: 30
