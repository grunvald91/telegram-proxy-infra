name: Fix Telegram fastpath RU 10443 to foreign SNI 443
on:
  push:
    branches: [fix/telegram-fastpath-wg443-20261112]
    paths:
      - '.github/workflows/telegram-fastpath-wg443-repair-20261112.yml'
permissions:
  contents: read
concurrency:
  group: telegram-fastpath-live-20261112
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      RU_PASS: ${{ secrets.SERVER188_SSH_PASSWORD }}
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate repair script and transport
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n scripts/repair-telegram-10443-fastpath-20261112.sh
          grep -Fq 'proxy_pass 10.66.77.1:9470;' scripts/repair-telegram-10443-fastpath-20261112.sh
          test -n "$RU_PASS" && test -n "$DE_PASS"
          test -s ops/mnebydns-owner-ssh-known_hosts
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass >/dev/null
      - name: Verify active foreign SNI map and Telemt port without writes
        shell: bash
        run: |
          set -Eeuo pipefail
          export SSHPASS="$DE_PASS"
          sshpass -e ssh -o ConnectTimeout=10 -o ServerAliveInterval=5 -o ServerAliveCountMax=1 -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts" -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR root@89.125.90.101 'python3 -' <<'PY'
          import socket,subprocess,re
          def call(args):
              return subprocess.run(args,timeout=10,capture_output=True,text=True)
          assert call(['systemctl','is-active','nginx']).stdout.strip()=='active','de_nginx_inactive'
          assert call(['nginx','-t']).returncode==0,'de_nginx_invalid'
          n=call(['nginx','-T'])
          assert n.returncode==0,'de_nginx_unreadable'
          assert len(re.findall(r'(?m)^\s*media\.bandbook\.site\s+127\.0\.0\.1:9470\s*;',n.stdout))==1,'de_media_sni_map_not_exact'
          assert 'ssl_preread on;' in n.stdout,'de_ssl_preread_missing'
          ss=call(['ss','-lntH']).stdout
          assert re.search(r'127\.0\.0\.1:9470\s',ss),'de_telemt_port_absent'
          assert re.search(r'(?:0\.0\.0\.0|\*):443\s',ss),'de_nginx_443_listener_absent'
          for host,port in [('127.0.0.1',9470),('127.0.0.1',443)]:
              with socket.create_connection((host,port),timeout=3):pass
          print('foreign_preflight=PASS media.bandbook.site -> 127.0.0.1:9470 through nginx:443',flush=True)
          PY
      - name: Apply exact RU fastpath fix with on-host rollback
        shell: bash
        run: |
          set -Eeuo pipefail
          export SSHPASS="$RU_PASS"
          sshpass -e ssh -o ConnectTimeout=10 -o ServerAliveInterval=5 -o ServerAliveCountMax=1 -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts" -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR root@188.120.254.223 'bash -s' < scripts/repair-telegram-10443-fastpath-20261112.sh
      - name: Sample alternative public ports without interpreting GitHub runner 443 as universal outage
        shell: bash
        run: |
          python3 - <<'PY'
          import socket
          for host,ports in [('188.120.254.223',(8443,2052,2086,8089)),('89.125.90.101',(853,9446))]:
              for port in ports:
                  try:
                      with socket.create_connection((host,port),timeout=4): result='open'
                  except Exception as exc: result=type(exc).__name__
                  print('external_port '+host+':'+str(port)+'='+result,flush=True)
          print('real_telegram_client_E2E=unverified',flush=True)
          PY
