name: MNEBYDNS Instagram real-443 SNI fragment experiment offline validation
on:
  push:
    branches:
      - experiment/instagram-synack-window-canary-20261110
    paths:
      - '.github/workflows/mnebydns-instagram-sni-443-frag-offline.yml'
      - 'scripts/mnebydns_ig_sni_443_fragment_worker.py'
      - 'scripts/mnebydns_ig_sni_443_field_canary.py'
      - 'scripts/tests/test_mnebydns_ig_sni_443_fragment_worker.py'
      - 'scripts/tests/test_mnebydns_ig_sni_443_field_canary.py'
      - 'scripts/tests/integration_mnebydns_ig_sni_443_firewall_netns.sh'
  pull_request:
    paths:
      - '.github/workflows/mnebydns-instagram-sni-443-frag-offline.yml'
      - 'scripts/mnebydns_ig_sni_443_fragment_worker.py'
      - 'scripts/mnebydns_ig_sni_443_field_canary.py'
      - 'scripts/tests/test_mnebydns_ig_sni_443_fragment_worker.py'
      - 'scripts/tests/test_mnebydns_ig_sni_443_field_canary.py'
      - 'scripts/tests/integration_mnebydns_ig_sni_443_firewall_netns.sh'
permissions:
  contents: read
jobs:
  readonly-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check exact-peer HTTPS443 NFQUEUE canary syntax
        run: |
          set -Eeuo pipefail
          python3 -m py_compile \
            scripts/mnebydns_ig_sni_443_fragment_worker.py \
            scripts/mnebydns_ig_sni_443_field_canary.py \
            scripts/mnebydns_nfq_failopen.py
      - name: Assert immutable TLS, packet filtering, watchdog and scoped rollback
        run: |
          set -Eeuo pipefail
          python3 -m unittest discover -s scripts/tests -p 'test_mnebydns_ig_sni_443*.py' -v
          echo 'ig443_offline_scope_and_rollback=PASS'
      - name: Confirm original isolated 18443 experiment still passes
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_mnebydns_synack_window_canary.py' -v
          echo 'original_18443_regression=PASS'
  kernel-netns-firewall:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare isolated kernel test tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq iproute2 nftables iptables
      - name: Test exact Android TCP443 nft and iptables rules in disposable namespace
        run: sudo bash scripts/tests/integration_mnebydns_ig_sni_443_firewall_netns.sh
