name: MNEBYDNS Instagram Lite offline exact host route tests
on:
  push:
    branches: [audit/mnebydns-instagram-lite-20261111]
    paths:
      - '.github/workflows/mnebydns-instagram-lite-offline-20261111.yml'
      - 'scripts/mnebydns_iglite_route_render_20261111.py'
      - 'scripts/mnebydns_iglite_de_temp_route.py'
      - 'scripts/mnebydns_iglite_dns_wire_checks.py'
      - 'scripts/tests/test_mnebydns_iglite_dns_wire_checks.py'
      - 'scripts/tests/mnebydns_ig_de_nft_netns_probe.py'
      - 'scripts/tests/integration_mnebydns_ig_de_nft_win4_netns.sh'
      - 'scripts/tests/test_mnebydns_iglite_route_preview.py'
      - 'scripts/mnebydns_iglite_wifi_multi_meta_v8_review.py'
      - 'scripts/mnebydns_iglite_wifi_multi_meta_v9_sni.py'
      - 'scripts/mnebydns_iglite_sni_observer.py'
      - 'scripts/mnebydns_iglite_wifi_readiness_helpers.py'
      - 'scripts/tests/test_mnebydns_iglite_wifi_readiness_helpers.py'
      - 'scripts/tests/test_mnebydns_iglite_sni_observer.py'
      - 'scripts/tests/test_mnebydns_iglite_wifi_multi_meta_review.py'
      - 'scripts/tests/integration_mnebydns_iglite_nginx_core_regex.sh'
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate exact host, immutable other routes and reversible rendering
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/mnebydns_iglite_route_render_20261111.py
          python3 -m py_compile scripts/mnebydns_iglite_de_temp_route.py
          python3 -m py_compile scripts/mnebydns_iglite_wifi_multi_meta_v8_review.py
          python3 -m py_compile scripts/mnebydns_iglite_wifi_multi_meta_v9_sni.py scripts/mnebydns_iglite_sni_observer.py
          python3 -m unittest discover -s scripts/tests -p 'test_mnebydns_iglite_sni_observer.py' -v
          python3 -m py_compile scripts/mnebydns_iglite_wifi_readiness_helpers.py
          python3 -m unittest discover -s scripts/tests -p 'test_mnebydns_iglite_wifi_readiness_helpers.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_mnebydns_iglite_wifi_multi_meta_review.py' -v
          python3 scripts/mnebydns-owner-domain-render-20261110.py self-test
          python3 -m unittest discover -s scripts/tests -p 'test_mnebydns_iglite_route_preview.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_mnebydns_iglite_dns_wire_checks.py' -v
          echo 'iglite_exact_host_offline_gate=PASS_NO_SERVER_CHANGES'
      - name: Prepare real Nginx stream parser (CI runner only)
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq nginx libnginx-mod-stream
      - name: Test Nginx syntax and Go RE2 exact host without touching VPS
        run: bash scripts/tests/integration_mnebydns_iglite_nginx_core_regex.sh
  kernel-nft-window4:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install disposable netns and packet capture tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq iproute2 nftables tcpdump ethtool
      - name: Assert native NFT window4 modifies real SYN-ACK and leaves valid checksum
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/tests/mnebydns_ig_de_nft_netns_probe.py
          sudo bash scripts/tests/integration_mnebydns_ig_de_nft_win4_netns.sh
