name: FI AWG controlled egress installer one-shot
on:
  push:
    branches: [feat/nodekit-awg-egress-service-20261118]
    paths: [.github/workflows/nodekit-fi-awg-egress-once.yml]
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    if: github.repository == 'grunvald91/telegram-proxy-infra'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Inspect inactive AWG network service after deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh api --method POST \
            repos/grunvald91/telegram-proxy-infra/actions/workflows/nodekit-fleet-bootstrap.yml/dispatches \
            -f ref=main \
            -f "inputs[country]=fi" \
            -f "inputs[phase]=inspect"
