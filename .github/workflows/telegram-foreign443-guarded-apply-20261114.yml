name: Telegram foreign 443 verified guarded SYNACK production repair
"on":
  push:
    branches: [diag/telegram-proxy-443-versions-20261114]
    paths: ['.github/workflows/telegram-foreign443-guarded-apply-20261114.yml']
permissions:
  contents: read
concurrency:
  group: telegram-foreign443-guarded-prod-repair
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Offline selftest and SSH identity guards
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/telegram_foreign_synack_permanent_20261114.py
          python3 scripts/telegram_foreign_synack_permanent_20261114.py self-test
          test -n "$DE_PASS" && test -s ops/mnebydns-owner-ssh-known_hosts
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
      - name: Stage on foreign server with independent rollback
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$DE_PASS"
          opts=(-T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts"
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR)
          sshpass -e ssh ${opts[@]} root@89.125.90.101 "python3 - stage '$GITHUB_RUN_ID'" < scripts/telegram_foreign_synack_permanent_20261114.py | tee "$RUNNER_TEMP/stage.log"
          grep -Fq 'SYNACK_PERMANENT_STAGE_APPLIED=true' "$RUNNER_TEMP/stage.log"
          grep -Fq 'SYNACK_ROLLBACK_TIMER_ARMED=true' "$RUNNER_TEMP/stage.log"
          echo 'active=true' >> "$GITHUB_OUTPUT"
      - name: External strict TLS/HTTPS on DE and independent RU/DoT/8443 guards
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import socket,ssl,struct
          for label,ip,port in [('DE8443','89.125.90.101',8443),('RU8443','188.120.254.223',8443),('DE853','89.125.90.101',853)]:
              with socket.create_connection((ip,port),timeout=5):print(label+'=CONNECTED')
          for label,ip,host in [('FOREIGN_WEB','89.125.90.101','cdn.servgo.ru'),('RU_WEB','188.120.254.223','mnebyvpn.site')]:
              with socket.create_connection((ip,443),timeout=6) as raw:
                  raw.settimeout(6)
                  with ssl.create_default_context().wrap_socket(raw,server_hostname=host) as tls:
                      tls.sendall(('GET / HTTP/1.1\r\nHost: '+host+'\r\nConnection: close\r\n\r\n').encode())
                      line=tls.recv(256).split(b'\r\n',1)[0]
                      status=int(line.split()[1])
                      print(label+'_HTTP_STATUS='+str(status))
                      assert status==200,(label,status)
          with socket.create_connection(('89.125.90.101',853),timeout=6) as raw:
              raw.settimeout(6)
              with ssl.create_default_context().wrap_socket(raw,server_hostname='dns.mnebyvpn.site') as tls:
                  query=struct.pack('!HHHHHH',77,0x100,1,0,0,0)+b'\x07example\x03com\x00'+struct.pack('!HH',1,1)
                  tls.sendall(struct.pack('!H',len(query))+query)
                  response=tls.recv(2)
                  assert len(response)==2
                  print('LEGACY_DOT_TLS_AND_RESPONSE_PREFIX=PASS')
          print('FOREIGN_443_AND_PROTECTED_SERVICES=PASS')
          PY
      - name: Persist only after all guards pass
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$DE_PASS"
          opts=(-T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts"
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR)
          sshpass -e ssh ${opts[@]} root@89.125.90.101 "python3 - commit '$GITHUB_RUN_ID'" < scripts/telegram_foreign_synack_permanent_20261114.py | tee "$RUNNER_TEMP/commit.log"
          grep -Fq 'SYNACK_PERMANENT_FIX_COMMITTED=true' "$RUNNER_TEMP/commit.log"
          echo 'TELEGRAM_FOREIGN_SYNACK_443_PRODUCTION_FIXED=true'
      - name: Rollback on failed staged verification
        if: failure() && steps.stage.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$DE_PASS"
          sshpass -e ssh -T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts" -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR root@89.125.90.101 "python3 - rollback '$GITHUB_RUN_ID'" < scripts/telegram_foreign_synack_permanent_20261114.py
