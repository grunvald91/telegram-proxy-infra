name: MNEBYDNS DE89 deeper read-only DNS code review
on:
  push:
    branches: [diag/mnebydns-live-video-stall-20261115]
    paths: [.github/workflows/mnebydns-de89-dns-review-deeper-20261115.yml]
permissions: {contents: read}
jobs:
  examine:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Validate personal SNI Nginx config and CoreDNS duplicate selectors no mutations
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$DE_PASS" && test -s ops/mnebydns-owner-ssh-known_hosts
          python3 -m py_compile scripts/mnebydns-de89-dns-review-deeper-readonly-20261115.py
          sudo apt-get update -qq && sudo apt-get install -qq -y sshpass >/dev/null
          opts=(-T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts" -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR)
          SSHPASS="$DE_PASS" sshpass -e ssh "${opts[@]}" root@89.125.90.101 'python3 -' < scripts/mnebydns-de89-dns-review-deeper-readonly-20261115.py > review.log 2>&1
          grep '^DEEPDNS_' review.log
          grep -q '^DEEPDNS_DONE=true' review.log
