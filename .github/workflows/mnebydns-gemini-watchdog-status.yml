name: MNEBYDNS verify expired rollback watchdog is inactive
on:
  push:
    branches: ['feature/mnebydns-vpn-google-readonly-20261108']
    paths: ['.github/workflows/mnebydns-gemini-watchdog-status.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - name: Read-only old timer and restored services status
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PASS"
          sudo apt-get update -qq
          sudo apt-get install -qq -y sshpass
          export SSHPASS="$PASS"
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=accept-new -o LogLevel=ERROR root@89.125.90.101 'python3 -' <<'PY'
          import subprocess,pathlib,re
          def cmd(args):
              return subprocess.run(args,capture_output=True,text=True,timeout=7)
          timer=cmd(['systemctl','is-active','mnebydns-gemini-watchdog-42461776264.timer'])
          print('prior_rollback_watchdog_active='+str(timer.returncode==0).lower())
          for svc in ['nginx','mnebydns-dot.service','mnebydns-gemini.service']:
              p=cmd(['systemctl','is-active',svc])
              print('service_'+svc.replace('.service','')+'_active='+str(p.returncode==0).lower())
          dns=pathlib.Path('/opt/mnebydns-dot/Corefile').read_text()
          print('gemini_synthetic_A_live='+str('Gemini-only canary' in dns).lower())
          c=pathlib.Path('/etc/nginx/nginx.conf').read_text()
          print('gemini_public_map_live='+str(bool(re.search(r'(?m)^\s*gemini\.google\.com\s+127\.0\.0\.1:15443;',c))).lower())
          print('rollback_state_read_only=yes')
          PY
