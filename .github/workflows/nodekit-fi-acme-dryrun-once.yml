name: FI new VPS ACME HTTP-01 staging-only dry-run
on:
  push:
    branches: [feat/nodekit-fi-acme-20261117]
    paths:
      - .github/workflows/nodekit-fi-acme-dryrun-once.yml
permissions:
  contents: read
jobs:
  acme:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SSHPASS: ${{ secrets.MNEBYVPN_NEW_NODE_SSH_PASSWORD }}
      SSH_USER: ${{ secrets.MNEBYVPN_NEW_NODE_SSH_USER }}
    steps:
      - name: Verify HTTP-01 using Let's Encrypt staging only
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$SSH_USER" == root && -n "$SSHPASS" ]] || exit 2
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          known="$RUNNER_TEMP/mnebyvpn-fi-acme-known"
          : > "$known"
          chmod 600 "$known"
          sshpass -e ssh -T -o PubkeyAuthentication=no \
            -o PreferredAuthentications=password,keyboard-interactive \
            -o NumberOfPasswordPrompts=1 -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile="$known" -o ConnectTimeout=12 \
            root@217.11.167.91 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          [[ "$(hostname -I | tr ' ' '\n' | grep -xc '217.11.167.91' || true)" -ge 1 ]] || {
            echo '::error::Remote host IP mismatch'; exit 2;
          }
          [[ ! -f /etc/letsencrypt/live/fi.mnebyvpn.site/privkey.pem ]] || {
            echo 'Unexpected existing certificate - inspect before proceeding'; exit 2;
          }
          if systemctl is-active --quiet nginx.service; then
            echo 'Refusing ACME while nginx runs'; exit 2;
          fi
          if ! command -v certbot >/dev/null; then
            export DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends certbot >/dev/null
          fi
          logfile="$(mktemp /tmp/mnebyvpn-acme-dryrun.XXXXXXXX)"
          trap 'rm -f "$logfile"' EXIT
          set +e
          timeout 150 certbot certonly --standalone --preferred-challenges http \
            --dry-run -d fi.mnebyvpn.site --cert-name fi.mnebyvpn.site \
            --non-interactive --agree-tos --register-unsafely-without-email \
            --key-type ecdsa >"$logfile" 2>&1
          rc=$?
          set -e
          if [[ $rc -eq 0 ]]; then
            echo 'LE_STAGING_HTTP01=PASS'
          else
            echo 'LE_STAGING_HTTP01=FAIL'
            if grep -Eqi 'Timeout during connect|connection refused|connection timed out|connection failure' "$logfile"; then
              echo 'LE_HTTP01_FAILURE=EXTERNAL_TCP80_UNREACHABLE'
            elif grep -Eqi 'Problem binding|address already in use' "$logfile"; then
              echo 'LE_HTTP01_FAILURE=LOCAL_PORT80_OCCUPIED'
            else
              echo 'LE_HTTP01_FAILURE=OTHER_REQUIRES_REVIEW'
            fi
            exit 3
          fi
          echo 'PRODUCTION_CERTIFICATE_ISSUED=false'
          echo 'DNS_VPN_INGRESS_UNCHANGED=true'
          REMOTE
