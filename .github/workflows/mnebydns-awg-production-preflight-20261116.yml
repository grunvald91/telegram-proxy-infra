name: MNEBYDNS AWG production route preflight sanitized read-only
on:
  push:
    branches: [feat/mnebydns-amneziawg-parallel-20261115]
    paths:
      - '.github/workflows/mnebydns-awg-production-preflight-20261116.yml'
      - 'scripts/mnebydns-awg-production-preflight-20261116.py'
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      RU_PASS: ${{ secrets.SERVER188_SSH_PASSWORD }}
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Guarded read-only architecture capture
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/mnebydns-awg-production-preflight-20261116.py
          test -s ops/mnebydns-owner-ssh-known_hosts
          test -n "$RU_PASS" && test -n "$DE_PASS"
          if ! command -v sshpass >/dev/null; then sudo apt-get update -qq && sudo apt-get -y -qq install sshpass >/dev/null; fi
          opts=(-T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts" -o GlobalKnownHostsFile=/dev/null
            -o UpdateHostKeys=no -o LogLevel=ERROR)
          for role in DE RU; do
            if [[ "$role" == DE ]]; then pass="$DE_PASS"; host=89.125.90.101; else pass="$RU_PASS"; host=188.120.254.223; fi
            SSHPASS="$pass" sshpass -e ssh "${opts[@]}" root@"$host" "python3 -B - $role" <scripts/mnebydns-awg-production-preflight-20261116.py
          done
          echo AWG_PRODUCTION_PREFLIGHT_COMPLETE=true
