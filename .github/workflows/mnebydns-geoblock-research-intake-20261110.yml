name: MNEBYDNS research intake 506 PENDING exact domains only
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - '.github/workflows/mnebydns-geoblock-research-intake-20261110.yml'
      - 'data/mnebydns-geoblock-research-20261110.tsv'
      - 'scripts/mnebydns-geoblock-research-queue-20261110.sql'
  push:
    branches: [main]
    paths:
      - '.github/workflows/mnebydns-geoblock-research-intake-20261110.yml'
      - 'data/mnebydns-geoblock-research-20261110.tsv'
      - 'scripts/mnebydns-geoblock-research-queue-20261110.sql'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mnebydns-research-owner-domain-intake
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate exact host inventory and mutation-free SQL semantics
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import pathlib,re
          file=pathlib.Path('data/mnebydns-geoblock-research-20261110.tsv')
          lines=[line for line in file.read_text().splitlines() if line and not line.startswith('#')]
          assert lines.pop(0)=='domain\\tsections\\tmentions\\tkind\\tstatus'.replace('\\t','\t')
          fields=[line.split('\t') for line in lines]
          assert len(fields)==523 and all(len(row)==5 for row in fields)
          domain_re=re.compile(r'^(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\\.)+[a-z]{2,24}$')
          assert len(set(row[0] for row in fields))==523
          assert all(domain_re.fullmatch(row[0]) and len(row[0])<=253 for row in fields)
          targets=sorted(row[0] for row in fields if row[4]=='PENDING_RESEARCH')
          assert len(targets)==506
          assert sum(row[4]!='PENDING_RESEARCH' for row in fields)==17
          sql=pathlib.Path('scripts/mnebydns-geoblock-research-queue-20261110.sql').read_text()
          hosts=sorted(re.findall(r"^  \\('([^']+)'\\)[,;]$",sql,re.M))
          assert hosts==targets,(len(hosts),len(targets))
          assert sql.count('INSERT INTO dns_admin_domains')==1
          assert 'ON CONFLICT (domain) DO NOTHING' in sql
          assert "'PENDING'" in sql and 'APPLY_REQUESTED' not in sql
          assert not re.search(r'\\b(?:UPDATE|DELETE|TRUNCATE|ALTER|DROP)\\s+dns_admin_domains\\b',sql,re.I)
          assert "research_domain_queue_entries=" in sql
          assert "BEGIN;" in sql and sql.rstrip().endswith('COMMIT;')
          print('research_domain_inventory_validated=523')
          print('research_domain_pending_queue_validated=506')
          print('research_domain_live_routes_changed=false')
          PY
          test "$(grep -c ' ssh-ed25519 ' ops/mnebydns-owner-ssh-known_hosts)" -eq 2
  queue:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      RU_PASS: ${{ secrets.SERVER188_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Persist only missing PENDING hostname requests in canonical RU database
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$RU_PASS"
          sudo apt-get update -qq && sudo apt-get install -qq -y sshpass >/dev/null
          export SSHPASS="$RU_PASS"
          output="$(sshpass -e ssh -T -o ConnectTimeout=12 \\
            -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 \\
            -o UserKnownHostsFile="$GITHUB_WORKSPACE/ops/mnebydns-owner-ssh-known_hosts" \\
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no \\
            -o LogLevel=ERROR root@188.120.254.223 \\
            'docker exec -i mnebyvpn-stage-postgres psql -XqAt -v ON_ERROR_STOP=1 -U mnebyvpn_stage -d mnebyvpn_stage -f -' \\
            < scripts/mnebydns-geoblock-research-queue-20261110.sql)"
          printf '%s\\n' "$output"
          grep -qx 'research_domain_queue_entries=506' <<< "$output"
          grep -q '^research_domain_queue_new_pending=' <<< "$output"
          echo 'research_domain_queue_persisted=true'
          echo 'research_domain_routes_activated=false'
