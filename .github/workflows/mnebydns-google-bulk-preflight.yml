name: MNEBYDNS Google batch production preflight (read only)
on:
  push:
    branches: ['feature/mnebydns-google-bulk-rollout-20261109']
    paths: ['.github/workflows/mnebydns-google-bulk-preflight.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mnebydns-public-route-change
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      SSH_PASSWORD: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Read-only foreign VPS preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$SSH_PASSWORD"
          sudo apt-get update -qq
          sudo apt-get install -qq -y sshpass
          export SSHPASS="$SSH_PASSWORD"
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=accept-new -o LogLevel=ERROR root@89.125.90.101 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          test "$(id -u)" = 0
          test -f /etc/nginx/nginx.conf && test ! -L /etc/nginx/nginx.conf
          test -f /opt/mnebydns-dot/Corefile && test ! -L /opt/mnebydns-dot/Corefile
          test -x /opt/mnebydns-dot/coredns
          for service in nginx mnebydns-dot.service mnebydns-gemini.service mnebydns-ru-access.service xray.service; do
            systemctl is-active --quiet "$service" || { echo "inactive_required_unit=$service"; exit 2; }
            echo "unit_active=$service"
          done
          nginx -t >/dev/null 2>&1
          python3 - <<'PY'
          import pathlib,re,hashlib
          n=pathlib.Path('/etc/nginx/nginx.conf').read_text()
          d=pathlib.Path('/opt/mnebydns-dot/Corefile').read_text()
          assert len(re.findall(r'map\s+\$ssl_preread_server_name\s+\$direct_mtproxy_backend\s*\{',n))==1
          assert n.count('gemini.google.com 127.0.0.1:15443;')==1
          assert d.count('template IN A gemini.google.com {')==1
          for host in ('discord.com','gateway.discord.gg','cdn.discordapp.com'):
            assert n.count(host+' 127.0.0.1:15446;')==1,host
            assert d.count('template IN A '+host+' {')==1,host
          assert '# MNEBYDNS ecosystem-wide Google DNS rewrite' not in d
          assert '127.0.0.1:15449' not in n
          assert '    cache 30\n' in d
          print('nginx_before_sha256='+hashlib.sha256(n.encode()).hexdigest())
          print('dns_before_sha256='+hashlib.sha256(d.encode()).hexdigest())
          print('canonical_gemini_discord_preserved=yes')
          print('broad_google_policy_not_already_enabled=yes')
          PY
          for port in 5354 15449; do
            if ss -H -lntu "sport = :$port" | grep -q .; then
              echo "occupied_new_port=$port"; exit 2
            fi
          done
          ss -H -lnt 'sport = :853' | grep -Fq '89.125.90.101:853'
          ss -H -lnt 'sport = :443' | grep -q ':443'
          available="$(awk '/^MemAvailable:/ {print int($2/1024)}' /proc/meminfo)"
          echo "foreign_available_ram_mib=$available"
          test "$available" -ge 480
          echo 'shared_tls_443_and_dot_853_healthy=yes'
          echo 'new_sidecar_ports_available=yes'
          echo 'read_only_production_preflight=PASS'
          REMOTE
