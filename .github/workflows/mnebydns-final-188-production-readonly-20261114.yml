name: MNEBYDNS unified 188 production post-merge verification (read-only)
on:
  push:
    branches: [audit/mnebydns-unified-ru188-entry-20261114]
    paths: ['.github/workflows/mnebydns-final-188-production-readonly-20261114.yml']
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      RU_PASS: ${{ secrets.SERVER188_SSH_PASSWORD }}
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Install trusted SSH and DNS tooling
        run: |
          set -Eeuo pipefail
          test -s ops/mnebydns-owner-ssh-known_hosts
          test -n "$RU_PASS" && test -n "$DE_PASS"
          sudo apt-get update -qq && sudo apt-get install -qq -y sshpass dnsutils >/dev/null
      - name: Inspect Jino authoritative DNS A/AAAA for first hop
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in dns.mnebyvpn.site aaaaaaaaaaaa.dns.mnebyvpn.site; do
            for type in A AAAA; do
              for ns in ns1.jino.ru ns2.jino.ru; do
                echo "AUTHORITATIVE_DNS_CHECK=$name TYPE=$type NS=$ns"
                dig "@$ns" +time=3 +tries=1 +noall +answer "$name" "$type"
              done
            done
          done
      - name: Verify the shared DE CoreDNS stable checkpoint A policy and rollback disarmed
        shell: bash
        run: |
          set -Eeuo pipefail
          export SSHPASS="$DE_PASS"
          sshpass -e ssh -T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts" -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR root@89.125.90.101 'python3 -' <<'PY'
          import pathlib,subprocess,re
          c=pathlib.Path('/opt/mnebydns-dot/Corefile').read_text()
          all_a=re.findall(r'(?m)^\s*answer\s+"\{\{ \.Name \}\}\s+\d+\s+IN\s+A\s+([0-9.]+)"',c)
          assert len(all_a)==264, len(all_a)
          assert set(all_a)=={'188.120.254.223'},set(all_a)
          checkpoint=pathlib.Path('/opt/mnebydns-stable-checkpoints/current').read_text().strip()
          assert pathlib.Path(checkpoint).is_dir()
          assert (pathlib.Path(checkpoint)/'dns.stable').read_text()==c
          p=subprocess.run(['systemctl','is-active','mnebydns-fastpath-rollback-43603843149.timer'],capture_output=True,text=True)
          assert p.stdout.strip()!='active'
          for svc in ('mnebydns-dot.service','mnebydns-personal-sni-stream.service','mnebydns-personal-private-origin.service'):
            z=subprocess.run(['systemctl','is-active',svc],capture_output=True,text=True)
            assert z.stdout.strip()=='active',(svc,z.stdout)
          print('POSTMERGE_CORE_A_COUNT=264',flush=True)
          print('POSTMERGE_CORE_A_ONLY_RU188=PASS',flush=True)
          print('POSTMERGE_STABLE_CHECKPOINT_MATCH=PASS',flush=True)
          print('POSTMERGE_CORE_ROLLBACK_DISARMED=PASS',flush=True)
          print('POSTMERGE_PERSONAL_DE_BRIDGE_ACTIVE=PASS',flush=True)
          PY
      - name: Verify RU Nginx SNI, UFW IPv4-only, paid sidecar, timer disarmed
        shell: bash
        run: |
          set -Eeuo pipefail
          export SSHPASS="$RU_PASS"
          sshpass -e ssh -T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts" -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR root@188.120.254.223 'python3 -' <<'PY'
          import pathlib,subprocess,json
          config=pathlib.Path('/etc/nginx/streams.d/01-mtproxy-stdports.conf').read_text()
          assert 'dns.mnebyvpn.site 10.66.77.1:8854;' in config
          assert 'default s1_mtproxy;' in config
          assert 'ssl_preread on;' in config
          assert 'listen 993;' in config and 'listen 995;' in config and 'listen 465;' in config
          p=subprocess.run(['nginx','-t'],capture_output=True,timeout=7)
          assert p.returncode==0
          p=subprocess.run(['ufw','status'],capture_output=True,text=True,timeout=8)
          lines=[x for x in p.stdout.splitlines() if ' 853/tcp on ens3 ' in x]
          assert len(lines)==1 and '188.120.254.223' in lines[0] and 'ens3' in lines[0],lines
          assert '(v6)' not in lines[0]
          p=subprocess.run(['systemctl','is-active','mnebydns-unified-188-853-revert-20261114.timer'],capture_output=True,text=True)
          assert p.stdout.strip()!='active'
          assert pathlib.Path('/opt/mnebydns-unified-188-853-20261114/confirmed').exists()
          c=json.loads(subprocess.check_output(['docker','inspect','mnebydns-personal-dot-private'],text=True))[0]
          assert c['State']['Running'] and c['Config']['Env']
          print('POSTMERGE_RU_853_NGINX_SNI_MUX=PASS',flush=True)
          print('POSTMERGE_RU_853_UFW_IPV4_RULE=PASS',flush=True)
          print('POSTMERGE_RU_853_ROLLBACK_DISARMED=PASS',flush=True)
          print('POSTMERGE_PERSONAL_PRIVATE_SIDECAR_RUNNING=PASS',flush=True)
          PY
      - name: Verify public foreign and RU DoT with real TLS after merge
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import socket,ssl,secrets,struct
          for ip in ('188.120.254.223','89.125.90.101'):
            for host in ('chatgpt.com','www.youtube.com','claude.ai','www.googlevideo.com'):
              tid=secrets.randbelow(65535)
              q=struct.pack('!HHHHHH',tid,256,1,0,0,0)+b''.join(bytes([len(s)])+s.encode() for s in host.split('.'))+b'\0'+struct.pack('!HH',1,1)
              with socket.create_connection((ip,853),timeout=7) as tcp:
                tcp.settimeout(10)
                with ssl.create_default_context().wrap_socket(tcp,server_hostname='dns.mnebyvpn.site') as tls:
                  tls.sendall(struct.pack('!H',len(q))+q)
                  head=tls.recv(2)
                  assert len(head)==2
                  n=struct.unpack('!H',head)[0]
                  answer=b''
                  while len(answer)<n:
                    b=tls.recv(n-len(answer))
                    assert b
                    answer+=b
              assert answer[:2]==q[:2] and answer[3]&15==0
              assert bytes([188,120,254,223]) in answer,(ip,host)
              print('POSTMERGE_PUBLIC_DOT_RU_MAPPED='+ip+' '+host,flush=True)
            with socket.create_connection((ip,853),timeout=7) as raw:
              raw.settimeout(10)
              with ssl.create_default_context().wrap_socket(raw,server_hostname='aaaaaaaaaaaa.dns.mnebyvpn.site') as tls:
                assert bool(tls.getpeercert())
                print('POSTMERGE_PERSONAL_TLS_HANDSHAKE='+ip+':PASS',flush=True)
          print('POSTMERGE_DO_T_SMOKE=PASS',flush=True)
          PY
