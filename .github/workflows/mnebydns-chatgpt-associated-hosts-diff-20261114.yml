name: MNEBYDNS compare full ChatGPT app domains legacy vs personal classification
on:
  push:
    branches: [audit/mnebydns-chatgpt-legacy-personal-e2e-20261114]
    paths: ['.github/workflows/mnebydns-chatgpt-associated-hosts-diff-20261114.yml']
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      RU_PASS: ${{ secrets.SERVER188_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Compare premium policy classifications with real legacy A responses
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$RU_PASS"
          test -s ops/mnebydns-owner-ssh-known_hosts
          sudo apt-get update -qq && sudo apt-get install -qq -y sshpass >/dev/null
          export SSHPASS="$RU_PASS"
          sshpass -e ssh -T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts" -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR root@188.120.254.223 'python3 -' <<'PY'
          import json,pathlib,ssl,socket,struct,secrets
          names=[
              'chatgpt.com','www.chatgpt.com','ws.chatgpt.com','tcr9i.chat.openai.com',
              'auth.openai.com','setup.auth.openai.com','auth0.openai.com',
              'chat.openai.com','android.chat.openai.com','ios.chat.openai.com',
              'desktop.chat.openai.com','api.openai.com',
              'cdn.oaistatic.com','files.oaiusercontent.com',
              'cdn.openaimerge.com','cdn.platform.openai.com',
              'cdn.workos.com','setup.workos.com','forwarder.workos.com',
              'frontend-apps-multi-region.workos.com','challenges.cloudflare.com'
          ]
          policy=json.loads(pathlib.Path('/etc/mnebydns/personal-dot/policy-chatgpt-two-20261114.json').read_text())
          exact={x for x in policy if not x.startswith('*.')}
          suffix=[x[2:] for x in policy if x.startswith('*.')]
          def premium(name):
              return name in exact or any(name.endswith('.'+s) for s in suffix)
          def query(name):
              tid=secrets.randbelow(65535)
              pkt=struct.pack('!HHHHHH',tid,256,1,0,0,0)+b''.join(bytes([len(x)])+x.encode() for x in name.split('.'))+b'\0'+struct.pack('!HH',1,1)
              with socket.create_connection(('89.125.90.101',853),timeout=7) as plain:
                  plain.settimeout(8)
                  with ssl.create_default_context().wrap_socket(plain,server_hostname='dns.mnebyvpn.site') as tls:
                      tls.sendall(struct.pack('!H',len(pkt))+pkt)
                      head=tls.recv(2)
                      if len(head)!=2:raise RuntimeError('no frame')
                      length=struct.unpack('!H',head)[0]
                      assert 12<=length<=16384
                      buf=b''
                      while len(buf)<length:
                          part=tls.recv(length-len(buf))
                          if not part:raise RuntimeError('truncated')
                          buf+=part
              if buf[:2]!=pkt[:2]:raise RuntimeError('transaction ID mismatch')
              off=12
              def skip(p):
                  for _ in range(128):
                      n=buf[p]
                      if n&192==192:return p+2
                      if n==0:return p+1
                      p+=n+1
                  raise RuntimeError('bad DNS name')
              for i in range(struct.unpack('!H',buf[4:6])[0]):off=skip(off)+4
              ips=[]
              for i in range(struct.unpack('!H',buf[6:8])[0]):
                  off=skip(off)
                  t,cl,ttl,n=struct.unpack_from('!HHIH',buf,off)
                  off+=10
                  if t==1 and cl==1 and n==4:ips.append(socket.inet_ntoa(buf[off:off+4]))
                  off+=n
              return buf[3]&15,ips
          for name in names:
              ispaid=premium(name)
              try:
                  rc,ips=query(name)
                  status=('EDGE' if ips==['89.125.90.101'] else ('ORIGIN' if ips else 'NO_A'))
                  print('CHATGPT_DOMAIN_COMPARISON='+name+' PERSONAL='+('PREMIUM' if ispaid else 'DIRECT')+
                        ' LEGACY='+status+' RCODE='+str(rc),flush=True)
              except Exception as e:
                  print('CHATGPT_DOMAIN_COMPARISON='+name+' PERSONAL='+('PREMIUM' if ispaid else 'DIRECT')+
                        ' LEGACY=ERROR_'+type(e).__name__,flush=True)
          PY
