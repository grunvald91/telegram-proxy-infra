name: MNEBYDNS 2026-11-08 vs live YouTube configuration (read-only)
on:
  push:
    branches: [audit/smartdns-installed-review-20261115]
    paths: ['.github/workflows/smartdns-installed-review-20261115.yml']
permissions:
  contents: read
concurrency:
  group: mnebydns-youtube-baseline-readonly-20261116
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
      RU_PASS: ${{ secrets.SERVER188_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Two-node strictly read-only snapshot from actual VPS
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$DE_PASS" && test -n "$RU_PASS"
          python3 -m py_compile scripts/mnebydns-youtube-live-baseline-readonly-20261116.py
          if ! command -v sshpass >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass >/dev/null
          fi
          opts=(-T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes
            -o HostKeyAlgorithms=ssh-ed25519
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts"
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR)
          mkdir -p output
          SSHPASS="$DE_PASS" sshpass -e ssh "${opts[@]}" root@89.125.90.101 'python3 -B - DE' < scripts/mnebydns-youtube-live-baseline-readonly-20261116.py > output/de.json
          SSHPASS="$RU_PASS" sshpass -e ssh "${opts[@]}" root@188.120.254.223 'python3 -B - RU' < scripts/mnebydns-youtube-live-baseline-readonly-20261116.py > output/ru.json
          python3 - <<'PY'
          import json
          for role in ("de","ru"):
              with open("output/"+role+".json") as f: j=json.load(f)
              assert j["read_only"] is True and j["role"].lower()==role
              print("LIVE_BASELINE_"+role.upper()+"="+json.dumps(j,sort_keys=True,separators=(",",":")),flush=True)
          print("MNEBYDNS_LIVE_BASELINE_BOTH_NODES_READ_ONLY_COMPLETE=true")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mnebydns-youtube-8nov-vs-live-16nov-readonly
          path: output/*
          retention-days: 3
          if-no-files-found: warn
