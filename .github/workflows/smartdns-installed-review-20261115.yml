name: MNEBYDNS restore Nov8 Google map preparation
on:
  push:
    branches: [audit/smartdns-installed-review-20261115]
    paths: ['.github/workflows/smartdns-installed-review-20261115.yml']
permissions: {contents: read}
concurrency:
  group: mnebydns-google-public-443-change
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Locate original 8 November 2026 production Nginx and CoreDNS snapshot
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$DE_PASS"
          python3 -m py_compile scripts/mnebydns-nov8-google-restore-map-20261116.py
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          opts=(-T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts"
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR)
          mkdir -p output
          SSHPASS="$DE_PASS" sshpass -e ssh "${opts[@]}" root@89.125.90.101 'python3 -B -' < scripts/mnebydns-8nov-restore-checkpoint-find-20261116.py > output/original-checkpoint.json
          python3 - <<'PY'
          import json
          with open("output/original-checkpoint.json") as f: j=json.load(f)
          print("NOV8_GOOGLE_ROUTE_MAP="+json.dumps(j,sort_keys=True,separators=(",",":")))
          print("NOV8_GOOGLE_ROUTE_MAP_READY=true")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mnebydns-original-8nov-googlepilot-checkpoint
          path: output/original-checkpoint.json
          retention-days: 2
          if-no-files-found: warn
