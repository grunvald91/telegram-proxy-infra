name: SmartDNS arm 10 minute passive WS observation 20261116
on:
  push:
    branches: [audit/smartdns-installed-review-20261115]
    paths: ['.github/workflows/smartdns-installed-review-20261115.yml']
permissions:
  contents: read
concurrency:
  group: smartdns-installed-review-20261115
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Start bounded passive observation
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$DE_PASS"
          python3 -m py_compile scripts/smartdns-ws-metadata-observe-20261116.py
          if ! command -v sshpass >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass >/dev/null
          fi
          opts=(-o ConnectTimeout=12 -o StrictHostKeyChecking=yes
            -o HostKeyAlgorithms=ssh-ed25519
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts"
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR)
          mkdir output
          SSHPASS="$DE_PASS" sshpass -e scp "${opts[@]}" scripts/smartdns-ws-metadata-observe-20261116.py root@89.125.90.101:/tmp/mnebydns-ws-metadata-observe-20261116.py
          SSHPASS="$DE_PASS" sshpass -e ssh -T "${opts[@]}" root@89.125.90.101 'python3 /tmp/mnebydns-ws-metadata-observe-20261116.py launch' > output/state.json
          python3 -c 'import json; j=json.load(open("output/state.json")); assert j["ready"]; print("PHONE_OBSERVATION_READY",j["utc"])'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smartdns-ws-observation-state-20261116
          path: output/*
          retention-days: 2
          if-no-files-found: error
