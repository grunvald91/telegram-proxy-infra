name: SmartDNS active HTTP3 and Alt-Svc configuration read-only 20261116
on:
  push:
    branches: [audit/smartdns-installed-review-20261115]
    paths: ['.github/workflows/smartdns-installed-review-20261115.yml']
permissions:
  contents: read
concurrency:
  group: smartdns-installed-review-20261115
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect active Nginx H3 and Alt-Svc configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$DE_PASS"
          python3 -m py_compile scripts/smartdns-h3-config-readonly-20261116.py
          if ! command -v sshpass >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass >/dev/null
          fi
          opts=(-o ConnectTimeout=12 -o StrictHostKeyChecking=yes
            -o HostKeyAlgorithms=ssh-ed25519
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts"
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR)
          mkdir output
          SSHPASS="$DE_PASS" sshpass -e ssh -T "${opts[@]}" root@89.125.90.101 'python3 -B -' < scripts/smartdns-h3-config-readonly-20261116.py > output/config-hints.json
          python3 -c 'import json; j=json.load(open("output/config-hints.json")); assert j["production_changed"] is False; print("ACTIVE_CONFIG_HINTS_READONLY_COMPLETE=true")'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smartdns-active-h3-config-readonly-20261116
          path: output/*
          retention-days: 2
          if-no-files-found: error
