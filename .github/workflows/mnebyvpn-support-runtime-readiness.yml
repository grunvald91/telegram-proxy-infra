name: MNEBYVPN support runtime readiness (read-only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mnebyvpn-support-runtime-readiness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SERVER188_SSH_PASSWORD: ${{ secrets.SERVER188_SSH_PASSWORD }}
    steps:
      - name: Inspect only dedicated MNEBYVPN configuration and Telegram egress
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SERVER188_SSH_PASSWORD"
          sudo apt-get update -qq && sudo apt-get install -qq -y sshpass
          export SSHPASS="$SERVER188_SSH_PASSWORD"
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=accept-new \
            -o LogLevel=ERROR root@188.120.254.223 'python3 -' <<'PY'
          import pathlib,re,subprocess
          root=pathlib.Path('/opt/mnebyvpn')
          for name, rel in [('bot','bot/web.env'),('website','public/web.env')]:
              path=root/rel
              text=path.read_text() if path.is_file() else ''
              for key in ['TELEGRAM_TOKEN_BOT','SUPPORT_TELEGRAM_OPERATOR_ID']:
                  values=[line.partition('=')[2] for line in text.splitlines()
                          if line.startswith(key+'=')]
                  valid=len(values)==1 and bool(values[0])
                  print(name+'_'+key+'_configured='+str(valid).lower())
          for name, rel in [('site','public/active_sha'),('stage','staging/active_sha')]:
              path=root/rel
              val=path.read_text().strip() if path.is_file() else ''
              print(name+'_sha='+val if re.fullmatch(r'[a-f0-9]{40}',val)
                    else name+'_sha=missing')
          probes=[('bot','http://127.0.0.1:8793/readyz'),
                  ('site','http://127.0.0.1:8792/api/support/status'),
                  ('telegram','https://api.telegram.org/'),
                  ('telegram_bot_api','https://api.telegram.org/bot000000000:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA/getMe')]
          for name,url in probes:
              try:
                  cp=subprocess.run(['curl','--noproxy','*','--silent','--show-error',
                    '--output','/dev/null','--write-out','%{http_code}',
                    '--max-time','8',url],text=True,capture_output=True,timeout=12)
                  print(name+'_http_status='+cp.stdout.strip()[:3])
              except Exception:
                  print(name+'_http_status=unavailable')
          image=subprocess.run(['docker','inspect','--format','{{.Config.Image}}',
                'mnebyvpn-bot-info'],capture_output=True,text=True,timeout=6)
          ref=image.stdout.strip()
          print('bot_image_sha='+ref.removeprefix('mnebyvpn-stage-web:')
                if re.fullmatch(r'mnebyvpn-stage-web:[a-f0-9]{40}',ref)
                else 'bot_image_sha=unverified')
          check=subprocess.run(['curl','--noproxy','*','-fsS','--max-time','8',
                'http://127.0.0.1:8792/api/support/status'],
                capture_output=True,text=True,timeout=10)
          try:
              import json
              availability=json.loads(check.stdout).get('available')
              print('site_support_available='+str(availability is True).lower())
          except Exception:
              print('site_support_available=unverified')
          print('read_only=true')
          PY

      - name: Check public HTML from independent GitHub runner
        shell: bash
        run: |
          set -euo pipefail
          if curl -fsSL --max-time 12 https://mnebyvpn.site/ -o "$RUNNER_TEMP/mnebyvpn-public.html"; then
            if grep -Fq 'MNEBYVPN' "$RUNNER_TEMP/mnebyvpn-public.html" &&
               grep -Fq 'id="contact-support"' "$RUNNER_TEMP/mnebyvpn-public.html"; then
              echo 'public_brand_and_support_form_visible=true'
            else
              echo '::warning::Public HTML does not yet contain the expected support form'
              echo 'public_brand_and_support_form_visible=false'
            fi
          else
            echo '::warning::Public HTTPS could not be independently verified'
            echo 'public_brand_and_support_form_visible=unverified'
          fi
