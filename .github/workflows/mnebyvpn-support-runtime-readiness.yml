name: MNEBYVPN support runtime readiness (read-only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mnebyvpn-support-runtime-readiness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SERVER188_SSH_PASSWORD: ${{ secrets.SERVER188_SSH_PASSWORD }}
    steps:
      - name: Inspect only dedicated MNEBYVPN configuration and Telegram egress
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SERVER188_SSH_PASSWORD"
          sudo apt-get update -qq && sudo apt-get install -qq -y sshpass
          export SSHPASS="$SERVER188_SSH_PASSWORD"
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=accept-new \
            -o LogLevel=ERROR root@188.120.254.223 'python3 -' <<'PY'
          import pathlib,re,subprocess
          root=pathlib.Path('/opt/mnebyvpn')
          for name, rel in [('bot','bot/web.env'),('website','public/web.env')]:
              path=root/rel
              text=path.read_text() if path.is_file() else ''
              for key in ['TELEGRAM_TOKEN_BOT','SUPPORT_TELEGRAM_OPERATOR_ID']:
                  values=[line.partition('=')[2] for line in text.splitlines()
                          if line.startswith(key+'=')]
                  valid=len(values)==1 and bool(values[0])
                  print(name+'_'+key+'_configured='+str(valid).lower())
          for name, rel in [('site','public/active_sha'),('stage','staging/active_sha')]:
              path=root/rel
              val=path.read_text().strip() if path.is_file() else ''
              print(name+'_sha='+val if re.fullmatch(r'[a-f0-9]{40}',val)
                    else name+'_sha=missing')
          probes=[('bot','http://127.0.0.1:8793/readyz'),
                  ('site','http://127.0.0.1:8792/api/support/status'),
                  ('telegram','https://api.telegram.org/')]
          for name,url in probes:
              try:
                  cp=subprocess.run(['curl','--noproxy','*','--silent','--show-error',
                    '--output','/dev/null','--write-out','%{http_code}',
                    '--max-time','8',url],text=True,capture_output=True,timeout=12)
                  print(name+'_http_status='+cp.stdout.strip()[:3])
              except Exception:
                  print(name+'_http_status=unavailable')
          print('read_only=true')
          PY
