name: MNEBYDNS Threads-only public DoT and TLS reversible 30m canary
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths: [.github/workflows/threads-only-smartdns-canary-20261110.yml]
permissions:
  contents: read
concurrency:
  group: mnebydns-google-public-443-change
  cancel-in-progress: false
jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
      RU_PASS: ${{ secrets.SERVER188_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Offline scope, syntax and dependency preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$RU_PASS" && test -n "$DE_PASS"
          python3 scripts/mnebydns-threads-only-render-20261110.py self-test
          bash -n scripts/mnebydns-threads-only-stage-20261110.sh scripts/mnebydns-threads-only-rollback-20261110.sh
          echo 'threads_only_scope_static_preflight=true'
      - name: Arm independent expiry, stage only Threads and verify public DoT/TLS
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -qq -y sshpass >/dev/null
          id="$GITHUB_RUN_ID"
          [[ "$id" =~ ^[0-9]{9,13}$ ]]
          deadline="$(date -u -d '+30 minutes' +'%Y-%m-%d %H:%M:%S UTC')"
          work="/tmp/mnebydns-threads-canary-$id"
          base="/opt/mnebydns-threads-canary/$id"
          de_ssh() {
            SSHPASS="$DE_PASS" sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=accept-new -o LogLevel=ERROR root@89.125.90.101 "$@"
          }
          ru_ssh() {
            SSHPASS="$RU_PASS" sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=accept-new -o LogLevel=ERROR root@188.120.254.223 "$@"
          }
          on_failure(){
            rc=$?
            trap - EXIT
            if ((rc!=0)); then
              echo 'threads_canary_failed_rollback_requested=true'
              de_ssh "test ! -f '$base/rollback.sh' || bash '$base/rollback.sh' '$base'" ||
                echo 'threads_canary_rollback_NOT_VERIFIED=true'
            fi
            exit "$rc"
          }
          trap on_failure EXIT
          de_ssh "test ! -e '$work' && mkdir -m 700 '$work'"
          tar -czf - -C scripts mnebydns-threads-only-render-20261110.py mnebydns-threads-only-stage-20261110.sh mnebydns-threads-only-rollback-20261110.sh |
            de_ssh "tar -xzf - -C '$work'"
          de_ssh "bash '$work/mnebydns-threads-only-stage-20261110.sh' '$work' '$deadline'"
          # Public DoT: confirm only Threads rebinds, all other tested routes preserve their meaning.
          python3 - <<'PY'
          import socket,ssl,struct,secrets
          de='89.125.90.101'
          def query(name,typ=1):
              tid=secrets.randbits(16)
              labels=name.rstrip('.').split('.')
              wire=b''.join(bytes([len(x)])+x.encode('ascii') for x in labels)+b'\x00'
              message=struct.pack('!HHHHHH',tid,0x100,1,0,0,0)+wire+struct.pack('!HH',typ,1)
              with socket.create_connection((de,853),timeout=7) as raw:
                  raw.settimeout(7)
                  with ssl.create_default_context().wrap_socket(raw,server_hostname='dns.mnebyvpn.site') as tls:
                      tls.sendall(len(message).to_bytes(2,'big')+message)
                      size=int.from_bytes(tls.recv(2),'big')
                      buf=b''
                      while len(buf)<size:
                          fragment=tls.recv(size-len(buf))
                          if not fragment:raise RuntimeError('DoT EOF')
                          buf+=fragment
              if int.from_bytes(buf[:2],'big')!=tid:raise AssertionError('DoT ID mismatch')
              rcode=buf[3]&0xf;qd=int.from_bytes(buf[4:6],'big');an=int.from_bytes(buf[6:8],'big')
              pos=12
              def skipname(p):
                  for _ in range(128):
                      n=buf[p]
                      if n&0xc0==0xc0:return p+2
                      if n==0:return p+1
                      p+=n+1
                  raise ValueError('invalid qname')
              for _ in range(qd):pos=skipname(pos)+4
              ips=[]
              for _ in range(an):
                  pos=skipname(pos)
                  qtype,qclass,ttl,n=struct.unpack_from('!HHIH',buf,pos);pos+=10
                  if qtype==1 and n==4:ips.append(socket.inet_ntoa(buf[pos:pos+4]))
                  pos+=n
              return rcode,ips
          threads=['threads.com','www.threads.com','graph.threads.com',
                   'threads.net','www.threads.net','graph.threads.net']
          stable=['gemini.google.com','claude.ai','grok.com','x.com','www.tiktok.com']
          excluded=['i.instagram.com','graph.instagram.com','www.instagram.com','api.telegram.org']
          for host in threads:
              code,ips=query(host)
              ok=code==0 and ips==[de]
              print('threads_public_DoT_route_'+host+'='+str(ok).lower(),flush=True)
              if not ok:raise SystemExit('THREADS_DOT_REWRITE_FAILED_'+host)
              code,ips=query(host,28)
              if code!=0 or ips:raise SystemExit('THREADS_AAAA_ERROR_'+host)
          for host in stable:
              code,ips=query(host)
              ok=code==0 and ips==[de]
              print('threads_stable_DoT_unchanged_'+host+'='+str(ok).lower(),flush=True)
              if not ok:raise SystemExit('WORKING_DOT_ROUTE_REGRESSED_'+host)
          for host in excluded:
              code,ips=query(host)
              ok=code==0 and de not in ips and '188.120.254.223' not in ips
              print('threads_unrelated_domain_direct_'+host+'='+str(ok).lower(),flush=True)
              if not ok:raise SystemExit('UNRELATED_DOMAIN_REWRITTEN_'+host)
          print('threads_DoT_isolation_test=PASS',flush=True)
          PY
          # Public TCP/TLS via DE must verify original origin certificate with SNI unchanged.
          ru_ssh 'python3 -' <<'PY'
          import ssl,socket,concurrent.futures
          de='89.125.90.101'
          hosts=['threads.com','www.threads.com','graph.threads.com',
                 'threads.net','www.threads.net','graph.threads.net',
                 'gemini.google.com','chatgpt.com']
          def test(host):
              try:
                  with socket.create_connection((de,443),timeout=7) as raw:
                      raw.settimeout(7)
                      with ssl.create_default_context().wrap_socket(raw,server_hostname=host) as tls:
                          return host, bool(tls.getpeercert()),'none'
              except Exception as exc:
                  return host,False,type(exc).__name__
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as pool:
              rows=list(pool.map(test,hosts))
          for host,ok,error in rows:
              print('threads_public_TLS_'+host+'='+str(ok).lower(),flush=True)
              print('threads_public_TLS_error_'+host+'='+error,flush=True)
          # www.threads.com was separately proven SNI-filtered on RU-to-DE
          # (matched ClientHello audit #42769494584). Surface this known gap;
          # do NOT mask any failure on other Threads/stable domains.
          www_ok=next(ok for host,ok,error in rows if host=='www.threads.com')
          print('threads_known_www_threads_com_TLS_verified='+str(www_ok).lower(),flush=True)
          print('threads_known_www_threads_com_SNI_filtering_unresolved='+str(not www_ok).lower(),flush=True)
          if not all(ok for host,ok,error in rows if host!='www.threads.com'):
              raise SystemExit('Threads non-www or stable TLS path incomplete')
          print('threads_non_www_public_TLS_isolation_test=PASS',flush=True)
          PY
          de_ssh "systemctl is-active --quiet 'mnebydns-threads-rollback-$id.timer' && echo threads_guard_active=true"
          echo "threads_guard_deadline_UTC=$deadline"
          echo 'threads_public_DNS_TLS_canary_active=true'
          echo 'threads_android_application_test_NOT_PERFORMED=true'
          echo 'threads_caution_independent_rollback_after_30min=true'
          trap - EXIT
