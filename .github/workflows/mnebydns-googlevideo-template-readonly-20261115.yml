name: MNEBYDNS inspect active Googlevideo A template only
on:
  push:
    branches: [restore/mnebydns-youtube-morning-20261115]
    paths: ['.github/workflows/mnebydns-googlevideo-template-readonly-20261115.yml']
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Show only active Googlevideo A template syntax and anchors
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$DE_PASS"
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -qq -y sshpass >/dev/null
          SSHPASS="$DE_PASS" sshpass -e ssh -T -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts" -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o ConnectTimeout=12 root@89.125.90.101 'python3 -' <<'PY'
          import pathlib,re,json,hashlib
          p=pathlib.Path('/opt/mnebydns-dot/Corefile')
          s=p.read_text()
          blocks=re.findall(r'(?ms)^[ \t]*template IN A [^\n]+\{\n.*?^[ \t]*\}',s)
          out=[]
          for i,b in enumerate(blocks):
            if 'googlevideo' in b:
              out.append({'index':i,'text':b[:2100]})
          print('GOOGLEVIDEO_A_MATCHING_TEMPLATES='+json.dumps(out,sort_keys=True),flush=True)
          print('GOOGLEVIDEO_A_TEMPLATE_TOTAL='+str(len(blocks)),flush=True)
          print('COREFILE_CURRENT_SHA256='+hashlib.sha256(p.read_bytes()).hexdigest(),flush=True)
          print('COREFILE_RELOAD_PRESENT='+str('    reload 5s 1s' in s).lower(),flush=True)
          print('INSPECT_ONLY_NO_WRITES=true',flush=True)
          PY
