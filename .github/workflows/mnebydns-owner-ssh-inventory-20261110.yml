name: "MNEBYDNS owner SSH host public-key inventory (read-only)"
on:
  push:
    branches: [fix/owner-smartdns-hardening-e2e-20261110]
    paths: [".github/workflows/mnebydns-owner-ssh-inventory-20261110.yml"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      RU_PASS: ${{ secrets.SERVER188_SSH_PASSWORD }}
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - name: Cross-check SSH host public keys via two read-only views
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq && sudo apt-get install -qq -y sshpass >/dev/null
          for role in ru de; do
            if [[ "$role" == ru ]]; then
              host=188.120.254.223
              export SSHPASS="$RU_PASS"
            else
              host=89.125.90.101
              export SSHPASS="$DE_PASS"
            fi
            test -n "$SSHPASS"
            # Identity inventory only. The current production transport has TOFU,
            # so this does not claim independent ownership verification.
            remote="$(sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=accept-new -o LogLevel=ERROR "root@$host" \
              'awk '\''$1=="ssh-ed25519"{print $1" "$2}'\'' /etc/ssh/ssh_host_ed25519_key.pub')"
            scanned="$(ssh-keyscan -T 12 -t ed25519 "$host" 2>/dev/null | awk '$2=="ssh-ed25519"{print $2" "$3}' | sort -u)"
            test -n "$remote" && [[ "$remote" == "$scanned" ]] || {
              echo "::error::SSH public key endpoints disagree for $role"
              exit 2
            }
            echo "OWNER_SSH_HOST_PUBLIC_KEY_$role=$host $remote"
            echo "$host $remote" | ssh-keygen -lf -
          done
