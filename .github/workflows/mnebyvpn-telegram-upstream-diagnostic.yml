name: Inspect MNEBYVPN Telegram webhook upstream on both hosts
on:
  push:
    branches: [main]
    paths: ['.github/workflows/mnebyvpn-telegram-upstream-diagnostic.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      RU_PASS: ${{ secrets.SERVER188_SSH_PASSWORD }}
      FOREIGN_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - name: Probe bot and foreign ingress without changing processes
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$FOREIGN_PASS" ]]; then echo 'foreign_ssh_configured=true'; else echo 'foreign_ssh_configured=false'; fi
          test -n "$RU_PASS"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          export SSHPASS="$RU_PASS"
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=accept-new -o LogLevel=ERROR root@188.120.254.223 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          echo 'ru_dns_cdn_servgo_ru'
          getent ahostsv4 cdn.servgo.ru | head -3 || true
          echo "bot_image=$(docker inspect -f '{{.Config.Image}}' mnebyvpn-bot-info 2>/dev/null || echo unavailable)"
          echo "bot_running=$(docker inspect -f '{{.State.Running}}' mnebyvpn-bot-info 2>/dev/null || echo unavailable)"
          for port in 8793 8794; do
            echo "bot_port_${port}_ready=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:$port/readyz || true)"
            echo "bot_port_${port}_unsigned=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 -X POST -H 'Content-Type: application/json' -d '{\"update_id\":100}' http://127.0.0.1:$port/webhooks/telegram || true)"
          done
          echo 'ru_read_only=true'
          REMOTE
          if [[ -n "$FOREIGN_PASS" ]]; then
            SSHPASS="$FOREIGN_PASS" sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=accept-new -o LogLevel=ERROR root@89.125.90.101 'bash -s' <<'FOREIGN'
          set -Eeuo pipefail
          echo 'foreign_dns_cdn_servgo_ru'
          getent ahostsv4 cdn.servgo.ru | head -3 || true
          echo 'foreign_listener_8443'
          ss -H -ltnp | grep ':8443 ' | head -4 || true
          echo "foreign_nginx_active=$(systemctl is-active nginx || true)"
          echo "foreign_nginx_syntax=$(nginx -t 2>&1 | tail -1)"
          for host in cdn.servgo.ru; do
            echo "foreign_tls_8443=$(curl --noproxy '*' -s -o /dev/null -w '%{http_code}' --connect-timeout 4 --max-time 9 --resolve $host:8443:127.0.0.1 -X POST -H 'Content-Type: application/json' -d '{\"update_id\":100}' https://$host:8443/mnebyvpn-telegram/webhook || true)"
          done
          echo "foreign_to_ru_8793=$(curl --noproxy '*' -s -o /dev/null -w '%{http_code}' --connect-timeout 4 --max-time 7 -X POST -H 'Content-Type: application/json' -d '{\"update_id\":100}' http://10.66.77.2:8793/webhooks/telegram || true)"
          echo "foreign_to_ru_8794=$(curl --noproxy '*' -s -o /dev/null -w '%{http_code}' --connect-timeout 4 --max-time 7 -X POST -H 'Content-Type: application/json' -d '{\"update_id\":100}' http://10.66.77.2:8794/webhooks/telegram || true)"
          echo 'foreign_read_only=true'
          FOREIGN
          fi
