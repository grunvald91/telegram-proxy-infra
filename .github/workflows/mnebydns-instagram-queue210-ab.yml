name: MNEBYDNS Instagram one-peer NFQUEUE 210 A-B test
on:
  push:
    branches: [experiment/instagram-synack-window-canary-20261110]
    paths:
      - '.github/workflows/mnebydns-instagram-queue210-ab.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mnebydns-instagram-queue210-live-exclusive
  cancel-in-progress: false
jobs:
  controlled-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RU_PASS: ${{ secrets.SERVER188_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate environment and read-only baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$RU_PASS"
          python3 -m py_compile scripts/mnebydns_instagram_queue210_synack_ab.py
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sshpass >/dev/null
          export SSHPASS="$RU_PASS"
          opts=(-T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts"
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR)
          src="$(sshpass -e ssh "${opts[@]}" root@188.120.254.223 'printf "%s" "${SSH_CONNECTION%% *}"')"
          expected="$(curl -4fsS --max-time 8 https://api.ipify.org)"
          python3 - "$src" "$expected" <<'PY'
          import ipaddress,sys
          a,b=(ipaddress.IPv4Address(x) for x in sys.argv[1:])
          if not a.is_global or a!=b: raise SystemExit('Runner SSH source and public HTTPS egress IP differ: abort without changes')
          PY
          for i in 1 2 3; do
            if timeout 4 bash -c 'echo > /dev/tcp/188.120.254.223/443' 2>/dev/null; then
              echo 'baseline_443=CONNECTED_SKIP_AB'
              exit 0
            fi
            echo "baseline_attempt_${i}=TIMEOUT_OR_ERROR"
          done
          echo "TEST_PEER=$src" >> "$GITHUB_ENV"
          echo 'AB_READONLY_BASELINE=FAILED_TO_CONNECT' >> "$GITHUB_ENV"
      - name: Execute bounded single-peer SYN-ACK test with independent rollback
        if: env.AB_READONLY_BASELINE == 'FAILED_TO_CONNECT'
        shell: bash
        run: |
          set -Eeuo pipefail
          export SSHPASS="$RU_PASS"
          opts=(-T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts"
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR)
          log="$RUNNER_TEMP/ig-ab.log"
          timeout 100s sshpass -e ssh "${opts[@]}" root@188.120.254.223 "python3 - '$TEST_PEER' '$GITHUB_RUN_ID'" < scripts/mnebydns_instagram_queue210_synack_ab.py >"$log" 2>&1 &
          remote=$!
          trap 'kill "$remote" 2>/dev/null || true' EXIT
          for i in $(seq 1 100); do
            if grep -q '^synack_ab_test=READY$' "$log" 2>/dev/null; then break; fi
            if ! kill -0 "$remote" 2>/dev/null; then cat "$log"; exit 1; fi
            sleep 0.2
          done
          grep -q '^synack_ab_test=READY$' "$log"
          connected=0
          for i in 1 2 3; do
            if timeout 4 bash -c 'echo > /dev/tcp/188.120.254.223/443' 2>/dev/null; then
              connected=1
            fi
          done
          echo "ab_connected_during_bypass=$connected"
          wait "$remote"
          trap - EXIT
          grep '^synack_ab_' "$log" || true
          grep -Eq '^synack_ab_immediate_cleanup=(DONE|ALREADY_REMOVED)$' "$log"
          if sshpass -e ssh "${opts[@]}" root@188.120.254.223 'nft -a list chain inet telegram_nfqws post' | grep -Fq "MNEBY_IG_SYNACK_AB_$GITHUB_RUN_ID"; then
            echo 'AB_RULE_STILL_PRESENT_AFTER_CLEANUP' >&2
            exit 1
          fi
          echo 'ab_rule_rollback_verified=PASS'
          echo "ab_effect_detected=$connected"
          for i in 1 2 3; do
            if timeout 4 bash -c 'echo > /dev/tcp/188.120.254.223/443' 2>/dev/null; then
              echo "postrollback_${i}=CONNECTED"
            else
              echo "postrollback_${i}=TIMEOUT_OR_ERROR"
            fi
          done
