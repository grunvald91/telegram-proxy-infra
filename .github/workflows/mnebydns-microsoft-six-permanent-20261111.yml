name: MNEBYDNS Microsoft all six exact hosts permanent via existing Gemini Claude route
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - '.github/workflows/mnebydns-microsoft-six-permanent-20261111.yml'
      - 'scripts/mnebydns-microsoft-six-permanent-20261111.py'
      - 'scripts/tests/test_mnebydns_microsoft_six_review.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/mnebydns-microsoft-six-permanent-20261111.yml'
      - 'scripts/mnebydns-microsoft-six-permanent-20261111.py'
      - 'scripts/tests/test_mnebydns_microsoft_six_review.py'
      # Only an independently reviewed trigger, not a code-review fix,
      # may authorize a repeat permanent deployment of these six routes.
      - 'data/mnebydns-microsoft-six-rollout-trigger-20261112.txt'
  workflow_dispatch:
    inputs:
      mode:
        description: 'review: tests only; deploy: explicit guarded six-route retry'
        type: choice
        options: [review, deploy]
        default: review
permissions:
  contents: read
concurrency:
  group: mnebydns-google-public-443-change
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify six-name permanent controller uses existing reversible owner route renderer
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/mnebydns-microsoft-six-permanent-20261111.py
          python3 scripts/mnebydns-microsoft-six-permanent-20261111.py self-test
          python3 -m unittest discover -s scripts/tests -p 'test_mnebydns_microsoft_six_review.py' -v
          python3 scripts/mnebydns-owner-domain-controller-20261110.py self-test
          python3 scripts/mnebydns-owner-domain-render-20261110.py self-test
          python3 -m unittest discover -s scripts/tests -p 'test_owner_domain_*.py' -v
          bash -n scripts/mnebydns-owner-domain-stage-20261110.sh \
            scripts/mnebydns-owner-domain-confirm-20261110.sh \
            scripts/mnebydns-owner-domain-rollback-20261110.sh
          test "$(grep -c ' ssh-ed25519 ' ops/mnebydns-owner-ssh-known_hosts)" -eq 2
          ! grep -Eq 'StrictHostKeyChecking=no|accept-new|verify=False|ssl\._create_unverified_context' \
            scripts/mnebydns-microsoft-six-permanent-20261111.py
          python3 - <<'PY'
          from pathlib import Path
          f=Path('.github/workflows/mnebydns-microsoft-six-permanent-20261111.yml').read_text()
          assert "git diff --name-only HEAD^ HEAD --" in f
          assert "grep -Fxq \"$target\"" in f
          assert "if: steps.reviewed.outputs.approved == 'yes'" in f
          assert "fetch-depth: 2" in f
          assert "if: github.event_name != 'pull_request'" in f
          print("microsoft_explicit_trigger_offline=PASS")
          PY
          echo microsoft_six_offline_preflight=PASS
  release:
    if: github.event_name != 'pull_request'
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 29
    env:
      RU_PASS: ${{ secrets.SERVER188_SSH_PASSWORD }}
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Authorize release ONLY for explicit reviewed trigger changed in this commit
        id: reviewed
        shell: bash
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
        run: |
          set -Eeuo pipefail
          target=data/mnebydns-microsoft-six-rollout-trigger-20261112.txt
          approved=no
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            [[ "${REQUESTED_MODE:-review}" == deploy ]] && approved=yes || :
          elif [[ "$GITHUB_EVENT_NAME" == push ]]; then
            # Do not use github.event.head_commit.added/modified arrays; some
            # GitHub event payloads omit them. Inspect the actual tree diff.
            git cat-file -e HEAD^
            if git diff --name-only HEAD^ HEAD -- | grep -Fxq "$target"; then
              approved=yes
            fi
          fi
          echo "approved=$approved" >> "$GITHUB_OUTPUT"
          echo "microsoft_explicit_release_approved=$approved"
      - name: Permanently promote all six exact-host routes one-by-one with independent rollback timers
        if: steps.reviewed.outputs.approved == 'yes'
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$RU_PASS" && test -n "$DE_PASS"
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -qq -y sshpass >/dev/null
          python3 scripts/mnebydns-microsoft-six-permanent-20261111.py run
          echo 'microsoft_all_six_final_status=ACTIVE_or_existing_COVERED' >> "$GITHUB_STEP_SUMMARY"
          echo 'microsoft_manual_phone_approval_required=false' >> "$GITHUB_STEP_SUMMARY"
          echo 'microsoft_wildcard_or_arbitrary_host_routes=false' >> "$GITHUB_STEP_SUMMARY"
