# Re-run canonical payment DB role after the working deployment script was restored.
name: Prepare scoped MNEBYVPN website billing DB on canonical server188
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mnebyvpn-site-billing-db-prepare.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mnebyvpn-site-billing-role-188
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SSH_PASSWORD: ${{ secrets.SERVER188_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate SQL provisioning script syntax and existing private access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_PASSWORD"
          python3 -m py_compile scripts/mnebyvpn-site-billing-db-setup.py
          bash -n scripts/mnebyvpn-auto-web-promote.sh
          sudo apt-get update -qq && sudo apt-get install -qq -y sshpass
      - name: Create bounded billing role and private env, no checkout activation
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$SSH_PASSWORD"
          opts=(-o ConnectTimeout=12 -o StrictHostKeyChecking=accept-new -o LogLevel=ERROR)
          scp_target=root@188.120.254.223
          sshpass -e scp "${opts[@]}" scripts/mnebyvpn-site-billing-db-setup.py \
            "$scp_target:/tmp/mnebyvpn-site-billing-db-setup.py"
          sshpass -e ssh "${opts[@]}" "$scp_target" \
            'python3 /tmp/mnebyvpn-site-billing-db-setup.py'
      - name: Remove only isolated staging script
        if: always()
        shell: bash
        run: |
          if [[ -n "$SSH_PASSWORD" ]];then
            export SSHPASS="$SSH_PASSWORD"
            sshpass -e ssh -o ConnectTimeout=8 -o StrictHostKeyChecking=accept-new \
              -o LogLevel=ERROR root@188.120.254.223 \
              'rm -f /tmp/mnebyvpn-site-billing-db-setup.py' || true
          fi
