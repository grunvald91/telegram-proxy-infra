name: Diagnose MNEBYVPN public HTTPS after canary release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/mnebyvpn-public-https-postrelease-check.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      SSH_PASSWORD: ${{ secrets.SERVER188_SSH_PASSWORD }}
    steps:
      - name: Check external DNS, TLS, homepage and auth fail-closed
        shell: bash
        run: |
          set -euo pipefail
          echo '--- public DNS ---'
          for domain in mnebyvpn.site www.mnebyvpn.site; do
            echo "$domain"
            dig +short A "$domain" @1.1.1.1 || true
          done
          for url in https://mnebyvpn.site/ https://www.mnebyvpn.site/; do
            curl -LsS --retry 1 --connect-timeout 7 --max-time 14 \
              -o /dev/null -w "public_status=%{http_code} remote_ip=%{remote_ip} ssl_verify=%{ssl_verify_result}\n" \
              "$url" || echo 'public_https_failed=true'
          done
      - name: Verify server188 TLS and Nginx routing WITHOUT making changes
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_PASSWORD"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          export SSHPASS="$SSH_PASSWORD"
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=accept-new -o LogLevel=ERROR root@188.120.254.223 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          echo "public_active_sha=$(cat /opt/mnebyvpn/public/active_sha)"
          expected_release=211bb06867a19b6995f59bd5af13c6bea2139c1f
          test "$(cat /opt/mnebyvpn/public/active_sha)" = "$expected_release"
          echo 'compact_release_sha_verified=true'
          # Pure HTTP GET checks: no payment or VPN state is mutated.
          page="$(curl -fsS --max-time 6 http://127.0.0.1:8792/)"
          [[ "$page" == *'id="journey-landing"'* ]]
          [[ "$page" == *'/journey.js'* ]]
          style="$(curl -fsS --max-time 6 http://127.0.0.1:8792/journey.css)"
          [[ "$style" == *'body.journey-active .ambient{position:fixed'* ]]
          [[ "$style" == *'body.journey-active .journey-checkout'* ]]
          echo 'neon_design_and_fixed_background_verified=true'
          [[ "$page" == *'id="journey-trial-auth"'* ]]
          [[ "$page" == *'id="journey-trial"'* ]]
          [[ "$page" == *'id="journey-trial-telegram"'* ]]
          [[ "$page" == *'class="journey-world-backdrop"'* ]]
          [[ "$page" == *'src="/world-neon.webp"'* ]]
          [[ "$page" != *'id="worldClip"'* ]]
          [[ "$style" == *'.journey-world-image'* ]]
          asset_headers="$(curl -fsS --max-time 9 -D - -o /dev/null http://127.0.0.1:8792/world-neon.webp)"
          [[ "${asset_headers,,}" == *'content-type: image/webp'* ]]
          echo 'real_earth_asset_http_200_webp=true'
          [[ "$page" == *'Заранее напомним, когда срок будет заканчиваться.'* ]]
          [[ "$style" == *'.journey-world-backdrop'* ]]
          echo 'trial_email_auth_and_globe_art_verified=true'
          echo 'compact_homepage_rendered=true'
          for route in /journey.js /journey.css /about.js /world-neon.webp /payment/success /payment/return; do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 7 "http://127.0.0.1:8792$route")"
            echo "compact_route_${route}=${code}"
            test "$code" = 200
          done
          tls_page="$(curl -fsS --max-time 8 --resolve mnebyvpn.site:443:127.0.0.1 https://mnebyvpn.site/)"
          if [[ "$tls_page" == *'/journey.js'* ]]; then
            echo 'compact_nginx_local_tls=true'
          else
            echo 'compact_nginx_local_tls=false'
            exit 1
          fi
          echo "site_local_http=$(curl -s -o /dev/null -w '%{http_code}' --max-time 4 http://127.0.0.1:8792/healthz)"
          echo "site_nginx_config=$(nginx -t 2>&1 | tail -1)"
          for host in mnebyvpn.site www.mnebyvpn.site; do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 8 \
              --resolve "$host:443:127.0.0.1" "https://$host/" || true)"
            echo "server_tls_${host}_code=$code"
          done
          echo 'read_only=true'
          REMOTE
