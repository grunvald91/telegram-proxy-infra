name: DE89 source-scoped TCP split handshake test
on:
  push:
    branches: [diag/youtube-de89-synack-split-20261117]
    paths: ['.github/workflows/youtube-de89-synack-split-20261117.yml','scripts/youtube-de89-synack-split-20261117.py']
permissions: {contents: read}
concurrency:
  group: mnebydns-youtube-de89-window4
  cancel-in-progress: false
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Prepare pinned access and bounded capture
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/youtube-de89-synack-split-20261117.py scripts/youtube-return-trace-20261117.py
          test -n "$DE_PASS" && test -s ops/mnebydns-owner-ssh-known_hosts
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          cat > "$RUNNER_TEMP/de-only" <<'SHELL'
          #!/bin/bash
          set -Eeuo pipefail
          export SSHPASS="$DE_PASS"
          exec sshpass -e ssh -T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=5 -o ServerAliveCountMax=3 -o HostKeyAlgorithms=ssh-ed25519 \
            -o "UserKnownHostsFile=$GITHUB_WORKSPACE/ops/mnebydns-owner-ssh-known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR \
            root@89.125.90.101 "$@"
          SHELL
          chmod 700 "$RUNNER_TEMP/de-only"
          root="/run/mnebydns-synsplit-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          "$RUNNER_TEMP/de-only" "umask 077; mkdir '$root'; cat > '$root/experiment.py'" < scripts/youtube-de89-synack-split-20261117.py
          sed 's/^CAPTURE_SECONDS = 90$/CAPTURE_SECONDS = 120/' scripts/youtube-return-trace-20261117.py > "$RUNNER_TEMP/window-observer.py"
          "$RUNNER_TEMP/de-only" "cat > '$root/observer.py'" < "$RUNNER_TEMP/window-observer.py"
          "$RUNNER_TEMP/de-only" "systemd-run --quiet --unit=mnebydns-synsplit-capture-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT} --property=RuntimeMaxSec=160 --property=MemoryMax=256M --property=StandardOutput=append:$root/capture.log --property=StandardError=append:$root/capture.log /usr/bin/env MNEBY_CAPTURE_READY=$root/READY /usr/bin/python3 -B $root/observer.py"
          "$RUNNER_TEMP/de-only" "for attempt in \$(seq 1 15); do if test -s '$root/READY'; then echo WINDOW4_CAPTURE_READY=true; exit 0; fi; sleep 1; done; exit 1"
      - name: Validate split handshake on the external control before phone traffic
        run: |
          set -Eeuo pipefail
          root="/run/mnebydns-synsplit-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          "$RUNNER_TEMP/de-only" "python3 -B '$root/experiment.py' prepare '$root'"
          python3 -B scripts/youtube-de89-tls-controls-20261117.py
      - name: Test split handshake only on the recent observed phone address
        run: |
          set -Eeuo pipefail
          root="/run/mnebydns-synsplit-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          "$RUNNER_TEMP/de-only" "python3 -B '$root/experiment.py' phone '$root'"
          python3 -B scripts/youtube-de89-tls-controls-20261117.py
      - name: Always remove temporary queue rules and retrieve quality checked capture
        if: always()
        run: |
          set -Eeuo pipefail
          root="/run/mnebydns-synsplit-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          "$RUNNER_TEMP/de-only" "python3 -B '$root/experiment.py' cleanup '$root'; timeout 160s bash -c 'while systemctl is-active --quiet mnebydns-synsplit-capture-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.service; do sleep 5; done'; cat '$root/capture.log'; grep -q 'TARGET_CAPTURE_NO_SERVER_CHANGES=true' '$root/capture.log'; ! grep -q 'RuntimeError' '$root/capture.log'"
