name: Verify MNEBYDNS reconciled stable snapshot is consistent (read-only)
on:
  push:
    branches: [fix/mnebydns-safe-deploy-review-20261116]
    paths: ['.github/workflows/mnebydns-stable-checkpoint-reconcile-20261116.yml']
permissions: {contents: read}
concurrency:
  group: mnebydns-google-public-443-change
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify new stable pointer and active services without writes
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/mnebydns_stable_checkpoint_reconcile_20261116.py
          test -n "$DE_PASS"
          if ! command -v sshpass >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass >/dev/null
          fi
          opts=(-T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts"
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR)
          mkdir -p output
          SSHPASS="$DE_PASS" sshpass -e ssh "${opts[@]}" root@89.125.90.101 \
            'python3 -B - inspect' < scripts/mnebydns_stable_checkpoint_reconcile_20261116.py > output/stable.json
          python3 - <<'PY'
          import json
          x=json.load(open("output/stable.json"))
          assert x["read_only"] and x["live_matches_expected"] and x["already_reconciled"]
          print("MNEBYDNS_STABLE_CHECKPOINT_RECONCILED="+json.dumps(x,sort_keys=True,separators=(",",":")))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mnebydns-stable-checkpoint-review
          path: output/stable.json
          retention-days: 7
          if-no-files-found: warn
