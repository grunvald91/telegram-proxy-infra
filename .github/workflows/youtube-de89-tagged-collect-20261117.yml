name: Collect tagged phone receipt and compare identical external TLS probes
on:
  push:
    branches: [diag/youtube-de89-tagged-collect-20261117]
    paths:
      - .github/workflows/youtube-de89-tagged-collect-20261117.yml
      - scripts/youtube-de89-tagged-receipt-20261117.py
permissions: {contents: read}
concurrency:
  group: mnebydns-youtube-tagged-collect
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Validate existing parser and prepare pinned SSH
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/youtube-de89-tagged-receipt-20261117.py scripts/termux-youtube-tcpinfo-20261117.py
          test -n "$DE_PASS" && test -s ops/mnebydns-owner-ssh-known_hosts
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          cat > "$RUNNER_TEMP/de-phone" <<'SHELL'
          #!/bin/bash
          set -Eeuo pipefail
          export SSHPASS="$DE_PASS"
          exec sshpass -e ssh -T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=5 -o ServerAliveCountMax=3 -o HostKeyAlgorithms=ssh-ed25519 \
            -o "UserKnownHostsFile=$GITHUB_WORKSPACE/ops/mnebydns-owner-ssh-known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR \
            root@89.125.90.101 "$@"
          SHELL
          chmod 700 "$RUNNER_TEMP/de-phone"
      - name: Retrieve tagged phone observations and original TCP queue state
        run: |
          set -Eeuo pipefail
          "$RUNNER_TEMP/de-phone" "cat /run/mnebydns-tagged-44055865615-1/result.log; systemctl is-active mnebydns-tagged-44055865615-1.service; cat /proc/net/netfilter/nfnetlink_queue"
      - name: Run identical TLS and TCP_INFO script from the external control
        run: |
          set -Eeuo pipefail
          python3 -B scripts/termux-youtube-tcpinfo-20261117.py
      - name: Retrieve control correlations
        run: |
          set -Eeuo pipefail
          "$RUNNER_TEMP/de-phone" "cat /run/mnebydns-tagged-44055865615-1/result.log"
