name: Owner Telemt public TCP route audit (read-only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/mnebyvpn-owner-telemt-route-audit.yml']
  pull_request:
    branches: [main]
    paths: ['.github/workflows/mnebyvpn-owner-telemt-route-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      RU_PASS: ${{ secrets.SERVER188_SSH_PASSWORD }}
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Test external TCP connection only, not Telegram session
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import socket
          for key,host,port in [
            ('direct_telemt_89_9446','89.125.90.101',9446),
            ('ru_edge_188_8443','188.120.254.223',8443),
            ('ru_edge_188_9446','188.120.254.223',9446)]:
            success=0
            for n in range(3):
              try:
                with socket.create_connection((host,port),timeout=5):
                  success+=1
              except OSError: pass
            print(key+'_tcp_successes='+str(success)+'/3')
          PY
      - name: Check live Telemt listener and Russian route mapping safely
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$RU_PASS" && test -n "$DE_PASS"
          test -s ops/mnebydns-owner-ssh-known_hosts
          sudo apt-get update -qq && sudo apt-get install -qq -y sshpass >/dev/null
          opts=(-T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes
            -o HostKeyAlgorithms=ssh-ed25519
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts"
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR)
          export SSHPASS="$DE_PASS"
          sshpass -e ssh "${opts[@]}" root@89.125.90.101 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          systemctl is-active --quiet telemt-direct-ozon
          if ss -H -lnt 'sport = :9446' | grep -q .; then echo 'de_direct_telemt_listener=yes';else echo 'de_direct_telemt_listener=no';fi
          if grep -Eq '^[[:space:]]*tls_domain[[:space:]]*=[[:space:]]*"xapi[.]ozon[.]ru"' /etc/telemt/direct-ozon.toml; then
            echo 'de_telemt_fake_tls_domain=verified'
          else echo 'de_telemt_fake_tls_domain=unverified';fi
          REMOTE
          export SSHPASS="$RU_PASS"
          sshpass -e ssh "${opts[@]}" root@188.120.254.223 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          if ss -H -lnt 'sport = :9446' | grep -q .;then echo 'ru_9446_listener=yes';else echo 'ru_9446_listener=no';fi
          if ss -H -lnt 'sport = :8443' | grep -q .;then echo 'ru_8443_listener=yes';else echo 'ru_8443_listener=no';fi
          if nginx -t >/dev/null 2>&1;then echo 'ru_nginx_syntax=valid';else echo 'ru_nginx_syntax=invalid';fi
          if nginx -T 2>/dev/null | grep -E '^[[:space:]]*(server|proxy_pass|listen)' | grep -Fq '89.125.90.101:9446';then
            echo 'ru_direct_proxy_upstream_9446=found'
          else echo 'ru_direct_proxy_upstream_9446=not_confirmed';fi
          REMOTE
