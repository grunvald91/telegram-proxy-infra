# Manual-only NEW VPS preflight, identity, install or isolated empty VPN canary.
name: MNEBYVPN NEW VPS bootstrap (old production untouched)
on:
  workflow_dispatch:
    inputs:
      host:
        description: SSH host of new VPS (not production)
        required: true
        type: string
      node_id:
        description: Unique lowercase ID
        required: true
        type: string
      advertise_host:
        description: New node FQDN
        required: true
        type: string
      mode:
        description: Preflight, staged inventory, or unique identity after stage
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - stage
          - identity
          - components_check
          - dns_proxy_stage
          - hostname_migrate
          - tls_issue
          - tls_verify
          - dot_local_canary
          - awg_install
          - awg_canary
          - components_install
          - prepare_all
          - vpn_stage_auto
          - vpn_stage
          - supervisor_install
          - supervisor_canary
      xray_sha256:
        description: Preverified SHA256 of pinned Xray (vpn_stage and supervisor modes)
        required: false
        type: string
      controller_public_sha256:
        description: Independently pinned SHA256 of controller Ed25519 public SPKI (supervisor modes)
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: mnebyvpn-new-node-${{ inputs.node_id }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      INPUT_HOST: ${{ inputs.host }}
      NODE_ID: ${{ inputs.node_id }}
      ADVERTISE_HOST: ${{ inputs.advertise_host }}
      MODE: ${{ inputs.mode }}
      XRAY_SHA256: ${{ inputs.xray_sha256 }}
      CONTROLLER_PUBLIC_SHA256: ${{ inputs.controller_public_sha256 }}
      CONTROLLER_PUBLIC_B64: ${{ secrets.MNEBYVPN_CONTROLLER_ACCESS_PUB_SPKI_B64 }}
      NEW_NODE_SSH_USER: ${{ secrets.MNEBYVPN_NEW_NODE_SSH_USER }}
      SSHPASS: ${{ secrets.MNEBYVPN_NEW_NODE_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate remote target and create non-secret spec
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          # Credentials are read only from this repository's Actions secrets.
          test -n "$SSHPASS" || { echo '::error::Missing MNEBYVPN_NEW_NODE_SSH_PASSWORD'; exit 2; }
          [[ "$NEW_NODE_SSH_USER" == root ]] || {
            echo '::error::MNEBYVPN_NEW_NODE_SSH_USER must be root for this bootstrap'; exit 2;
          }
          # Password-only bootstrap is initially allowed only for this isolated test VPS.
          [[ "$INPUT_HOST" == '217.11.167.91' ]] || {
            echo '::error::Password transport restricted to approved test VPS'; exit 2;
          }
          [[ "$INPUT_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          test "$INPUT_HOST" != '89.125.90.101'
          test "$INPUT_HOST" != '188.120.254.223'
          [[ "$NODE_ID" =~ ^[a-z0-9][a-z0-9-]{2,39}$ ]]
          # Customer-facing country hostnames must never carry test identifiers.
          [[ "$ADVERTISE_HOST" =~ ^[a-z]{2}\.mnebyvpn\.site$ ]] || {
            echo '::error::Use the canonical xx.mnebyvpn.site country address'; exit 2;
          }
          [[ "$ADVERTISE_HOST" == 'fi.mnebyvpn.site' ]] || {
            echo '::error::Approved FI test IP is reserved for fi.mnebyvpn.site'; exit 2;
          }
          [[ "$MODE" == 'preflight' || "$MODE" == 'stage' || "$MODE" == 'identity' || "$MODE" == 'components_check' || "$MODE" == 'dns_proxy_stage' || "$MODE" == 'hostname_migrate' || "$MODE" == 'tls_issue' || "$MODE" == 'tls_verify' || "$MODE" == 'dot_local_canary' || "$MODE" == 'awg_install' || "$MODE" == 'awg_canary' || "$MODE" == 'components_install' || "$MODE" == 'prepare_all' || "$MODE" == 'vpn_stage_auto' || "$MODE" == 'vpn_stage' || "$MODE" == 'supervisor_install' || "$MODE" == 'supervisor_canary' ]]
          if [[ "$MODE" == 'vpn_stage' || "$MODE" == 'supervisor_install' || "$MODE" == 'supervisor_canary' ]]; then
            [[ "$XRAY_SHA256" =~ ^[a-f0-9]{64}$ ]] || {
              echo '::error::Supervisor/Xray staging requires a preverified SHA256'; exit 2;
            }
          fi
          # Resolve once and pin this IP for every SSH/SCP connection.
          # Host keys are TOFU (accept-new) within this ephemeral Actions run;
          # they are NOT independently verified or persistent across runs.
          target_ip="$(python3 nodekit/resolve_new_vps.py "$INPUT_HOST")"
          printf 'TARGET_IP=%s\n' "$target_ip" >> "$GITHUB_ENV"
          mkdir -m 700 -p "$RUNNER_TEMP/nodekit-credentials"
          : > "$RUNNER_TEMP/nodekit-credentials/known_hosts"
          chmod 600 "$RUNNER_TEMP/nodekit-credentials/known_hosts"
          if [[ "$MODE" == 'supervisor_install' || "$MODE" == 'supervisor_canary' ]]; then
            [[ "$CONTROLLER_PUBLIC_SHA256" =~ ^[a-f0-9]{64}$ ]]
            test -n "$CONTROLLER_PUBLIC_B64"
            python3 - <<'PY'
          import base64,hashlib,os,pathlib,re
          data=os.environ["CONTROLLER_PUBLIC_B64"].strip()
          if not re.fullmatch(r"[A-Za-z0-9+/]+={0,2}",data):
              raise SystemExit("Invalid controller public key encoding")
          raw=base64.b64decode(data,validate=True)
          if len(raw)!=44 or raw[:12]!=bytes.fromhex("302a300506032b6570032100"):
              raise SystemExit("Not a controller Ed25519 SPKI DER public key")
          if hashlib.sha256(raw).hexdigest()!=os.environ["CONTROLLER_PUBLIC_SHA256"]:
              raise SystemExit("Controller public key does not match pinned SHA256")
          path=pathlib.Path(os.environ["RUNNER_TEMP"])/"nodekit-credentials"/"controller-access.spki"
          fd=os.open(path,os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600)
          with os.fdopen(fd,"wb") as file:file.write(raw)
          PY
          fi
          python3 - <<'PY'
          import json, os, pathlib
          data = {
              "schema_version": 1,
              "node_id": os.environ["NODE_ID"],
              "role": "combined",
              "services": ["dns", "vpn", "sni-proxy", "tunnel"],
              "advertise_host": os.environ["ADVERTISE_HOST"],
              "listeners": {
                  "dot_tcp": 853, "vpn_tcp": 2053, "sni_tcp": 443,
                  "tunnel_udp": 51820
              }
          }
          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "nodekit-credentials" / "spec.json"
          path.write_text(json.dumps(data))
          PY
      - name: Install password SSH transport on ephemeral runner
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
      - name: Transfer staged tools and run remote preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          known="$RUNNER_TEMP/nodekit-credentials/known_hosts"
          target="$NEW_NODE_SSH_USER@$INPUT_HOST"
          ssh_opts=(
            -o PubkeyAuthentication=no
            -o PreferredAuthentications=password,keyboard-interactive
            -o NumberOfPasswordPrompts=1
            -o StrictHostKeyChecking=accept-new
            -o UserKnownHostsFile="$known"
            -o HostName="$TARGET_IP"
            -o HostKeyAlias="$INPUT_HOST"
            -o ConnectTimeout=12
            -o ServerAliveInterval=20
            -o ServerAliveCountMax=15
          )
          remote_ssh() { sshpass -e ssh "${ssh_opts[@]}" "$target" "$@"; }
          remote_scp() { sshpass -e scp "${ssh_opts[@]}" "$@"; }

          remote_dir="$(remote_ssh 'umask 077; mktemp -d /tmp/mnebyvpn-nodekit.XXXXXXXX')"
          [[ "$remote_dir" =~ ^/tmp/mnebyvpn-nodekit\.[a-zA-Z0-9]{8}$ ]]
          cleanup() {
            remote_ssh "rm -rf -- '$remote_dir'" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          remote_scp nodekit/nodekit.py nodekit/identity.py nodekit/install_components.py nodekit/dns_proxy_stage.py nodekit/hostname_migrate.py nodekit/dot_local_canary.py nodekit/awg_lifecycle.py nodekit/tls_stage.py nodekit/provision_node.py nodekit/vpn_stage.py \
            nodekit/vpn_supervisor.py nodekit/install_supervisor.py nodekit/forward_command.py \
            nodekit/systemd/mnebyvpn-nodekit-vpn@.service.example \
            "$RUNNER_TEMP/nodekit-credentials/spec.json" "$target:$remote_dir/"
          if [[ "$MODE" == 'supervisor_install' || "$MODE" == 'supervisor_canary' ]]; then
            remote_scp "$RUNNER_TEMP/nodekit-credentials/controller-access.spki" \
              "$target:$remote_dir/"
          fi
          if [[ "$MODE" == 'identity' ]]; then
            remote_ssh "python3 '$remote_dir/identity.py' --node-id '$NODE_ID'"
          elif [[ "$MODE" == 'hostname_migrate' ]]; then
            [[ "$NODE_ID" == 'fi-test-01' ]] || {
              echo '::error::Host migration only approved for the existing isolated FI staging node'; exit 2;
            }
            remote_ssh "python3 '$remote_dir/hostname_migrate.py' --node-id '$NODE_ID'"
          elif [[ "$MODE" == 'awg_install' || "$MODE" == 'awg_canary' ]]; then
            if [[ "$MODE" == 'awg_install' ]]; then awg_mode=install; else awg_mode=canary; fi
            remote_ssh "python3 '$remote_dir/awg_lifecycle.py' --node-id '$NODE_ID' --mode '$awg_mode'"
          elif [[ "$MODE" == 'dot_local_canary' ]]; then
            remote_ssh "python3 '$remote_dir/dot_local_canary.py' --node-id '$NODE_ID' --host '$ADVERTISE_HOST' --expected-ipv4 '$TARGET_IP'"
          elif [[ "$MODE" == 'tls_issue' || "$MODE" == 'tls_verify' ]]; then
            cert_mode=verify
            if [[ "$MODE" == 'tls_issue' ]]; then
              cert_mode=issue
              # Only the isolated new VPS may install the distro ACME client.
              remote_ssh "command -v certbot >/dev/null || (export DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l; apt-get update -qq && apt-get install -y -qq --no-install-recommends certbot >/dev/null)"
            fi
            remote_ssh "python3 '$remote_dir/tls_stage.py' --node-id '$NODE_ID' --host '$ADVERTISE_HOST' --expected-ipv4 '$TARGET_IP' --mode '$cert_mode'"
            if [[ "$MODE" == 'tls_issue' ]]; then
              remote_ssh "systemctl enable --now certbot.timer"
            fi
          elif [[ "$MODE" == 'dns_proxy_stage' ]]; then
            remote_ssh "python3 '$remote_dir/dns_proxy_stage.py' --node-id '$NODE_ID' --external-ipv4 '$TARGET_IP' --dns-host '$ADVERTISE_HOST'"
          elif [[ "$MODE" == 'components_check' || "$MODE" == 'components_install' ]]; then
            component_mode=check
            if [[ "$MODE" == 'components_install' ]]; then component_mode=install; fi
            remote_ssh "python3 '$remote_dir/install_components.py' --node-id '$NODE_ID' --mode '$component_mode'"
          elif [[ "$MODE" == 'prepare_all' ]]; then
            remote_ssh "python3 '$remote_dir/provision_node.py' --spec '$remote_dir/spec.json' --source-dir '$remote_dir'"
          elif [[ "$MODE" == 'vpn_stage_auto' ]]; then
            # The manifest hash was generated from a SHA256-pinned official release.
            # vpn_stage independently hashes the installed binary before use.
            binary_hash="$(remote_ssh "python3 -c 'import json; from pathlib import Path; print(json.loads(Path(\"/var/lib/mnebyvpn-nodekit/$NODE_ID/components-manifest.json\").read_text())[\"binaries\"][\"xray\"][\"sha256\"])'")"
            [[ "$binary_hash" =~ ^[0-9a-f]{64}$ ]] || { echo '::error::Missing pinned Xray binary'; exit 2; }
            remote_ssh "python3 '$remote_dir/vpn_stage.py' --node-id '$NODE_ID' --xray /opt/xray/xray --xray-sha256 '$binary_hash'"
          elif [[ "$MODE" == 'vpn_stage' ]]; then
            remote_ssh "python3 '$remote_dir/vpn_stage.py' --node-id '$NODE_ID' --xray /opt/xray/xray --xray-sha256 '$XRAY_SHA256'"
          elif [[ "$MODE" == 'supervisor_install' || "$MODE" == 'supervisor_canary' ]]; then
            install_mode=install
            if [[ "$MODE" == 'supervisor_canary' ]]; then install_mode=canary; fi
            remote_ssh "python3 '$remote_dir/install_supervisor.py' --node-id '$NODE_ID' --source-dir '$remote_dir' --controller-public '$remote_dir/controller-access.spki' --controller-public-sha256 '$CONTROLLER_PUBLIC_SHA256' --xray /opt/xray/xray --xray-sha256 '$XRAY_SHA256' --mode '$install_mode'"
          else
            remote_ssh "python3 '$remote_dir/nodekit.py' '$MODE' --spec '$remote_dir/spec.json'"
          fi
          echo "The new VPS is NOT published in subscriptions; success does not imply end-to-end readiness."
