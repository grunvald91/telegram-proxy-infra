name: One-shot read-only check for unowned DNS hostname in live configuration
on:
  push:
    branches: ['fix/remove-unowned-domain-20261114']
    paths: ['.github/workflows/review-live-hostname-20261114.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RUPASS: ${{ secrets.SERVER188_SSH_PASSWORD }}
      DEPASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - name: Inspect allowlisted configuration file paths on two VPS, never print file contents
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$RUPASS" && test -n "$DEPASS"
          command -v sshpass >/dev/null || { sudo apt-get update -qq; sudo apt-get install -qq -y sshpass; }
          TMP=$(mktemp -d)
          trap 'rm -rf "$TMP"' EXIT
          cat > "$TMP/inspect.py" <<'PY'
          import os,sys,pathlib
          roots=['/etc/nginx','/etc/mnebydns','/etc/mnebyvpn','/etc/systemd/system','/opt/mnebydns-dot','/opt/xray','/opt/mnebyvpn']
          excluded={'backups','backup','logs','state','data','node_modules','.git','.cache','certs','private','secrets'}
          suffixes={'.conf','.cfg','.service','.sh','.py','.json','.yaml','.yml','.toml','.env','.txt','.ini','.xml'}
          names={'Corefile','Caddyfile','nginx.conf'}
          total=0
          hits=[]
          for root in roots:
            if not os.path.isdir(root):continue
            for directory,subdirs,files in os.walk(root,followlinks=False):
              subdirs[:]=[x for x in subdirs if x not in excluded]
              for filename in files:
                path=pathlib.Path(directory)/filename
                if path.suffix not in suffixes and filename not in names:continue
                try:
                  if not path.is_file() or path.stat().st_size>1048576:continue
                  total+=1
                  with path.open('rb') as stream:blob=stream.read(1048577)
                  if b'myvpn' in blob.lower():hits.append(str(path))
                except (PermissionError,OSError):continue
          print('inspected_configuration_files='+str(total))
          print('matched_configuration_files='+str(len(hits)))
          for p in hits[:30]:print('matched_path='+p)
          print('live_scan_read_only_complete=true')
          PY
          for target in ru de; do
            if [[ "$target" == ru ]]; then export SSHPASS="$RUPASS"; HOST=188.120.254.223; else export SSHPASS="$DEPASS"; HOST=89.125.90.101; fi
            echo "node=$target"
            sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=accept-new -o LogLevel=ERROR "root@$HOST" 'python3 -' < "$TMP/inspect.py"
          done
