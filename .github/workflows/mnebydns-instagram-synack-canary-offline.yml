name: MNEBYDNS Instagram SYN-ACK canary offline checks
on:
  pull_request:
    paths:
      - 'scripts/mnebydns_synack_window_canary.py'
      - 'scripts/mnebydns_instagram_queue210_synack_ab.py'
      - 'scripts/mnebydns_ig_queue210_codespace_ab.sh'
      - 'scripts/tests/test_mnebydns_instagram_queue210_ab.py'
      - 'scripts/tests/integration_mnebydns_ig_queue210_ab_netns.sh'
      - 'scripts/mnebydns_nfqws_synack_guard_render.py'
      - 'scripts/mnebydns_nfqws_guard_stage.py'
      - 'scripts/mnebydns_nfqws_guard_live_canary.py'
      - 'scripts/tests/test_mnebydns_nfqws_guard_live_canary.py'
      - 'scripts/tests/test_mnebydns_nfqws_synack_guard_render.py'
      - 'scripts/tests/integration_mnebydns_nfqws_guard_restart_netns.sh'
      - 'scripts/tests/integration_mnebydns_nfqws_guard_real_tcp_netns.sh'
      - 'scripts/mnebydns_synack_netns_probe.py'
      - 'scripts/mnebydns_instagram_ru_readonly_preflight.py'
      - 'scripts/mnebydns_instagram_ru_ingress_reach.sh'
      - 'scripts/tests/test_mnebydns_instagram_ru_ingress_guard.py'
      - 'scripts/tests/test_mnebydns_instagram_ru_readonly_preflight.py'
      - 'scripts/tests/integration_mnebydns_synack_netns.sh'
      - 'scripts/mnebydns_synack_listener.py'
      - 'scripts/mnebydns_nfq_failopen.py'
      - 'scripts/mnebydns-synack-window-canary.sh'
      - 'scripts/tests/test_mnebydns_synack_window_canary.py'
      - 'scripts/tests/test_mnebydns_nfq_failopen.py'
      - 'scripts/tests/test_mnebydns_synack_guardrails.py'
      - '.github/workflows/mnebydns-instagram-synack-canary-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Offline canary tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_mnebydns*.py' -v
      - name: Bash syntax
        run: bash -n scripts/mnebydns-synack-window-canary.sh scripts/mnebydns_instagram_ru_ingress_reach.sh scripts/mnebydns_ig_queue210_codespace_ab.sh
      - name: Python syntax
        run: python3 -m py_compile scripts/mnebydns_synack_window_canary.py scripts/mnebydns_synack_listener.py scripts/mnebydns_nfq_failopen.py scripts/mnebydns_synack_netns_probe.py scripts/mnebydns_instagram_ru_readonly_preflight.py scripts/mnebydns_instagram_queue210_synack_ab.py scripts/mnebydns_nfqws_synack_guard_render.py scripts/mnebydns_nfqws_guard_stage.py scripts/mnebydns_nfqws_guard_live_canary.py
  kernel-netns:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated kernel test requirements
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq iproute2 iptables tcpdump ethtool libnetfilter-queue1
      - name: Run real TCP SYN-ACK NFQUEUE test only inside network namespaces
        run: sudo bash scripts/tests/integration_mnebydns_synack_netns.sh
      - name: Verify nft queue210 SYN-ACK bypass grammar and exact handle removal in netns
        run: sudo bash scripts/tests/integration_mnebydns_ig_queue210_ab_netns.sh
      - name: Verify queue210 generator survives simulated nfqws service restart
        run: sudo bash scripts/tests/integration_mnebydns_nfqws_guard_restart_netns.sh
      - name: Verify strict per-peer guard counts actual SYN-ACK in veth namespaces
        run: sudo bash scripts/tests/integration_mnebydns_nfqws_guard_real_tcp_netns.sh
