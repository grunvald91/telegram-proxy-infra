name: Reopen owner QUIC window for thirty minutes
on:
  push:
    branches: [diag/youtube-de89-h3-reopen-20261117]
    paths:
      - .github/workflows/youtube-de89-h3-reopen-20261117.yml
      - scripts/youtube-de89-owner-return-bypass-20261117.py
permissions: {contents: read}
concurrency:
  group: mnebydns-youtube-h3-reopen
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Validate existing parser and prepare pinned SSH
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/youtube-de89-owner-return-bypass-20261117.py scripts/termux-youtube-libcurl-20261117.py
          test -n "$DE_PASS" && test -s ops/mnebydns-owner-ssh-known_hosts
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          cat > "$RUNNER_TEMP/de-phone" <<'SHELL'
          #!/bin/bash
          set -Eeuo pipefail
          export SSHPASS="$DE_PASS"
          exec sshpass -e ssh -T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=5 -o ServerAliveCountMax=3 -o HostKeyAlgorithms=ssh-ed25519 \
            -o "UserKnownHostsFile=$GITHUB_WORKSPACE/ops/mnebydns-owner-ssh-known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR \
            root@89.125.90.101 "$@"
          SHELL
          chmod 700 "$RUNNER_TEMP/de-phone"
      - name: Verify previous expiry and reuse verified isolated relay dependencies
        run: |
          set -Eeuo pipefail
          python3 -m venv "$RUNNER_TEMP/h3-control"
          timeout 60s "$RUNNER_TEMP/h3-control/bin/pip" -q install aioquic==1.2.0
          "$RUNNER_TEMP/de-phone" 'python3 -B -' <<'PYTHON'
          import json,subprocess
          def out(args):return subprocess.run(args,capture_output=True,text=True,timeout=10).stdout
          rules=out(['iptables','-S','INPUT'])
          left='MNEBYDNS_H3_OWNER_CANARY_20261117' in rules
          print('PREVIOUS_CANARY_RULE_PRESENT='+json.dumps(left))
          assert not left,'PREVIOUS_WINDOW_DID_NOT_EXPIRE'
          state=out(['systemctl','is-active','mnebydns-h3-canary-44093598240-1.service']).strip()
          print('PREVIOUS_CANARY_SERVICE='+state);assert state=='inactive'
          journal=out(['journalctl','-u','mnebydns-h3-clean-44093598240-1.service','--no-pager','-o','cat'])
          print('PREVIOUS_AUTOMATIC_CLEANUP_CONFIRMED='+json.dumps('H3_CANARY_REMOVED=true' in journal))
          assert 'H3_CANARY_REMOVED=true' in journal
          PYTHON
          root="/opt/mnebydns-h3-origin-diag-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          old=/opt/mnebydns-h3-origin-diag-44093598240-1
          "$RUNNER_TEMP/de-phone" "umask 077; test -d '$old/deps'; test -s '$old/relay.py'; mkdir '$root'; cp -a '$old/deps' '$root/deps'; cp '$old/relay.py' '$root/relay.py'"
          "$RUNNER_TEMP/de-phone" "cat > '$root/canary.py'" < scripts/youtube-de89-h3-reopen-20261117.py
          "$RUNNER_TEMP/de-phone" "python3 -B '$root/canary.py' apply '$root'"
      - name: Verify reopened public HTTP3 and leave phone window ready
        run: |
          set -Eeuo pipefail
          "$RUNNER_TEMP/h3-control/bin/python" - <<'PYTHON'
          import asyncio,runpy
          probe=runpy.run_path('scripts/youtube-de89-h3-origin-20261117.py')['probe']
          async def main():
              rows=await asyncio.gather(*(probe(t,('89.125.90.101',443)) for t in [
                {'label':'api','url':'https://youtubei.googleapis.com/'},
                {'label':'phone_cdn','url':'https://rr1---sn-gxuo03g-ig3s.googlevideo.com/'}]))
              assert all(r.get('tls_verified') and 100<=r.get('status',0)<=599 for r in rows),'REOPENED_PUBLIC_H3_FAILED'
              print('REOPENED_PUBLIC_H3_CERT_AND_HTTP_VERIFIED=true')
          asyncio.run(main())
          PYTHON
          root="/opt/mnebydns-h3-origin-diag-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          "$RUNNER_TEMP/de-phone" "touch '$root/KEEP_CANARY'; echo PHONE_H3_WINDOW_READY=true"
      - name: Restore immediately if reopening failed
        if: always()
        run: |
          set -Eeuo pipefail
          root="/opt/mnebydns-h3-origin-diag-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          "$RUNNER_TEMP/de-phone" "if test -f '$root/KEEP_CANARY'; then echo OWNER_H3_30_MINUTE_WINDOW_READY=true; elif test -f '$root/canary.py'; then python3 -B '$root/canary.py' clean '$root'; fi"
