name: MNEBYDNS production DoT file group recovery 2026-11-16
on:
  push:
    branches: [audit/smartdns-installed-review-20261115]
    paths: ['.github/workflows/mnebydns-dot-corefile-group-repair-20261116.yml']
permissions: {contents: read}
concurrency:
  group: mnebydns-google-public-443-change
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Restore CoreDNS Corefile supplementary group and restart only DoT
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$DE_PASS"
          python3 -m py_compile scripts/mnebydns-dot-corefile-group-repair-20261116.py
          if ! command -v sshpass >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass >/dev/null
          fi
          opts=(-T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts"
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR)
          mkdir -p output
          SSHPASS="$DE_PASS" sshpass -e ssh "${opts[@]}" root@89.125.90.101 'python3 -B -' < scripts/mnebydns-dot-corefile-group-repair-20261116.py | tee output/recovery.json
          python3 - <<'PY'
          import json
          j=json.load(open('output/recovery.json'))
          assert j.get('done') and j.get('dns_active') and j.get('tcp853_listening')
          assert j.get('changed_dns_bytes') is False
          print('CORE_DOT_TCP853_RESTORED=true')
          print('CUSTOMER_DNS_ROUTES_UNCHANGED=true')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dot-corefile-reader-group-recovery
          path: output/recovery.json
          retention-days: 14
          if-no-files-found: warn
