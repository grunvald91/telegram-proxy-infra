name: Inspect MNEBYVPN Xray canary config regeneration source (read-only)
on:
  push:
    branches: [fix/mnebydns-vpn-dns-sniff-20261115]
    paths: [.github/workflows/mnebydns-xray-sniff-source-inspect-20261115.yml]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Review running config and provisioner writer without secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$DE_PASS"
          test -s ops/mnebydns-owner-ssh-known_hosts
          sudo apt-get update -qq && sudo apt-get install -qq -y sshpass >/dev/null
          opts=(-T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts" -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR)
          SSHPASS="$DE_PASS" sshpass -e ssh "${opts[@]}" root@89.125.90.101 'python3 -' <<'PY'
          import pathlib,re,hashlib,json,ast,subprocess
          f=pathlib.Path('/opt/mnebyvpn/vpn-provisioner.py')
          lines=f.read_text().splitlines()
          print('SRC_SHA='+hashlib.sha256(f.read_bytes()).hexdigest())
          print('SRC_LINES='+str(len(lines)))
          def clean(l):
            l=re.sub(r'("(?:[^"\\]|\\.)*"|\x27(?:[^\x27\\]|\\.)*\x27)', '[str]',l)
            return l[:220]
          for a,b in ((1,125),(126,235),(236,340)):
            for i in range(a-1,min(b,len(lines))):
              line=lines[i]
              if any(x in line.lower() for x in ('conf','xray','json','inbound','listen','sniff','reality','write','service','restart','atomic','subprocess','def ','return','source','template')):
                print('SRC_'+str(i+1)+'='+clean(line))
          active=json.loads(pathlib.Path('/etc/mnebyvpn/xray-canary.json').read_text())
          print('ACTIVE_CONFIG_SHA='+hashlib.sha256(pathlib.Path('/etc/mnebyvpn/xray-canary.json').read_bytes()).hexdigest())
          for i,z in enumerate(active.get('inbounds',[])):
            print('ACTIVE_INBOUND_'+str(i)+'='+repr({k:z.get(k) for k in ('tag','protocol','port','sniffing')}))
          print('ACTIVE_ROUTING_DOMSTRAT='+str(active.get('routing',{}).get('domainStrategy')))
          print('ACTIVE_OUTBOUND_PROTOCOLS='+repr([o.get('protocol') for o in active.get('outbounds',[])]))
          for k in ('xray.service','mnebyvpn-vpn-provisioner.service'):
            p=subprocess.run(['systemctl','is-active',k],capture_output=True,text=True)
            print('UNIT_'+k+'='+p.stdout.strip())
          print('INSPECT_DONE=true')
          PY
