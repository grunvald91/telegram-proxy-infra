name: FI canonical canonical FI repeated setup dispatcher (one-off)
on:
  push:
    branches: [feat/nodekit-fi-host-20261117]
    paths:
      - .github/workflows/nodekit-fi-host-migrate-once.yml
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    if: github.repository == 'grunvald91/telegram-proxy-infra'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify repeatable Nodekit prepare_all using canonical FI hostname
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh api --method POST \
            repos/grunvald91/telegram-proxy-infra/actions/workflows/nodekit-prepare-new-vps.yml/dispatches \
            -f ref=main \
            -f "inputs[host]=217.11.167.91" \
            -f "inputs[node_id]=fi-test-01" \
            -f "inputs[advertise_host]=fi.mnebyvpn.site" \
            -f "inputs[mode]=prepare_all"
