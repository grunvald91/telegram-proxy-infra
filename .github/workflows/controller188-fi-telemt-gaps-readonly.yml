name: Existing RU188 / DE89 enrollment and Telemt gap check (read only)
"on":
  push:
    branches: [main]
    paths: ['.github/workflows/controller188-fi-telemt-gaps-readonly.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      RU_PASS: ${{ secrets.SERVER188_SSH_PASSWORD }}
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify existing pinned SSH host keys
        run: |
          set -euo pipefail
          test -n "$RU_PASS" && test -n "$DE_PASS"
          test -s ops/mnebydns-owner-ssh-known_hosts
          grep -q '^188\.120\.254\.223 ssh-ed25519 ' ops/mnebydns-owner-ssh-known_hosts
          grep -q '^89\.125\.90\.101 ssh-ed25519 ' ops/mnebydns-owner-ssh-known_hosts
          sudo apt-get update -qq && sudo apt-get install -qq -y sshpass >/dev/null
      - name: Audit existing controller188 host runtime, FI grant trust and canonical DB
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$RU_PASS"
          sshpass -e ssh -T -F /dev/null -o ConnectTimeout=12 -o BatchMode=no \
            -o PasswordAuthentication=yes -o PubkeyAuthentication=no \
            -o KbdInteractiveAuthentication=no -o StrictHostKeyChecking=yes \
            -o HostKeyAlgorithms=ssh-ed25519 \
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no \
            -o ForwardAgent=no -o ClearAllForwardings=yes -o LogLevel=ERROR \
            root@188.120.254.223 'python3 -' <<'PY'
          import hashlib,json,pathlib,shutil,stat,subprocess
          p=pathlib.Path('/root/mnebyvpn-controller')
          def protected(n):
              try:
                  x=(p/n).lstat()
                  return stat.S_ISREG(x.st_mode) and x.st_uid==0 and x.st_mode&0o077==0
              except OSError:return False
          def execute(args):
              try:
                  r=subprocess.run(args,stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,text=True,timeout=8)
                  return r.returncode,r.stdout.strip()
              except Exception:return 255,''
          print('central_controller=188.120.254.223')
          print('node_runtime_on_host='+str(shutil.which('node') is not None).lower())
          for n in ('controller-signing-key.pem','controller-public.spki','fi-enrollment-ssh',
                    'fi-known_hosts','fi-node-public.spki'):
              print('trust_'+n.replace('.','_')+'='+str(protected(n)).lower())
          if protected('controller-public.spki'):
              print('controller_public_sha256='+hashlib.sha256((p/'controller-public.spki').read_bytes()).hexdigest())
          code,raw=execute(['docker','inspect','mnebyvpn-stage-postgres','--format','{{json .HostConfig.PortBindings}}'])
          if code==0:
              try:
                  bindings=json.loads(raw)
                  values=bindings.get('5432/tcp') if isinstance(bindings,dict) else None
                  hosts=[v.get('HostIp','') for v in values if isinstance(v,dict) and v.get('HostPort')] if isinstance(values,list) else []
                  print('host_postgres_port_mapped='+str(bool(hosts)).lower())
                  if not hosts: scope='none'
                  elif all(ip in ('127.0.0.1','::1') for ip in hosts): scope='loopback_only'
                  elif any(ip in ('','0.0.0.0','::') for ip in hosts): scope='wildcard'
                  else: scope='nonloopback'
                  print('host_postgres_port_binding_scope='+scope)
              except (TypeError,ValueError,AttributeError):print('host_postgres_port_mapped=unknown')
          else:print('host_postgres_port_mapped=unavailable')
          code,result=execute(['docker','exec','mnebyvpn-stage-postgres','psql','-AtX',
             '-v','ON_ERROR_STOP=1','-U','mnebyvpn_stage','-d','mnebyvpn_stage',
             '-c',"SELECT COALESCE((SELECT status FROM vpn_node_enrollment_inventory WHERE node_id='fi-test-01'),'absent')"])
          print('fi_inventory_status='+(result if code==0 and result in ('absent','planned','approved','enrolled','revoked') else 'unavailable'))
          print('controller_audit_read_only=true')
          PY
      - name: Audit existing DE89 Telemt direct-ozon, local admin and direct transport
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$DE_PASS"
          sshpass -e ssh -T -F /dev/null -o ConnectTimeout=12 -o BatchMode=no \
            -o PasswordAuthentication=yes -o PubkeyAuthentication=no \
            -o KbdInteractiveAuthentication=no -o StrictHostKeyChecking=yes \
            -o HostKeyAlgorithms=ssh-ed25519 \
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no \
            -o ForwardAgent=no -o ClearAllForwardings=yes -o LogLevel=ERROR \
            root@89.125.90.101 'python3 -' <<'PY'
          import subprocess
          def command(args):
              try:
                  x=subprocess.run(args,capture_output=True,text=True,timeout=7)
                  return x.returncode,x.stdout
              except Exception:return 255,''
          code,state=command(['systemctl','is-active','telemt-direct-ozon.service'])
          print('telemt_direct_ozon_service_active='+str(code==0 and state.strip()=='active').lower())
          code,raw=command(['ss','-lntH'])
          ports=set()
          if code==0:
              for line in raw.splitlines():
                  cols=line.split()
                  if len(cols)>=4:ports.add(cols[3])
          print('telemt_admin_127_0_0_1_9096_listening='+str('127.0.0.1:9096' in ports).lower())
          print('telemt_direct_9446_public_listening='+str('0.0.0.0:9446' in ports or '[::]:9446' in ports or '*:9446' in ports).lower())
          print('telegram_client_e2e_verified_here=false')
          print('telemt_audit_read_only=true')
          PY
