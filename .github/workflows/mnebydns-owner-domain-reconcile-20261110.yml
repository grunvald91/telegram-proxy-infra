name: "MNEBYDNS owner domain queue reconciler: guarded exact-host canary"
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mnebydns-owner-domain-reconcile-20261110.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - ".github/workflows/mnebydns-owner-domain-reconcile-20261110.yml"
      - "scripts/mnebydns-owner-domain-controller-20261110.py"
      - "scripts/mnebydns-owner-domain-render-20261110.py"
      - "scripts/mnebydns-owner-domain-stage-20261110.sh"
      - "scripts/mnebydns-owner-domain-remove-20261110.sh"
      - "scripts/mnebydns-owner-domain-confirm-20261110.sh"
      - "scripts/mnebydns-owner-domain-rollback-20261110.sh"
      - "scripts/tests/test_owner_domain_reconcile.py"
permissions:
  contents: read
concurrency:
  group: mnebydns-google-public-443-change
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Verify no arbitrary hostname and exact add/remove server syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/mnebydns-owner-domain-render-20261110.py scripts/mnebydns-owner-domain-controller-20261110.py
          python3 scripts/mnebydns-owner-domain-render-20261110.py self-test
          python3 scripts/mnebydns-owner-domain-controller-20261110.py self-test
          python3 -m unittest discover -s scripts/tests -p test_owner_domain_reconcile.py -v
          bash -n scripts/mnebydns-owner-domain-stage-20261110.sh scripts/mnebydns-owner-domain-remove-20261110.sh scripts/mnebydns-owner-domain-rollback-20261110.sh scripts/mnebydns-owner-domain-confirm-20261110.sh
          echo 'owner_domain_offline_gate=PASS'
  deploy:
    if: github.event_name != 'pull_request'
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 11
    env:
      RU_PASS: ${{ secrets.SERVER188_SSH_PASSWORD }}
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Strict cloud-queued owner-only domain state and reversible server transition
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$RU_PASS" && test -n "$DE_PASS"
          sudo apt-get update -qq && sudo apt-get install -qq -y sshpass >/dev/null
          python3 scripts/mnebydns-owner-domain-controller-20261110.py run
          echo 'owner_domain_worker_executed=true'
