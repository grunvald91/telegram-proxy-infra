name: Publish public iPhone DNS profile on relay89
on:
  push:
    branches: [main]
    paths: ['.github/workflows/mnebydns-ios-profile-publish-20261113.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mnebydns-ios-profile-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SSHPASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Publish validated Apple profile with rollback and HTTPS checks
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$SSHPASS"
          test -s ops/mnebydns-owner-ssh-known_hosts
          if ! command -v sshpass >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -qq -y sshpass >/dev/null
          fi
          sshpass -e ssh -T -o ConnectTimeout=10 -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR \
            root@89.125.90.101 'python3 -' <<'REMOTE_PY'
          import base64
          import hashlib
          import pathlib
          import plistlib
          import subprocess
          import time
          import urllib.request
          
          URL = 'https://cdn.servgo.ru/mnebyvpn-dns.mobileconfig'
          PROFILE_B64 = ''
          data = base64.b64decode(PROFILE_B64)
          profile = plistlib.loads(data)
          assert profile['PayloadContent'][0]['DNSSettings']['ServerName'] == 'dns.mnebyvpn.site'
          config = pathlib.Path('/etc/nginx/sites-enabled/cdn-servgo').resolve(strict=True)
          before = config.read_bytes()
          text = before.decode()
          anchor = 'listen 127.0.0.1:4453 ssl http2;'
          assert text.count(anchor) == 1, 'Expected one CDN TLS server'
          assert 'server_name cdn.servgo.ru;' in text
          assert 'location = /mnebyvpn-dns.mobileconfig' not in text, 'Profile location already exists; inspect before replacing'
          target = pathlib.Path('/var/www/cdn-servgo/mnebyvpn-dns.mobileconfig')
          assert target.parent.is_dir()
          assert not target.exists(), 'Profile already exists; inspect before replacing'
          snippet = '''
              # MNEBYVPN public Apple DNS profile
              location = /mnebyvpn-dns.mobileconfig {
                  alias /var/www/cdn-servgo/mnebyvpn-dns.mobileconfig;
                  types { }
                  default_type application/x-apple-aspen-config;
                  add_header Content-Disposition 'attachment; filename="mnebyvpn-dns.mobileconfig"' always;
                  add_header X-Content-Type-Options nosniff always;
              }
          '''
          def fetch(url):
              with urllib.request.urlopen(url, timeout=20) as response:
                  return response.read(), response.headers
          
          root_before, _ = fetch('https://cdn.servgo.ru/')
          backup = pathlib.Path('/var/backups/mnebyvpn-dns-profile-' + time.strftime('%Y%m%d-%H%M%S'))
          backup.mkdir(mode=0o700)
          (backup / 'cdn-servgo.before').write_bytes(before)
          changed = False
          try:
              target.write_bytes(data)
              target.chmod(0o644)
              index = text.index(anchor) + len(anchor)
              config.write_text(text[:index] + '\n' + snippet + text[index:])
              changed = True
              subprocess.run(['nginx', '-t'], check=True)
              subprocess.run(['systemctl', 'reload', 'nginx'], check=True)
              downloaded, headers = fetch(URL)
              assert downloaded == data, 'Downloaded profile differs'
              assert headers.get_content_type() == 'application/x-apple-aspen-config'
              assert 'mnebyvpn-dns.mobileconfig' in headers['Content-Disposition']
              root_after, _ = fetch('https://cdn.servgo.ru/')
              assert root_after == root_before, 'CDN homepage changed'
              subprocess.run(['systemctl', 'is-active', '--quiet', 'nginx'], check=True)
              print('PROFILE_URL=' + URL)
              print('PROFILE_SHA256=' + hashlib.sha256(data).hexdigest())
              print('PROFILE_MIME=' + headers.get_content_type())
              print('HOMEPAGE_UNCHANGED=true')
              print('CONFIG_BACKUP=' + str(backup))
          except BaseException:
              if changed:
                  config.write_bytes(before)
                  subprocess.run(['nginx', '-t'], check=True)
                  subprocess.run(['systemctl', 'reload', 'nginx'], check=True)
              target.unlink(missing_ok=True)
              raise
          REMOTE_PY
