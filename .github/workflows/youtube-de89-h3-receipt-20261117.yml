name: Read owner QUIC canary counters and receipt
on:
  push:
    branches: [diag/youtube-de89-h3-receipt-20261117]
    paths:
      - .github/workflows/youtube-de89-h3-receipt-20261117.yml
      - scripts/youtube-de89-owner-return-bypass-20261117.py
permissions: {contents: read}
concurrency:
  group: mnebydns-youtube-h3-receipt
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Validate existing parser and prepare pinned SSH
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/youtube-de89-owner-return-bypass-20261117.py scripts/termux-youtube-libcurl-20261117.py
          test -n "$DE_PASS" && test -s ops/mnebydns-owner-ssh-known_hosts
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          cat > "$RUNNER_TEMP/de-phone" <<'SHELL'
          #!/bin/bash
          set -Eeuo pipefail
          export SSHPASS="$DE_PASS"
          exec sshpass -e ssh -T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=5 -o ServerAliveCountMax=3 -o HostKeyAlgorithms=ssh-ed25519 \
            -o "UserKnownHostsFile=$GITHUB_WORKSPACE/ops/mnebydns-owner-ssh-known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR \
            root@89.125.90.101 "$@"
          SHELL
          chmod 700 "$RUNNER_TEMP/de-phone"
      - name: Collect private-peer-matched firewall and relay counters without changing the trial
        run: |
          set -Eeuo pipefail
          "$RUNNER_TEMP/de-phone" 'python3 -B -' <<'PYTHON'
          import json,pathlib,re,shlex,subprocess,time
          root=pathlib.Path('/opt/mnebydns-h3-origin-diag-44096073096-1')
          def out(args):return subprocess.run(args,capture_output=True,text=True,timeout=10).stdout
          def emit(k,v):print(k+'='+json.dumps(v,sort_keys=True),flush=True)
          rows=[json.loads(x) for x in pathlib.Path('/run/mnebydns-normalcurl-44087349813-1/bindings.private.jsonl').read_text().splitlines()]
          phone=next(x['address'] for x in rows if x['probe']=='da67f0a412cd9bb8')
          peers=json.loads((root/'peers.json').read_text())
          emit('PHONE_IN_QUIC_PEER_SET',phone in peers)
          emit('QUIC_CANARY_SERVICE',out(['systemctl','is-active','mnebydns-h3-canary-44096073096-1.service']).strip())
          emit('TCP_ONLY_GUARD',out(['systemctl','is-active','mnebydns-google-tcp-only-20261117.service']).strip())
          emit('COLLECTED_UTC',time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()))
          for line in out(['iptables-save','-c','-t','filter']).splitlines():
              if 'MNEBYDNS_H3_OWNER_CANARY_20261117' not in line:continue
              args=shlex.split(line);peer=args[args.index('-s')+1].split('/')[0]
              count=re.match(r'\[(\d+):(\d+)\]',line)
              emit('CANARY_FIREWALL_RECEIPT',{'peer_role':'phone' if peer==phone else 'control','packets':int(count[1]),'bytes':int(count[2])})
          log=[x for x in (root/'canary.log').read_text().splitlines() if x.startswith('youtube_quic_')]
          emit('QUIC_RELAY_FIRST_COUNTERS',log[:2])
          emit('QUIC_RELAY_RECENT_COUNTERS',log[-3:])
          emit('READ_ONLY_COLLECTION_COMPLETE',True)
          PYTHON
