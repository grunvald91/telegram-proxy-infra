name: MNEBYDNS guarded production cutover tg-relay WireGuard to AWG3
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Read-only verification or explicit production cutover
        type: choice
        options: [verify, cutover]
        default: verify
        required: true
permissions: {contents: read}
concurrency:
  group: mnebydns-awg-production-migration-20261116
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      RU_PASS: ${{ secrets.SERVER188_SSH_PASSWORD }}
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify current production service baseline before any mutation
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          opts=(-T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts" -o LogLevel=ERROR)
          SSHPASS="$RU_PASS" sshpass -e ssh "${opts[@]}" root@188.120.254.223 'python3 - RU' < scripts/mnebydns-awg-data-health-20261116.py
          SSHPASS="$DE_PASS" sshpass -e ssh "${opts[@]}" root@89.125.90.101 'python3 - DE' < scripts/mnebydns-awg-data-health-20261116.py
          echo AWG_BASELINE_SERVICES_OK=true
      - name: Migrate identical tg-relay interfaces with per-node autonomous rescue
        if: inputs.operation == 'cutover'
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          bash -n scripts/mnebydns-awg-prod-manage-20261116.sh
          test -s ops/mnebydns-owner-ssh-known_hosts
          test -n "$RU_PASS" && test -n "$DE_PASS"
          if ! command -v sshpass >/dev/null; then sudo apt-get update -qq && sudo apt-get -y -qq install sshpass >/dev/null; fi
          opts=(-T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts"
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR)
          copts=(-q -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts"
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR)
          de() { SSHPASS="$DE_PASS" sshpass -e ssh "${opts[@]}" root@89.125.90.101 "$@"; }
          ru() { SSHPASS="$RU_PASS" sshpass -e ssh "${opts[@]}" root@188.120.254.223 "$@"; }
          armed=0
          completed=0
          recover() {
            rc=$?
            trap - EXIT
            if [[ "$completed" != 1 ]]; then
              echo AWG_CUTOVER_FAILURE_RECOVERY_TRIGGERED=true
              if [[ "$armed" == 1 ]]; then
                ru '/opt/mnebydns-awg-prod-20261116/manage.sh rollback-force RU' || true
                de '/opt/mnebydns-awg-prod-20261116/manage.sh rollback-force DE' || true
              fi
            fi
            exit "$rc"
          }
          trap recover EXIT
          # Install the reviewed newest manager on both hosts, not the earlier stage copy.
          # This corrects recovery after a partial commit and keeps 7-minute timers armed.
          for role in DE RU; do
            if [[ "$role" == DE ]]; then pass="$DE_PASS"; host=89.125.90.101; else pass="$RU_PASS"; host=188.120.254.223; fi
            SSHPASS="$pass" sshpass -e scp "${copts[@]}" scripts/mnebydns-awg-prod-manage-20261116.sh root@"$host":/tmp/mneby-awg-prod-manage-reviewed-20261116.sh
            SSHPASS="$pass" sshpass -e ssh "${opts[@]}" root@"$host"               "bash -n /tmp/mneby-awg-prod-manage-reviewed-20261116.sh && install -m 0700 /tmp/mneby-awg-prod-manage-reviewed-20261116.sh /opt/mnebydns-awg-prod-20261116/manage.sh && rm -f /tmp/mneby-awg-prod-manage-reviewed-20261116.sh"
          done
          de '/opt/mnebydns-awg-prod-20261116/manage.sh status DE'
          ru '/opt/mnebydns-awg-prod-20261116/manage.sh status RU'
          de '/opt/mnebydns-awg-prod-20261116/manage.sh arm DE'
          ru '/opt/mnebydns-awg-prod-20261116/manage.sh arm RU'
          armed=1
          # DE first: accept new packets before RU starts sending.
          de '/opt/mnebydns-awg-prod-20261116/manage.sh switch DE'
          ru '/opt/mnebydns-awg-prod-20261116/manage.sh switch RU'
          echo AWG_CUTOVER_INTERFACES_SWITCHED=true
          sleep 6
          for attempt in 1 2 3 4 5; do
            if ru '/opt/mnebydns-awg-prod-20261116/manage.sh check RU' &&
               de '/opt/mnebydns-awg-prod-20261116/manage.sh check DE'; then
              echo AWG_CUTOVER_BOTH_NODE_ROUTES_OK=true
              break
            fi
            if [[ "$attempt" == 5 ]]; then echo AWG_CUTOVER_NODE_CHECK_EXHAUSTED=true; exit 31; fi
            sleep 4
          done
          ru 'python3 -' <<'PY'
          import subprocess,re,json,socket,ssl,struct,sys
          def emit(k,v):print("AWG_PROD_DATA_"+k+"="+json.dumps(v,ensure_ascii=False),flush=True)
          p=subprocess.run(["ping","-n","-q","-M","do","-c","60","-i","0.2","-s","1200","-W","1","10.66.77.1"],text=True,capture_output=True,timeout=35)
          m=re.search(r"(\d+) packets transmitted, (\d+) received, ([\d.]+)% packet loss",p.stdout)
          if not m:emit("PING_ERROR","no summary");sys.exit(32)
          loss=float(m[3]);emit("AWG_INNER_LOSS",{"sent":int(m[1]),"received":int(m[2]),"pct":loss})
          if loss>10:sys.exit(33)
          for host in ("www.youtube.com","rr1---sn-gxuo03g-ig3s.googlevideo.com"):
              try:
                  with socket.create_connection(("10.66.77.1",443),timeout=5) as s:
                      s.settimeout(5)
                      with ssl.create_default_context().wrap_socket(s,server_hostname=host) as tls:
                          emit("TCP_TLS_"+host,{"version":tls.version(),"verified":bool(tls.getpeercert())})
              except Exception as exc:
                  emit("TCP_TLS_"+host,{"error":type(exc).__name__});sys.exit(34)
          PY
          # Reuse the exact service matrix that passed before stopping WireGuard.
          ru 'python3 - RU' < scripts/mnebydns-awg-data-health-20261116.py
          de 'python3 - DE' < scripts/mnebydns-awg-data-health-20261116.py
          # Do not cancel the 7-minute timer: each timer retains crash recovery.
          # After both commits it leaves healthy AWG in place, or restores WG if unhealthy.
          de '/opt/mnebydns-awg-prod-20261116/manage.sh commit DE'
          ru '/opt/mnebydns-awg-prod-20261116/manage.sh commit RU'
          de '/opt/mnebydns-awg-prod-20261116/manage.sh status DE'
          ru '/opt/mnebydns-awg-prod-20261116/manage.sh status RU'
          completed=1
          echo AWG_PRODUCTION_MIGRATION_COMPLETE=true
