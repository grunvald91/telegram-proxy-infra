name: MNEBYDNS telegram nfqws generator fingerprint (read only)
on:
  push:
    branches: [experiment/instagram-synack-window-canary-20261110]
    paths:
      - '.github/workflows/mnebydns-telegram-generator-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mnebydns-telegram-generator-fingerprint
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      RU_PASS: ${{ secrets.SERVER188_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read-only verify installed RU generator against repository snapshot
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$RU_PASS"
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sshpass >/dev/null
          export SSHPASS="$RU_PASS"
          opts=(-T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts"
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR)
          sshpass -e ssh "${opts[@]}" root@188.120.254.223 'python3 -' < scripts/mnebydns_telegram_nfqws_generator_readonly.py
          echo "snapshot_generator_sha256=$(sha256sum legacy-mtproxy/live-snapshot/server188/usr/local/sbin/telegram-nfqws-rules | awk '{print $1}')"
          echo 'telegram_generator_audit=COMPLETE_READ_ONLY'
