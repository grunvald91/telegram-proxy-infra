            print('COREFILE_SHA256='+hashlib.sha256(f.read_bytes()).hexdigest()+' SIZE='+str(st.st_size)+' MODE='+oct(st.st_mode&0o777),flush=True)
           p=subprocess.run(['systemctl','list-timers','--all','--no-pager','--plain'],capture_output=True,text=True,timeout=8)
           for item in p.stdout.splitlines():
            if 'mnebydns-fastpath-rollback' in item:print('ROLLBACK_TIMER='+item[:250],flush=True)
           p=subprocess.run(['journalctl','-u','mnebydns-dot.service','--since','2026-11-14 18:32:00 UTC','--no-pager','-o','cat','-n','250'],capture_output=True,text=True,timeout=10)
           safe=[]
           for item in p.stdout.splitlines():
            if re.search('fail|error|unable|fatal|start|stop|listen|bind|address|permission|denied|config|reload|plugin|tls|systemd|read-only|operation not permitted',item,re.I):
             item=re.sub(r'\b(?:\d{1,3}\.){3}\d{1,3}\b','[IP]',item)
