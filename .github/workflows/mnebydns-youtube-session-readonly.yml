name: MNEBYDNS actual video CDN QUIC origin comparison (read only)
on:
  push:
    branches: [feat/mnebydns-youtube-quic-ru188-de89-20261114]
    paths: ['.github/workflows/mnebydns-youtube-session-readonly.yml']
permissions: {contents: read}
concurrency:
  group: mnebydns-youtube-session-readonly
  cancel-in-progress: true
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      RU_PASS: ${{ secrets.SERVER188_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Prepare pinned SSH
        run: |
          set -Eeuo pipefail
          test -n "$RU_PASS"
          test -s ops/mnebydns-owner-ssh-known_hosts
          if ! command -v sshpass >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -qq -y sshpass >/dev/null
          fi
      - name: Compare actual CDN QUIC from RU via DE and directly to the origin
        run: |
          set -Eeuo pipefail
          export SSHPASS="$RU_PASS"
          sshpass -e ssh -T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR \
            root@188.120.254.223 \
            'PYTHONPATH=/tmp/mnebydns-youtube-quic-43612369808/deps timeout 65s python3 -B -' <<'PY_PROBE'
          import asyncio,os,runpy,socket,ipaddress
          module=runpy.run_path('/tmp/mnebydns-youtube-quic-43612369808/http3-probe.py')
          cdn='rr1---sn-gxuo03g-ig3s.googlevideo.com'
          async def one(label,host,via):
              os.environ['YOUTUBE_QUIC_VIA']=via
              try:
                  result=await asyncio.wait_for(module['once'](host),16)
                  print('ACTUAL_CDN_'+label+'='+str(result),flush=True)
              except TimeoutError:
                  print('ACTUAL_CDN_'+label+'=TIMEOUT',flush=True)
          async def main():
              # Sequential so the explicit destination environment cannot race.
              await one('YOUTUBE_CONTROL','www.youtube.com','127.0.0.1')
              await one('VIA_RU_WG_DE',cdn,'127.0.0.1')
              origins=socket.getaddrinfo(cdn,443,socket.AF_INET,socket.SOCK_DGRAM)
              ip=next(x[4][0] for x in origins if ipaddress.ip_address(x[4][0]).is_global
                      and x[4][0] not in ('188.120.254.223','89.125.90.101'))
              await one('DIRECT_ORIGIN_FROM_RU',cdn,ip)
              print('ACTUAL_CDN_ORIGIN_PROBE_READONLY_COMPLETE=true',flush=True)
          asyncio.run(main())
          PY_PROBE
