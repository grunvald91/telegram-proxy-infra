name: Diagnose owner DNS bot backup failure without changing live services
on:
  push:
    branches: [audit/recovery-personal-only-20261116]
    paths: [.github/workflows/owner-dns-clone-diagnostic-20261116.yml]
permissions:
  contents: read
concurrency:
  group: mnebyvpn-owner-dns-clone-diagnostic
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      SSHPASS: ${{ secrets.SERVER188_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - shell: bash
        run: |
          set -Eeuo pipefail
          if ! command -v sshpass >/dev/null; then sudo apt-get update -qq; sudo apt-get install -y -qq sshpass >/dev/null; fi
          sshpass -e ssh -T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts" -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR root@188.120.254.223 'python3 -B -' <<'PY'
          import json,pathlib,subprocess
          root=pathlib.Path('/opt/mnebyvpn/owner-dns-release-20261116')
          d=json.loads((root/'original-bot.json').read_text());c=d['Config'];h=d['HostConfig']
          env=dict(x.split('=',1) for x in c['Env'] if '=' in x)
          p=subprocess.run(['docker','image','inspect',d['Image']],capture_output=True,text=True)
          print(json.dumps({'image_exists':p.returncode==0,'image':d['Image'],'entrypoint':c.get('Entrypoint'),'command_argument_count':len(c.get('Cmd') or []),'user':c['User'],'memory':h.get('Memory'),'nano_cpus':h.get('NanoCpus'),'pids_limit':h.get('PidsLimit'),'multiline_env_keys':[k for k,v in env.items() if '\n' in v or '\r' in v],'empty_env_keys':[k for k in env if not k],'mount_count':len(d['Mounts']),'committed':(root/'COMMITTED').exists()},separators=(',',':')))
          names=subprocess.run(['docker','ps','-a','--format','{{.Names}}'],capture_output=True,text=True).stdout.splitlines()
          print('RESERVED_CONTAINERS='+json.dumps([n for n in names if n in ['mnebydns-owner-link-canary','mnebydns-owner-link-previous','mnebyvpn-owner-link-previous']]))
          for name in ['mnebyvpn-bot-info','mnebydns-personal-dot-private']:
              p=subprocess.run(['docker','inspect',name],capture_output=True,text=True);j=json.loads(p.stdout)[0]
              print(name,'state='+j['State']['Status'],'restart_count='+str(j['RestartCount']))
          print('LIVE_SERVICES_MUTATIONS=false')
          PY
