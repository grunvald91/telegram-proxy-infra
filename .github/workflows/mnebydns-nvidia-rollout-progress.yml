name: NVIDIA Smart DNS live rollout status
"on":
  push:
    branches: [smartdns/nvidia-exact-hosts-20261124]
    paths: [.github/workflows/mnebydns-nvidia-rollout-progress.yml]
permissions:
  contents: read
  statuses: write
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Check production catalog and domain path while rollout runs
        env:
          GH_TOKEN: ${{ github.token }}
          RU_PASS: ${{ secrets.SERVER188_SSH_PASSWORD }}
          DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
        run: |
          set -Eeuo pipefail
          if ! command -v sshpass >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -qq -y --no-install-recommends sshpass >/dev/null
          fi
          result="$(python3 - <<'PY'
          import re, runpy
          script = runpy.run_path("scripts/mnebydns-nvidia-permanent-20261124.py")
          owner = script["owner"]
          rules = script["TARGETS"]
          names = ",".join("'" + name + "'" for name in rules)
          rows = owner.sql("SELECT domain||'|'||status FROM dns_admin_domains WHERE domain IN (" + names + ") ORDER BY domain")
          spec = {"ACTIVE", "COVERED"}
          found = dict(row.split("|", 1) for row in rows.splitlines() if "|" in row)
          for name in rules:
              status = found.get(name, "MISSING")
              if not re.fullmatch("[A-Z_]+", status):
                  raise RuntimeError("Unexpected DNS catalog value")
              print(name + "|" + status, file=__import__("sys").stderr)
          checked = [name for name in rules if found.get(name) in spec and owner.dns_q(name) == (0, [owner.EDGE])]
          state = "waiting"
          if rules[0] in checked:
              state = owner.ssh("ru", "curl --noproxy '*' --silent --max-time 12 --output /dev/null --write-out '%{http_code}' "
                                "--resolve integrate.api.nvidia.com:443:" + owner.EDGE +
                                " https://integrate.api.nvidia.com/v1/models", 18).strip()
              if not re.fullmatch("[0-9]{3}", state):
                  state = "unverified"
          print(f"{len(checked)}/{len(rules)} live DNS records verified; NIM API {state}")
          PY
          )"
          printf '%s\n' "$result"
          python3 - <<'PY'
          import runpy, shlex
          owner = runpy.run_path("scripts/mnebydns-nvidia-permanent-20261124.py")["owner"]
          remote = '''set -u
          for id in 454545995151 454545995152 454545995153; do
            base=/opt/mnebydns-owner-domain/$id
            scripts=/tmp/mnebydns-owner-domain-$id
            printf 'nvidia_probe_work=%s ' "$id"
            for file in dns.before nginx.before dns.pilot nginx.pilot rollback.sh confirmed; do
              if test -f "$base/$file"; then printf '%s ' "$file"; fi
            done
            printf '\\n'
            if test -f "$scripts/mnebydns-owner-domain-render-20261110.py"; then
              echo "nvidia_probe_renderer_present=$id"
            fi
          done
          python3 /opt/mnebydns-maintenance/mnebydns_safe_deploy.py status >/dev/null &&
            echo nvidia_safe_deploy_helper_status=PASS
          renderer=/tmp/mnebydns-owner-domain-454545995151/mnebydns-owner-domain-render-20261110.py
          if test -f "$renderer"; then
            for domain in integrate.api.nvidia.com build.nvidia.com api.ngc.nvidia.com; do
              if python3 "$renderer" probe --domain "$domain" >/dev/null 2>&1; then
                echo "nvidia_de_origin_tls=$domain:PASS"
              else
                echo "nvidia_de_origin_tls=$domain:FAILED"
              fi
            done
            printf 'nvidia_de_live_reload_line='
            grep -Fx '    reload 5s 1s' /opt/mnebydns-dot/Corefile || true
            set -o pipefail
            if /opt/mnebydns-dot/coredns -plugins 2>&1 | grep -Eq '(^|[[:space:].])reload([[:space:]]|$)'; then
              echo nvidia_de_reload_plugin_under_pipefail=PASS
            else
              echo nvidia_de_reload_plugin_under_pipefail=FAILED
            fi
            scratch=$(mktemp -d /tmp/mnebydns-nvidia-render.XXXXXXXX)
            trap 'rm -rf -- "$scratch"' EXIT
            stage=/tmp/mnebydns-owner-domain-454545995151/mnebydns-owner-domain-stage-20261110.sh
            if test -f "$stage"; then
              awk '/^exec 9>/{ print "echo nvidia_owner_guard_passed_before_first_write=true"; exit } { print }' "$stage" > "$scratch/preflight.sh"
              if grep -q '^echo nvidia_owner_guard_passed_before_first_write=true "$renderer" render-add --domain integrate.api.nvidia.com --ip 1.1.1.1 \\
               --core /opt/mnebydns-dot/Corefile --nginx /etc/nginx/nginx.conf --out "$scratch"; then
              echo nvidia_render_live_policy=PASS
              nginx -t -q -c "$scratch/nginx.pilot" >/dev/null 2>"$scratch/nginx-check"
              echo "nvidia_rendered_nginx_status=$?"
            else
              echo nvidia_render_live_policy=FAILED
            fi
          fi
          '''
          try:
              print(owner.ssh("de", "bash -c " + shlex.quote(remote), 25))
          except RuntimeError as exc:
              print("nvidia_candidate_diagnostics=" + str(exc))
          PY
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=success -f context=mnebydns/nvidia-live-status -f description="$result" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
 "$scratch/preflight.sh"; then
                origin=$(python3 "$renderer" probe --domain integrate.api.nvidia.com)
                deadline=$(date -u -d '+59 minutes' '+%Y-%m-%d %H:%M:%S UTC')
                bash -x "$scratch/preflight.sh" "/tmp/mnebydns-owner-domain-454545995151" 454545995151 integrate.api.nvidia.com "$origin" "$deadline" 2>&1 | tail -40
              fi
            fi
            if python3 "$renderer" render-add --domain integrate.api.nvidia.com --ip 1.1.1.1 \\
               --core /opt/mnebydns-dot/Corefile --nginx /etc/nginx/nginx.conf --out "$scratch"; then
              echo nvidia_render_live_policy=PASS
              nginx -t -q -c "$scratch/nginx.pilot" >/dev/null 2>"$scratch/nginx-check"
              echo "nvidia_rendered_nginx_status=$?"
            else
              echo nvidia_render_live_policy=FAILED
            fi
          fi
          '''
          try:
              print(owner.ssh("de", "bash -c " + shlex.quote(remote), 25))
          except RuntimeError as exc:
              print("nvidia_candidate_diagnostics=" + str(exc))
          PY
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=success -f context=mnebydns/nvidia-live-status -f description="$result" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
