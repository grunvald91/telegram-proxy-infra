name: MNEBYDNS Nov13 extra backup directories inventory no file contents
on:
  push:
    branches: [restore/mnebydns-youtube-morning-20261115]
    paths: ['.github/workflows/mnebydns-nov13-backup-scope-20261115.yml']
permissions: {contents: read}
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify Nov 13 backup manifests and list relative file names only
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -qq -y sshpass >/dev/null
          SSHPASS="$DE_PASS" sshpass -e ssh -T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts" -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR root@89.125.90.101 'python3 -' <<'PY'
          import pathlib,hashlib,json,subprocess
          d=pathlib.Path('/opt/mnebydns-stable-checkpoints/1794566430')
          proc=subprocess.run(['sha256sum','-c','stable-manifest.sha256'],cwd=d,capture_output=True,text=True)
          print("NOV13_MANIFEST_CHECK="+json.dumps({"valid":proc.returncode==0,"entries":[x.split(':')[0] for x in proc.stdout.splitlines()]},sort_keys=True),flush=True)
          for root in ['/var/backups/mnebyvpn-dns-profile-20261113-121721','/var/backups/mnebyvpn-dns-profile-20261113-121819','/var/backups/mnebyvpn-sealed']:
            p=pathlib.Path(root)
            if not p.is_dir():continue
            files=[]
            for z in p.rglob('*'):
              try:
                rel=z.relative_to(p)
                if len(rel.parts)>3 or z.is_symlink():continue
                if z.is_file():
                  files.append({"file":str(rel),"bytes":z.stat().st_size})
              except Exception:pass
              if len(files)>=65:break
            print("NOV13_DIRECTORY="+json.dumps({"path":root,"files":files},sort_keys=True),flush=True)
          PY
