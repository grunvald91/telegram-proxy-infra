name: DE89 actual phone DoT and service recheck
on:
  push:
    branches: [diag/youtube-de89-dot-recheck-20261117]
    paths:
      - .github/workflows/youtube-de89-dot-recheck-20261117.yml
      - scripts/youtube-de89-dot-recheck-20261117.py
permissions: {contents: read}
concurrency:
  group: mnebydns-youtube-dot-recheck
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Validate existing parser and prepare pinned SSH
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/youtube-return-trace-20261117.py
          python3 -m unittest discover -s scripts/tests -p test_de89_googlevideo_ack_20261117.py -v
          test -n "$DE_PASS" && test -s ops/mnebydns-owner-ssh-known_hosts
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          cat > "$RUNNER_TEMP/de-phone" <<'SHELL'
          #!/bin/bash
          set -Eeuo pipefail
          export SSHPASS="$DE_PASS"
          exec sshpass -e ssh -T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=5 -o ServerAliveCountMax=3 -o HostKeyAlgorithms=ssh-ed25519 \
            -o "UserKnownHostsFile=$GITHUB_WORKSPACE/ops/mnebydns-owner-ssh-known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR \
            root@89.125.90.101 "$@"
          SHELL
          chmod 700 "$RUNNER_TEMP/de-phone"
      - name: Inspect services and revalidate the observed phone DNS session
        run: |
          set -Eeuo pipefail
          root="/run/mnebydns-dot-recheck-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          "$RUNNER_TEMP/de-phone" "umask 077; mkdir '$root'; cat > '$root/observer.py'" < scripts/youtube-return-trace-20261117.py
          "$RUNNER_TEMP/de-phone" "cat > '$root/probe.py'" < scripts/youtube-de89-dot-recheck-20261117.py
          "$RUNNER_TEMP/de-phone" "timeout 95s python3 -B '$root/probe.py'"
