name: MNEBYDNS DE TCP443 inbound SYN/SYNACK diagnosis (read-only)
on:
  push:
    branches: [audit/mnebydns-instagram-lite-20261111]
    paths:
      - '.github/workflows/mnebydns-iglite-de-ingress443-readonly.yml'
permissions:
  contents: read
concurrency:
  group: mnebydns-de-ingress443-readonly
  cancel-in-progress: false
jobs:
  observe-runner-to-de:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test isolated header parser, not live server
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/mnebydns_iglite_de_443_ingress_readonly.py
          python3 -m unittest discover -s scripts/tests -p 'test_mnebydns_iglite_de_443_ingress_readonly.py' -v
      - name: Install host-key pinned SSH client
        run: |
          set -Eeuo pipefail
          test -n "$DE_PASS"
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sshpass >/dev/null
      - name: Observe actual public TCP443 baseline from runner and DE simultaneously
        shell: bash
        run: |
          set -Eeuo pipefail
          export SSHPASS="$DE_PASS"
          opts=(-T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes
            -o HostKeyAlgorithms=ssh-ed25519
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts"
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR)
          logfile="$RUNNER_TEMP/iglite-de-443-readonly.log"
          timeout 35s sshpass -e ssh "${opts[@]}" root@89.125.90.101 \
            'python3 -u -' < scripts/mnebydns_iglite_de_443_ingress_readonly.py \
            > "$logfile" 2>&1 &
          observer=$!
          trap 'kill "$observer" 2>/dev/null || true; wait "$observer" 2>/dev/null || true' EXIT
          observed=0
          for try in $(seq 1 130); do
            if grep -q '^de_443_observer=READY_RUNNER_SSH_SOURCE_SCOPED$' "$logfile" 2>/dev/null; then observed=1; break; fi
            kill -0 "$observer" 2>/dev/null || break
            sleep .1
          done
          if [[ "$observed" != 1 ]]; then
            cat "$logfile"
            echo 'de_443_observer_start=FAILED'
            exit 1
          fi
          echo 'runner_de_tcp443_baseline=STARTING'
          python3 - <<'PY'
          import socket,ssl,time
          ip='89.125.90.101'
          def tcp(port, sni=None):
              start=time.monotonic()
              try:
                  with socket.create_connection((ip,port),timeout=5) as sock:
                      tcp_delay=round(time.monotonic()-start,3)
                      print(f'runner_tcp_{port}=CONNECTED_{tcp_delay}s',flush=True)
                      if sni:
                          sock.settimeout(5)
                          with ssl.create_default_context().wrap_socket(sock,server_hostname=sni) as tls:
                              print(f'runner_tls_{port}=CERT_VALID_{tls.version()}',flush=True)
              except Exception as exc:
                  print(f'runner_port_{port}_error={type(exc).__name__}',flush=True)
          tcp(853,'dns.mnebyvpn.site')
          tcp(443,'iglite-z.instagram.com')
          tcp(443,'iglite-z.instagram.com')
          PY
          set +e
          wait "$observer"
          result=$?
          set -e
          trap - EXIT
          cat "$logfile"
          test "$result" -eq 0
          grep -q '^de_443_observer_frames_logged=0$' "$logfile"
          grep -q '^de_443_observer_tls_content_logged=0$' "$logfile"
          echo 'runner_de_tcp443_diagnostic=OBSERVED_NOT_BYPASS_VALIDATED'
