name: Gate authenticated TLS underlay against current packet loss throughput and live DNS
on:
  push:
    branches: [fix/dns-tunnel-performance-20261116]
    paths: [.github/workflows/reliable-relay-20261116.yml]
permissions:
  contents: read
concurrency:
  group: mnebyvpn-reliable-relay-20261116
  cancel-in-progress: false
jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
      RU_PASS: ${{ secrets.SERVER188_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            ops/mnebydns-owner-ssh-known_hosts
          sparse-checkout-cone-mode: false
      - name: Verify pinned binary and run one guarded comparison
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -W error -m py_compile scripts/reliable-relay-20261116.py scripts/reliable-relay-runner-20261116.py
          curl -fLsS --max-time 40 https://github.com/erebe/wstunnel/releases/download/v11.1.0/wstunnel_11.1.0_linux_amd64.tar.gz -o release.tar.gz
          echo '512edf4e7bb64fc133522220123514868fae75b5bae4124b53e396787276aa23  release.tar.gz' | sha256sum -c -
          if ! command -v sshpass >/dev/null; then sudo apt-get update -qq; sudo apt-get install -y -qq sshpass >/dev/null; fi
          python3 scripts/reliable-relay-runner-20261116.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reliable-relay-comparison
          path: output/*.json
          retention-days: 2
          if-no-files-found: warn
