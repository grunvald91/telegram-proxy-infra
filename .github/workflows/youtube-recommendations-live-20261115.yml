name: Owner five-point YouTube actual server check 20261115 (read only)
on:
  push:
    branches: [diag/youtube-recommendations-live-20261115]
    paths:
      - '.github/workflows/youtube-recommendations-live-20261115.yml'
      - 'scripts/youtube-recommendations-readonly-20261115.py'
permissions: {contents: read}
concurrency:
  group: youtube-recommendations-server-check-20261115
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      RU_PASS: ${{ secrets.SERVER188_SSH_PASSWORD }}
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Syntax and read-only transport preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/youtube-recommendations-readonly-20261115.py
          test -s ops/mnebydns-owner-ssh-known_hosts
          test -n "$RU_PASS" && test -n "$DE_PASS"
          if ! command -v sshpass >/dev/null; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sshpass >/dev/null
          fi
      - name: Compare actual DNS, QUIC listeners, WG, firewall and IP rules on both hosts
        shell: bash
        run: |
          set -Eeuo pipefail
          opts=(-T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes
            -o HostKeyAlgorithms=ssh-ed25519
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts"
            -o GlobalKnownHostsFile=/dev/null
            -o UpdateHostKeys=no -o LogLevel=ERROR)
          SSHPASS="$DE_PASS" sshpass -e ssh "${opts[@]}" root@89.125.90.101 'python3 -B - DE' < scripts/youtube-recommendations-readonly-20261115.py
          SSHPASS="$RU_PASS" sshpass -e ssh "${opts[@]}" root@188.120.254.223 'python3 -B - RU' < scripts/youtube-recommendations-readonly-20261115.py
          echo 'OWNER_FIVE_POINT_READ_ONLY_COMPLETE=true'
