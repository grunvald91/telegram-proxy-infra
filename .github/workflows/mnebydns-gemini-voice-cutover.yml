name: MNEBYDNS Gemini official RPC exact-host public cutover
on:
  push:
    branches: ['feature/mnebydns-gemini-voice-audit-20261108']
    paths: ['.github/workflows/mnebydns-gemini-voice-cutover.yml']
permissions:
  contents: read
concurrency:
  group: mnebydns-google-public-443-change
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FOREIGN_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
      RU_PASS: ${{ secrets.SERVER188_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: grunvald91/Mnebyvpn
          ref: b2073552b7bad3c0d8fe06c1d556d545895cf03d
          path: mnebyvpn
          persist-credentials: false
      - name: Transactional exact two-host Gemini RPC cutover with external DoT + Russian TLS
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$FOREIGN_PASS" && test -n "$RU_PASS"
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]] || exit 2
          sudo apt-get update -qq
          sudo apt-get install -qq -y sshpass
          server="root@89.125.90.101"
          opts=(-o ConnectTimeout=12 -o StrictHostKeyChecking=accept-new -o LogLevel=ERROR)
          work="/tmp/mnebydns-ci-$GITHUB_RUN_ID"
          backup="/opt/mnebydns-voice-backups/$GITHUB_RUN_ID"
          watchdog="mnebydns-voice-watchdog-$GITHUB_RUN_ID"
          changed=false
          cleanup() {
            code=$?
            trap - EXIT
            if [[ "$changed" == true && "$code" -ne 0 ]]; then
              echo "voice_canary_failed_scoped_rollback_attempt=yes"
              SSHPASS="$FOREIGN_PASS" sshpass -e ssh "${opts[@]}" "$server" \
                "if test -f '$backup/rollback.sh'; then bash '$backup/rollback.sh' '$backup'; fi" \
                || echo "voice_rollback_unconfirmed=yes"
            fi
            SSHPASS="$FOREIGN_PASS" sshpass -e ssh "${opts[@]}" "$server" \
              "rm -rf -- '$work'" >/dev/null 2>&1 || true
            exit "$code"
          }
          trap cleanup EXIT
          bash -n mnebyvpn/ops/smart-dns-poc/deploy-gemini-voice.sh
          bash -n mnebyvpn/ops/smart-dns-poc/rollback-gemini-voice.sh
          python3 mnebyvpn/ops/smart-dns-poc/test-extend-gemini-voice.py
          SSHPASS="$FOREIGN_PASS" sshpass -e ssh "${opts[@]}" "$server" \
            "test ! -e '$work' && mkdir -m 700 -- '$work'"
          tar -C mnebyvpn/ops/smart-dns-poc -czf - \
            extend-gemini-voice-rr.py probe-gemini-canary.py probe-gemini-voice.py \
            deploy-gemini-voice.sh rollback-gemini-voice.sh |
            SSHPASS="$FOREIGN_PASS" sshpass -e ssh "${opts[@]}" "$server" \
              "tar -xzf - -C '$work'"
          changed=true
          SSHPASS="$FOREIGN_PASS" sshpass -e ssh "${opts[@]}" "$server" \
            "bash '$work/deploy-gemini-voice.sh' '$work'"

          # External runner can reach foreign DoT 853, with public CA certificate validation.
          python3 mnebyvpn/ops/smart-dns-poc/probe-gemini-voice.py \
            --ip 89.125.90.101 --port 853 --hostname dns.mnebyvpn.site

          # GitHub runners cannot reach foreign TCP443 reliably. Russian VPS can.
          SSHPASS="$RU_PASS" sshpass -e ssh "${opts[@]}" root@188.120.254.223 'bash -se' <<'RUSSIAN'
          set -Eeuo pipefail
          for host in jnn-pa.googleapis.com waa-pa.clients6.google.com; do
            code="$(curl --noproxy '*' -4 -sS --connect-timeout 6 --max-time 14 \
              --resolve "$host:443:89.125.90.101" \
              -o /dev/null -w '%{http_code}' "https://$host/")"
            [[ -n "$code" && "$code" != 000 ]] || { echo "ru_aux_host_failed=$host"; exit 1; }
            echo "ru_new_Gemini_RPC_original_TLS=$host"
          done
          root="$(curl --noproxy '*' -4 -sS --connect-timeout 6 --max-time 14 \
            --resolve gemini.google.com:443:89.125.90.101 \
            -o /dev/null -w '%{http_code}' https://gemini.google.com/)"
          [[ "$root" == 200 || "$root" == 302 ]] || { echo "ru_original_Gemini_regression"; exit 1; }
          for host in cdn.servgo.ru tg.servgo.ru; do
            code="$(curl --noproxy '*' -4 -sS --connect-timeout 6 --max-time 14 \
              --resolve "$host:443:89.125.90.101" \
              -o /dev/null -w '%{http_code}' "https://$host/")"
            [[ -n "$code" && "$code" != 000 ]] || { echo "ru_legacy_443_regression"; exit 1; }
            echo "ru_legacy_tls_remains_healthy=$host"
          done
          echo "ru_gemini_original_TLS_and_legacy_routes=pass"
          RUSSIAN

          # Disarm recovery watchdog only after all external probes passed.
          SSHPASS="$FOREIGN_PASS" sshpass -e ssh "${opts[@]}" "$server" \
            "systemctl is-active --quiet nginx && \
             systemctl is-active --quiet mnebydns-dot.service && \
             systemctl is-active --quiet mnebydns-gemini.service && \
             systemctl is-active --quiet mnebydns-gemini-aux.service && \
             nginx -t >/dev/null 2>&1 && \
             systemctl stop '$watchdog.timer' >/dev/null 2>&1"
          changed=false
          echo "gemini_aux_public_DNS_TLS=pass"
          echo "gemini_aux_russian_to_foreign_HTTPS=pass"
          echo "original_gemini_and_vpn_routes=pass"
          echo "rollback_watchdog_disarmed=yes"
          echo "actual_android_voice_test_pending=yes"
