name: MNEBYDNS Instagram Grok X Threads foreign TLS read-only preflight
on:
  push:
    branches: ['feature/mnebydns-instagram-grok-x-threads-30m-20261109']
    paths: ['.github/workflows/mnebydns-social-preflight.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SSHPASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - name: Verify German origin TLS for all four apps and active Google Claude pilot
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$SSHPASS"
          sudo apt-get update -qq
          sudo apt-get install -qq -y sshpass
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=accept-new -o LogLevel=ERROR root@89.125.90.101 'python3 -' <<'PY'
          import pathlib,subprocess,socket,ssl,concurrent.futures,datetime
          snapshot=pathlib.Path('/opt/mnebydns-googlepilot-backups/42533155025')
          states={}
          for name,path in (('nginx','/etc/nginx/nginx.conf'),('dns','/opt/mnebydns-dot/Corefile')):
              current=pathlib.Path(path).read_bytes()
              pilot=snapshot/(name+'.pilot'); before=snapshot/(name+'.before')
              state=('PILOT' if pilot.is_file() and current==pilot.read_bytes() else
                     'BASELINE' if before.is_file() and current==before.read_bytes() else 'OTHER')
              states[name]=state
              print('previous_'+name+'_state='+state,flush=True)
          for unit in ('nginx','mnebydns-dot.service','xray.service',
                       'mnebydns-googlepilot.service',
                       'mnebydns-four-google-watchdog-42533155025.timer'):
              cp=subprocess.run(['systemctl','is-active',unit],capture_output=True,text=True,timeout=5)
              print('unit_'+unit+'='+cp.stdout.strip(),flush=True)
          print('utc_now='+datetime.datetime.now(datetime.timezone.utc).isoformat(),flush=True)
          hosts=('instagram.com','www.instagram.com','graph.instagram.com','cdninstagram.com',
                 'threads.com','threads.net','x.com','twitter.com','pbs.twimg.com',
                 'grok.com','api.x.ai','x.ai','api.twitter.com','api.instagram.com',
                 'www.threads.com','t.co','graph.facebook.com','connect.facebook.net')
          def probe(host):
              try:
                  with socket.create_connection((host,443),timeout=5) as tcp:
                      tcp.settimeout(5)
                      with ssl.create_default_context().wrap_socket(tcp,server_hostname=host) as tls:
                          return host,True,tls.version()
              except Exception as ex:
                  return host,False,type(ex).__name__
          with concurrent.futures.ThreadPoolExecutor(max_workers=10) as pool:
              results=list(pool.map(probe,hosts))
          status={host:ok for host,ok,detail in results}
          for host,ok,detail in results:
              print('original_TLS_host='+host+' valid='+str(ok).lower()+' result='+detail,flush=True)
          for needed in ('instagram.com','threads.com','x.com','grok.com','api.x.ai'):
              if not status[needed]:raise SystemExit('primary social origin TLS invalid '+needed)
          if any(v=='OTHER' for v in states.values()):raise SystemExit('Unknown prior pilot configuration')
          print('four_social_primary_TLS_ready=true',flush=True)
          print('read_only_no_server_changes=true',flush=True)
          PY
