name: DE89 bounded media range and phone stream capture
on:
  push:
    branches: [diag/youtube-de89-media-20261117]
    paths: ['.github/workflows/youtube-de89-media-20261117.yml','scripts/youtube-de89-media-20261117.py']
permissions: {contents: read}
concurrency:
  group: mnebydns-youtube-de89-media
  cancel-in-progress: false
jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Prepare temporary diagnostic dependencies
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/youtube-de89-media-20261117.py scripts/youtube-return-trace-20261117.py
          test -n "$DE_PASS" && test -s ops/mnebydns-owner-ssh-known_hosts
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          python3 -m venv "$RUNNER_TEMP/media-venv"
          timeout 90s "$RUNNER_TEMP/media-venv/bin/pip" -q install 'yt-dlp[default]'
          "$RUNNER_TEMP/media-venv/bin/python" -m yt_dlp --version
          cat > "$RUNNER_TEMP/de-only" <<'SHELL'
          #!/bin/bash
          set -Eeuo pipefail
          export SSHPASS="$DE_PASS"
          exec sshpass -e ssh -T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=5 -o ServerAliveCountMax=3 -o HostKeyAlgorithms=ssh-ed25519 \
            -o "UserKnownHostsFile=$GITHUB_WORKSPACE/ops/mnebydns-owner-ssh-known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR \
            root@89.125.90.101 "$@"
          SHELL
          chmod 700 "$RUNNER_TEMP/de-only"
      - name: Arm three minute quality-checked stream capture on DE89
        run: |
          set -Eeuo pipefail
          root="/run/mnebydns-media-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sed 's/^CAPTURE_SECONDS = 90$/CAPTURE_SECONDS = 180/' scripts/youtube-return-trace-20261117.py > "$RUNNER_TEMP/media-observer.py"
          "$RUNNER_TEMP/de-only" "umask 077; mkdir '$root'; cat > '$root/observer.py'" < "$RUNNER_TEMP/media-observer.py"
          "$RUNNER_TEMP/de-only" "systemd-run --quiet --unit=mnebydns-media-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT} --property=RuntimeMaxSec=220 --property=MemoryMax=256M --property=StandardOutput=append:$root/result.log --property=StandardError=append:$root/result.log /usr/bin/env MNEBY_CAPTURE_READY=$root/READY /usr/bin/python3 -B $root/observer.py"
          "$RUNNER_TEMP/de-only" "for attempt in \$(seq 1 15); do if test -s '$root/READY'; then echo PHONE_WINDOW_READY=true; date -u +%FT%TZ; exit 0; fi; sleep 1; done; exit 1"
      - name: Obtain test media through DE89 and compare a bounded media range
        run: |
          set -Eeuo pipefail
          control="$RUNNER_TEMP/de89-media-control"
          trap 'ssh -S "$control" -O exit root@89.125.90.101 >/dev/null 2>&1 || true' EXIT
          SSHPASS="$DE_PASS" sshpass -e ssh -T -M -S "$control" -f -N -D 127.0.0.1:10889 \
            -o ExitOnForwardFailure=yes -o ConnectTimeout=12 -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=5 -o ServerAliveCountMax=3 -o HostKeyAlgorithms=ssh-ed25519 \
            -o "UserKnownHostsFile=$GITHUB_WORKSPACE/ops/mnebydns-owner-ssh-known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR root@89.125.90.101
          "$RUNNER_TEMP/media-venv/bin/python" -B scripts/youtube-de89-media-20261117.py
      - name: Retrieve bounded stream summary
        if: always()
        run: |
          set -Eeuo pipefail
          root="/run/mnebydns-media-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          "$RUNNER_TEMP/de-only" "timeout 220s bash -c 'while systemctl is-active --quiet mnebydns-media-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.service; do sleep 5; done'; cat '$root/result.log'; grep -q 'TARGET_CAPTURE_NO_SERVER_CHANGES=true' '$root/result.log'; ! grep -q 'RuntimeError' '$root/result.log'"
