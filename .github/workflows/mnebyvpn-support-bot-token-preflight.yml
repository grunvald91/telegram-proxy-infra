name: Check existing bot token availability for MNEBYVPN site notifications
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mnebyvpn-support-bot-token-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      DEDICATED_AVAILABLE: ${{ secrets.MNEBYVPN_SUPPORT_BOT_TOKEN != '' }}
      ORIGINAL_AVAILABLE: ${{ secrets.TELEGRAM_TOKEN_BOT != '' }}
      FALLBACK_AVAILABLE: ${{ secrets.TELEGRAM_BOT_TOKEN != '' }}
      SSH_AVAILABLE: ${{ secrets.SERVER188_SSH_PASSWORD != '' }}
    steps:
      - name: Report only boolean presence of credentials
        shell: bash
        run: |
          set -euo pipefail
          echo "infra_dedicated_bot_token_available=$DEDICATED_AVAILABLE"
          echo "infra_original_bot_token_available=$ORIGINAL_AVAILABLE"
          echo "infra_fallback_bot_token_available=$FALLBACK_AVAILABLE"
          echo "infra_server188_ssh_available=$SSH_AVAILABLE"
          echo 'Secret values not printed, copied, or otherwise used.'
