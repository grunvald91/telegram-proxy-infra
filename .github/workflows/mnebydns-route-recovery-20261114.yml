name: MNEBYDNS guarded restoration of prior service addresses
on:
  push:
    branches: [feat/mnebydns-youtube-quic-ru188-de89-20261114]
    paths: ['.github/workflows/mnebydns-route-recovery-20261114.yml']
permissions: {contents: read}
concurrency:
  group: mnebydns-shared-core-public-ru188-20261114
  cancel-in-progress: false
env:
  RECOVERY_PHASE: inspect
  RECOVERY_RUN_ID: '0'
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      RU_PASS: ${{ secrets.SERVER188_SSH_PASSWORD }}
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Validate exact reverse plan and guarded scripts
        run: |
          set -Eeuo pipefail
          [[ "$RECOVERY_PHASE" == inspect || "$RECOVERY_PHASE" == stage || "$RECOVERY_PHASE" == commit || "$RECOVERY_PHASE" == rollback ]]
          python3 -B scripts/mnebydns-route-recovery-20261114.py selftest
          for f in stage rollback commit; do
            bash -n "scripts/mnebydns-ru-fastpath-$f-20261113.sh"
          done
          bash -n scripts/mnebydns-dot-config-change-20261111.sh
          test -n "$RU_PASS" && test -n "$DE_PASS"
          test -s ops/mnebydns-owner-ssh-known_hosts
          if ! command -v sshpass >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -qq -y sshpass >/dev/null
          fi
      - name: Inspect node resources, VPN shape and CoreDNS mount visibility
        if: env.RECOVERY_PHASE == 'stage' || env.RECOVERY_PHASE == 'inspect'
        run: |
          set -Eeuo pipefail
          opts=(-T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts"
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR)
          for role in RU DE; do
            if [[ "$role" == RU ]]; then
              host=188.120.254.223
              export SSHPASS="$RU_PASS"
            else
              host=89.125.90.101
              export SSHPASS="$DE_PASS"
            fi
            sshpass -e ssh "${opts[@]}" "root@$host" "python3 -B - resource '$role'" \
              < scripts/mnebydns-route-recovery-20261114.py
          done
      - name: Stage all 264 managed service addresses with isolated DoT verification and independent rollback
        if: env.RECOVERY_PHASE == 'stage'
        run: |
          set -Eeuo pipefail
          id="$GITHUB_RUN_ID"
          [[ "$id" =~ ^[1-9][0-9]{8,12}$ ]]
          work="/tmp/mnebydns-fastpath-$id"
          base="/opt/mnebydns-fastpath/$id"
          opts=(-T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts"
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR)
          cp_opts=(-q -o ConnectTimeout=12 -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts"
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR)
          export SSHPASS="$DE_PASS"
          de() { sshpass -e ssh "${opts[@]}" root@89.125.90.101 "$@"; }
          undo() {
            rc=$?
            trap - EXIT
            if ((rc != 0)); then
              de "test ! -s '$base/rollback.sh' || bash '$base/rollback.sh' '$base'" || \
                echo 'RECOVERY_IMMEDIATE_ROLLBACK_REQUIRES_ATTENTION=true'
            fi
            exit "$rc"
          }
          trap undo EXIT
          de "test ! -e '$work' && mkdir -m 700 '$work'"
          sshpass -e scp "${cp_opts[@]}" scripts/mnebydns-route-recovery-20261114.py \
            "root@89.125.90.101:$work/recovery.py"
          for name in stage rollback commit; do
            sshpass -e scp "${cp_opts[@]}" "scripts/mnebydns-ru-fastpath-$name-20261113.sh" \
              "root@89.125.90.101:$work/$name.sh"
          done
          sshpass -e scp "${cp_opts[@]}" scripts/mnebydns-dot-config-change-20261111.sh \
            "root@89.125.90.101:$work/reload.sh"
          de "python3 -B '$work/recovery.py' plan '$work'"
          de "bash '$work/stage.sh' '$id' '$work'"
          de "systemctl is-active --quiet 'mnebydns-fastpath-rollback-$id.timer'"
          echo "RECOVERY_STAGE_RUN_ID=$id"
          echo 'RECOVERY_STAGE_IS_TEMPORARY_UNTIL_DEVICE_TEST=true'
          echo 'RECOVERY_INDEPENDENT_REVERT_AFTER_45_MINUTES=true'
          trap - EXIT
      - name: Commit only the already tested recovery or restore its prior state
        if: env.RECOVERY_PHASE == 'commit' || env.RECOVERY_PHASE == 'rollback'
        run: |
          set -Eeuo pipefail
          [[ "$RECOVERY_RUN_ID" =~ ^[1-9][0-9]{8,12}$ ]]
          base="/opt/mnebydns-fastpath/$RECOVERY_RUN_ID"
          export SSHPASS="$DE_PASS"
          sshpass -e ssh -T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR \
            root@89.125.90.101 "bash '$base/$RECOVERY_PHASE.sh' '$base'"
      - name: Verify legacy DoT through both public ingress addresses after staging or commit
        if: env.RECOVERY_PHASE == 'stage' || env.RECOVERY_PHASE == 'commit'
        run: |
          set -Eeuo pipefail
          export SSHPASS="$DE_PASS"
          sshpass -e ssh -T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR \
            root@89.125.90.101 'python3 -B -' <<'PY_VERIFY'
          import socket,ssl,struct,secrets
          def exact(s,n):
              value=b''
              while len(value)<n:
                  block=s.recv(n-len(value))
                  if not block:raise EOFError('short DNS reply')
                  value+=block
              return value
          for ip in ['89.125.90.101','188.120.254.223']:
              with socket.create_connection((ip,853),timeout=6) as raw:
                  raw.settimeout(8)
                  with ssl.create_default_context().wrap_socket(raw,server_hostname='dns.mnebyvpn.site') as s:
                      for host in ['www.youtube.com','youtubei.googleapis.com','www.googlevideo.com','i.ytimg.com','chatgpt.com','claude.ai']:
                          tid=secrets.randbelow(65535)
                          q=struct.pack('!HHHHHH',tid,256,1,0,0,0)+b''.join(bytes([len(x)])+x.encode() for x in host.split('.'))+b'\0'+struct.pack('!HH',1,1)
                          s.sendall(len(q).to_bytes(2,'big')+q)
                          data=exact(s,int.from_bytes(exact(s,2),'big'))
                          assert data[:2]==q[:2] and data[3]&15==0
                          assert socket.inet_aton('89.125.90.101') in data
                          assert socket.inet_aton('188.120.254.223') not in data
                          print('RECOVERY_DOT_A_TO_DE89='+host,flush=True)
              print('RECOVERY_DOT_INGRESS_'+ip+'=TLS_AND_DNS_OK',flush=True)
          print('RECOVERY_PUBLIC_AND_PERSONAL_SHARED_CORE_RESTORED=true',flush=True)
          PY_VERIFY
      - name: Roll back unverified staging if any later check fails
        if: failure() && env.RECOVERY_PHASE == 'stage'
        run: |
          set -Eeuo pipefail
          base="/opt/mnebydns-fastpath/$GITHUB_RUN_ID"
          export SSHPASS="$DE_PASS"
          sshpass -e ssh -T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR \
            root@89.125.90.101 "test ! -s '$base/rollback.sh' || bash '$base/rollback.sh' '$base'"
