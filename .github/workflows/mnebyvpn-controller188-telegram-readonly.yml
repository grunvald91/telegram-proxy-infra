name: MNEBYVPN existing controller188 and Telegram proxy read-only audit

"on":
  push:
    branches: [main]
    paths: ['.github/workflows/mnebyvpn-controller188-telegram-readonly.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: controller188-telegram-readonly
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      RU_SSH_PASSWORD: ${{ secrets.SERVER188_SSH_PASSWORD }}
      DE_SSH_PASSWORD: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare pinned existing SSH access (runner only)
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RU_SSH_PASSWORD" || { echo "controller188_ssh=credential_missing"; exit 2; }
          test -s ops/mnebydns-owner-ssh-known_hosts
          grep -q '^188\.120\.254\.223 ssh-ed25519 ' ops/mnebydns-owner-ssh-known_hosts
          grep -q '^89\.125\.90\.101 ssh-ed25519 ' ops/mnebydns-owner-ssh-known_hosts
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
      - name: Inventory existing central controller188 (no writes)
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$RU_SSH_PASSWORD"
          sshpass -e ssh -T -F /dev/null \
            -o ConnectTimeout=12 -o BatchMode=no \
            -o PasswordAuthentication=yes -o KbdInteractiveAuthentication=no \
            -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes \
            -o HostKeyAlgorithms=ssh-ed25519 \
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no \
            -o ClearAllForwardings=yes -o LogLevel=ERROR \
            root@188.120.254.223 'python3 -' <<'PY'
          import os,pathlib,subprocess,stat
          def run(args,timeout=8):
              try:
                  x=subprocess.run(args,stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,
                                   text=True,timeout=timeout,check=False)
                  return x.returncode,x.stdout.strip()
              except Exception:
                  return 255,''
          print('controller_host=188.120.254.223')
          print('inventory_only=true')
          units=['mnebyvpn-vpn-worker.service','mnebyvpn-expiry-worker.service',
                 'mnebyvpn-bot.service']
          for name in units:
              _,out=run(['systemctl','is-active',name])
              print('controller_unit_'+name.replace('.service','')+'='+
                    (out if out in ('active','inactive','failed','unknown') else 'other'))
          _,containers=run(['docker','ps','--format','{{.Names}}'])
          names=set(containers.splitlines())
          for name in ['mnebyvpn-stage-postgres','mnebyvpn-public-web',
                       'mnebyvpn-vpn-worker','mnebyvpn-bot-info']:
              print('controller_container_'+name+'='+str(name in names).lower())
          root=pathlib.Path('/root/mnebyvpn-controller')
          for key in ['controller-signing-key.pem','controller-public.spki',
                      'fi-enrollment-ssh','fi-enrollment-ssh.pub',
                      'bootstrap-manifest.json','fi-known_hosts','fi-node-public.spki']:
              p=root/key
              try:
                  s=p.lstat()
                  safe=(stat.S_ISREG(s.st_mode) and s.st_uid==0
                        and s.st_mode&0o077==0)
                  state='protected' if safe else 'unsafe'
              except FileNotFoundError:
                  state='missing'
              print('controller_trust_'+key.replace('.','_')+'='+state)
          if 'mnebyvpn-stage-postgres' in names:
              # No subscriber, order, bearer, auth data or secrets exposed.
              query="""SELECT 'enrollment_inventory_table='||
                       (to_regclass('public.vpn_node_enrollment_inventory') IS NOT NULL)::text
                       UNION ALL SELECT 'enrollment_challenge_table='||
                       (to_regclass('public.vpn_node_enrollment_challenges') IS NOT NULL)::text
                       UNION ALL SELECT 'awg_outbox_table='||
                       (to_regclass('public.vpn_awg_command_outbox') IS NOT NULL)::text;"""
              rc,output=run(['docker','exec','mnebyvpn-stage-postgres',
                             'psql','-AtX','-v','ON_ERROR_STOP=1',
                             '-U','mnebyvpn_stage','-d','mnebyvpn_stage',
                             '-c',query])
              if rc==0:
                  for line in output.splitlines():
                      if line.startswith(('enrollment_inventory_table=',
                                          'enrollment_challenge_table=',
                                          'awg_outbox_table=')) and line.endswith(('true','false')):
                          print('controller_db_'+line)
              else:
                  print('controller_db_read=unavailable')
              # Report FI only and no other clients.
              rc,status=run(['docker','exec','mnebyvpn-stage-postgres',
                             'psql','-AtX','-v','ON_ERROR_STOP=1',
                             '-U','mnebyvpn_stage','-d','mnebyvpn_stage',
                             '-c',"SELECT status FROM vpn_node_enrollment_inventory WHERE node_id='fi-test-01';"])
              if rc==0:
                  value=status.strip() or 'absent'
                  print('controller_fi_enrollment='+(
                    value if value in ('absent','planned','approved','enrolled','revoked') else 'unknown'))
              else:print('controller_fi_enrollment=unavailable')
          print('production_changes_made=false')
          PY
      - name: Inspect existing Telegram MTProxy/Telemt on DE89 (no config or secrets)
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$DE_SSH_PASSWORD" ]; then
            echo "telegram_existing_node89=credential_missing"
            exit 0
          fi
          export SSHPASS="$DE_SSH_PASSWORD"
          sshpass -e ssh -T -F /dev/null \
            -o ConnectTimeout=12 -o BatchMode=no \
            -o PasswordAuthentication=yes -o KbdInteractiveAuthentication=no \
            -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes \
            -o HostKeyAlgorithms=ssh-ed25519 \
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no \
            -o ClearAllForwardings=yes -o LogLevel=ERROR \
            root@89.125.90.101 'python3 -' <<'PY'
          import re,subprocess
          print('telegram_existing_node89=89.125.90.101')
          try:
              x=subprocess.run(['systemctl','list-units','--type=service','--all',
                                '--no-pager','--plain','--no-legend'],
                               capture_output=True,text=True,timeout=8)
              units=sorted({line.split()[0] for line in x.stdout.splitlines()
                if line.split() and re.search(r'(?i)telemt|mtproxy|mtg|tproxy',line.split()[0])})
              for u in units[:25]:
                  p=subprocess.run(['systemctl','is-active',u],capture_output=True,
                                   text=True,timeout=5)
                  state=p.stdout.strip()
                  print('telegram_proxy_unit_'+re.sub(r'[^A-Za-z0-9_.-]','_',u)+
                        '='+ (state if state in ('active','inactive','failed') else 'other'))
              print('telegram_proxy_component_detected='+str(bool(units)).lower())
          except Exception:
              print('telegram_proxy_audit=unavailable')
          print('production_changes_made=false')
          PY
