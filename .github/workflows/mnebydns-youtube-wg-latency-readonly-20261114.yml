name: MNEBYDNS repeat YouTube payload latency and WireGuard RTT read only
on:
  push:
    branches: [feat/mnebydns-youtube-quic-ru188-de89-20261114]
    paths: ['.github/workflows/mnebydns-youtube-wg-latency-readonly-20261114.yml']
permissions: {contents: read}
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      RU_PASS: ${{ secrets.SERVER188_SSH_PASSWORD }}
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Prepare pinned SSH
        run: |
          set -Eeuo pipefail
          test -n "$RU_PASS" && test -n "$DE_PASS" && test -s ops/mnebydns-owner-ssh-known_hosts
          sudo apt-get update -qq && sudo apt-get install -qq -y sshpass >/dev/null
      - name: RT T measurements and repeat YouTube thumbnail to compare warm and cold paths
        run: |
          set -Eeuo pipefail
          for role in RU DE;do
            if [[ "$role" == RU ]];then host=188.120.254.223;export SSHPASS="$RU_PASS";else host=89.125.90.101;export SSHPASS="$DE_PASS";fi
            sshpass -e ssh -T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts" -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR root@"$host" python3 - "$role" <<'PY'
          import subprocess,sys
          role=sys.argv[1]
          wg_target='10.66.77.1' if role=='RU' else '10.66.77.2'
          p=subprocess.run(['ping','-n','-c','5','-i','0.25','-W','2','-s','1200',wg_target],
                  capture_output=True,text=True,timeout=12)
          print('WG_PING_'+role+'_RC='+str(p.returncode))
          for l in p.stdout.splitlines():
              if 'packet loss' in l or 'min/avg/max' in l:
                  print('WG_PING_'+role+'='+l[:170])
          host='i.ytimg.com'
          path='/vi/aqz-KE-bpKQ/hqdefault.jpg'
          for label,ip in [('loopback','127.0.0.1'),('wg_de','10.66.77.1')]:
              if role=='DE' and label=='wg_de':continue
              for k in range(3):
                  cmd=['curl','--http1.1','-sS','-L','--max-time','14','--connect-timeout','5','--noproxy','*',
                       '--resolve',host+':443:'+ip,'-o','/dev/null',
                       '-w','%{http_code} %{size_download} %{time_total} %{speed_download}', 
                       'https://'+host+path]
                  q=subprocess.run(cmd,text=True,capture_output=True,timeout=18)
                  print('THUMB_REPEAT_'+role+'_'+label+'_'+str(k)+'=RC'+str(q.returncode)+' '+q.stdout[:110],flush=True)
          print('READONLY=true')
          PY
          done
