name: Telegram foreign 443 SYNACK canary with independent rollback
"on":
  push:
    branches: [diag/telegram-proxy-443-versions-20261114]
    paths: ['.github/workflows/telegram-de-synack-canary-20261114.yml']
permissions:
  contents: read
concurrency:
  group: telegram-foreign-443-synack-oneoff
  cancel-in-progress: false
jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Offline lint, pinned SSH and public preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/telegram_de_synack_canary_20261114.py
          test -s ops/mnebydns-owner-ssh-known_hosts && test -n "$DE_PASS"
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass >/dev/null
          python3 - <<'PY'
          import socket,ssl
          host='cdn.servgo.ru'
          try:
              with socket.create_connection(('89.125.90.101',443),timeout=5) as sock:
                  sock.settimeout(5)
                  with ssl.create_default_context().wrap_socket(sock,server_hostname=host):
                      print('BASELINE_PUBLIC_443=TLS_OK')
          except Exception as e:
              print('BASELINE_PUBLIC_443='+type(e).__name__)
          for label,ip,port in [('DE8443','89.125.90.101',8443),('DE853','89.125.90.101',853),('RU443','188.120.254.223',443)]:
              try:
                  with socket.create_connection((ip,port),timeout=4):print('BASELINE_'+label+'=OK')
              except Exception as e:print('BASELINE_'+label+'='+type(e).__name__)
          PY
      - name: Install source-scoped temporary test rule (two-minute independent rollback)
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          RUNNER_IP="$(curl --noproxy '*' -fsS --connect-timeout 6 --max-time 10 https://api.ipify.org)"
          echo "::add-mask::$RUNNER_IP"
          export SSHPASS="$DE_PASS"
          opts=(-o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts"
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR)
          sshpass -e scp -q ${opts[@]} scripts/telegram_de_synack_canary_20261114.py root@89.125.90.101:/tmp/telegram_de_synack_canary_20261114.py
          sshpass -e ssh -T ${opts[@]} root@89.125.90.101 "python3 /tmp/telegram_de_synack_canary_20261114.py install '$GITHUB_RUN_ID' '$RUNNER_IP'"
          echo 'staged=true' >> "$GITHUB_OUTPUT"
      - name: Verify foreign HTTPS 443 and other critical ports independently
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import socket,ssl
          host='cdn.servgo.ru'
          with socket.create_connection(('89.125.90.101',443),timeout=5) as raw:
              raw.settimeout(5)
              with ssl.create_default_context().wrap_socket(raw,server_hostname=host) as tls:
                  tls.sendall(('GET / HTTP/1.1\r\nHost: '+host+'\r\nConnection: close\r\n\r\n').encode())
                  line=tls.recv(256).split(b'\r\n')[0].decode('ascii','replace')
                  print('CANARY_TLS_VERSION='+tls.version())
                  print('CANARY_HTTPS_STATUS_LINE='+line)
                  assert line.startswith('HTTP/') and int(line.split()[1]) in (200,301,302,304)
          for label,ip,port in [('DE8443','89.125.90.101',8443),('DE853','89.125.90.101',853),('RU443','188.120.254.223',443)]:
              with socket.create_connection((ip,port),timeout=4):print('CANARY_'+label+'=OK')
          print('CANARY_NETWORK_CHECKS=PASS')
          PY
      - name: Remove temporary rule and disarm timer (always)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$DE_PASS" ]; then
            export SSHPASS="$DE_PASS"
            opts=(-o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519
              -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts"
              -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR)
            sshpass -e ssh -T ${opts[@]} root@89.125.90.101 "if test -s /tmp/telegram_de_synack_canary_20261114.py && test -d /root/proxy-backups/telegram-de-synack-canary-$GITHUB_RUN_ID; then python3 /tmp/telegram_de_synack_canary_20261114.py rollback '$GITHUB_RUN_ID'; fi; rm -f /tmp/telegram_de_synack_canary_20261114.py"
          fi
      - name: Confirm original public condition after cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          import socket
          try:
              with socket.create_connection(('89.125.90.101',443),timeout=4):
                  print('POST_CLEANUP_DE443=CONNECTED')
          except Exception as e:print('POST_CLEANUP_DE443='+type(e).__name__)
          print('CANARY_COMPLETE=true')
          PY
