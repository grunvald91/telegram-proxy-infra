name: MNEBYVPN temporary single-source INPUT443 diagnostic
on:
  push:
    paths: ['.github/workflows/mnebyvpn-443-temp-allow-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      HOST: '188.120.254.223'
      PASSWORD: ${{ secrets.SERVER188_SSH_PASSWORD }}
    steps:
      - name: Short-lived accept from this runner only, always remove
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PASSWORD"
          sudo apt-get update -qq && sudo apt-get install -qq -y sshpass
          MY_IP="$(curl -4 -fsS --max-time 8 https://api.ipify.org)"
          [[ "$MY_IP" =~ ^[0-9.]+$ ]] || exit 2
          export SSHPASS="$PASSWORD"
          opts=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=12 -o LogLevel=ERROR)
          sshpass -e ssh "${opts[@]}" "root@$HOST" "bash -s '$MY_IP'" <<'REMOTE' > "$RUNNER_TEMP/server-guard.txt" &
          set -Eeuo pipefail
          source="$1"
          [[ "$source" =~ ^[0-9.]+$ ]] || exit 2
          remove(){
            iptables -D INPUT -s "$source/32" -p tcp --dport 443 -j ACCEPT || true
            echo 'temporary_allow_removed=true'
          }
          trap remove EXIT
          iptables -I INPUT 1 -s "$source/32" -p tcp --dport 443 -j ACCEPT
          echo 'temporary_allow_active=true'
          sleep 18
          REMOTE
          ssh_pid=$!
          sleep 3
          python3 - <<'PY'
          import socket
          for index in range(2):
            try:
              with socket.create_connection(('188.120.254.223',443),timeout=5):
                print('with_temporary_source_allow=connected')
            except Exception as exc:
              print('with_temporary_source_allow='+type(exc).__name__)
          PY
          wait "$ssh_pid"
          cat "$RUNNER_TEMP/server-guard.txt"
