name: FI DNS controller private services (gate OFF)
"on":
  pull_request:
    paths: ["nodekit/fi_dns_controller*","nodekit/systemd/mnebyvpn-fi-dns-*.service",".github/workflows/fi-dns-controller-services.yml"]
  push:
    branches: [main]
    paths: [".github/workflows/fi-dns-controller-services.yml","nodekit/fi_dns_controller_stage.py","nodekit/fi_dns_controller_worker.mjs","nodekit/systemd/mnebyvpn-fi-dns-*.service"]
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: mnebyvpn-fleet-fi
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: grunvald91/Mnebyvpn
          ref: 758f43222ce2aae53e67c8f27103b991100de193
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: '22.16.0'}
      - name: Verify entrypoints, isolated units and actual stage script
        run: |
          set -Eeuo pipefail
          python3 -m py_compile nodekit/fi_dns_controller_stage.py
          node --check nodekit/fi_dns_controller_worker.mjs
          python3 - <<'PY'
          from pathlib import Path
          import re
          for mode in ('meter','publisher'):
              text=Path('nodekit/systemd/mnebyvpn-fi-dns-'+mode+'.service').read_text()
              assert 'ConditionPathExists=/root/mnebyvpn-controller/approvals/fi-dns-private.enable' in text
              assert 'IPAddressDeny=any' in text and 'IPAddressAllow=127.0.0.0/8' in text
              assert '[Install]' not in text and 'NoNewPrivileges=yes' in text
          worker=Path('nodekit/fi_dns_controller_worker.mjs').read_text()
          imports=re.findall(r"from '\./([^']+)'",worker)
          assert len(imports)==3 and all((Path('source/packages/dns-policy/src')/p).is_file() for p in imports)
          lines=Path('.github/workflows/fi-dns-controller-services.yml').read_text().splitlines()
          i=lines.index('      - name: Install only private FI DNS controller services')
          i=next(j for j in range(i+1,len(lines)) if lines[j]=='        run: |')+1
          rows=[]
          for line in lines[i:]:
              if line and not line.startswith('          '): break
              rows.append(line[10:] if line.startswith('          ') else '')
          Path('/tmp/fi-controller-stage.sh').write_text('\n'.join(rows)+'\n')
          PY
          bash -n /tmp/fi-controller-stage.sh
  stage:
    needs: offline
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: node-fi
    env:
      RU_PASSWORD: ${{ secrets.SERVER188_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: grunvald91/Mnebyvpn
          ref: 758f43222ce2aae53e67c8f27103b991100de193
          path: source
          persist-credentials: false
      - name: Confirm exact main source CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(git -C source rev-parse HEAD)" = 758f43222ce2aae53e67c8f27103b991100de193
          gh api repos/grunvald91/Mnebyvpn/actions/runs/45413592393 --jq '[.head_sha,.head_branch,.status,.conclusion] | join(" ")' | grep -qx '758f43222ce2aae53e67c8f27103b991100de193 main completed success'
      - name: Install only private FI DNS controller services
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          [[ -n "$RU_PASSWORD" ]] || exit 2
          grep -q '^188\.120\.254\.223 ssh-ed25519 ' ops/mnebydns-owner-ssh-known_hosts
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends sshpass >/dev/null
          work="$RUNNER_TEMP/fi-dns-canary"
          mkdir -m 0700 "$work"
          cat > "$work/ru.cfg" <<CFG
          Host ru-controller
            HostName 188.120.254.223
            User root
            UserKnownHostsFile $GITHUB_WORKSPACE/ops/mnebydns-owner-ssh-known_hosts
            GlobalKnownHostsFile /dev/null
            HostKeyAlgorithms ssh-ed25519
            StrictHostKeyChecking yes
            UpdateHostKeys no
            PubkeyAuthentication no
            PreferredAuthentications password
            ForwardAgent no
            ClearAllForwardings yes
            ControlMaster no
            ConnectTimeout 12
            LogLevel ERROR
          CFG
          ru_node() { SSHPASS="$RU_PASSWORD" sshpass -e ssh -T -F "$work/ru.cfg" ru-controller "$@"; }
          stage="/run/fi-dns-controller-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          [[ "$stage" =~ ^/run/fi-dns-controller-[0-9]+-[0-9]+$ ]]
          created=no
          cleanup() {
            set +e
            if [[ "$created" == yes ]]; then ru_node "rm -rf -- '$stage'" >/dev/null 2>&1; fi
            rm -rf "$work"
          }
          trap cleanup EXIT
          ru_node "umask 077; mkdir -m 0700 '$stage'"
          created=yes
          SSHPASS="$RU_PASSWORD" sshpass -e scp -F "$work/ru.cfg" \
            nodekit/fi_dns_controller_worker.mjs nodekit/fi_dns_controller_stage.py nodekit/fi_dns_db_stage.py \
            nodekit/systemd/mnebyvpn-fi-dns-{meter,publisher}.service \
            source/packages/dns-policy/src/fi-dns-meter-loopback.ts \
            source/packages/dns-policy/src/fi-dns-meter-rpc.ts \
            source/packages/dns-policy/src/fi-dns-snapshot-publisher.ts \
            source/packages/dns-policy/src/fi-personal-dns-signed-snapshot.ts \
            "ru-controller:$stage/"
          ru_node "chmod 600 '$stage'/*; python3 '$stage/fi_dns_controller_stage.py' '$stage'"
