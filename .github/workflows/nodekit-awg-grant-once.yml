name: FI AWG lease install one-shot dispatch
on:
  push:
    branches: [feat/nodekit-awg-signed-access-20261118]
    paths: [.github/workflows/nodekit-awg-grant-once.yml]
permissions:
  contents: write
  actions: write
jobs:
  dispatch:
    if: github.repository == 'grunvald91/telegram-proxy-infra'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect isolated FI AWG peer grant ledger after safe install
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh api --method POST repos/grunvald91/telegram-proxy-infra/actions/workflows/nodekit-fleet-bootstrap.yml/dispatches \
            -f ref=main \
            -f "inputs[country]=fi" \
            -f "inputs[phase]=inspect"
