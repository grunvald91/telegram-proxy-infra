name: MNEBYVPN prepare sealed support-token transfer key
on:
  push:
    branches: [main]
    paths: ['.github/workflows/mnebyvpn-support-key-prepare.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mnebyvpn-support-key-prepare
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SSH_PASSWORD: ${{ secrets.SERVER188_SSH_PASSWORD }}
    steps:
      - name: Create dedicated MNEBYVPN OAEP key in isolated server directory
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_PASSWORD"
          sudo apt-get update -qq && sudo apt-get install -qq -y sshpass
          export SSHPASS="$SSH_PASSWORD"
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=accept-new \
            -o LogLevel=ERROR root@188.120.254.223 'bash -se' <<'SH'
          set -euo pipefail
          umask 077
          key=/opt/mnebyvpn/private/support-transfer-oaep.pem
          mkdir -p /opt/mnebyvpn/private
          chmod 700 /opt/mnebyvpn/private
          if [[ ! -s "$key" ]]; then
            openssl genpkey -quiet -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$key"
          fi
          chmod 600 "$key"
          test "$(openssl pkey -in "$key" -text -noout | head -1 | grep -c 3072)" -eq 1
          echo SUPPORT_TRANSFER_PUBLIC_KEY_BEGIN
          openssl pkey -in "$key" -pubout
          echo SUPPORT_TRANSFER_PUBLIC_KEY_END
          echo private_key_remains_on_server=true
          SH
