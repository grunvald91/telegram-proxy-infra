name: Check public MNEBYDNS reachability (read only)
on:
  push:
    branches: [diag/mnebyvpn-private-dns-20261108]
    paths: [.github/workflows/mnebyvpn-private-dns-diagnostic.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: DNS name, TCP 853, certificate, and DoT response
        shell: bash
        run: |
          python3 - <<'PY'
          import socket,ssl,struct,time
          host='dns.mnebyvpn.site'
          try:
              ips=sorted(set(x[4][0] for x in socket.getaddrinfo(host,853,type=socket.SOCK_STREAM)))
              print('dns_ips',ips)
          except Exception as e:
              print('dns_lookup_error',type(e).__name__)
          failures=0
          successful=0
          for target in (host,'89.125.90.101'):
              for attempt in range(3):
                  try:
                      start=time.monotonic()
                      with socket.create_connection((target,853),timeout=5) as raw:
                          with ssl.create_default_context().wrap_socket(raw,server_hostname=host) as conn:
                              conn.settimeout(5)
                              question=b''.join(bytes([len(part)])+part.encode('ascii') for part in ('example','org'))+bytes([0])+struct.pack('!HH',1,1)
                              message=struct.pack('!HHHHHH',1234,256,1,0,0,0)+question
                              conn.sendall(struct.pack('!H',len(message))+message)
                              prefix=conn.recv(2)
                              if len(prefix)<2: raise ValueError('empty_dns_reply')
                              count=struct.unpack('!H',prefix)[0]
                              response=conn.recv(count)
                              if len(response)<12: raise ValueError('short_dns_reply')
                              rcode=response[3]&15
                              answer_count=struct.unpack('!H',response[6:8])[0]
                              print(target,attempt,'tls',conn.version(),'rcode',rcode,'answers',answer_count,'ms',round((time.monotonic()-start)*1000))
                              if rcode!=0: failures+=1
                              else: successful+=1
                  except Exception as e:
                      print(target,attempt,'error',type(e).__name__)
                      failures+=1
                  time.sleep(1)
          print('summary_successful',successful,'summary_failures',failures)
          if failures: raise SystemExit(1)
          PY