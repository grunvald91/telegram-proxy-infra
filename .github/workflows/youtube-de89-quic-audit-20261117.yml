name: DE89 read-only QUIC resolver and dependency audit
on:
  push:
    branches: [diag/youtube-de89-quic-audit-20261117]
    paths:
      - .github/workflows/youtube-de89-quic-audit-20261117.yml
      - scripts/youtube-de89-owner-return-bypass-20261117.py
permissions: {contents: read}
concurrency:
  group: mnebydns-youtube-quic-audit
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Validate existing parser and prepare pinned SSH
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/youtube-de89-owner-return-bypass-20261117.py scripts/termux-youtube-libcurl-20261117.py
          test -n "$DE_PASS" && test -s ops/mnebydns-owner-ssh-known_hosts
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          cat > "$RUNNER_TEMP/de-phone" <<'SHELL'
          #!/bin/bash
          set -Eeuo pipefail
          export SSHPASS="$DE_PASS"
          exec sshpass -e ssh -T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=5 -o ServerAliveCountMax=3 -o HostKeyAlgorithms=ssh-ed25519 \
            -o "UserKnownHostsFile=$GITHUB_WORKSPACE/ops/mnebydns-owner-ssh-known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR \
            root@89.125.90.101 "$@"
          SHELL
          chmod 700 "$RUNNER_TEMP/de-phone"
      - name: Inspect UDP baseline and compare independent origin DNS
        run: |
          set -Eeuo pipefail
          "$RUNNER_TEMP/de-phone" 'timeout 55s bash -s' <<'REMOTE'
          set -u
          date -u +%FT%TZ
          python3 --version
          python3 -c 'import aioquic; print("SYSTEM_AIOQUIC="+aioquic.__file__)' 2>/dev/null || true
          for base in /opt/mnebydns-youtube-quic-43612369808 /tmp/mnebydns-youtube-quic-43612369808; do
            if test -d "$base"; then find "$base" -maxdepth 3 -type d -name aioquic; fi
          done
          for name in www.youtube.com youtubei.googleapis.com rr1---sn-gxuo03g-ig3s.googlevideo.com; do
            echo "ORIGIN_DNS=$name"
            timeout 5s getent ahostsv4 "$name" | head -n 3 || true
            if command -v dig >/dev/null; then timeout 5s dig @9.9.9.9 "$name" A +short +time=2 +tries=1; fi
          done
          for unit in mnebydns-google-tcp-only-20261117.service mnebydns-de89-public-quic-20261115.service mnebydns-youtube-quic-de-43612369808.service; do
            echo "UNIT=$unit"
            systemctl is-active "$unit" || true
            systemctl is-enabled "$unit" || true
          done
          ss -Hlun 'sport = :443 or sport = :19444'
          iptables -S INPUT | grep -E 'MNEBYDNS_GOOGLE_TCP_ONLY|udp.*443' || true
          sha256sum /opt/mnebydns-youtube-quic-43612369808/relay.py
          echo QUIC_READONLY_AUDIT_COMPLETE=true
          REMOTE
