name: MNEBYDNS Meta public Russian ingress end-to-end original TLS test
on:
  push:
    branches: ['feature/mnebydns-meta-via-wireguard-pilot-20261109']
    paths: ['.github/workflows/mnebydns-meta-public-ingress-tls.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: End-to-end TLS from public Russian SNI ingress across private German exit
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures,socket,ssl,time
          RU_PUBLIC='188.120.254.223'
          NAMES=('instagram.com','www.instagram.com','i.instagram.com',
                 'graph.instagram.com','edge-mqtt.facebook.com',
                 'threads.com','threads.net','graph.threads.net',
                 'meta.com','meta.ai')
          def probe(name):
              start=time.monotonic()
              try:
                  with socket.create_connection((RU_PUBLIC,443),timeout=7) as sock:
                      sock.settimeout(7)
                      with ssl.create_default_context().wrap_socket(sock,server_hostname=name) as tls:
                          result='TLS_VALID_'+tls.version()
              except Exception as ex:
                  result='FAILED_'+type(ex).__name__
              return name,result,round(1000*(time.monotonic()-start))
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as pool:
              results=list(pool.map(probe,NAMES))
          for name,state,ms in results:
              print('public_RU443_behind_WireGuard='+name+' status='+state+' elapsed_ms='+str(ms),flush=True)
          valid=sum(s.startswith('TLS_VALID') for _,s,_ in results)
          print('public_ru_meta_tls_valid='+str(valid)+'/'+str(len(NAMES)),flush=True)
          print('no_payload_or_user_data_captured=true',flush=True)
          print('test_makes_no_configuration_changes=true',flush=True)
          if valid!=len(NAMES):raise SystemExit(2)
          PY
