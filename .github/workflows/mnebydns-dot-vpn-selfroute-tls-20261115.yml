name: MNEBYDNS DoT VPN local self-route TLS SNI comparison read-only
on:
  push:
    branches: [diag/mnebydns-live-video-stall-20261115]
    paths: [.github/workflows/mnebydns-dot-vpn-selfroute-tls-20261115.yml]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
      RU_PASS: ${{ secrets.SERVER188_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Strict TLS SNI certificate checks from DE local and RU through DoT port
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$DE_PASS" && test -n "$RU_PASS" && test -s ops/mnebydns-owner-ssh-known_hosts
          sudo apt-get update -qq && sudo apt-get install -qq -y sshpass >/dev/null
          opts=(-T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts" -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR)
          cat > /tmp/dot-selfroute.py <<'PY'
          import socket,ssl,sys,time,datetime
          role=sys.argv[1]
          print("SELFROUTE_ROLE="+role,flush=True)
          paths=[("public_de","89.125.90.101",853)]
          if role=="DE89":paths.extend([("local_alias","127.0.0.1",853),("sni_router","127.0.0.1",8854)])
          hosts=[("legacy","dns.mnebyvpn.site"),("personal","aaaaaaaaaaaa.dns.mnebyvpn.site")]
          for name,ip,port in paths:
            for tag,host in hosts:
              start=time.monotonic()
              try:
                with socket.create_connection((ip,port),timeout=4) as sock:
                  sock.settimeout(4)
                  with ssl.create_default_context().wrap_socket(sock,server_hostname=host) as tls:
                    print("SELFROUTE_CHECK_"+role+"_"+name+"_"+tag+"=CERT_VALID "+str(round((time.monotonic()-start)*1000))+"ms",flush=True)
              except Exception as ex:
                print("SELFROUTE_CHECK_"+role+"_"+name+"_"+tag+"="+type(ex).__name__+" "+str(round((time.monotonic()-start)*1000))+"ms",flush=True)
          print("SELFROUTE_DONE="+role,flush=True)
          PY
          SSHPASS="$DE_PASS" sshpass -e ssh "${opts[@]}" root@89.125.90.101 'python3 - DE89' < /tmp/dot-selfroute.py > de.log 2>&1 &
          pd=$!
          SSHPASS="$RU_PASS" sshpass -e ssh "${opts[@]}" root@188.120.254.223 'python3 - RU188' < /tmp/dot-selfroute.py > ru.log 2>&1 &
          pr=$!
          rc=0
          wait "$pd" || rc=1
          wait "$pr" || rc=1
          echo SELFROUTE_DE_BEGIN;cat de.log;echo SELFROUTE_DE_END
          echo SELFROUTE_RU_BEGIN;cat ru.log;echo SELFROUTE_RU_END
          test "$rc" -eq 0
          grep -q SELFROUTE_DONE=DE89 de.log
          grep -q SELFROUTE_DONE=RU188 ru.log
