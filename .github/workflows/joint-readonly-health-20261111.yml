name: Joint read-only DNS VPN Telegram proxy health 2026-11-11
on:
  push:
    branches: [main]
    paths: ['.github/workflows/joint-readonly-health-20261111.yml']
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
concurrency:
  group: joint-readonly-health-20261111
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      RU_PASS: ${{ secrets.SERVER188_SSH_PASSWORD }}
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: External DoT, HTTPS, and TCP probe (no server changes)
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import socket, ssl, struct, time, urllib.request
          print('DIAG_UTC='+time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),flush=True)
          for host,port in [('89.125.90.101',853),('188.120.254.223',443),('89.125.90.101',443),('188.120.254.223',8443)]:
              try:
                  with socket.create_connection((host,port),timeout=5) as s: pass
                  print('TCP_REACH='+host+':'+str(port)+':PASS',flush=True)
              except Exception as ex:
                  print('TCP_REACH='+host+':'+str(port)+':FAIL:'+type(ex).__name__,flush=True)
          def recv_exact(s,n):
              buf=b''
              while len(buf)<n:
                  part=s.recv(n-len(buf))
                  if not part:raise EOFError()
                  buf+=part
              return buf
          def query(host):
              question=b''.join(bytes([len(x)])+x.encode('ascii') for x in host.split('.'))+b'\x00'+struct.pack('!HH',1,1)
              packet=struct.pack('!HHHHHH',0x7231,0x0100,1,0,0,0)+question
              with socket.create_connection(('89.125.90.101',853),timeout=6) as sock:
                  sock.settimeout(6)
                  with ssl.create_default_context().wrap_socket(sock,server_hostname='dns.mnebyvpn.site') as tls:
                      tls.sendall(struct.pack('!H',len(packet))+packet)
                      length=struct.unpack('!H',recv_exact(tls,2))[0]
                      response=recv_exact(tls,length)
              transaction,flags,qd,an,ns,ar=struct.unpack('!HHHHHH',response[:12])
              if transaction!=0x7231:raise ValueError('txid_mismatch')
              offset=12
              def skip_name(k):
                  for _ in range(128):
                      length=response[k]
                      if length&0xc0==0xc0:return k+2
                      if length==0:return k+1
                      k+=length+1
                  raise ValueError('bad_name')
              for i in range(qd): offset=skip_name(offset)+4
              ips=[]
              for i in range(an):
                  offset=skip_name(offset)
                  typ,cls,ttl,rdlen=struct.unpack('!HHIH',response[offset:offset+10]);offset+=10
                  if typ==1 and cls==1 and rdlen==4:ips.append(socket.inet_ntoa(response[offset:offset+4]))
                  offset+=rdlen
              return flags&15,ips
          for host in ('claude.ai','antigravity.google','instagram.com','i.instagram.com','test-gateway.instagram.com','z-m-gateway.facebook.com','www.youtube.com','api.telegram.org','www.tiktok.com','example.org'):
              try:
                  rcode,ips=query(host)
                  print('DOT_QUERY='+host+' rcode='+str(rcode)+' A='+','.join(ips[:6]),flush=True)
              except Exception as ex:
                  print('DOT_QUERY='+host+' ERROR='+type(ex).__name__,flush=True)
          for url in ('https://mnebyvpn.site/','https://dns.mnebyvpn.site/'):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'MNEBYVPN-read-only-health'}),timeout=8) as r:
                      print('HTTPS='+url+' status='+str(r.status),flush=True)
              except Exception as ex:
                  print('HTTPS='+url+' ERROR='+type(ex).__name__,flush=True)
          PY
      - name: Read-only SSH service and config inventory of both nodes
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$RU_PASS" && test -n "$DE_PASS"
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass >/dev/null
          test -s ops/mnebydns-owner-ssh-known_hosts
          audit_remote() {
            local role="$1" host="$2"
            export SSHPASS="$3"
            sshpass -e ssh -o ConnectTimeout=12 -o ServerAliveInterval=9 -o ServerAliveCountMax=1 -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts" -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no "root@$host" "python3 - '$role'" <<'PY'
          import sys,os,re,time,subprocess,socket,pathlib
          role=sys.argv[1]
          def call(cmd,timeout=7):
              try:
                  p=subprocess.run(cmd,text=True,stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,timeout=timeout)
                  return p.returncode,p.stdout.strip()
              except Exception:return 255,''
          def out(k,v):print(role+'_'+k+'='+str(v),flush=True)
          out('CLOCK_EPOCH',int(time.time()))
          out('UPTIME_SECONDS',round(float(pathlib.Path('/proc/uptime').read_text().split()[0])))
          out('LOAD_1',pathlib.Path('/proc/loadavg').read_text().split()[0])
          mem=pathlib.Path('/proc/meminfo').read_text()
          vals={k:int(v) for k,v in re.findall(r'^(MemTotal|MemAvailable|SwapFree):\s+(\d+)',mem,re.M)}
          out('MEM_AVAILABLE_PCT',round(100*vals.get('MemAvailable',0)/max(1,vals.get('MemTotal',1)),1))
          rc,s=call(['df','-P','/']);line=s.splitlines()
          if len(line)>1:out('ROOT_DISK_USE',line[-1].split()[4])
          rc,units=call(['systemctl','list-units','--type=service','--all','--no-legend','--no-pager','--plain'],12)
          allow=('nginx','xray','remnawave','mtproxy','telemt','mtg','mnebydns','wg-quick','relay89','telegram','mnebyvpn')
          names=[]
          for line in units.splitlines():
              unit=line.split()[0] if line.split() else ''
              if unit.endswith('.service') and unit.lower().startswith(allow) and unit not in names:names.append(unit)
          for name in sorted(names)[:45]:
              rc,props=call(['systemctl','show',name,'-p','ActiveState','-p','SubState','-p','NRestarts','-p','Result','--no-pager'])
              d=dict(line.split('=',1) for line in props.splitlines() if '=' in line)
              out('UNIT_'+name,','.join(d.get(k,'?') for k in ('ActiveState','SubState','NRestarts','Result')))
          for name in ('nginx','mnebydns-dot.service','mnebydns-googlepilot.service','xray.service','mtproxy.service','mtproxy-ru.service'):
              rc,logs=call(['journalctl','-u',name,'--since','-30 minutes','-n','100','--no-pager','-o','cat'],8)
              if rc==0:
                  out('LOG_'+name+'_lines',len(logs.splitlines()))
                  out('LOG_'+name+'_errors',len(re.findall(r'fail|error|refused|timeout|panic|killed|restart',logs,re.I)))
          rc,lint=call(['nginx','-t'],9);out('NGINX_CONFIG_OK',rc==0)
          for path in ('/opt/mnebydns-dot/Corefile','/etc/nginx/nginx.conf','/etc/mnebydns-googlepilot/nginx.conf'):
              p=pathlib.Path(path)
              if p.exists():
                  out('CONFIG_'+p.name+'_AGE_SEC',int(time.time()-p.stat().st_mtime))
          if role=='DE':
              current=pathlib.Path('/opt/mnebydns-stable-checkpoints/current')
              if current.exists():
                  base=pathlib.Path(current.read_text().strip())
                  for label,a,b in (('DNS',base/'dns.stable',pathlib.Path('/opt/mnebydns-dot/Corefile')),
                                    ('NGINX',base/'nginx.stable',pathlib.Path('/etc/nginx/nginx.conf')),
                                    ('PILOT',base/'proxy.stable',pathlib.Path('/etc/mnebydns-googlepilot/nginx.conf'))):
                      out('STABLE_'+label+'_MATCH',a.exists() and b.exists() and a.read_bytes()==b.read_bytes())
                  rc,ck=call(['sha256sum','-c','stable-manifest.sha256'],8) if False else (0,'')
              out('OWNER_ROLLBACK_TIMER_FILES',len(list(pathlib.Path('/etc/systemd/system').glob('mnebydns-owner-rollback-*.timer'))))
              out('OWNER_PILOT_DIRS',len(list(pathlib.Path('/opt/mnebydns-owner-domain').glob('[0-9]*'))) if pathlib.Path('/opt/mnebydns-owner-domain').exists() else 0)
          for name in ('nf_conntrack_count','nf_conntrack_max'):
              p=pathlib.Path('/proc/sys/net/netfilter')/name
              if p.exists():out(name,p.read_text().strip())
          rc,ss=call(['ss','-lntH'],8)
          for port in (443,853,8443,2052,2086,8089,9443,9470,2053):
              out('TCP_LISTEN_'+str(port),bool(re.search(r':'+str(port)+r'\s',ss)))
          rc,wg=call(['wg','show','all','latest-handshakes'],7)
          if rc==0:
              stamps=[]
              for line in wg.splitlines():
                  try:
                      v=int(line.split()[-1])
                      if v>0:stamps.append(int(time.time())-v)
                  except Exception:pass
              out('WG_PEERS_WITH_HANDSHAKE',len(stamps))
              out('WG_NEWEST_HANDSHAKE_AGE_SEC',min(stamps) if stamps else 'none')
          rc,sync=call(['timedatectl','show','-p','NTPSynchronized','--value'],6);out('NTP_SYNCED',sync if rc==0 else 'unknown')
          for url in ('https://api.telegram.org/','https://www.google.com/generate_204'):
              rc,status=call(['curl','-4','-LsS','--connect-timeout','3','--max-time','7','-o','/dev/null','-w','%{http_code}',url],9)
              out('OUTBOUND_'+('TELEGRAM' if 'telegram' in url else 'GOOGLE'),status if rc==0 else 'CONNECT_FAIL')
          if role=='RU':
              rc,ping=call(['ping','-c','2','-W','2','10.66.77.1'],7)
              out('RU_TO_WG_PEER_ICMP',rc==0)
          out('READ_ONLY_COMPLETE',True)
          PY
          }
          audit_remote RU 188.120.254.223 "$RU_PASS"
          audit_remote DE 89.125.90.101 "$DE_PASS"
          echo 'JOINT_DIAG_FINISHED=true'
      - name: Inspect DNS checkpoint drift, local TLS paths, and proxy health without changing state
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get install -y -qq sshpass >/dev/null
          remote_script='python3 -'
          export SSHPASS="$DE_PASS"
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts" -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no root@89.125.90.101 "$remote_script" <<'PY'
          import pathlib,hashlib,difflib,re,subprocess,ssl,socket,time
          base=pathlib.Path(pathlib.Path('/opt/mnebydns-stable-checkpoints/current').read_text().strip())
          def out(k,v): print('DE_DEEP_'+k+'='+str(v),flush=True)
          for key,stable,live in (
              ('DNS',base/'dns.stable',pathlib.Path('/opt/mnebydns-dot/Corefile')),
              ('NGINX',base/'nginx.stable',pathlib.Path('/etc/nginx/nginx.conf')),
              ('PILOT',base/'proxy.stable',pathlib.Path('/etc/mnebydns-googlepilot/nginx.conf'))
          ):
              if not stable.exists() or not live.exists():
                  out(key+'_FILES_EXIST',False);continue
              before=stable.read_text(errors='replace').splitlines()
              after=live.read_text(errors='replace').splitlines()
              sm=difflib.SequenceMatcher(None,before,after,autojunk=False)
              removed=[];added=[]
              for tag,a,b,c,d in sm.get_opcodes():
                  if tag in ('replace','delete'):removed.extend(before[a:b])
                  if tag in ('replace','insert'):added.extend(after[c:d])
              out(key+'_REMOVED_LINES',len(removed))
              out(key+'_ADDED_LINES',len(added))
              domains=('instagram','threads','facebook','antigravity','googleapis','google','tiktok','youtube','oracle','cloudflare','telegram')
              for domain in domains:
                  old=sum(domain in x.lower() for x in removed)
                  new=sum(domain in x.lower() for x in added)
                  if old or new:out(key+'_DELTA_'+domain, 'removed:'+str(old)+',added:'+str(new))
              out(key+'_CURRENT_SHA12',hashlib.sha256(live.read_bytes()).hexdigest()[:12])
              out(key+'_CHECKPOINT_SHA12',hashlib.sha256(stable.read_bytes()).hexdigest()[:12])
              out(key+'_LINE_COUNT',str(len(before))+'->'+str(len(after)))
          pilot=pathlib.Path('/opt/mnebydns-owner-domain')
          if pilot.exists():
              ages=[]
              for path in pilot.iterdir():
                  if path.is_dir():
                      ages.append(round((time.time()-path.stat().st_mtime)/3600,1))
              out('OWNER_WORKDIRS',len(ages))
              out('OWNER_NEWEST_WORKDIR_AGE_H',min(ages) if ages else 'none')
          try:
              p=subprocess.run(['systemctl','list-timers','--all','--no-legend','--no-pager'],
                  capture_output=True,text=True,timeout=7)
              for name in ('relay89-clock-guard','mnebydns-owner-rollback','mnebydns-ig-lite'):
                  out('TIMER_'+name+'_COUNT',sum(name in x for x in p.stdout.splitlines()))
          except Exception:pass
          for unit in ('mnebydns-dot','mnebydns-googlepilot','mtproxy','mtproxy-ru','nginx','xray'):
              try:
                  p=subprocess.run(['journalctl','-u',unit,'--since','-2 hours','-n','200','-o','cat','--no-pager'],
                      capture_output=True,text=True,timeout=8)
                  s=p.stdout.lower()
                  for kind,expr in [('timeout',r'timeout|timed out'),('refused',r'refused'),('failed',r'fail|error|panic'),
                                    ('restart',r'restart|shutting down')]:
                      out('JOURNAL_'+unit+'_'+kind,len(re.findall(expr,s)))
              except Exception:pass
          for server,port,sni in [('127.0.0.1',443,'claude.ai'),('127.0.0.1',443,'antigravity.google'),('127.0.0.1',853,'dns.mnebyvpn.site')]:
              try:
                  with socket.create_connection((server,port),timeout=6) as sock:
                      sock.settimeout(6)
                      with ssl.create_default_context().wrap_socket(sock,server_hostname=sni) as t:
                          out('TLS_LOCAL_'+sni,'PASS_'+str(t.version()))
              except Exception as ex:out('TLS_LOCAL_'+sni,'FAIL_'+type(ex).__name__)
          PY
          export SSHPASS="$RU_PASS"
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts" -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no root@188.120.254.223 "bash -s" <<'SH'
          set -Eeuo pipefail
          for url in "https://mnebyvpn.site/" "https://claude.ai/"; do
            code="$(curl -sS -L -o /dev/null -w '%{http_code}' --connect-timeout 4 --max-time 8 --resolve "$(echo "$url" | sed 's#https://##;s#/.*##'):443:127.0.0.1" "$url" 2>/dev/null || echo failed)"
            echo "RU_DEEP_LOCAL_HTTPS_${url}=${code}"
          done
          if docker ps --format '{{.Names}}' | grep -qx 'mnebyvpn-stage-postgres'; then
            docker exec mnebyvpn-stage-postgres psql -XqAt -U mnebyvpn_stage -d mnebyvpn_stage -c "SELECT 'DNS_STATUS_'||status||'='||count(*) FROM dns_admin_domains GROUP BY status ORDER BY status" 2>/dev/null || true
          fi
          SH
      - name: Compare RU direct to DE public 443 against WireGuard 443 without changing routes
        shell: bash
        run: |
          set -Eeuo pipefail
          export SSHPASS="$RU_PASS"
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts" -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no root@188.120.254.223 'python3 -' <<'PY'
          import socket,ssl,time
          for dest in ('89.125.90.101','10.66.77.1'):
              for name in ('claude.ai','antigravity.google','i.instagram.com'):
                  start=time.monotonic()
                  try:
                      with socket.create_connection((dest,443),timeout=5) as sock:
                          sock.settimeout(5)
                          with ssl.create_default_context().wrap_socket(sock,server_hostname=name) as conn:
                              print('RU_PATH='+dest+' SNI='+name+' result=TLS_OK version='+str(conn.version())+' ms='+str(round(1000*(time.monotonic()-start))),flush=True)
                  except Exception as ex:
                      print('RU_PATH='+dest+' SNI='+name+' result='+type(ex).__name__+' ms='+str(round(1000*(time.monotonic()-start))),flush=True)
          PY
          export SSHPASS="$DE_PASS"
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts" -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no root@89.125.90.101 'python3 -' <<'PY'
          import subprocess,re
          for unit in ('mnebydns-dot','mnebydns-googlepilot','xray'):
              p=subprocess.run(['journalctl','-u',unit,'--since','-120 minutes','-n','150','--no-pager','-o','short-iso'],capture_output=True,text=True,timeout=7)
              seen={}
              for line in p.stdout.splitlines():
                  lo=line.lower()
                  for kind,pattern in (('reload',r'reload|restart'),('timed_out',r'timed? out|timeout'),('configuration',r'config|invalid|parse'),('connection',r'connection|refused|closed'),('upstream',r'upstream|dial|lookup|resolve'),('other_error',r'fail|error|panic')):
                      if re.search(pattern,lo):
                          ts=line[:25]
                          bucket=(ts[:16],kind)
                          seen[bucket]=seen.get(bucket,0)+1
              for (stamp,kind),count in sorted(seen.items()):
                  print('DE_JOURNAL='+unit+' time='+stamp+' kind='+kind+' count='+str(count),flush=True)
          PY
      - name: Publish diagnostic run pointer as a GitHub commit status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OVERALL: ${{ job.status }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY' > "$RUNNER_TEMP/diag-run-status.json"
          import json,os
          print(json.dumps({
            "state": "success" if os.environ.get("OVERALL") == "success" else "failure",
            "context": "diagnostics/dns-vpn-proxy-readonly",
            "description": "Read-only diagnostic run id "+os.environ["GITHUB_RUN_ID"],
            "target_url": "https://github.com/"+os.environ["GITHUB_REPOSITORY"]+"/actions/runs/"+os.environ["GITHUB_RUN_ID"]
          }))
          PY
          curl --fail --silent --show-error --retry 2 -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data-binary "@$RUNNER_TEMP/diag-run-status.json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -o /dev/null
