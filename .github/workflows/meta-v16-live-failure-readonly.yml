name: Meta v16 read-only diagnose two-phone HTTPS failure
on:
  push:
    branches: [fix/meta-routing-quic-sni-validation]
    paths: ['.github/workflows/meta-v16-live-failure-readonly.yml']
permissions:
  contents: read
concurrency:
  group: meta-v16-live-diagnostic-readonly
  cancel-in-progress: false
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare pinned SSH
        run: |
          set -Eeuo pipefail
          test -n "$DE_PASS"
          test -s ops/mnebydns-owner-ssh-known_hosts
          if ! command -v sshpass >/dev/null; then
            timeout 40s sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=7 update -qq || true
            timeout 60s sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sshpass >/dev/null
          fi
      - name: Remote read-only nft, DoT, HTTPS and service diagnostics
        run: |
          set -Eeuo pipefail
          export SSHPASS="$DE_PASS"
          opts=(-T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes
            -o HostKeyAlgorithms=ssh-ed25519
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts"
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR)
          echo '### v16 READ ONLY live packet and health diagnostics' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          tar -C scripts -cf - meta_v16_live_failure_diag.py mnebydns_iglite_dns_wire_checks.py |
          sshpass -e ssh "${opts[@]}" root@89.125.90.101 \
          'set -eu; umask 077; d=$(mktemp -d /tmp/mneby-v16-troubleshoot.XXXXXXXX); trap '\''rm -rf -- "$d"'\'' EXIT; tar -xf - -C "$d"; python3 "$d/meta_v16_live_failure_diag.py"' |
          tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
