name: MNEBYVPN old and new DoT hostname comparison read only 20261114
on:
  push:
    branches: ['diag/mnebyvpn-reality-dot-20261114']
    paths: ['.github/workflows/mnebyvpn-dot-hostname-audit-20261114.yml']
permissions:
  contents: read
concurrency:
  group: mnebyvpn-dot-hostname-audit-20261114
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      RU_PASSWORD: ${{ secrets.SERVER188_SSH_PASSWORD }}
      DE_PASSWORD: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - name: Compare strict TLS and DNS responses for both hostnames from runner, RU and DE
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$RU_PASSWORD" && test -n "$DE_PASSWORD"
          if ! command -v sshpass >/dev/null; then sudo apt-get update -qq && sudo apt-get install -qq -y sshpass; fi
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          cat > "$TMP/dot.py" <<'PY'
          import socket,ssl,struct,sys,secrets,subprocess
          role=sys.argv[1]
          hosts=['dns.myvpn.site','dns.mnebyvpn.site']
          print('probe_role='+role)
          def take(s,n):
              b=b''
              while len(b)<n:
                  x=s.recv(n-len(b))
                  if not x:raise EOFError('read')
                  b+=x
              return b
          def probe(dst,sni):
              with socket.create_connection((dst,853),timeout=4) as plain:
                  plain.settimeout(6)
                  with ssl.create_default_context().wrap_socket(plain,server_hostname=sni) as tls:
                      protocol=tls.version()
                      qid=secrets.randbits(16)
                      query=struct.pack('!HHHHHH',qid,256,1,0,0,0)
                      for label in ('example','com'):
                          query+=bytes([len(label)])+label.encode()
                      query+=b'\x00'+struct.pack('!HH',1,1)
                      tls.sendall(struct.pack('!H',len(query))+query)
                      ln=struct.unpack('!H',take(tls,2))[0]
                      response=take(tls,ln)
                      if len(response)<12 or struct.unpack('!H',response[:2])[0]!=qid:
                          return 'dns_malformed'
                      return 'tls='+str(protocol)+' rcode='+str(response[3]&15)+' len='+str(ln)
          for sni in hosts:
              name=sni.replace('.','_')
              try:
                  records=socket.getaddrinfo(sni,853,socket.AF_INET,socket.SOCK_STREAM)
                  addresses=list(dict.fromkeys(v[4][0] for v in records))
                  print(name+'_ipv4_count='+str(len(addresses)))
              except Exception as e:
                  print(name+'_resolve_error='+type(e).__name__)
                  continue
              try:print(name+'_public='+probe(sni,sni))
              except Exception as e:print(name+'_public_error='+type(e).__name__)
              if role=='ru':
                  try:print(name+'_ru_local_853='+probe('127.0.0.1',sni))
                  except Exception as e:print(name+'_ru_local_853_error='+type(e).__name__)
          if role=='ru':
              p=subprocess.run(['systemctl','is-active','mnebydns-dot.service'],text=True,capture_output=True,timeout=4)
              print('ru_dot_service_active='+str(p.stdout.strip()=='active').lower())
          print('read_only_network_test_complete=true')
          PY
          python3 "$TMP/dot.py" runner
          SSHPASS="$RU_PASSWORD" sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=accept-new -o LogLevel=ERROR root@188.120.254.223 'python3 - ru' < "$TMP/dot.py"
          SSHPASS="$DE_PASSWORD" sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=accept-new -o LogLevel=ERROR root@89.125.90.101 'python3 - de' < "$TMP/dot.py"
