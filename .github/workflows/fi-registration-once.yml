name: FI217 one-shot enrollment via canonical RU188 PostgreSQL
"on":
  push:
    branches: [main]
    paths:
      - .github/workflows/fi-registration-once.yml
      - nodekit/fi_registration_once.py
      - nodekit/fi_controller_db_bootstrap.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fi217-guarded-controller-enrollment
  cancel-in-progress: false
jobs:
  enroll:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: node-fi
    env:
      RU_PASSWORD: ${{ secrets.SERVER188_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Offline syntax and security regression tests
        run: |
          set -euo pipefail
          python3 -m py_compile nodekit/fi_registration_once.py nodekit/fi_controller_db_bootstrap.py nodekit/fi_enroll_negative_probe.py
          python3 -m unittest discover -s nodekit/tests -p 'test_fi_registration_once.py' -v
          python3 -m unittest discover -s nodekit/tests -p 'test_fi_controller_db_bootstrap.py' -v
          python3 -m unittest discover -s nodekit/tests -p 'test_fi_enroll_negative_probe.py' -v
      - name: Prepare ephemeral SSH client
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends sshpass >/dev/null
      - name: Create scoped FI DB role, exact approved inventory and protected registrar config on RU188
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$RU_PASSWORD"
          grep -q '^188\.120\.254\.223 ssh-ed25519 ' ops/mnebydns-owner-ssh-known_hosts
          export SSHPASS="$RU_PASSWORD"
          sshpass -e ssh -T -F /dev/null -o ConnectTimeout=12 \
            -o BatchMode=no -o PasswordAuthentication=yes -o PubkeyAuthentication=no \
            -o KbdInteractiveAuthentication=no -o StrictHostKeyChecking=yes \
            -o HostKeyAlgorithms=ssh-ed25519 \
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no \
            -o ForwardAgent=no -o ClearAllForwardings=yes \
            -o ControlMaster=no -o ProxyCommand=none -o LogLevel=ERROR \
            root@188.120.254.223 'python3 -' < nodekit/fi_controller_db_bootstrap.py
      - name: Verify dedicated FI forced SSH handler rejects invalid challenge (no DB writes)
        shell: bash
        run: |
          set -Eeuo pipefail
          export SSHPASS="$RU_PASSWORD"
          sshpass -e ssh -T -F /dev/null -o ConnectTimeout=12 \
            -o BatchMode=no -o PasswordAuthentication=yes -o PubkeyAuthentication=no \
            -o KbdInteractiveAuthentication=no -o StrictHostKeyChecking=yes \
            -o HostKeyAlgorithms=ssh-ed25519 \
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no \
            -o ForwardAgent=no -o ClearAllForwardings=yes \
            -o ControlMaster=no -o ProxyCommand=none -o LogLevel=ERROR \
            root@188.120.254.223 'python3 -' < nodekit/fi_enroll_negative_probe.py
      - name: Check canonical registration gate on existing RU188
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$RU_PASSWORD"
          grep -q '^188\.120\.254\.223 ssh-ed25519 ' ops/mnebydns-owner-ssh-known_hosts
          export SSHPASS="$RU_PASSWORD"
          sshpass -e ssh -T -F /dev/null -o ConnectTimeout=12 \
            -o BatchMode=no -o PasswordAuthentication=yes -o PubkeyAuthentication=no \
            -o KbdInteractiveAuthentication=no -o StrictHostKeyChecking=yes \
            -o HostKeyAlgorithms=ssh-ed25519 \
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no \
            -o ForwardAgent=no -o ClearAllForwardings=yes \
            -o ControlMaster=no -o ProxyCommand=none -o LogLevel=ERROR \
            root@188.120.254.223 'python3 -' < nodekit/fi_registration_once.py
      - name: Read-only systemd condition and FI registrar diagnosis
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$RU_PASSWORD"
          export SSHPASS="$RU_PASSWORD"
          sshpass -e ssh -T -F /dev/null -o ConnectTimeout=12 \
            -o BatchMode=no -o PasswordAuthentication=yes -o PubkeyAuthentication=no \
            -o KbdInteractiveAuthentication=no -o StrictHostKeyChecking=yes \
            -o HostKeyAlgorithms=ssh-ed25519 \
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no \
            -o ForwardAgent=no -o ClearAllForwardings=yes \
            -o ControlMaster=no -o ProxyCommand=none -o LogLevel=ERROR \
            root@188.120.254.223 'python3 -' <<'PY'
          from pathlib import Path
          import subprocess
          unit="mnebyvpn-fi-enrollment.service"
          cmd=["systemctl","show",unit,
               "--property=LoadState","--property=ActiveState",
               "--property=Result","--property=ConditionResult",
               "--property=Conditions",
               "--property=ExecMainCode","--property=ExecMainStatus"]
          proc=subprocess.run(cmd,capture_output=True,text=True,timeout=8)
          if proc.returncode:
              print("fi_systemd_status=unavailable")
          else:
              for line in proc.stdout.splitlines():
                  key,_,value=line.partition("=")
                  if key in ("LoadState","ActiveState","Result",
                             "ConditionResult","Conditions","ExecMainCode","ExecMainStatus"):
                      print("fi_systemd_"+key+"="+value[:700])
          root=Path("/root/mnebyvpn-controller")
          for name in ("config/fi-enrollment.env","approvals/fi-enrollment.enable",
                       "fi-known_hosts","fi-node-public.spki","controller-signing-key.pem"):
              print("fi_systemd_condition_"+name.replace("/","_").replace(".","_")+
                    "_exists="+str((root/name).is_file()).lower())
          actual=Path("/etc/systemd/system")/unit
          if actual.is_file():
              for line in actual.read_text().splitlines():
                  if line.startswith("ConditionPathExists="):
                      required=line.split("=",1)[1].strip()
                      if required.startswith("/root/mnebyvpn-controller/"):
                          print("fi_actual_unit_condition_"+
                                Path(required).name.replace(".","_")+
                                "_exists="+str(Path(required).is_file()).lower())
                      else:
                          print("fi_actual_unit_condition_unexpected=true")
          else:
              print("fi_actual_unit_unavailable=true")
          paths=(
              "/root/mnebyvpn-controller/approvals/fi-enrollment.enable",
              "/root/mnebyvpn-controller/config/fi-enrollment.env",
              "/root/mnebyvpn-controller/fi-known_hosts",
              "/root/mnebyvpn-controller/fi-node-public.spki",
              "/root/mnebyvpn-controller/controller-signing-key.pem",
          )
          for target in paths:
              verdict=subprocess.run(
                  ["systemd-analyze","condition","ConditionPathExists="+target],
                  capture_output=True,text=True,timeout=8)
              print("fi_systemd_analyze_"+Path(target).name.replace(".","_")+
                    "_pass="+str(verdict.returncode==0).lower())
          status=subprocess.run(
              ["systemctl","status",unit,"--no-pager","--full","-n","20"],
              capture_output=True,text=True,timeout=8)
          for line in status.stdout.splitlines()+status.stderr.splitlines():
              if ("Condition check resulted in" in line or
                  "was skipped" in line or
                  "Job for" in line or
                  "condition failed" in line):
                  print("fi_systemd_status_reason="+line.strip()[:240])
          journal=subprocess.run(
              ["journalctl","--no-pager","-q","-u",unit,"-n","30","-o","cat"],
              capture_output=True,text=True,timeout=8)
          if journal.returncode==0:
              allowed=("FI_ENROLLMENT_STOPPED","FI_ENROLLMENT=testing",
                       "Condition check resulted","was skipped","Main process exited")
              for message in journal.stdout.splitlines()[-30:]:
                  if any(marker in message for marker in allowed):
                      print("fi_systemd_event="+message[:200])
          transient=subprocess.run(
              ["journalctl","--no-pager","-q","-u",
               "mnebyvpn-fi-controller-transient.service",
               "-n","35","-o","cat"],
              capture_output=True,text=True,timeout=8)
          if transient.returncode==0:
              allowed=("FI_ENROLLMENT_STOPPED","FI_ENROLLMENT=testing",
                       "Failed with result","Main process exited",
                       "Failed to start")
              for line in transient.stdout.splitlines()[-35:]:
                  if any(token in line for token in allowed):
                      print("fi_transient_event="+line.strip()[:220])
          PY
