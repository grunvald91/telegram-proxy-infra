name: MNEBYDNS Instagram RU read-only field audit
on:
  push:
    branches: [experiment/instagram-synack-window-canary-20261110]
    paths:
      - ".github/workflows/mnebydns-instagram-ru-field-audit.yml"
      - "scripts/mnebydns_instagram_ru_readonly_preflight.py"
      - "scripts/mnebydns_instagram_ru_firewall_inventory.py"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mnebydns-instagram-ru-field-audit
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      RU_PASS: ${{ secrets.SERVER188_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read-only RU service and firewall inspection using pinned SSH host key
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$RU_PASS"
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -qq -y sshpass >/dev/null
          export SSHPASS="$RU_PASS"
          opts=(-o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519
                -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts"
                -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR)
          echo "mnebydns_field_audit=RU_READ_ONLY"
          timeout 50s sshpass -e ssh "${opts[@]}" root@188.120.254.223 "python3 -" < scripts/mnebydns_instagram_ru_readonly_preflight.py
          timeout 50s sshpass -e ssh "${opts[@]}" root@188.120.254.223 "python3 -" < scripts/mnebydns_instagram_ru_firewall_inventory.py
          echo "mnebydns_field_audit=COMPLETE_NO_MUTATIONS"
