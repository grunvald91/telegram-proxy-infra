name: MNEBYDNS inspect active CoreDNS domain regex structure (read-only)
on:
  push:
    branches: [audit/mnebydns-legacy-personal-full-route-diff-20261114]
    paths: ['.github/workflows/mnebydns-corefile-rule-shapes-readonly-20261114.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Read only domain match structure and source-target IP groups
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s ops/mnebydns-owner-ssh-known_hosts && test -n "$DE_PASS"
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass >/dev/null
          export SSHPASS="$DE_PASS"
          sshpass -e ssh -T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts" -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR root@89.125.90.101 'python3 -' <<'PY'
          from collections import Counter
          import pathlib,re
          core=pathlib.Path('/opt/mnebydns-dot/Corefile').read_text()
          print('CORE_FILE_TOTAL_LINES='+str(len(core.splitlines())))
          starts=[(i,line.strip()) for i,line in enumerate(core.splitlines()) if re.match(r'^\s*template\s+IN\s+',line)]
          print('CORE_TEMPLATE_RECORDS='+str(len(starts)))
          types=Counter(re.findall(r'^\s*template\s+IN\s+(\w+)',core,re.M))
          print('CORE_TYPES='+str(dict(types)))
          lines=core.splitlines()
          for i,line in starts[:22]:
            print('CORE_TEMPLATE_HEADER_SAMPLE='+line[:180])
            for sub in lines[i+1:i+8]:
              if re.match(r'^\s*(match|answer|rcode|fallthrough)\s+',sub):
                print('CORE_TEMPLATE_DETAIL_SAMPLE='+sub.strip()[:240])
          domains=Counter()
          for line in lines:
            if re.match(r'^\s*match\s+',line):
              text=line.strip()[6:].strip()
              domains[text]+=1
          print('CORE_UNIQUE_MATCH_PATTERN_COUNT='+str(len(domains)))
          for s,n in domains.most_common(6):
            print('CORE_POPULAR_MATCH_PATTERN='+str(n)+'|'+s[:200])
          PY
