name: Instagram RU SYN-ACK missing firewall and route read-only audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/mnebydns-meta-v31-ru-firewall-readonly-20261112.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      RU_PASS: ${{ secrets.SERVER188_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Inspect live Linux ingress rules, listener, counters and return route without mutation
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! command -v sshpass >/dev/null; then
            timeout 35s sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=7 update -qq || true
            timeout 55s sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sshpass >/dev/null
          fi
          export SSHPASS="$RU_PASS"
          opts=(-T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts"
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR)
          sshpass -e ssh "${opts[@]}" root@188.120.254.223 'python3 -' <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import datetime,json,pathlib,re,subprocess
          def cmd(*args,timeout=8):
              try:
                  p=subprocess.run(args,text=True,capture_output=True,timeout=timeout)
                  return p.returncode,p.stdout.strip()
              except Exception:return 127,''
          print('audit_utc='+datetime.datetime.now(datetime.timezone.utc).isoformat(),flush=True)
          root=pathlib.Path('/var/lib/mneby-meta-v26-ru')
          p=root/'peer'
          if p.is_file():
              peer=p.read_text().strip()
              if peer!='all':
                  code,rr=cmd('ip','-j','route','get',peer)
                  if code==0:
                      try:
                          v=json.loads(rr)[0]
                          print('return_route_dev='+str(v.get('dev')),flush=True)
                          print('return_route_src_is_ru='+str(v.get('prefsrc')=='188.120.254.223').lower(),flush=True)
                      except Exception:pass
          for key in ('net.ipv4.conf.all.rp_filter','net.ipv4.conf.default.rp_filter','net.ipv4.conf.ens3.rp_filter'):
              code,val=cmd('sysctl','-n',key)
              print(key.replace('.','_')+'='+(val if code==0 else 'ERR'),flush=True)
          code,rs=cmd('ss','-H','-lntp','sport','=',':18443')
          print('listener_18443_bound='+str(code==0 and bool(rs)).lower(),flush=True)
          print('listener_18443_pid_visible='+str('pid=' in rs).lower(),flush=True)
          code,rs=cmd('ss','-H','-nt','state','syn-recv','sport','=',':18443')
          print('synrecv_18443_count='+str(len(rs.splitlines()) if code==0 and rs else 0),flush=True)
          for svc in ('firewalld.service','ufw.service','nftables.service','telegram-nfqws.service'):
              code,_=cmd('systemctl','is-active','--quiet',svc)
              print('firewall_service_'+svc+'='+('active' if code==0 else 'inactive'),flush=True)
          code,raw=cmd('nft','-j','list','ruleset',timeout=15)
          print('nft_ruleset_read='+('PASS' if code==0 else 'FAIL'),flush=True)
          if code==0:
              j=json.loads(raw)['nftables'];chains=[];rules=[]
              for row in j:
                  if 'chain' in row:chains.append(row['chain'])
                  if 'rule' in row:rules.append(row['rule'])
              hooks=[c for c in chains if c.get('hook') in ('input','prerouting','output','postrouting')]
              for c in hooks:
                  print('hook_chain='+str((c.get('family'),c.get('table'),c.get('name'),c.get('hook'),c.get('prio'),c.get('policy'))),flush=True)
              for c in hooks:
                  if c.get('hook') not in ('input','prerouting','output','postrouting'):continue
                  for rule in [x for x in rules if x.get('family')==c.get('family') and x.get('table')==c.get('table') and x.get('chain')==c.get('name')]:
                      expr=rule.get('expr',[])
                      actions=[next(iter(x)) for x in expr if isinstance(x,dict) and (set(x)&{'drop','reject','queue','jump','goto','dnat','snat','notrack'})]
                      counts=[x['counter']['packets'] for x in expr if 'counter' in x]
                      if actions:
                          sanitized=json.dumps(expr,sort_keys=True)
                          sanitized=re.sub(r'(?<!\\d)(?:\\d{1,3}\\.){3}\\d{1,3}(?!\\d)','[IP]',sanitized)
                          if len(sanitized)>650:sanitized=sanitized[:650]+'...'
                          print('nft_rule='+str((c.get('table'),c.get('name'),rule.get('handle'),actions,counts))+' expr='+sanitized,flush=True)
          code,raw=cmd('iptables','-S','INPUT')
          if code==0:
              print('iptables_input_policy='+str(raw.splitlines()[0] if raw else 'none'),flush=True)
              print('iptables_input_rule_count='+str(len(raw.splitlines())-1),flush=True)
          # Read actual UFW acceptance rules for the experimental DNAT destination.
          code,raw=cmd('ufw','status','numbered',timeout=12)
          print('ufw_numbered_read='+('PASS' if code==0 else 'FAIL'),flush=True)
          if code==0:
              for line in raw.splitlines():
                  if '18443' in line or '443/tcp' in line or line.startswith('Status:'):
                      print('ufw_relevant='+line,flush=True)
          code,raw=cmd('iptables','-S','ufw-user-input',timeout=12)
          print('ufw_user_input_read='+('PASS' if code==0 else 'FAIL'),flush=True)
          if code==0:
              matches=[line for line in raw.splitlines() if '--dport 18443' in line or '--dport 443' in line]
              print('ufw_user_input_port_matches='+str(len(matches)),flush=True)
              for line in matches:print('ufw_port_rule='+line,flush=True)
          PY
