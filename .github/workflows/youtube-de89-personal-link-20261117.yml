name: Actual supplied personal DoT full public-path audit
on:
  push:
    branches: [diag/youtube-de89-personal-link-20261117]
    paths:
      - .github/workflows/youtube-de89-personal-link-20261117.yml
      - scripts/youtube-de89-personal-link-20261117.py
permissions: {contents: read}
concurrency:
  group: mnebydns-youtube-actual-personal-link
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Validate existing parser and prepare pinned SSH
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/youtube-de89-personal-link-20261117.py
          test -n "$DE_PASS" && test -s ops/mnebydns-owner-ssh-known_hosts
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          cat > "$RUNNER_TEMP/de-phone" <<'SHELL'
          #!/bin/bash
          set -Eeuo pipefail
          export SSHPASS="$DE_PASS"
          exec sshpass -e ssh -T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=5 -o ServerAliveCountMax=3 -o HostKeyAlgorithms=ssh-ed25519 \
            -o "UserKnownHostsFile=$GITHUB_WORKSPACE/ops/mnebydns-owner-ssh-known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR \
            root@89.125.90.101 "$@"
          SHELL
          chmod 700 "$RUNNER_TEMP/de-phone"
      - name: Verify supplied personal DoT using the actual public ingress
        run: |
          set -Eeuo pipefail
          root="/run/mnebydns-personal-link-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          "$RUNNER_TEMP/de-phone" "umask 077; mkdir '$root'; cat > '$root/probe.py'" < scripts/youtube-de89-personal-link-20261117.py
          "$RUNNER_TEMP/de-phone" "cat > '$root/input.enc.json'" < ops/youtube-personal-input-20261117.enc.json
          control="$RUNNER_TEMP/personal-link-control"
          trap 'ssh -S "$control" -O exit root@89.125.90.101 >/dev/null 2>&1 || true' EXIT
          SSHPASS="$DE_PASS" sshpass -e ssh -T -M -S "$control" -f -N -R 127.0.0.1:19531:89.125.90.101:853 \
            -o ExitOnForwardFailure=yes -o ConnectTimeout=12 -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=5 -o ServerAliveCountMax=3 -o HostKeyAlgorithms=ssh-ed25519 \
            -o "UserKnownHostsFile=$GITHUB_WORKSPACE/ops/mnebydns-owner-ssh-known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR root@89.125.90.101
          "$RUNNER_TEMP/de-phone" "MNEBY_PERSONAL_TEST_PORT=19531 timeout 110s python3 -B '$root/probe.py'"
