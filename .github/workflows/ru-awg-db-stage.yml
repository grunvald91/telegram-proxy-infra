name: RU188 AWG scoped PostgreSQL role stage (worker disabled)
"on":
  push:
    branches: [main]
    paths:
      - '.github/workflows/ru-awg-db-stage.yml'
      - 'nodekit/ru_awg_db_stage.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ru188-awg-canonical-db-role-stage
  cancel-in-progress: false
jobs:
  stage:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    environment: node-fi
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Offline contract tests before connecting to RU188
        run: |
          set -Eeuo pipefail
          python3 -m py_compile nodekit/ru_awg_db_stage.py
          python3 -m unittest discover -s nodekit/tests -p 'test_ru_awg_db_stage.py' -v
      - name: Install ephemeral SSH password transport
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends sshpass >/dev/null
      - name: Verify canonical DB and stage dedicated protected worker credential (do not enable worker)
        shell: bash
        env:
          RU_PASSWORD: ${{ secrets.SERVER188_SSH_PASSWORD }}
        run: |
          set -Eeuo pipefail
          umask 077
          [[ -n "$RU_PASSWORD" ]] || exit 2
          grep -q '^188\.120\.254\.223 ssh-ed25519 ' ops/mnebydns-owner-ssh-known_hosts
          export SSHPASS="$RU_PASSWORD"
          sshpass -e ssh -T -F /dev/null \
            -o ConnectTimeout=12 -o BatchMode=no -o PasswordAuthentication=yes \
            -o PubkeyAuthentication=no -o KbdInteractiveAuthentication=no \
            -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 \
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no \
            -o ForwardAgent=no -o ClearAllForwardings=yes \
            -o ControlMaster=no -o ProxyCommand=none -o LogLevel=ERROR \
            root@188.120.254.223 'python3 -' < nodekit/ru_awg_db_stage.py
          echo 'AWG_DB_STAGE_ACTION=finished;LIVE_VPN_CLIENT_RELEASE=unchanged'
