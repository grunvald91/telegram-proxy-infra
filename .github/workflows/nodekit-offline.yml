name: MNEBYVPN new-node bootstrap contract (offline)
on:
  pull_request:
    paths:
      - 'nodekit/**'
      - '.github/workflows/nodekit-offline.yml'
      - '.github/workflows/nodekit-prepare-new-vps.yml'
      - '.github/workflows/nodekit-fleet-bootstrap.yml'
      - '.github/workflows/fi-enrollment-trust-preflight-readonly.yml'
      - '.github/workflows/fi-public-enrollment-stage.yml'
      - '.github/workflows/fi-registration-once.yml'
      - '.github/workflows/nodekit-fi-awg-external-e2e.yml'
      - '.github/workflows/nodekit-fi-service-readiness-once.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nodekit-offline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Test bootstrap and preflight staging locally
        run: |
          set -euo pipefail
          bash -n nodekit/bootstrap.sh
          bash -n nodekit/fi_public_stage_runner.sh
          python3 -m py_compile nodekit/nodekit.py nodekit/control_plane.py nodekit/incident_gateway.py nodekit/monitor_policy.py nodekit/owned_runbook.py nodekit/diagnostics.py nodekit/fleet_plan.py nodekit/fleet_host_trust.py nodekit/approved_ssh_key.py nodekit/fi_public_enrollment_stage.py nodekit/awg_external_canary.py nodekit/awg_upgrade.py nodekit/awg_controller_readiness.py nodekit/service_readiness.py nodekit/fi_enrollment_ssh.py nodekit/awg_egress.py nodekit/awg_netns_canary.py nodekit/awg_peer_grants.py nodekit/install_awg_watchdog.py nodekit/awg_lifecycle.py nodekit/amneziawg_artifacts.py nodekit/amneziawg_stage.py nodekit/dns_proxy_stage.py nodekit/dot_local_canary.py nodekit/hostname_migrate.py nodekit/tls_stage.py nodekit/install_components.py nodekit/provision_node.py nodekit/vpn_stage.py nodekit/vpn_supervisor.py nodekit/install_supervisor.py nodekit/forward_command.py
          # Root-only fleet SSH trust store is exercised against disposable /root fixtures.
          sudo python3 -m unittest discover -s nodekit/tests -p 'test_fleet_host_trust.py' -v
          sudo python3 -m unittest discover -s nodekit/tests -p 'test_fi_public_enrollment_stage.py' -v
          python3 -m unittest discover -s nodekit/tests -v
          node --test nodekit/tests/test_awg_lease_signer.mjs nodekit/tests/test_grant_issuer.mjs nodekit/tests/test_enrollment.mjs nodekit/tests/test_controller_access.mjs nodekit/tests/test_controller_ssh.mjs
