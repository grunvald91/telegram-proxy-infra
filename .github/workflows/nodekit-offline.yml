name: MNEBYVPN new-node bootstrap contract (offline)
on:
  pull_request:
    paths:
      - 'nodekit/**'
      - '.github/workflows/nodekit-offline.yml'
      - '.github/workflows/nodekit-prepare-new-vps.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nodekit-offline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Test bootstrap and preflight staging locally
        run: |
          set -euo pipefail
          bash -n nodekit/bootstrap.sh
          python3 -m py_compile nodekit/nodekit.py nodekit/control_plane.py nodekit/incident_gateway.py nodekit/monitor_policy.py nodekit/owned_runbook.py nodekit/diagnostics.py nodekit/install_components.py nodekit/vpn_stage.py nodekit/vpn_supervisor.py nodekit/install_supervisor.py nodekit/forward_command.py
          python3 -m unittest discover -s nodekit/tests -v
          node --test nodekit/tests/test_grant_issuer.mjs nodekit/tests/test_enrollment.mjs nodekit/tests/test_controller_access.mjs nodekit/tests/test_controller_ssh.mjs
