name: Release CI-tested persistent DoT pool after isolated latency and auth gates
on:
  push:
    branches: [fix/dns-tunnel-performance-20261116]
    paths: [.github/workflows/dns-pool-release-20261116.yml]
permissions:
  contents: read
concurrency:
  group: mnebyvpn-owner-dns-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      SSHPASS: ${{ secrets.SERVER188_SSH_PASSWORD }}
      SOURCE_SHA: f5a00e555cfd13f8109589f862d62af0009c33a7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            /scripts/
            /ops/mnebydns-owner-ssh-known_hosts
          sparse-checkout-cone-mode: false
      - name: Require exact green source and validate only the intended module
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api "repos/grunvald91/Mnebyvpn/actions/workflows/offline-contracts.yml/runs?branch=main&per_page=6" > "$RUNNER_TEMP/ci.json"
          python3 - <<'PY'
          import json,os
          assert any(r['head_sha']==os.environ['SOURCE_SHA'] and r['conclusion']=='success' and r['event']=='push' for r in json.load(open(os.environ['RUNNER_TEMP']+'/ci.json'))['workflow_runs'])
          PY
          gh api "repos/grunvald91/Mnebyvpn/contents/packages/dns-policy/src/pooled-dot-upstream.ts?ref=$SOURCE_SHA" --jq .content | base64 --decode > "$RUNNER_TEMP/pool.ts"
          python3 -W error -m py_compile scripts/dns-pool-release-20261116.py
          node --check scripts/owner-dns-probe-20261116.mjs
          node --check scripts/perf-dns-bench-20261116.mjs
      - name: Compare baseline and private canary, then promote with independent rollback
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! command -v sshpass >/dev/null; then sudo apt-get update -qq; sudo apt-get install -y -qq sshpass >/dev/null; fi
          opts=(-o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts" -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR)
          remote=root@188.120.254.223
          root=/opt/mnebyvpn/dot-pool-release-20261116
          hash="$(sha256sum "$RUNNER_TEMP/pool.ts" | cut -d' ' -f1)"
          sshpass -e ssh "${opts[@]}" "$remote" "install -d -m 755 '$root'"
          sshpass -e scp "${opts[@]}" "$RUNNER_TEMP/pool.ts" "$remote:$root/pool.ts"
          sshpass -e scp "${opts[@]}" scripts/dns-pool-release-20261116.py "$remote:$root/release.py"
          sshpass -e scp "${opts[@]}" scripts/owner-dns-probe-20261116.mjs "$remote:$root/probe-source.mjs"
          sshpass -e scp "${opts[@]}" scripts/perf-dns-bench-20261116.mjs "$remote:$root/dns-bench.mjs"
          sshpass -e ssh "${opts[@]}" "$remote" "chmod 644 '$root/pool.ts'; python3 '$root/release.py' '$SOURCE_SHA' '$hash'"
      - name: Collect only aggregate performance results
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p output
          opts=(-o ConnectTimeout=10 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts" -o LogLevel=ERROR)
          for name in before canary after; do
            sshpass -e ssh "${opts[@]}" root@188.120.254.223 "cat /opt/mnebyvpn/dot-pool-release-20261116/$name.json 2>/dev/null || true" > "output/$name.json" || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dot-pool-latency-comparison
          path: output/*.json
          retention-days: 3
          if-no-files-found: warn
