name: Meta v25 check actual DE CoreDNS view config without writes
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: meta-v25-core-view-check
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Prepare pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$DE_PASS" && test -s ops/mnebydns-owner-ssh-known_hosts
          if ! command -v sshpass >/dev/null; then
            timeout 35s sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=7 update -qq || true
            timeout 55s sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sshpass >/dev/null
          fi
      - name: Validate view against running binary and live Corefile, memory only
        shell: bash
        run: |
          set -Eeuo pipefail
          export SSHPASS="$DE_PASS"
          opts=(-T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes
            -o HostKeyAlgorithms=ssh-ed25519
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts"
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR)
          echo '### Real DE CoreDNS scoped view read-only preflight' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          tar -C scripts -cf - meta_v25_source_view.py meta_v25_readonly_verify.py meta_v25_view_runtime_smoke.py \
            meta_v23_ru_firsthop_preview.py meta_v15_receive_window.py \
            mnebydns_iglite_sni_observer.py mnebydns_iglite_wifi_multi_meta_v10_w20.py \
            mnebydns-owner-domain-render-20261110.py |
          sshpass -e ssh "${opts[@]}" root@89.125.90.101 \
            'set -eu; umask 077; d=$(mktemp -d /tmp/mneby-v25-check.XXXXXXXX); trap '\''rm -rf -- "$d"'\'' EXIT; tar -xf - -C "$d"; python3 "$d/meta_v25_readonly_verify.py"; python3 "$d/meta_v25_view_runtime_smoke.py"' |
          tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
