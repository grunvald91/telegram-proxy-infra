name: Gemini two-host regression-safe rollback
on:
  push:
    branches: ['feature/mnebydns-gemini-voice-audit-20261108']
    paths: ['.github/workflows/mnebydns-gemini-voice-rollback.yml']
permissions:
  contents: read
concurrency:
  group: mnebydns-google-public-443-change
  cancel-in-progress: false
jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      FOREIGN_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
      RU_PASS: ${{ secrets.SERVER188_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: grunvald91/Mnebyvpn
          ref: b2073552b7bad3c0d8fe06c1d556d545895cf03d
          path: mnebyvpn
          persist-credentials: false
      - name: Return only two added Gemini hostnames to direct DNS
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$FOREIGN_PASS" && test -n "$RU_PASS"
          sudo apt-get update -qq
          sudo apt-get install -qq -y sshpass
          export SSHPASS="$FOREIGN_PASS"
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=accept-new -o LogLevel=ERROR root@89.125.90.101 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          base=/opt/mnebydns-voice-backups/42464486729
          for f in nginx.before nginx.pilot dns.before dns.pilot rollback.sh; do
            test -s "$base/$f"
          done
          nginx=/etc/nginx/nginx.conf
          dns=/opt/mnebydns-dot/Corefile
          if cmp -s "$base/nginx.pilot" "$nginx" && cmp -s "$base/dns.pilot" "$dns"; then
            echo "pilot_snapshots_verified=yes"
            bash "$base/rollback.sh" "$base"
          elif cmp -s "$base/nginx.before" "$nginx" && cmp -s "$base/dns.before" "$dns"; then
            echo "already_rolled_back=yes"
          else
            echo "refuse_to_overwrite_unrelated_changes=yes"
            exit 4
          fi
          for h in jnn-pa.googleapis.com waa-pa.clients6.google.com; do
            if grep -Fq "template IN A $h {" "$dns"; then exit 5; fi
            if grep -Fq "$h 127.0.0.1:15444;" "$nginx"; then exit 5; fi
          done
          grep -Fq 'template IN A gemini.google.com {' "$dns"
          grep -Fq 'gemini.google.com 127.0.0.1:15443;' "$nginx"
          systemctl stop mnebydns-voice-watchdog-42464486729.timer >/dev/null 2>&1 || true
          nginx -t >/dev/null 2>&1
          systemctl is-active --quiet nginx
          systemctl is-active --quiet mnebydns-dot.service
          echo "base_gemini_preserved_and_two_aux_routes_removed=yes"
          REMOTE
          python3 mnebyvpn/ops/smart-dns-poc/probe-gemini-canary.py \
            --ip 89.125.90.101 --port 853 --hostname dns.mnebyvpn.site
          export SSHPASS="$RU_PASS"
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=accept-new -o LogLevel=ERROR root@188.120.254.223 'bash -se' <<'RUSSIAN'
          set -Eeuo pipefail
          for h in gemini.google.com cdn.servgo.ru tg.servgo.ru; do
            status="$(curl -4 --noproxy '*' -sS -o /dev/null \
              --connect-timeout 6 --max-time 12 \
              --resolve "$h:443:89.125.90.101" \
              -w '%{http_code}' "https://$h/")"
            [[ "$status" != 000 && -n "$status" ]]
            echo "from_RU_tls_verified=$h"
          done
          RUSSIAN
          echo "regression_isolation_baseline=restored"
