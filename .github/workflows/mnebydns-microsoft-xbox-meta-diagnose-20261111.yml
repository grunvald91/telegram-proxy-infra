name: MNEBYDNS diagnose Xbox CONFIRMING vs Meta DNS collision READ ONLY
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths: ['.github/workflows/mnebydns-microsoft-xbox-meta-diagnose-20261111.yml']
  push:
    branches: [main]
    paths: ['.github/workflows/mnebydns-microsoft-xbox-meta-diagnose-20261111.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      RU_PASS: ${{ secrets.SERVER188_SSH_PASSWORD }}
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect checkpoint hash equality, Xbox confirmation marker and Instagram DNS without writes
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$RU_PASS" && test -n "$DE_PASS"
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sshpass >/dev/null
          opts=(-T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes
            -o HostKeyAlgorithms=ssh-ed25519
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts"
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR)
          export SSHPASS="$DE_PASS"
          sshpass -e ssh "${opts[@]}" root@89.125.90.101 'bash -se' <<'SH'
          set -Eeuo pipefail
          checkpoint="$(cat /opt/mnebydns-stable-checkpoints/current)"
          echo "diagnose_checkpoint=$checkpoint"
          if (cd "$checkpoint" && sha256sum -c stable-manifest.sha256 >/dev/null); then
            echo "diagnose_checkpoint_integrity=PASS"
          else
            echo "diagnose_checkpoint_integrity=FAIL"
          fi
          for pair in "dns:/opt/mnebydns-dot/Corefile" \
                      "nginx:/etc/nginx/nginx.conf" \
                      "proxy:/etc/mnebydns-googlepilot/nginx.conf"; do
            kind="$(echo "$pair" | cut -d: -f1)"
            file="$(echo "$pair" | cut -d: -f2)"
            if cmp -s "$checkpoint/$kind.stable" "$file"; then
              echo "diagnose_stable_match_$kind=true"
            else
              echo "diagnose_stable_match_$kind=false"
            fi
          done
          echo diagnose_owner_xbox_markers_begin
          for base in /opt/mnebydns-owner-domain/*; do
            test -d "$base" || continue
            if test -s "$base/domain" && test "$(cat "$base/domain")" = xbox.com; then
              echo "xbox_owner_base=$(basename "$base")"
              if test -f "$base/confirmed"; then echo xbox_confirmed_sentinel=true
              else echo xbox_confirmed_sentinel=false; fi
              if cmp -s "$base/dns.pilot" "$checkpoint/dns.stable" && \
                 cmp -s "$base/nginx.pilot" "$checkpoint/nginx.stable"; then
                echo xbox_pilot_equals_checkpoint=true
              else echo xbox_pilot_equals_checkpoint=false; fi
            fi
          done
          echo diagnose_owner_xbox_markers_end
          echo diagnose_instagram_core_lines_begin
          grep -nE 'instagram[.]com|Meta.*canary|MNEBYDNS_OWNER_EXACT_xbox_com' \
            /opt/mnebydns-dot/Corefile | head -n 35 || true
          echo diagnose_instagram_core_lines_end
          echo diagnose_active_rollbacks_begin
          systemctl list-timers --all --no-pager --no-legend | grep -E 'mnebydns-owner-rollback|meta' | head -n 16 || true
          echo diagnose_active_rollbacks_end
          SH
          echo diagnose_actual_dot_begin
          python3 - <<'PY'
          import importlib.util
          spec=importlib.util.spec_from_file_location('owner', 'scripts/mnebydns-owner-domain-controller-20261110.py')
          mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(mod)
          for host in ('i.instagram.com','graph.instagram.com','api.telegram.org',
                       'xbox.com','gemini.google.com','claude.ai'):
            try:
              r,ip=mod.dns_q(host)
              print('dot_'+host+'=rcode:'+str(r)+' ips:'+','.join(ip),flush=True)
            except Exception as e:
              print('dot_'+host+'_error='+type(e).__name__,flush=True)
          PY
          echo diagnose_actual_dot_end
          export SSHPASS="$RU_PASS"
          sshpass -e ssh "${opts[@]}" root@188.120.254.223 \
            'docker exec -i mnebyvpn-stage-postgres psql -XqAt -v ON_ERROR_STOP=1 -U mnebyvpn_stage -d mnebyvpn_stage' <<'SQL'
          SELECT domain || '|' || status || '|' || coalesce(last_error_code,'none')
          FROM dns_admin_domains WHERE domain IN
          ('xbox.com','bing.com','microsoft.com','copilot.microsoft.com',
           'software-static.download.prss.microsoft.com','xboxdesignlab.xbox.com')
          ORDER BY domain;
          SQL
          echo diagnose_readonly_complete=true
      - name: Verify pinned SSH host keys offline
        if: github.event_name == 'pull_request'
        shell: bash
        run: test "$(grep -c ' ssh-ed25519 ' ops/mnebydns-owner-ssh-known_hosts)" -eq 2
