name: MNEBYDNS Meta DE-to-RU public 443 independent read-only check
on:
  push:
    branches: [diagnostics/mnebydns-meta-ingress-matrix-20261109]
    paths: [.github/workflows/mnebydns-meta-de-to-ru-readonly-20261109.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - name: Compare RU public versus loopback TLS from foreign server
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$DE_PASS"
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          export SSHPASS="$DE_PASS"
          sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -o LogLevel=ERROR root@89.125.90.101 'python3 -' <<'PY'
          import socket,ssl,datetime,pathlib,subprocess
          print('utc_time='+datetime.datetime.now(datetime.timezone.utc).isoformat(),flush=True)
          for host in ('iglite-z.instagram.com','i.instagram.com','threads.com'):
              try:
                  with socket.create_connection(('188.120.254.223',443),timeout=4) as s:
                      s.settimeout(5)
                      with ssl.create_default_context().wrap_socket(s,server_hostname=host) as tls:
                          result='VALID_TLS_'+str(tls.version())
              except Exception as e: result=type(e).__name__
              print('DE_to_RU_public443_'+host+'='+result,flush=True)
          for ip,port,label in [('188.120.254.223',80,'RU80'),('188.120.254.223',443,'RU443')]:
              try:
                  with socket.create_connection((ip,port),timeout=3):result='CONNECTED'
              except Exception as e:result=type(e).__name__
              print('DE_to_'+label+'='+result,flush=True)
          print('DE_to_RU_read_only=true',flush=True)
          PY
