# Independent foreign VPS merchant ingress probe after canonical billing role deployment.
name: MNEBYVPN external HTTPS probe from independent relay89
on:
  push:
    paths: ['.github/workflows/mnebyvpn-relay89-public-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      RELAY_HOST: '89.125.90.101'
      RELAY_PASSWORD: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - name: Test TCP and HTTPS from existing foreign node, read-only
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RELAY_PASSWORD"
          sudo apt-get update -qq && sudo apt-get install -qq -y sshpass
          export SSHPASS="$RELAY_PASSWORD"
          sshpass -e ssh -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new -o LogLevel=ERROR "root@$RELAY_HOST" 'python3 -' <<'PY'
          import socket,ssl,urllib.request
          host='188.120.254.223'
          for port in [80,443,8443]:
            try:
              with socket.create_connection((host,port),timeout=5):
                print('relay89_tcp_'+str(port)+'=connected')
            except Exception as e:
              print('relay89_tcp_'+str(port)+'='+type(e).__name__)
          try:
            with urllib.request.urlopen('https://mnebyvpn.site/',timeout=7) as response:
              data=response.read(30000).decode('utf8','replace')
              print('relay89_https_status='+str(response.status))
              print('relay89_bot_link='+str('https://t.me/MnebyVPN_bot' in data).lower())
          except Exception as e:print('relay89_https_error='+type(e).__name__)
          PY
