name: Diagnose MNEBYVPN email DB privileges (read-only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/mnebyvpn-email-db-diagnostic.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SSH_PASSWORD: ${{ secrets.SERVER188_SSH_PASSWORD }}
    steps:
      - name: Inspect application PostgreSQL schema and grants without secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_PASSWORD"
          sudo apt-get update -qq
          sudo apt-get install -qq -y sshpass
          export SSHPASS="$SSH_PASSWORD"
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=accept-new -o LogLevel=ERROR root@188.120.254.223 'docker exec -i mnebyvpn-public-web node -' <<'JS'
          const {Pool}=require('pg');
          const pool=new Pool({connectionString:process.env.DATABASE_URL,max:1,connectionTimeoutMillis:5000});
          (async()=>{
            const q=await pool.query("SELECT current_user AS role, current_database() AS db, current_schema() AS schema");
            console.log("db_user_role="+q.rows[0].role);
            console.log("db_schema="+q.rows[0].schema);
            for(const name of ['web_email_codes','web_email_rate_limits','accounts','website_sessions','website_support_tickets']){
              const table='public.'+name;
              const x=await pool.query("SELECT to_regclass($1) IS NOT NULL AS present, has_table_privilege(current_user,$1,'INSERT') AS can_insert, has_table_privilege(current_user,$1,'UPDATE') AS can_update, has_table_privilege(current_user,$1,'SELECT') AS can_select",[table]);
              const row=x.rows[0];
              console.log(name+"_exists="+row.present+" insert="+row.can_insert+" update="+row.can_update+" select="+row.can_select);
            }
            await pool.query('BEGIN');
            await pool.query("SELECT pg_advisory_xact_lock(hashtextextended('email-diag',0))");
            await pool.query('ROLLBACK');
            console.log('pg_email_advisory_lock=true');
          })().catch(e=>{console.log('db_probe_error_code='+String(e.code||e.name));process.exitCode=2}).finally(()=>pool.end());
          JS
