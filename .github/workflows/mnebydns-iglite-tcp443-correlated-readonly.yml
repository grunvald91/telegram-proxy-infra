name: MNEBYDNS Instagram Lite NFQUEUE210 kernel health (read only)
on:
  push:
    branches: [audit/mnebydns-instagram-lite-20261111]
    paths:
      - '.github/workflows/mnebydns-iglite-tcp443-correlated-readonly.yml'
permissions:
  contents: read
concurrency:
  group: mnebydns-iglite-tcp443-correlated-readonly
  cancel-in-progress: false
jobs:
  tcp443-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Isolated parser tests and syntax
        run: |
          set -Eeuo pipefail
          test -n "$DE_PASS"
          python3 -m py_compile scripts/mnebydns_iglite_q210_readonly_health.py
          python3 scripts/mnebydns_iglite_q210_readonly_health.py self-test
      - name: Prepare host-key-pinned SSH
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sshpass >/dev/null
      - name: Observe DE ingress and run concurrent Runner TCP probes
        shell: bash
        run: |
          set -Eeuo pipefail
          export SSHPASS="$DE_PASS"
          opts=(-T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes
            -o HostKeyAlgorithms=ssh-ed25519
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts"
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR)
          logfile="$RUNNER_TEMP/iglite-correlated-readonly.log"
          timeout 38s sshpass -e ssh "${opts[@]}" root@89.125.90.101 \
            'python3 -u -' < scripts/mnebydns_iglite_q210_readonly_health.py \
            > "$logfile" 2>&1 &
          observer=$!
          trap 'kill "$observer" 2>/dev/null || true; wait "$observer" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 120); do
            if grep -Fqx 'q210_readonly_observer=READY' "$logfile" 2>/dev/null;then ready=1;break;fi
            kill -0 "$observer" 2>/dev/null || break
            sleep 0.1
          done
          if [[ "$ready" != 1 ]];then cat "$logfile";exit 1;fi
          python3 - <<'PY'
          import socket,time
          ip='89.125.90.101'
          for port in (443,443,443,853):
              start=time.monotonic()
              try:
                  with socket.create_connection((ip,port),timeout=3):
                      verdict='CONNECTED'
              except Exception as e:
                  verdict=type(e).__name__
              print(f'readonly_runner_tcp_{port}={verdict} elapsed_s={time.monotonic()-start:.3f}',flush=True)
              time.sleep(.3)
          PY
          set +e
          wait "$observer"
          rc=$?
          set -e
          trap - EXIT
          cat "$logfile"
          test "$rc" -eq 0
          grep -Fqx 'q210_packet_payload_logged=false' "$logfile"
          grep -Fqx 'q210_server_changes=NONE' "$logfile"
          grep -q '^q210_runtime_dropped_delta=' "$logfile"
          grep -q '^q210_runtime_user_dropped_delta=' "$logfile"
          grep -q '^q210_tcp_peer_syn=' "$logfile"
          grep -q '^q210_tcp_peer_synack=' "$logfile"
          echo 'readonly_no_server_mutation=true'
