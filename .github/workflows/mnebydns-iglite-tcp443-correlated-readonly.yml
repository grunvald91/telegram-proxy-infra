name: MNEBYDNS Instagram Lite TCP443 peerwise conntrack check (read only)
on:
  push:
    branches: [audit/mnebydns-instagram-lite-20261111]
    paths:
      - '.github/workflows/mnebydns-iglite-tcp443-correlated-readonly.yml'
permissions:
  contents: read
concurrency:
  group: mnebydns-iglite-tcp443-correlated-readonly
  cancel-in-progress: false
jobs:
  nfq210-live-config:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Offline syntax and parser tests
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$DE_PASS"
          python3 -m py_compile scripts/mnebydns_iglite_peerwise_readonly.py
          python3 scripts/mnebydns_iglite_peerwise_readonly.py self-test
      - name: Prepare pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sshpass >/dev/null
      - name: Correlate peer TCP443/853 packet headers and conntrack without changes
        shell: bash
        run: |
          set -Eeuo pipefail
          export SSHPASS="$DE_PASS"
          opts=(-T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes
            -o HostKeyAlgorithms=ssh-ed25519
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts"
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR)
          logfile="$RUNNER_TEMP/mnebydns-nfq-live-readonly.log"
          timeout 55s sshpass -e ssh "${opts[@]}" root@89.125.90.101 \
            'python3 -u -' < scripts/mnebydns_iglite_peerwise_readonly.py \
            > "$logfile" 2>&1 &
          observer=$!
          trap 'kill "$observer" 2>/dev/null || true; wait "$observer" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 140); do
            if grep -Fqx 'peerwise_observer=READY' "$logfile" 2>/dev/null; then
              ready=1
              break
            fi
            kill -0 "$observer" 2>/dev/null || break
            sleep 0.1
          done
          if [[ "$ready" != 1 ]]; then
            cat "$logfile"
            echo 'peerwise_external_probe=OBSERVER_NOT_READY'
            exit 1
          fi
          python3 - <<'PY'
          import socket,time
          for port in (443,443,443,853):
              start=time.monotonic()
              try:
                  with socket.create_connection(('89.125.90.101',port),timeout=3):
                      result='CONNECTED'
              except Exception as exc:
                  result=type(exc).__name__
              print(f'peerwise_runner_{port}={result} elapsed_s={time.monotonic()-start:.3f}',flush=True)
              time.sleep(.3)
          PY
          set +e
          wait "$observer"
          rc=$?
          set -e
          trap - EXIT
          cat "$logfile"
          if [[ "$rc" != 0 ]]; then
            echo "peerwise_remote_exit=$rc"
            exit "$rc"
          fi
          grep -Eq '^peerwise_443_in_SYN=[1-9][0-9]*
          grep -Fqx 'peerwise_server_changes=NONE' "$logfile"
          grep -Fqx 'peerwise_raw_addresses_or_payload_logged=false' "$logfile"
          grep -q '^peerwise_443_in_SYN=' "$logfile"
          grep -q '^peerwise_443_out_SYNACK=' "$logfile"
          grep -q '^peerwise_conntrack_samples=' "$logfile"
          echo 'peerwise_readonly_completed=true'
 "$logfile"
          echo 'peerwise_external_probe=RUN_WITH_OBSERVER'
          grep -Fqx 'peerwise_server_changes=NONE' "$logfile"
          grep -Fqx 'peerwise_raw_addresses_or_payload_logged=false' "$logfile"
          grep -q '^peerwise_443_in_SYN=' "$logfile"
          grep -q '^peerwise_443_out_SYNACK=' "$logfile"
          grep -q '^peerwise_conntrack_samples=' "$logfile"
          echo 'peerwise_readonly_completed=true'
