name: MNEBYVPN auth runtime preflight (read-only)
# Diagnostic second pass: preserve early browser state even if header navigation is unavailable.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/mnebyvpn-auth-runtime-preflight.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SERVER188_SSH_PASSWORD: ${{ secrets.SERVER188_SSH_PASSWORD }}
      SERVGO_SSH_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read-only real mobile browser reproduction for VPN and login
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/mnebyvpn-browser-probe" --no-save --no-audit --no-fund playwright@1.56.1 >/dev/null
          export VISUAL_PLAYWRIGHT_PACKAGE="$RUNNER_TEMP/mnebyvpn-browser-probe/node_modules/playwright/index.mjs"
          if command -v google-chrome >/dev/null 2>&1; then
            export VISUAL_CHROME_PATH="$(command -v google-chrome)"
          elif command -v chromium >/dev/null 2>&1; then
            export VISUAL_CHROME_PATH="$(command -v chromium)"
          else
            "$RUNNER_TEMP/mnebyvpn-browser-probe/node_modules/.bin/playwright" install chromium >/dev/null
          fi
          node scripts/mnebyvpn-live-web-readonly.mjs
      - name: Public HTTPS route checks from external GitHub runner (read-only)
        shell: bash
        run: |
          set -euo pipefail
          for suffix in / /api/plans /api/auth/options /app.js /journey.js /landing-art.html /healthz; do
            name="${suffix//\//_}"
            for ipmode in -4 -6; do
              result="$(curl "$ipmode" -sS --connect-timeout 4 --max-time 10 --retry 0 -o /dev/null -w '%{http_code}|%{time_total}|%{remote_ip}' "https://mnebyvpn.site$suffix" 2>/dev/null || true)"
              code="${result%%|*}"
              echo "runner_${name:-home}_${ipmode#-}_http=$code"
            done
          done
      - name: Public edge, IPv6, database-upstream and proxy error counters (read-only)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -qq -y sshpass
          test -n "$SERVER188_SSH_PASSWORD"
          SSHPASS="$SERVER188_SSH_PASSWORD" sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=accept-new -o LogLevel=ERROR root@188.120.254.223 'python3 -' < scripts/mnebyvpn-web-route-audit.py
      - name: Check available isolated SSH credentials without revealing them
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$SERVER188_SSH_PASSWORD" ]]; then echo 'server188_ssh_available=true'; else echo 'server188_ssh_available=false'; exit 2; fi
          if [[ -n "$SERVGO_SSH_PASSWORD" ]]; then echo 'servgo_ssh_in_infra_repo=true'; else echo 'servgo_ssh_in_infra_repo=false'; fi
      - name: Inspect MNEBYVPN owned application files and service health (read-only)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          SSHPASS="$SERVER188_SSH_PASSWORD" sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=accept-new -o LogLevel=ERROR root@188.120.254.223 'python3 -' <<'PY'
          import pathlib, subprocess, re
          root=pathlib.Path('/opt/mnebyvpn')
          for name,file in [('web',root/'public/web.env'),('bot',root/'bot/web.env'),('worker',root/'bot/worker.env'),('stage',root/'staging/web.env')]:
              data={}
              if file.is_file():
                  for line in file.read_text().splitlines():
                      if '=' in line:
                          k,v=line.split('=',1)
                          data[k]=v
              for key in ['WEB_EMAIL_LOGIN_ENABLED','MNEBYVPN_MAIL_GATEWAY_SECRET','WEB_TELEGRAM_OIDC_ENABLED','TELEGRAM_OIDC_CLIENT_ID','TELEGRAM_OIDC_CLIENT_SECRET','WEB_TRIAL_ENABLED','WEB_PRODAMUS_WEBHOOK_ENABLED','WEB_NETWORK_PROVISIONING_VERIFIED','WEB_RELEASE_APPROVED','VPN_SUBSCRIPTION_DATABASE_URL','DATABASE_URL']:
                  v=data.get(key,'')
                  print(name+'_'+key+'_present='+str(bool(v)).lower())
                  if key.startswith('WEB_') and key not in ('WEB_RELEASE_APPROVED',):
                      if v in ('yes','no','0','1'):print(name+'_'+key+'_mode='+v)
          for name,cmd in [
              ('site_active_sha',('cat','/opt/mnebyvpn/public/active_sha')),
              ('stage_active_sha',('cat','/opt/mnebyvpn/staging/active_sha'))
          ]:
              x=subprocess.run(cmd,capture_output=True,text=True,timeout=4)
              code=x.stdout.strip()
              print(name+'='+code if re.fullmatch('[a-f0-9]{40}',code) else name+'=unverified')
          for name,url in [('web','http://127.0.0.1:8792/healthz'),('bot','http://127.0.0.1:8793/readyz'),('mail_route','https://servgo.ru/api/auth/mnebyvpn/email-code')]:
              method='POST' if name=='mail_route' else 'GET'
              cp=subprocess.run(['curl','-s','-o','/dev/null','-w','%{http_code}','-X',method,'--max-time','7',url],capture_output=True,text=True,timeout=10)
              print(name+'_http='+cp.stdout.strip()[:3])
          import json
          try:
              plans=subprocess.run(['curl','-fsS','--max-time','5','http://127.0.0.1:8792/api/plans'],
                text=True,capture_output=True,timeout=7)
              obj=json.loads(plans.stdout) if plans.returncode==0 else {}
              print('site_email_enabled='+str(obj.get('emailLoginEnabled') is True).lower())
              print('site_telegram_enabled='+str(obj.get('telegramLoginEnabled') is True).lower())
              print('site_checkout_enabled='+str(obj.get('checkoutEnabled') is True).lower())
              print('site_login_enabled='+str(obj.get('loginEnabled') is True).lower())
              p=obj.get('plans')
              print('site_plans_array='+str(isinstance(p,list)).lower())
              if isinstance(p,list):
                  print('site_plans_count='+str(len(p)))
                  for product in ('vpn','smart_dns','bundle'):
                      durations=sorted([x.get('durationDays') for x in p if x.get('product')==product and isinstance(x.get('durationDays'),(int,float))])
                      print('site_catalog_'+product+'_days='+','.join(str(v) for v in durations))
                  print('site_catalog_ids='+','.join(str(x.get('id')) for x in p if x.get('product')=='vpn')[:350])
              print('site_trial_offer_count='+str(len(obj.get('trialOffers',[]))))
          except Exception as err:
              print('site_catalog_probe_error='+type(err).__name__)
          try:
              for tag,path in (('cabinet','/\u0023account'),('js','/app.js'),('journey','/journey.js'),('html','/')):
                  cp=subprocess.run(['curl','-fsS','--max-time','7','-o','/dev/null','-w','%{http_code}','http://127.0.0.1:8792'+path],
                    capture_output=True,text=True,timeout=9)
                  print('site_'+tag+'_asset_http='+cp.stdout.strip()[:3])
              ext=subprocess.run(['curl','-sS','--max-time','8','-o','/dev/null','-w','%{http_code}','https://mnebyvpn.site/api/plans'],capture_output=True,text=True,timeout=10)
              print('external_plans_http='+ext.stdout.strip()[:3])
          except Exception as err:
              print('site_http_probe_error='+type(err).__name__)
          try:
              cp=subprocess.run(['docker','exec','mnebyvpn-stage-postgres','psql','-XAt','-U','mnebyvpn_stage','-d','mnebyvpn_stage','-c',
                "SELECT product||':'||COALESCE(enabled::text,'null')||':'||count(*) FROM billing_plans GROUP BY product,enabled ORDER BY 1"],
                capture_output=True,text=True,timeout=9)
              print('catalog_sql_query_ok='+str(cp.returncode==0).lower())
              if cp.returncode==0:
                  for line in cp.stdout.splitlines()[:15]:print('canonical_catalog_'+line)
          except Exception as err:
              print('catalog_db_probe_error='+type(err).__name__)
          except Exception: print('site_auth_status=unverified')
          try:
              html=subprocess.run(['curl','-fsS','--max-time','5','http://127.0.0.1:8792/'],
                text=True,capture_output=True,timeout=7).stdout
              print('email_form_present='+str('id="email-start-form"' in html).lower())
              print('support_form_present='+str('id="support-form"' in html).lower())
          except Exception: print('site_html_status=unverified')
          print('production_changed=false')
          PY
