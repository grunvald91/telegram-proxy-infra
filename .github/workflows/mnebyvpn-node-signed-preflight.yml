# Verify actual VPN traffic and signed node readiness before allowing online payments, 2026-11-07.
name: MNEBYVPN signed VPN node preflight from existing 188
on:
  push:
    paths: ['.github/workflows/mnebyvpn-node-signed-preflight.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      HOST: '188.120.254.223'
      SSH_PASSWORD: ${{ secrets.SERVER188_SSH_PASSWORD }}
    steps:
      - name: Check real private WireGuard HMAC node and trial backlog read-only
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_PASSWORD"
          sudo apt-get update -qq && sudo apt-get install -qq -y sshpass
          export SSHPASS="$SSH_PASSWORD"
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=accept-new \
            -o LogLevel=ERROR "root@$HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,uuid,time,hmac,hashlib,json,urllib.request,email.utils
          key_path=pathlib.Path('/opt/mnebyvpn/bot/provisioner.key')
          key=bytes.fromhex(key_path.read_text().strip())
          assert len(key)==32
          body=json.dumps({'op':'inspect','id':str(uuid.uuid4()),'ts':int(time.time())},
            separators=(',',':')).encode()
          sig=hmac.new(key,body,hashlib.sha256).hexdigest()
          req=urllib.request.Request('http://10.66.77.1:18944/v1/provision',body,
            {'Content-Type':'application/json','X-Mnebyvpn-Signature':sig},method='POST')
          with urllib.request.urlopen(req,timeout=9) as response:
            assert response.status==200
            date_header=response.headers.get('Date')
            result=json.load(response)
          assert result['enabled'] is False and result['revision']==0
          assert date_header
          server_ts=email.utils.parsedate_to_datetime(date_header).timestamp()
          delta=round(server_ts-time.time(),1)
          print('foreign_node_clock_delta_seconds='+str(delta))
          print('existing_wireguard_node_hmac_authenticated_inspect=ok')
          print('node_secret_never_logged=true')
          PY
          for sql in \
            "SELECT 'active_vpn_entitlements='||count(*) FROM entitlements WHERE product='vpn' AND state='ACTIVE';" \
            "SELECT 'pending_vpn_entitlements='||count(*) FROM entitlements WHERE product='vpn' AND state='PAID_PENDING_PROVISIONING';" \
            "SELECT 'trial_offer_enabled='||enabled FROM trial_offers WHERE product='vpn';"; do
            docker exec mnebyvpn-stage-postgres psql -At -v ON_ERROR_STOP=1 \
              -U mnebyvpn_stage -d mnebyvpn_stage -c "$sql"
          done
          REMOTE
