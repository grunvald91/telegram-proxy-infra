name: FI Nodekit control-plane readiness audit one-shot
on:
  push:
    branches: [feat/nodekit-controller-readiness-20261118]
    paths: [.github/workflows/nodekit-fi-controller-audit-once.yml]
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    if: github.repository == 'grunvald91/telegram-proxy-infra'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Audit independently pinned controller SPKI and Nodekit services
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh api --method POST \
            repos/grunvald91/telegram-proxy-infra/actions/workflows/nodekit-fleet-bootstrap.yml/dispatches \
            -f ref=main \
            -f "inputs[country]=fi" \
            -f "inputs[phase]=controller-audit"
