name: Meta v30 manually gated RU/DE phone canary
on:
  push:
    branches: [main]
    paths: ['.github/workflows/meta-v30-manual-two-server-canary.yml']
  workflow_dispatch:
    inputs:
      mode:
        description: 'preflight (read only) or activate (changes DoT, Nginx, RU nft)'
        type: choice
        options: [preflight, activate]
        required: true
        default: activate
      phone_ip:
        description: 'Check current public IPv4 at 2ip.ru on test phone; replace previously observed address if different'
        type: string
        required: true
        default: '185.137.178.123'
      approval:
        description: 'Manual 30-minute SNI trial approval; start only with current verified phone IP'
        type: string
        required: true
        default: 'CONFIRM_CURRENT_PHONE_IP_AND_SNI_TEST'
      duration_minutes:
        description: 'Test window in minutes'
        type: choice
        options: ['15', '30']
        required: true
        default: '30'
permissions:
  contents: read
concurrency:
  group: mneby-meta-v30-single-phone-owner-experiment
  cancel-in-progress: false
jobs:
  operator:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch') &&
      (github.event_name == 'push' ||
      (inputs.mode == 'preflight' ||
       (inputs.mode == 'activate' &&
        inputs.phone_ip != '' &&
        inputs.approval == 'CONFIRM_CURRENT_PHONE_IP_AND_SNI_TEST')))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELAY89_SSH_PASSWORD: ${{ secrets.RELAY89_SSH_PASSWORD }}
      SERVER188_SSH_PASSWORD: ${{ secrets.SERVER188_SSH_PASSWORD }}
      MNEBY_META_V30_APPROVED: ${{ inputs.approval }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 7dbb5836e079be9a02fad9d90fab6438ff715bb9
      - name: Validate code and manual controls
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = '7dbb5836e079be9a02fad9d90fab6438ff715bb9'
          python3 -m py_compile scripts/meta_v30_actions_adapter.py scripts/meta_v29_two_server_sequence.py
          python3 scripts/meta_v30_actions_adapter.py --mode validate
          python3 -m unittest discover -s scripts/tests -p 'test_meta_v26_staging_guards.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_meta_v30_actions_adapter.py' -v
          test -n "$RELAY89_SSH_PASSWORD" && test -n "$SERVER188_SSH_PASSWORD"
          if ! command -v sshpass >/dev/null; then
            timeout 35s sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=7 update -qq || true
            timeout 55s sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sshpass >/dev/null
          fi
      - name: Pinned two-host operation, bounded time
        shell: bash
        env:
          SELECTED_MODE: ${{ github.event_name == 'push' && 'preflight' || inputs.mode }}
          SELECTED_IP: ${{ inputs.phone_ip }}
          SELECTED_MINUTES: ${{ inputs.duration_minutes }}
        run: |
          set -Eeuo pipefail
          if [[ "$SELECTED_MODE" == "preflight" ]]; then
            python3 -u scripts/meta_v30_actions_adapter.py --mode preflight | tee -a "$GITHUB_STEP_SUMMARY"
          else
            python3 -u scripts/meta_v30_actions_adapter.py --mode activate \
              --phone-ip "$SELECTED_IP" --minutes "$SELECTED_MINUTES" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo 'Only finalized on-wire packet evidence can prove ClientHello SNI segmentation; Android login/feed is a separate phone check.' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve SNI packet evidence including failed trials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meta-pr87-phone-sni-evidence
          path: ${{ runner.temp }}/meta-v31-evidence/phone-sni.json
          if-no-files-found: ignore
          retention-days: 7
