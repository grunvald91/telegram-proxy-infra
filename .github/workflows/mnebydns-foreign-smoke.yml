name: MNEBYDNS foreign VPS isolated DoT smoke
on:
  push:
    branches: ['feature/mnebydns-foreign-loopback-smoke-20261108']
    paths:
      - '.github/workflows/mnebydns-foreign-smoke.yml'
permissions:
  contents: read
jobs:
  test-foreign:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SSHPASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - name: Fetch pinned, green MNEBYDNS PoC
        uses: actions/checkout@v4
        with:
          repository: grunvald91/Mnebyvpn
          ref: 744947e11ebb233ecb163196e505120dab25b122
          persist-credentials: false
      - name: Run guarded 120-second loopback-only remote test
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSHPASS" || { echo "foreign SSH credential missing"; exit 2; }
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]] || exit 2
          sudo apt-get update -qq
          sudo apt-get install -qq -y sshpass
          host=root@89.125.90.101
          dir="/tmp/mnebydns-ci-$GITHUB_RUN_ID"
          opts=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=12 -o LogLevel=ERROR)
          echo "phase=foreign_preflight_and_isolated_test"
          sshpass -e ssh "${opts[@]}" "$host" "mkdir -m 700 -- '$dir'"
          tar -C ops/smart-dns-poc -czf - Corefile.foreign compose.foreign.yaml make-local-cert.sh probe-dot.py run-foreign-smoke.sh |
            sshpass -e ssh "${opts[@]}" "$host" "tar -xzf - -C '$dir'"
          sshpass -e ssh "${opts[@]}" "$host" \
            "cd '$dir' && MNEBYDNS_PROJECT='mnebydns-ci-$GITHUB_RUN_ID' timeout --signal=TERM --kill-after=15s 120 bash run-foreign-smoke.sh"
          echo "foreign_runtime_smoke=completed"
