name: Server188 read-only capacity audit
"on":
  push:
    branches:
      - diag/relay89-20261105
    paths:
      - .github/workflows/server188-readonly-20261105.yml

permissions:
  contents: read

concurrency:
  group: server188-readonly-capacity
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      TARGET_HOST: "188.120.254.223"
      SSHPASS: ${{ secrets.SERVER188_SSH_PASSWORD }}
    steps:
      - name: Verify configured SSH credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSHPASS" || { echo "::error::SERVER188_SSH_PASSWORD is not configured"; exit 1; }

      - name: Install SSH helper on runner only
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Read-only server inventory and resource check
        shell: bash
        run: |
          set -euo pipefail
          sshpass -e ssh -p 22 -o BatchMode=no -o NumberOfPasswordPrompts=1 -o ConnectTimeout=12 -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$RUNNER_TEMP/server188_known_hosts" -o LogLevel=ERROR "root@$TARGET_HOST" 'bash -s' <<'REMOTE'
          set -u
          echo '=== UTC_AND_SYSTEM ==='
          date -u '+%Y-%m-%dT%H:%M:%SZ'
          hostname
          ( . /etc/os-release; echo "$PRETTY_NAME" ) 2>/dev/null || true
          uname -r
          echo '=== CPU ==='
          nproc
          uptime
          echo '=== RAM_AND_SWAP ==='
          free -h
          swapon --show=NAME,SIZE,USED --noheadings || true
          echo '=== DISK ==='
          df -hT /
          df -i /
          echo '=== HEAVIEST_PROCESSES ==='
          ps -eo comm,rss,%cpu --sort=-rss | head -18
          echo '=== SERVICE_STATES ==='
          for svc in xray nginx telemt telemt-yandex telemt-gosuslugi mtproxy caddy tinyproxy redsocks docker; do
            printf '%s=' "$svc"
            systemctl is-active "$svc" 2>/dev/null || true
          done
          echo '=== CONTAINERS ==='
          if command -v docker >/dev/null 2>&1; then docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}'; else echo 'docker_unavailable'; fi
          echo '=== LISTEN_PORTS ==='
          ss -lntu 2>/dev/null | head -70 || true
          echo '=== WIREGUARD_INTERFACES ==='
          if command -v wg >/dev/null 2>&1; then wg show interfaces; fi
          echo '=== LARGE_DIRECTORIES ==='
          du -sh /var/log /var/lib/docker /var/cache/apt /root/proxy-backups 2>/dev/null || true
          echo 'read_only=yes'
          REMOTE
