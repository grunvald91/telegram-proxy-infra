name: Meta v23 Russian first-hop exact DNS and WG path offline tests
on:
  # These contracts already run automatically in meta-v26-two-server-offline.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: meta-v23-ru-firsthop-offline
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Compile and check Russian-only peer ingress and strict TLS pass-through
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/meta_v23_ru_firsthop_preview.py scripts/meta_v15_receive_window.py scripts/mnebydns-owner-domain-render-20261110.py
          python3 -m unittest discover -s scripts/tests -p 'test_meta_v23_ru_firsthop_preview.py' -v
          python3 -m py_compile scripts/meta_v25_source_view.py
          python3 -m unittest discover -s scripts/tests -p 'test_meta_v25_source_view.py' -v
          python3 scripts/mnebydns-owner-domain-render-20261110.py self-test
          python3 -m unittest discover -s scripts/tests -p 'test_meta_v17_isolation_quarantine.py' -v
          echo 'meta_v23_offline_route_reversibility=PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'meta_v23_public_live_deploy=NOT_REQUESTED' >> "$GITHUB_STEP_SUMMARY"
          echo 'meta_v23_android_end_to_end=NOT_TESTED' >> "$GITHUB_STEP_SUMMARY"
