name: Isolated FI AWG lifecycle one-shot dispatcher
on:
  push:
    branches: [feat/nodekit-awg-lifecycle-20261118]
    paths: [.github/workflows/nodekit-fi-awg-once.yml]
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: github.repository == 'grunvald91/telegram-proxy-infra'
    steps:
      - name: Transient canary of isolated AWG systemd service with zero clients
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh api --method POST \
            repos/grunvald91/telegram-proxy-infra/actions/workflows/nodekit-prepare-new-vps.yml/dispatches \
            -f ref=main \
            -f "inputs[host]=217.11.167.91" \
            -f "inputs[node_id]=fi-test-01" \
            -f "inputs[advertise_host]=fi.mnebyvpn.site" \
            -f "inputs[mode]=awg_canary"
