name: MNEBYDNS ChatGPT dependencies and personal DNS live audit read-only 20261114
on:
  push:
    branches: [diag/mnebydns-outage-20261114]
    paths: ['.github/workflows/mnebydns-chatgpt-personal-dependencies-audit-20261114.yml']
permissions: {contents: read}
jobs:
  dns:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      RU_PASS: ${{ secrets.SERVER188_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Read-only DNS A mapping and no IPv6 for ChatGPT dependencies
        run: |
          python3 - <<'PY'
          import socket,ssl,struct,random
          names=['chatgpt.com','www.chatgpt.com','auth.openai.com','api.openai.com','android.chat.openai.com','ws.chatgpt.com','tcr9i.chat.openai.com','cdn.oaistatic.com','persistent.oaistatic.com','files.oaiusercontent.com','cdn.workos.com','setup.workos.com','challenges.cloudflare.com']
          def recv(s,n):
            d=b''
            while len(d)<n:
              c=s.recv(n-len(d))
              if not c: raise EOFError('incomplete DNS response')
              d+=c
            return d
          def skip(d,i):
            while True:
              v=d[i]
              if v&192==192:return i+2
              if not v:return i+1
              i+=v+1
          def query(name,typ):
            q=struct.pack('!HHHHHH',random.randrange(1,65535),256,1,0,0,0)+b''.join(bytes([len(z)])+z.encode() for z in name.split('.'))+b'\0'+struct.pack('!HH',typ,1)
            with socket.create_connection(('188.120.254.223',853),timeout=6) as raw:
              raw.settimeout(6)
              with ssl.create_default_context().wrap_socket(raw,server_hostname='dns.mnebyvpn.site') as s:
                s.sendall(len(q).to_bytes(2,'big')+q)
                d=recv(s,int.from_bytes(recv(s,2),'big'))
            i=12
            for _ in range(int.from_bytes(d[4:6],'big')):i=skip(d,i)+4
            addr=[]
            for _ in range(int.from_bytes(d[6:8],'big')):
              i=skip(d,i)
              t,cl,ttl,n=struct.unpack_from('!HHIH',d,i)
              i+=10
              if t==1 and n==4:addr.append(socket.inet_ntoa(d[i:i+4]))
              i+=n
            return (d[3]&15,addr)
          for name in names:
            try:
              print('LEGACY_DOT',name,'A',query(name,1),'AAAA',query(name,28),flush=True)
            except Exception as e:print('LEGACY_DOT_ERROR',name,type(e).__name__,flush=True)
          PY
      - name: Active personal resolver policy classification and health without user keys
        run: |
          set -Eeuo pipefail
          test -n "$RU_PASS"
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sshpass >/dev/null
          export SSHPASS="$RU_PASS"
          sshpass -e ssh -T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts" -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR root@188.120.254.223 'bash -se' <<'SH'
          set -Eeuo pipefail
          echo 'PERSONAL_CONTAINER_STATUS'
          docker inspect --format '{{.State.Status}}' mnebydns-personal-dot-private
          echo 'PERSONAL_CLASSIFICATION'
          docker exec -i mnebydns-personal-dot-private node --experimental-strip-types --input-type=module - <<'JS'
          import {readFileSync} from 'node:fs';
          import {pinnedCanaryPolicy} from '/srv/mnebyvpn/apps/service/src/personal-dot-canary.ts';
          const env=process.env;
          const body=readFileSync(env.MNEBYDNS_PERSONAL_DOT_ROUTE_POLICY_FILE);
          const classifier=pinnedCanaryPolicy(body,env.MNEBYDNS_PERSONAL_DOT_ROUTE_POLICY_SHA256);
          const entries=JSON.parse(body.toString('utf8'));
          console.log('PERSONAL_POLICY_ENTRIES='+entries.length);
          for(const name of ['chatgpt.com','www.chatgpt.com','auth.openai.com','api.openai.com','android.chat.openai.com','ws.chatgpt.com','tcr9i.chat.openai.com','cdn.oaistatic.com','persistent.oaistatic.com','files.oaiusercontent.com','cdn.workos.com','setup.workos.com','challenges.cloudflare.com','example.org']){
            console.log('PERSONAL_CLASS '+name+' '+classifier({name,type:1,dnsClass:1}));
          }
          console.log('PERSONAL_MAPPED_SERVER='+env.MNEBYDNS_PERSONAL_MAPPED_DOT_IP+':'+env.MNEBYDNS_PERSONAL_MAPPED_DOT_PORT);
          JS
          echo 'PERSONAL_READONLY_COMPLETE'
          SH
