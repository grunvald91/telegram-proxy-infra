name: FI217 AWG dedicated forced SSH transport stage (clients off)
"on":
  push:
    branches: [main]
    paths:
      - '.github/workflows/fi-awg-forced-ssh-transport-stage.yml'
      - 'nodekit/fi_awg_delivery_ssh.py'
      - 'nodekit/fi_awg_ssh_stage.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fi217-awg-trusted-transport-setup
  cancel-in-progress: false
jobs:
  stage:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: node-fi
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Offline syntax and transport regression
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile nodekit/fi_awg_delivery_ssh.py nodekit/fi_awg_ssh_stage.py
          python3 -m unittest discover -s nodekit/tests -p 'test_fi_awg_ssh_stage.py' -v
      - name: Prepare ephemeral SSH client
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends sshpass >/dev/null
      - name: Generate RU-only key, install forced FI handler, test key authentication and rejection
        shell: bash
        env:
          RU_PASSWORD: ${{ secrets.SERVER188_SSH_PASSWORD }}
          FI_PASSWORD: ${{ secrets.MNEBYVPN_NEW_NODE_SSH_PASSWORD }}
          FI_USER: ${{ secrets.MNEBYVPN_NEW_NODE_SSH_USER }}
        run: |
          set -Eeuo pipefail
          umask 077
          [[ -n "$RU_PASSWORD" && -n "$FI_PASSWORD" && "$FI_USER" == root ]] || exit 2
          grep -q '^188\.120\.254\.223 ssh-ed25519 ' ops/mnebydns-owner-ssh-known_hosts
          work="$RUNNER_TEMP/fi-awg-forced-ssh"
          mkdir -m 0700 "$work"
          ru_cfg="$work/ru.sshconfig"
          fi_cfg="$work/fi.sshconfig"
          fi_hosts="$work/fi-known_hosts"
          pub="$work/awg-delivery.pub"
          handler_sha=$(sha256sum nodekit/fi_awg_delivery_ssh.py | cut -d' ' -f1)
          [[ "$handler_sha" =~ ^[a-f0-9]{64}$ ]]
          cat > "$ru_cfg" <<CFG
          Host ru-controller
            HostName 188.120.254.223
            User root
            UserKnownHostsFile $PWD/ops/mnebydns-owner-ssh-known_hosts
            GlobalKnownHostsFile /dev/null
            HostKeyAlgorithms ssh-ed25519
            StrictHostKeyChecking yes
            UpdateHostKeys no
            BatchMode no
            PasswordAuthentication yes
            PubkeyAuthentication no
            KbdInteractiveAuthentication no
            ForwardAgent no
            ClearAllForwardings yes
            ControlMaster no
            ProxyCommand none
            ConnectTimeout 12
            ServerAliveInterval 10
            ServerAliveCountMax 3
            LogLevel ERROR
          CFG
          ru(){ SSHPASS="$RU_PASSWORD" sshpass -e ssh -T -F "$ru_cfg" ru-controller "$@"; }
          ru_scp(){ SSHPASS="$RU_PASSWORD" sshpass -e scp -F "$ru_cfg" "$@"; }
          ru_tmp="";fi_tmp=""
          cleanup() {
            set +e
            if [[ "$ru_tmp" =~ ^/run/fi-awg-ssh-stage\.[A-Za-z0-9]{8}$ ]]; then
              ru "rm -rf -- '$ru_tmp'" >/dev/null 2>&1
            fi
            if [[ "$fi_tmp" =~ ^/run/fi-awg-ssh-stage\.[A-Za-z0-9]{8}$ ]]; then
              SSHPASS="$FI_PASSWORD" sshpass -e ssh -T -F "$fi_cfg" fi-node \
                "rm -rf -- '$fi_tmp'" >/dev/null 2>&1
            fi
            rm -rf -- "$work"
          }
          trap cleanup EXIT
          ru 'cat /root/mnebyvpn-controller/fi-known_hosts' > "$fi_hosts"
          chmod 0600 "$fi_hosts"
          [[ $(wc -l < "$fi_hosts") == 1 ]]
          grep -Eq '^fi\.mnebyvpn\.site ssh-ed25519 [A-Za-z0-9+/]+={0,2}$' "$fi_hosts"
          cat > "$fi_cfg" <<CFG
          Host fi-node
            HostName 217.11.167.91
            User root
            UserKnownHostsFile $fi_hosts
            HostKeyAlias fi.mnebyvpn.site
            GlobalKnownHostsFile /dev/null
            HostKeyAlgorithms ssh-ed25519
            StrictHostKeyChecking yes
            UpdateHostKeys no
            BatchMode no
            PasswordAuthentication yes
            PubkeyAuthentication no
            KbdInteractiveAuthentication no
            ForwardAgent no
            ClearAllForwardings yes
            ControlMaster no
            ProxyCommand none
            ConnectTimeout 12
            ServerAliveInterval 10
            ServerAliveCountMax 3
            LogLevel ERROR
          CFG
          fi(){ SSHPASS="$FI_PASSWORD" sshpass -e ssh -T -F "$fi_cfg" fi-node "$@"; }
          fi_scp(){ SSHPASS="$FI_PASSWORD" sshpass -e scp -F "$fi_cfg" "$@"; }
          ru_tmp=$(ru 'umask 077; mktemp -d /run/fi-awg-ssh-stage.XXXXXXXX')
          [[ "$ru_tmp" =~ ^/run/fi-awg-ssh-stage\.[A-Za-z0-9]{8}$ ]] || exit 2
          ru_scp nodekit/fi_awg_ssh_stage.py "ru-controller:$ru_tmp/"
          ru "chmod 0600 '$ru_tmp/fi_awg_ssh_stage.py'; python3 '$ru_tmp/fi_awg_ssh_stage.py' --mode controller-stage"
          ru "python3 '$ru_tmp/fi_awg_ssh_stage.py' --mode public" > "$pub"
          chmod 0600 "$pub"
          [[ "$(wc -l < "$pub")" == 1 ]]
          grep -Eq '^ssh-ed25519 [A-Za-z0-9+/]+={0,2} mnebyvpn-fi217-awg-delivery$' "$pub"
          fi_tmp=$(fi 'umask 077; mktemp -d /run/fi-awg-ssh-stage.XXXXXXXX')
          [[ "$fi_tmp" =~ ^/run/fi-awg-ssh-stage\.[A-Za-z0-9]{8}$ ]] || exit 2
          fi_scp nodekit/fi_awg_ssh_stage.py nodekit/fi_awg_delivery_ssh.py "$pub" \
            "fi-node:$fi_tmp/"
          fi "chmod 0600 '$fi_tmp/fi_awg_ssh_stage.py' '$fi_tmp/fi_awg_delivery_ssh.py' '$fi_tmp/awg-delivery.pub'; python3 '$fi_tmp/fi_awg_ssh_stage.py' --mode node-stage --public-file '$fi_tmp/awg-delivery.pub' --handler-source '$fi_tmp/fi_awg_delivery_ssh.py' --handler-sha256 '$handler_sha'"
          ru "python3 '$ru_tmp/fi_awg_ssh_stage.py' --mode probe"
          fi 'set -eu; ! systemctl is-active --quiet mnebyvpn-nodekit-awg@fi-test-01.service; ! systemctl is-active --quiet mnebyvpn-nodekit-awg-watchdog@fi-test-01.service'
          echo 'FI_AWG_TRANSPORT_STAGED=true;AWG_GRANTS_APPLIED=false;SUBSCRIPTIONS_PUBLISHED=false'
