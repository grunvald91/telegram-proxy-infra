name: MNEBYDNS all 264 mapped A templates against DE HTTPS SNI real backend (read only)
on:
  push:
    branches: [audit/mnebydns-unified-188-deep-review-20261114]
    paths: ['.github/workflows/mnebydns-443-sni-and-dns-full-consistency-review-20261114.yml']
permissions: {contents: read}
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Audit complete active foreign CoreDNS to foreign SNI proxy map
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$DE_PASS" && test -s ops/mnebydns-owner-ssh-known_hosts
          sudo apt-get update -qq && sudo apt-get install -qq -y sshpass >/dev/null
          export SSHPASS="$DE_PASS"
          sshpass -e ssh -T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts" -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR root@89.125.90.101 'python3 -' <<'PY'
          import re,pathlib,subprocess,collections
          core=pathlib.Path('/opt/mnebydns-dot/Corefile').read_text()
          conf=pathlib.Path('/etc/nginx/nginx.conf').read_text()
          m=re.search(r'map\s+\$ssl_preread_server_name\s+\$direct_mtproxy_backend\s*\{(.*?)\n\s*\}',conf,re.S)
          assert m,'SNI HTTPS proxy map missing'
          exact={}
          reg=[]
          default=None
          for line in m.group(1).splitlines():
              line=line.split('#',1)[0].strip()
              if not line or line.startswith('hostnames;'):continue
              parts=line.rstrip(';').split()
              if len(parts)!=2:continue
              host,backend=parts
              if host=='default':default=backend
              elif host.startswith('~'):
                  assert host.startswith('~*')
                  reg.append((re.compile(host[2:],re.I),backend))
              else:exact[host.lower()]=backend
          assert default is not None
          def classify(host):
              if host in exact:return ('EXACT',exact[host])
              for r,b in reg:
                  if r.fullmatch(host):return ('REGEX',b)
              return ('DEFAULT',default)
          blocks=re.findall(r'(?ms)^\s*template\s+IN\s+A\s+(\S+)\s*\{(.*?)^\s*\}',core)
          assert len(blocks)==264
          names=set()
          families=[]
          for header,body in blocks:
              match=re.search(r'(?m)^\s*match\s+(.+)$',body)
              assert match and re.compile(match.group(1))
              if header!='.':names.add(header)
              else:
                  regx=match.group(1)
                  text=regx.removeprefix('(?i)').strip('^$').replace('[.]','.').replace('\\-','-').rstrip('.')
                  if re.fullmatch(r'[a-z0-9-]+(?:\.[a-z0-9-]+)+',text):names.add(text)
                  else:
                      assert regx.startswith('(?i)^(?:[a-z0-9-]+[.])*(?:') and regx.endswith(')[.]$'),regx
                      body2=regx.rsplit('(?:',1)[1].rsplit(')[.]$',1)[0]
                      roots=[x.replace('\\.','.').replace('\\-','-') for x in body2.split('|')]
                      assert all(re.fullmatch(r'[a-z0-9-]+(?:\.[a-z0-9-]+)+',x) for x in roots),roots
                      families.append(roots)
          tests=set(names)
          for roots in families:
              for root in roots:tests.update((root,'www.'+root,'r1---sn-test.'+root))
          results=collections.Counter()
          missing=[]
          for name in sorted(tests):
              kind,backend=classify(name)
              results[(kind,backend)]+=1
              if kind=='DEFAULT':missing.append((name,backend))
          print('MATCH_CHECK_CORE_A_TOTAL='+str(len(blocks)))
          print('MATCH_CHECK_CORE_EXACT_UNIQUE='+str(len(names)))
          print('MATCH_CHECK_CORE_FAMILY_ROOTS='+str(sum(map(len,families))))
          print('MATCH_CHECK_FOREIGN_NGINX_EXACT='+str(len(exact)))
          print('MATCH_CHECK_FOREIGN_NGINX_REGEX='+str(len(reg)))
          print('MATCH_CHECK_SAMPLES_TOTAL='+str(len(tests)))
          print('MATCH_CHECK_SAMPLES_DEFAULT_FALLBACK='+str(len(missing)))
          for x,n in sorted(results.items()):print('MATCH_CHECK_ROUTE_COUNT='+str(x)+' :'+str(n))
          for name,backend in missing:print('MATCH_CHECK_DOMAIN_MISSING_HTTPS_PROXY='+name+' '+backend)
          for name in ('chatgpt.com','auth.openai.com','claude.ai','www.youtube.com',
                       'r1---sn-test.googlevideo.com','r2---sn-test.ytimg.com',
                       'www.cloud.oracle.com','cloud.oracle.com','copilot.microsoft.com','microsoft.com'):
              print('MATCH_CHECK_CRITICAL_HOST='+name+' '+str(classify(name)))
          print('MATCH_CHECK_COMPLETE=PASS')
          PY
