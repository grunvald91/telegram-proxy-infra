name: MNEBYDNS ChatGPT QUIC HTTP3 differential read-only 20261114
on:
  push:
    branches: [diag/mnebydns-outage-20261114]
    paths: ['.github/workflows/mnebydns-chatgpt-quic-h3-readonly-20261114.yml']
permissions: {contents: read}
jobs:
  h3:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated QUIC client
        run: |
          python3 -m pip install --quiet --disable-pip-version-check aioquic
      - name: Compare strictly verified HTTP3 to ChatGPT through RU and DE versus origin
        run: |
          python3 - <<'PY'
          import asyncio,ssl,socket
          from aioquic.asyncio.client import connect
          from aioquic.asyncio.protocol import QuicConnectionProtocol
          from aioquic.h3.connection import H3_ALPN,H3Connection
          from aioquic.h3.events import HeadersReceived,DataReceived
          from aioquic.quic.configuration import QuicConfiguration
          class P(QuicConnectionProtocol):
            def __init__(self,*a,**kw):
              super().__init__(*a,**kw);self.h3=H3Connection(self._quic);self.fut=None
            def quic_event_received(self,event):
              super().quic_event_received(event)
              for e in self.h3.handle_event(event):
                if self.fut and not self.fut.done() and isinstance(e,HeadersReceived):
                  status=next((v.decode() for k,v in e.headers if k==b':status'),None)
                  if status:self.fut.set_result(status)
            async def req(self,host):
              self.fut=asyncio.get_running_loop().create_future()
              st=self._quic.get_next_available_stream_id()
              self.h3.send_headers(st,[(b':method',b'HEAD'),(b':scheme',b'https'),(b':authority',host.encode()),(b':path',b'/')],end_stream=True)
              self.transmit()
              return await asyncio.wait_for(self.fut,5)
          async def test(host,ip,label):
            try:
              conf=QuicConfiguration(is_client=True,alpn_protocols=H3_ALPN,server_name=host,verify_mode=ssl.CERT_REQUIRED)
              async with connect(ip,443,configuration=conf,create_protocol=P,wait_connected=True) as p:
                st=await p.req(host)
                print('H3',host,label,'VERIFIED',st,flush=True)
            except Exception as e: print('H3',host,label,'FAILED',type(e).__name__,flush=True)
          async def main():
            for h in ['chatgpt.com','auth.openai.com']:
              try:origin=socket.gethostbyname(h)
              except:origin=None
              tasks=[test(h,'188.120.254.223','RU188'),test(h,'89.125.90.101','DE89')]
              if origin:tasks.append(test(h,origin,'ORIGIN'))
              await asyncio.gather(*(asyncio.wait_for(t,14) for t in tasks),return_exceptions=True)
          asyncio.run(main())
          PY
