name: MNEBYDNS stage WireGuard-only CoreDNS origin without changing existing public DNS
on:
  push:
    branches: [fix/mnebydns-personal-postlaunch-hardening-20261114]
    paths: ['.github/workflows/mnebydns-private-origin-bridge-deploy-20261114.yml']
permissions:
  contents: read
concurrency:
  group: mnebydns-private-origin-bridge-deploy
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
      RU_PASS: ${{ secrets.SERVER188_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Static preflight and host prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n scripts/mnebydns-private-origin-bridge-20261114.sh
          test -n "$DE_PASS" && test -n "$RU_PASS"
          test -s ops/mnebydns-owner-ssh-known_hosts
          ! grep -Fq 'systemctl restart mnebydns-dot' scripts/mnebydns-private-origin-bridge-20261114.sh
          sudo apt-get update -qq && sudo apt-get install -qq -y sshpass >/dev/null
      - name: Install isolated private source only on foreign WireGuard IP
        id: install
        shell: bash
        run: |
          set -Eeuo pipefail
          opts=(-o ConnectTimeout=12 -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts"
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR)
          export SSHPASS="$DE_PASS"
          sshpass -e scp -q "${opts[@]}" scripts/mnebydns-private-origin-bridge-20261114.sh \
            root@89.125.90.101:/tmp/mnebydns-private-origin-bridge-20261114.sh
          sshpass -e ssh -T "${opts[@]}" root@89.125.90.101 \
            'bash /tmp/mnebydns-private-origin-bridge-20261114.sh install'
      - name: Verify strict DoT via private origin from RU without user credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          export SSHPASS="$RU_PASS"
          sshpass -e ssh -T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR \
            root@188.120.254.223 'python3 -' <<'PY'
          import socket,ssl,struct,secrets
          with socket.create_connection(('10.66.77.1',1853),timeout=6) as raw:
              raw.settimeout(6)
              with ssl.create_default_context().wrap_socket(raw,server_hostname='dns.mnebyvpn.site') as tls:
                  tid=secrets.randbelow(65534)+1
                  q=struct.pack('!HHHHHH',tid,256,1,0,0,0)
                  q+=b'\x07example\x03com\x00'+struct.pack('!HH',1,1)
                  tls.sendall(struct.pack('!H',len(q))+q)
                  header=tls.recv(2)
                  assert len(header)==2
                  n=struct.unpack('!H',header)[0]
                  assert 12<=n<=65535
                  data=b''
                  while len(data)<n:
                      part=tls.recv(n-len(data))
                      assert part
                      data+=part
                  assert int.from_bytes(data[:2],'big')==tid and data[2]&128
          print('RU_TO_DE_PRIVATE_ORIGIN_DOT_QUERY=STRICT_PASS')
          PY
      - name: Confirm both public legacy DNS and personalized wildcard still work
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import socket,ssl
          for name in ('dns.mnebyvpn.site','aaaaaaaaaaaa.dns.mnebyvpn.site'):
              with socket.create_connection(('89.125.90.101',853),timeout=8) as raw:
                  raw.settimeout(8)
                  with ssl.create_default_context().wrap_socket(raw,server_hostname=name) as tls:
                      assert tls.getpeercert()
          print('LEGACY_AND_PERSONAL_PUBLIC_TLS_PRESERVED=true')
          PY
      - name: Remove only new private origin service on canary failure
        if: ${{ failure() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          export SSHPASS="$DE_PASS"
          sshpass -e ssh -T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR \
            root@89.125.90.101 'bash /tmp/mnebydns-private-origin-bridge-20261114.sh rollback'
