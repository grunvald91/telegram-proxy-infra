name: MNEBYDNS live Google and YouTube effective route audit 20261117
on:
  push:
    branches: [fix/mnebydns-google-domain-coverage-20261117]
    paths:
      - '.github/workflows/mnebydns-google-effective-route-audit-20261117.yml'
permissions: {contents: read}
concurrency:
  group: mnebydns-google-effective-route-20261117
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Offline syntax, SSH verified host and secret checks
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/mnebydns-google-effective-routes-audit-20261117.py
          test -n "$DE_PASS" && test -s ops/mnebydns-owner-ssh-known_hosts
          sudo apt-get update -qq && sudo apt-get install -qq -y sshpass >/dev/null
          echo GOOGLE_AUDIT_STATIC_PREFLIGHT=PASS
      - name: Read-only live CoreDNS / Nginx / GooglePilot effective route matrix
        shell: bash
        run: |
          set -Eeuo pipefail
          opts=(-T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts"
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR)
          SSHPASS="$DE_PASS" sshpass -e ssh "${opts[@]}" root@89.125.90.101 \
            'python3 -B -' < scripts/mnebydns-google-effective-routes-audit-20261117.py
          echo GOOGLE_AUDIT_LIVE_COMPLETED_NO_MODIFICATIONS=true
      - name: Public DoT actual DNS replies A AAAA HTTPS (generic SNI only)
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/mnebydns-public-dot-route-probe-20261117.py
          python3 scripts/mnebydns-public-dot-route-probe-20261117.py
          echo GOOGLE_AUDIT_PUBLIC_DOT_PROBE_COMPLETE=true
