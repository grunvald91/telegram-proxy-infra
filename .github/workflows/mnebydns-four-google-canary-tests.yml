name: Validate MNEBYDNS experimental four-service canary offline
on:
  push:
    branches: ['feature/mnebydns-claude-google-combined-30m-20261109']
    paths:
      - 'scripts/mnebydns-four-google-canary.py'
      - 'scripts/mnebydns-four-google-deploy.sh'
      - 'scripts/mnebydns-four-google-rollback.sh'
      - '.github/workflows/mnebydns-four-google-canary-tests.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Verify four product exact-host canary renderer and safe transactional guards
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/mnebydns-four-google-canary.py
          python3 scripts/mnebydns-four-google-canary.py self-test
          python3 - <<'PY'
          import importlib.util,pathlib
          path=pathlib.Path('scripts/mnebydns-four-google-canary.py')
          spec=importlib.util.spec_from_file_location('canary',path)
          m=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          added=('android.googleapis.com','firebaseinstallations.googleapis.com','gcm-http.googleapis.com')
          assert all(h in m.HOSTS for h in added)
          assert len(m.HOSTS)==91 and len(set(m.HOSTS))==91
          safe_443=('pki.google.com','clients1.google.com','notifications.google.com')
          assert all(h in m.HOSTS for h in safe_443)
          assert all(h in m.DYNAMIC_SUFFIXES for h in ('googleapis.com','google.com'))
          assert len(m.DYNAMIC_SUFFIXES)==23
          # Owner-directed temporary DNS-only redirect includes all system names.
          android_system=('mtalk.google.com','mtalk4.google.com','time.google.com',
                          'fcm.googleapis.com','fcm-xmpp.googleapis.com',
                          'firebaseinstallations.googleapis.com','gcm-http.googleapis.com',
                          'gcm-xmpp.googleapis.com','android.googleapis.com',
                          'pki.google.com','clients1.google.com',
                          'notifications.google.com','stun.l.google.com')
          assert len(android_system)==13
          assert all(h in m.HOSTS for h in (*android_system,*claude))
          claude=('claude.ai','a.claude.ai','a-cdn.claude.ai',
                  'assets.claude.ai','downloads.claude.ai','claude.com',
                  'code.claude.com','platform.claude.com','api.anthropic.com',
                  'a-api.anthropic.com','a-cdn.anthropic.com','s-cdn.anthropic.com',
                  'assets-proxy.anthropic.com','statsig.anthropic.com',
                  'bridge.claudeusercontent.com','claudeusercontent.com',
                  'claudemcpcontent.com','claude.app')
          assert len(claude)==18 and all(h in m.HOSTS for h in claude)
          assert all(z in m.DYNAMIC_SUFFIXES for z in (
              'claude.ai','claude.com','anthropic.com',
              'claudeusercontent.com','claudemcpcontent.com','claude.app'))
          fixture='''tls://.:853 {
              template IN A gemini.google.com { match x }
              cache 30
          }
          '''
          rendered=m.render_dot(fixture)
          assert all(('template IN A '+h+' {') in rendered for h in android_system)
          print('Android_Google_Claude_91_exact_23_suffixes=PASS')
          PY
          bash -n scripts/mnebydns-four-google-deploy.sh
          bash -n scripts/mnebydns-four-google-rollback.sh
          python3 - <<'PY'
          from pathlib import Path
          r=Path('scripts/mnebydns-four-google-rollback.sh').read_text()
          d=Path('scripts/mnebydns-four-google-deploy.sh').read_text()
          assert 'cmp -s "$base/$component.pilot" "$live"' in r
          assert 'cmp -s "$base/$component.before" "$live"' in r
          assert 'OnCalendar=$deadline' in d
          assert 'Persistent=true' in d
          assert 'systemctl enable --now "$watchdog.timer"' in d
          assert 'systemd-analyze calendar "$deadline"' in d
          assert r.index('systemctl stop mnebydns-googlepilot.service') > r.index('systemctl restart mnebydns-dot.service')
          assert 'nginx -t' in d
          assert 'systemctl reload nginx' in d
          assert 'systemctl restart mnebydns-dot.service' in d
          assert 'xray' in d and 'stitch.withgoogle.com' in d
          assert 'MNEBYDNS four-Google-services time-limited' in d
          assert 'nginx -t -c "$base/nginx.pilot"' in d
          print('transactional_auto_rollback_contract=PASS')
          PY
