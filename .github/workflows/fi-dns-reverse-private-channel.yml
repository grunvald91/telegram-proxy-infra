name: FI DNS controller-initiated private channel (gate OFF)
"on":
  pull_request:
    paths: ["nodekit/fi_dns_reverse*.py","nodekit/tests/test_fi_dns_reverse_channel.py","nodekit/systemd/fi-dns-reverse/*.service","nodekit/systemd/fi-dns-reverse/*.timer",".github/workflows/fi-dns-reverse-private-channel.yml"]
  push:
    branches: [main]
    paths: ["nodekit/fi_dns_reverse*.py","nodekit/tests/test_fi_dns_reverse_channel.py","nodekit/systemd/fi-dns-reverse/*.service","nodekit/systemd/fi-dns-reverse/*.timer",".github/workflows/fi-dns-reverse-private-channel.yml"]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: mnebyvpn-fleet-fi
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Test real local Unix socket and reverse stdio framing
        run: |
          set -Eeuo pipefail
          python3 -m py_compile nodekit/fi_dns_reverse_{channel,stage}.py
          sudo python3 -m unittest discover -s nodekit/tests -p 'test_fi_dns_reverse_channel.py' -v
          python3 -m py_compile nodekit/fi_dns_reverse_clock.py
          PYTHONPATH=nodekit python3 - <<'PY'
          from fi_dns_reverse_clock import checked_offset
          assert checked_offset([(45.2,.4),(45.7,.5)]) == 45.45
          for samples in [[(45,.4)],[(45,.4),(50,.4)],[(121,.4),(122,.4)],[(-45,.4),(-44,.4)],[(45,3.1),(45,.5)]]:
              try: checked_offset(samples)
              except ValueError: pass
              else: raise AssertionError("unsafe time correction accepted")
          PY
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('.github/workflows/fi-dns-reverse-private-channel.yml').read_text().splitlines()
          i=lines.index('      - name: Deploy controller-initiated channel and verify real signed RPC')
          i=next(j for j in range(i+1,len(lines)) if lines[j]=='        run: |')+1
          rows=[]
          for line in lines[i:]:
              if line and not line.startswith('          '): break
              rows.append(line[10:] if line.startswith('          ') else '')
          text='\n'.join(rows)+'\n'
          assert 'StrictHostKeyChecking yes' in text and 'rollback-fi' in text and 'rollback-ru' in text
          Path('/tmp/fi-dns-reverse-live.sh').write_text(text)
          PY
          bash -n /tmp/fi-dns-reverse-live.sh
  stage:
    needs: offline
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: node-fi
    env:
      RU_PASSWORD: ${{ secrets.SERVER188_SSH_PASSWORD }}
      FI_PASSWORD: ${{ secrets.MNEBYVPN_NEW_NODE_SSH_PASSWORD }}
      FI_USER: ${{ secrets.MNEBYVPN_NEW_NODE_SSH_USER }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Deploy controller-initiated channel and verify real signed RPC
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          [[ "$FI_USER" == root && -n "$RU_PASSWORD" && -n "$FI_PASSWORD" ]] || exit 2
          grep -q '^188\.120\.254\.223 ssh-ed25519 ' ops/mnebydns-owner-ssh-known_hosts
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends sshpass >/dev/null
          work="$RUNNER_TEMP/fi-dns-canary"
          mkdir -m 0700 "$work"
          cat > "$work/ru.cfg" <<CFG
          Host ru-controller
            HostName 188.120.254.223
            User root
            UserKnownHostsFile $GITHUB_WORKSPACE/ops/mnebydns-owner-ssh-known_hosts
            GlobalKnownHostsFile /dev/null
            HostKeyAlgorithms ssh-ed25519
            StrictHostKeyChecking yes
            UpdateHostKeys no
            PubkeyAuthentication no
            PreferredAuthentications password
            ForwardAgent no
            ClearAllForwardings yes
            ControlMaster no
            ConnectTimeout 12
            LogLevel ERROR
          CFG
          SSHPASS="$RU_PASSWORD" sshpass -e ssh -T -F "$work/ru.cfg" ru-controller \
            'test -f /root/mnebyvpn-controller/fi-known_hosts && test ! -L /root/mnebyvpn-controller/fi-known_hosts && test "$(stat -c "%u:%a" /root/mnebyvpn-controller/fi-known_hosts)" = 0:600 && cat /root/mnebyvpn-controller/fi-known_hosts' > "$work/fi-known"
          python3 - "$work/fi-known" <<'PY'
          import base64,pathlib,sys
          data=pathlib.Path(sys.argv[1]).read_bytes()
          assert len(data)<512 and data.count(b'\n')==1 and data.endswith(b'\n')
          name,kind,key=data.decode('ascii').strip().split()
          assert (name,kind)==('fi.mnebyvpn.site','ssh-ed25519')
          raw=base64.b64decode(key,validate=True)
          assert len(raw)==51 and raw.startswith(b'\x00\x00\x00\x0bssh-ed25519\x00\x00\x00\x20')
          PY
          cat > "$work/fi.cfg" <<CFG
          Host fi-node
            HostName 217.11.167.91
            User root
            HostKeyAlias fi.mnebyvpn.site
            UserKnownHostsFile $work/fi-known
            GlobalKnownHostsFile /dev/null
            HostKeyAlgorithms ssh-ed25519
            StrictHostKeyChecking yes
            UpdateHostKeys no
            PubkeyAuthentication no
            PreferredAuthentications password
            ForwardAgent no
            ClearAllForwardings yes
            ControlMaster no
            ConnectTimeout 12
            LogLevel ERROR
          CFG
          fi_node() { SSHPASS="$FI_PASSWORD" sshpass -e ssh -T -F "$work/fi.cfg" fi-node "$@"; }
          ru_node() { SSHPASS="$RU_PASSWORD" sshpass -e ssh -T -F "$work/ru.cfg" ru-controller "$@"; }
          ru_copy() { SSHPASS="$RU_PASSWORD" sshpass -e scp -F "$work/ru.cfg" "$@"; }
          fi_copy() { SSHPASS="$FI_PASSWORD" sshpass -e scp -F "$work/fi.cfg" "$@"; }
          # Independently compare both remote clocks against a bracketed
          # runner clock. Only numeric offsets and sync status are emitted.
          clock_probe() {
            local label="$1" func="$2" before after remote offset rtt
            before=$(date +%s%3N)
            remote=$("$func" 'date +%s%3N')
            after=$(date +%s%3N)
            [[ "$remote" =~ ^[0-9]{13}$ && "$before" =~ ^[0-9]{13}$ && "$after" =~ ^[0-9]{13}$ ]] || return 2
            offset=$((remote - (before + after) / 2))
            rtt=$((after - before))
            printf 'FI_DNS_CLOCK_%s_OFFSET_MS=%s;RTT_MS=%s\n' "$label" "$offset" "$rtt"
            "$func" 'printf "NTP_SYNC="; timedatectl show -p NTPSynchronized --value 2>/dev/null || true; printf "NTP_ENABLED="; timedatectl show -p NTP --value 2>/dev/null || true; for svc in systemd-timesyncd chrony chronyd ntp ntpsec; do if systemctl is-active --quiet "$svc.service"; then printf "ACTIVE_TIME_SERVICE=%s\n" "$svc"; fi; done'
          }
          clock_probe RU ru_node
          clock_probe FI fi_node
          stage="/run/fi-dns-reverse-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          [[ "$stage" =~ ^/run/fi-dns-reverse-[0-9]+-[0-9]+$ ]]
          ru_created=no
          fi_created=no
          verified=no
          cleanup() {
            set +e
            if [[ "$verified" != yes ]]; then
              if [[ "$ru_created" == yes ]]; then ru_node "if test -f '$stage/started'; then python3 '$stage/fi_dns_reverse_stage.py' rollback-ru '$stage'; fi" || echo 'REVERSE_SERVICE_ROLLBACK_UNVERIFIED'; fi
              if [[ "$fi_created" == yes ]]; then fi_node "if test -f '$stage/new-auth'; then python3 '$stage/fi_dns_reverse_stage.py' rollback-fi '$stage'; fi" || echo 'REVERSE_AUTH_ROLLBACK_UNVERIFIED'; fi
            fi
            if [[ "$ru_created" == yes ]]; then ru_node "rm -rf -- '$stage'" >/dev/null 2>&1; fi
            if [[ "$fi_created" == yes ]]; then fi_node "rm -rf -- '$stage'" >/dev/null 2>&1; fi
            rm -rf "$work"
          }
          trap cleanup EXIT
          ru_node "umask 077; mkdir -m 0700 '$stage'"
          ru_created=yes
          fi_node "umask 077; mkdir -m 0700 '$stage'"
          fi_created=yes
          ru_copy nodekit/fi_dns_reverse_stage.py nodekit/fi_dns_reverse_channel.py nodekit/fi_dns_ssh_stage.py nodekit/fi_dns_ssh_bridge.py nodekit/systemd/fi-dns-reverse/mnebyvpn-fi-dns-reverse.service "ru-controller:$stage/"
          ru_node "chmod 600 '$stage'/*; python3 '$stage/fi_dns_reverse_stage.py' ru '$stage'"
          ru_copy "ru-controller:$stage/ru-public.key" "$work/ru-public.key"
          fi_copy nodekit/fi_dns_reverse_stage.py nodekit/fi_dns_reverse_channel.py nodekit/fi_dns_ssh_stage.py nodekit/fi_dns_ssh_bridge.py "$work/ru-public.key" "fi-node:$stage/"
          fi_copy nodekit/fi_dns_reverse_clock.py nodekit/systemd/fi-dns-reverse/mnebyvpn-fi-clock.service nodekit/systemd/fi-dns-reverse/mnebyvpn-fi-clock.timer "fi-node:$stage/"
          fi_node "chmod 600 '$stage'/*; python3 '$stage/fi_dns_reverse_stage.py' clock '$stage'"
          clock_probe FI fi_node
          fi_node "python3 '$stage/fi_dns_reverse_stage.py' fi '$stage'"
          ru_node "python3 '$stage/fi_dns_reverse_stage.py' start '$stage'"
          if ! fi_node "python3 '$stage/fi_dns_reverse_stage.py' probe"; then
            ru_node 'for name in mnebyvpn-fi-dns-meter mnebyvpn-fi-dns-publisher mnebyvpn-fi-dns-reverse; do systemctl show "$name" -p Id -p ActiveState -p SubState -p Result -p ExecMainStatus -p NRestarts; done; journalctl -u mnebyvpn-fi-dns-meter -u mnebyvpn-fi-dns-publisher -u mnebyvpn-fi-dns-reverse -n 80 --no-pager -o cat | grep -E "^FI_DNS_(METER_LOOPBACK_READY|SIGNED_OUTBOX_READY|CONTROLLER_WORKER_STOPPED|DB_IDLE_ERROR|REVERSE_CHANNEL_CLOSED)$" | sort | uniq -c' || true
            exit 2
          fi
          verified=yes
