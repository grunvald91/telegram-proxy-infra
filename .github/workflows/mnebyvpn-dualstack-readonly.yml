name: MNEBYVPN IPv4 IPv6 architecture read-only audit
"on":
  push:
    branches: ["audit/dualstack-readonly-20261122"]
    paths:
      - ".github/workflows/mnebyvpn-dualstack-readonly.yml"
      - "scripts/mnebyvpn-dualstack-readonly.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dualstack:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RU_PASSWORD: ${{ secrets.SERVER188_SSH_PASSWORD }}
      DE_PASSWORD: ${{ secrets.RELAY89_SSH_PASSWORD }}
      FI_PASSWORD: ${{ secrets.MNEBYVPN_NEW_NODE_SSH_PASSWORD }}
      FI_USER: ${{ secrets.MNEBYVPN_NEW_NODE_SSH_USER }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Static validation and public DNS TCP IPv4 IPv6 (no credentials)
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/mnebyvpn-dualstack-readonly.py
          python3 scripts/mnebyvpn-dualstack-readonly.py --public | tee dualstack-report.jsonl

      - name: Inspect RU188 and DE89 using pinned SSH (read only)
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s ops/mnebydns-owner-ssh-known_hosts
          grep -q '^188\.120\.254\.223 ssh-ed25519 ' ops/mnebydns-owner-ssh-known_hosts
          grep -q '^89\.125\.90\.101 ssh-ed25519 ' ops/mnebydns-owner-ssh-known_hosts
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends sshpass >/dev/null
          opts=(-T -F /dev/null -o ConnectTimeout=12
            -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519
            -o "UserKnownHostsFile=$GITHUB_WORKSPACE/ops/mnebydns-owner-ssh-known_hosts"
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no
            -o PasswordAuthentication=yes -o PubkeyAuthentication=no
            -o KbdInteractiveAuthentication=no -o BatchMode=no
            -o ClearAllForwardings=yes -o ForwardAgent=no -o LogLevel=ERROR)
          if [[ -z "$RU_PASSWORD" || -z "$DE_PASSWORD" ]]; then
            echo "::error::One or both SSH credentials are unavailable"
            exit 1
          fi
          SSHPASS="$RU_PASSWORD" sshpass -e ssh "${opts[@]}" root@188.120.254.223 'python3 - --host RU188' \
            < scripts/mnebyvpn-dualstack-readonly.py | tee -a dualstack-report.jsonl
          SSHPASS="$DE_PASSWORD" sshpass -e ssh "${opts[@]}" root@89.125.90.101 'python3 - --host DE89' \
            < scripts/mnebyvpn-dualstack-readonly.py | tee -a dualstack-report.jsonl

      - name: Inspect FI217 using controller-pinned SSH host key (read only)
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$FI_USER" == root && -n "$FI_PASSWORD" && -n "$RU_PASSWORD" ]] || {
            echo "::error::FI SSH credentials or username unavailable"
            exit 1
          }
          known="$RUNNER_TEMP/fi-known"
          umask 077
          SSHPASS="$RU_PASSWORD" sshpass -e ssh -T -F /dev/null \
            -o ConnectTimeout=12 -o StrictHostKeyChecking=yes \
            -o HostKeyAlgorithms=ssh-ed25519 \
            -o "UserKnownHostsFile=$GITHUB_WORKSPACE/ops/mnebydns-owner-ssh-known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no \
            -o PasswordAuthentication=yes -o PubkeyAuthentication=no \
            -o KbdInteractiveAuthentication=no -o BatchMode=no \
            -o LogLevel=ERROR root@188.120.254.223 \
            'test -f /root/mnebyvpn-controller/fi-known_hosts && test ! -L /root/mnebyvpn-controller/fi-known_hosts && test "$(stat -c "%u:%a" /root/mnebyvpn-controller/fi-known_hosts)" = "0:600" && cat /root/mnebyvpn-controller/fi-known_hosts' > "$known"
          python3 - "$known" <<'PY'
          import pathlib,sys,base64
          data=pathlib.Path(sys.argv[1]).read_text('ascii')
          parts=data.strip().split()
          assert data.endswith('\n') and data.count('\n')==1
          assert len(parts)==3 and parts[0]=='fi.mnebyvpn.site' and parts[1]=='ssh-ed25519'
          blob=base64.b64decode(parts[2],validate=True)
          assert len(blob)==51 and blob.startswith(b'\x00\x00\x00\x0bssh-ed25519\x00\x00\x00\x20')
          PY
          SSHPASS="$FI_PASSWORD" sshpass -e ssh -T -F /dev/null \
            -o ConnectTimeout=12 -o StrictHostKeyChecking=yes \
            -o HostKeyAlias=fi.mnebyvpn.site -o HostKeyAlgorithms=ssh-ed25519 \
            -o "UserKnownHostsFile=$known" \
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no \
            -o PasswordAuthentication=yes -o PubkeyAuthentication=no \
            -o KbdInteractiveAuthentication=no -o BatchMode=no \
            -o ClearAllForwardings=yes -o ForwardAgent=no -o LogLevel=ERROR \
            root@217.11.167.91 'python3 - --host FI217' \
            < scripts/mnebyvpn-dualstack-readonly.py | tee -a dualstack-report.jsonl

      - name: Summarize read-only evidence and distinguish unknowns
        if: always()
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json,pathlib
          p=pathlib.Path("dualstack-report.jsonl")
          print("## MNEBYVPN IPv4/IPv6 read-only audit")
          print("No server service, routing, firewall, DNS policy or customer subscription modified.")
          print("")
          print("| Scope | Global IPv6 | IPv6 default route | IPv6 TCP/443 egress | IPv6 TCP/853 listener |")
          print("|---|---|---|---|---|")
          rows=[]
          if p.exists():
              for line in p.read_text().splitlines():
                  try: rows.append(json.loads(line))
                  except ValueError: pass
          def cell(value):
              if value is True: return "yes"
              if value is False: return "no"
              return "unknown"
          for row in rows:
              if row.get("scope")=="public":
                  print(f"| runner/public | unknown | unknown | {cell(row.get('runner_ipv6_egress'))} | {cell(row.get('personal_dns_tcp853_ipv6'))} (DNS target) |")
              else:
                  tcp6=row.get("tcp_ipv6_listeners") or {}
                  print(f"| {row.get('scope')} | {cell(row.get('global_ipv6_address_present'))} | {cell(row.get('default_ipv6_route'))} | {cell(row.get('ipv6_egress_tcp443'))} | {cell(tcp6.get('853'))} |")
          expected={"public","RU188","DE89","FI217"}
          missing=expected-{x.get("scope") for x in rows}
          print("")
          print("Missing / unverified scopes: "+(", ".join(sorted(missing)) if missing else "none"))
          print("A socket or DNS record is not proof of working IPv6 VPN routes, DoH, DNS64, or MTProto authorization.")
          PY
      - name: Archive sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipv4-ipv6-readonly-${{ github.run_id }}
          path: dualstack-report.jsonl
          if-no-files-found: warn
          retention-days: 14
