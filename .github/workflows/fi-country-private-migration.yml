name: FI corrected country zone private runtime migration
"on":
  pull_request:
    branches: [main]
    paths: ['nodekit/fi_country_*.py', 'nodekit/tests/test_fi_country_*.py', 'nodekit/systemd/fi-country/**', '.github/workflows/fi-country-private-migration.yml']
  push:
    branches: [main]
    paths: ['nodekit/fi_country_*.py', 'nodekit/tests/test_fi_country_*.py', 'nodekit/systemd/fi-country/**', '.github/workflows/fi-country-private-migration.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: mnebyvpn-fleet-fi
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Test transition and generated runtime contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          python3 -B -m unittest discover -s nodekit/tests -p test_fi_country_transaction.py -v
          python3 -B nodekit/fi_country_build.py nodekit "$RUNNER_TEMP/fi-country-runtime"
          PYTHONPATH="$RUNNER_TEMP/fi-country-runtime" python3 -B - <<'PY'
          import hashlib, sys, os
          from pathlib import Path
          sys.path.insert(0,'nodekit')
          sys.path.insert(0,os.environ['PYTHONPATH'])
          from fi_dns_signed_grants import hostname_digest, RegionalDnsGrantError
          from fi_dns_ssh_stage import FI_RUNTIME
          from fi_routed_runtime import CONFIG, MARKER
          assert str(FI_RUNTIME)=='/opt/mnebyvpn-fi-dns-country-v2'
          assert CONFIG.name=='CountryRoutedCorefile' and MARKER.name=='country-dataplane.enable'
          label='aaaaaaaaaaaa'
          assert hostname_digest(label+'.fi.mnebyvpn.site')==hashlib.sha256(b'MNEBYVPN_COUNTRY_DNS_V1\0FI\0'+label.encode()).hexdigest()
          for bad in (label+'.fi.dns.mnebyvpn.site',label+'.dns.mnebyvpn.site',label+'.de.mnebyvpn.site'):
              try: hostname_digest(bad)
              except RegionalDnsGrantError: pass
              else: raise AssertionError('obsolete or cross-country name accepted')
          import fi_country_stage
          assert fi_country_stage.FI_RUNTIME==FI_RUNTIME
          lines=Path('.github/workflows/fi-country-private-migration.yml').read_text().splitlines()
          i=lines.index('      - name: Install corrected FI private DNS runtime and verify rollback contract')
          i=next(j for j in range(i+1,len(lines)) if lines[j]=='        run: |')+1
          body='\n'.join(line[10:] for line in lines[i:] if line.startswith('          '))+'\n'
          Path(os.environ['RUNNER_TEMP'],'fi-live.sh').write_text(body)
          PY
          PYTHONPATH="$RUNNER_TEMP/fi-country-runtime:nodekit" python3 -B nodekit/tests/test_fi_country_sni_wire.py -v
          bash -n "$RUNNER_TEMP/fi-live.sh"
          python3 -B -m py_compile nodekit/fi_country_stage.py nodekit/fi_country_transaction.py
  stage:
    needs: offline
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: node-fi
    env:
      RU_PASSWORD: ${{ secrets.SERVER188_SSH_PASSWORD }}
      DE_PASSWORD: ${{ secrets.RELAY89_SSH_PASSWORD }}
      FI_PASSWORD: ${{ secrets.MNEBYVPN_NEW_NODE_SSH_PASSWORD }}
      FI_USER: ${{ secrets.MNEBYVPN_NEW_NODE_SSH_USER }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Install corrected FI private DNS runtime and verify rollback contract
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          [[ "$FI_USER" == root && -n "$RU_PASSWORD" && -n "$DE_PASSWORD" && -n "$FI_PASSWORD" ]] || exit 2
          grep -q '^188\.120\.254\.223 ssh-ed25519 ' ops/mnebydns-owner-ssh-known_hosts
          grep -q '^89\.125\.90\.101 ssh-ed25519 ' ops/mnebydns-owner-ssh-known_hosts
          work="$RUNNER_TEMP/fi-country-stage"
          mkdir -m 0700 "$work"
          dir=''
          de() { SSHPASS="$DE_PASSWORD" sshpass -e ssh -T -F "$work/de.cfg" de-node "$@"; }
          fi_node() { SSHPASS="$FI_PASSWORD" sshpass -e ssh -T -F "$work/fi.cfg" fi-node "$@"; }
          cleanup() {
            set +e
            if [[ "$dir" =~ ^/run/fi-country-[0-9]+-[0-9]+$ ]]; then
              fi_node "rm -rf -- '$dir'" >/dev/null 2>&1 || true
            fi
            rm -rf -- "$work"
          }
          trap cleanup EXIT
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends sshpass >/dev/null
          cat > "$work/de.cfg" <<CFG
          Host de-node
            HostName 89.125.90.101
            User root
            UserKnownHostsFile $GITHUB_WORKSPACE/ops/mnebydns-owner-ssh-known_hosts
            GlobalKnownHostsFile /dev/null
            HostKeyAlgorithms ssh-ed25519
            StrictHostKeyChecking yes
            UpdateHostKeys no
            PubkeyAuthentication no
            PreferredAuthentications password
            ForwardAgent no
            ClearAllForwardings yes
            ControlMaster no
            ConnectTimeout 12
            LogLevel ERROR
          CFG
          certdir=/var/lib/mnebydns/fi-country-issued-v2
          # No FI changes if Jino DNS-01 has not yet been validated.
          available=$(de "test -s '$certdir/fullchain.pem' && test -s '$certdir/privkey.pem' && printf ready || printf pending")
          [[ "$available" == ready || "$available" == pending ]] || exit 2
          if [[ "$available" == pending ]]; then
            echo 'FI_CERT_ISSUANCE_PENDING=true'
            exit 2
          fi
          cat > "$work/ru.cfg" <<CFG
          Host ru-controller
            HostName 188.120.254.223
            User root
            UserKnownHostsFile $GITHUB_WORKSPACE/ops/mnebydns-owner-ssh-known_hosts
            GlobalKnownHostsFile /dev/null
            HostKeyAlgorithms ssh-ed25519
            StrictHostKeyChecking yes
            UpdateHostKeys no
            PubkeyAuthentication no
            PreferredAuthentications password
            ForwardAgent no
            ClearAllForwardings yes
            ControlMaster no
            ConnectTimeout 12
            LogLevel ERROR
          CFG
          SSHPASS="$RU_PASSWORD" sshpass -e ssh -T -F "$work/ru.cfg" ru-controller \
            'test -f /root/mnebyvpn-controller/fi-known_hosts && test ! -L /root/mnebyvpn-controller/fi-known_hosts && test "$(stat -c "%u:%a" /root/mnebyvpn-controller/fi-known_hosts)" = 0:600 && cat /root/mnebyvpn-controller/fi-known_hosts' > "$work/fi-known"
          python3 - "$work/fi-known" <<'PY'
          import base64,pathlib,sys
          raw=pathlib.Path(sys.argv[1]).read_bytes()
          assert len(raw)<512 and raw.count(b'\n')==1 and raw.endswith(b'\n')
          name,kind,encoded=raw.decode('ascii').strip().split()
          assert (name,kind)==('fi.mnebyvpn.site','ssh-ed25519')
          key=base64.b64decode(encoded,validate=True)
          assert len(key)==51 and key.startswith(b'\x00\x00\x00\x0bssh-ed25519\x00\x00\x00\x20')
          PY
          cat > "$work/fi.cfg" <<CFG
          Host fi-node
            HostName 217.11.167.91
            User root
            HostKeyAlias fi.mnebyvpn.site
            UserKnownHostsFile $work/fi-known
            GlobalKnownHostsFile /dev/null
            HostKeyAlgorithms ssh-ed25519
            StrictHostKeyChecking yes
            UpdateHostKeys no
            PubkeyAuthentication no
            PreferredAuthentications password
            ForwardAgent no
            ClearAllForwardings yes
            ControlMaster no
            ConnectTimeout 12
            LogLevel ERROR
          CFG
          SSHPASS="$DE_PASSWORD" sshpass -e scp -F "$work/de.cfg" \
            "de-node:$certdir/fullchain.pem" "$work/fullchain.pem"
          SSHPASS="$DE_PASSWORD" sshpass -e scp -F "$work/de.cfg" \
            "de-node:$certdir/privkey.pem" "$work/privkey.pem"
          chmod 0600 "$work/fullchain.pem" "$work/privkey.pem"
          candidate="/run/fi-country-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          [[ "$candidate" =~ ^/run/fi-country-[0-9]+-[0-9]+$ ]] || exit 2
          fi_node "umask 077; mkdir -m 0700 '$candidate'; mkdir -m 0700 '$candidate/runtime'"
          dir="$candidate"
          python3 -B nodekit/fi_country_build.py nodekit "$work/runtime"
          cp nodekit/fi_country_stage.py nodekit/fi_country_transaction.py nodekit/systemd/fi-country/mnebyvpn-fi-dns-country.service "$work/"
          chmod 0600 "$work/"*.py "$work/"*.service
          SSHPASS="$FI_PASSWORD" sshpass -e scp -F "$work/fi.cfg" \
            "$work/"*.py "$work/"*.pem "$work/"*.service "fi-node:$dir/"
          SSHPASS="$FI_PASSWORD" sshpass -e scp -F "$work/fi.cfg" \
            "$work/runtime/"*.py "fi-node:$dir/runtime/"
          fi_node "umask 077; chmod 0600 '$dir/'*.py '$dir/'*.pem '$dir/'*.service '$dir/runtime/'*.py; PYTHONPATH='$dir/runtime' timeout --signal=TERM --kill-after=120s 420s python3 -B '$dir/fi_country_stage.py' '$dir'"
