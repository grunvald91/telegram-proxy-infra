name: Meta v16 owner 30-minute phone canary 20261111

on:
  push:
    branches: [fix/meta-routing-quic-sni-validation]
    paths: ['.github/workflows/meta-v16-30min-live-once.yml']

permissions:
  contents: read

concurrency:
  group: mnebydns-iglite-wifi-v10-onrequest
  cancel-in-progress: false

jobs:
  run-once:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
      TEST_PEER: '185.137.178.123'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate owner-approved peer, review and window budgets
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "::add-mask::$TEST_PEER"
          test -n "$DE_PASS"
          test -s ops/mnebydns-owner-ssh-known_hosts
          python3 - <<'PY'
          import ipaddress,os
          peer=ipaddress.IPv4Address(os.environ["TEST_PEER"])
          assert peer.is_global and peer != ipaddress.IPv4Address("89.125.90.101")
          import sys
          sys.path.insert(0,"scripts")
          import meta_v15_phone_trial as ctl
          assert ctl.time_budget(1800)==(2400,2700)
          print("meta_v16_peer_validated=true")
          print("meta_v16_duration_seconds=1800")
          print("meta_v16_server_cleanup_deadline=2700s")
          PY
          python3 -m unittest discover -s scripts/tests -p test_meta_v16_30min_budget.py -v

      - name: Prepare SSH transport with pinned host identity
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! command -v sshpass >/dev/null; then
            timeout 45s sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=7 -o Acquire::https::Timeout=7 update -qq || true
            timeout 60s sudo DEBIAN_FRONTEND=noninteractive apt-get install -qq -y sshpass >/dev/null
          fi
          command -v sshpass >/dev/null

      - name: Read-only guard on DE immediately before launch
        shell: bash
        run: |
          set -Eeuo pipefail
          export SSHPASS="$DE_PASS"
          opts=(-T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes
            -o HostKeyAlgorithms=ssh-ed25519
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts"
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR)
          tar -C scripts -cf - meta_v16_readonly_preflight.py meta_v15_phone_trial.py \
            meta_v15_receive_window.py mnebydns_iglite_route_only_v11.py \
            mnebydns_iglite_wifi_multi_meta_v10_w20.py mnebydns_iglite_sni_observer.py |
            sshpass -e ssh "${opts[@]}" root@89.125.90.101 \
            'set -Eeuo pipefail; umask 077; d=$(mktemp -d /tmp/mneby-v16-phone-preflight.XXXXXXXX); trap '\''rm -rf -- "$d"'\'' EXIT; tar -xf - -C "$d"; python3 "$d/meta_v16_readonly_preflight.py"' |
            tee "$RUNNER_TEMP/meta-v16-preflight.log"
          grep -Fqx 'meta_v16_preflight_ready=true' "$RUNNER_TEMP/meta-v16-preflight.log"

      - name: Stage reviewed phone receiver and reversible exact-host routes
        shell: bash
        run: |
          set -Eeuo pipefail
          export SSHPASS="$DE_PASS"
          opts=(-T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes
            -o HostKeyAlgorithms=ssh-ed25519
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts"
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR)
          tar -C scripts -cf - meta_v15_phone_trial.py meta_v15_receive_window.py \
            mnebydns_iglite_route_only_v11.py mnebydns_iglite_wifi_multi_meta_v10_w20.py \
            mnebydns_iglite_sni_observer.py mnebydns_iglite_dns_wire_checks.py \
            mnebydns_iglite_wifi_readiness_helpers.py mnebydns-owner-domain-render-20261110.py |
            sshpass -e ssh "${opts[@]}" root@89.125.90.101 \
            'set -eu; test ! -e /var/lib/mneby-meta-v15-controller; umask 077; mkdir -p -m 700 /usr/local/libexec/mneby-meta-v15; tar -xf - -C /usr/local/libexec/mneby-meta-v15'

      - name: Run owner-approved 1800-second canary and verify cleanup
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "::add-mask::$TEST_PEER"
          export SSHPASS="$DE_PASS"
          opts=(-T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes
            -o HostKeyAlgorithms=ssh-ed25519
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts"
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR)
          echo '### Meta TCP/443 peer-scoped canary, 1800 seconds after READY' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          timeout 2660s sshpass -e ssh "${opts[@]}" root@89.125.90.101 \
            "MNEBY_META_V15_APPROVED=YES MNEBY_META_V15_RUN_ID=$GITHUB_RUN_ID python3 -u /usr/local/libexec/mneby-meta-v15/meta_v15_phone_trial.py live --duration 1800 --peer $TEST_PEER" |
            tee "$RUNNER_TEMP/meta-v16-live.log" "$GITHUB_STEP_SUMMARY"
          grep -Fqx 'iglite_v11_30min_window=READY' "$RUNNER_TEMP/meta-v16-live.log"
          grep -Fqx 'meta_v15_cleanup=VERIFIED' "$RUNNER_TEMP/meta-v16-live.log"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Always try independently owned recovery, even after an SSH failure
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$DE_PASS"
          export SSHPASS="$DE_PASS"
          opts=(-T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes
            -o HostKeyAlgorithms=ssh-ed25519
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts"
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR)
          sshpass -e ssh "${opts[@]}" root@89.125.90.101 \
            "if test -f /var/lib/mneby-meta-v15-controller/owner && test \"\$(cat /var/lib/mneby-meta-v15-controller/owner)\" = '$GITHUB_RUN_ID'; then python3 /usr/local/libexec/mneby-meta-v15/meta_v15_phone_trial.py rollback; fi"
          echo 'meta_v16_final_cleanup_command=ATTEMPTED' >> "$GITHUB_STEP_SUMMARY"
