name: MNEBYDNS live 91 Google plus Claude DNS audit (read-only)
on:
  push:
    branches: ['feature/mnebydns-claude-google-combined-30m-20261109']
    paths: ['.github/workflows/mnebydns-live-63-ip-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      FOREIGN_PASSWORD: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: grunvald91/Mnebyvpn
          ref: 0dbe6e4e35c2923228c250bf6cfc870ce71198d6
          path: vpn
          persist-credentials: false
      - name: Read current 91 exact-host public DNS answers over authenticated DoT
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import importlib.util, socket, concurrent.futures
          from pathlib import Path
          def load(name,path):
              spec=importlib.util.spec_from_file_location(name,Path(path))
              assert spec and spec.loader
              m=importlib.util.module_from_spec(spec)
              spec.loader.exec_module(m)
              return m
          route=load('route','scripts/mnebydns-four-google-canary.py')
          dns=load('dns','vpn/ops/smart-dns-poc/probe-gemini-canary.py')
          expected='89.125.90.101'
          assert route.FOREIGN==expected
          assert len(route.HOSTS)==91 and len(set(route.HOSTS))==91
          assert len(route.DYNAMIC_SUFFIXES)==23
          def check(host):
              try:
                  code,number,rows=dns.query(host,1,expected,853,'dns.mnebyvpn.site',None)
                  addresses=[socket.inet_ntoa(data) for rr,ttl,data in rows if rr==1]
                  return host,(code==0 and addresses==[expected]),addresses,code
              except Exception as exc:
                  return host,False,[],type(exc).__name__
          with concurrent.futures.ThreadPoolExecutor(max_workers=10) as pool:
              results=list(pool.map(check,(*route.HOSTS,'gemini.google.com',
                        'dynamic-1.google.com','dynamic-1.googleapis.com',
                        'dynamic-1.google-analytics.com','dynamic-1.doubleclick.net',
                        'sub.dynamic.claude.ai','sub.dynamic.claude.com',
                        'sub.dynamic.anthropic.com','sub.dynamic.claudeusercontent.com',
                        'sub.dynamic.claudemcpcontent.com','sub.dynamic.claude.app')))
          total=len(results); good=sum(ok for _,ok,_,_ in results)
          for host,ok,addresses,code in results:
              print(f'domain={host} german_ip_returned={str(ok).lower()} answer={",".join(addresses) or "NONE"} status={code}',flush=True)
          print('exact_candidate_hosts_rewritten='+str(sum(ok for _,ok,_,_ in results[:91]))+'/91',flush=True)
          print(f'gemini_base_also_rewritten={str(results[91][1]).lower()}',flush=True)
          print(f'all_102_dns_checks_pass={str(good==total).lower()}',flush=True)
          if good!=total:raise SystemExit(2)
          # Android push, unrelated domains must NOT be falsely routed by synthetic DNS.
          for host in ('example.org',):
              code,count,rows=dns.query(host,1,expected,853,'dns.mnebyvpn.site',None)
              ips=[socket.inet_ntoa(data) for rr,ttl,data in rows if rr==1]
              if expected in ips:raise AssertionError('unexpected_synthetic_domain='+host)
              print('non_target_direct='+host,flush=True)
          print('public_DoT_certificate_validated=yes',flush=True)
          PY
      - name: Read-only check exact live Nginx and DNS snapshot vs timed 91-host Google Claude configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$FOREIGN_PASSWORD"
          sudo apt-get update -qq
          sudo apt-get install -qq -y sshpass
          export SSHPASS="$FOREIGN_PASSWORD"
          sshpass -e ssh -o ConnectTimeout=12 -o LogLevel=ERROR -o StrictHostKeyChecking=accept-new root@89.125.90.101 'python3 -' <<'PY'
          import pathlib,subprocess
          base=pathlib.Path('/opt/mnebydns-googlepilot-backups/42533155025')
          for name,path in (('nginx','/etc/nginx/nginx.conf'),('dns','/opt/mnebydns-dot/Corefile')):
              current=pathlib.Path(path).read_bytes()
              pilot=base/(name+'.pilot')
              before=base/(name+'.before')
              state=('PILOT' if pilot.is_file() and pilot.read_bytes()==current else
                     'BASELINE' if before.is_file() and before.read_bytes()==current else 'OTHER')
              print(f'live_{name}_state={state}',flush=True)
              if state!='PILOT':raise SystemExit('combined pilot not active')
          for unit in ('mnebydns-googlepilot.service','mnebydns-dot.service',
                       'mnebydns-four-google-watchdog-42533155025.timer'):
              p=subprocess.run(['systemctl','is-active',unit],capture_output=True,text=True,timeout=6)
              print('unit_'+unit+'='+p.stdout.strip(),flush=True)
              if p.returncode:raise SystemExit('required 91-host live service or watchdog inactive: '+unit)
          print('remote_state_readonly=yes',flush=True)
          PY
