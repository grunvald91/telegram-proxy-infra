name: FI217 isolated CoreDNS regional TLS/DoT origin E2E (no public listener)
# Re-run once using isolated .invalid A response to separate TLS from upstream.
# Fail with a non-secret diagnostic code for TCP, TLS or DNS response phase.
"on":
  pull_request:
    branches: [main]
    paths:
      - nodekit/fi_dns_origin_canary.py
      - nodekit/tests/test_fi_dns_origin_canary.py
      - .github/workflows/fi-dns-origin-local-canary.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/fi-dns-origin-local-canary.yml
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: mnebyvpn-fleet-fi
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify local canary invariants without SSH
        run: |
          set -Eeuo pipefail
          python3 -m py_compile nodekit/fi_dns_origin_canary.py
          python3 -m unittest discover -s nodekit/tests -p 'test_fi_dns_origin_canary.py' -v
          # Parse the EXACT live Bash step before any SSH/network changes.
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('.github/workflows/fi-dns-origin-local-canary.yml').read_text().splitlines()
          target='      - name: Verify pinned RU and FI host keys and run temporary loopback DoT'
          i=lines.index(target)
          i=next(j for j in range(i+1,len(lines)) if lines[j]=='        run: |')+1
          rows=[]
          for line in lines[i:]:
              if line and not line.startswith('          '):
                  break
              rows.append(line[10:] if line.startswith('          ') else '')
          assert rows and 'trap cleanup EXIT' in rows
          Path('/tmp/fi-dns-origin-live-parse.sh').write_text('\n'.join(rows)+'\n')
          PY
          bash -n /tmp/fi-dns-origin-live-parse.sh
          rm -f /tmp/fi-dns-origin-live-parse.sh
  private-canary:
    needs: offline
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: node-fi
    env:
      RU_PASSWORD: ${{ secrets.SERVER188_SSH_PASSWORD }}
      FI_PASSWORD: ${{ secrets.MNEBYVPN_NEW_NODE_SSH_PASSWORD }}
      FI_USER: ${{ secrets.MNEBYVPN_NEW_NODE_SSH_USER }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify pinned RU and FI host keys and run temporary loopback DoT
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          [[ "$FI_USER" == root && -n "$RU_PASSWORD" && -n "$FI_PASSWORD" ]] || exit 2
          grep -q '^188\.120\.254\.223 ssh-ed25519 ' ops/mnebydns-owner-ssh-known_hosts
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends sshpass >/dev/null
          work="$RUNNER_TEMP/fi-dns-canary"
          mkdir -m 0700 "$work"
          cat > "$work/ru.cfg" <<CFG
          Host ru-controller
            HostName 188.120.254.223
            User root
            UserKnownHostsFile $GITHUB_WORKSPACE/ops/mnebydns-owner-ssh-known_hosts
            GlobalKnownHostsFile /dev/null
            HostKeyAlgorithms ssh-ed25519
            StrictHostKeyChecking yes
            UpdateHostKeys no
            PubkeyAuthentication no
            PreferredAuthentications password
            ForwardAgent no
            ClearAllForwardings yes
            ControlMaster no
            ConnectTimeout 12
            LogLevel ERROR
          CFG
          SSHPASS="$RU_PASSWORD" sshpass -e ssh -T -F "$work/ru.cfg" ru-controller \
            'test -f /root/mnebyvpn-controller/fi-known_hosts && test ! -L /root/mnebyvpn-controller/fi-known_hosts && test "$(stat -c "%u:%a" /root/mnebyvpn-controller/fi-known_hosts)" = 0:600 && cat /root/mnebyvpn-controller/fi-known_hosts' > "$work/fi-known"
          python3 - "$work/fi-known" <<'PY'
          import base64,pathlib,sys
          data=pathlib.Path(sys.argv[1]).read_bytes()
          assert len(data)<512 and data.count(b'\n')==1 and data.endswith(b'\n')
          name,kind,key=data.decode('ascii').strip().split()
          assert (name,kind)==('fi.mnebyvpn.site','ssh-ed25519')
          raw=base64.b64decode(key,validate=True)
          assert len(raw)==51 and raw.startswith(b'\x00\x00\x00\x0bssh-ed25519\x00\x00\x00\x20')
          PY
          cat > "$work/fi.cfg" <<CFG
          Host fi-node
            HostName 217.11.167.91
            User root
            HostKeyAlias fi.mnebyvpn.site
            UserKnownHostsFile $work/fi-known
            GlobalKnownHostsFile /dev/null
            HostKeyAlgorithms ssh-ed25519
            StrictHostKeyChecking yes
            UpdateHostKeys no
            PubkeyAuthentication no
            PreferredAuthentications password
            ForwardAgent no
            ClearAllForwardings yes
            ControlMaster no
            ConnectTimeout 12
            LogLevel ERROR
          CFG
          fi_node() { SSHPASS="$FI_PASSWORD" sshpass -e ssh -T -F "$work/fi.cfg" fi-node "$@"; }
          dir=''
          cleanup() {
            set +e
            if [[ "$dir" =~ ^/run/fi-dns-origin-canary\.[A-Za-z0-9]{8}$ ]]; then
              fi_node "rm -rf -- '$dir'" >/dev/null 2>&1 || true
            fi
            rm -rf "$work"
          }
          trap cleanup EXIT
          dir=$(fi_node 'umask 077; mktemp -d /run/fi-dns-origin-canary.XXXXXXXX')
          [[ "$dir" =~ ^/run/fi-dns-origin-canary\.[A-Za-z0-9]{8}$ ]] || exit 2
          SSHPASS="$FI_PASSWORD" sshpass -e scp -F "$work/fi.cfg" \
            nodekit/fi_dns_origin_canary.py "fi-node:$dir/"
          fi_node "timeout --signal=TERM --kill-after=8s 80s python3 '$dir/fi_dns_origin_canary.py'"
          echo 'FI_ORIGIN_LOCAL_E2E_COMPLETED=true'
          echo 'FI_PUBLIC_853_UNCHANGED=true'
          echo 'FI_AWG_UNCHANGED=true'
