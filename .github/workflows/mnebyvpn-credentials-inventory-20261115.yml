name: MNEBYVPN credentials backup source inventory read-only
on:
  push:
    branches: [restore/mnebydns-youtube-morning-20261115]
    paths: ['.github/workflows/mnebyvpn-credentials-inventory-20261115.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      RU_PASS: ${{ secrets.SERVER188_SSH_PASSWORD }}
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Inspect only credential and domain file presence and DB table names
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sshpass >/dev/null
          opts=(-T -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts"
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o ConnectTimeout=12 -o LogLevel=ERROR)
          for role in RU DE; do
            if [ "$role" = RU ];then ip=188.120.254.223;pass="$RU_PASS";else ip=89.125.90.101;pass="$DE_PASS";fi
            SSHPASS="$pass" sshpass -e ssh "${opts[@]}" "root@$ip" "python3 - $role" <<'PY'
          import os,sys,pathlib,subprocess,json
          role=sys.argv[1]
          def emit(k,v):print("CREDINV_"+role+"_"+k+"="+json.dumps(v,sort_keys=True),flush=True)
          roots=['/etc/wireguard','/etc/letsencrypt/live','/etc/letsencrypt/archive','/etc/mnebydns',
                 '/opt/mnebydns-dot','/etc/xray','/etc/mtg','/etc/telemt',
                 '/opt/mnebyvpn/bot','/opt/mnebyvpn/service','/opt/mnebyvpn',
                 '/var/lib/wireguard','/var/backups/mnebyvpn-sealed']
          def safe_list(path):
            p=pathlib.Path(path)
            if not p.exists():return []
            if path=='/opt/mnebyvpn':
              return [{'name':q.name,'isdir':q.is_dir()} for q in list(p.iterdir())[:60]]
            if path in ('/etc/letsencrypt/archive','/etc/letsencrypt/live'):
              return [{'name':q.name,'isdir':q.is_dir()} for q in list(p.iterdir())[:65]]
            if path in ('/etc/mnebydns','/opt/mnebyvpn/bot'):
              return [{'name':q.name,'isdir':q.is_dir()} for q in list(p.iterdir())[:70]]
            return [{'name':q.name,'isdir':q.is_dir()} for q in list(p.iterdir())[:45]] if p.is_dir() else [{'name':p.name,'isdir':False}]
          emit("ROOTS",{p:safe_list(p) for p in roots})
          if pathlib.Path('/opt/mnebydns-dot/Corefile').is_file():
            txt=pathlib.Path('/opt/mnebydns-dot/Corefile').read_text(errors='replace')
            emit('DNS_TEMPLATE_COUNT',txt.count('template IN A '))
          for path in ('/etc/wireguard/tg-relay.conf','/opt/mnebyvpn/bot/web.env','/etc/xray/config.json'):
            p=pathlib.Path(path)
            emit('EXISTS_'+p.name,bool(p.is_file()))
          try:
            t=subprocess.run(['docker','exec','mnebyvpn-stage-postgres','psql','-XAt',
               '-U','mnebyvpn_stage','-d','mnebyvpn_stage','-c',
               "SELECT tablename FROM pg_tables WHERE schemaname='public' ORDER BY tablename;"],
               capture_output=True,text=True,timeout=13)
            emit('POSTGRES_TABLES',t.stdout.splitlines()[:130] if t.returncode==0 else [])
            emit('POSTGRES_OK',t.returncode==0)
          except Exception:emit('POSTGRES_OK',False)
          emit('READONLY',True)
          PY
          done
