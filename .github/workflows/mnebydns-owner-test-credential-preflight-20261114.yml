name: MNEBYDNS owner personal key preflight for 24h trial (no writes)
on:
  push:
    branches: [feat/mnebydns-owner-personal-test-key-20261114]
    paths: ['.github/workflows/mnebydns-owner-test-credential-preflight-20261114.yml']
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      RU_PASS: ${{ secrets.SERVER188_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect SQL NOT NULL columns and owner private Telegram chat without logging secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$RU_PASS"
          test -s ops/mnebydns-owner-ssh-known_hosts
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass >/dev/null
          export SSHPASS="$RU_PASS"
          sshpass -e ssh -T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR \
            root@188.120.254.223 'python3 -' <<'PY'
          import pathlib,re,urllib.request,json,subprocess
          env={}
          for line in pathlib.Path('/opt/mnebyvpn/bot/web.env').read_text().splitlines():
              if line.strip() and not line.lstrip().startswith('#') and '=' in line:
                  key,value=line.split('=',1)
                  if key in ['DNS_ADMIN_TELEGRAM_ID','SUPPORT_TELEGRAM_OPERATOR_ID','TELEGRAM_TOKEN_BOT']:
                      env[key]=value.strip().strip('"').strip("'")
          owner=env.get('DNS_ADMIN_TELEGRAM_ID') or env.get('SUPPORT_TELEGRAM_OPERATOR_ID','')
          token=env.get('TELEGRAM_TOKEN_BOT','')
          assert re.fullmatch('[1-9][0-9]{0,15}',owner)
          assert re.fullmatch('[0-9]{5,20}:[A-Za-z0-9_-]{25,}',token)
          payload=json.dumps({'chat_id':int(owner)}).encode()
          req=urllib.request.Request('https://api.telegram.org/bot'+token+'/getChat',
                data=payload,headers={'Content-Type':'application/json'})
          try:
              with urllib.request.urlopen(req,timeout=12) as f:
                  response=json.load(f)
              print('OWNER_TELEGRAM_BOT_GETCHAT='+('PASS' if response.get('ok') is True and response.get('result',{}).get('type')=='private' else 'NOT_READY'))
          except Exception as exc:
              print('OWNER_TELEGRAM_BOT_GETCHAT_ERROR_CLASS='+type(exc).__name__)
          PY
          sshpass -e ssh -T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR \
            root@188.120.254.223 'docker exec mnebyvpn-stage-postgres sh -ceu '\''PGPASSWORD="$POSTGRES_PASSWORD" psql -XAt -v ON_ERROR_STOP=1 -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "
               SELECT '\''ORDERS_REQUIRED='\'' || COALESCE(string_agg(column_name,'\'', '\'' ORDER BY ordinal_position),'\''none'\'')
                FROM information_schema.columns WHERE table_schema='\''public'\'' AND table_name='\''orders'\''
                   AND is_nullable='\''NO'\'' AND column_default IS NULL;
               SELECT '\''ENTITLEMENTS_REQUIRED='\'' || COALESCE(string_agg(column_name,'\'', '\'' ORDER BY ordinal_position),'\''none'\'')
                FROM information_schema.columns WHERE table_schema='\''public'\'' AND table_name='\''entitlements'\''
                   AND is_nullable='\''NO'\'' AND column_default IS NULL;
               SELECT '\''TRIAL_STATE_ALLOWED='\'' || count(*)::text FROM pg_constraint c
                   JOIN pg_class t ON t.oid=c.conrelid
                  WHERE t.relname='\''orders'\'' AND pg_get_constraintdef(c.oid) LIKE '\''%TRIAL%'\'';
               SELECT '\''PGCRYPTO_SHA_READY='\'' || (to_regprocedure('\''sha256(bytea)'\'') IS NOT NULL)::text;
              "'\''' | grep -E '^(ORDERS_REQUIRED|ENTITLEMENTS_REQUIRED|TRIAL_STATE_ALLOWED|PGCRYPTO_SHA_READY)='
          echo 'OWNER_TEST_PREFLIGHT_WRITE_COUNT=0'
