name: Operator authorized VPN active test keys reapply and deadline resync
on:
  push:
    branches: [ops/reapply-vpn-ntp-expiry-20261108]
    paths: [.github/workflows/mnebyvpn-manual-expiry-reapply.yml]
permissions:
  contents: read
concurrency:
  group: mnebyvpn-live-node-worker-main
  cancel-in-progress: false
jobs:
  resync:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      SSH_PASSWORD: ${{ secrets.SERVER188_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Resync bounded two testing entitlements through normal signed worker
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$SSH_PASSWORD"
          python3 -m py_compile scripts/mnebyvpn-manual-expiry-reapply-20261108.py
          sudo apt-get update -qq
          sudo apt-get install -qq -y sshpass
          export SSHPASS="$SSH_PASSWORD"
          opts=(-o ConnectTimeout=12 -o StrictHostKeyChecking=accept-new -o LogLevel=ERROR)
          sshpass -e ssh "${opts[@]}" root@188.120.254.223 \
            'python3 -' < scripts/mnebyvpn-manual-expiry-reapply-20261108.py
