name: FI Smart DNS final live readiness (read-only)
"on":
  pull_request:
    paths: [".github/workflows/fi-dns-final-live-readiness.yml"]
  push:
    branches: [main]
    paths: [".github/workflows/fi-dns-final-live-readiness.yml"]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: mnebyvpn-fleet-fi
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify exact read-only live Bash syntax
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('.github/workflows/fi-dns-final-live-readiness.yml').read_text().splitlines()
          i=lines.index('      - name: Verify pinned hosts and inspect live deployment gates')
          i=next(j for j in range(i+1,len(lines)) if lines[j]=='        run: |')+1
          rows=[]
          for line in lines[i:]:
              if line and not line.startswith('          '): break
              rows.append(line[10:] if line.startswith('          ') else '')
          text='\n'.join(rows)+'\n'
          assert 'BEGIN READ ONLY' in text and 'StrictHostKeyChecking yes' in text
          Path('/tmp/fi-live-readiness.sh').write_text(text)
          PY
          bash -n /tmp/fi-live-readiness.sh
  live-readiness:
    needs: offline
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: node-fi
    env:
      RU_PASSWORD: ${{ secrets.SERVER188_SSH_PASSWORD }}
      FI_PASSWORD: ${{ secrets.MNEBYVPN_NEW_NODE_SSH_PASSWORD }}
      FI_USER: ${{ secrets.MNEBYVPN_NEW_NODE_SSH_USER }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify pinned hosts and inspect live deployment gates
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          [[ "$FI_USER" == root && -n "$RU_PASSWORD" && -n "$FI_PASSWORD" ]] || exit 2
          grep -q '^188\.120\.254\.223 ssh-ed25519 ' ops/mnebydns-owner-ssh-known_hosts
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends sshpass >/dev/null
          work="$RUNNER_TEMP/fi-dns-canary"
          mkdir -m 0700 "$work"
          cat > "$work/ru.cfg" <<CFG
          Host ru-controller
            HostName 188.120.254.223
            User root
            UserKnownHostsFile $GITHUB_WORKSPACE/ops/mnebydns-owner-ssh-known_hosts
            GlobalKnownHostsFile /dev/null
            HostKeyAlgorithms ssh-ed25519
            StrictHostKeyChecking yes
            UpdateHostKeys no
            PubkeyAuthentication no
            PreferredAuthentications password
            ForwardAgent no
            ClearAllForwardings yes
            ControlMaster no
            ConnectTimeout 12
            LogLevel ERROR
          CFG
          SSHPASS="$RU_PASSWORD" sshpass -e ssh -T -F "$work/ru.cfg" ru-controller \
            'test -f /root/mnebyvpn-controller/fi-known_hosts && test ! -L /root/mnebyvpn-controller/fi-known_hosts && test "$(stat -c "%u:%a" /root/mnebyvpn-controller/fi-known_hosts)" = 0:600 && cat /root/mnebyvpn-controller/fi-known_hosts' > "$work/fi-known"
          python3 - "$work/fi-known" <<'PY'
          import base64,pathlib,sys
          data=pathlib.Path(sys.argv[1]).read_bytes()
          assert len(data)<512 and data.count(b'\n')==1 and data.endswith(b'\n')
          name,kind,key=data.decode('ascii').strip().split()
          assert (name,kind)==('fi.mnebyvpn.site','ssh-ed25519')
          raw=base64.b64decode(key,validate=True)
          assert len(raw)==51 and raw.startswith(b'\x00\x00\x00\x0bssh-ed25519\x00\x00\x00\x20')
          PY
          cat > "$work/fi.cfg" <<CFG
          Host fi-node
            HostName 217.11.167.91
            User root
            HostKeyAlias fi.mnebyvpn.site
            UserKnownHostsFile $work/fi-known
            GlobalKnownHostsFile /dev/null
            HostKeyAlgorithms ssh-ed25519
            StrictHostKeyChecking yes
            UpdateHostKeys no
            PubkeyAuthentication no
            PreferredAuthentications password
            ForwardAgent no
            ClearAllForwardings yes
            ControlMaster no
            ConnectTimeout 12
            LogLevel ERROR
          CFG
          fi_node() { SSHPASS="$FI_PASSWORD" sshpass -e ssh -T -F "$work/fi.cfg" fi-node "$@"; }
          # Only fixed, read-only queries. No file transfer, key reads, database
          # writes, service restart or port/firewall modifications.
          SSHPASS="$RU_PASSWORD" sshpass -e ssh -T -F "$work/ru.cfg" ru-controller 'python3 -' <<'PY'
          import pathlib, subprocess
          def query(sql):
              p=subprocess.run(['docker','exec','mnebyvpn-stage-postgres','psql','-AtX','-v','ON_ERROR_STOP=1','-U','mnebyvpn_stage','-d','mnebyvpn_stage','-c','BEGIN READ ONLY; '+sql+'; ROLLBACK;'],capture_output=True,text=True,timeout=10)
              rows=[x for x in p.stdout.splitlines() if x not in ('BEGIN','ROLLBACK')]
              return rows[0] if p.returncode==0 and len(rows)==1 else 'unavailable'
          for name,sql in {
              'ru_meter_schema':"SELECT to_regprocedure('public.fi_dns_meter_apply(text,uuid,text)') IS NOT NULL",
              'ru_verified_rpc_schema':"SELECT to_regprocedure('public.fi_dns_meter_verified_apply(text,uuid,text,text,text,timestamptz)') IS NOT NULL",
              'ru_snapshot_schema':"SELECT to_regprocedure('public.fi_dns_snapshot_next()') IS NOT NULL",
              'fi_enrolled':"SELECT EXISTS(SELECT 1 FROM vpn_node_enrollment_inventory WHERE node_id='fi-test-01' AND status='enrolled')",
              'fi_meter_enabled':"SELECT COALESCE((SELECT enabled FROM fi_dns_meter_gate WHERE singleton),false)",
              'fi_region_has_grants':"SELECT EXISTS(SELECT 1 FROM fi_dns_regional_credentials WHERE revoked_at IS NULL)",
              'fi_has_eligible_paid_profile':"""
                  SELECT EXISTS (
                      SELECT 1 FROM personal_dns_credentials c
                      JOIN entitlements e ON e.id=c.entitlement_id
                      JOIN orders o ON o.id=e.source_order_id AND o.account_id=e.account_id
                      WHERE c.revoked_at IS NULL AND e.product='smart_dns' AND e.state='ACTIVE'
                        AND e.starts_at<=clock_timestamp() AND e.expires_at>clock_timestamp()
                        AND e.dns_query_quota_per_30d IS NOT NULL AND o.state='PAID'
                  )
              """
          }.items():
              try: value=query(sql)
              except Exception: value='unavailable'
              print(name+'='+ (value if value in ('t','f','unavailable') else 'unavailable'))
          runtime=pathlib.Path('/opt/mnebyvpn-controller/current')
          print('ru_controller_runtime_present='+str((runtime/'bin/node').is_file()).lower())
          for unit in ('mnebyvpn-fi-dns-meter.service','mnebyvpn-fi-dns-publisher.service'):
              print(unit+'='+str(subprocess.run(['systemctl','is-active','--quiet',unit],capture_output=True,timeout=5).returncode==0).lower())
          PY
          fi_node 'for unit in mnebyvpn-fi-dns-country.service mnebyvpn-fi-public-dot.socket; do if systemctl is-active --quiet "$unit"; then printf "%s=active\n" "$unit"; else printf "%s=inactive\n" "$unit"; fi; done'
          fi_node 'python3 -' < nodekit/fi_dns_live_inventory.py
          echo 'LIVE_READINESS_READ_ONLY=true'
