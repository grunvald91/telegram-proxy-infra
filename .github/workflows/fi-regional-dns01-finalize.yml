name: FI217 country personal DNS wildcard ACME finalize (gated, no 853 changes)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fi-regional-dns01-finalize.yml']
  pull_request:
    paths: ['.github/workflows/fi-regional-dns01-finalize.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mnebyvpn-fi-regional-acme-finalize
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify exact FI DNS-01 finalize Bash and no current service publication
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('.github/workflows/fi-regional-dns01-finalize.yml').read_text().splitlines()
          marker='      - name: Finalize isolated FI wildcard certificate (staged on DE, no customer release)'
          i=lines.index(marker)
          i=next(j for j in range(i+1,len(lines)) if lines[j]=='        run: |')+1
          out=[]
          for line in lines[i:]:
              if line and not line.startswith('          '): break
              out.append(line[10:] if line.startswith('          ') else '')
          script='\n'.join(out)+'\n'
          assert "home=/var/lib/mnebydns/acme-fi-regional" in script
          assert "target=/var/lib/mnebydns/fi-regional-issued" in script
          assert "domain='*.fi.dns.mnebyvpn.site'" in script
          assert 'fi.dns.mnebyvpn.site' in script
          assert 'systemctl' not in script
          assert 'DE_FI_853_CONFIGURATION_UNCHANGED=true' in script
          Path('/tmp/fi-regional-dns01-finalize-check.sh').write_text(script)
          PY
          bash -n /tmp/fi-regional-dns01-finalize-check.sh
          rm -f /tmp/fi-regional-dns01-finalize-check.sh
  cert:
    needs: offline
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DE_PASSWORD: ${{ secrets.RELAY89_SSH_PASSWORD }}
      DNS_NAME: '_acme-challenge.fi.dns.mnebyvpn.site'
      TXT_EXPECTED: '3txpDsbozENwxUD-3rhLI7duyCPjBxPdiaKrEf-5mtI'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require DNS-01 TXT at all Jino authoritative servers before ACME
        id: txt
        shell: bash
        run: |
          set -Eeuo pipefail
          check=1
          for ns in ns1.jino.ru ns2.jino.ru ns3.jino.ru ns4.jino.ru; do
            response="$(dig +short +time=3 +tries=1 @"$ns" TXT "$DNS_NAME" || true)"
            if [[ "$response" == *"$TXT_EXPECTED"* ]]; then
              echo "AUTHORITATIVE_$ns=MATCH"
            else
              echo "AUTHORITATIVE_$ns=PENDING"
              check=0
            fi
          done
          if [[ "$check" != 1 ]]; then
            echo 'TXT_STATUS=WAITING_FOR_JINO_RECORD'
            echo 'ready=no' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'TXT_STATUS=ALL_AUTHORITATIVE_PRESENT'
          echo 'ready=yes' >> "$GITHUB_OUTPUT"
      - name: Finalize isolated FI wildcard certificate (staged on DE, no customer release)
        if: steps.txt.outputs.ready == 'yes'
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$DE_PASSWORD"
          test -s ops/mnebydns-owner-ssh-known_hosts
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass >/dev/null
          export SSHPASS="$DE_PASSWORD"
          sshpass -e ssh -T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR \
            root@89.125.90.101 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          client=/opt/mnebydns/acme-client-3.1.6/acme.sh
          home=/var/lib/mnebydns/acme-fi-regional
          target=/var/lib/mnebydns/fi-regional-issued
          [[ ! -L "$target" ]] || exit 3
          domain='*.fi.dns.mnebyvpn.site'
          test -x "$client"
          test -d "$home"
          if [[ -e "$target/fullchain.pem" || -e "$target/privkey.pem" ]]; then
            # Do not overwrite unknown or mismatched certificate material.
            [[ -f "$target/fullchain.pem" && -f "$target/privkey.pem" ]] || exit 3
            openssl x509 -in "$target/fullchain.pem" -noout -checkend 604800 >/dev/null
            openssl x509 -in "$target/fullchain.pem" -noout -ext subjectAltName |
              grep -Eq '(^|[[:space:],])DNS:\*\.fi\.dns\.mnebyvpn\.site([[:space:],]|$)'
            openssl verify -purpose sslserver -CAfile /etc/ssl/certs/ca-certificates.crt \
              -untrusted "$target/fullchain.pem" "$target/fullchain.pem" >/dev/null
            key_hash="$(openssl pkey -in "$target/privkey.pem" -pubout -outform DER | sha256sum | cut -d' ' -f1)"
            leaf_hash="$(openssl x509 -in "$target/fullchain.pem" -pubkey -noout | openssl pkey -pubin -outform DER | sha256sum | cut -d' ' -f1)"
            test "$key_hash" = "$leaf_hash"
            echo 'FI_WILDCARD_CERT_ALREADY_STAGED_AND_VALID=true'
            exit 0
          fi
          log="$(mktemp "$home/manual-finalize.XXXXXXXX")"
          chmod 600 "$log"
          set +e
          "$client" --home "$home" --renew --dns \
            -d "$domain" --server letsencrypt \
            --yes-I-know-dns-manual-mode-enough-go-ahead-please \
            >"$log" 2>&1
          rc=$?
          set -e
          if [[ $rc != 0 ]]; then
            echo 'ACME_WILDCARD_FINALIZE=FAILED'
            grep -Ei 'error|invalid|challenge|retry' "$log" | tail -n 6 | cut -c 1-180 || true
            exit 3
          fi
          install -d -m 700 "$target"
          "$client" --home "$home" --install-cert -d "$domain" \
            --key-file "$target/privkey.pem" \
            --fullchain-file "$target/fullchain.pem" \
            --reloadcmd '/bin/true' > /dev/null
          chmod 600 "$target/privkey.pem" "$target/fullchain.pem"
          openssl x509 -in "$target/fullchain.pem" -noout -ext subjectAltName |
            grep -Eq '(^|[[:space:],])DNS:\*\.fi\.dns\.mnebyvpn\.site([[:space:],]|$)'
          openssl verify -purpose sslserver -CAfile /etc/ssl/certs/ca-certificates.crt \
            -untrusted "$target/fullchain.pem" "$target/fullchain.pem" >/dev/null
          openssl x509 -in "$target/fullchain.pem" -noout \
            -checkhost 'aaaaaaaaaaaa.fi.dns.mnebyvpn.site' >/dev/null
          openssl x509 -in "$target/fullchain.pem" -noout \
            -checkhost 'bbbbbbbbbbbb.fi.dns.mnebyvpn.site' >/dev/null
          openssl x509 -in "$target/fullchain.pem" -noout -checkend 604800 >/dev/null
          key_fp="$(openssl pkey -in "$target/privkey.pem" -pubout -outform DER | sha256sum | cut -d' ' -f1)"
          cert_fp="$(openssl x509 -in "$target/fullchain.pem" -pubkey -noout | \
            openssl pkey -pubin -outform DER | sha256sum | cut -d' ' -f1)"
          test "$key_fp" = "$cert_fp"
          echo 'FI_REGIONAL_WILDCARD_CERT_CA_CHAIN_SAN_READY=true'
          echo 'FI_REGIONAL_WILDCARD_CERT_KEY_MATCH=true'
          echo 'FI_CERT_ON_DE_ONLY_NOT_YET_ON_FI=true'
          echo 'NO_PUBLIC_DNS_PUBLISHED=true'
          echo 'DE_FI_853_CONFIGURATION_UNCHANGED=true'
          REMOTE
