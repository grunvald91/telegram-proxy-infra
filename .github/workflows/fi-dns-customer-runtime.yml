name: FI217 customer DNS runtime with release closed
"on":
  pull_request:
    paths: ['nodekit/fi_dns_customer*', '.github/workflows/fi-dns-customer-runtime.yml']
  push:
    branches: [main]
    paths: ['nodekit/fi_dns_customer*', '.github/workflows/fi-dns-customer-runtime.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: mnebyvpn-fleet-fi
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Check the generated pilot and runner
        run: |
          set -euo pipefail
          bash -n nodekit/fi_dns_customer_runner.sh
          python3 -B nodekit/fi_dns_customer_build.py nodekit "$RUNNER_TEMP/fi-dns-customer"
          PYTHONPATH="$RUNNER_TEMP/fi-dns-customer:nodekit" python3 -B -c 'import fi_dns_customer_stage'
  live:
    needs: offline
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: node-fi
    env:
      RU_PASSWORD: ${{ secrets.SERVER188_SSH_PASSWORD }}
      FI_PASSWORD: ${{ secrets.MNEBYVPN_NEW_NODE_SSH_PASSWORD }}
      FI_USER: ${{ secrets.MNEBYVPN_NEW_NODE_SSH_USER }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Stage the runtime and verify the external socket still denies unknown profiles
        run: bash nodekit/fi_dns_customer_runner.sh
