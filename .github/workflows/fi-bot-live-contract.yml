name: FI live Telegram issuance contract
"on":
  pull_request:
    paths: ["nodekit/fi_bot_live_contract.mjs", ".github/workflows/fi-bot-live-contract.yml"]
  push:
    branches: [main]
    paths: ["nodekit/fi_bot_live_contract.mjs", ".github/workflows/fi-bot-live-contract.yml"]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: mnebyvpn-live-telegram-main
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: node --check nodekit/fi_bot_live_contract.mjs
  live:
    needs: offline
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: node-fi
    env:
      RU_PASSWORD: ${{ secrets.SERVER188_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Test actual bot logic with uncommitted synthetic fixture
        run: |
          set -Eeuo pipefail
          test -n "$RU_PASSWORD"
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends sshpass >/dev/null
          python3 - <<'PY'
          import os,pathlib,shlex,subprocess,re
          source=pathlib.Path("nodekit/fi_bot_live_contract.mjs").read_text()
          command="docker exec mnebyvpn-bot-info node --experimental-strip-types --input-type=module -e "+shlex.quote(source)
          env=dict(os.environ,SSHPASS=os.environ["RU_PASSWORD"])
          p=subprocess.run(["sshpass","-e","ssh","-T","-F","/dev/null","-o","StrictHostKeyChecking=yes","-o","GlobalKnownHostsFile=/dev/null","-o","HostKeyAlgorithms=ssh-ed25519","-o","UpdateHostKeys=no","-o","ForwardAgent=no","-o","ClearAllForwardings=yes","-o","ControlMaster=no","-o","PubkeyAuthentication=no","-o","PreferredAuthentications=password","-o","ConnectTimeout=12","-o","LogLevel=ERROR","-o","UserKnownHostsFile="+str(pathlib.Path("ops/mnebydns-owner-ssh-known_hosts").resolve()),"root@188.120.254.223",command],stdin=subprocess.DEVNULL,text=True,capture_output=True,env=env,timeout=100)
          for line in p.stdout.splitlines():
              if re.fullmatch(r"FI_BOT_(TEST_[A-Z_]+|LIVE_CONTRACT)=(PASS|BLOCKED:[a-z]+)",line):print(line)
          if p.returncode!=0 or "FI_BOT_LIVE_CONTRACT=PASS" not in p.stdout.splitlines():
              print("FI_BOT_REMOTE_EXIT="+str(p.returncode))
              raise SystemExit(2)
          PY
