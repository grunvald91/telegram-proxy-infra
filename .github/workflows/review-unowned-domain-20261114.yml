name: One-shot review of unowned hostname references (no production writes)
on:
  push:
    branches: ['fix/remove-unowned-domain-20261114']
    paths: ['.github/workflows/review-unowned-domain-20261114.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Search tracked code in main branches and experimental diagnostics
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'repository=telegram-proxy-infra/main'
          git fetch --quiet --depth 1 origin main
          git grep -Il -i -e myvpn origin/main -- ':!legacy-mtproxy/live-snapshot/**' | sed 's/^/matched_file=/' || true
          echo 'repository=Mnebyvpn/main'
          git clone -q --depth 1 --branch main https://github.com/grunvald91/Mnebyvpn.git /tmp/mnebyvpn-source
          git -C /tmp/mnebyvpn-source grep -Il -i -e myvpn | sed 's/^/matched_file=/' || true
          echo 'repository=telegram-proxy-infra/diagnostic-branch'
          git fetch --quiet --depth 1 origin diag/mnebyvpn-reality-dot-20261114
          git grep -Il -i -e myvpn FETCH_HEAD | sed 's/^/matched_file=/' || true
          echo 'scan_complete=true'
