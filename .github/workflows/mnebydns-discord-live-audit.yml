name: MNEBYDNS live three-Discord route reconciliation (read only)
on:
  push:
    branches: ['feature/mnebydns-multiservice-audit-20261108']
    paths: ['.github/workflows/mnebydns-discord-live-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      FOREIGN_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
      RU_PASS: ${{ secrets.SERVER188_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: grunvald91/Mnebyvpn
          ref: 0ac3cf11278fdf3ab0d912606e0c728c2b76ad2c
          path: mnebyvpn
          persist-credentials: false
      - name: Verify public strict DoT, A/AAAA/HTTPS/SVCB for Discord and untouched Gemini
        run: |
          set -euo pipefail
          python3 mnebyvpn/ops/smart-dns-poc/probe-ru-access.py \
            --ip 89.125.90.101 --port 853 --hostname dns.mnebyvpn.site
          python3 mnebyvpn/ops/smart-dns-poc/probe-gemini-canary.py \
            --ip 89.125.90.101 --port 853 --hostname dns.mnebyvpn.site
      - name: Verify active foreign sidecar without changing any service
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$FOREIGN_PASS" && test -n "$RU_PASS"
          sudo apt-get update -qq
          sudo apt-get install -qq -y sshpass
          SSHPASS="$FOREIGN_PASS" sshpass -e ssh -o ConnectTimeout=12 \
            -o StrictHostKeyChecking=accept-new -o LogLevel=ERROR root@89.125.90.101 'python3 -' <<'PY'
          import pathlib,re,subprocess
          dns=pathlib.Path('/opt/mnebydns-dot/Corefile').read_text()
          nginx=pathlib.Path('/etc/nginx/nginx.conf').read_text()
          sidecar=pathlib.Path('/etc/mnebydns-ru-access/nginx.conf').read_text()
          hosts=('discord.com','gateway.discord.gg','cdn.discordapp.com')
          for h in hosts:
              assert 'template IN A '+h+' {' in dns
              assert h+' 127.0.0.1:15446;' in nginx
              assert h+' '+h+':443;' in sidecar
              print('discord_dns_sni_active='+h)
          assert 'template IN A gemini.google.com {' in dns
          assert 'gemini.google.com 127.0.0.1:15443;' in nginx
          assert 'jnn-pa.googleapis.com' not in dns
          assert 'waa-pa.clients6.google.com' not in dns
          for svc in ('nginx','mnebydns-dot.service','mnebydns-gemini.service','mnebydns-ru-access.service','xray.service'):
              q=subprocess.run(['systemctl','is-active',svc],capture_output=True,timeout=5)
              print('service_active_'+svc+'='+str(q.returncode==0).lower())
              assert q.returncode==0
          q=subprocess.run(['nginx','-t'],capture_output=True,timeout=8)
          assert q.returncode==0
          p=subprocess.run(['ss','-H','-lnt','sport = :15446'],capture_output=True,text=True,timeout=6)
          assert '127.0.0.1:15446' in p.stdout
          q=subprocess.run(['systemctl','is-active','mnebydns-ru-access-watchdog-42467427651.timer'],capture_output=True,timeout=5)
          assert q.returncode!=0
          print('original_gemini_and_vpn_healthy=yes')
          print('last_success_watchdog_inactive=yes')
          print('no_production_changes=yes')
          PY
      - name: Confirm routing certificate from Russian VPS
        shell: bash
        run: |
          set -Eeuo pipefail
          SSHPASS="$RU_PASS" sshpass -e ssh -o ConnectTimeout=12 \
            -o StrictHostKeyChecking=accept-new -o LogLevel=ERROR root@188.120.254.223 'bash -se' <<'RUSSIAN'
          set -Eeuo pipefail
          for host in discord.com gateway.discord.gg cdn.discordapp.com gemini.google.com cdn.servgo.ru tg.servgo.ru; do
            status="$(curl --noproxy '*' -4 -sS -o /dev/null \
              --connect-timeout 6 --max-time 12 \
              --resolve "$host:443:89.125.90.101" \
              -w '%{http_code}' "https://$host/")"
            [[ -n "$status" && "$status" != 000 ]] || exit 1
            echo "russian_origin_TLS_verified=$host"
          done
          RUSSIAN
          echo "discord_and_baselines_healthy=yes"
