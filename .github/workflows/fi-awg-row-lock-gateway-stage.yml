name: FI217 AWG transactional billing row-lock gateway stage (clients off)
"on":
  push:
    branches: [main]
    paths:
      - '.github/workflows/fi-awg-row-lock-gateway-stage.yml'
      - 'nodekit/fi_awg_row_lock_gateway_stage.py'
      - 'nodekit/fi_awg_worker_preflight.sh'
      - 'nodekit/fi_awg_worker_source_stage.py'
      - 'nodekit/fi_awg_worker_isolated_source_stage.py'
      - 'nodekit/fi_awg_worker_isolated_runtime_preflight.py'
      - 'nodekit/fi_awg_worker_isolated_pg_stage.py'
      - 'nodekit/fi_awg_worker_isolated_systemd_stage.py'
      - 'nodekit/fi_awg_worker_live_db_readonly.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ru188-awg-gateway-schema-stage
  cancel-in-progress: false
jobs:
  stage:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: node-fi
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: infra
      - uses: actions/checkout@v4
        with:
          repository: grunvald91/Mnebyvpn
          ref: c73ddaa237543d91dc81fb09eb3f371389dc618d
          persist-credentials: false
          path: pinned-controller
      - name: Verify pinned AWG gateway source and run offline regression
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C pinned-controller rev-parse HEAD)" = c73ddaa237543d91dc81fb09eb3f371389dc618d
          test -s pinned-controller/db/migrations/0135_awg_worker_row_lock_gateway.sql
          python3 -m py_compile infra/nodekit/fi_awg_row_lock_gateway_stage.py
          bash -n infra/nodekit/fi_awg_worker_preflight.sh
          python3 -m py_compile infra/nodekit/fi_awg_worker_source_stage.py
          python3 -m py_compile infra/nodekit/fi_awg_worker_isolated_source_stage.py
          python3 -m py_compile infra/nodekit/fi_awg_worker_isolated_runtime_preflight.py
          python3 -m py_compile infra/nodekit/fi_awg_worker_isolated_pg_stage.py
          python3 -m py_compile infra/nodekit/fi_awg_worker_isolated_systemd_stage.py
          python3 -m py_compile infra/nodekit/fi_awg_worker_live_db_readonly.py
          python3 -m unittest discover -s infra/nodekit/tests -p 'test_fi_awg_worker_live_db_readonly.py' -v
          python3 -m unittest discover -s infra/nodekit/tests -p 'test_fi_awg_worker_isolated_systemd_stage.py' -v
          python3 -m unittest discover -s infra/nodekit/tests -p 'test_fi_awg_worker_isolated_pg_stage.py' -v
          python3 -m unittest discover -s infra/nodekit/tests -p 'test_fi_awg_worker_isolated_runtime_preflight.py' -v
          python3 -m unittest discover -s infra/nodekit/tests -p 'test_fi_awg_worker_isolated_source_stage.py' -v
          # Validate that the five pinned controller modules form a complete
          # import graph before uploading a single byte to RU188.
          PYTHONPATH=infra/nodekit python3 - <<'PY'
          import pathlib
          import fi_awg_worker_isolated_source_stage as stage
          import fi_awg_worker_source_stage as trust
          root=pathlib.Path("pinned-controller")
          blobs={rel:(root/rel).read_bytes() for rel in trust.FILES.values()}
          stage.require_source_closure(blobs)
          print("FI_AWG_PINNED_SOURCE_GRAPH=complete;MODULES=5")
          PY
          python3 -m unittest discover -s infra/nodekit/tests -p 'test_fi_awg_worker_source_stage.py' -v
          python3 -m unittest discover -s infra/nodekit/tests -p 'test_fi_awg_worker_preflight_contract.py' -v
          python3 -m unittest discover -s infra/nodekit/tests -p 'test_fi_awg_row_lock_gateway_stage.py' -v
          # Syntax check the entire live run block before connecting to RU188.
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('infra/.github/workflows/fi-awg-row-lock-gateway-stage.yml').read_text().splitlines()
          i=next(i for i,s in enumerate(lines) if s=='      - name: Stage approved row-lock SQL using existing pinned RU188 SSH')
          i=next(i for i in range(i+1,len(lines)) if lines[i]=='        run: |')+1
          script=[s[10:] for s in lines[i:] if s.startswith('          ')]
          assert script and script[-1].startswith("echo 'FI_AWG_ROW_LOCK_STAGE=")
          Path('/tmp/fi-awg-gateway-stage-parse.sh').write_text('\n'.join(script)+'\n')
          PY
          bash -n /tmp/fi-awg-gateway-stage-parse.sh
          rm -f /tmp/fi-awg-gateway-stage-parse.sh
      - name: Install temporary SSH password client
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! command -v sshpass >/dev/null; then
            sudo apt-get update -qq -o Acquire::Retries=1
            sudo apt-get install -qq -y --no-install-recommends sshpass >/dev/null
          fi
      - name: Stage approved row-lock SQL using existing pinned RU188 SSH
        shell: bash
        env:
          RU_PASSWORD: ${{ secrets.SERVER188_SSH_PASSWORD }}
        run: |
          set -Eeuo pipefail
          umask 077
          [[ -n "$RU_PASSWORD" ]] || exit 2
          grep -q '^188\.120\.254\.223 ssh-ed25519 ' infra/ops/mnebydns-owner-ssh-known_hosts
          work="$RUNNER_TEMP/fi-awg-lock-stage"
          mkdir -m 0700 "$work"
          remote=""
          cat > "$work/ssh.conf" <<CFG
          Host ru188
            HostName 188.120.254.223
            User root
            UserKnownHostsFile $GITHUB_WORKSPACE/infra/ops/mnebydns-owner-ssh-known_hosts
            GlobalKnownHostsFile /dev/null
            HostKeyAlgorithms ssh-ed25519
            StrictHostKeyChecking yes
            UpdateHostKeys no
            BatchMode no
            PasswordAuthentication yes
            PubkeyAuthentication no
            KbdInteractiveAuthentication no
            ForwardAgent no
            ClearAllForwardings yes
            ControlMaster no
            ProxyCommand none
            ConnectTimeout 12
            ServerAliveInterval 10
            ServerAliveCountMax 3
            LogLevel ERROR
          CFG
          export SSHPASS="$RU_PASSWORD"
          ru(){ sshpass -e ssh -T -F "$work/ssh.conf" ru188 "$@"; }
          cleanup(){
            set +e
            if [[ "$remote" =~ ^/run/fi-awg-row-lock\.[A-Za-z0-9]{8}$ ]]; then
              ru "rm -rf -- '$remote'" >/dev/null 2>&1
            fi
            rm -rf -- "$work"
          }
          trap cleanup EXIT
          sqlfile=pinned-controller/db/migrations/0135_awg_worker_row_lock_gateway.sql
          sha=$(sha256sum "$sqlfile" | cut -d' ' -f1)
          [[ "$sha" =~ ^[a-f0-9]{64}$ ]] || exit 2
          remote=$(ru 'umask 077; mktemp -d /run/fi-awg-row-lock.XXXXXXXX')
          [[ "$remote" =~ ^/run/fi-awg-row-lock\.[A-Za-z0-9]{8}$ ]] || exit 2
          sshpass -e scp -F "$work/ssh.conf" \
            infra/nodekit/fi_awg_row_lock_gateway_stage.py "$sqlfile" \
            "ru188:$remote/"
          ru "chmod 0600 '$remote/fi_awg_row_lock_gateway_stage.py' '$remote/0135_awg_worker_row_lock_gateway.sql'; python3 '$remote/fi_awg_row_lock_gateway_stage.py' --sql-file '$remote/0135_awg_worker_row_lock_gateway.sql' --sha256 '$sha'"
          # Stage a separate immutable source-only AWG release. The existing
          # /opt/mnebyvpn-controller/current application is never overwritten.
          export FI_STAGE_WORK="$work"
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          root=pathlib.Path("pinned-controller")
          expected="c73ddaa237543d91dc81fb09eb3f371389dc618d"
          assert subprocess.check_output(
              ["git","-C",str(root),"rev-parse","HEAD"],text=True).strip()==expected
          files={
            "awg-controller-delivery-worker.ts":"apps/service/src/awg-controller-delivery-worker.ts",
            "awg-trusted-ssh-delivery.ts":"packages/provisioning/src/awg-trusted-ssh-delivery.ts",
            "awg-offline-maintenance.ts":"packages/provisioning/src/awg-offline-maintenance.ts",
            "awg-controller-grants.ts":"packages/provisioning/src/awg-controller-grants.ts",
            "awg-controller-outbox.ts":"packages/provisioning/src/awg-controller-outbox.ts",
          }
          hashes={}
          for name,path in files.items():
              data=(root/path).read_bytes()
              assert data.endswith(b"\n") and len(data)<65536
              hashes[name]=hashlib.sha256(data).hexdigest()
          manifest={"commit":expected,"files":hashes}
          out=pathlib.Path(os.environ["FI_STAGE_WORK"])/"manifest.json"
          out.write_text(json.dumps(manifest,sort_keys=True,separators=(",",":"))+"\n")
          out.chmod(0o600)
          PY
          sshpass -e scp -F "$work/ssh.conf" \
            infra/nodekit/fi_awg_worker_source_stage.py \
            infra/nodekit/fi_awg_worker_isolated_source_stage.py \
            infra/nodekit/fi_awg_worker_isolated_runtime_preflight.py \
            infra/nodekit/fi_awg_worker_isolated_pg_stage.py \
            infra/nodekit/fi_awg_worker_isolated_systemd_stage.py \
            infra/nodekit/fi_awg_worker_live_db_readonly.py "$work/manifest.json" \
            pinned-controller/apps/service/src/awg-controller-delivery-worker.ts \
            pinned-controller/packages/provisioning/src/awg-trusted-ssh-delivery.ts \
            pinned-controller/packages/provisioning/src/awg-offline-maintenance.ts \
            pinned-controller/packages/provisioning/src/awg-controller-grants.ts \
            pinned-controller/packages/provisioning/src/awg-controller-outbox.ts \
            "ru188:$remote/"
          ru "chmod 0600 '$remote/'*; python3 '$remote/fi_awg_worker_isolated_source_stage.py' --stage '$remote'"
          # Second invocation must be idempotent and return exact 0 new / 5 matched.
          second=$(ru "python3 '$remote/fi_awg_worker_isolated_source_stage.py' --stage '$remote'")
          [[ "$second" == 'FI_AWG_ISOLATED_SOURCE=STAGED;NEW=0;MATCHED=5;MODULES=5;WORKER_STARTED=false;CUSTOMER_RELEASE=false;RUNTIME_ATTACHED=false' ]] || {
            echo 'FI_AWG_ISOLATED_SOURCE_IDEMPOTENCY=BLOCKED'; exit 2;
          }
          echo 'FI_AWG_ISOLATED_SOURCE_IDEMPOTENCY=OK'

          # Copy only the reviewed pg@8.16.3 dependency closure from the
          # installed root-owned controller into the isolated release. The
          # existing /current runtime and all client profiles remain untouched.
          ru "python3 '$remote/fi_awg_worker_isolated_pg_stage.py' --stage '$remote'"
          deps_second=$(ru "python3 '$remote/fi_awg_worker_isolated_pg_stage.py' --stage '$remote'")
          if [[ "$deps_second" =~ ^FI_AWG_ISOLATED_PG=STAGED\;NEW=0\;MATCHED=[1-9][0-9]*\;PACKAGES=[1-9][0-9]*\;WORKER_STARTED=false\;CUSTOMER_RELEASE=false$ ]]; then
            echo 'FI_AWG_ISOLATED_PG_IDEMPOTENCY=OK'
          else
            echo 'FI_AWG_ISOLATED_PG_IDEMPOTENCY=BLOCKED'
            exit 2
          fi
          # Inventory only. No module links, service override, or worker start.
          runtime_output=''
          runtime_rc=0
          runtime_output=$(ru "python3 '$remote/fi_awg_worker_isolated_runtime_preflight.py'") || runtime_rc=$?
          printf '%s\n' "$runtime_output" | grep -E '^FI_AWG_ISOLATED_RUNTIME_' || true
          runtime_complete=true
          [[ "$runtime_rc" == 0 && ${#runtime_output} -le 2048 ]] || runtime_complete=false
          for label in CONTROLLER_GATES SOURCE_MANIFEST NODE_VERSION TYPESCRIPT_SYNTAX SHARED_PG_RESOLUTION ISOLATED_ESM_IMPORT; do
            [[ $(grep -Fxc "FI_AWG_ISOLATED_RUNTIME_${label}=OK" <<< "$runtime_output" || true) == 1 ]] || runtime_complete=false
          done
          grep -Fxq 'FI_AWG_ISOLATED_RUNTIME_PREFLIGHT=READONLY_READY;WORKER_STARTED=false;CUSTOMER_RELEASE=false;RUNTIME_ATTACHED=false' <<< "$runtime_output" || runtime_complete=false
          grep -Fxq 'FI_AWG_ISOLATED_RUNTIME_ISOLATED_ESM_IMPORT=OK' <<< "$runtime_output" || runtime_complete=false
          if [[ "$runtime_complete" == true ]]; then
            echo 'FI_AWG_ISOLATED_RUNTIME_STATUS=READONLY_READY;WORKER_STARTED=false'
          else
            echo 'FI_AWG_ISOLATED_RUNTIME_STATUS=BLOCKED;WORKER_STARTED=false'
            exit 2
          fi
          # Attach only the already-reviewed, immutable source to the existing
          # stopped and disabled systemd unit. Approval marker must be absent.
          # Repeated CI installs are expected to be strictly idempotent.
          ru "python3 '$remote/fi_awg_worker_isolated_systemd_stage.py'"
          systemd_second=$(ru "python3 '$remote/fi_awg_worker_isolated_systemd_stage.py'")
          [[ "$systemd_second" == 'FI_AWG_ISOLATED_SYSTEMD=STAGED;DROPIN=UNCHANGED;UNIT_ENABLED=false;WORKER_STARTED=false;CUSTOMER_RELEASE=false' ]] || {
            echo 'FI_AWG_ISOLATED_SYSTEMD_IDEMPOTENCY=BLOCKED'; exit 2;
          }
          echo 'FI_AWG_ISOLATED_SYSTEMD_IDEMPOTENCY=OK'
          # The 13 static preactivation checks do not establish actual
          # restricted PostgreSQL login over Node.js pg from isolated source.
          # Probe that exact DB connection in a READ ONLY transaction.
          db_output=''
          db_rc=0
          db_output=$(ru "python3 '$remote/fi_awg_worker_live_db_readonly.py'") || db_rc=$?
          printf '%s\n' "$db_output" | grep -E '^FI_AWG_DB_' || true
          if [[ "$db_rc" == 0 && "$db_output" == *'FI_AWG_DB_CONNECTION=PASS'* &&
                "$db_output" == *'FI_AWG_DB_RELEASE_DISABLED=PASS'* &&
                "$db_output" == *'FI_AWG_DB_PROBE=READONLY_READY'* ]]; then
            echo 'FI_AWG_ACTUAL_DB_ROLE=READONLY_READY;WORKER_STARTED=false'
          else
            echo 'FI_AWG_ACTUAL_DB_ROLE=BLOCKED;WORKER_STARTED=false'
            exit 2
          fi
          ru 'set -eu; ! systemctl is-active --quiet mnebyvpn-awg-delivery.service'
          # Read-only diagnostics may find missing worker components; do not
          # treat these as a failed SQL migration or open customer access.
          preflight=''
          audit_rc=0
          preflight=$(ru 'bash -se' < infra/nodekit/fi_awg_worker_preflight.sh) || audit_rc=$?
          # Only bounded, fixed-format status fields from the root-only audit.
          printf '%s\n' "$preflight" | grep -E '^FI_AWG_PREFLIGHT' || true
          audit_complete=true
          [[ "$audit_rc" == 0 && ${#preflight} -le 4096 ]] || audit_complete=false
          for label in HOST CONTROLLER_IDENTITY FI_NODE_IDENTITY CANONICAL_WORKER_ENV SIGNER_PRIVATE_KEY FORCED_SSH_TRANSPORT POSTGRES_GATEWAY_AND_RELEASE SERVICE_UNIT WORKER_SOURCE WORKER_RUNTIME APPROVAL_NOT_PRESENT WORKER_INACTIVE WORKER_NOT_ENABLED; do
            [[ $(grep -Fxc "FI_AWG_PREFLIGHT_${label}=OK" <<< "$preflight" || true) == 1 ]] || audit_complete=false
          done
          grep -Fxq 'FI_AWG_PREFLIGHT=PREACTIVATION_READY;WORKER_STARTED=false;CUSTOMER_RELEASE=false' <<< "$preflight" || audit_complete=false
          if [[ "$audit_complete" == true ]]; then
            echo 'FI_AWG_WORKER_PREFLIGHT_STATUS=ready;AWG_WORKER_STARTED=false'
          else
            echo 'FI_AWG_WORKER_PREFLIGHT_STATUS=blocked;AWG_WORKER_STARTED=false'
            exit 2
          fi
          echo 'FI_AWG_ROW_LOCK_STAGE=complete;AWG_WORKER_STARTED=false;SUBSCRIPTIONS_PUBLISHED=false'
