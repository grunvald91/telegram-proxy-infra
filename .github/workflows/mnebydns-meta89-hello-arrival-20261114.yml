name: MNEBYDNS Meta 17 families full ClientHello capture foreign 89 only read-only
on:
  push:
    branches: [diag/mnebydns-outage-20261114]
    paths:
      - '.github/workflows/mnebydns-meta89-hello-arrival-20261114.yml'
      - 'scripts/mnebydns-meta89-clienthello-completeness-20261114.py'
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DE_PASS: \${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Validate exact host set and packet parser, prepare foreign-only pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/mnebydns-meta89-clienthello-completeness-20261114.py
          python3 scripts/mnebydns-meta89-clienthello-completeness-20261114.py selftest
          test -n "$DE_PASS" && test -s ops/mnebydns-owner-ssh-known_hosts
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sshpass >/dev/null
          runner_ip="$(curl -4 -fsS --max-time 8 https://api.ipify.org)"
          python3 -c 'import ipaddress,sys;ipaddress.IPv4Address(sys.argv[1])' "$runner_ip"
          echo "RUNNER_PUBLIC_IP=$runner_ip" >> "$GITHUB_ENV"
          echo 'ONLY_FOREIGN89=true'
      - name: Run one bounded source-IP-scoped foreign packet observer and 35 synthetic TLS ClientHellos
        shell: bash
        run: |
          set -Eeuo pipefail
          script=scripts/mnebydns-meta89-clienthello-completeness-20261114.py
          export SSHPASS="$DE_PASS"
          sshpass -e ssh -T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 \
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR \
            root@89.125.90.101 "python3 -u - observe '$RUNNER_PUBLIC_IP' 65" \
            < "$script" > foreign89-observer.log &
          remote_pid=$!
          sleep 4
          python3 "$script" client > foreign89-client.log
          wait "$remote_pid"
          echo '=== SYNTHETIC EXTERNAL CLIENT ==='
          cat foreign89-client.log
          echo '=== FOREIGN89 FULL CLIENTHELLO READ-ONLY SERVER OBSERVATION ==='
          cat foreign89-observer.log
          rm -f foreign89-observer.log foreign89-client.log
          echo 'NO_RU188_CONNECTION=true'
          echo 'NO_PRODUCTION_CHANGES=true'
