name: Locate tunnel drops by encrypted payload hashes and compare bounded transports
on:
  push:
    branches: [fix/dns-tunnel-performance-20261116]
    paths: [.github/workflows/perf-trial-20261116.yml]
permissions:
  contents: read
concurrency:
  group: mnebyvpn-perf-trial-20261116
  cancel-in-progress: false
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
      RU_PASS: ${{ secrets.SERVER188_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            ops/mnebydns-owner-ssh-known_hosts
          sparse-checkout-cone-mode: false
      - name: Verify syntax and run bounded isolated trials
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -W error -m py_compile scripts/perf-transport-trial-20261116.py scripts/perf-trial-runner-20261116.py
          node --check scripts/perf-dns-bench-20261116.mjs
          if ! command -v sshpass >/dev/null; then sudo apt-get update -qq; sudo apt-get install -y -qq sshpass >/dev/null; fi
          python3 scripts/perf-trial-runner-20261116.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dns-tunnel-parallel-comparison
          path: output/*.json
          retention-days: 2
          if-no-files-found: warn
