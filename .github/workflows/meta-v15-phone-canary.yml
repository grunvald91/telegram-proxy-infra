name: Meta v15 peer-scoped 15-minute receive-window trial

on:
  workflow_dispatch:
    inputs:
      peer:
        description: Test phone's public IPv4 (not the GitHub runner or SSH address)
        required: true
        type: string

permissions:
  contents: read
concurrency:
  group: mnebydns-iglite-wifi-v10-onrequest
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 29
    env:
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate peer and local regressions
        run: |
          set -Eeuo pipefail
          test -n "$DE_PASS"
          python3 - <<'PY'
          import ipaddress,json,os
          with open(os.environ['GITHUB_EVENT_PATH']) as event_file:
              peer=ipaddress.IPv4Address(json.load(event_file)['inputs']['peer'])
          assert peer.is_global and str(peer)!='89.125.90.101'
          print('::add-mask::'+str(peer))
          with open(os.environ['GITHUB_ENV'],'a') as env_file:
              env_file.write('TEST_PEER='+str(peer)+'\n')
          PY
          python3 -m unittest discover -s scripts/tests -p 'test_meta_v15_receive_window.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_mnebydns_iglite_v11_scope.py' -v
      - name: Prepare pinned SSH
        run: |
          set -Eeuo pipefail
          test -s ops/mnebydns-owner-ssh-known_hosts
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sshpass >/dev/null
      - name: Stage reviewed 15-minute controller and receiver
        run: |
          set -Eeuo pipefail
          export SSHPASS="$DE_PASS"
          opts=(-T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes
            -o HostKeyAlgorithms=ssh-ed25519
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts"
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR)
          tar -C scripts -cf - meta_v15_phone_trial.py meta_v15_receive_window.py \
            mnebydns_iglite_route_only_v11.py mnebydns_iglite_wifi_multi_meta_v10_w20.py \
            mnebydns_iglite_sni_observer.py mnebydns_iglite_dns_wire_checks.py \
            mnebydns_iglite_wifi_readiness_helpers.py mnebydns-owner-domain-render-20261110.py |
            sshpass -e ssh "${opts[@]}" root@89.125.90.101 \
            'set -eu; test ! -e /var/lib/mneby-meta-v15-controller; umask 077; mkdir -p -m 700 /usr/local/libexec/mneby-meta-v15; tar -xf - -C /usr/local/libexec/mneby-meta-v15'
      - name: Run peer-scoped receiver segmentation trial
        run: |
          set -Eeuo pipefail
          export SSHPASS="$DE_PASS"
          opts=(-T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes
            -o HostKeyAlgorithms=ssh-ed25519
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts"
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR)
          # TEST_PEER has already passed strict IPv4 parsing; no shell tokens.
          timeout 1600s sshpass -e ssh "${opts[@]}" root@89.125.90.101 \
            "MNEBY_META_V15_APPROVED=YES MNEBY_META_V15_RUN_ID=$GITHUB_RUN_ID python3 -u /usr/local/libexec/mneby-meta-v15/meta_v15_phone_trial.py live --peer $TEST_PEER" |
            tee "$RUNNER_TEMP/meta-v15-trial.log"
          grep -Fqx 'meta_v15_cleanup=VERIFIED' "$RUNNER_TEMP/meta-v15-trial.log"
          grep -Fqx 'iglite_v11_15min_window=READY' "$RUNNER_TEMP/meta-v15-trial.log"
          # A green workflow proves diagnostics and cleanup, not app success.
      - name: Independent teardown and original configuration verification
        if: always()
        run: |
          set -Eeuo pipefail
          test -n "$DE_PASS"
          export SSHPASS="$DE_PASS"
          opts=(-T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes
            -o HostKeyAlgorithms=ssh-ed25519
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts"
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR)
          sshpass -e ssh "${opts[@]}" root@89.125.90.101 \
            "if test -f /var/lib/mneby-meta-v15-controller/owner && test \"\$(cat /var/lib/mneby-meta-v15-controller/owner)\" = '$GITHUB_RUN_ID'; then python3 /usr/local/libexec/mneby-meta-v15/meta_v15_phone_trial.py rollback; fi"
