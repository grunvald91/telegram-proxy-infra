name: MNEBYDNS plain UDP control on same DE-to-RU IP path no service changes
on:
  push:
    branches: [restore/mnebydns-youtube-morning-20261115]
    paths: ['.github/workflows/mnebydns-udp-control-20261115.yml']
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RU_PASS: ${{ secrets.SERVER188_SSH_PASSWORD }}
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Compare 120 small and 120 large synthetic UDP packets on DE egress and RU ingress
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$RU_PASS" && test -n "$DE_PASS"
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -qq -y sshpass >/dev/null
          opts=(-T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts"
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR)
          remote() {
            local pass="$1" host="$2" command="$3"
            SSHPASS="$pass" sshpass -e ssh "${opts[@]}" "root@$host" "$command"
          }
          remote "$DE_PASS" 89.125.90.101 "timeout -s INT 30s tcpdump -i eth0 -s 96 -U -w - 'src host 89.125.90.101 and dst host 188.120.254.223 and udp and dst port 53994'" > "$RUNNER_TEMP/de-control.pcap" 2>"$RUNNER_TEMP/de-control.err" &
          pid1=$!
          remote "$RU_PASS" 188.120.254.223 "timeout -s INT 30s tcpdump -i ens3 -s 96 -U -w - 'src host 89.125.90.101 and dst host 188.120.254.223 and udp and dst port 53994'" > "$RUNNER_TEMP/ru-control.pcap" 2>"$RUNNER_TEMP/ru-control.err" &
          pid2=$!
          sleep 4
          remote "$DE_PASS" 89.125.90.101 'python3 -' <<'PY'
          import socket,struct,time
          s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM)
          for seq in range(240):
            size=96 if seq%2==0 else 1200
            data=b'MNUS'+struct.pack('!I',seq)+bytes(size-8)
            s.sendto(data,('188.120.254.223',53994))
            time.sleep(0.075)
          s.close()
          print('UDP_CONTROL_SENT=240',flush=True)
          PY
          wait "$pid1" || true
          wait "$pid2" || true
          python3 - "$RUNNER_TEMP/de-control.pcap" "$RUNNER_TEMP/ru-control.pcap" <<'PY'
          import sys,pathlib,struct,json
          def records(name):
            b=pathlib.Path(name).read_bytes()
            if len(b)<24:raise ValueError('empty capture')
            endian='<' if b[:4]==bytes.fromhex('d4c3b2a1') else '>'
            if struct.unpack(endian+'I',b[20:24])[0]!=1:raise ValueError('wrong link type')
            i=24;ids=set()
            while i+16<=len(b):
              sec,usec,cap,orig=struct.unpack(endian+'IIII',b[i:i+16]);i+=16
              f=b[i:i+cap];i+=cap
              if len(f)<50 or f[12:14]!=bytes.fromhex('0800'):continue
              h=(f[14]&15)*4
              if f[23]!=17 or len(f)<14+h+16:continue
              udp=f[14+h:]
              if udp[8:12]!=b'MNUS':continue
              ids.add(struct.unpack('!I',udp[12:16])[0])
            return ids
          a,b=records(sys.argv[1]),records(sys.argv[2])
          if len(a)<200:raise ValueError('source capture incomplete')
          missing=a-b
          print('UDP_CONTROL_CORRELATION='+json.dumps({
            'sent_captured':len(a),'received_captured':len(a&b),'missing':len(missing),
            'missing_pct':round(len(missing)*100/len(a),2),
            'small_lost':sum(x%2==0 for x in missing),
            'large_lost':sum(x%2==1 for x in missing)
          },sort_keys=True),flush=True)
          PY
          echo UDP_CONTROL_DE_CAPTURE
          tail -n 3 "$RUNNER_TEMP/de-control.err"
          echo UDP_CONTROL_RU_CAPTURE
          tail -n 3 "$RUNNER_TEMP/ru-control.err"
          echo UDP_CONTROL_NO_NETWORK_CONFIG_CHANGED=true
