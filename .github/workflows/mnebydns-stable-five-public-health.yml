name: MNEBYDNS read-only service reliability and egress guard

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/mnebydns-stable-five-public-health.yml'
      - 'scripts/mnebydns_reliability_monitor.py'
      - 'scripts/tests/test_mnebydns_reliability_monitor.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/mnebydns-stable-five-public-health.yml'
      - 'scripts/mnebydns_reliability_monitor.py'
      - 'scripts/tests/test_mnebydns_reliability_monitor.py'
  workflow_dispatch:
  # Preserve the existing 4x/day cadence: no extra scheduled Actions.
  schedule:
    - cron: '17 1,7,13,19 * * *'

permissions:
  contents: read

concurrency:
  group: mnebydns-stable-five-health
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RELAY_SSH_PASSWORD: ${ secrets.RELAY89_SSH_PASSWORD }}
      INGRESS_IP: '89.125.90.101'
      RESOLVER_SNI: 'dns.mnebyvpn.site'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Offline parser, policy and no-mutation tests
        run: |
          set -Eeuo pipefail
          python3 -m unittest discover -s scripts/tests -p 'test_mnebydns_reliability_monitor.py' -v
          python3 -m py_compile scripts/mnebydns_reliability_monitor.py
      - name: Read-only foreign exit IP observation (failures remain unknown)
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          RELAY_SSH_PASSWORD: ${{ secrets.RELAY89_SSH_PASSWORD }}
        run: |
          set -Eeuo pipefail
          state=unknown
          if [[ -n "$RELAY_SSH_PASSWORD" && -s ops/mnebydns-owner-ssh-known_hosts ]]; then
            if ! command -v sshpass >/dev/null 2>&1; then
              sudo apt-get update -qq
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sshpass >/dev/null
            fi
            export SSHPASS="$RELAY_SSH_PASSWORD"
            # The outbound IP is compared locally and never printed in logs.
            if observed="$(timeout 19 sshpass -e ssh \
              -o ConnectTimeout=8 -o ServerAliveInterval=5 -o ServerAliveCountMax=1 \
              -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 \
              -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts" \
              -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR \
              "root@$INGRESS_IP" \
              "curl --noproxy '*' --proto '=https' --tlsv1.2 --fail --silent --show-error --connect-timeout 4 --max-time 9 https://api.ipify.org" \
              2>/dev/null)"; then
              if [[ "$observed" == "$INGRESS_IP" ]]; then
                state=match
              else
                state=mismatch
              fi
            fi
          fi
          echo "EGRESS_STATE=$state" >> "$GITHUB_ENV"
          echo "foreign_egress_ip_comparison=$state"
      - name: Probe public DNS-over-TLS, route regression, and passthrough TLS
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/mnebydns_reliability_monitor.py \
            --resolver-ip "$INGRESS_IP" \
            --resolver-sni "$RESOLVER_SNI" \
            --ingress-ip "$INGRESS_IP" \
            --egress "${EGRESS_STATE:-unknown}" \
            --output health.json
      - name: Preserve a sanitized, no-client-data summary for comparisons
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: mnebydns-readonly-health
          path: health.json
          retention-days: 7
          if-no-files-found: ignore
