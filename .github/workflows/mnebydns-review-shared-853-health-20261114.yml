name: MNEBYDNS inspect shared legacy and personal DNS ingress
on:
  push:
    branches: [audit/mnebydns-chatgpt-legacy-personal-e2e-20261114]
    paths: ['.github/workflows/mnebydns-review-shared-853-health-20261114.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Inspect public port 853 NAT and stream service health
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$DE_PASS"
          sudo apt-get update -qq && sudo apt-get install -qq -y sshpass >/dev/null
          export SSHPASS="$DE_PASS"
          sshpass -e ssh -T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts" -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR root@89.125.90.101 'python3 -' <<'PY'
          import subprocess
          for label,cmd in (
              ('NAT853',['iptables','-t','nat','-L','PREROUTING','-nvx']),
              ('PORT9443',['ss','-Hlnpt','sport = :9443']),
              ('SNI_SERVICE',['systemctl','is-active','mnebydns-personal-sni-stream.service']),
              ('CORE_SERVICE',['systemctl','is-active','mnebydns-dot.service'])):
              p=subprocess.run(cmd,stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True,timeout=10)
              print('DE_'+label+'_RC='+str(p.returncode),flush=True)
              if label=='NAT853':
                  for line in p.stdout.splitlines():
                      if '853' in line:print('DE_NAT853_COUNTERS='+line[:190],flush=True)
              else:
                  for line in p.stdout.splitlines()[:3]:
                      print('DE_'+label+'='+line[:180],flush=True)
          PY
