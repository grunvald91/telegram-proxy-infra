name: MNEBYVPN diagnose foreign TLS SYN backlog and TCP kernel
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/mnebyvpn-relay89-tcp-kernel-health.yml'
      - 'scripts/mnebyvpn_foreign_tcp443_probe.py'
      - 'scripts/tests/test_mnebyvpn_foreign_tcp443_probe.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/mnebyvpn-relay89-tcp-kernel-health.yml'
      - 'scripts/mnebyvpn_foreign_tcp443_probe.py'
      - 'scripts/tests/test_mnebyvpn_foreign_tcp443_probe.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mnebyvpn-foreign-tcp443-syn-readonly
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify read-only packet parser without a real network
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_mnebyvpn_foreign_tcp443_probe.py' -v
          python3 -m py_compile scripts/mnebyvpn_foreign_tcp443_probe.py
  test:
    if: github.event_name != 'pull_request'
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      TARGET: '89.125.90.101'
      PASSWORD: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Measure kernel listen failures during external 443 probe
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PASSWORD"
          sudo apt-get update -qq && sudo apt-get install -qq -y sshpass
          SRC="$(curl -fsS --max-time 7 -4 https://api.ipify.org)"
          [[ "$SRC" =~ ^[0-9.]+$ ]]
          export SSHPASS="$PASSWORD"
          opts=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -o LogLevel=ERROR)
          sshpass -e ssh "${opts[@]}" "root@$TARGET" "python3 - '$SRC'" > "$RUNNER_TEMP/status.txt" <<'PY' &
          import sys,socket,subprocess,time,pathlib
          def proc(cmd):
            return subprocess.run(cmd,capture_output=True,text=True,timeout=10)
          def stats():
            result={}
            lines=pathlib.Path('/proc/net/netstat').read_text().splitlines()
            for i in range(0,len(lines)-1,2):
              if not lines[i].startswith('TcpExt:'):continue
              keys=lines[i].split()[1:]
              values=lines[i+1].split()[1:]
              if len(keys)==len(values):
                result.update({k:int(v) for k,v in zip(keys,values)})
            return result
          keys=['ListenDrops','ListenOverflows','SyncookiesSent','TCPReqQFullDrop','TCPReqQFullDoCookies','TCPBacklogDrop','TCPMinTTLDrop','TCPTimeouts','TCPRcvQDrop']
          base=stats()
          for key in ['net.ipv4.tcp_syncookies','net.ipv4.tcp_max_syn_backlog','net.core.somaxconn',
                      'net.ipv4.tcp_abort_on_overflow']:
            p=proc(['sysctl','-n',key])
            print('sysctl_'+key.replace('.','_')+'='+p.stdout.strip(),flush=True)
          sock=proc(['ss','-H','-lntp'])
          for line in sock.stdout.splitlines():
            a=line.split()
            if len(a)>4 and a[3].endswith(':443'):
              print('listen443_rcvq='+a[1],flush=True)
              print('listen443_backlog='+a[2],flush=True)
              print('listen443_process_is_nginx='+str('nginx' in line).lower(),flush=True)
          end=time.monotonic()+17
          during=[]
          while time.monotonic()<end:
            q=proc(['ss','-H','-nt','state','syn-recv','sport',':443'])
            during.append(len(q.stdout.splitlines()))
            time.sleep(2)
          print('max_syn_recv443='+str(max(during or [0])),flush=True)
          new=stats()
          for key in keys:
            print('delta_'+key+'='+str(new.get(key,0)-base.get(key,0)),flush=True)
          print('kernel_read_only=true')
          PY
          pid=$!
          sleep 3
          python3 - <<'PY'
          import socket
          for port in [443,80]:
            try:
              with socket.create_connection(('89.125.90.101',port),timeout=5):
                print('client_port_'+str(port)+'=connected')
            except Exception as e:
              print('client_port_'+str(port)+'='+type(e).__name__)
          PY
          wait "$pid"
          cat "$RUNNER_TEMP/status.txt"

      - name: Correlate one external TCP/443 test with remote SYN and SYN-ACK headers
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$PASSWORD"
          test -s ops/mnebydns-owner-ssh-known_hosts
          SRC="$(curl --noproxy '*' -fsS -4 --connect-timeout 4 --max-time 8 https://api.ipify.org)"
          python3 - "$SRC" <<'PY'
          import ipaddress,sys
          ipaddress.IPv4Address(sys.argv[1])
          PY
          export SSHPASS="$PASSWORD"
          opts=(-o ConnectTimeout=10 -o ServerAliveInterval=5 -o ServerAliveCountMax=1
                -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519
                -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts"
                -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR)
          # Read-only AF_PACKET socket is bounded to 19s on one test runner source.
          # No pcap, no nft/iptables changes and no packet payload in the logs.
          timeout 28 sshpass -e ssh "${opts[@]}" "root@$TARGET" \
            "python3 - '$SRC' '$TARGET'" \
            < scripts/mnebyvpn_foreign_tcp443_probe.py \
            > "$RUNNER_TEMP/tcp443-headers.txt" &
          capture_pid=$!
          ready=false
          for _ in {1..30}; do
            if grep -q '^capture_ready=true$' "$RUNNER_TEMP/tcp443-headers.txt" 2>/dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$capture_pid" 2>/dev/null; then break; fi
            sleep 0.3
          done
          if [[ "$ready" != true ]]; then
            wait "$capture_pid" || true
            echo "capture_not_ready=true"
            exit 1
          fi
          python3 - "$TARGET" <<'PY'
          import socket,sys,time
          target=sys.argv[1]
          for attempt in range(3):
              try:
                  with socket.create_connection((target,443),timeout=4):
                      print('external_tcp443_probe_'+str(attempt+1)+'=connected',flush=True)
              except OSError as e:
                  print('external_tcp443_probe_'+str(attempt+1)+'='+type(e).__name__,flush=True)
              time.sleep(.2)
          PY
          wait "$capture_pid"
          cat "$RUNNER_TEMP/tcp443-headers.txt"
          echo "PROBE_IS_TEST_RUNNER_ONLY_NOT_END_USER=true"
