name: Meta v12 read-only RU DE WireGuard and DoT path check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meta-v12-readonly-path
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      RU_PASS: ${{ secrets.SERVER188_SSH_PASSWORD }}
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify read-only script and gather external DNS answers
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/meta_v12_ru_de_readonly.py scripts/meta_v12_routing_gate.py scripts/tests/test_meta_v12_routing_gate.py
          python3 -m unittest discover -s scripts/tests -p 'test_meta_v12_routing_gate.py' -v
          echo '### External DoT DNS answers (GitHub runner, NOT a Russian phone)' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/meta_v12_ru_de_readonly.py external | tee -a "$RUNNER_TEMP/meta-v12-aggregates.txt" "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare pinned SSH, fail closed when secrets unavailable
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$RU_PASS" && test -n "$DE_PASS" || { echo 'SSH credentials unavailable; servers untouched'; exit 1; }
          test -s ops/mnebydns-owner-ssh-known_hosts
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sshpass >/dev/null
      - name: Remote read-only socket, WireGuard, nginx, and TLS checks
        shell: bash
        run: |
          set -Eeuo pipefail
          opts=(-T -o BatchMode=no -o ConnectTimeout=12 -o StrictHostKeyChecking=yes
                -o HostKeyAlgorithms=ssh-ed25519
                -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts"
                -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR)
          echo '### Server-origin TLS diagnostics (no configuration changes)' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          export SSHPASS="$RU_PASS"
          sshpass -e ssh "${opts[@]}" root@188.120.254.223 'python3 - ru' < scripts/meta_v12_ru_de_readonly.py | tee -a "$RUNNER_TEMP/meta-v12-aggregates.txt" "$GITHUB_STEP_SUMMARY"
          export SSHPASS="$DE_PASS"
          sshpass -e ssh "${opts[@]}" root@89.125.90.101 'python3 - de' < scripts/meta_v12_ru_de_readonly.py | tee -a "$RUNNER_TEMP/meta-v12-aggregates.txt" "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo 'no_live_file_changes=true' | tee -a "$RUNNER_TEMP/meta-v12-aggregates.txt" "$GITHUB_STEP_SUMMARY"
      - name: Classify observed Meta route without claiming Android success
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '### Meta route classification (not an Android test)' >> "$GITHUB_STEP_SUMMARY"
          echo '\`\`\`text' >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/meta_v12_routing_gate.py "$RUNNER_TEMP/meta-v12-aggregates.txt" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '\`\`\`' >> "$GITHUB_STEP_SUMMARY"
