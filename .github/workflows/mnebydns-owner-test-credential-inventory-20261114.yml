name: MNEBYDNS owner real personal-key issuance readiness (read-only)
on:
  push:
    branches: [feat/mnebydns-owner-personal-test-key-20261114]
    paths: ['.github/workflows/mnebydns-owner-test-credential-inventory-20261114.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      RU_PASS: ${{ secrets.SERVER188_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read-only owner and production DB capability inspection (no identities or secrets printed)
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s ops/mnebydns-owner-ssh-known_hosts
          test -n "$RU_PASS"
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass >/dev/null
          export SSHPASS="$RU_PASS"
          sshpass -e ssh -T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR \
            root@188.120.254.223 'bash -se' <<'SH'
          set -Eeuo pipefail
          test -s /opt/mnebyvpn/bot/web.env
          test "$(docker inspect -f '{{.State.Running}}' mnebyvpn-stage-postgres)" = true
          test "$(docker inspect -f '{{.State.Running}}' mnebydns-personal-dot-private)" = true
          eval "$(python3 - <<'PY'
          import pathlib,re,shlex
          env={}
          for line in pathlib.Path('/opt/mnebyvpn/bot/web.env').read_text().splitlines():
              if line.strip() and not line.lstrip().startswith('#') and '=' in line:
                  k,v=line.split('=',1)
                  if k in ('DNS_ADMIN_TELEGRAM_ID','SUPPORT_TELEGRAM_OPERATOR_ID',
                           'TELEGRAM_TOKEN_BOT','MNEBYDNS_PERSONAL_DOT_ENABLED',
                           'DATABASE_URL'):
                      env[k]=v.strip().strip('"').strip("'")
          actor=env.get('DNS_ADMIN_TELEGRAM_ID') or env.get('SUPPORT_TELEGRAM_OPERATOR_ID','')
          print('OWNER_OK='+('yes' if re.fullmatch('[1-9][0-9]{0,15}',actor) else 'no'))
          print('OWNER_ID='+shlex.quote(actor if re.fullmatch('[1-9][0-9]{0,15}',actor) else ''))
          print('BOT_TOKEN_OK='+('yes' if re.fullmatch('[0-9]{5,20}:[A-Za-z0-9_-]{25,}',env.get('TELEGRAM_TOKEN_BOT','')) else 'no'))
          print('BOT_PERSONAL_FEATURE='+shlex.quote('yes' if env.get('MNEBYDNS_PERSONAL_DOT_ENABLED')=='yes' else 'no'))
          print('DATABASE_URL_OK='+('yes' if env.get('DATABASE_URL','').startswith('postgresql://') else 'no'))
          PY
          )"
          echo "OWNER_IDENTIFIED=$OWNER_OK"
          echo "BOT_OUTBOUND_TOKEN_PRESENT=$BOT_TOKEN_OK"
          echo "BOT_PERSONAL_FEATURE_ENABLED=$BOT_PERSONAL_FEATURE"
          echo "DATABASE_URL_PRESENT=$DATABASE_URL_OK"
          [[ "$OWNER_OK" == yes ]] || exit 2
          docker exec -e "OWNER_ID=$OWNER_ID" mnebyvpn-stage-postgres sh -ceu '
            PGPASSWORD="$POSTGRES_PASSWORD" psql -XAt -v ON_ERROR_STOP=1 -h 127.0.0.1 \
              -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "
              BEGIN TRANSACTION READ ONLY;
              SELECT '\''PERSONAL_DOT_DB_TABLES='\'' ||
                ((to_regclass('\''public.personal_dns_credentials'\'') IS NOT NULL)::text);
              SELECT '\''PERSONAL_DOT_DB_FUNCTION='\'' ||
                ((to_regprocedure('\''public.issue_personal_dns_credential(uuid,text,text,bigint)'\'') IS NOT NULL)::text);
              SELECT '\''PERSONAL_DOT_QUERY_SETTLEMENT='\'' ||
                ((to_regprocedure('\''public.reserve_personal_dns_query(text,uuid)'\'') IS NOT NULL)::text);
              SELECT '\''OWNER_LINKED_ACCOUNT_COUNT='\'' ||
                (SELECT count(*) FROM accounts WHERE telegram_user_id=$OWNER_ID)::text;
              SELECT '\''OWNER_ACTIVE_SMART_DNS_ACCESS_COUNT='\'' ||
                (SELECT count(*) FROM entitlements e JOIN accounts a ON a.id=e.account_id
                 WHERE a.telegram_user_id=$OWNER_ID AND e.product='\''smart_dns'\''
                   AND e.state='\''ACTIVE'\'' AND e.expires_at>clock_timestamp())::text;
              SELECT '\''PERSONAL_STARS_PLAN_ENABLED='\'' ||
                COALESCE((SELECT enabled::text FROM billing_plans WHERE id='\''personal_dns_30d_stars'\''),'\''ABSENT'\'');
              COMMIT;"' | grep -E '^(PERSONAL_DOT_|OWNER_|PERSONAL_STARS_)'
          echo 'PRODUCTION_DB_PRECHECK_READ_ONLY=true'
          SH
