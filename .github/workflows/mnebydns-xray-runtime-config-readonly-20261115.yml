name: MNEBYDNS identify active Xray userspace config and inbound packet routing
on:
  push:
    branches: [diag/mnebydns-live-video-stall-20261115]
    paths: [.github/workflows/mnebydns-xray-runtime-config-readonly-20261115.yml]
permissions: {contents: read}
jobs:
  readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Identify actual Xray service configs and whether each inbound supports TLS SNI override
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$DE_PASS"
          test -s ops/mnebydns-owner-ssh-known_hosts
          sudo apt-get update -qq && sudo apt-get install -qq -y sshpass >/dev/null
          opts=(-T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts" -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR)
          SSHPASS="$DE_PASS" sshpass -e ssh "${opts[@]}" root@89.125.90.101 'python3 -' <<'PY'
          import subprocess,re,pathlib,json,os,glob
          def cmd(x,t=5):
            try:
              p=subprocess.run(x,stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,text=True,timeout=t)
              return p.stdout
            except Exception:return ""
          def emit(k,v):print("XRAY_RUNTIME_"+k+"="+str(v),flush=True)
          all_ps=cmd(["ps","-eo","pid,comm,args"])
          procs=[]
          for l in all_ps.splitlines():
            fields=l.strip().split(None,2)
            if len(fields)!=3 or fields[1].lower()!="xray":continue
            pid=int(fields[0]); args=fields[2]
            config=re.search(r"(?:-config(?:=|\s+)|-c\s+)(\S+)",args)
            confdir=re.search(r"(?:-confdir(?:=|\s+))(\S+)",args)
            cg=pathlib.Path("/proc/"+str(pid)+"/cgroup")
            cgroup=cg.read_text() if cg.exists() else ""
            svc=re.findall(r"[a-zA-Z0-9_.@-]+\.service",cgroup)
            item=dict(pid=pid,service=svc[-1] if svc else "unknown",config=config.group(1) if config else None,confdir=confdir.group(1) if confdir else None)
            procs.append(item)
            emit("PROCESS",repr(item))
          emit("ACTIVE_PROCESS_COUNT",len(procs))
          ss=cmd(["ss","-H","-lntp"])
          for l in ss.splitlines():
            if "xray" not in l:continue
            items=l.split()
            if len(items)<5:continue
            bind=items[3].rsplit(":",1)[-1]
            emit("XRAY_TCP_LISTENER_PORT",bind)
          for item in procs:
            paths=[item["config"]] if item["config"] else []
            if item["confdir"]:
              paths.extend(glob.glob(item["confdir"]+"/*.json"))
            for x in paths:
              try:data=json.loads(pathlib.Path(x).read_text())
              except Exception:continue
              emit("PROCESS_"+str(item["pid"])+"_CONFIG_PATH",x)
              for i,z in enumerate(data.get("inbounds",[])):
                s=z.get("sniffing") or {}
                emit("PROCESS_"+str(item["pid"])+"_INBOUND_"+str(i),repr(dict(protocol=z.get("protocol"),tag=z.get("tag"),
                  port=z.get("port"),sniffing=s.get("enabled"),destOverride=s.get("destOverride"),routeOnly=s.get("routeOnly"))))
          for pattern in ("xray*.service","mnebyvpn*.service"):
            for unit in sorted(set(cmd(["systemctl","list-unit-files","--no-legend",pattern]).split())):
              if not unit.endswith(".service"):continue
              s=cmd(["systemctl","is-active",unit]).strip()
              if s=="active":emit("SYSTEMD_ACTIVE_UNIT",unit)
          emit("COMPLETED",True)
          PY
