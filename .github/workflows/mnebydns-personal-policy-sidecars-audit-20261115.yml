name: MNEBYDNS verify active personal DNS policy SHA on RU private sidecar
on:
  push:
    branches: [diag/mnebydns-live-video-stall-20261115]
    paths: [.github/workflows/mnebydns-personal-policy-sidecars-audit-20261115.yml]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RU_PASS: ${{ secrets.SERVER188_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Compare production and old policy inside running sidecar containers with no modifications
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$RU_PASS" && test -s ops/mnebydns-owner-ssh-known_hosts
          python3 -m py_compile scripts/mnebydns-private-personal-policy-sidecars-audit-20261115.py
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass >/dev/null
          opts=(-T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts" -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR)
          SSHPASS="$RU_PASS" sshpass -e ssh "${opts[@]}" root@188.120.254.223 'python3 -' < scripts/mnebydns-private-personal-policy-sidecars-audit-20261115.py > policy.log 2>&1
          grep '^POLICYAUDIT_' policy.log
          grep -q '^POLICYAUDIT_DONE=true' policy.log
