name: Audit Telegram proxy servers

on:
  workflow_dispatch:
    inputs:
      server:
        description: 'Server to audit'
        required: true
        type: choice
        options:
          - server188
          - relay89

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SERVER188_HOST: "188.120.254.223"
      RELAY89_HOST: "89.125.90.101"
      SERVER188_PASSWORD: ${{ secrets.SERVER188_SSH_PASSWORD }}
      RELAY89_PASSWORD: ${{ secrets.RELAY89_SSH_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Select server
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.server }}" in
            server188)
              echo "TARGET_HOST=$SERVER188_HOST" >> "$GITHUB_ENV"
              echo "TARGET_PASSWORD=$SERVER188_PASSWORD" >> "$GITHUB_ENV"
              echo "TARGET_NAME=server188" >> "$GITHUB_ENV"
              ;;
            relay89)
              echo "TARGET_HOST=$RELAY89_HOST" >> "$GITHUB_ENV"
              echo "TARGET_PASSWORD=$RELAY89_PASSWORD" >> "$GITHUB_ENV"
              echo "TARGET_NAME=relay89" >> "$GITHUB_ENV"
              ;;
            *)
              echo "::error::Unknown server"
              exit 2
              ;;
          esac

      - name: Guard credential
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$TARGET_PASSWORD" ] || {
            echo "::error::Password secret for $TARGET_NAME is not configured"
            exit 1
          }

      - name: Install SSH client helper
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Run read-only audit
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$TARGET_PASSWORD"
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          sshpass -e ssh $OPTS -p 22 "root@$TARGET_HOST" 'bash -s' < scripts/audit.sh
