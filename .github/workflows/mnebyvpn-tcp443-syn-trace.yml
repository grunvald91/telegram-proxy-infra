name: MNEBYVPN SEO P0 narrow SYNACK NFQUEUE bypass canary
on:
  push:
    paths: ['.github/workflows/mnebyvpn-tcp443-syn-trace.yml']
permissions:
  contents: read
concurrency:
  group: mnebyvpn-seo443-global-synack-canary
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      PASSWORD: ${{ secrets.SERVER188_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate scripts and baseline website and Telegram
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mnebyvpn_seo443_synack_canary_20261113.py scripts/mnebyvpn_seo443_synack_probe_20261113.py
          python3 scripts/mnebyvpn_seo443_synack_probe_20261113.py before | tee "$RUNNER_TEMP/before.log"
          grep -Fq 'BEFORE_ru8443=connected' "$RUNNER_TEMP/before.log"
          grep -Fq 'BEFORE_de8443=connected' "$RUNNER_TEMP/before.log"
          ! grep -Fq 'BEFORE_ru443=HTTP200' "$RUNNER_TEMP/before.log"
      - name: Test ONLY SYNACK exception with rollback timer
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PASSWORD"
          sudo apt-get update -qq && sudo apt-get install -qq -y sshpass >/dev/null
          export SSHPASS="$PASSWORD"
          sshpass -e ssh -T -o StrictHostKeyChecking=accept-new -o ConnectTimeout=12 -o LogLevel=ERROR root@188.120.254.223 \
            "python3 - '$GITHUB_RUN_ID'" < scripts/mnebyvpn_seo443_synack_canary_20261113.py > "$RUNNER_TEMP/server.log" &
          pid=$!
          sleep 8
          python3 scripts/mnebyvpn_seo443_synack_probe_20261113.py during | tee "$RUNNER_TEMP/during.log"
          set +e
          wait "$pid"
          remote_status=$?
          set -e
          cat "$RUNNER_TEMP/server.log"
          test "$remote_status" -eq 0
          grep -Fq 'SYNACK_ONLY_CANARY_REMOVED=true' "$RUNNER_TEMP/server.log"
          grep -Fq 'DURING_ru443=HTTP200' "$RUNNER_TEMP/during.log"
          grep -Fq 'DURING_www443=HTTP3XX' "$RUNNER_TEMP/during.log"
          grep -Fq 'DURING_ru8443=connected' "$RUNNER_TEMP/during.log"
          grep -Fq 'DURING_de8443=connected' "$RUNNER_TEMP/during.log"
          python3 scripts/mnebyvpn_seo443_synack_probe_20261113.py after
          echo 'CANARY_TEMPORARY_EXCEPTION_CLEANED=true'
