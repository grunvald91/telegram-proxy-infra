name: MNEBYVPN P0 active nfqws SYNACK configuration check (read-only)
on:
  push:
    paths: ['.github/workflows/mnebyvpn-tcp443-syn-trace.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HOST: '188.120.254.223'
      PASSWORD: ${{ secrets.SERVER188_SSH_PASSWORD }}
    steps:
      - name: Verify active RU NFQUEUE config and listener before a source-only canary
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PASSWORD"
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass >/dev/null
          export SSHPASS="$PASSWORD"
          sshpass -e ssh -T -o StrictHostKeyChecking=accept-new -o ConnectTimeout=12 -o LogLevel=ERROR \
            "root@$HOST" 'python3 -' <<'PY'
          import subprocess, pathlib, re, json
          def get(*args):
              try:
                  p=subprocess.run(args,text=True,capture_output=True,timeout=12)
                  return p.returncode,p.stdout
              except Exception:return 255,''
          cfg=pathlib.Path('/etc/zapret2/telegram-nfqws.conf')
          raw=cfg.read_text() if cfg.is_file() else ''
          print('active_ru_config_exists='+str(bool(raw)).lower())
          print('active_ru_synack_split='+str('synack_split' in raw).lower())
          print('active_ru_queue_210='+str(bool(re.search(r'--qnum\s*=?\s*210\b',raw))).lower())
          print('active_ru_server_mode='+str(bool(re.search(r'--server\b',raw))).lower())
          for name in ('telegram-nfqws.service','nginx.service'):
              code,_=get('systemctl','is-active','--quiet',name)
              print('active_'+name.split('.')[0]+'='+str(code==0).lower())
          code,ps=get('ps','-eo','comm=')
          print('nfqws_process_running='+str(code==0 and bool(re.search(r'nfqws',ps))).lower())
          q=pathlib.Path('/proc/net/netfilter/nfnetlink_queue')
          queues=q.read_text().splitlines() if q.is_file() else []
          print('kernel_queue_210_registered='+str(any(z.split() and z.split()[0]=='210' for z in queues)).lower())
          code,raw_nft=get('nft','-j','list','chain','inet','telegram_nfqws','post')
          print('telegram_post_chain_available='+str(code==0).lower())
          matching=[]
          if code==0:
              for item in json.loads(raw_nft).get('nftables',[]):
                  rule=item.get('rule')
                  if not rule:continue
                  expr=rule.get('expr',[])
                  queues=[e['queue'] for e in expr if isinstance(e,dict) and 'queue' in e]
                  if any(q.get('num')==210 for q in queues):matching.append(expr)
          print('telegram_queue_210_rules='+str(len(matching)))
          for expr in matching[:2]:
              t=json.dumps(expr,sort_keys=True)
              print('queue_443_sourceport_match='+str('"sport"' in t and '"443"' in t or '"sport"' in t and '"right": 443' in t).lower())
              print('queue_bypass_enabled='+str('"bypass"' in t).lower())
              print('queue_ens3_egress_match='+str('"ens3"' in t).lower())
              print('queue_reply_packets_match='+str('"reply"' in t and '"packets"' in t).lower())
          code,lines=get('ss','-H','-lntp','sport','=',':443')
          print('tcp443_owned_by_nginx='+str(code==0 and 'nginx' in lines).lower())
          print('no_changes_to_server=true')
          PY
