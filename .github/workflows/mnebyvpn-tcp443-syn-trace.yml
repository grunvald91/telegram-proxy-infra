# Read-only public web vs Telegram proxy diagnostic; no config changes or payload capture.
name: MNEBYVPN compare public web 443 with Telegram proxy ingress (read-only)
on:
  push:
    paths: ['.github/workflows/mnebyvpn-tcp443-syn-trace.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      HOST: '188.120.254.223'
      PASSWORD: ${{ secrets.SERVER188_SSH_PASSWORD }}
    steps:
      - name: Compare SNI, listeners, proxy processes, netfilter and SYN/SYN-ACK without writes
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PASSWORD"
          sudo apt-get update -qq && sudo apt-get install -qq -y sshpass
          MY_IP="$(curl -4 -fsS --max-time 8 https://api.ipify.org)"
          [[ "$MY_IP" =~ ^[0-9.]+$ ]] || exit 2
          export SSHPASS="$PASSWORD"
          opts=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -o LogLevel=ERROR)
          sshpass -e ssh "${opts[@]}" "root@$HOST" "python3 - '$MY_IP'" > "$RUNNER_TEMP/syn-count.txt" <<'PY' &
          import socket,sys,time
          import subprocess,re
          def output(args,timeout=15):
            try:
              p=subprocess.run(args,text=True,capture_output=True,timeout=timeout)
              return p.stdout if p.returncode==0 else ''
            except Exception:return ''
          nginx=output(['nginx','-T'],timeout=18)
          print('nginx_config_valid='+str(bool(nginx)).lower(),flush=True)
          m=re.search(r'map\s+\$ssl_preread_server_name\s+\$stream_443_backend\s*\{([^{}]*)\}',nginx,re.S)
          routing=m.group(1) if m else ''
          def destination(name):
            m=re.search(r'(?m)^\s*'+re.escape(name)+r'\s+([^\s;]+);',routing)
            return m.group(1) if m else ''
          print('sni_dispatcher_present='+str(bool(m)).lower(),flush=True)
          print('site_sni_correct='+str(destination('mnebyvpn.site')=='127.0.0.1:18449').lower(),flush=True)
          print('www_sni_correct='+str(destination('www.mnebyvpn.site')=='127.0.0.1:18449').lower(),flush=True)
          print('default_sni_backend_present='+str(bool(destination('default'))).lower(),flush=True)
          print('other_sni_routes_count='+str(max(0,len(re.findall(r'(?m)^\s*\S+\s+[^\s;]+;',routing))-3)),flush=True)
          listener=output(['ss','-H','-lntp'])
          for port in (80,443,8443,18449,8792):
            rows=[line for line in listener.splitlines() if re.search(':'+str(port)+r'\s',line)]
            print('listen_'+str(port)+'_count='+str(len(rows)),flush=True)
            print('listen_'+str(port)+'_nginx='+str(any('nginx' in row for row in rows)).lower(),flush=True)
            print('listen_'+str(port)+'_telegram_proxy='+str(any(re.search(r'mtproxy|mtproto|tgproxy',row,re.I) for row in rows)).lower(),flush=True)
          processes=output(['ps','-eo','comm=']).splitlines()
          for key,pattern in [('telegram','mtproxy|mtproto|tgproxy'),('nginx','nginx'),('xray','xray|v2ray'),('other_proxy','haproxy|gost|3proxy')]:
            print('process_'+key+'_count='+str(sum(bool(re.search(pattern,p,re.I)) for p in processes)),flush=True)
          containers=output(['docker','ps','--format','{{.Names}} {{.Image}}'])
          print('docker_telegram_proxy_present='+str(bool(re.search(r'mtproxy|mtproto|telegram.?proxy|tgproxy',containers,re.I))).lower(),flush=True)
          for table in ('filter','nat','mangle','raw'):
            args=['iptables']+(['-t',table] if table!='filter' else [])+['-S']
            rules=output(args)
            port443=[line for line in rules.splitlines() if re.search(r'--dport\s+443\b|--dports\s+[^\s]*443\b',line)]
            print('iptables_'+table+'_443_count='+str(len(port443)),flush=True)
            for action in ('DROP','REJECT','ACCEPT','TPROXY','REDIRECT','DNAT','MARK'):
              print('iptables_'+table+'_443_'+action.lower()+'='+str(sum(bool(re.search(r'-j\s+'+action+r'\b',line)) for line in port443)),flush=True)
          nft=output(['nft','list','ruleset'])
          nft443=[line for line in nft.splitlines() if re.search(r'\bdport\s+(?:\{[^}]*\b443\b[^}]*\}|\b443\b)',line)]
          print('nft_443_explicit_count='+str(len(nft443)),flush=True)
          for action in ('drop','reject','accept','tproxy','redirect'):
            print('nft_443_'+action+'_count='+str(sum(bool(re.search(r'\b'+action+r'\b',line)) for line in nft443)),flush=True)
          def classified_rules(table):
            args=['iptables']+(['-t',table] if table!='filter' else [])+['-S']
            lines=output(args).splitlines()
            return [line for line in lines if re.search(r'--dport\s+443\b|--dports\s+[^\s]*443\b',line)]
          for table in ('nat','mangle','filter'):
            for i,rule in enumerate(classified_rules(table)[:12]):
              chunks=rule.split()
              def next_token(flag):
                return chunks[chunks.index(flag)+1] if flag in chunks and chunks.index(flag)+1<len(chunks) else ''
              proto=next_token('-p') or 'any'
              chain=next_token('-A')
              location=chain if chain in ('PREROUTING','INPUT','OUTPUT','POSTROUTING','FORWARD') else 'custom'
              verdict=next_token('-j') or 'none'
              toport=next_token('--to-ports') or 'none'
              print('rule_'+table+'_'+str(i)+'_protocol='+proto,flush=True)
              print('rule_'+table+'_'+str(i)+'_chain_class='+location,flush=True)
              print('rule_'+table+'_'+str(i)+'_verdict='+verdict,flush=True)
              print('rule_'+table+'_'+str(i)+'_redirect_to_port='+toport,flush=True)
              print('rule_'+table+'_'+str(i)+'_source_restricted='+str('-s' in chunks).lower(),flush=True)
              print('rule_'+table+'_'+str(i)+'_has_interface_match='+str('-i' in chunks or '-o' in chunks).lower(),flush=True)
              print('rule_'+table+'_'+str(i)+'_has_connmark_match='+str('--mark' in chunks or '--ctmark' in chunks).lower(),flush=True)
          iprules=output(['ip','-4','rule','show'])
          print('ip4_policy_fwmark_rules='+str(len([line for line in iprules.splitlines() if 'fwmark ' in line])),flush=True)
          print('read_only_preflight_complete=true',flush=True)
          source=socket.inet_aton(sys.argv[1])
          s=socket.socket(socket.AF_PACKET,socket.SOCK_RAW,socket.htons(3))
          s.settimeout(2)
          end=time.monotonic()+20
          inbound=outbound=reset=0
          while time.monotonic()<end:
            try:packet=s.recv(2048)
            except socket.timeout:continue
            if len(packet)<54 or packet[12:14]!=b'\x08\x00':continue
            ip=packet[14:]
            if ip[9]!=6:continue
            ihl=(ip[0]&15)*4
            tcp=ip[ihl:]
            if len(tcp)<14:continue
            sport=int.from_bytes(tcp[:2],'big')
            dport=int.from_bytes(tcp[2:4],'big')
            flags=tcp[13]
            if ip[12:16]==source and dport==443 and flags&2:
              inbound+=1
            if ip[16:20]==source and sport==443:
              if flags&18==18:outbound+=1
              if flags&4:reset+=1
          import subprocess,re
          route=subprocess.run(['ip','-4','route','get',sys.argv[1]],
            capture_output=True,text=True)
          dev=re.search(r'\bdev\s+(\S+)',route.stdout)
          print('public_syn_received='+str(inbound))
          print('public_synack_sent='+str(outbound))
          print('public_rst_sent='+str(reset))
          print('reply_route_device_type='+('wg' if dev and dev.group(1).startswith('wg') else
            'ethernet' if dev and dev.group(1).startswith(('en','eth')) else 'other'))
          PY
          PID=$!
          sleep 3
          python3 - <<'PY'
          import socket
          for port in (443,8443,80):
            for attempt in range(2):
              try:
                with socket.create_connection(('188.120.254.223',port),timeout=3):
                  print('external_'+str(port)+'_connect=success')
              except Exception as e:
                print('external_'+str(port)+'_connect='+type(e).__name__)
          PY
          wait "$PID"
          cat "$RUNNER_TEMP/syn-count.txt"
