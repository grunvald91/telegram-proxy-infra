name: MNEBYVPN Telegram 8443 migration port audit read-only
on:
  push:
    paths: ['.github/workflows/mnebyvpn-tcp443-syn-trace.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      RU_PASS: ${{ secrets.SERVER188_SSH_PASSWORD }}
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Audit RU and DE ports without modification
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mnebyvpn_telegram_ingress_audit_20261113.py
          test -n "$RU_PASS" && test -n "$DE_PASS"
          sudo apt-get update -qq && sudo apt-get install -qq -y sshpass >/dev/null
          opts=(-T -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts"
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no
            -o LogLevel=ERROR -o ConnectTimeout=12)
          export SSHPASS="$RU_PASS"
          sshpass -e ssh "${opts[@]}" root@188.120.254.223 'python3 - ru' < scripts/mnebyvpn_telegram_ingress_audit_20261113.py
          export SSHPASS="$DE_PASS"
          sshpass -e ssh "${opts[@]}" root@89.125.90.101 'python3 - de' < scripts/mnebyvpn_telegram_ingress_audit_20261113.py
      - name: Independent public TCP port comparison
        run: |
          python3 - <<'PY'
          import socket
          for n,host in [('ru','188.120.254.223'),('de','89.125.90.101')]:
            for port in [443,8443,10443]:
              try:
                with socket.create_connection((host,port),timeout=4):
                  print('external_'+n+'_'+str(port)+'=connected')
              except Exception as e:
                print('external_'+n+'_'+str(port)+'='+type(e).__name__)
          PY
