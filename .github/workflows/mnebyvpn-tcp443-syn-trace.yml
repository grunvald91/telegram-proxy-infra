name: MNEBYVPN SEO one-client NFQUEUE probe with rollback
on:
  push:
    paths: ['.github/workflows/mnebyvpn-tcp443-syn-trace.yml']
permissions:
  contents: read
concurrency:
  group: mnebyvpn-seo443-one-client
  cancel-in-progress: false
jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PASSWORD: ${{ secrets.SERVER188_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile diagnostics and confirm baseline failure
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mnebyvpn_seo443_nfqws_canary_20261113.py scripts/mnebyvpn_seo443_probe_20261113.py
          python3 scripts/mnebyvpn_seo443_probe_20261113.py before
      - name: Run narrow rollback-guarded canary
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PASSWORD"
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass >/dev/null
          SOURCE="$(curl -4fsS --max-time 8 https://api.ipify.org)"
          [[ "$SOURCE" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]
          export SSHPASS="$PASSWORD"
          sshpass -e ssh -T -o StrictHostKeyChecking=accept-new -o ConnectTimeout=12 -o LogLevel=ERROR \
            root@188.120.254.223 "python3 - '$SOURCE' '$GITHUB_RUN_ID'" \
            < scripts/mnebyvpn_seo443_nfqws_canary_20261113.py > "$RUNNER_TEMP/nfqws.log" &
          pid=$!
          sleep 9
          python3 scripts/mnebyvpn_seo443_probe_20261113.py during
          set +e
          wait "$pid"
          result=$?
          set -e
          cat "$RUNNER_TEMP/nfqws.log"
          if [ "$result" -ne 0 ]; then exit "$result"; fi
          grep -Fq 'CANARY_REMOVED_VERIFIED=true' "$RUNNER_TEMP/nfqws.log"
          python3 scripts/mnebyvpn_seo443_probe_20261113.py after
