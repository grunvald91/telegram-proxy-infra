name: YouTube cross-leg NFQUEUE differential with independent rollback
on:
  push:
    branches: [fix/youtube-nfq-crossleg-20261117]
    paths:
      - .github/workflows/youtube-nfq-crossleg-20261117.yml
      - scripts/youtube-nfq-ab-20261117.py
      - scripts/de89-googlevideo-ack-window-20261117.py
      - scripts/tests/test_de89_googlevideo_ack_20261117.py
permissions: {contents: read}
concurrency:
  group: mnebydns-youtube-nfq-canary
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
      RU_PASS: ${{ secrets.SERVER188_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify parser before bounded server differential
        run: |
          python3 -m py_compile scripts/youtube-nfq-ab-20261117.py scripts/de89-googlevideo-ack-window-20261117.py
          python3 -m unittest discover -s scripts/tests -p test_de89_googlevideo_ack_20261117.py -v
      - name: Compare existing NFQUEUE with unmodified public TCP replies
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$DE_PASS" && test -n "$RU_PASS"
          test -s ops/mnebydns-owner-ssh-known_hosts
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          opts=(-T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes
            -o ServerAliveInterval=5 -o ServerAliveCountMax=3
            -o HostKeyAlgorithms=ssh-ed25519
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts"
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR)
          de() { SSHPASS="$DE_PASS" sshpass -e ssh "${opts[@]}" root@89.125.90.101 "$@"; }
          ru() { SSHPASS="$RU_PASS" sshpass -e ssh "${opts[@]}" root@188.120.254.223 "$@"; }
          remote="/run/mnebydns-nfq-ab-${GITHUB_RUN_ID}.py"
          de "umask 077; set -C; cat > '$remote'" < scripts/youtube-nfq-ab-20261117.py
          de "python3 -B '$remote' inventory"
          probes() {
            echo "PHASE=$1 EXTERNAL_RUNNER"
            for host in youtubei.googleapis.com i.ytimg.com rr1---sn-gxuo03g-ig3s.googlevideo.com; do
              curl -sS --noproxy '*' --connect-timeout 4 --max-time 6 --resolve "$host:443:89.125.90.101" -o /dev/null -w "$host HTTP=%{http_code} BYTES=%{size_download} VERIFY=%{ssl_verify_result} TIME=%{time_total}\n" "https://$host/" || true
            done
            echo "PHASE=$1 RU188_PUBLIC_PATH"
            ru 'bash -s' <<'PROBES'
          set -u
          for host in youtubei.googleapis.com i.ytimg.com rr1---sn-gxuo03g-ig3s.googlevideo.com; do
            curl -sS --noproxy '*' --connect-timeout 4 --max-time 6 --resolve "$host:443:89.125.90.101" -o /dev/null -w "$host HTTP=%{http_code} BYTES=%{size_download} VERIFY=%{ssl_verify_result} TIME=%{time_total}\n" "https://$host/" || true
          done
          PROBES
          }
          probes baseline
          echo PHASE=BASELINE_PASSIVE_CAPTURE
          de 'timeout 50s python3 -B -' < scripts/de89-googlevideo-ack-window-20261117.py
          cleanup() {
            code=$?
            trap - EXIT
            de "python3 -B '$remote' cleanup" || echo INDEPENDENT_ROLLBACK_WILL_REMOVE_RULE=true
            exit "$code"
          }
          trap cleanup EXIT
          de "python3 -B '$remote' stage '$GITHUB_RUN_ID'"
          probes bypass
          echo PHASE=BYPASS_PASSIVE_CAPTURE
          de 'timeout 50s python3 -B -' < scripts/de89-googlevideo-ack-window-20261117.py
          de "python3 -B '$remote' cleanup"
          echo PHASE=RESTORED
          probes restored
          echo PERSISTENT_CONFIGURATION_CHANGED=false
