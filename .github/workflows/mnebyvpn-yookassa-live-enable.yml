name: Activate live MNEBYVPN YooKassa checkout (ShopID 1527841)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mnebyvpn-yookassa-live-enable.yml'
      - 'scripts/mnebyvpn-yookassa-live-enable.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mnebyvpn-auto-public-deploy
  cancel-in-progress: false

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HOST: '188.120.254.223'
      SSH_PASSWORD: ${{ secrets.SERVER188_SSH_PASSWORD }}
      YOOKASSA_KEY: ${{ secrets.YOOKASSA_SECRET_KEY }}
      SHOP_ID: '1527841'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate deployment shell, secrets presence and source CI
        id: source
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_PASSWORD" || { echo 'Missing SERVER188_SSH_PASSWORD'; exit 2; }
          test -n "$YOOKASSA_KEY" || { echo 'Missing YOOKASSA_SECRET_KEY'; exit 2; }
          bash -n scripts/mnebyvpn-yookassa-live-enable.sh
          bash -n scripts/mnebyvpn-auto-web-promote.sh
          curl -fsS --retry 2 --max-time 20 \
            https://api.github.com/repos/grunvald91/Mnebyvpn/git/ref/heads/main \
            -o "$RUNNER_TEMP/source.json"
          sha="$(python3 - "$RUNNER_TEMP/source.json" <<'PY'
          import json, sys
          print(json.load(open(sys.argv[1]))['object']['sha'])
          PY
          )"
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]]
          curl -fsS --retry 2 --max-time 25 \
            -H "Authorization: Bearer ${{ github.token }}" \
            'https://api.github.com/repos/grunvald91/Mnebyvpn/actions/workflows/offline-contracts.yml/runs?branch=main&status=success&per_page=8' \
            -o "$RUNNER_TEMP/ci.json"
          SOURCE="$sha" python3 - "$RUNNER_TEMP/ci.json" <<'PY'
          import json, os, sys
          runs = json.load(open(sys.argv[1])).get('workflow_runs', [])
          assert any(r.get('head_sha') == os.environ['SOURCE'] and
            r.get('conclusion') == 'success' and r.get('head_branch') == 'main' for r in runs), \
            'Source main has not passed complete CI'
          PY
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          sudo apt-get update -qq && sudo apt-get install -qq -y sshpass

      - name: Stage YooKassa secret, verify /v3/me, and promote web canary
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$SSH_PASSWORD"
          opts=(-o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=accept-new -o LogLevel=ERROR)
          sha="${{ steps.source.outputs.sha }}"
          scp_retry() {
            local rc=255
            for attempt in 1 2 3; do
              rc=0
              sshpass -e scp "${opts[@]}" "$1" "$2" || rc=$?
              [ "$rc" -ne 255 ] && return "$rc"
              echo "::warning::SCP attempt $attempt/3 failed with 255; retrying..."
              sleep 5
            done
            return "$rc"
          }
          scp_retry scripts/mnebyvpn-yookassa-live-enable.sh "root@$HOST:/tmp/mnebyvpn-yk-enable-$sha.sh"
          scp_retry scripts/mnebyvpn-auto-web-promote.sh "root@$HOST:/tmp/mnebyvpn-yk-promote-$sha.sh"
          rc=255
          for attempt in 1 2 3; do
            rc=0
            printf %s "$YOOKASSA_KEY" | sshpass -e ssh "${opts[@]}" "root@$HOST" \
              "bash /tmp/mnebyvpn-yk-enable-$sha.sh '$sha' /tmp/mnebyvpn-yk-promote-$sha.sh '$SHOP_ID'" || rc=$?
            [ "$rc" -ne 255 ] && break
            echo "::warning::SSH activation attempt $attempt/3 failed with 255; retrying..."
            sleep 5
          done
          exit "$rc"

      - name: Verify live public YooKassa catalog and webhook route
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 12 --retry 2 https://mnebyvpn.site/api/plans | python3 - <<'PY'
          import json, sys
          a = json.load(sys.stdin)
          assert a['checkoutEnabled'] is True, a
          assert a['paymentProvider'] == 'yookassa', a
          assert len(a['plans']) == 12, len(a['plans'])
          print('external_yookassa_catalog=verified')
          PY
          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 -X POST -H 'Content-Type: text/plain' https://mnebyvpn.site/webhooks/yookassa || true)"
          echo "external_yookassa_webhook_415_check=$code"
          test "$code" = 415

      - name: Cleanup temporary remote installers
        if: always()
        shell: bash
        run: |
          if [[ -n "$SSH_PASSWORD" ]]; then
            export SSHPASS="$SSH_PASSWORD"
            sha="${{ steps.source.outputs.sha }}"
            sshpass -e ssh -o ConnectTimeout=8 -o StrictHostKeyChecking=accept-new \
              -o LogLevel=ERROR "root@$HOST" \
              "rm -f /tmp/mnebyvpn-yk-enable-$sha.sh /tmp/mnebyvpn-yk-promote-$sha.sh" || true
          fi
