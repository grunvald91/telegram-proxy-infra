name: MNEBYDNS RU188 observed rejected domains (read only)
on:
  push:
    branches: [fix/mnebydns-full-tcp-allowlist-quic-20261114]
    paths: ['.github/workflows/mnebydns-ru-rejected-sni-readonly.yml']
permissions: {contents: read}
concurrency:
  group: mnebydns-ru-rejected-sni-readonly
  cancel-in-progress: true
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RU_PASS: ${{ secrets.SERVER188_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Observe UDP443 admission names in memory for 120 seconds
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import ast,pathlib
          ast.parse(pathlib.Path('scripts/mnebydns-ru-rejected-sni-readonly.py').read_text())
          PY
          test -n "$RU_PASS" && test -s ops/mnebydns-owner-ssh-known_hosts
          if ! command -v sshpass >/dev/null;then
            sudo apt-get update -qq
            sudo apt-get install -qq -y sshpass >/dev/null
          fi
          SSHPASS="$RU_PASS" sshpass -e ssh -T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR \
            root@188.120.254.223 'python3 -B - 120' < scripts/mnebydns-ru-rejected-sni-readonly.py
