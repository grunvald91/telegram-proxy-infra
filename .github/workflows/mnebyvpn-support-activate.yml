# Support bridge activation 2026-11-07: source 33a5cc73 (both web/bot ready; site DB migration + HMAC).
name: MNEBYVPN activate support through existing Telegram webhook
on:
  push:
    branches: [main]
    paths: ['.github/workflows/mnebyvpn-support-activate.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mnebyvpn-support-activation
  cancel-in-progress: false
jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: mnebyvpn-support
    env:
      SSH_PASSWORD: ${{ secrets.SERVER188_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate existing MNEBYVPN-only support activation
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_PASSWORD" || { echo 'Existing infrastructure server SSH secret unavailable'; exit 2; }
          test -s ops/secure/mnebyvpn-support-owner.enc.b64
          bash -n scripts/mnebyvpn-support-webhook-activate.sh
          bash -n scripts/mnebyvpn-main-bot-promote.sh
          bash -n scripts/mnebyvpn-auto-web-promote.sh
          sudo apt-get update -qq
          sudo apt-get install -qq -y sshpass
      - name: Transfer only script and encrypted operator ID over existing SSH
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$SSH_PASSWORD"
          opts=(-o ConnectTimeout=12 -o StrictHostKeyChecking=accept-new -o LogLevel=ERROR)
          sshpass -e scp "${opts[@]}" scripts/mnebyvpn-support-webhook-activate.sh \
            root@188.120.254.223:/tmp/mnebyvpn-support-webhook.sh
          sshpass -e scp "${opts[@]}" ops/secure/mnebyvpn-support-owner.enc.b64 \
            root@188.120.254.223:/tmp/mnebyvpn-support-owner.enc.b64
          sshpass -e scp "${opts[@]}" scripts/mnebyvpn-main-bot-promote.sh \
            root@188.120.254.223:/tmp/mnebyvpn-support-bot-promote.sh
          sshpass -e scp "${opts[@]}" scripts/mnebyvpn-auto-web-promote.sh \
            root@188.120.254.223:/tmp/mnebyvpn-support-web-promote.sh
      - name: Enable support via original webhook bot without any Bot API token
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$SSH_PASSWORD"
          sshpass -e ssh -T -o ConnectTimeout=12 -o StrictHostKeyChecking=accept-new \
            -o LogLevel=ERROR root@188.120.254.223 \
            'bash /tmp/mnebyvpn-support-webhook.sh /tmp/mnebyvpn-support-owner.enc.b64 /tmp/mnebyvpn-support-bot-promote.sh /tmp/mnebyvpn-support-web-promote.sh'
          echo 'same_bot_tokenless_support_activated=true'
      - name: Clean up only this MNEBYVPN support release files
        if: always()
        shell: bash
        run: |
          if [[ -n "$SSH_PASSWORD" ]]; then
            export SSHPASS="$SSH_PASSWORD"
            sshpass -e ssh -o ConnectTimeout=9 -o StrictHostKeyChecking=accept-new \
              -o LogLevel=ERROR root@188.120.254.223 \
              'rm -f /tmp/mnebyvpn-support-webhook.sh /tmp/mnebyvpn-support-owner.enc.b64 /tmp/mnebyvpn-support-bot-promote.sh /tmp/mnebyvpn-support-web-promote.sh' || true
          fi
