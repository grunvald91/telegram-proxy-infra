name: MNEBYDNS existing personal :8856 authorization cache 60s guarded release
on:
  push:
    branches: [feat/mnebydns-personal-60s-auth-cache-release-20261114]
    paths:
      - 'scripts/mnebydns-personal-auth60-inplace-20261114.sh'
      - '.github/workflows/mnebydns-personal-auth-cache-60s-release-20261114.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mnebydns-existing-personal-auth60-inplace-20261114
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      RU_PASS: ${{ secrets.SERVER188_SSH_PASSWORD }}
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
      APP_SHA: a9a7aa5dad9049ef02ea8eeb60b2e1a2c8c6aeac
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Audit exact tested source and static guards before any server access
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n scripts/mnebydns-personal-auth60-inplace-20261114.sh
          test -s ops/mnebydns-owner-ssh-known_hosts
          test -n "$RU_PASS" && test -n "$DE_PASS"
          [[ "$APP_SHA" =~ ^[a-f0-9]{40}$ ]]
          git clone --no-checkout --filter=blob:none -q https://github.com/grunvald91/Mnebyvpn.git /tmp/mnebyvpn-app
          git -C /tmp/mnebyvpn-app fetch --depth=1 -q origin "$APP_SHA"
          git -C /tmp/mnebyvpn-app checkout -q --detach "$APP_SHA"
          test "$(git -C /tmp/mnebyvpn-app rev-parse HEAD)" = "$APP_SHA"
          path=/tmp/mnebyvpn-app/packages/dns-policy/src/personal-dot-listener.ts
          test -s "$path"
          grep -Fq 'const AUTH_RECHECK_MS=60000;' "$path"
          grep -Fq "reserve_personal_dns_query" "$path"
          grep -Fq "finish_personal_dns_query" "$path"
          sha256sum "$path" | cut -d' ' -f1 > /tmp/mnebydns-auth60-source.sha
          test "$(wc -c < /tmp/mnebydns-auth60-source.sha)" -eq 65
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass >/dev/null
          echo 'AUTH60_TESTED_APP_SHA_VERIFIED=true'
      - name: Verify DE public SNI still routes to existing RU :8856
        shell: bash
        run: |
          set -Eeuo pipefail
          export SSHPASS="$DE_PASS"
          opts=(-T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts"
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR)
          sshpass -e ssh "${opts[@]}" root@89.125.90.101 'python3 -' <<'PY'
          import pathlib,subprocess
          p=pathlib.Path('/etc/mnebydns/personal-sni/nginx.conf').read_bytes()
          assert p.count(b'10.66.77.2:8856;')==1
          assert p.count(b'default 89.125.90.101:853;')==1
          assert subprocess.run(['systemctl','is-active','--quiet','mnebydns-dot']).returncode==0
          print('AUTH60_DE_EXISTING_ROUTE_AND_COREDNS=PRESERVED')
          PY
      - name: Stage isolated temporary private canary; leave original :8856 untouched
        id: stage
        shell: bash
        run: |
          set -Eeuo pipefail
          export SSHPASS="$RU_PASS"
          opts=(-o ConnectTimeout=12 -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts"
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR)
          sha="$(cat /tmp/mnebydns-auth60-source.sha)"
          sshpass -e scp -q "${opts[@]}" /tmp/mnebyvpn-app/packages/dns-policy/src/personal-dot-listener.ts root@188.120.254.223:/tmp/mnebydns-personal-auth60-listener-20261114.ts
          sshpass -e scp -q "${opts[@]}" scripts/mnebydns-personal-auth60-inplace-20261114.sh root@188.120.254.223:/tmp/mnebydns-personal-auth60-inplace-20261114.sh
          sshpass -e ssh -T "${opts[@]}" root@188.120.254.223 "bash /tmp/mnebydns-personal-auth60-inplace-20261114.sh stage $sha"
      - name: Upgrade same existing private personalized :8856 container with independent rollback
        id: promote
        shell: bash
        run: |
          set -Eeuo pipefail
          export SSHPASS="$RU_PASS"
          sha="$(cat /tmp/mnebydns-auth60-source.sha)"
          sshpass -e ssh -T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts" -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR root@188.120.254.223 "bash /usr/local/sbin/mnebydns-personal-auth60-inplace-20261114 promote $sha"
      - name: Check public original legacy DNS and private wildcard TLS + deny unauthorized
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import socket,ssl,struct,secrets
          addr=('89.125.90.101',853)
          ctx=ssl.create_default_context()
          tid=secrets.randbelow(65534)+1
          q=struct.pack('!HHHHHH',tid,256,1,0,0,0)+b'\x07example\x03com\x00'+struct.pack('!HH',1,1)
          frame=struct.pack('!H',len(q))+q
          with socket.create_connection(addr,timeout=8) as raw:
              raw.settimeout(8)
              with ctx.wrap_socket(raw,server_hostname='dns.mnebyvpn.site') as tls:
                  tls.sendall(frame)
                  size=tls.recv(2)
                  assert len(size)==2
                  n=struct.unpack('!H',size)[0]
                  assert 12<=n<=16384
                  answer=b''
                  while len(answer)<n:
                      chunk=tls.recv(n-len(answer))
                      assert chunk
                      answer+=chunk
                  assert answer[:2]==q[:2] and answer[2]&128
          print('AUTH60_PUBLIC_LEGACY_DNS=PASS')
          with socket.create_connection(addr,timeout=8) as raw:
              raw.settimeout(8)
              with ctx.wrap_socket(raw,server_hostname='zzzzzzzzzzzz.dns.mnebyvpn.site') as tls:
                  assert tls.getpeercert()
                  tls.sendall(frame)
                  try: reply=tls.recv(2)
                  except ssl.SSLEOFError: reply=b''
                  assert reply==b''
          print('AUTH60_PUBLIC_WILDCARD_TLS=PASS')
          print('AUTH60_UNKNOWN_KEY_DENIED=PASS')
          PY
      - name: Verify original named container runs new reviewed listener, not duplicate
        shell: bash
        run: |
          set -Eeuo pipefail
          export SSHPASS="$RU_PASS"
          opts=(-T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts"
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR)
          sshpass -e ssh "${opts[@]}" root@188.120.254.223 'bash /usr/local/sbin/mnebydns-personal-auth60-inplace-20261114 status'
          sshpass -e ssh "${opts[@]}" root@188.120.254.223 'test "$(docker inspect -f "{{.State.Running}}" mnebydns-personal-dot)" = true; echo AUTH60_ORIGINAL_8853_UNCHANGED=true'
      - name: Finalize and remove temporary canary after full green checks
        id: finalize
        shell: bash
        run: |
          set -Eeuo pipefail
          export SSHPASS="$RU_PASS"
          sshpass -e ssh -T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts" -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR root@188.120.254.223 'bash /usr/local/sbin/mnebydns-personal-auth60-inplace-20261114 finalize'
          echo 'Existing personalized DNS unchanged: same key hostname, port 8856 and 153-domain policy. Auth recognition cached at most 60 seconds. Premium queries continue reserve and settle for every upstream DNS answer, including cache hits.' >> "$GITHUB_STEP_SUMMARY"
      - name: Independently restore original 8856 if any post-promotion step fails
        if: ${{ failure() && steps.promote.outcome == 'success' && steps.finalize.outcome != 'success' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          export SSHPASS="$RU_PASS"
          sshpass -e ssh -T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts" -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR root@188.120.254.223 'bash /usr/local/sbin/mnebydns-personal-auth60-inplace-20261114 rollback'
