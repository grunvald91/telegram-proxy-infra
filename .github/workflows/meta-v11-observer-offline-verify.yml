name: Meta v11 SNI observer correctness (offline only)

on:
  push:
    branches: [fix/meta-routing-quic-sni-validation]
    paths:
      - 'scripts/mnebydns_iglite_sni_observer.py'
      - 'scripts/tests/test_mnebydns_iglite_sni_observer.py'
      - '.github/workflows/meta-v11-observer-offline-verify.yml'
      - 'docs/meta-v11-corrective-audit-20261111.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile observer and run synthetic PCAP boundary regression tests
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/mnebydns_iglite_sni_observer.py scripts/tests/test_mnebydns_iglite_sni_observer.py
          python3 -m unittest discover -s scripts/tests -p 'test_mnebydns_iglite_sni_observer.py' -v
      - name: Check evidence reporting contract without any production credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source=Path('scripts/mnebydns_iglite_sni_observer.py').read_text()
          assert 'sni_boundary_indeterminate' in source
          assert 'iglite_sni_android_identified=false' in source
          assert 'iglite_sni_pcap_written_to_disk=false' in source
          assert "first=stream.read(1)" in source
          print('offline_evidence_contract=PASS')
          print('production_ssh_or_deploy=NOT_REQUESTED')
          PY
