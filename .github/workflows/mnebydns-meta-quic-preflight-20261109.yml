name: MNEBYDNS Meta QUIC UDP read-only server preflight
on:
  push:
    branches: [diagnostics/mnebydns-meta-ingress-matrix-20261109]
    paths: [.github/workflows/mnebydns-meta-quic-preflight-20261109.yml]
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
      RU_PASS: ${{ secrets.SERVER188_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate synthetic QUIC v1 before touching servers
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/mnebydns-meta-quic.py
          python3 scripts/test-mnebydns-meta-quic.py
      - name: Read only WireGuard and socket prerequisites (no raw configs or secrets)
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$DE_PASS" && test -n "$RU_PASS"
          sudo apt-get update -qq && sudo apt-get install -qq -y sshpass
          export SSHPASS="$DE_PASS"
          sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=12 -o LogLevel=ERROR root@89.125.90.101 'python3 -' <<'PY'
          import importlib.util,pathlib,subprocess,socket,ipaddress
          print('DE_python_cryptography='+str(importlib.util.find_spec('cryptography') is not None).lower(),flush=True)
          for ip in ('10.66.77.1','10.66.77.2'):
              r=subprocess.run(['ip','-4','route','get',ip],capture_output=True,text=True)
              print('DE_route_'+ip+'_via_WG='+str('tg-relay' in r.stdout).lower(),flush=True)
          r=subprocess.run(['ip','-4','-o','addr','show','dev','tg-relay'],capture_output=True,text=True)
          print('DE_WG_ip_expected='+str('10.66.77.1/' in r.stdout).lower(),flush=True)
          s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM)
          try:
              s.bind(('10.66.77.1',19444))
              print('DE_UDP19444_bind_available=true',flush=True)
          except Exception as e:print('DE_UDP19444_bind_available=false type='+type(e).__name__,flush=True)
          finally:s.close()
          for host in ('i.instagram.com','test-gateway.instagram.com','graph.instagram.com'):
              try:
                  ips=socket.getaddrinfo(host,443,socket.AF_INET,socket.SOCK_DGRAM)
                  valid=any(ipaddress.ip_address(v[4][0]).is_global for v in ips)
                  print('DE_origin_dns_'+host+'='+str(valid).lower(),flush=True)
              except Exception as e:print('DE_origin_dns_'+host+'='+type(e).__name__,flush=True)
          print('DE_readonly_preflight=true')
          PY
          export SSHPASS="$RU_PASS"
          sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=12 -o LogLevel=ERROR root@188.120.254.223 'python3 -' <<'PY'
          import importlib.util,subprocess,socket
          print('RU_python_cryptography='+str(importlib.util.find_spec('cryptography') is not None).lower(),flush=True)
          r=subprocess.run(['ip','-4','-o','addr','show','dev','tg-relay'],capture_output=True,text=True)
          print('RU_WG_ip_expected='+str('10.66.77.2/' in r.stdout).lower(),flush=True)
          r=subprocess.run(['ip','-4','route','get','10.66.77.1'],capture_output=True,text=True)
          print('RU_to_DE_WG_route='+str('tg-relay' in r.stdout).lower(),flush=True)
          s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM)
          try:
              s.bind(('0.0.0.0',443))
              print('RU_UDP443_bind_available=true',flush=True)
          except Exception as e:print('RU_UDP443_bind_available=false type='+type(e).__name__,flush=True)
          finally:s.close()
          print('RU_readonly_preflight=true',flush=True)
          PY