name: MNEBYDNS DE89 restoration - current live inventory (read-only)
# Read-only post-Meta v30 and personal policy release verification.
on:
  push:
    branches: [restore/mnebydns-de89-20261115]
    paths: ['.github/workflows/mnebydns-de89-restoration-inventory-20261115.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: mnebydns-de89-restoration-audit
  cancel-in-progress: false
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
      RU_PASS: ${{ secrets.SERVER188_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Check pinned SSH and install client
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s ops/mnebydns-owner-ssh-known_hosts
          test -n "$DE_PASS" && test -n "$RU_PASS"
          sudo apt-get -qq update
          sudo apt-get -qq install -y sshpass >/dev/null
      - name: Read-only DE89 live CoreDNS, proxy and checkpoint inventory
        shell: bash
        run: |
          set -Eeuo pipefail
          export SSHPASS="$DE_PASS"
          sshpass -e ssh -T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts" -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR root@89.125.90.101 'python3 -' <<'PY'
          import collections,hashlib,json,pathlib,re,subprocess
          p=pathlib.Path('/opt/mnebydns-dot/Corefile')
          c=p.read_text()
          answers=re.findall(r'(?m)^\s*answer\s+"\{\{ \.Name \}\}\s+\d+\s+IN\s+A\s+((?:\d{1,3}\.){3}\d{1,3})"',c)
          headers=re.findall(r'(?m)^\s*template\s+IN\s+A\s+([^\s{]+)\s*\{',c)
          n=pathlib.Path('/etc/nginx/nginx.conf').read_text()
          ptr=pathlib.Path('/opt/mnebydns-stable-checkpoints/current').read_text().strip()
          svcs={s:subprocess.run(['systemctl','is-active',s],capture_output=True,text=True).stdout.strip() for s in ['nginx','mnebydns-dot.service','mnebydns-googlepilot.service']}
          owners_core=re.findall(r'(?m)^\\s*# BEGIN MNEBYDNS_OWNER_EXACT_([A-Za-z0-9_]+)',c)
          owners_nginx=re.findall(r'(?m)^\\s*# BEGIN MNEBYDNS_OWNER_EXACT_([A-Za-z0-9_]+)',n)
          repeat_core={name:count for name,count in collections.Counter(owners_core).items() if count>1}
          current_template=''
          wrong=[]
          for line in c.splitlines():
            found=re.match(r'\\s*template\\s+IN\\s+A\\s+(\\S+)\\s*\\{',line)
            if found: current_template=found.group(1)
            if re.search(r'\\sIN\\sA\\s+188[.]120[.]254[.]223"',line):
              wrong.append(current_template)
          ck=(pathlib.Path(ptr)/'dns.stable').read_bytes()
          print('DE89_A_DRIFT_DETAILS='+json.dumps({'ru188_template_names':wrong,'repeated_owner_count':len(repeat_core),'repeated_owner_samples':list(repeat_core.items())[:12],'owner_missing_in_nginx':sorted(set(owners_core)-set(owners_nginx))[:20],'checkpoint_matches_live':ck==p.read_bytes(),'checkpoint_a_rules':len(re.findall(r'(?m)^\\s*template\\s+IN\\s+A\\s+([^\\s{]+)\\s*\\{',ck.decode())),'mtime_utc':__import__('datetime').datetime.fromtimestamp(p.stat().st_mtime,__import__('datetime').timezone.utc).isoformat()},sort_keys=True))
          print('GOOGLE_VIDEO_RULES='+str({'googlevideo':c.count('googlevideo'),'ytimg':c.count('ytimg'),'youtube':c.count('youtube'),'googleapis':c.count('googleapis')}))
          google_keys=('googlevideo','youtube','ytimg','googleapis')
          print('YOUTUBE_CORE_RELEVANT='+json.dumps([line.strip() for line in c.splitlines() if any(k in line.lower() for k in google_keys)][:24]))
          print('YOUTUBE_NGINX_RELEVANT='+json.dumps([line.strip() for line in n.splitlines() if any(k in line.lower() for k in google_keys)][:24]))
          udp=subprocess.run(['ss','-Hulnp'],capture_output=True,text=True).stdout
          print('YOUTUBE_UDP443_LISTENERS='+json.dumps([line.strip()[:240] for line in udp.splitlines() if ':443 ' in line][:10]))
          firewall=subprocess.run(['iptables','-S'],capture_output=True,text=True).stdout
          print('YOUTUBE_UDP443_FIREWALL='+json.dumps([line.strip()[:200] for line in firewall.splitlines() if '443' in line and ('udp' in line.lower() or 'DROP' in line or 'REJECT' in line)][:18]))
          pilot=pathlib.Path('/etc/mnebydns-googlepilot/nginx.conf').read_text()
          print('YOUTUBE_EDGE_NGINX_GOOGLEVIDEO='+json.dumps([line.strip()[:240] for line in n.splitlines() if 'googlevideo' in line.lower()][:20]))
          print('YOUTUBE_PILOT_UPSTREAM='+json.dumps([line.strip()[:240] for line in pilot.splitlines() if any(k in line.lower() for k in ('proxy_pass','resolver','15449','googlevideo','listen','proxy_timeout'))][:28]))
          tcp=subprocess.run(['ss','-Hlnt'],capture_output=True,text=True).stdout
          print('YOUTUBE_15449_LISTENER='+json.dumps([line.strip() for line in tcp.splitlines() if ':15449 ' in line][:8]))
          fw=subprocess.run(['nft','list','ruleset'],capture_output=True,text=True).stdout
          print('YOUTUBE_NFT_UDP443='+json.dumps([line.strip()[:210] for line in fw.splitlines() if ('443' in line and 'udp' in line.lower())][:20]))
          journal=subprocess.run(['journalctl','-u','mnebydns-googlepilot.service','--since','-15min','--no-pager','-q','-n','80'],capture_output=True,text=True).stdout
          print('YOUTUBE_PILOT_RECENT_LOG_TYPES='+json.dumps({'lines':len(journal.splitlines()),'errors':sum(any(k in x.lower() for k in ('error','fail','timeout','refused','no resolver')) for x in journal.splitlines())}))
          policies=subprocess.run(['iptables','-S','INPUT'],capture_output=True,text=True).stdout
          print('YOUTUBE_DE_INPUT_POLICY='+json.dumps(policies.splitlines()[:35]))
          print('YOUTUBE_DE_NFT_INPUT_POLICIES='+json.dumps([x.strip()[:160] for x in fw.splitlines() if 'hook input' in x or 'policy drop' in x][:20]))
          import socket
          with socket.socket(socket.AF_INET,socket.SOCK_DGRAM) as sock:
            sock.settimeout(2)
            try:
              sock.connect(('89.125.90.101',443));sock.send(b'UDP443-LOCAL-READONLY');sock.recv(100);res='reply'
            except Exception as exc:res=type(exc).__name__
          print('YOUTUBE_UDP443_DE_LOCAL='+res)
          for svc in ('mnebydns-de89-public-quic-20261115.service','mnebydns-youtube-quic-de-43612369808.service','mnebydns-googlepilot.service'):
            psvc=subprocess.run(['systemctl','is-active',svc],capture_output=True,text=True)
            print('VIDEO_SERVER_SERVICE='+svc+':'+psvc.stdout.strip())
          print('VIDEO_SERVER_X_ROUTE='+json.dumps([x.strip()[:260] for x in n.splitlines() if 'twimg' in x or 'video.' in x and 'twitter' in x][:18]))
          for name,filename in (('stream','/var/log/nginx/error.log'),('pilot','/var/log/mnebydns-googlepilot/error.log')):
            fp=pathlib.Path(filename)
            if fp.exists():
              last=fp.read_text(errors='replace').splitlines()[-300:]
              print('VIDEO_SERVER_LOG_AGG='+json.dumps({'name':name,'last_lines':len(last),'timeouts':sum('timed out' in t.lower() for t in last),'upstream_errors':sum('upstream' in t.lower() for t in last),'refused':sum('refused' in t.lower() for t in last)}))
          udp443=subprocess.run(['ss','-Hulnp'],capture_output=True,text=True).stdout
          print('VIDEO_SERVER_PUBLIC_UDP443='+json.dumps([x.strip()[:200] for x in udp443.splitlines() if ':443 ' in x]))
          import os
          snapshots={}
          for label,live in (('nginx',pathlib.Path('/etc/nginx/nginx.conf')),('proxy',pathlib.Path('/etc/mnebydns-googlepilot/nginx.conf')),('dns',p)):
            saved=pathlib.Path(ptr)/(label+'.stable')
            snapshots[label]={'live_sha':hashlib.sha256(live.read_bytes()).hexdigest(),'checkpoint_sha':hashlib.sha256(saved.read_bytes()).hexdigest() if saved.is_file() else None,'equal':saved.is_file() and live.read_bytes()==saved.read_bytes()}
          nft=subprocess.run(['nft','-a','list','chain','inet','telegram_nfqws','post'],capture_output=True,text=True)
          lines=nft.stdout.splitlines()
          matched=[s.strip() for s in lines if ('sport 443' in s or 'queue' in s.lower())]
          quiclog=subprocess.run(['journalctl','-u','mnebydns-de89-public-quic-20261115.service','--since','-20min','-o','cat','--no-pager','-q','-n','300'],capture_output=True,text=True).stdout
          quiclines=[x for x in quiclog.splitlines() if 'youtube_quic_de-public_active=' in x]
          counters={}
          for line in quiclines[-1:]:
            counters={k:int(v) for k,v in re.findall(r'(\w+)=(\d+)',line)}
          print('DE89_DIRECT_QUIC_AGGREGATES='+json.dumps({'recent_counter_lines':len(quiclines),'latest':counters},sort_keys=True))
          print('DE89_NFQUEUE_MEDIA_PATH='+json.dumps({'exit_code':nft.returncode,'rules':matched[:14],'current_service':subprocess.run(['systemctl','is-active','telegram-nfqws.service'],capture_output=True,text=True).stdout.strip()},sort_keys=True))
          print('MEDIA_CONFIG_VS_RESTORED_CHECKPOINT='+json.dumps(snapshots,sort_keys=True))
          out={}
          for label,src in (('stream',n),('pilot',pilot)):
            lines=[s.strip() for s in src.splitlines()]
            out[label]={'googlevideo':next((s[:1200] for s in lines if 'googlevideo' in s.lower()),'missing'),'video_twimg':next((s[:180] for s in lines if 'video.twimg.com ' in s),'missing'),'pbs_twimg':next((s[:180] for s in lines if 'pbs.twimg.com ' in s),'missing'),'timeouts':[s[:100] for s in lines if s.startswith('proxy_timeout ')][:3],'buffer':[s[:100] for s in lines if s.startswith('proxy_buffer_size ')][:3]}
          print('MEDIA_DE89_ROUTE_MAPS='+json.dumps(out,sort_keys=True))
          for destination in ('89.125.90.101:443','127.0.0.1:15449','127.0.0.1:19444'):
            print('MEDIA_LISTENER_REFERENCE='+destination)
          print('DE89_READONLY_INVENTORY='+json.dumps({'corefile_sha256':hashlib.sha256(c.encode()).hexdigest(),'core_a_answer_counts':dict(collections.Counter(answers)),'core_a_templates':len(headers),'owner_exact_core_markers':c.count('# BEGIN MNEBYDNS_OWNER_EXACT_'),'owner_exact_nginx_markers':n.count('# BEGIN MNEBYDNS_OWNER_EXACT_'),'nginx_sni_map_exists':'map $ssl_preread_server_name $direct_mtproxy_backend {' in n,'checkpoint':ptr,'services':svcs},sort_keys=True))
          assert answers and set(answers) <= {'188.120.254.223','89.125.90.101'},'UNEXPECTED_CORE_A_ADDRESS'
          assert len(headers) >= 264 and len(headers)==len(answers),'CORE_A_STRUCTURE_DRIFT'
          assert 'map $ssl_preread_server_name $direct_mtproxy_backend {' in n,'DE89_SNI_MAP_ABSENT'
          PY
      - name: Read-only RU188 DNS ingress and personal gateway metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          export SSHPASS="$RU_PASS"
          sshpass -e ssh -T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts" -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR root@188.120.254.223 'python3 -' <<'PY'
          import json,pathlib,subprocess
          p=pathlib.Path('/etc/nginx/streams.d/01-mtproxy-stdports.conf')
          s=p.read_text()
          services={name:subprocess.run(['systemctl','is-active',name],capture_output=True,text=True).stdout.strip() for name in ['nginx','docker']}
          report={'ru853_demux_installed':'$mnebydns_ru853_target' in s,'ru853_to_de_wg':'10.66.77.1:8854' in s,'services':services}
          try:
              obj=json.loads(subprocess.check_output(['docker','inspect','mnebydns-personal-dot-private'],text=True))[0]
              env=dict(v.split('=',1) for v in obj['Config']['Env'] if '=' in v)
              report['personal_running']=obj['State']['Running']
              report['personal_policy_basename']=pathlib.PurePath(env.get('MNEBYDNS_PERSONAL_DOT_ROUTE_POLICY_FILE','')).name
              report['personal_mapped_dot']=env.get('MNEBYDNS_PERSONAL_MAPPED_DOT_IP','')+':'+env.get('MNEBYDNS_PERSONAL_MAPPED_DOT_PORT','')
          except (OSError,subprocess.CalledProcessError,ValueError,KeyError) as exc:
              report['personal_container_error']=type(exc).__name__
          with __import__('socket').socket(__import__('socket').AF_INET,__import__('socket').SOCK_DGRAM) as sock:
            sock.settimeout(3)
            try:
              sock.connect(('89.125.90.101',443));sock.send(b'UDP443-RU-READONLY');sock.recv(100);status='reply'
            except Exception as exc:status=type(exc).__name__
          print('YOUTUBE_UDP443_RU_TO_DE='+status)
          print('RU188_READONLY_INVENTORY='+json.dumps(report,sort_keys=True))
          PY
      - name: Differential real TLS and HTTP into the same DE89 server via public TCP and WireGuard
        shell: bash
        run: |
          set -Eeuo pipefail
          export SSHPASS="$RU_PASS"
          sshpass -e ssh -T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts" -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR root@188.120.254.223 'python3 -' <<'PY'
          import json,socket,ssl,time
          domains=('www.youtube.com','rr1---sn-gxuo03g-ig3s.googlevideo.com','video.twimg.com','pbs.twimg.com')
          for domain in domains:
            for route,ip in (('PUBLIC_TCP','89.125.90.101'),('ENCRYPTED_WG_TCP','10.66.77.1')):
              item={'domain':domain,'route':route}
              started=time.monotonic()
              try:
                with socket.create_connection((ip,443),timeout=4) as sock:
                  sock.settimeout(5)
                  item['tcp_ms']=round(1000*(time.monotonic()-started))
                  try:
                    with ssl.create_default_context().wrap_socket(sock,server_hostname=domain) as tls:
                      tls.settimeout(5)
                      item['tls_ms']=round(1000*(time.monotonic()-started))
                      item['tls_version']=tls.version()
                      tls.sendall(('GET / HTTP/1.1\r\nHost: '+domain+'\r\nConnection: close\r\n\r\n').encode())
                      try:
                        item['http_line']=tls.recv(160).split(b'\r\n',1)[0].decode('ascii','replace')[:80]
                      except Exception as e:
                        item['http_error']=type(e).__name__
                  except Exception as e:
                    item['tls_error']=type(e).__name__
              except Exception as e:
                item['tcp_error']=type(e).__name__
              item['elapsed_ms']=round(1000*(time.monotonic()-started))
              print('MEDIA_TLS_PUBLIC_VS_WG='+json.dumps(item,sort_keys=True),flush=True)
          PY
      - name: Compare TLS12 short hello and TLS13 modern hello over public and private paths
        shell: bash
        run: |
          set -Eeuo pipefail
          export SSHPASS="$RU_PASS"
          sshpass -e ssh -T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts" -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR root@188.120.254.223 'python3 -' <<'PY'
          import json,socket,ssl,time
          for host in ('rr1---sn-gxuo03g-ig3s.googlevideo.com','pbs.twimg.com'):
            for label,version in (('TLS12',ssl.TLSVersion.TLSv1_2),('TLS13',ssl.TLSVersion.TLSv1_3)):
              ctx=ssl.create_default_context()
              ctx.minimum_version=version
              ctx.maximum_version=version
              for route,ip in (('PUBLIC','89.125.90.101'),('WG','10.66.77.1')):
                report={'host':host,'tls':label,'route':route}
                start=time.monotonic()
                try:
                  with socket.create_connection((ip,443),timeout=4) as sock:
                    report['tcp_ms']=round(1000*(time.monotonic()-start))
                    sock.settimeout(4)
                    with ctx.wrap_socket(sock,server_hostname=host) as secured:
                      report['tls_status']=secured.version()
                      report['tls_ms']=round(1000*(time.monotonic()-start))
                except Exception as exc:
                  report['error']=type(exc).__name__
                print('MEDIA_TLS_VERSION_DIFFERENTIAL='+json.dumps(report,sort_keys=True),flush=True)
          PY
      - name: Read-only current DNS administration database summary (no personal rows)
        shell: bash
        run: |
          set -Eeuo pipefail
          export SSHPASS="$RU_PASS"
          sshpass -e ssh -T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts" -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR root@188.120.254.223 "docker exec mnebyvpn-stage-postgres psql -XqAt -v ON_ERROR_STOP=1 -U mnebyvpn_stage -d mnebyvpn_stage -c 'SELECT status,count(*) FROM dns_admin_domains GROUP BY status ORDER BY status' | sed 's/^/DOMAIN_ADMIN_DB_STATUS=/'"
      - name: Read-only public DoT and current authoritative name resolution
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json,socket,ssl,struct
          result={}
          for name in ('dns.mnebyvpn.site','aaaaaaaaaaaa.dns.mnebyvpn.site'):
            try:
              result[name]=sorted({a[4][0] for a in socket.getaddrinfo(name,853,family=socket.AF_INET,type=socket.SOCK_STREAM)})
            except Exception as e:
