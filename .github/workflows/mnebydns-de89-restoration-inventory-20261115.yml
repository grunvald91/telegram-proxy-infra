            report={'bytes':len(payload),'http_status':payload.split(b'\r\n',1)[0].decode('ascii','replace')[:90],'mentions_googlevideo':b'googlevideo' in payload,'mentions_streamingData':b'streamingData' in payload,'bot_challenge':b'confirm you\'re not a bot' in payload.lower()}
          except Exception as exc:
