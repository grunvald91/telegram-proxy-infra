                  result[ip+':853']='TLS_CERT_VALID'
            except Exception as e:
              result[ip+':853']=type(e).__name__
          import sys
          sys.path.insert(0,'scripts')
          from mnebydns_reliability_monitor import dot_query
          youtube_hosts=('www.youtube.com','youtubei.googleapis.com','i.ytimg.com','redirector.googlevideo.com','r1---sn-test.googlevideo.com')
          youtube_results={}
          for host in youtube_hosts:
