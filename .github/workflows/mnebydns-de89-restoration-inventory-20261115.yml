                  tls.sendall(('GET / HTTP/1.1\r\nHost: '+host+'\r\nUser-Agent: MNEBYDNS-readonly\r\nRange: bytes=0-1023\r\nConnection: close\r\n\r\n').encode())
                  status_line=tls.recv(256).split(b'\r\n',1)[0]
