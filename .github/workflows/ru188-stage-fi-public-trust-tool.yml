name: RU188 FI operator-gated public trust tool only (one-shot)
"on":
  push:
    branches: [main]
    paths: [.github/workflows/ru188-stage-fi-public-trust-tool.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ru188-fi-public-trust-tool
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      RU_PASSWORD: ${{ secrets.SERVER188_SSH_PASSWORD }}
      SOURCE_SHA: 'd2fe653b33a9ac4438c8b5f12f4de46142e0038d'
    steps:
      - uses: actions/checkout@v4
        with:
          path: infra
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: grunvald91/Mnebyvpn
          ref: d2fe653b33a9ac4438c8b5f12f4de46142e0038d
          path: vpn
          persist-credentials: false
      - name: Verify reviewed source and pinned SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RU_PASSWORD"
          test "$(git -C vpn rev-parse HEAD)" = "$SOURCE_SHA"
          python3 -m py_compile vpn/ops/controller188-systemd/stage-fi-public-trust.py
          bash -n infra/scripts/ru188-install-fi-public-trust-tool.sh
          grep -q '^188\.120\.254\.223 ssh-ed25519 ' infra/ops/mnebydns-owner-ssh-known_hosts
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends sshpass >/dev/null
      - name: Install ONLY root-only operator-gated trust verifier on existing RU188
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$RU_PASSWORD"
          opts=(-F /dev/null -o ConnectTimeout=12 -o BatchMode=no
            -o PasswordAuthentication=yes -o PubkeyAuthentication=no
            -o KbdInteractiveAuthentication=no -o StrictHostKeyChecking=yes
            -o HostKeyAlgorithms=ssh-ed25519
            -o "UserKnownHostsFile=$PWD/infra/ops/mnebydns-owner-ssh-known_hosts"
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no
            -o ForwardAgent=no -o ClearAllForwardings=yes -o LogLevel=ERROR)
          source_file="vpn/ops/controller188-systemd/stage-fi-public-trust.py"
          expected="$(sha256sum "$source_file" | awk '{print $1}')"
          # Stream reviewed code over the already-pinned SSH session.
          # No SCP subsystem; never overwrite a different root-owned file.
          sshpass -e ssh -T "${opts[@]}" root@188.120.254.223 \
            "set -eu; umask 077; p=/run/mnebyvpn-fi-trust-tool-reviewed.py;
             if [ -e \"\$p\" ] || [ -L \"\$p\" ]; then
               test -f \"\$p\" && test ! -L \"\$p\" ||
                 { echo fi_public_tool_invalid_temp_type; exit 2; };
               echo fi_public_tool_existing_temp=true;
             else
               cat > \"\$p\";
               echo fi_public_tool_streamed_new_temp=true;
             fi;
             test \"\$(stat -c %u \"\$p\")\" = 0 ||
               { echo fi_public_tool_temp_owner_mismatch; exit 2; };
             test \"\$(sha256sum \"\$p\" | cut -d \" \" -f 1)\" = \"$expected\" ||
               { echo fi_public_tool_temp_digest_mismatch; exit 2; };
             chmod 600 \"\$p\";
             test \"\$(stat -c %a \"\$p\")\" = 600 ||
               { echo fi_public_tool_temp_mode_mismatch; exit 2; };
             echo fi_public_tool_uploaded_sha256_verified=true" < "$source_file"
          sshpass -e ssh -T "${opts[@]}" root@188.120.254.223 \
            "bash -s -- \"$expected\"" < infra/scripts/ru188-install-fi-public-trust-tool.sh
          echo fi_public_tool_host_installer_finished=true
      - name: Assert approval gates are absent and existing services still run
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$RU_PASSWORD"
          sshpass -e ssh -T -F /dev/null -o ConnectTimeout=12 -o BatchMode=no \
            -o PasswordAuthentication=yes -o PubkeyAuthentication=no \
            -o KbdInteractiveAuthentication=no -o StrictHostKeyChecking=yes \
            -o HostKeyAlgorithms=ssh-ed25519 \
            -o "UserKnownHostsFile=$PWD/infra/ops/mnebydns-owner-ssh-known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no \
            -o ForwardAgent=no -o ClearAllForwardings=yes -o LogLevel=ERROR \
            root@188.120.254.223 'set -eu
              test -f /opt/mnebyvpn-controller/tools/stage-fi-public-trust.py
              test ! -e /root/mnebyvpn-controller/approvals/fi-trust-reviewed.json
              test ! -e /root/mnebyvpn-controller/fi-known_hosts
              test ! -e /root/mnebyvpn-controller/fi-node-public.spki
              ! systemctl is-active --quiet mnebyvpn-fi-enrollment.service
              ! systemctl is-active --quiet mnebyvpn-awg-delivery.service
              test "$(docker inspect --format "{{.State.Running}}" mnebyvpn-public-web)" = true
              test "$(docker inspect --format "{{.State.Running}}" mnebyvpn-stage-postgres)" = true
              test "$(docker inspect --format "{{.State.Running}}" mnebyvpn-vpn-worker)" = true
              echo "fi_public_trust_tool_staged_without_approval=true"
              echo "controller188_existing_web_db_vpn_running=true"
              echo "fi_enrollment_and_awg_delivery_still_inactive=true"'
