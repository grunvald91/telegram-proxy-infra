name: Check previously issued VPN subscription tokens active state
on:
  push:
    branches: [diag/reality-drops-subscription-visibility-20261108]
    paths: ['.github/workflows/mnebyvpn-existing-subscriptions-readonly.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      RU_PASSWORD: ${{ secrets.SERVER188_SSH_PASSWORD }}
    steps:
      - name: Read-only summary of previously issued links; never log tokens or accounts
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -qq -y sshpass
          SSHPASS="$RU_PASSWORD" sshpass -e ssh -o StrictHostKeyChecking=accept-new -o LogLevel=ERROR \
            root@188.120.254.223 'python3 -' <<'PY'
          import subprocess
          def query(sql):
              cmd=['docker','exec','mnebyvpn-stage-postgres','psql','-At','-X',
                   '-v','ON_ERROR_STOP=1','-U','mnebyvpn_stage','-d','mnebyvpn_stage','-c',sql]
              r=subprocess.run(cmd,capture_output=True,text=True,timeout=8)
              if r.returncode:raise RuntimeError('Read-only subscription query failed')
              return r.stdout.strip()
          sql="""SELECT
             count(*) AS total_issued,
             count(*) FILTER (WHERE l.revoked_at IS NULL) AS unrevoked,
             count(*) FILTER (
               WHERE l.revoked_at IS NULL AND e.product='vpn' AND e.state='ACTIVE'
               AND e.expires_at>clock_timestamp()
               AND p.applied_revision=e.revision
               AND p.last_observed_at IS NOT NULL
             ) AS eligible,
             count(DISTINCT e.account_id) FILTER (
               WHERE l.revoked_at IS NULL AND e.product='vpn' AND e.state='ACTIVE'
               AND e.expires_at>clock_timestamp()
               AND p.applied_revision=e.revision
             ) AS distinct_active_accounts
             FROM vpn_subscription_links l
             LEFT JOIN entitlements e ON e.id=l.entitlement_id
             LEFT JOIN provisioning_state p
               ON p.entitlement_id=e.id AND p.adapter='vpn'"""
          fields=query(sql).split('|')
          if len(fields)!=4:raise RuntimeError('Unexpected aggregate')
          print('all_issued_subscription_links='+fields[0])
          print('not_revoked_links='+fields[1])
          print('currently_authorized_links='+fields[2])
          print('distinct_active_accounts_with_valid_links='+fields[3])
          print('subscription_tokens_or_account_ids_logged=false')
          PY
