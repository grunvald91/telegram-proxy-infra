name: Meta v31 read-only stage diagnostic
on:
  push:
    branches: [main]
    paths: ['.github/workflows/meta-v31-stage-diagnostic.yml']
permissions:
  contents: read
concurrency:
  group: mneby-meta-v30-single-phone-owner-experiment
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      REMOTE_PASS: ${{ secrets.SERVER188_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Inspect RU staging presence and previous canary without writes
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$REMOTE_PASS"
          if ! command -v sshpass >/dev/null; then
            timeout 35s sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=7 update -qq || true
            timeout 55s sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sshpass >/dev/null
          fi
          export SSHPASS="$REMOTE_PASS"
          opts=(-T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts"
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR)
          sshpass -e ssh "${opts[@]}" root@188.120.254.223 'bash -s' <<'REMOTE' | tee -a "$GITHUB_STEP_SUMMARY"
          set -eu
          p=/usr/local/libexec/mneby-meta-v26
          test -d "$p" && echo stage_dir_exists=true || echo stage_dir_exists=false
          if test -d "$p"; then
            echo "stage_files_count=$(find "$p" -maxdepth 1 -type f | wc -l)"
            for n in meta_v26_ru_stage.py meta_v15_receive_window.py meta_v23_ru_firsthop_preview.py; do
              test -f "$p/$n" && echo "$n=present" || echo "$n=missing"
            done
          fi
          test -e /var/lib/mneby-meta-v26-ru && echo ru_state_exists=true || echo ru_state_exists=false
          systemctl is-active --quiet mneby-meta-v26-ru-watchdog.timer && echo ru_watchdog_active=true || echo ru_watchdog_active=false
          nft list table inet mneby_meta_v26_ru >/dev/null 2>&1 && echo ru_nft_active=true || echo ru_nft_active=false
          ss -H -lnt 'sport = :18443' | grep -q . && echo ru_listener_active=true || echo ru_listener_active=false
          REMOTE
