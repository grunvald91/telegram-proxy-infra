name: MNEBYDNS Russian network SNI TLS A-B diagnostics via Germany (read only)
on:
  push:
    branches: ['feature/mnebydns-meta-tiktok-telegram-30m-20261109']
    paths: ['.github/workflows/mnebydns-ru-sni-fast-compare.yml']
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      RU_PASS: ${{ secrets.SERVER188_SSH_PASSWORD }}
    steps:
      - name: Russian server TLS certificate verification with forced German ingress
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$RU_PASS"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          export SSHPASS="$RU_PASS"
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=accept-new -o LogLevel=ERROR root@188.120.254.223 'python3 -' <<'PY'
          import socket,ssl,time,concurrent.futures
          GERMAN_INGRESS='89.125.90.101'
          HOSTS=('gemini.google.com','claude.ai','x.com','grok.com',
                 'instagram.com','www.instagram.com','i.instagram.com',
                 'graph.instagram.com','threads.com','threads.net',
                 'graph.threads.net','edge-mqtt.facebook.com',
                 'meta.ai','meta.com','www.tiktok.com','api.tiktokv.com',
                 't.me','telegram.org','api.telegram.org','web.telegram.org')
          def probe(host):
              t=time.monotonic()
              try:
                  with socket.create_connection((GERMAN_INGRESS,443),timeout=7) as tcp:
                      tcp.settimeout(7)
                      with ssl.create_default_context().wrap_socket(tcp,server_hostname=host) as tls:
                          status='TLS_CERT_VALID_'+tls.version()
              except Exception as exc:
                  status='FAILED_'+type(exc).__name__
              return (host,status,round((time.monotonic()-t)*1000))
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as ex:
              rows=list(ex.map(probe,HOSTS))
          for host,status,ms in rows:
              print('russian_to_german_sni='+host+' status='+status+' elapsed_ms='+str(ms),flush=True)
          good=sum(s.startswith('TLS_CERT_VALID') for _,s,_ in rows)
          print('certificate_valid_count='+str(good)+'/'+str(len(rows)),flush=True)
          print('no_packets_or_contents_stored=yes',flush=True)
          print('no_server_config_modified=yes',flush=True)
          PY
