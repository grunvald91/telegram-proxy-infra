name: MNEBYDNS Russian VPS 443 TLS baseline before Gemini change
on:
  push:
    branches: ['feature/mnebydns-vpn-google-readonly-20261108']
    paths: ['.github/workflows/mnebydns-russian-443-baseline.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RU_PASS: ${{ secrets.SERVER188_SSH_PASSWORD }}
    steps:
      - name: Verify existing foreign 443 websites from actual Russian network
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RU_PASS"
          sudo apt-get update -qq
          sudo apt-get install -qq -y sshpass
          export SSHPASS="$RU_PASS"
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=accept-new -o LogLevel=ERROR root@188.120.254.223 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          for host in cdn.servgo.ru tg.servgo.ru mnebyvpn.site; do
            code="$(curl -4 --noproxy '*' -sS -o /dev/null \
              --connect-timeout 6 --max-time 10 \
              --resolve "$host:443:89.125.90.101" -w '%{http_code}' "https://$host/" || true)"
            echo "ru_foreign_https_host=$host code=$code"
          done
          echo "baseline_read_only=true"
          REMOTE
