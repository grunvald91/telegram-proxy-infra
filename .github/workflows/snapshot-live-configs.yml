name: Full Proxy Backup

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SERVER188_HOST: "188.120.254.223"
      RELAY89_HOST: "89.125.90.101"
      SERVER188_PASSWORD: ${{ secrets.SERVER188_SSH_PASSWORD }}
      RELAY89_PASSWORD: ${{ secrets.RELAY89_SSH_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check secrets
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$SERVER188_PASSWORD" ]
          [ -n "$RELAY89_PASSWORD" ]

      - name: Install SSH helper
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass file

      - name: Build sanitized full snapshot
        shell: bash
        run: bash scripts/full_snapshot.sh

      - name: Commit snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add legacy-mtproxy/live-snapshot
          if git diff --cached --quiet; then
            echo "No snapshot changes"
            exit 0
          fi
          git commit -m "backup: full sanitized proxy infrastructure snapshot"
          git push origin HEAD:main
