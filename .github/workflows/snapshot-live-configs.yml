name: Snapshot sanitized live proxy configs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SERVER188_HOST: "188.120.254.223"
      RELAY89_HOST: "89.125.90.101"
      SERVER188_PASSWORD: ${{ secrets.SERVER188_SSH_PASSWORD }}
      RELAY89_PASSWORD: ${{ secrets.RELAY89_SSH_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard credentials
        run: |
          set -euo pipefail
          [ -n "$SERVER188_PASSWORD" ] || { echo "::error::Missing SERVER188_SSH_PASSWORD"; exit 1; }
          [ -n "$RELAY89_PASSWORD" ] || { echo "::error::Missing RELAY89_SSH_PASSWORD"; exit 1; }

      - name: Install SSH helper
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Collect whitelisted live files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/proxy-snapshot/server188 /tmp/proxy-snapshot/relay89

          collect() {
            local host="$1" pass="$2" target="$3" list="$4"
            export SSHPASS="$pass"
            # Only whitelisted files are streamed. No shell tracing and no file contents are printed.
            sshpass -e ssh               -o StrictHostKeyChecking=no               -o UserKnownHostsFile=/dev/null               "root@$host"               "tar -czf - --ignore-failed-read $list 2>/dev/null"               | tar -xzf - -C "$target"
          }

          collect "$SERVER188_HOST" "$SERVER188_PASSWORD" /tmp/proxy-snapshot/server188 '
            /etc/nginx/streams.d/*.conf
            /etc/systemd/system/telemt*.service
            /etc/systemd/system/telemt*.service.d/*.conf
            /etc/systemd/system/mtproxy-hardening.service
            /etc/systemd/system/telegram-redsocks.service
            /etc/systemd/system/caddy-pq-canary.service
            /etc/telemt/*.toml
            /etc/telegram-redsocks.conf
            /etc/redsocks.conf
            /etc/tinyproxy/tinyproxy.conf
            /opt/mtproto-canary/Caddyfile
            /usr/local/sbin/mtproxy-hardening.sh
            /etc/sysctl.d/99-telegram-proxy-keepalive.conf
            /etc/sysctl.d/99-mtproxy-tuning.conf
          '

          collect "$RELAY89_HOST" "$RELAY89_PASSWORD" /tmp/proxy-snapshot/relay89 '
            /etc/nginx/nginx.conf
            /etc/nginx/streams.d/*.conf
            /etc/nginx/conf.d/*.conf
            /etc/nginx/sites-enabled/*
            /etc/systemd/system/mtg*.service
            /etc/systemd/system/telemt*.service
            /etc/systemd/system/telemt*.service.d/*.conf
            /etc/systemd/system/direct-mtproxy-hardening.service
            /etc/systemd/system/telegram-foreign-mss-rules.service
            /etc/systemd/system/telegram-foreign-nfqws.service
            /etc/systemd/system/telegram-rf-media-rules.service
            /etc/systemd/system/xray.service
            /etc/telemt/*.toml
            /etc/mtg/*.toml
            /etc/zapret2/telegram-nfqws.conf
            /usr/local/sbin/direct-mtproxy-hardening.sh
            /usr/local/sbin/telegram-foreign-mss-rules
            /usr/local/sbin/telegram-rf-media-rules
            /etc/sysctl.d/99-telegram-proxy-keepalive.conf
            /etc/sysctl.d/99-mtproxy-tuning.conf
          '

      - name: Sanitize and stage snapshot
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re, shutil

          srcroot=Path('/tmp/proxy-snapshot')
          dstroot=Path('legacy-mtproxy/live-snapshot')
          if dstroot.exists():
              shutil.rmtree(dstroot)

          key_assignment = re.compile(
              r'(?i)^(\s*[^#\n]*(?:secret|password|passwd|token|private[_-]?key|preshared[_-]?key|api[_-]?key|uuid|credential)[^=:\n]*\s*[=:]\s*).*$'
          )
          cli_secret = re.compile(r'(?i)(--?secret|-S|--?password|--?token)\s+\S+')
          long_hex = re.compile(r'\b[0-9a-fA-F]{32,}\b')
          long_b64 = re.compile(r'(?<![A-Za-z0-9+/=_-])[A-Za-z0-9+/_-]{43,}={0,2}(?![A-Za-z0-9+/=_-])')

          def sanitize(text):
              out=[]
              for line in text.splitlines():
                  if key_assignment.match(line):
                      prefix=key_assignment.match(line).group(1)
                      line=prefix+'<REDACTED>'
                  line=cli_secret.sub(lambda m: m.group(1)+' <REDACTED>', line)
                  line=long_hex.sub('<HEX_REDACTED>', line)
                  line=long_b64.sub('<B64_REDACTED>', line)
                  out.append(line)
              return '\n'.join(out)+'\n'

          manifest=[]
          for server in ('server188','relay89'):
              root=srcroot/server
              for p in sorted(root.rglob('*')):
                  if not p.is_file():
                      continue
                  rel=p.relative_to(root)
                  # Never stage actual key/certificate material even if a future glob changes.
                  lname=p.name.lower()
                  if lname.endswith(('.key','.pem','.p12','.pfx','.jks')) or 'privatekey' in lname:
                      continue
                  raw=p.read_bytes()
                  try:
                      text=raw.decode('utf-8')
                  except UnicodeDecodeError:
                      manifest.append(f'{server}/{rel}|binary_skipped|sha256={hashlib.sha256(raw).hexdigest()}')
                      continue
                  clean=sanitize(text)
                  dest=dstroot/server/rel.relative_to('/')
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  dest.write_text(clean)
                  manifest.append(f'{server}/{rel}|source_sha256={hashlib.sha256(raw).hexdigest()}|sanitized_sha256={hashlib.sha256(clean.encode()).hexdigest()}')

          # Sensitive configs deliberately represented only by hashes, never contents.
          (dstroot/'README.md').parent.mkdir(parents=True,exist_ok=True)
          (dstroot/'README.md').write_text(
              '# Sanitized live snapshot\n\n'
              'Generated from the live hosts. Secret-like assignments and long credential-like values are redacted.\n'
              'WireGuard private configuration, TLS private keys, Xray config contents, share-link files and SSH keys are not copied.\n'
          )
          (dstroot/'MANIFEST.sha256.txt').write_text('\n'.join(manifest)+'\n')
          PY

      - name: Reject obvious credential leakage
        shell: bash
        run: |
          set -euo pipefail
          # Fail closed on common private-key markers or explicit unredacted credential assignments.
          if grep -RIlE --exclude='*.md'              'BEGIN (OPENSSH|RSA|EC|PRIVATE) PRIVATE KEY|PrivateKey[[:space:]]*=|PresharedKey[[:space:]]*='              legacy-mtproxy/live-snapshot; then
            echo "::error::Private key material marker found; refusing commit"
            exit 1
          fi

      - name: Commit sanitized snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add legacy-mtproxy/live-snapshot
          if git diff --cached --quiet; then
            echo "No snapshot changes"
            exit 0
          fi
          git commit -m "backup: snapshot sanitized live proxy configuration"
          git push origin HEAD:main
