name: MNEBYVPN private Xray canary preflight
on:
  push:
    paths: ['.github/workflows/mnebyvpn-xray-canary-preflight.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      HOST: '89.125.90.101'
      PASSWORD: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - name: Verify isolated Xray instance possible, no existing config changes
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PASSWORD"
          sudo apt-get update -qq && sudo apt-get install -qq -y sshpass
          export SSHPASS="$PASSWORD"
          sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=12 -o LogLevel=ERROR "root@$HOST" 'python3 -' <<'PY'
          import pathlib,subprocess,re
          def proc(x):
            try:return subprocess.run(x,text=True,capture_output=True,timeout=8)
            except Exception:return None
          x=proc(['/opt/xray/xray','version'])
          version=(x.stdout.splitlines()[0].split()[:2] if x else [])
          print('xray_version_identified='+' '.join(version))
          print('xray_binary_healthy='+str(bool(x and x.returncode==0)).lower())
          sockets=proc(['ss','-H','-lnt'])
          print('isolated_loopback_18943_available='+str(not any(
             a.endswith(':18943') for line in sockets.stdout.splitlines()
             for a in line.split() if ':' in a)).lower())
          print('existing_8443_tls_configured='+str(pathlib.Path('/etc/nginx/sites-available/mnebyvpn-telegram-8443.conf').exists()).lower())
          print('pilot_service_exists='+str(pathlib.Path('/etc/systemd/system/mnebyvpn-xray-canary.service').exists()).lower())
          print('foreign_tls_cert_available='+str(pathlib.Path('/etc/letsencrypt/live/cdn.servgo.ru/fullchain.pem').is_file()).lower())
          print('node_read_only=true')
          PY
