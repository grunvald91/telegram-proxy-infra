# Postrelease read-only verification for green owner-sales review f66d3d01b89adce45fb726a96a1a43153d9632ff (2026-11-21).
# Read-only postrelease verification after owner-sales bot deployment c57c5adde8ccbb3ef3bd7bbbbc9f25ee321e1aa9.
name: MNEBYVPN personal sales readiness (read-only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/mnebyvpn-personal-sales-readiness.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HOST: '188.120.254.223'
      PASSWORD: ${{ secrets.SERVER188_SSH_PASSWORD }}
    steps:
      - name: Read-only private runtime preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$PASSWORD"
          sudo apt-get update -qq && sudo apt-get install -qq -y sshpass
          export SSHPASS="$PASSWORD"
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=accept-new \
            -o LogLevel=ERROR "root@$HOST" 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          ROOT=/opt/mnebyvpn
          echo 'owner_sales_readonly=true'
          if grep -Eq '^SUPPORT_TELEGRAM_OPERATOR_ID=[1-9][0-9]{0,15}$' "$ROOT/bot/web.env" || grep -Eq '^DNS_ADMIN_TELEGRAM_ID=[1-9][0-9]{0,15}$' "$ROOT/bot/web.env"; then echo 'operator_id_valid=yes'; else echo 'operator_id_valid=no'; fi
          if grep -Eq '^MNEBYDNS_OWNER_LINK_KEY=[a-f0-9]{64}$' "$ROOT/bot/web.env"; then echo 'dns_owner_key_valid=yes'; else echo 'dns_owner_key_valid=no'; fi
          if grep -Fxq 'MNEBYVPN_OFFLINE_SALES_ENABLED=yes' "$ROOT/bot/web.env"; then echo 'offline_sales_enabled=yes'; else echo 'offline_sales_enabled=no'; fi
          if test -r "$ROOT/staging/active_sha"; then
            sha="$(cat "$ROOT/staging/active_sha")"
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] && echo "stage_sha=$sha" || echo 'stage_sha=invalid'
          else
            echo 'stage_sha=missing'
          fi
          bot_image="$(docker inspect --format '{{.Config.Image}}' mnebyvpn-bot-info 2>/dev/null || true)"
          if [[ "$bot_image" =~ ^mnebyvpn-stage-web:[0-9a-f]{40}$ ]]; then
            echo "bot_image=$bot_image"
          else
            echo 'bot_image=unavailable'
          fi
          for name in MNEBYVPN_OFFLINE_SALES_ENABLED DNS_ADMIN_TELEGRAM_ID \
              SUPPORT_TELEGRAM_OPERATOR_ID MNEBYDNS_PERSONAL_DOT_ENABLED \
              MNEBYDNS_OWNER_LINK_KEY WEB_DNS_MT_PROXY_BONUS_KEY \
              WEB_DNS_MT_PROXY_BONUS_ROUTES_JSON WEB_DNS_MT_PROXY_BONUS_ENABLED \
              WEB_DNS_MT_PROXY_BONUS_E2E_VERIFIED WEB_DNS_MT_PROXY_BONUS_REVOKER_VERIFIED; do
            if [[ -r "$ROOT/bot/web.env" ]] && grep -q "^$name=" "$ROOT/bot/web.env"; then
              echo "bot_env_$name=present"
            else
              echo "bot_env_$name=missing"
            fi
          done
          echo "telegram_readyz=$(curl --noproxy '*' -s -o /dev/null -w '%{http_code}' \
            --max-time 4 http://127.0.0.1:8793/readyz || true)"
          for source in public/web.env bot/worker.env staging/web.env; do
            if [[ -r "$ROOT/$source" ]]; then
              for key in MNEBYDNS_PERSONAL_DOT_ENABLED WEB_DNS_MT_PROXY_BONUS_KEY \
                  WEB_DNS_MT_PROXY_BONUS_ROUTES_JSON WEB_DNS_MT_PROXY_BONUS_ENABLED \
                  WEB_DNS_MT_PROXY_BONUS_E2E_VERIFIED WEB_DNS_MT_PROXY_BONUS_REVOKER_VERIFIED; do
                if grep -q "^$key=" "$ROOT/$source"; then
                  echo "source_$(echo "$source" | tr '/.' '__')_$key=present"
                fi
              done
            fi
          done
          echo 'proxy_worker_container_names_begin'
          docker ps --format '{{.Names}}' | grep -E 'mnebyvpn.*(proxy|bonus|dns)' || true
          echo 'proxy_worker_container_names_end'
          if docker ps --format '{{.Names}}' | grep -qx mnebyvpn-stage-postgres; then
            docker exec -i mnebyvpn-stage-postgres \
              psql -qAtX -v ON_ERROR_STOP=1 -U mnebyvpn_stage -d mnebyvpn_stage <<'SQL'
          SELECT 'sales_table='||(to_regclass('public.manual_sales') IS NOT NULL)::text;
          SELECT 'sales_migration='||(EXISTS(
             SELECT 1 FROM deployment_schema_migrations
             WHERE file_name='0141_owner_manual_sales.sql'))::text;
          SELECT 'monthly_plan='||(EXISTS(
             SELECT 1 FROM billing_plans WHERE id='bundle_30d_3device'
               AND product='bundle' AND enabled
               AND duration_seconds=2592000 AND device_limit=3
               AND dns_quota_queries_per_30d=1000000))::text;
          SQL
          else
            echo 'postgres_container=unavailable'
          fi
          for c in mnebyvpn-vpn-worker mnebyvpn-dns-mtproxy-bonus-worker; do
            if docker inspect "$c" >/dev/null 2>&1; then
              echo "container_$c=$(docker inspect --format '{{.State.Status}}' "$c")"
            else
              echo "container_$c=missing_or_different_name"
            fi
          done
          REMOTE
