name: MNEBYDNS guarded CoreDNS resilient upstream migration
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - '.github/workflows/mnebydns-dot-resilience-20261111.yml'
      - 'scripts/mnebydns-dot-resilience-20261111.py'
      - 'scripts/mnebydns-dot-resilience-apply-20261111.sh'
      - 'scripts/mnebydns-dot-resilience-rollback-20261111.sh'
      - 'scripts/mnebydns-dot-config-change-20261111.sh'
      - 'scripts/mnebydns-owner-domain-render-20261110.py'
      - 'scripts/mnebydns-owner-domain-stage-20261110.sh'
      - 'scripts/mnebydns-owner-domain-remove-20261110.sh'
      - 'scripts/mnebydns-owner-domain-rollback-20261110.sh'
      - 'scripts/tests/test_owner_domain_routes.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/mnebydns-dot-resilience-20261111.yml'
      - 'scripts/mnebydns-dot-resilience-20261111.py'
      - 'scripts/mnebydns-dot-resilience-apply-20261111.sh'
      - 'scripts/mnebydns-dot-resilience-rollback-20261111.sh'
permissions:
  contents: read
concurrency:
  group: mnebydns-google-public-443-change
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify deterministic migration, fallback and all owner routes
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/mnebydns-dot-resilience-20261111.py self-test
          python3 scripts/mnebydns-owner-domain-render-20261110.py self-test
          python3 -m unittest discover -s scripts/tests -p 'test_owner_domain_*.py' -v
          bash -n scripts/mnebydns-dot-resilience-apply-20261111.sh \
            scripts/mnebydns-dot-resilience-rollback-20261111.sh \
            scripts/mnebydns-dot-config-change-20261111.sh \
            scripts/mnebydns-owner-domain-stage-20261110.sh \
            scripts/mnebydns-owner-domain-remove-20261110.sh \
            scripts/mnebydns-owner-domain-rollback-20261110.sh
          grep -Fq "mnebydns-dot-config-change-20261111.sh" scripts/mnebydns-owner-domain-controller-20261110.py
          ! grep -Fq 'systemctl restart mnebydns-dot.service' scripts/mnebydns-owner-domain-stage-20261110.sh
          ! grep -Fq 'systemctl restart mnebydns-dot.service' scripts/mnebydns-owner-domain-remove-20261110.sh
          echo 'mnebydns_resilience_offline_contract=PASS'
  apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 17
    env:
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Protected deploy of resilient CoreDNS without altering exact routes
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$DE_PASS"
          if ! command -v sshpass >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sshpass >/dev/null
          fi
          export SSHPASS="$DE_PASS"
          opts=(-o ConnectTimeout=12 -o StrictHostKeyChecking=yes
            -o HostKeyAlgorithms=ssh-ed25519
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts"
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR)
          test "$(grep -c ' ssh-ed25519 ' ops/mnebydns-owner-ssh-known_hosts)" -eq 2
          runid="$GITHUB_RUN_ID"
          work="/tmp/mnebydns-resilience-$runid"
          sshpass -e ssh "${opts[@]}" root@89.125.90.101 \
            "test ! -e '$work' && mkdir -m 700 '$work'"
          for file in mnebydns-dot-resilience-20261111.py \
            mnebydns-dot-resilience-apply-20261111.sh \
            mnebydns-dot-resilience-rollback-20261111.sh; do
            sshpass -e scp -q "${opts[@]}" "scripts/$file" \
              "root@89.125.90.101:$work/$file"
          done
          sshpass -e ssh "${opts[@]}" root@89.125.90.101 \
            "bash '$work/mnebydns-dot-resilience-apply-20261111.sh' '$runid' '$work'"
          echo 'mnebydns_resilience_production_upgrade=PASS' >> "$GITHUB_STEP_SUMMARY"
