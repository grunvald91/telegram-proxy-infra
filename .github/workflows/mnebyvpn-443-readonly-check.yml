name: Diagnose Server188 public 443 listener and firewall (read-only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/mnebyvpn-443-readonly-check.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PASS: ${{ secrets.SERVER188_SSH_PASSWORD }}
    steps:
      - name: Inspect public listener and filtering without modifying rules
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PASS"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          SSHPASS="$PASS" sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=accept-new -o LogLevel=ERROR root@188.120.254.223 'python3 -' <<'PY'
          import subprocess, re
          def run(args):
              try:
                  return subprocess.run(args,timeout=7,text=True,capture_output=True).stdout
              except Exception: return ""
          print("nginx_active="+run(['systemctl','is-active','nginx']).strip())
          print("public_port_443")
          for line in run(['ss','-H','-ltnp']).splitlines():
              if re.search(r':(443|8443|80)\b',line):
                  print(re.sub(r'users:\(.*$', 'service=hidden',line)[:210])
          print("firewall_ufw")
          print(run(['ufw','status']).splitlines()[:12])
          print("iptables_input_policy")
          lines=run(['iptables','-S','INPUT']).splitlines()
          print([x[:170] for x in lines if any(k in x for k in ('-P INPUT','--dport 443','--dport 80','DROP','REJECT'))][:28])
          print("nft_443_references")
          lines=run(['nft','list','ruleset']).splitlines()
          print([x.strip()[:160] for x in lines if any(k in x for k in ('dport 443','dport 80','tcp dport','policy drop'))][:35])
          print("local_443_status="+run(['curl','-s','-o','/dev/null','-w','%{http_code}','--max-time','5','--resolve','mnebyvpn.site:443:127.0.0.1','https://mnebyvpn.site/']).strip())
          print("read_only=true")
          PY
