name: MNEBYDNS Android Wi-Fi single-flow TCP test (manual)
on:
  workflow_dispatch:
    inputs:
      phone_public_ipv4:
        description: Phone public IPv4 from Wi-Fi (not GitHub Runner address)
        type: string
        required: true
      access_network:
        description: Network under test
        type: choice
        options: [wifi, cellular]
        required: true
      confirmation:
        description: Type PHONE_READY to authorize one 5-tuple test
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: mnebydns-manual-phone-5tuple
  cancel-in-progress: false
jobs:
  field-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      RU_PASS: ${{ secrets.SERVER188_SSH_PASSWORD }}
      PHONE_PEER: ${{ inputs.phone_public_ipv4 }}
      ACCESS_NETWORK: ${{ inputs.access_network }}
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Explicit manual authorization and offline safety gate
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$RU_PASS"
          test "$CONFIRMATION" = PHONE_READY
          python3 - "$PHONE_PEER" <<'PY'
          import ipaddress,sys
          ip=ipaddress.IPv4Address(sys.argv[1])
          if not ip.is_global or str(ip)=='188.120.254.223':
              raise SystemExit('Invalid phone IPv4')
          print('phone_public_ip_valid=true')
          PY
          python3 -m unittest discover -s scripts/tests -p 'test_mnebydns_phone_tcp_flow_probe.py' -v
          python3 -m py_compile scripts/mnebydns_phone_tcp_flow_probe.py
          echo "network_under_test=$ACCESS_NETWORK"
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sshpass >/dev/null
      - name: Coordinate phone HTTP challenge and one exact TCP flow
        shell: bash
        run: |
          set -Eeuo pipefail
          export SSHPASS="$RU_PASS"
          opts=(-T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes
            -o HostKeyAlgorithms=ssh-ed25519
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts"
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR)
          nonce="$(python3 -c 'import secrets;print(secrets.token_hex(12))')"
          logfile="$RUNNER_TEMP/mnebydns-phone-test.log"
          timeout 250s sshpass -e ssh "${opts[@]}" root@188.120.254.223 "python3 - '$PHONE_PEER' '$GITHUB_RUN_ID' '$nonce'" < scripts/mnebydns_phone_tcp_flow_probe.py > "$logfile" 2>&1 &
          remote=$!
          trap 'kill "$remote" 2>/dev/null || true; wait "$remote" 2>/dev/null || true' EXIT
          ready=0
          for n in $(seq 1 100); do
            if grep -q '^phone_challenge_ready=true$' "$logfile" 2>/dev/null; then ready=1; break; fi
            if ! kill -0 "$remote" 2>/dev/null; then break; fi
            sleep 0.3
          done
          if [[ "$ready" != 1 ]]; then cat "$logfile"; exit 1; fi
          echo 'phone_test=READY_FOR_WIFI_OR_CELLULAR'
          echo 'PHONE A: Open HTTP challenge URL below, without HTTPS auto-upgrade:'
          echo "http://188.120.254.223/mneby-$nonce"
          echo 'PHONE B: Then open https://188.120.254.223/ on the SAME Wi-Fi/cellular connection.'
          echo 'Certificate warning is expected; do not bypass it or enter credentials.'
          for n in $(seq 1 170); do
            if grep -q '^phone_challenge_seen=true$' "$logfile" 2>/dev/null; then
              echo 'phone_test=CHALLENGE_OBSERVED_PROBE_HTTPS_NOW'
              break
            fi
            if ! kill -0 "$remote" 2>/dev/null; then break; fi
            sleep 1
          done
          wait "$remote"
          trap - EXIT
          grep -E '^phone_' "$logfile" || true
          grep -q '^phone_test_rule_absent=true$' "$logfile"
          grep -q '^phone_original_queue_preserved=true$' "$logfile"
          if grep -q '^phone_test=BASELINE_SYNACK_OR_ACK_SEEN_NO_FIREWALL_CHANGE$' "$logfile"; then
            echo 'phone_test=BASELINE_SYNACK_SEEN_NO_CHANGE'
            exit 0
          fi
          grep -q '^phone_single_flow_rule_active=true$' "$logfile" || {
            echo 'phone_test=INCOMPLETE_NO_APPROVED_PHONE_FLOW' >&2
            exit 1
          }
          echo 'phone_test=COMPLETE_EXACT_FLOW_AND_ROLLBACK'
      - name: Independent read-only post-test queue and Telegram health
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$RU_PASS"
          export SSHPASS="$RU_PASS"
          opts=(-T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes
            -o HostKeyAlgorithms=ssh-ed25519
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts"
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR)
          sshpass -e ssh "${opts[@]}" root@188.120.254.223 'python3 -' <<'PY'
          import subprocess,sys
          def run(argv):
              p=subprocess.run(argv,capture_output=True,text=True,timeout=12)
              if p.returncode:raise SystemExit('postcheck command failed')
              return p.stdout
          rules=run(['nft','-a','list','chain','inet','telegram_nfqws','post'])
          original=any('tcp sport 443' in s and 'to 210' in s for s in rules.splitlines())
          absent='MNEBY_PHONE_TCP_' not in rules
          telegram=subprocess.run(['systemctl','is-active','--quiet','telegram-nfqws.service'],timeout=9).returncode==0
          nginx=subprocess.run(['systemctl','is-active','--quiet','nginx.service'],timeout=9).returncode==0
          data={'queue210_preserved':original,'phone_rule_removed':absent,'telegram_active':telegram,'nginx_active':nginx}
          for k,v in data.items():print('phone_post_'+k+'='+('PASS' if v else 'FAIL'),flush=True)
          if not all(data.values()):sys.exit(1)
          PY
