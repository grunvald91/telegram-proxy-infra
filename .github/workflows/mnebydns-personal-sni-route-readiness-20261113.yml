name: Personal DNS SNI routing readiness on DE 853 (read only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/mnebydns-personal-sni-route-readiness-20261113.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      DE_PASSWORD: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test nginx ssl_preread in isolated configuration; inspect current DoT owner
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$DE_PASSWORD"
          test -s ops/mnebydns-owner-ssh-known_hosts
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass >/dev/null
          export SSHPASS="$DE_PASSWORD"
          sshpass -e ssh -T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR \
            root@89.125.90.101 'python3 -' <<'PY'
          import os,subprocess,pathlib,tempfile
          def run(args,timeout=10):
              try:return subprocess.run(args,capture_output=True,text=True,timeout=timeout)
              except Exception:return None
          p=run(['ss','-Hlntp'])
          active=[line for line in (p.stdout if p else '').splitlines() if ':853 ' in line]
          print('EXISTING_853_OWNER='+(','.join(sorted(set('coredns' if 'coredns' in x.lower() else
            'nginx' if 'nginx' in x else 'other' for x in active))) or 'unknown'))
          ids=[]
          for line in active:
              if 'pid=' in line:
                  try:ids.append(int(line.split('pid=',1)[1].split(',',1)[0]))
                  except ValueError:pass
          for pid in sorted(set(ids)):
              try:
                  print('DOT_EXECUTABLE='+pathlib.Path('/proc/'+str(pid)+'/exe').resolve().name[:90])
                  print('DOT_WORKDIR='+str(pathlib.Path('/proc/'+str(pid)+'/cwd').resolve())[:125])
              except OSError:pass
          for svc in ['mnebydns-dot','mnebydns-core','coredns','mnebydns_dot',
                      'dnscrypt-proxy','systemd-resolved']:
              r=run(['systemctl','is-active',svc])
              print('SERVICE_'+svc.replace('-','_')+'='+(r.stdout.strip() if r else 'unknown'))
          print('HAPROXY_INSTALLED='+str(pathlib.Path('/usr/sbin/haproxy').exists()))
          for module in ['/usr/lib/nginx/modules/ngx_stream_module.so',
                         '/usr/share/nginx/modules/ngx_stream_module.so']:
              if not pathlib.Path(module).exists():continue
              with tempfile.TemporaryDirectory(prefix='sni-preflight-') as d:
                  conf=pathlib.Path(d)/'nginx.conf'
                  conf.write_text('load_module '+module+';\\n'
                    'pid '+d+'/nginx.pid;\\n'
                    'error_log '+d+'/nginx.log warn;\\n'
                    'events { worker_connections 16; }\\n'
                    'stream { server { listen 127.0.0.1:18853; '
                    'ssl_preread on; proxy_pass 127.0.0.1:1853; } }\\n')
                  r=run(['nginx','-t','-c',str(conf)],timeout=10)
                  print('NGINX_STREAM_SSL_PREREAD_TEST='+('PASS' if r and r.returncode==0 else 'FAILED'))
              break
          print('AUDIT_NO_PRODUCTION_CHANGES=true')
          PY
