name: MNEBYVPN Nov13 before 13 Moscow port map vs live 8443 18943
on:
  push:
    branches: [diag/mnebydns-live-video-stall-20261115]
    paths: [.github/workflows/mnebyvpn-port-history-chain-20261115.yml]
permissions: {contents: read}
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
      RU_PASS: ${{ secrets.SERVER188_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Compare audited historical server ports with current live listeners without changes
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$DE_PASS" && test -n "$RU_PASS" && test -s ops/mnebydns-owner-ssh-known_hosts
          python3 -m py_compile scripts/mnebyvpn-port-history-vpn-chain-readonly-20261115.py
          sudo apt-get update -qq && sudo apt-get install -qq -y sshpass >/dev/null
          opts=(-T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts" -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR)
          SSHPASS="$DE_PASS" sshpass -e ssh "${opts[@]}" root@89.125.90.101 'python3 - DE89' < scripts/mnebyvpn-port-history-vpn-chain-readonly-20261115.py > de.log 2>&1 &
          pd=$!
          SSHPASS="$RU_PASS" sshpass -e ssh "${opts[@]}" root@188.120.254.223 'python3 - RU188' < scripts/mnebyvpn-port-history-vpn-chain-readonly-20261115.py > ru.log 2>&1 &
          pr=$!
          rc=0
          wait "$pd" || rc=1
          wait "$pr" || rc=1
          echo HISTORY_DE_BEGIN;cat de.log;echo HISTORY_DE_END
          echo HISTORY_RU_BEGIN;cat ru.log;echo HISTORY_RU_END
          test "$rc" -eq 0
          grep -q 'PORTAUDIT_DE89_COMPLETE=true' de.log
          grep -q 'PORTAUDIT_RU188_COMPLETE=true' ru.log
