# Disposable dispatcher. Only invokes approved isolated fi-test-01 workflow.
name: Nodekit FI prepare dispatcher (one-off)
on:
  push:
    branches: [nodekit-fi-provision-20261117]
    paths:
      - .github/workflows/nodekit-fi-provision-once.yml
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    if: github.repository == 'grunvald91/telegram-proxy-infra'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Provision approved new VPS (staged only)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh api --method POST \
            repos/grunvald91/telegram-proxy-infra/actions/workflows/nodekit-prepare-new-vps.yml/dispatches \
            -f ref=main \
            -f "inputs[host]=217.11.167.91" \
            -f "inputs[node_id]=fi-test-01" \
            -f "inputs[advertise_host]=fi-test.mnebyvpn.site" \
            -f "inputs[mode]=prepare_all"
