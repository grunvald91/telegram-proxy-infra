name: MNEBYDNS Meta SNI offline regressions (no VPS access)
on:
  pull_request:
    branches:
      - audit/mnebydns-instagram-lite-20261111
    paths:
      - .github/workflows/mnebydns-meta-sni-offline-safety.yml
      - scripts/mnebydns_iglite_sni_observer.py
      - scripts/tests/test_mnebydns_iglite_sni_observer.py
      - scripts/mnebydns_iglite_dns_wire_checks.py
      - scripts/tests/test_mnebydns_iglite_dns_wire_checks.py
      - scripts/mnebydns_iglite_route_only_v11.py
      - scripts/tests/test_mnebydns_iglite_v11_scope.py
      - .github/workflows/mnebydns-iglite-wifi-v10-onrequest.yml
      - scripts/meta_v15_receive_window.py
      - scripts/meta_v15_phone_trial.py
      - .github/workflows/meta-v15-phone-canary.yml
      - scripts/tests/test_meta_v15_receive_window.py
      - scripts/tests/test_meta_v15_phone_trial.py
      - scripts/tests/test_meta_v17_isolation_quarantine.py
      - scripts/tests/integration_meta_v15_netns.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: meta-sni-offline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile Meta diagnostic modules
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/mnebydns_iglite_sni_observer.py scripts/mnebydns_iglite_dns_wire_checks.py scripts/mnebydns_iglite_route_only_v11.py
      - name: Reject truncated captures and ambiguous TCP segmentation
        run: |
          set -Eeuo pipefail
          python3 -m unittest discover -s scripts/tests -p 'test_mnebydns_iglite_sni_observer.py' -v
      - name: Confirm existing route-only and DNS safety contracts
        run: |
          set -Eeuo pipefail
          python3 -m unittest discover -s scripts/tests -p 'test_mnebydns_iglite_v11_scope.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_mnebydns_iglite_dns_wire_checks.py' -v
      - name: Explicit scope attestation
        run: |
          echo 'OFFLINE_ONLY=true'
          echo 'NO_SSH_NO_SECRETS_NO_REMOTE_DEPLOY=true'
          echo 'DOES_NOT_PROVE_INSTAGRAM_ANDROID_E2E=true'
      - name: Receiver window unit and real socket checks
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/meta_v15_receive_window.py scripts/meta_v15_phone_trial.py scripts/tests/integration_meta_v15_netns.py
          python3 -m unittest discover -s scripts/tests -p 'test_meta_v15_receive_window.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_meta_v15_phone_trial.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_meta_v17_isolation_quarantine.py' -v
      - name: Verify actual client SNI segmentation in an isolated network namespace
        run: |
          set -Eeuo pipefail
          missing=()
          for pair in 'ip:iproute2' 'nft:nftables' 'tcpdump:tcpdump' 'ethtool:ethtool'; do
            command -v "${pair%%:*}" >/dev/null || missing+=("${pair#*:}")
          done
          if ((${#missing[@]})); then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq "${missing[@]}"
          fi
          sudo timeout 100s python3 scripts/tests/integration_meta_v15_netns.py

