name: MNEBYVPN prepare public read-only web backend (188)
on:
  push:
    paths: ['.github/workflows/mnebyvpn-public-web-prepare.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mnebyvpn-public-web
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    env:
      HOST: '188.120.254.223'
      SSH_PASSWORD: ${{ secrets.SERVER188_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Securely install isolated app without modifying nginx
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_PASSWORD"
          sudo apt-get update -qq && sudo apt-get install -qq -y sshpass
          export SSHPASS="$SSH_PASSWORD"
          opts=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=12 -o LogLevel=ERROR)
          sshpass -e scp "${opts[@]}" scripts/mnebyvpn-public-web-prepare.sh "root@$HOST:/tmp/mnebyvpn-public-web-prepare.sh"
          sshpass -e ssh "${opts[@]}" "root@$HOST" 'bash /tmp/mnebyvpn-public-web-prepare.sh; result=$?; rm -f /tmp/mnebyvpn-public-web-prepare.sh; exit "$result"'
