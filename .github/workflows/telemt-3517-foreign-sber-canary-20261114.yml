name: Telegram foreign Telemt 3.5.17 single-profile guarded canary
"on":
  push:
    branches: [diag/telegram-proxy-443-versions-20261114]
    paths: ['.github/workflows/telemt-3517-foreign-sber-canary-20261114.yml']
permissions:
  contents: read
concurrency:
  group: telemt-3517-foreign-one-profile
  cancel-in-progress: false
jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    env:
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact published binary and local deploy script before SSH
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/telemt_3517_sber_canary_20261114.sh
          test -n "$DE_PASS" && test -s ops/mnebydns-owner-ssh-known_hosts
          curl --fail --location --silent --show-error --retry 2 --proto '=https' --proto-redir '=https' --tlsv1.2 --max-time 90 \
            -o "$RUNNER_TEMP/telemt-3.5.17" \
            https://github.com/telemt/telemt/releases/download/3.5.17/telemt
          printf 'e5ca8befdc1428fcd66537ef04f3a95e5f278ebf3c3dd0d0909ce25a390f502b  %s\n' "$RUNNER_TEMP/telemt-3.5.17" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/telemt-3.5.17"
          "$RUNNER_TEMP/telemt-3.5.17" --version | grep -F 3.5.17
          echo 'UPSTREAM_VERIFIED_3517=true'
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass >/dev/null
      - name: Transfer verified binary without changing shared system Telemt
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$DE_PASS"
          opts=(-o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts"
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR)
          sshpass -e scp -q ${opts[@]} "$RUNNER_TEMP/telemt-3.5.17" "root@89.125.90.101:/tmp/telemt-3.5.17-canary-$GITHUB_RUN_ID"
          sshpass -e scp -q ${opts[@]} scripts/telemt_3517_sber_canary_20261114.sh root@89.125.90.101:/tmp/telemt_3517_sber_canary_20261114.sh
          echo TELEMT_CANARY_UPLOADED=true
      - name: Start single-profile Telemt 3.5.17 with independent rollback
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$DE_PASS"
          opts=(-o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts"
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR)
          sshpass -e ssh -T ${opts[@]} root@89.125.90.101 "bash /tmp/telemt_3517_sber_canary_20261114.sh stage '$GITHUB_RUN_ID'" | tee "$RUNNER_TEMP/stage.log"
          grep -Fq 'TELEMT_INDEPENDENT_ROLLBACK_ARMED=true' "$RUNNER_TEMP/stage.log"
          grep -Fq 'TELEMT_SBER_CANARY_RUNNING_3517=true' "$RUNNER_TEMP/stage.log"
          echo 'active=true' >> "$GITHUB_OUTPUT"
      - name: Verify running unit and shared 443, WEB, DoT and fallback availability
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$DE_PASS"
          opts=(-o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts"
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR)
          sshpass -e ssh -T ${opts[@]} root@89.125.90.101 'python3 -' <<'PY'
          import subprocess,re,time
          time.sleep(5)
          def run(args):
              p=subprocess.run(args,capture_output=True,text=True,timeout=6)
              return p.returncode,p.stdout.strip()
          assert run(['systemctl','is-active','--quiet','telemt-direct-sber.service'])[0]==0
          pid=run(['systemctl','show','telemt-direct-sber.service','-p','MainPID','--value'])[1]
          assert pid.isdigit() and int(pid)>0
          exe=run(['readlink','-f','/proc/'+pid+'/exe'])[1]
          assert exe=='/opt/telemt-3.5.17/telemt'
          rc,output=run(['ss','-lntp'])
          count=sum(('pid='+pid+',') in line for line in output.splitlines())
          print('TELEMT_3517_LISTEN_SOCKETS='+str(count))
          assert count>0
          for unit in ('telemt.service','telemt-direct-yandex.service','tproxy-server.service','tproxy-server-ru.service','mtproxy.service','mtproxy-ru.service','nginx.service'):
              print('UNCHANGED_UNIT_'+unit+'='+('active' if run(['systemctl','is-active','--quiet',unit])[0]==0 else 'inactive'))
          print('ONE_PROFILE_3517_SERVER_HEALTH=PASS')
          PY
          python3 - <<'PY'
          import socket,ssl
          for label,ip,port in [('DE8443','89.125.90.101',8443),('DE853','89.125.90.101',853),('RU8443','188.120.254.223',8443)]:
              with socket.create_connection((ip,port),timeout=6):print('CANARY_'+label+'=CONNECTED')
          for label,ip,host in [('DIRECT_WEB','89.125.90.101','cdn.servgo.ru'),('RU_WEBSITE','188.120.254.223','mnebyvpn.site')]:
              with socket.create_connection((ip,443),timeout=6) as raw:
                  raw.settimeout(6)
                  with ssl.create_default_context().wrap_socket(raw,server_hostname=host) as tls:
                      tls.sendall(('GET / HTTP/1.1\r\nHost: '+host+'\r\nConnection: close\r\n\r\n').encode())
                      status=int(tls.recv(256).split(b' ')[1])
                      print('CANARY_'+label+'_HTTP='+str(status))
                      assert status==200
          print('PUBLIC_PRESERVATION_CHECKS=PASS')
          PY
      - name: Keep new Telemt only after verification
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$DE_PASS"
          opts=(-o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts"
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR)
          sshpass -e ssh -T ${opts[@]} root@89.125.90.101 "bash /tmp/telemt_3517_sber_canary_20261114.sh commit '$GITHUB_RUN_ID'"
      - name: Restore legacy process on failed canary
        if: failure() && steps.stage.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$DE_PASS"
          sshpass -e ssh -T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts" -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR root@89.125.90.101 "bash /tmp/telemt_3517_sber_canary_20261114.sh rollback '$GITHUB_RUN_ID'"
      - name: Remove only temporary upload copies
        if: always()
        shell: bash
        run: |
          if [ -n "$DE_PASS" ]; then
            export SSHPASS="$DE_PASS"
            sshpass -e ssh -T -o ConnectTimeout=8 -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts" -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR root@89.125.90.101 "rm -f /tmp/telemt-3.5.17-canary-$GITHUB_RUN_ID /tmp/telemt_3517_sber_canary_20261114.sh" || true
          fi
