name: Smart DNS research queue inventory
"on":
  push:
    branches: [smartdns/research-queue-bulk-20261124]
    paths: [.github/workflows/mnebydns-research-queue-inventory.yml]
permissions: {contents: read}
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Count reviewed and general research names by live status
        env:
          RU_PASS: ${{ secrets.SERVER188_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          if ! command -v sshpass >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -qq -y --no-install-recommends sshpass >/dev/null
          fi
          python3 - <<'PY'
          import collections,runpy
          mod = runpy.run_path("scripts/mnebydns-batch-108-canary-20261112.py")
          print("QUEUE_INVENTORY_READ_ONLY=true",flush=True)
          rows = mod["table"]()
          counts=collections.Counter((product,state) for state,product,error in rows.values())
          for (product,status),count in sorted(counts.items()):
              print(f"QUEUE_COUNT {product}|{status}|{count}")
          names=mod["inventory"]()
          review=collections.Counter(rows[name][0] if name in rows else "MISSING" for name in names)
          for status,count in sorted(review.items()):
              print(f"QUEUE_REVIEWED_108 {status}|{count}")
          pending=[name for name in names if rows.get(name, ("",""))[:2] == ("PENDING", mod["PRODUCT"])]
          print("QUEUE_REVIEWED_PENDING " + " ".join(pending))
          PY
