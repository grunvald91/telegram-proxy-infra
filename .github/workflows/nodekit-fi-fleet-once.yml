name: FI fleet controller smoke dispatcher (one-off)
on:
  push:
    branches: [feat/nodekit-fleet-bootstrap-20261118]
    paths: [.github/workflows/nodekit-fi-fleet-once.yml]
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Test both AWG and local DoT fleet canaries
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api --method POST \
            repos/grunvald91/telegram-proxy-infra/actions/workflows/nodekit-fleet-bootstrap.yml/dispatches \
            -f ref=main \
            -f "inputs[country]=fi" \
            -f "inputs[phase]=canary"
