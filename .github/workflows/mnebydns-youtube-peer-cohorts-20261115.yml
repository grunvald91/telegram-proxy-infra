name: MNEBYDNS YouTube TCP retrans peer-class correlation read-only
on:
  push:
    branches: [diag/mnebydns-live-video-stall-20261115]
    paths: [.github/workflows/mnebydns-youtube-peer-cohorts-20261115.yml]
permissions: {contents: read}
jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
      RU_PASS: ${{ secrets.SERVER188_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Bounded read-only classification of TCP443 peer groups on both nodes
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/mnebydns-youtube-peer-cohorts-20261115.py
          test -n "$DE_PASS" && test -n "$RU_PASS"
          test -s ops/mnebydns-owner-ssh-known_hosts
          sudo apt-get update -qq && sudo apt-get install -qq -y sshpass >/dev/null
          opts=(-T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts" -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR)
          SSHPASS="$DE_PASS" sshpass -e ssh "${opts[@]}" root@89.125.90.101 'python3 - DE89' < scripts/mnebydns-youtube-peer-cohorts-20261115.py > de-peer.txt 2>&1 &
          p_de=$!
          SSHPASS="$RU_PASS" sshpass -e ssh "${opts[@]}" root@188.120.254.223 'python3 - RU188' < scripts/mnebydns-youtube-peer-cohorts-20261115.py > ru-peer.txt 2>&1 &
          p_ru=$!
          x=0;y=0
          wait "$p_de" || x=$?
          wait "$p_ru" || y=$?
          echo DE_PEER_BEGIN;cat de-peer.txt;echo DE_PEER_END
          echo RU_PEER_BEGIN;cat ru-peer.txt;echo RU_PEER_END
          test "$x" -eq 0 && test "$y" -eq 0
          grep -q 'COHORT_DE89_COMPLETE=TRUE' de-peer.txt
          grep -q 'COHORT_RU188_COMPLETE=TRUE' ru-peer.txt
