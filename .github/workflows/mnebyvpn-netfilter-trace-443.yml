# Trace exactly inbound HTTPS 443 for failing external public payment callback, no firewall verdict changes.
name: MNEBYVPN trace selected inbound 443 verdicts (temporary)
on:
  push:
    paths: ['.github/workflows/mnebyvpn-netfilter-trace-443.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      HOST: '188.120.254.223'
      PASSWORD: ${{ secrets.SERVER188_SSH_PASSWORD }}
    steps:
      - name: Trace only this runner TCP SYN without changing firewall verdicts
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PASSWORD"
          sudo apt-get update -qq && sudo apt-get install -qq -y sshpass
          SOURCE_IP="$(curl -4 -fsS --max-time 8 https://api.ipify.org)"
          [[ "$SOURCE_IP" =~ ^[0-9.]+$ ]]
          export SSHPASS="$PASSWORD"
          opts=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=12 -o LogLevel=ERROR)
          sshpass -e ssh "${opts[@]}" "root@$HOST" "python3 - '$SOURCE_IP'" > "$RUNNER_TEMP/tracer-output.txt" <<'PY' &
          import subprocess,sys,time,pathlib,re,signal
          src=sys.argv[1]
          if not re.fullmatch(r'(?:\d{1,3}\.){3}\d{1,3}',src):raise SystemExit('Invalid source')
          table='mnebyvpn_probe_443'
          trace=pathlib.Path('/tmp/mnebyvpn-trace-443-events')
          def nft(*args):
            p=subprocess.run(['nft',*args],capture_output=True,text=True,timeout=8)
            if p.returncode:raise RuntimeError('nft failed')
          nft('add','table','inet',table)
          monitor=None
          try:
            nft('add','chain','inet',table,'trace_prerouting','{','type','filter','hook','prerouting','priority','-310',';','policy','accept',';','}')
            nft('add','rule','inet',table,'trace_prerouting','ip','saddr',src,'tcp','dport','443','meta','nftrace','set','1')
            with trace.open('w') as f:
              monitor=subprocess.Popen(['nft','monitor','trace'],stdout=f,stderr=subprocess.DEVNULL,text=True)
              time.sleep(18)
            data=trace.read_text()
            print('trace_message_count='+str(len(data.splitlines())))
            events=[]
            # NFT trace syntax: "trace id <id> inet <table> <chain> ...".
            # Never print IP addresses, MACs, full firewall rules or payloads.
            nodes=[]
            results=[]
            for line in data.splitlines():
              match=re.search(r'trace id \S+ (inet|ip|ip6) (\S+) (\S+) (.*)',line)
              if not match:continue
              family,table,chain,detail=match.groups()
              nodes.append((family,table,chain))
              if re.search(r'\b(drop|reject)\b',detail):
                results.append('denial_'+table+'/'+chain)
              elif 'policy accept' in detail or 'verdict accept' in detail:
                results.append('accept_'+table+'/'+chain)
              elif 'verdict continue' in detail:
                results.append('continue_'+table+'/'+chain)
            print('parsed_trace_nodes='+str(len(nodes)))
            print('trace_tables='+','.join(sorted(set(f+'-'+t for f,t,c in nodes))))
            print('last_trace_chain='+('/'.join(nodes[-1]) if nodes else 'none'))
            print('accept_events='+str(len([v for v in results if v.startswith('accept_')])))
            print('denial_events='+str(len([v for v in results if v.startswith('denial_')])))
            for v in list(dict.fromkeys(v for v in results if v.startswith('denial_')))[:7]:
              print('denial_point='+v)
            types={}
            for line in data.splitlines():
              tag='packet' if ' packet:' in line else 'rule' if ' rule ' in line else 'policy' if ' policy ' in line else 'other'
              types[tag]=types.get(tag,0)+1
            for kind,count in types.items():print('trace_'+kind+'_lines='+str(count))
            # Last trace of a matched SYN: sanitized rule names/verdicts only.
            # Never print IP addresses, MACs, tokens or packet headers.
            ids=[m.group(1) for line in data.splitlines()
              if (m:=re.search(r'trace id (\S+)',line))]
            if ids:
              last_id=ids[-1]
              last=[line for line in data.splitlines()
                if line.startswith('trace id '+last_id+' ')]
              for line in last[-15:]:
                t=re.sub(r'^trace id \S+ ', '', line)
                t=re.sub(r'\b(?:\d{1,3}\.){3}\d{1,3}\b','<ipv4>',t)
                t=re.sub(r'(?i)\b(?:[0-9a-f]{2}:){5}[0-9a-f]{2}\b','<mac>',t)
                t=re.sub(r'\b(?:[0-9a-f]{0,4}:){2,}[0-9a-f:]+\b','<ipv6>',t)
                if ' packet:' in t:t=t.split(' packet:')[0]+' packet:<redacted>'
                print('trace_tail_event='+t[:200])

          finally:
            if monitor and monitor.poll() is None:
              monitor.terminate()
              try:monitor.wait(timeout=2)
              except subprocess.TimeoutExpired:monitor.kill()
            subprocess.run(['nft','delete','table','inet',table],capture_output=True,timeout=6)
            trace.unlink(missing_ok=True)
            print('trace_rule_removed=true')
          PY
          SSH_PID=$!
          sleep 4
          python3 - <<'PY'
          import socket
          for i in range(3):
            try:
              with socket.create_connection(('188.120.254.223',443),timeout=3):
                print('external_tcp443=connected')
            except Exception as exc:print('external_tcp443='+type(exc).__name__)
          PY
          wait "$SSH_PID"
          cat "$RUNNER_TEMP/tracer-output.txt"
