name: RU188 FI217 AWG subscriptions - scoped 0139 trigger repair
"on":
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/fi-awg-provisioning-role-activate.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/fi-awg-provisioning-role-activate.yml
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: mnebyvpn-fleet-fi
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: grunvald91/Mnebyvpn
          ref: 55eae2efd95bffc7507780c18c5a6fa969a3c89a
          path: mnebyvpn
          persist-credentials: false
      - name: Verify independently reviewed 0139 migration at immutable commit
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C mnebyvpn rev-parse HEAD)" = 55eae2efd95bffc7507780c18c5a6fa969a3c89a
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          path=Path('mnebyvpn/db/migrations/0139_awg_peer_address_trigger_owner.sql')
          raw=path.read_bytes()
          pin=hashlib.sha1(b'blob '+str(len(raw)).encode()+bytes([0])+raw).hexdigest()
          assert pin=='76cf8e1162f7b4a27b1da3a8afd523ca2d81b3bb'
          sql=raw.decode()
          for term in ('BEGIN;', 'COMMIT;', 'SECURITY DEFINER',
                       'SET search_path = pg_catalog, public',
                       'vpn_awg_enforce_address_pool()',
                       'REVOKE ALL ON FUNCTION', 'actual_owner IS DISTINCT FROM current_user',
                       'pool_owner IS DISTINCT FROM current_user'):
              assert term in sql
          assert 'GRANT UPDATE' not in sql and 'DROP TABLE' not in sql
          print('FI_AWG_0139_MIGRATION=SOURCE_PINNED')
          PY
  ru188-live:
    needs: offline
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: node-fi
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: grunvald91/Mnebyvpn
          ref: 55eae2efd95bffc7507780c18c5a6fa969a3c89a
          path: mnebyvpn
          persist-credentials: false
      - name: Install pinned SSH transport
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -qq -y --no-install-recommends sshpass >/dev/null
      - name: Grant only four provisioning read columns and inspect automatic FI enrollment
        env:
          RU_PASSWORD: ${{ secrets.SERVER188_SSH_PASSWORD }}
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          test -n "$RU_PASSWORD"
          test "$(git -C mnebyvpn rev-parse HEAD)" = 55eae2efd95bffc7507780c18c5a6fa969a3c89a
          grep -q '^188\.120\.254\.223 ssh-ed25519 ' ops/mnebydns-owner-ssh-known_hosts
          work="$RUNNER_TEMP/fi-awg-provisioning-role"
          mkdir -m 0700 "$work"
          trap 'rm -rf -- "$work"' EXIT
          cat > "$work/ru.cfg" <<CFG
          Host ru-controller
            HostName 188.120.254.223
            User root
            UserKnownHostsFile $GITHUB_WORKSPACE/ops/mnebydns-owner-ssh-known_hosts
            GlobalKnownHostsFile /dev/null
            HostKeyAlgorithms ssh-ed25519
            StrictHostKeyChecking yes
            UpdateHostKeys no
            BatchMode no
            PasswordAuthentication yes
            PubkeyAuthentication no
            KbdInteractiveAuthentication no
            ForwardAgent no
            ClearAllForwardings yes
            ControlMaster no
            ProxyCommand none
            ConnectTimeout 12
            ServerAliveInterval 10
            ServerAliveCountMax 3
            LogLevel ERROR
          CFG
          remote(){
            SSHPASS="$RU_PASSWORD" sshpass -e ssh -T -F "$work/ru.cfg" ru-controller "$@"
          }
          remote 'test "$(id -u)" = 0 &&
            ip -o -4 addr show | grep -Fq "188.120.254.223/" &&
            systemctl is-active --quiet mnebyvpn-awg-delivery.service &&
            docker inspect -f "{{.State.Running}}" mnebyvpn-public-web | grep -qx true'
          # Mutate only the verified trigger owner ACL, never customer rows,
          # keys, original AWG or VLESS. SQL is pinned to reviewed git blob.
          cat > "$work/preflight.sql" <<'SQL'
          SELECT CASE
            WHEN count(*)=1 AND bool_and(
               p.proowner=c.relowner
               AND pg_catalog.pg_get_userbyid(p.proowner)=current_user
               AND p.prorettype='pg_catalog.trigger'::pg_catalog.regtype
               AND pg_catalog.strpos(pg_catalog.pg_get_functiondef(p.oid),'FOR SHARE')>0
               AND NOT has_any_column_privilege('mnebyvpn_awg_delivery',
                   'public.vpn_awg_node_pools','UPDATE')
               AND (NOT p.prosecdef OR
                   ('search_path=pg_catalog, public'=ANY(p.proconfig)
                    AND NOT EXISTS(
                      SELECT 1 FROM pg_catalog.aclexplode(coalesce(
                          p.proacl,pg_catalog.acldefault('f',p.proowner))) acl
                      WHERE acl.grantee=0 AND acl.privilege_type='EXECUTE'
                    )))
            ) THEN CASE WHEN bool_and(p.prosecdef) THEN 'ALREADY' ELSE 'APPLY' END
            ELSE 'BLOCKED' END
          FROM pg_catalog.pg_proc p
          JOIN pg_catalog.pg_namespace n ON n.oid=p.pronamespace
          JOIN pg_catalog.pg_class c ON c.oid='public.vpn_awg_node_pools'::regclass
          JOIN pg_catalog.pg_trigger t
            ON t.tgfoid=p.oid AND t.tgrelid='public.vpn_awg_peer_allocations'::regclass
          WHERE n.nspname='public' AND p.proname='vpn_awg_enforce_address_pool'
            AND p.pronargs=0 AND t.tgname='vpn_awg_address_immutability'
            AND NOT t.tgisinternal AND t.tgenabled <> 'D';
          SQL
          mode=$(remote 'docker exec -i mnebyvpn-stage-postgres psql -X -q -A -t -v ON_ERROR_STOP=1 -U mnebyvpn_stage -d mnebyvpn_stage' < "$work/preflight.sql")
          case "$mode" in
            APPLY)
              remote 'docker exec -i mnebyvpn-stage-postgres psql -X -q -A -t -v ON_ERROR_STOP=1 -U mnebyvpn_stage -d mnebyvpn_stage' \
                < mnebyvpn/db/migrations/0139_awg_peer_address_trigger_owner.sql > "$work/migration.out"
              echo 'FI_AWG_0139_MIGRATION=APPLIED' ;;
            ALREADY)
              echo 'FI_AWG_0139_MIGRATION=ALREADY_APPLIED' ;;
            *) echo 'FI_AWG_0139_MIGRATION=BLOCKED'; exit 2 ;;
          esac
          cat > "$work/verify.sql" <<'SQL'
          SELECT CASE WHEN count(*)=1 AND bool_and(
            p.prosecdef
            AND 'search_path=pg_catalog, public'=ANY(p.proconfig)
            AND p.proowner=c.relowner
            AND pg_catalog.pg_get_userbyid(p.proowner)=current_user
            AND NOT has_any_column_privilege('mnebyvpn_awg_delivery',
                 'public.vpn_awg_node_pools','UPDATE')
            AND NOT EXISTS(
              SELECT 1 FROM pg_catalog.aclexplode(coalesce(
                p.proacl,pg_catalog.acldefault('f',p.proowner))) acl
              WHERE acl.grantee=0 AND acl.privilege_type='EXECUTE'
            )
          ) THEN 'VERIFIED' ELSE 'BLOCKED' END
          FROM pg_catalog.pg_proc p
          JOIN pg_catalog.pg_namespace n ON n.oid=p.pronamespace
          JOIN pg_catalog.pg_class c ON c.oid='public.vpn_awg_node_pools'::regclass
          JOIN pg_catalog.pg_trigger t ON t.tgfoid=p.oid
            AND t.tgrelid='public.vpn_awg_peer_allocations'::regclass
          WHERE n.nspname='public' AND p.proname='vpn_awg_enforce_address_pool'
            AND p.pronargs=0 AND t.tgname='vpn_awg_address_immutability'
            AND NOT t.tgisinternal AND t.tgenabled <> 'D';
          SQL
          result=$(remote 'docker exec -i mnebyvpn-stage-postgres psql -X -q -A -t -v ON_ERROR_STOP=1 -U mnebyvpn_stage -d mnebyvpn_stage' < "$work/verify.sql")
          test "$result" = 'VERIFIED' || { echo 'FI_AWG_0139_POSTCHECK=BLOCKED'; exit 2; }
          echo 'FI_AWG_0139_POSTCHECK=VERIFIED'
          # Automatic worker may have delayed retries. Report aggregate
          # counts only; do not expose subscriber identifiers or key material.
          cat > "$work/ack.sql" <<'SQL'
          SELECT
          (SELECT count(*) FROM public.vpn_awg_device_requests WHERE node_id='fi-test-01'),
          (SELECT count(*) FROM public.vpn_awg_peer_allocations WHERE node_id='fi-test-01' AND state='applied'),
          (SELECT count(*) FROM public.vpn_awg_peer_allocations a
           JOIN public.vpn_awg_command_outbox o
             ON o.node_id=a.node_id AND o.entitlement_id=a.entitlement_id
             AND o.revision=a.revision AND o.op='grant'
           JOIN public.entitlements e ON e.id=a.entitlement_id
           WHERE a.node_id='fi-test-01' AND a.state='applied'
             AND o.state='applied' AND o.node_receipt_sha256 ~ '^[a-f0-9]{64}$'
             AND o.command_sha256=a.last_command_sha256
             AND o.billing_revision=e.revision
             AND e.product='vpn' AND e.state='ACTIVE'
             AND e.expires_at>clock_timestamp());
          SQL
          for attempt in $(seq 1 18); do
            counts=$(remote 'docker exec -i mnebyvpn-stage-postgres psql -X -q -A -t -v ON_ERROR_STOP=1 -U mnebyvpn_stage -d mnebyvpn_stage' < "$work/ack.sql")
            IFS="|" read -r queued applied ack <<< "$counts"
            [[ "$queued" =~ ^[0-9]+$ && "$applied" =~ ^[0-9]+$ && "$ack" =~ ^[0-9]+$ ]] || exit 2
            if (( queued >= 2 && applied >= 2 && ack >= 2 )); then
              echo "FI_AWG_0139_SIGNED_ACKS=$ack"
              echo 'FI_AWG_0139_CUSTOMER_DELIVERY=VERIFIED'
              exit 0
            fi
            sleep 12
          done
          echo "FI_AWG_0139_CUSTOMER_DELIVERY=PENDING;QUEUED=$queued;APPLIED=$applied;SIGNED_ACKS=$ack"
          exit 2

  publish-live-status:
    name: Publish exact FI217 production result
    needs: [offline, ru188-live]
    if: ${{ always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Publish aggregate-only GitHub commit status
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OFFLINE_RESULT: ${{ needs.offline.result }}
          LIVE_RESULT: ${{ needs.ru188-live.result }}
        run: |
          set -Eeuo pipefail
          if [[ "$OFFLINE_RESULT" == success && "$LIVE_RESULT" == success ]]; then
            status=success
            reason='FI217 migration 0139 and two signed grant ACKs verified'
          else
            status=failure
            reason='FI217 RU188 production not verified; inspect workflow run'
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$status" \
            -f context='fi217/awg-0139-live' \
            -f description="$reason" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/workflows/fi-awg-provisioning-role-activate.yml" > /dev/null
          echo "FI217_PRODUCTION_STATUS=$status"
