name: Foreign Nginx 443 route structure read-only audit
on:
  push:
    branches: ['feature/mnebydns-vpn-google-readonly-20261108']
    paths: ['.github/workflows/mnebydns-foreign-443-readonly.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RELAY_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - name: Check current SNI dispatcher safety boundaries
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RELAY_PASS"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          export SSHPASS="$RELAY_PASS"
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=accept-new -o LogLevel=ERROR root@89.125.90.101 'python3 -' <<'PY'
          import re, subprocess
          p=subprocess.run(['nginx','-T'],capture_output=True,text=True,timeout=14)
          if p.returncode:raise SystemExit('nginx_config_invalid')
          s=p.stdout
          matches=re.findall(r'map\s+\$ssl_preread_server_name\s+\$(\w+)\s*\{([^{}]*)\}',s,re.S)
          print('sni_map_count='+str(len(matches)))
          for name,body in matches:
              print('map_variable='+name)
              print('map_has_default='+str(bool(re.search(r'(?m)^\s*default\s+[^;]+;',body))).lower())
              print('map_existing_routes='+str(len(re.findall(r'(?m)^\s*[^#\s][^;]+;',body))))
              print('map_google_present='+str('gemini.google.com' in body))
          for port in [443,853]:
              q=subprocess.run(['ss','-H','-lnt','sport = :'+str(port)],capture_output=True,text=True)
              print('listener_'+str(port)+'='+str(len(q.stdout.splitlines())))
          print('audit_read_only=true')
          PY
