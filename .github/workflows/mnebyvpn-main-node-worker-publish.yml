name: MNEBYVPN deploy signed Xray worker and Telegram VPN profiles on 188
# Explicit release after green main 454c658 and verified staging on server188.
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/mnebyvpn-main-node-worker-publish.yml'
      - 'scripts/mnebyvpn-main-node-worker-promote.sh'
      - 'scripts/mnebyvpn-node-expiry-pilot.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mnebyvpn-live-node-worker-main
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HOST: '188.120.254.223'
      SSH_PASSWORD: ${{ secrets.SERVER188_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: infra
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: grunvald91/Mnebyvpn
          ref: main
          path: vpn
          fetch-depth: 0
          persist-credentials: false
      - name: Check immutable green main, private rollout scripts and node agent contract
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_PASSWORD" || { echo 'Existing server188 connection secret missing'; exit 2; }
          bash -n infra/scripts/mnebyvpn-main-node-worker-promote.sh
          bash -n infra/scripts/mnebyvpn-main-bot-promote.sh
          python3 -m py_compile infra/scripts/mnebyvpn-node-expiry-pilot.py
          test -f vpn/packages/provisioning/src/xray-node.ts
          sha="$(git -C vpn rev-parse HEAD)"
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]]
          curl -fsSL --retry 2 --max-time 25 \
            'https://api.github.com/repos/grunvald91/Mnebyvpn/actions/workflows/offline-contracts.yml/runs?branch=main&status=success&per_page=12' \
            -o "$RUNNER_TEMP/ci.json"
          green="$(python3 - "$RUNNER_TEMP/ci.json" <<'PY'
          import json,sys
          for r in json.load(open(sys.argv[1])).get('workflow_runs',[]):
              if r.get('head_branch')=='main' and r.get('event')=='push' and r.get('conclusion')=='success':
                  print(r['head_sha']);break
          PY
          )"
          [[ "$green" =~ ^[a-f0-9]{40}$ ]]
          git -C vpn merge-base --is-ancestor "$green" "$sha"
          git -C vpn diff --quiet "$green" "$sha" -- apps packages db package.json tsconfig.json
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "vpn_ci_verified=$green" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish canary-probed node worker via existing server188 channel
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -qq -y sshpass
          export SSHPASS="$SSH_PASSWORD"
          opts=(-o ConnectTimeout=12 -o StrictHostKeyChecking=accept-new -o LogLevel=ERROR)
          sha="${{ steps.gate.outputs.sha }}"
          sshpass -e scp "${opts[@]}" infra/scripts/mnebyvpn-node-expiry-pilot.py \
            "root@$HOST:/tmp/mnebyvpn-node-expiry-pilot.py"
          sshpass -e scp "${opts[@]}" infra/scripts/mnebyvpn-main-node-worker-promote.sh \
            "root@$HOST:/tmp/mnebyvpn-main-node-worker-$sha.sh"
          sshpass -e scp "${opts[@]}" infra/scripts/mnebyvpn-main-bot-promote.sh \
            "root@$HOST:/tmp/mnebyvpn-main-bot-promote-$sha.sh"
          sshpass -e ssh "${opts[@]}" "root@$HOST" \
            "bash /tmp/mnebyvpn-main-node-worker-$sha.sh '$sha' && bash /tmp/mnebyvpn-main-bot-promote-$sha.sh '$sha'"
          echo "node_worker_release_sha=$sha" >> "$GITHUB_STEP_SUMMARY"
          echo 'node_expiry_pilot=skipped_if_live_subscribers' >> "$GITHUB_STEP_SUMMARY"
          echo 'existing_customer_node_deadlines=checked_readonly' >> "$GITHUB_STEP_SUMMARY"
      - name: Verify foreign Telegram webhook still enforces authentication
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --noproxy '*' -s -o /dev/null -w '%{http_code}' \
            --max-time 15 -X POST -H 'Content-Type: application/json' \
            -d '{"update_id":100}' \
            https://cdn.servgo.ru:8443/mnebyvpn-telegram/webhook || true)"
          test "$code" = 401 || { echo "foreign_telegram_auth_check=$code"; exit 2; }
          echo 'foreign_telegram_auth=401_expected' >> "$GITHUB_STEP_SUMMARY"
      - name: Clean only uploaded release-specific files
        if: always()
        shell: bash
        run: |
          if [[ -n "$SSH_PASSWORD" ]]; then
            export SSHPASS="$SSH_PASSWORD"
            sshpass -e ssh -o ConnectTimeout=9 -o StrictHostKeyChecking=accept-new \
              -o LogLevel=ERROR "root@$HOST" \
              "rm -f /tmp/mnebyvpn-node-expiry-pilot.py /tmp/mnebyvpn-main-node-worker-${{ steps.gate.outputs.sha }}.sh /tmp/mnebyvpn-main-bot-promote-${{ steps.gate.outputs.sha }}.sh" || true
          fi
