name: MNEBYDNS classify foreign firewall drop rules affecting 443 (read-only)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths: [".github/workflows/mnebydns-de-firewall-443-readonly-20261113.yml"]
  push:
    branches: [main]
    paths: [".github/workflows/mnebydns-de-firewall-443-readonly-20261113.yml"]
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('mnebydns-fw-offline-{0}',github.ref) || 'mnebydns-firewall-readonly' }}
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce strict pins and one-time read-only firewall classification
        run: |
          set -Eeuo pipefail
          test "$(grep -c ' ssh-ed25519 ' ops/mnebydns-owner-ssh-known_hosts)" -eq 2
          grep -q 'nft.*list.*ruleset' .github/workflows/mnebydns-de-firewall-443-readonly-20261113.yml
          ! grep -Eq 'nft (add|delete|flush)|iptables (-A|-I|-D|-F)|systemctl (restart|reload)' .github/workflows/mnebydns-de-firewall-443-readonly-20261113.yml
          echo MNEBYDNS_FIREWALL_443_READONLY_OFFLINE=PASS
  inspect:
    if: github.event_name == 'push'
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned SSH prerequisite
        run: |
          set -Eeuo pipefail
          test -n "$DE_PASS"
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -qq -y sshpass >/dev/null
      - name: Classify ONLY 443 drop rules (not the rules, IP addresses, or user traffic)
        shell: bash
        run: |
          set -Eeuo pipefail
          known="$PWD/ops/mnebydns-owner-ssh-known_hosts"
          export SSHPASS="$DE_PASS"
          sshpass -e ssh -T -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 -o UserKnownHostsFile="$known" -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o ConnectTimeout=12 -o LogLevel=ERROR root@89.125.90.101 'python3 -' <<'PY'
          import json,re,subprocess
          result={}
          for tool,args in (('nft',['nft','list','ruleset']),
                            ('iptables',['iptables','-S']),
                            ('ip6tables',['ip6tables','-S'])):
              try:
                  proc=subprocess.run(args,stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,
                                      text=True,timeout=12)
                  if proc.returncode:
                      result[tool]={'available':False}
                      continue
              except (OSError,subprocess.TimeoutExpired):
                  result[tool]={'available':False}
                  continue
              relevant=[]
              for line in proc.stdout.splitlines():
                  lower=line.lower()
                  if not (re.search(r'(?:dport|--dport|sport|--sport).*\b443\b',lower)
                          and any(v in lower for v in ('drop','reject','synproxy','limit'))):
                      continue
                  udp=bool(re.search(r'\budp\b|--protocol udp| -p udp',lower))
                  tcp=bool(re.search(r'\btcp\b|--protocol tcp| -p tcp',lower))
                  action='drop' if 'drop' in lower else ('reject' if 'reject' in lower else 'other')
                  relevant.append(dict(proto='tcp' if tcp and not udp else
                                       'udp' if udp and not tcp else 'unknown',
                                       action=action,
                                       has_rate_limit=bool(re.search(r'\blimit\b|hashlimit',lower)),
                                       has_ip_selector=bool(re.search(r'\b(?:ip|ip6)\s+[sd]addr|--(?:source|destination)',lower)),
                                       has_interface_selector='iif' in lower or 'oif' in lower))
              result[tool]={'available':True,'scoped_rules':relevant}
          print('FIREWALL_443_CLASSIFICATION='+json.dumps(result,sort_keys=True))
          print('FIREWALL_RAW_RULES_OR_IPS_LOGGED=false')
          print('FIREWALL_READONLY_NO_CONFIG_CHANGES=true')
          PY
