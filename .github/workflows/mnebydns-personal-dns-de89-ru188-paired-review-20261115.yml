name: MNEBYDNS paired DE CoreDNS RU personal sidecar code review
on:
  push:
    branches: [diag/mnebydns-live-video-stall-20261115]
    paths: [.github/workflows/mnebydns-personal-dns-de89-ru188-paired-review-20261115.yml]
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
      RU_PASS: ${{ secrets.SERVER188_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify actual sidecar, DNS policy integrity and core template quality with no changes
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$DE_PASS" && test -n "$RU_PASS" && test -s ops/mnebydns-owner-ssh-known_hosts
          python3 -m py_compile scripts/mnebydns-personal-dns-de89-ru188-paired-review-20261115.py
          sudo apt-get update -qq && sudo apt-get install -qq -y sshpass >/dev/null
          opts=(-T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts" -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR)
          SSHPASS="$DE_PASS" sshpass -e ssh "${opts[@]}" root@89.125.90.101 'AUDIT_ROLE=DE89 python3 -' < scripts/mnebydns-personal-dns-de89-ru188-paired-review-20261115.py > de.log 2>&1 &
          pd=$!
          SSHPASS="$RU_PASS" sshpass -e ssh "${opts[@]}" root@188.120.254.223 'AUDIT_ROLE=RU188 python3 -' < scripts/mnebydns-personal-dns-de89-ru188-paired-review-20261115.py > ru.log 2>&1 &
          pr=$!
          a=0;b=0
          wait "$pd" || a=$?
          wait "$pr" || b=$?
          grep '^PAIR_DNS_' de.log
          grep '^PAIR_DNS_' ru.log
          test "$a" -eq 0 && test "$b" -eq 0
          grep -q '^PAIR_DNS_DE89_DONE=true' de.log
          grep -q '^PAIR_DNS_RU188_DONE=true' ru.log
