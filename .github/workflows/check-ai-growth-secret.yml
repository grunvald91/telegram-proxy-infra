name: Check AI Growth server secret availability

on:
  push:
    branches:
      - ops/check-ai-growth-secret
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SERVER188_PASSWORD: ${{ secrets.SERVER188_SSH_PASSWORD }}
      AI_GROWTH_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
    steps:
      - name: Check secret availability without printing values
        run: |
          set -euo pipefail
          [ -n "$SERVER188_PASSWORD" ] || { echo "SERVER188_SECRET_AVAILABLE=no"; exit 1; }
          echo "SERVER188_SECRET_AVAILABLE=yes"
          if [ -n "$AI_GROWTH_PASSWORD" ]; then
            echo "AI_GROWTH_SECRET_AVAILABLE=yes"
          else
            echo "AI_GROWTH_SECRET_AVAILABLE=no"
          fi
