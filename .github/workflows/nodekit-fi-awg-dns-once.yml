name: Isolated FI AWG and DNS one-shot dispatcher
on:
  push:
    branches: [nodekit-fi-awg-dns-canary-20261117]
    paths:
      - .github/workflows/nodekit-fi-awg-dns-once.yml
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    if: github.repository == 'grunvald91/telegram-proxy-infra'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Stage closed Smart DNS and SNI proxy candidates on isolated new VPS
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api --method POST \
            repos/grunvald91/telegram-proxy-infra/actions/workflows/nodekit-prepare-new-vps.yml/dispatches \
            -f ref=main \
            -f "inputs[host]=217.11.167.91" \
            -f "inputs[node_id]=fi-test-01" \
            -f "inputs[advertise_host]=fi-test.mnebyvpn.site" \
            -f "inputs[mode]=dns_proxy_stage"
