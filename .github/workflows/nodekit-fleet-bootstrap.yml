name: MNEBYVPN fleet bootstrap (inventory-approved, subscribers off)
on:
  workflow_dispatch:
    inputs:
      country:
        description: 'Two-letter country (committed nodekit/fleet/xx.json)'
        required: true
        type: string
      phase:
        description: 'Idempotent bootstrap, certificate or isolated canary'
        required: true
        default: auto
        type: choice
        options: [auto, bootstrap, certificate, canary, inspect, controller-audit, service-audit, awg-netns-canary]
  repository_dispatch:
    types: [nodekit-bootstrap-approved]
  push:
    branches: [main]
    paths: ['nodekit/fleet/*.json']
permissions:
  contents: read
concurrency:
  group: mnebyvpn-fleet-${{ inputs.country || github.event.client_payload.country }}
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_nodes: ${{ steps.plan.outputs.has_nodes }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: plan
        name: Select immutable inventory for automatic or diagnostic run
        shell: bash
        env:
          INPUT_COUNTRY: ${{ inputs.country }}
          INPUT_PHASE: ${{ inputs.phase }}
          DISPATCH_COUNTRY: ${{ github.event.client_payload.country }}
          EVENT_KIND: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json,os,pathlib,re,subprocess
          kind=os.environ["EVENT_KIND"]
          selected=[]
          if kind=="workflow_dispatch":
              selected=[(os.environ["INPUT_COUNTRY"],os.environ["INPUT_PHASE"] or "auto")]
          elif kind=="repository_dispatch":
              selected=[(os.environ["DISPATCH_COUNTRY"],"auto")]
          elif kind=="push":
              before=os.environ["BEFORE_SHA"]
              after=os.environ["HEAD_SHA"]
              if not re.fullmatch(r"[a-f0-9]{40}",before) or before=="0"*40:
                  raise SystemExit("Refuse ambiguous inventory push range")
              found=subprocess.check_output(["git","diff","--name-only","--diff-filter=AM",
                  before,after,"--","nodekit/fleet"],text=True).splitlines()
              countries=sorted({pathlib.PurePosixPath(x).stem for x in found
                  if re.fullmatch(r"nodekit/fleet/[a-z]{2}\.json",x)})
              if len(countries)>8:
                  raise SystemExit("Fleet batch too large")
              selected=[(cc,"auto") for cc in countries]
          else:
              raise SystemExit("Unsupported fleet event")
          planned=[]
          for country,phase in selected:
              if not re.fullmatch(r"[a-z]{2}",country or ""):
                  raise SystemExit("Invalid immutable fleet country")
              if phase not in ("auto","bootstrap","certificate","canary","inspect",
                  "controller-audit","service-audit","awg-netns-canary"):
                  raise SystemExit("Invalid fleet phase")
              subprocess.run(["python3","nodekit/fleet_plan.py","--country",country],
                  check=True,stdout=subprocess.DEVNULL)
              planned.append({"country":country,"phase":phase})
          value=json.dumps({"include":planned},separators=(",",":"))
          with open(os.environ["GITHUB_OUTPUT"],"a") as output:
              print("matrix="+value,file=output)
              print("has_nodes="+("true" if planned else "false"),file=output)
          print("fleet_discovered_nodes="+str(len(planned)))
          PY
  bootstrap:
    needs: discover
    if: github.ref == 'refs/heads/main' && needs.discover.outputs.has_nodes == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: node-${{ matrix.country }}
    env:
      NODE_COUNTRY: ${{ matrix.country }}
      NODE_PHASE: ${{ matrix.phase }}
      LEGACY_FI_SSH_USER: ${{ secrets.MNEBYVPN_NEW_NODE_SSH_USER }}
      LEGACY_FI_SSH_PASSWORD: ${{ secrets.MNEBYVPN_NEW_NODE_SSH_PASSWORD }}
      NODEKIT_SSH_USER: ${{ secrets.NODEKIT_SSH_USER }}
      NODEKIT_SSH_PASSWORD: ${{ secrets.NODEKIT_SSH_PASSWORD }}
      EXISTING_APPROVED_KNOWN_HOSTS: ${{ secrets.NODEKIT_SSH_KNOWN_HOSTS }}
      RU188_SSH_PASSWORD: ${{ secrets.SERVER188_SSH_PASSWORD }}
      NODEKIT_CONTROLLER_PUBLIC_SHA256: ${{ vars.NODEKIT_CONTROLLER_PUBLIC_SHA256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify immutable public inventory; generate private node-spec
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          [[ "$NODE_COUNTRY" =~ ^[a-z]{2}$ ]] || exit 2
          [[ "$NODE_PHASE" =~ ^(auto|bootstrap|certificate|canary|inspect|controller-audit|service-audit|awg-netns-canary)$ ]] || exit 2
          python3 nodekit/fleet_plan.py --country "$NODE_COUNTRY" --write-spec "$RUNNER_TEMP/nodekit-spec.json" > "$RUNNER_TEMP/nodekit-reviewed.json"
          python3 - <<'PY'
          import json,os,pathlib
          entry=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'nodekit-reviewed.json').read_text())
          with open(os.environ['GITHUB_ENV'],'a') as env:
              for target,key in [('TARGET_IP','ssh_ipv4'),('NODE_ID','node_id'),('NODE_HOST','advertise_host')]:
                  print(f'{target}={entry[key]}',file=env)
              print('EXPECTED_IDENTITY_SHA='+str(entry['expected_identity_public_sha256'] or ''),file=env)
          PY
      - name: Setup pinned compiler for official AWG 3.1 sources
        if: env.NODE_PHASE == 'bootstrap' || env.NODE_PHASE == 'auto'
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.4'
          check-latest: false
      - name: Build pinned AWG 3.1 artifacts for exact native CPU
        if: env.NODE_PHASE == 'bootstrap' || env.NODE_PHASE == 'auto'
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/awg-repos" "$RUNNER_TEMP/awg-bin"
          cd "$RUNNER_TEMP/awg-repos"
          git clone -q --no-checkout https://github.com/amnezia-vpn/amneziawg-go.git userspace
          git -C userspace checkout -q --detach 08fe3d33bbb116be09a6183d02609311b8b0c9e8
          [[ "$(git -C userspace rev-parse HEAD)" == '08fe3d33bbb116be09a6183d02609311b8b0c9e8' ]]
          (cd userspace && GOTOOLCHAIN=local go build -trimpath -o "$RUNNER_TEMP/awg-bin/amneziawg-go" .)
          git clone -q --no-checkout https://github.com/amnezia-vpn/amneziawg-tools.git tools
          git -C tools checkout -q --detach ee0f0a9aa34ff0a0da4b3433b9512781cfe02843
          [[ "$(git -C tools rev-parse HEAD)" == 'ee0f0a9aa34ff0a0da4b3433b9512781cfe02843' ]]
          make -s -C tools/src
          install -m 0755 tools/src/wg "$RUNNER_TEMP/awg-bin/awg"
          install -m 0755 tools/src/wg-quick/linux.bash "$RUNNER_TEMP/awg-bin/awg-quick"
          chmod 0755 "$RUNNER_TEMP/awg-bin/amneziawg-go"
          for program in awg awg-quick amneziawg-go; do
            sum=$(sha256sum "$RUNNER_TEMP/awg-bin/$program" | cut -d' ' -f1)
            case "$program" in
              awg) echo "AWG_SHA=$sum" >> "$GITHUB_ENV" ;;
              awg-quick) echo "AWG_QUICK_SHA=$sum" >> "$GITHUB_ENV" ;;
              amneziawg-go) echo "AWG_GO_SHA=$sum" >> "$GITHUB_ENV" ;;
            esac
          done
      - name: Bootstrap or canary only inventory-approved VPS
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends sshpass >/dev/null
          target="$TARGET_IP"
          known="$RUNNER_TEMP/nodekit_known_hosts"
          : > "$known"; chmod 0600 "$known"
          # Persist the first SSH host key on existing RU188 before ANY node password is sent.
          # First contact is TOFU (not independent attestation); every later run is strictly pinned.
          [[ -n "$RU188_SSH_PASSWORD" ]] || { echo "::error::Missing RU188 transport secret"; exit 2; }
          grep -q '^188\.120\.254\.223 ssh-ed25519 ' ops/mnebydns-owner-ssh-known_hosts
          # Reject any conflicting approved key BEFORE asking RU188 to persist TOFU.
          expected_ssh_key="$(PREAPPROVED_SSH_KNOWN_HOSTS="$EXISTING_APPROVED_KNOWN_HOSTS" \
            python3 nodekit/approved_ssh_key.py --ip "$TARGET_IP")"
          export SSHPASS="$RU188_SSH_PASSWORD"
          ru_opts=(-T -F /dev/null -o ConnectTimeout=12 -o BatchMode=no
            -o PasswordAuthentication=yes -o PubkeyAuthentication=no
            -o KbdInteractiveAuthentication=no -o StrictHostKeyChecking=yes
            -o HostKeyAlgorithms=ssh-ed25519
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts"
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no
            -o ForwardAgent=no -o ClearAllForwardings=yes
            -o ControlMaster=no -o ProxyCommand=none -o LogLevel=ERROR)
          sshpass -e ssh "${ru_opts[@]}" root@188.120.254.223 \
            "python3 - --country '$NODE_COUNTRY' --node-id '$NODE_ID' --ip '$TARGET_IP' --expected-key-b64 '$expected_ssh_key'" \
            < nodekit/fleet_host_trust.py > "$known"
          [[ "$(wc -l < "$known")" == 1 ]] || exit 2
          grep -Eq "^$TARGET_IP ssh-ed25519 [A-Za-z0-9+/]+=*$" "$known" || exit 2
          if [[ -n "$NODEKIT_SSH_PASSWORD" && "$NODEKIT_SSH_USER" == root ]]; then
            export SSHPASS="$NODEKIT_SSH_PASSWORD"
            user="$NODEKIT_SSH_USER"
          elif [[ "$NODE_COUNTRY" == fi && "$TARGET_IP" == 217.11.167.91 &&
                  "$LEGACY_FI_SSH_USER" == root && -n "$LEGACY_FI_SSH_PASSWORD" ]]; then
            export SSHPASS="$LEGACY_FI_SSH_PASSWORD"
            user="$LEGACY_FI_SSH_USER"
          else
            echo "::error::Missing machine-provisioned per-node SSH credentials"; exit 2
          fi
          opts=(-F /dev/null -o PubkeyAuthentication=no
            -o PreferredAuthentications=password,keyboard-interactive
            -o NumberOfPasswordPrompts=1 -o StrictHostKeyChecking=yes
            -o HostKeyAlgorithms=ssh-ed25519
            -o UserKnownHostsFile="$known" -o GlobalKnownHostsFile=/dev/null
            -o UpdateHostKeys=no -o ForwardAgent=no -o ClearAllForwardings=yes
            -o ControlMaster=no -o ProxyCommand=none
            -o HostKeyAlias="$TARGET_IP"
            -o ConnectTimeout=12 -o ServerAliveInterval=20 -o ServerAliveCountMax=12)
          remote_ssh() { sshpass -e ssh "${opts[@]}" "${user}@${target}" "$@"; }
          remote_scp() { sshpass -e scp "${opts[@]}" "$@"; }
          if [[ "$NODE_PHASE" == auto || "$NODE_PHASE" == bootstrap ]]; then
            # AWG tools are built for the runner CPU. A different VPS architecture
            # must not receive an unusable x86_64 binary.
            [[ "$(uname -m)" == x86_64 ]] || {
              echo "::error::Unsupported runner architecture for AWG"; exit 2;
            }
            remote_arch="$(remote_ssh 'uname -m')"
            [[ "$remote_arch" == x86_64 ]] || {
              echo "::error::VPS architecture differs from reviewed AWG build"; exit 2;
            }
          fi
          remote_dir=$(remote_ssh 'umask 077; mktemp -d /tmp/mnebyvpn-nodekit.XXXXXXXX')
          [[ "$remote_dir" =~ ^/tmp/mnebyvpn-nodekit\.[A-Za-z0-9]{8}$ ]] || exit 2
          cleanup() { remote_ssh "rm -rf -- '$remote_dir'" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          scripts=(nodekit/nodekit.py nodekit/identity.py nodekit/install_components.py
            nodekit/vpn_stage.py nodekit/provision_node.py nodekit/dns_proxy_stage.py
            nodekit/amneziawg_artifacts.py nodekit/amneziawg_stage.py
            nodekit/awg_lifecycle.py nodekit/awg_upgrade.py nodekit/awg_netns_canary.py nodekit/awg_egress.py nodekit/awg_controller_readiness.py nodekit/service_readiness.py nodekit/awg_peer_grants.py nodekit/install_awg_watchdog.py nodekit/tls_stage.py nodekit/dot_local_canary.py)
          remote_scp "${scripts[@]}" "$RUNNER_TEMP/nodekit-spec.json" "${user}@${target}:$remote_dir/"
          # Filenames are fixed and node_id/ip/host all come from reviewed inventory.
          if [[ "$NODE_PHASE" == bootstrap || "$NODE_PHASE" == auto ]]; then
            remote_scp "$RUNNER_TEMP/awg-bin/awg" "$RUNNER_TEMP/awg-bin/awg-quick" "$RUNNER_TEMP/awg-bin/amneziawg-go" "${user}@${target}:$remote_dir/"
            remote_ssh "python3 '$remote_dir/provision_node.py' --source-dir '$remote_dir' --spec '$remote_dir/nodekit-spec.json'"
            if [[ -n "$EXPECTED_IDENTITY_SHA" ]]; then
              remote_ssh "python3 -c 'import hashlib,pathlib; from sys import exit; p=pathlib.Path(\"/var/lib/mnebyvpn-nodekit/$NODE_ID/identity/node-public.spki\"); exit(0 if hashlib.sha256(p.read_bytes()).hexdigest()==\"$EXPECTED_IDENTITY_SHA\" else 2)'"
            fi
            remote_ssh "python3 '$remote_dir/amneziawg_artifacts.py' --node-id '$NODE_ID' --bundle '$remote_dir' --awg-sha256 '$AWG_SHA' --awg-quick-sha256 '$AWG_QUICK_SHA' --amneziawg-go-sha256 '$AWG_GO_SHA'"
            remote_ssh "python3 '$remote_dir/amneziawg_stage.py' --node-id '$NODE_ID' --awg-sha256 '$AWG_SHA' --awg-quick-sha256 '$AWG_QUICK_SHA' --amneziawg-go-sha256 '$AWG_GO_SHA'"
            remote_ssh "python3 '$remote_dir/awg_lifecycle.py' --node-id '$NODE_ID' --mode install"
            if [[ "$NODE_ID" == 'fi-test-01' && "$TARGET_IP" == '217.11.167.91' ]]; then
              remote_ssh "python3 '$remote_dir/awg_upgrade.py' --node-id '$NODE_ID' --source-dir '$remote_dir'"
            fi
            remote_ssh "python3 '$remote_dir/install_awg_watchdog.py' --node-id '$NODE_ID'"
            remote_ssh "python3 '$remote_dir/awg_egress.py' --node-id '$NODE_ID' --mode install"
            remote_ssh "python3 '$remote_dir/dns_proxy_stage.py' --node-id '$NODE_ID' --external-ipv4 '$TARGET_IP' --dns-host '$NODE_HOST'"
            if [[ "$NODE_PHASE" == auto ]]; then
              # Single noninteractive build -> TLS -> empty canary -> inspection.
              # Failure stops here; no database enrollment or paid subscriber release.
              remote_ssh 'command -v certbot >/dev/null || (export DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l; apt-get update -qq && apt-get install -y -qq --no-install-recommends certbot >/dev/null)'
              remote_ssh "python3 '$remote_dir/tls_stage.py' --node-id '$NODE_ID' --host '$NODE_HOST' --expected-ipv4 '$TARGET_IP' --mode issue"
              remote_ssh 'systemctl enable --now certbot.timer'
              remote_ssh "python3 '$remote_dir/awg_lifecycle.py' --node-id '$NODE_ID' --mode canary"
              remote_ssh "python3 '$remote_dir/dot_local_canary.py' --node-id '$NODE_ID' --host '$NODE_HOST' --expected-ipv4 '$TARGET_IP'"
              remote_ssh "python3 '$remote_dir/awg_lifecycle.py' --node-id '$NODE_ID' --mode inspect"
              remote_ssh "python3 '$remote_dir/awg_peer_grants.py' --node-id '$NODE_ID' --mode inspect"
              remote_ssh "python3 '$remote_dir/awg_egress.py' --node-id '$NODE_ID' --mode inspect"
              remote_ssh "python3 '$remote_dir/tls_stage.py' --node-id '$NODE_ID' --host '$NODE_HOST' --expected-ipv4 '$TARGET_IP' --mode verify"
              echo 'FLEET_AUTO_STAGED_AND_CANARY_CHECKED=true'
            fi
          elif [[ "$NODE_PHASE" == certificate ]]; then
            remote_ssh 'command -v certbot >/dev/null || (export DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l; apt-get update -qq && apt-get install -y -qq --no-install-recommends certbot >/dev/null)'
            remote_ssh "python3 '$remote_dir/tls_stage.py' --node-id '$NODE_ID' --host '$NODE_HOST' --expected-ipv4 '$TARGET_IP' --mode issue"
            remote_ssh 'systemctl enable --now certbot.timer'
          elif [[ "$NODE_PHASE" == canary ]]; then
            remote_ssh "python3 '$remote_dir/awg_lifecycle.py' --node-id '$NODE_ID' --mode canary"
            remote_ssh "python3 '$remote_dir/dot_local_canary.py' --node-id '$NODE_ID' --host '$NODE_HOST' --expected-ipv4 '$TARGET_IP'"
          elif [[ "$NODE_PHASE" == awg-netns-canary ]]; then
            [[ "$NODE_COUNTRY" == fi && "$TARGET_IP" == 217.11.167.91 ]] || {
              echo '::error::Namespace canary approved only for isolated Finland testing VPS'; exit 2;
            }
            remote_ssh "python3 '$remote_dir/awg_netns_canary.py' --node-id '$NODE_ID' --host '$NODE_HOST'"
          elif [[ "$NODE_PHASE" == controller-audit ]]; then
            [[ "$NODE_COUNTRY" == fi && "$NODE_ID" == fi-test-01 && "$TARGET_IP" == 217.11.167.91 ]] || {
              echo '::error::Controller audit restricted to reviewed FI testing identity'; exit 2;
            }
            [[ "$EXPECTED_IDENTITY_SHA" =~ ^[a-f0-9]{64}$ ]] || {
              echo '::error::Independent node identity pin is required'; exit 2;
            }
            remote_ssh "python3 '$remote_dir/awg_controller_readiness.py' --node-id '$NODE_ID' --host '$NODE_HOST' --expected-identity-sha256 '$EXPECTED_IDENTITY_SHA' --expected-controller-sha256 '$NODEKIT_CONTROLLER_PUBLIC_SHA256'"
          elif [[ "$NODE_PHASE" == service-audit ]]; then
            [[ "$NODE_COUNTRY" == fi && "$NODE_ID" == fi-test-01 && "$TARGET_IP" == 217.11.167.91 ]] || {
              echo '::error::Service audit restricted to approved FI testing node'; exit 2;
            }
            [[ "$EXPECTED_IDENTITY_SHA" =~ ^[a-f0-9]{64}$ ]] || {
              echo '::error::Read-only service audit requires independently pinned node identity'; exit 2;
            }
            remote_ssh "python3 '$remote_dir/service_readiness.py' --node-id '$NODE_ID' --host '$NODE_HOST' --expected-identity-sha256 '$EXPECTED_IDENTITY_SHA' --expected-controller-sha256 '$NODEKIT_CONTROLLER_PUBLIC_SHA256'"
            echo 'SERVICE_READINESS_IS_NOT_RELEASE_APPROVAL=true'
          elif [[ "$NODE_PHASE" == inspect ]]; then
            remote_ssh "python3 '$remote_dir/awg_lifecycle.py' --node-id '$NODE_ID' --mode inspect"
            remote_ssh "python3 '$remote_dir/awg_peer_grants.py' --node-id '$NODE_ID' --mode inspect"
            remote_ssh "python3 '$remote_dir/awg_egress.py' --node-id '$NODE_ID' --mode inspect"
            remote_ssh "python3 '$remote_dir/tls_stage.py' --node-id '$NODE_ID' --host '$NODE_HOST' --expected-ipv4 '$TARGET_IP' --mode verify"
          else exit 2; fi
          echo 'FLEET_STAGE_COMPLETE=true'
          echo 'SUBSCRIBER_PUBLICATION=false'
          echo 'FIREWALL_MODIFIED=false'
          echo 'PAID_ENTITLEMENTS_PROVISIONED=false'
