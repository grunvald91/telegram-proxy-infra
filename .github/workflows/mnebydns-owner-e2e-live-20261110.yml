name: "MNEBYDNS owner one-shot live exact-host E2E with rollback"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mnebydns-owner-e2e-live-20261110.yml"
      - "scripts/mnebydns-owner-domain-e2e-20261110.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/mnebydns-owner-e2e-live-20261110.yml"
      - "scripts/mnebydns-owner-domain-e2e-20261110.py"
permissions:
  contents: read
concurrency:
  group: mnebydns-google-public-443-change
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify E2E uses fixed test hostname and fail-closed owner controller
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/mnebydns-owner-domain-e2e-20261110.py
          grep -Fq 'TARGET="www.rfc-editor.org"' scripts/mnebydns-owner-domain-e2e-20261110.py
          grep -Fq 'owner_e2e_independent_systemd_rollback=PASS' scripts/mnebydns-owner-domain-e2e-20261110.py
          grep -Fq 'owner_e2e_confirm_remove_live_restored=PASS' scripts/mnebydns-owner-domain-e2e-20261110.py
          echo owner_e2e_readonly_contract=PASS
  live:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 29
    env:
      RU_PASS: ${{ secrets.SERVER188_SSH_PASSWORD }}
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Bounded live 2-phase E2E; exact hostname only, guarded checkpoint, independent rollback
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$RU_PASS" && test -n "$DE_PASS"
          sudo apt-get update -qq && sudo apt-get install -qq -y sshpass >/dev/null
          python3 scripts/mnebydns-owner-domain-e2e-20261110.py
          echo owner_e2e_one_shot_job_finished=true
