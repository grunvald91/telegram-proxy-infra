name: MNEBYDNS recover DoT Corefile group permissions (guarded, one-time)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - "scripts/mnebydns-dot-corefile-permissions-recover-20261113.sh"
      - ".github/workflows/mnebydns-dot-corefile-permissions-recover-20261113.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/mnebydns-dot-corefile-permissions-recover-20261113.yml"
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('mnebydns-dot-perm-offline-{0}', github.ref) || 'mnebydns-google-public-443-change' }}
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify DynamicUser reader group loaded from systemd unit and guarded repair
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n scripts/mnebydns-dot-corefile-permissions-recover-20261113.sh
          python3 scripts/mnebydns-owner-domain-render-20261110.py self-test
          test "$(grep -c ' ssh-ed25519 ' ops/mnebydns-owner-ssh-known_hosts)" -eq 2
          ! grep -Eq 'chmod -R|chown -R|StrictHostKeyChecking=no|accept-new|rm -rf' scripts/mnebydns-dot-corefile-permissions-recover-20261113.sh
          echo DOT_PERMISSIONS_REPAIR_OFFLINE=PASS
  recover:
    if: github.event_name == 'push'
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
      RU_PASS: ${{ secrets.SERVER188_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned SSH and verify secret
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$DE_PASS" && test -n "$RU_PASS"
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sshpass >/dev/null
      - name: Repair ONLY stable Corefile group permission and restart failed DoT
        shell: bash
        run: |
          set -Eeuo pipefail
          known="$PWD/ops/mnebydns-owner-ssh-known_hosts"
          export SSHPASS="$DE_PASS"
          sshpass -e ssh -T -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 -o UserKnownHostsFile="$known" -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o ConnectTimeout=12 -o LogLevel=ERROR root@89.125.90.101 'bash -se' < scripts/mnebydns-dot-corefile-permissions-recover-20261113.sh
      - name: Strict public DoT TLS and control services from runner (read only)
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import importlib.util, pathlib
          path=pathlib.Path('scripts/mnebydns-owner-domain-controller-20261110.py')
          spec=importlib.util.spec_from_file_location('mnebydns_owner_verify',path)
          owner=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(owner)
          for host in ('gemini.google.com','claude.ai','grok.com','x.com','www.tiktok.com'):
              code, ips = owner.dns_q(host,1)
              assert code==0 and ips==[owner.EDGE], f'bad protected DoT response: {host}'
          print("DOT_RECOVERY_PROTECTED_SERVICE_A=PASS")
          PY
      - name: Preserve outcome in job summary
        if: always()
        shell: bash
        run: |
          echo "Corefile permissions repair and strict DoT verification: see step outcomes; no route contents modified" >> "$GITHUB_STEP_SUMMARY"
