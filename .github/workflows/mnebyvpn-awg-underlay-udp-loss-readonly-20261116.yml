name: MNEBYVPN AWG physical UDP DE to RU drop localization readonly
on:
  push:
    branches: [audit/mnebyvpn-853-wg-rootcause-20261116]
    paths: ['.github/workflows/mnebyvpn-awg-underlay-udp-loss-readonly-20261116.yml']
permissions: {contents: read}
concurrency:
  group: mnebyvpn-awg-physical-udp-localize
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RU_PASS: ${{ secrets.SERVER188_SSH_PASSWORD }}
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Capture only two-server outer UDP headers and a single controlled inner ICMP flow
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$RU_PASS" && test -n "$DE_PASS"
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sshpass >/dev/null
          opts=(-T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts" -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR)
          remote() {
            local password="$1" host="$2"; shift 2
            SSHPASS="$password" sshpass -e ssh "${opts[@]}" root@"$host" "$@"
          }
          # Captures read only packet metadata, no payloads / pcap, exactly DE->RU datagrams.
          de_cap="timeout -s INT 36 tcpdump -q -n -tt -l -s 68 -i eth0 'udp and src host 89.125.90.101 and dst host 188.120.254.223 and greater 1100' 2>/dev/null"
          ru_cap="timeout -s INT 36 tcpdump -q -n -tt -l -s 68 -i ens3 'udp and src host 89.125.90.101 and dst host 188.120.254.223 and greater 1100' 2>/dev/null"
          remote "$DE_PASS" 89.125.90.101 "$de_cap" > "$RUNNER_TEMP/de-outer.txt" &
          de_pid=$!
          remote "$RU_PASS" 188.120.254.223 "$ru_cap" > "$RUNNER_TEMP/ru-outer.txt" &
          ru_pid=$!
          sleep 4
          # -p changes payload pattern only; encrypted outer datagrams cannot be linked to a user.
          remote "$DE_PASS" 89.125.90.101 'ping -n -q -M do -c 45 -i 0.35 -s 1200 -W 1 10.66.77.2' > "$RUNNER_TEMP/icmp-summary.txt" || true
          wait "$de_pid" || true
          wait "$ru_pid" || true
          python3 - "$RUNNER_TEMP/de-outer.txt" "$RUNNER_TEMP/ru-outer.txt" "$RUNNER_TEMP/icmp-summary.txt" <<'PY'
          import sys,pathlib,re,json,collections
          de,ru,ping=[pathlib.Path(x).read_text(errors="replace") for x in sys.argv[1:]]
          def lengths(text):
              arr=[]
              for line in text.splitlines():
                  m=re.search(r'\bUDP, length (\d+)',line)
                  if m:arr.append(int(m[1]))
              return arr
          a,b=lengths(de),lengths(ru)
          source,dest=collections.Counter(a),collections.Counter(b)
          m=re.search(r"(\d+) packets transmitted,\s*(\d+) (?:packets )?received,\s*([\d.]+)% packet loss",ping)
          report={"source_de_outer_udp_gt1100":len(a),
                  "dest_ru_outer_udp_gt1100":len(b),
                  "source_distinct_sizes":len(source),"dest_distinct_sizes":len(dest),
                  "missing_by_size":sum((source-dest).values()),
                  "size_histogram_match":source==dest,
                  "icmp_sent":int(m[1]) if m else None,
                  "icmp_received":int(m[2]) if m else None,
                  "icmp_loss_pct":float(m[3]) if m else None,
                  "capture_enough":len(a)>0 and len(b)>0 and bool(m),
                  "sample_scope":"only oversized DE->RU UDP on the physical interfaces; may include concurrent legitimate tunnel packets"}
          print("AWG_OUTER_UDP_COMPARE="+json.dumps(report,separators=(",",":")),flush=True)
          if not report["capture_enough"]:raise SystemExit("INSUFFICIENT_PHYSICAL_UDP_METADATA")
          PY
          echo AWG_UNDERLAY_READONLY_COMPLETE=true
