name: FI AWG signed-node-receipt one-shot stage
on:
  push:
    branches: [feat/nodekit-awg-signed-node-acks-20261118]
    paths: [.github/workflows/nodekit-fi-ack-stage-once.yml]
permissions:
  contents: write
jobs:
  dispatch:
    if: github.repository == 'grunvald91/telegram-proxy-infra'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Install approved signed node ack on inactive FI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh api --method POST \
            repos/grunvald91/telegram-proxy-infra/dispatches \
            -f event_type=nodekit-bootstrap-approved \
            -f "client_payload[country]=fi"
