name: Relay89 server-side sealed backup
on:
  push:
    branches: [ops/relay89-encrypted-backup-20261111]
    paths: ['.github/workflows/relay89-sealed-backup.yml']
permissions:
  contents: read
concurrency:
  group: relay89-sealed-backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Create encrypted backup on server before any data transfer
        env:
          SSHPASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$SSHPASS"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          opts=(-T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts" -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no)
          mkdir -m 700 "$RUNNER_TEMP/sealed"
          sshpass -e ssh "${opts[@]}" root@89.125.90.101 'python3 -' > "$RUNNER_TEMP/sealed/relay89.tar.gz.mnebak" 2> "$RUNNER_TEMP/backup-metadata.txt" <<'PY'
          import pathlib,hashlib,sys
          expected='4f13dbf5b99ea75b7011211c6cca670f70933e6e2d8f4d8f908f6f5f50fbfdd8'
          for p in pathlib.Path('/var/backups/mnebyvpn-sealed').glob('relay89-*.mnebak'):
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for b in iter(lambda:f.read(1048576),b''):h.update(b)
              if h.hexdigest()==expected:
                  print('server_ciphertext_sha256='+expected,file=sys.stderr)
                  print('server_ciphertext_bytes='+str(p.stat().st_size),file=sys.stderr)
                  with p.open('rb') as f:
                      for b in iter(lambda:f.read(1048576),b''):sys.stdout.buffer.write(b)
                  break
          else: raise RuntimeError('Expected existing sealed backup not found')
          PY
          cat "$RUNNER_TEMP/backup-metadata.txt"
          expected=$(sed -n 's/^server_ciphertext_sha256=//p' "$RUNNER_TEMP/backup-metadata.txt")
          test "${#expected}" -eq 64
          printf '%s  %s\n' "$expected" "$RUNNER_TEMP/sealed/relay89.tar.gz.mnebak" | sha256sum -c -
          python3 - <<'PY'
          import os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'sealed/relay89.tar.gz.mnebak'
          with p.open('rb') as f: assert f.read(len(b'MNEBYVPN-SEALED-V1\n'))==b'MNEBYVPN-SEALED-V1\n'
          print('transferred_ciphertext_only=true')
          PY
      - name: Stage only ciphertext for private-vault transfer
        uses: actions/upload-artifact@v4
        with:
          name: relay89-sealed-ciphertext
          path: ${{ runner.temp }}/sealed/*.mnebak
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
