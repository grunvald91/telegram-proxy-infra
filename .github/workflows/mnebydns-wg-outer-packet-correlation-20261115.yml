name: MNEBYDNS compare inbound and outbound WireGuard UDP datagrams read-only
on:
  push:
    branches: [restore/mnebydns-youtube-morning-20261115]
    paths: ['.github/workflows/mnebydns-wg-outer-packet-correlation-20261115.yml']
permissions: {contents: read}
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      RU_PASS: ${{ secrets.SERVER188_SSH_PASSWORD }}
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Correlate passive outer WireGuard UDP packet fingerprints across both interfaces
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$RU_PASS" && test -n "$DE_PASS"
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -qq -y sshpass >/dev/null
          opts=(-T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts"
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR)
          remote() {
            local pass="$1" host="$2" command="$3"
            SSHPASS="$pass" sshpass -e ssh "${opts[@]}" "root@$host" "$command"
          }
          echo OUTER_CAPTURE_PRECHECK_BEGIN
          remote "$DE_PASS" 89.125.90.101 "wg show tg-relay listen-port; wg show tg-relay endpoints; command -v tcpdump"
          remote "$RU_PASS" 188.120.254.223 "wg show tg-relay listen-port; wg show tg-relay endpoints; command -v tcpdump"
          capture="timeout -s INT 48s tcpdump -i eth0 -s 128 -U -w - 'src host 89.125.90.101 and dst host 188.120.254.223 and udp'"
          remote "$DE_PASS" 89.125.90.101 "$capture" > "$RUNNER_TEMP/de.pcap" 2>"$RUNNER_TEMP/de.err" &
          pid1=$!
          capture="timeout -s INT 48s tcpdump -i ens3 -s 128 -U -w - 'src host 89.125.90.101 and dst host 188.120.254.223 and udp'"
          remote "$RU_PASS" 188.120.254.223 "$capture" > "$RUNNER_TEMP/ru.pcap" 2>"$RUNNER_TEMP/ru.err" &
          pid2=$!
          sleep 4
          remote "$RU_PASS" 188.120.254.223 "ping -n -q -M do -e 29013 -c 42 -i 0.75 -s 1200 -W 2 10.66.77.1 || true"
          wait "$pid1" || true
          wait "$pid2" || true
          python3 - "$RUNNER_TEMP/de.pcap" "$RUNNER_TEMP/ru.pcap" <<'PY'
          import sys,struct,hashlib,collections,pathlib,json
          def load(path):
            b=pathlib.Path(path).read_bytes()
            if len(b)<24:raise ValueError('empty capture '+str(path))
            magic=b[:4]
            endian='<' if magic in (bytes.fromhex('d4c3b2a1'),bytes.fromhex('4d3cb2a1')) else '>'
            link=struct.unpack(endian+'I',b[20:24])[0]
            if link!=1:raise ValueError('Ethernet DLT expected: '+str(link))
            p=24;rows=[];fragments=0
            while p+16<=len(b):
              sec,usec,inc,orig=struct.unpack(endian+'IIII',b[p:p+16]);p+=16
              frame=b[p:p+inc];p+=inc
              if len(frame)<42 or frame[12:14]!=b'\x08\x00':continue
              off=14;ihl=(frame[off]&15)*4
              if len(frame)<off+ihl+8 or frame[off+9]!=17:continue
              flag=struct.unpack('!H',frame[off+6:off+8])[0]
              if flag&0x3fff:fragments+=1
              if flag&0x1fff:continue
              u=frame[off+ihl:];sp,dp,length,_=struct.unpack('!HHHH',u[:8])
              payload=u[8:]
              if len(payload)<16:continue
              kind=int.from_bytes(payload[:4],'little')
              if kind not in (1,2,3,4):continue
              fingerprint=hashlib.sha256(payload[:min(len(payload),64)]).hexdigest()
              rows.append((sec+usec/1000000,fingerprint,kind,length,sp,dp))
            return rows,fragments,len(b)
          de,df,db=load(sys.argv[1]);ru,rf,rb=load(sys.argv[2])
          if not de or not ru:raise ValueError('No WireGuard outer UDP to correlate')
          # Guard against staggered capture start/stop and clock differences.
          tmin=max(min(x[0] for x in de),min(x[0] for x in ru))+3
          tmax=min(max(x[0] for x in de),max(x[0] for x in ru))-3
          a=[x for x in de if tmin<=x[0]<=tmax and x[2]==4]
          b=[x for x in ru if tmin<=x[0]<=tmax+0.8 and x[2]==4]
          counts=collections.Counter(x[1] for x in b)
          missing=[]
          matched=0
          for x in a:
            if counts[x[1]]:counts[x[1]]-=1;matched+=1
            else:missing.append(x)
          out={'de_sent_captured_data':len(a),'ru_received_matching':matched,
               'missing_count':len(missing),'missing_pct':round(100*len(missing)/max(1,len(a)),2),
               'de_capture_total':len(de),'ru_capture_total':len(ru),
               'de_ip_fragments':df,'ru_ip_fragments':rf,
               'de_pcap_bytes':db,'ru_pcap_bytes':rb,
               'window_seconds':round(max(0,tmax-tmin),1),
               'missing_payload_lengths':dict(collections.Counter(x[3] for x in missing).most_common(8))}
          print('WG_OUTER_CORRELATION='+json.dumps(out,sort_keys=True),flush=True)
          PY
          echo OUTER_CAPTURE_DE_STATUS
          tail -n 4 "$RUNNER_TEMP/de.err" || true
          echo OUTER_CAPTURE_RU_STATUS
          tail -n 4 "$RUNNER_TEMP/ru.err" || true
          echo OUTER_CAPTURE_READONLY_COMPLETE=true
