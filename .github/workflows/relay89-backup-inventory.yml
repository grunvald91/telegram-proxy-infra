name: Relay89 backup inventory (metadata only)
on:
  push:
    branches: [ops/relay89-encrypted-backup-20261111]
    paths: ['.github/workflows/relay89-backup-inventory.yml']
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inventory backup sources without reading secret values
        env:
          SSHPASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts" -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no root@89.125.90.101 'python3 -' <<'PY'
          import os,shutil,subprocess,json
          from pathlib import Path
          print("backup_inventory_only=true")
          for name in ("tar","python3","pg_dump","pg_dumpall","docker","sqlite3","openssl"):
              print("tool_"+name+"="+str(bool(shutil.which(name))).lower())
          try:
              import cryptography
              print("python_cryptography=true")
          except ImportError: print("python_cryptography=false")
          print("opt_directories="+json.dumps(sorted(p.name for p in Path("/opt").iterdir() if p.is_dir())))
          if shutil.which("docker"):
              p=subprocess.run(["docker","ps","--format","{{.Names}}\t{{.Image}}"],capture_output=True,text=True,check=True)
              print("running_containers="+json.dumps(p.stdout.splitlines()))
          dbs=[]; envs=0
          for root in ("/opt","/var/lib"):
              for folder,dirs,files in os.walk(root):
                  dirs[:]=[d for d in dirs if d not in {".git","node_modules",".venv","venv","overlay2","buildkit","proc","sys","cache","snapshots"}]
                  for name in files:
                      if name==".env" or name.endswith(".env"):envs+=1
                      if name.endswith((".sqlite",".sqlite3",".db")):dbs.append(os.path.join(folder,name))
          print("database_candidate_paths="+json.dumps(dbs[:150]))
          print("environment_file_count="+str(envs))
          print("backup_created=false")
          PY
