name: FI AWG security patch one-off deployment
on:
  push:
    branches: [fix/nodekit-awg-controller-hardening-20261118]
    paths: [.github/workflows/nodekit-fi-security-patch-once.yml]
permissions:
  contents: write
jobs:
  dispatch:
    if: github.repository == 'grunvald91/telegram-proxy-infra'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Re-attempt guarded upgrade after SCP file-mode review
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh api --method POST \
            repos/grunvald91/telegram-proxy-infra/dispatches \
            -f event_type=nodekit-bootstrap-approved \
            -f "client_payload[country]=fi"
