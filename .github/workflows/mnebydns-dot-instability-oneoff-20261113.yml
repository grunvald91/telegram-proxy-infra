name: MNEBYDNS one-off DNS/DoT stability audit (read-only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/mnebydns-dot-instability-oneoff-20261113.yml']
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate read-only DNS probe
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/mnebydns-speed-readonly-20261113.py scripts/mnebydns_reliability_monitor.py
          python3 scripts/mnebydns-speed-readonly-20261113.py --self-test
      - name: Collect read-only DNS latency and error report
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/mnebydns-speed-readonly-20261113.py --run
          test -s speed-readonly-results/report.md
          cat speed-readonly-results/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Read CoreDNS uptime and bounded error classifications (no restart)
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$DE_PASS"
          test -s ops/mnebydns-owner-ssh-known_hosts
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass >/dev/null
          export SSHPASS="$DE_PASS"
          sshpass -e ssh -T -o ConnectTimeout=10 -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR \
            root@89.125.90.101 'python3 -' <<'PY'
          import pathlib,subprocess,re
          def read(args,timeout=8):
              try:
                  r=subprocess.run(args,capture_output=True,text=True,timeout=timeout)
                  return r.stdout if r.returncode==0 else ''
              except Exception:return ''
          for line in read(['systemctl','show','mnebydns-dot.service',
                            '-p','ActiveState','-p','SubState','-p','NRestarts',
                            '-p','ExecMainStatus']).splitlines():
              print('DOT_'+line[:100])
          core=pathlib.Path('/opt/mnebydns-dot/Corefile')
          if core.is_file():
              print('DOT_COREFILE_READABLE=true')
              print('DOT_COREFILE_GROUP_READABLE='+str(bool(core.stat().st_mode&0o040)))
          listeners=read(['ss','-Hlntp'])
          print('DOT_COREDNS_853_LISTEN='+str(any(
              ':853 ' in l and 'coredns' in l.lower() for l in listeners.splitlines())))
          journal=read(['journalctl','-u','mnebydns-dot.service','--since','-6 hours',
                        '--no-pager','-o','cat'],timeout=15)
          for name,pattern in {
              'servfail':'servfail','timeout':'timeout|timed out',
              'permission':'permission denied',
              'restart':'started|stopping|failed',
              'upstream_error':'plugin/errors|read udp|dial tcp'
          }.items():
              print('DOT_JOURNAL_6H_'+name.upper()+'='+str(sum(bool(
                  re.search(pattern,line,re.I)) for line in journal.splitlines())))
          print('DOT_JOURNAL_RAW_CONTENT_NOT_EXPORTED=true')
          print('AUDIT_PRODUCTION_CHANGES=false')
          PY
      - name: Attach bounded report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mnebydns-dot-stability-report
          path: speed-readonly-results/
          if-no-files-found: ignore
          retention-days: 3
