          journal=command(['journalctl','-u','mnebydns-dot.service',
                           '--since','-6 hours','--no-pager','-o','cat'],timeout=15)
          patterns={'servfail':r'servfail', 'timeout':r'timeout|timed out',
                    'permission':r'permission denied','restart':r'started|stopping|failed',
                    'upstream_error':r'plugin/errors|read udp|dial tcp'}
