name: MNEBYDNS one-off DNS/DoT stability check (read-only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/mnebydns-dot-instability-oneoff-20261113.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mnebydns-oneoff-dot-instability-check
  cancel-in-progress: false
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      RU_PASS: ${{ secrets.SERVER188_SSH_PASSWORD }}
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate read-only probe and prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$RU_PASS" && test -n "$DE_PASS"
          test -s ops/mnebydns-owner-ssh-known_hosts
          python3 -m py_compile scripts/mnebydns-speed-readonly-20261113.py scripts/mnebydns_reliability_monitor.py
          python3 scripts/mnebydns-speed-readonly-20261113.py --self-test
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sshpass >/dev/null
      - name: Repeated strict TLS and DNS queries from RU DE and GitHub (no production changes)
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/mnebydns-speed-readonly-20261113.py --run
          test -s speed-readonly-results/report.md
          cat speed-readonly-results/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Check DE DoT process continuity and classified errors (read-only)
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          export SSHPASS="$DE_PASS"
          sshpass -e ssh -T -o ConnectTimeout=10 -o StrictHostKeyChecking=yes \
            -o HostKeyAlgorithms=ssh-ed25519 \
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR \
            root@89.125.90.101 'python3 -' <<'PY'
