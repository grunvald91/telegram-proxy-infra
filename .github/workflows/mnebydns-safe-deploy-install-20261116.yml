name: Finalize MNEBYDNS protected deploy on DE89 with verified DNS reader permissions
on:
  push:
    branches: [audit/smartdns-installed-review-20261115]
    paths: ['.github/workflows/mnebydns-safe-deploy-install-20261116.yml']
permissions: {contents: read}
concurrency:
  group: mnebydns-google-public-443-change
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Install guarded safe deploy code only, preserving live CoreDNS and Nginx
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$DE_PASS"
          python3 -m py_compile scripts/mnebydns_nov8_restore_safety.py scripts/mnebydns_safe_deploy.py
          if ! command -v sshpass >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass >/dev/null
          fi
          opts=(-T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts"
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR)
          host=root@89.125.90.101
          ssh_remote() {
            SSHPASS="$DE_PASS" sshpass -e ssh "${opts[@]}" "$host" "$@"
          }
          ssh_remote 'set -eu; install -d -o root -g root -m 0700 /opt/mnebydns-maintenance /opt/mnebydns-maintenance/stage /var/lib/mnebydns-safe-deploy; test ! -L /opt/mnebydns-maintenance; test ! -L /var/lib/mnebydns-safe-deploy'
          SSHPASS="$DE_PASS" sshpass -e ssh "${opts[@]}" "$host" 'set -eu; umask 077; cat > /opt/mnebydns-maintenance/mnebydns_nov8_restore_safety.py.incoming; python3 -m py_compile /opt/mnebydns-maintenance/mnebydns_nov8_restore_safety.py.incoming; chmod 0644 /opt/mnebydns-maintenance/mnebydns_nov8_restore_safety.py.incoming; mv -f /opt/mnebydns-maintenance/mnebydns_nov8_restore_safety.py.incoming /opt/mnebydns-maintenance/mnebydns_nov8_restore_safety.py' < scripts/mnebydns_nov8_restore_safety.py
          SSHPASS="$DE_PASS" sshpass -e ssh "${opts[@]}" "$host" 'set -eu; umask 077; cat > /opt/mnebydns-maintenance/mnebydns_safe_deploy.py.incoming; python3 -m py_compile /opt/mnebydns-maintenance/mnebydns_safe_deploy.py.incoming; chmod 0755 /opt/mnebydns-maintenance/mnebydns_safe_deploy.py.incoming; mv -f /opt/mnebydns-maintenance/mnebydns_safe_deploy.py.incoming /opt/mnebydns-maintenance/mnebydns_safe_deploy.py' < scripts/mnebydns_safe_deploy.py
          expected_module="$(sha256sum scripts/mnebydns_nov8_restore_safety.py | awk '{print $1}')"
          expected_cli="$(sha256sum scripts/mnebydns_safe_deploy.py | awk '{print $1}')"
          installed="$(ssh_remote 'sha256sum /opt/mnebydns-maintenance/mnebydns_nov8_restore_safety.py /opt/mnebydns-maintenance/mnebydns_safe_deploy.py')"
          grep -qF "$expected_module" <<< "$installed"
          grep -qF "$expected_cli" <<< "$installed"
          ssh_remote 'python3 -B /opt/mnebydns-maintenance/mnebydns_safe_deploy.py status' > status.json
          python3 - <<'PY'
          import json
          j=json.load(open('status.json'))
          assert j['read_only'] is True
          assert j['installer_version']=='2026-11-16-safe-deploy-v2'
          assert j['dns_reader_group_verified'] is True
          for role in ('dns','pilot','shared'):
              assert j['services'][role]['service_active'], role+' service failed'
              assert j['services'][role]['tcp_listener'], role+' listener missing'
              assert len(j['files'][role]['sha256'])==64
          print('SAFE_DEPLOY_MANAGER_INSTALLED_ON_DE89=true')
          print('CURRENT_DNS_AND_HTTPS_SERVICE_ACTIVE=true')
          print('CORE_DOT_READER_GROUP_GUARD_ENABLED=true')
          print('ORIGINAL_CUSTOMER_CONFIG_FILES_UNMODIFIED_BY_INSTALL=true')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mnebydns-safe-deploy-installed-status
          path: status.json
          retention-days: 7
          if-no-files-found: warn
