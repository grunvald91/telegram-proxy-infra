name: FI AWG reviewed fail-closed upgrade one-shot
on:
  push:
    branches: [fix/nodekit-awg-egress-failclosed-20261118]
    paths: [.github/workflows/nodekit-fi-egress-upgrade-once.yml]
permissions:
  contents: write
jobs:
  deploy:
    if: github.repository == 'grunvald91/telegram-proxy-infra'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run pinned inactive-code migration via reviewed fleet controller
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh api --method POST \
            repos/grunvald91/telegram-proxy-infra/dispatches \
            -f event_type=nodekit-bootstrap-approved \
            -f "client_payload[country]=fi"
