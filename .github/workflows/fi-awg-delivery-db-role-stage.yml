name: FI217 AWG delivery scoped PostgreSQL stage (worker OFF)
"on":
  push:
    branches: [main]
    paths:
      - '.github/workflows/fi-awg-delivery-db-role-stage.yml'
      - 'nodekit/fi_awg_delivery_db_stage.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fi-awg-delivery-db-provision
  cancel-in-progress: false
jobs:
  database-role:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: node-fi
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Offline DB privilege and nonpublishing regression tests
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile nodekit/fi_awg_delivery_db_stage.py
          python3 -m unittest discover -s nodekit/tests \
            -p 'test_fi_awg_delivery_db_stage.py' -v
      - name: Install ephemeral SSH client
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends sshpass >/dev/null
      - name: Provision scoped AWG DB role and private worker config on existing RU188
        shell: bash
        env:
          RU_PASSWORD: ${{ secrets.SERVER188_SSH_PASSWORD }}
        run: |
          set -Eeuo pipefail
          umask 077
          [[ -n "$RU_PASSWORD" ]] || exit 2
          grep -q '^188\.120\.254\.223 ssh-ed25519 ' ops/mnebydns-owner-ssh-known_hosts
          work="$RUNNER_TEMP/fi-awg-db-role"
          mkdir -m 0700 "$work"
          cfg="$work/ru.sshconfig"
          cleanup(){ rm -rf -- "$work"; }
          trap cleanup EXIT
          cat > "$cfg" <<CFG
          Host ru-controller
            HostName 188.120.254.223
            User root
            UserKnownHostsFile $PWD/ops/mnebydns-owner-ssh-known_hosts
            GlobalKnownHostsFile /dev/null
            HostKeyAlgorithms ssh-ed25519
            StrictHostKeyChecking yes
            UpdateHostKeys no
            BatchMode no
            PasswordAuthentication yes
            PubkeyAuthentication no
            KbdInteractiveAuthentication no
            ForwardAgent no
            ClearAllForwardings yes
            ControlMaster no
            ProxyCommand none
            ConnectTimeout 12
            ServerAliveInterval 10
            ServerAliveCountMax 3
            LogLevel ERROR
          CFG
          SSHPASS="$RU_PASSWORD" sshpass -e ssh -T -F "$cfg" ru-controller \
            'python3 -' < nodekit/fi_awg_delivery_db_stage.py
          echo 'FI_AWG_DATABASE_STAGE_COMPLETED=true;WORKER_STARTED=false;CUSTOMERS_PUBLISHED=false'
