name: MNEBYDNS 108-domain one-pass bulk deploy preflight (read-only)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - ".github/workflows/mnebydns-bulk-preflight-20261112.yml"
      - "scripts/mnebydns-bulk-preflight-20261112.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/mnebydns-bulk-preflight-20261112.yml"
      - "scripts/mnebydns-bulk-preflight-20261112.py"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('mnebydns-bulk-plan-offline-{0}',github.ref) || 'mnebydns-google-public-443-change' }}
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: All 108 domain render and status gates offline
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/mnebydns-bulk-preflight-20261112.py
          python3 scripts/mnebydns-bulk-preflight-20261112.py self-test
          python3 scripts/mnebydns-owner-domain-render-20261110.py self-test
          test "$(grep -c ' ssh-ed25519 ' ops/mnebydns-owner-ssh-known_hosts)" -eq 2
          ! grep -Eq 'StrictHostKeyChecking=no|accept-new|verify=False|check_hostname=False|INSERT INTO|UPDATE dns_admin_domains|systemctl (reload|restart)' scripts/mnebydns-bulk-preflight-20261112.py
  plan:
    if: github.event_name != 'pull_request'
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      RU_PASS: ${{ secrets.SERVER188_SSH_PASSWORD }}
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned remote prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$RU_PASS" && test -n "$DE_PASS"
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sshpass >/dev/null
      - name: Re-test all 108 and dry-render each eligible host against real shared Nginx/CoreDNS
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/mnebydns-bulk-preflight-20261112.py plan
      - name: Report dry-run summary
        if: always()
        shell: bash
        run: |
          if [ -f bulk-108-preflight-results/report.md ]; then
            cat bulk-108-preflight-results/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'FAILED; no verified bulk route plan' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload report only (not production configurations)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mnebydns-bulk-preflight-${{ github.run_id }}
          path: bulk-108-preflight-results/
          if-no-files-found: warn
          retention-days: 30
