name: "MNEBYDNS domain-admin read-only route config and origin inspection"
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths: [.github/workflows/mnebydns-domain-admin-audit-20261110.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      RU_PASS: ${{ secrets.SERVER188_SSH_PASSWORD }}
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - name: Inspect DNS and TLS resources without modifying servers
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass >/dev/null
          test -n "$RU_PASS" && test -n "$DE_PASS"
          SSHPASS="$DE_PASS" sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=accept-new -o LogLevel=ERROR root@89.125.90.101 'bash -s' <<'SH'
          set -Eeuo pipefail
          echo 'dns_admin_de_services_begin'
          for service in nginx mnebydns-dot.service mnebydns-googlepilot.service; do
            systemctl is-active "$service" || true
          done
          echo 'dns_admin_de_services_end'
          echo 'dns_admin_de_corefile_template_names_begin'
          grep -En '^[[:space:]]*(template IN|cache [0-9]+|import |forward |tls |bind |health |reload|rewrite)' /opt/mnebydns-dot/Corefile | head -n 90 || true
          echo 'dns_admin_de_corefile_template_names_end'
          echo 'dns_admin_de_nginx_stream_map_begin'
          python3 - <<'PY'
          from pathlib import Path
          import re
          src=Path('/etc/nginx/nginx.conf').read_text()
          m=re.search(r'map\s+\$ssl_preread_server_name\s+\$direct_mtproxy_backend\s*\{([^{}]+)\}',src,re.S)
          print('sni_map_found='+str(bool(m)).lower())
          if m:
              for line in m.group(1).splitlines():
                  line=line.strip()
                  if not line or line.startswith('#'):continue
                  if re.search(r'\b(?:proxy_pass|password|secret|token|private)\b',line,re.I):continue
                  print('sni_map_line='+line[:155])
          print('nginx_map_count='+str(src.count('map $ssl_preread_server_name')))
          PY
          echo 'dns_admin_de_nginx_stream_map_end'
          echo 'dns_admin_de_permissions_begin'
          ls -ld /opt/mnebydns-dot /opt/mnebydns-stable-checkpoints /etc/nginx 2>/dev/null
          echo 'dns_admin_de_permissions_end'
          echo 'dns_admin_de_tls_origin_begin'
          python3 - <<'PY'
          import socket,ssl
          for host in ('oracle.com','cloud.oracle.com','www.oracle.com'):
              try:
                  ips=sorted(set(rec[4][0] for rec in socket.getaddrinfo(host,443,socket.AF_INET,socket.SOCK_STREAM)))
              except Exception:
                  ips=[]
              print('origin_'+host+'_ipv4_count='+str(len(ips)),flush=True)
              try:
                  with socket.create_connection((host,443),timeout=6) as raw:
                      raw.settimeout(6)
                      with ssl.create_default_context().wrap_socket(raw,server_hostname=host) as tls:
                          print('origin_'+host+'_tls_verified='+str(bool(tls.getpeercert())).lower(),flush=True)
                          print('origin_'+host+'_alpn='+str(tls.selected_alpn_protocol()),flush=True)
              except Exception as e:
                  print('origin_'+host+'_tls_error='+type(e).__name__,flush=True)
          PY
          echo 'dns_admin_de_readonly_done=true'
          SH
          SSHPASS="$RU_PASS" sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=accept-new -o LogLevel=ERROR root@188.120.254.223 'bash -s' <<'SH'
          set -Eeuo pipefail
          echo 'dns_admin_ru_schema_begin'
          docker exec mnebyvpn-stage-postgres psql -At -U mnebyvpn_stage -d mnebyvpn_stage -c "SELECT domain||' '||status FROM dns_admin_domains ORDER BY id LIMIT 12"
          echo 'dns_admin_ru_schema_end'
          echo 'dns_admin_ru_bot_begin'
          image="$(docker inspect -f '{{.Config.Image}}' mnebyvpn-bot-info)"
          echo "bot_image=$image"
          code="$(curl --noproxy '*' -s -o /dev/null -w '%{http_code}' --max-time 4 http://127.0.0.1:8793/readyz || true)"
          echo "bot_ready_http=$code"
          echo 'dns_admin_ru_readonly_done=true'
          SH

      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read-only YouTube and video-CDN DNS routing evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import sys
          sys.path.insert(0,'scripts')
          from mnebydns_reliability_monitor import dot_query
          ingress="89.125.90.101"
          names=("youtube.com","www.youtube.com","googlevideo.com",
                 "redirector.googlevideo.com","i.ytimg.com","youtu.be")
          for host in names:
              try:
                  a=dot_query(ingress,"dns.mnebyvpn.site",host,1,timeout=5)
                  ips=a.addresses
                  route="unknown" if a.rcode!=0 or not ips else (
                      "proxy" if set(ips)=={ingress} else (
                          "mixed" if ingress in ips else "direct"))
                  try:
                      v6=dot_query(ingress,"dns.mnebyvpn.site",host,28,timeout=5)
                      ipv6="yes" if v6.addresses else ("none" if v6.rcode==0 else "unknown")
                  except Exception:
                      ipv6="unknown"
                  print(f"youtube_dns_host={host} a_route={route} a_count={len(ips)} aaaa={ipv6} rcode={a.rcode}",flush=True)
              except Exception as exc:
                  print(f"youtube_dns_host={host} a_route=unverified error={type(exc).__name__}",flush=True)
          PY
