name: MNEBYVPN dedicated public Telegram TLS 8443 on relay89
on:
  push:
    paths:
      - '.github/workflows/mnebyvpn-telegram-8443-foreign.yml'
      - 'scripts/mnebyvpn-telegram-8443-foreign.sh'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mnebyvpn-foreign-8443
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HOST: '89.125.90.101'
      PASSWORD: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy isolated foreign Telegram 8443 endpoint
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PASSWORD"
          sudo apt-get update -qq && sudo apt-get install -qq -y sshpass
          export SSHPASS="$PASSWORD"
          opts=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=12 -o LogLevel=ERROR)
          sshpass -e scp "${opts[@]}" scripts/mnebyvpn-telegram-8443-foreign.sh "root@$HOST:/tmp/mnebyvpn-telegram-8443-foreign.sh"
          sshpass -e ssh "${opts[@]}" "root@$HOST" 'bash /tmp/mnebyvpn-telegram-8443-foreign.sh'
      - name: Verify from external network before changing Telegram
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --noproxy '*' -s -o /dev/null -w '%{http_code}' --connect-timeout 6 --max-time 12 \
            --resolve cdn.servgo.ru:8443:89.125.90.101 -X POST \
            -H 'Content-Type: application/json' -d '{"update_id":1}' \
            https://cdn.servgo.ru:8443/mnebyvpn-telegram/webhook)"
          test "$code" = 401 || { echo "::error::External webhook verification status $code"; exit 2; }
          echo 'foreign_8443_public_external_authenticated_endpoint=ready'
      - name: Remove temporary installer
        if: always()
        shell: bash
        run: |
          if [ -n "$PASSWORD" ]; then
            export SSHPASS="$PASSWORD"
            sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -o LogLevel=ERROR "root@$HOST" \
              'rm -f /tmp/mnebyvpn-telegram-8443-foreign.sh' || true
          fi
