name: MNEBYVPN support storage mapping (read-only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/mnebyvpn-support-storage-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      SSH_PASSWORD: ${{ secrets.SERVER188_SSH_PASSWORD }}
    steps:
      - name: Inspect support table reachability from existing web and bot containers
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_PASSWORD"
          sudo apt-get update -qq && sudo apt-get install -qq -y sshpass
          export SSHPASS="$SSH_PASSWORD"
          sshpass -e ssh -T -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=12 -o LogLevel=ERROR \
            root@188.120.254.223 'bash -se' <<'SH'
          set -euo pipefail
          for name in mnebyvpn-bot-info mnebyvpn-public-web; do
            echo "checking=$name"
            docker exec "$name" node --input-type=module -e '
              import pg from "pg";
              const pool=new pg.Pool({connectionString:process.env.DATABASE_URL,max:1,connectionTimeoutMillis:3000});
              try{
                const r=await pool.query("SELECT current_database()=$1 AS expected, to_regclass($2) IS NOT NULL AS has_support",[ "mnebyvpn_stage","public.website_support_tickets" ]);
                console.log("uses_stage_db="+r.rows[0].expected);
                console.log("has_support_table="+r.rows[0].has_support);
                const target=await pool.query("SELECT current_database() AS db,current_user AS db_role,has_schema_privilege($1,$2) AS can_create_public",["public","CREATE"]);
                console.log("db_name="+target.rows[0].db);
                console.log("db_role="+target.rows[0].db_role);
                console.log("db_can_create_public="+target.rows[0].can_create_public);
                if(r.rows[0].has_support){
                  const p=await pool.query("SELECT has_table_privilege(current_user,$1,$2) AS can_insert",["public.website_support_tickets","INSERT"]);
                  console.log("can_insert_ticket="+p.rows[0].can_insert);
                }
              }catch(e){console.log("database_reachable=false");console.log("pg_error_code="+String(e?.code||"unknown"));process.exitCode=1}
              finally{await pool.end()}
            '
          done
          # Verify the already running bot can read the site inbox using the
          # privately generated HMAC key. Never print the key or ticket data.
          docker exec mnebyvpn-bot-info node --input-type=module -e '
            import {createHmac} from "node:crypto";
            const secret=process.env.SUPPORT_BRIDGE_SECRET??"";
            const operator=process.env.SUPPORT_TELEGRAM_OPERATOR_ID??"";
            const hasSecret=/^[0-9a-f]{64}$/.test(secret);
            const hasOperator=/^[1-9][0-9]{5,15}$/.test(operator);
            const tokenless=!(process.env.TELEGRAM_TOKEN_BOT??"");
            console.log("bridge_secret_present="+hasSecret);
            console.log("operator_id_present="+hasOperator);
            console.log("runtime_bot_token_not_required="+tokenless);
            if(!hasSecret||!hasOperator)process.exit(2);
            const url="http://127.0.0.1:8792";
            const status=await fetch(url+"/api/support/status",{
              signal:AbortSignal.timeout(6000)});
            const ready=status.ok&&(await status.json()).available===true;
            console.log("website_support_ready="+ready);
            if(!ready)process.exit(2);
            const stamp=String(Math.floor(Date.now()/1000));
            const mac=createHmac("sha256",secret)
              .update("MNEBYVPN-inbox-v1\n"+stamp).digest("hex");
            const ok=await fetch(url+"/api/support/operator-inbox",{
              headers:{"X-MNEBYVPN-Support-Ts":stamp,
                "X-MNEBYVPN-Support-Signature":mac},
              signal:AbortSignal.timeout(6000)});
            console.log("signed_inbox_http="+ok.status);
            if(!ok.ok)process.exit(2);
            const bad=await fetch(url+"/api/support/operator-inbox",{
              headers:{"X-MNEBYVPN-Support-Ts":stamp,
                "X-MNEBYVPN-Support-Signature":"0".repeat(64)},
              signal:AbortSignal.timeout(6000)});
            console.log("forged_inbox_http="+bad.status);
            if(bad.status!==403)process.exit(2);
          '
          echo 'read_only=true'
          SH
