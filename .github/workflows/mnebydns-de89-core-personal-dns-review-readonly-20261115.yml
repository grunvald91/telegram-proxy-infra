name: MNEBYDNS code review actual live DE89 CoreDNS and personal DoT
on:
  push:
    branches: [diag/mnebydns-live-video-stall-20261115]
    paths: [.github/workflows/mnebydns-de89-core-personal-dns-review-readonly-20261115.yml]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Privacy-preserving inspect CoreDNS, personal DNS SNI and watchdog
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$DE_PASS" && test -s ops/mnebydns-owner-ssh-known_hosts
          python3 -m py_compile scripts/mnebydns-de89-core-personal-dns-review-readonly-20261115.py
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass >/dev/null
          opts=(-T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts" -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR)
          SSHPASS="$DE_PASS" sshpass -e ssh "${opts[@]}" root@89.125.90.101 'python3 - DE89' < scripts/mnebydns-de89-core-personal-dns-review-readonly-20261115.py > dns-review.log 2>&1
          grep '^AUDIT_DNS_DE89_' dns-review.log
          grep -q '^AUDIT_DNS_DE89_COMPLETE=true' dns-review.log
