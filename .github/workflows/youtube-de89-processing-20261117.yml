name: DE89 YouTube processing and fragmented TLS audit
on:
  push:
    branches: [diag/youtube-de89-processing-20261117]
    paths: ['.github/workflows/youtube-de89-processing-20261117.yml','scripts/youtube-de89-processing-20261117.py','scripts/youtube-de89-tls-controls-20261117.py']
permissions: {contents: read}
concurrency:
  group: mnebydns-youtube-de89-processing
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Prepare pinned DE89 access
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/youtube-de89-processing-20261117.py scripts/youtube-de89-tls-controls-20261117.py scripts/youtube-return-trace-20261117.py
          test -n "$DE_PASS" && test -s ops/mnebydns-owner-ssh-known_hosts
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          cat > "$RUNNER_TEMP/de-only" <<'SHELL'
          #!/bin/bash
          set -Eeuo pipefail
          export SSHPASS="$DE_PASS"
          exec sshpass -e ssh -T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=5 -o ServerAliveCountMax=3 -o HostKeyAlgorithms=ssh-ed25519 \
            -o "UserKnownHostsFile=$GITHUB_WORKSPACE/ops/mnebydns-owner-ssh-known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR \
            root@89.125.90.101 "$@"
          SHELL
          chmod 700 "$RUNNER_TEMP/de-only"
      - name: Arm loss-checked DE89 capture
        run: |
          set -Eeuo pipefail
          root="/run/mnebydns-processing-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          "$RUNNER_TEMP/de-only" "umask 077; mkdir '$root'; cat > '$root/observer.py'" < scripts/youtube-return-trace-20261117.py
          "$RUNNER_TEMP/de-only" "systemd-run --quiet --unit=mnebydns-processing-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT} --property=RuntimeMaxSec=120 --property=StandardOutput=append:$root/result.log --property=StandardError=append:$root/result.log /usr/bin/env MNEBY_CAPTURE_READY=$root/READY /usr/bin/python3 -B $root/observer.py"
          "$RUNNER_TEMP/de-only" "for attempt in \$(seq 1 15); do if test -s '$root/READY'; then echo CAPTURE_READY=true; date -u +%FT%TZ; exit 0; fi; sleep 1; done; exit 1"
      - name: Read processing errors and run verified external TLS controls
        run: |
          set -Eeuo pipefail
          "$RUNNER_TEMP/de-only" 'python3 -B -' < scripts/youtube-de89-processing-20261117.py
          python3 -B scripts/youtube-de89-tls-controls-20261117.py
      - name: Retrieve correlated stream metadata
        if: always()
        run: |
          set -Eeuo pipefail
          root="/run/mnebydns-processing-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          "$RUNNER_TEMP/de-only" "timeout 120s bash -c 'while systemctl is-active --quiet mnebydns-processing-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.service; do sleep 5; done'; cat '$root/result.log'; grep -q 'TARGET_CAPTURE_NO_SERVER_CHANGES=true' '$root/result.log'; ! grep -q 'RuntimeError' '$root/result.log'"
