# Retry reviewed P1 trial-ready sender on aligned green source 06cce510c742b94347762bc94d4f93f46280c347; staging/public completed 42459159685 after race with 42459163108.
# 2026-11-08: publish reviewed P1 trial-ready retry fixes from green main bd4930ada4833601b3012c5672e6abd31b12282c (CI 42458907376, staged 42458991642).
# Approved isolated sender release: MNEBYVPN main f842a257606f8913de86ef3963f2d92ca8fd77fe passed CI 42415453537 and staged via public release 42415564796.
name: Publish isolated MNEBYVPN purchase Telegram notifications
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mnebyvpn-purchase-notices-publish.yml'
      - 'scripts/mnebyvpn-purchase-notices-promote.sh'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mnebyvpn-purchase-notices-188
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SSH_PASSWORD: ${{ secrets.SERVER188_SSH_PASSWORD }}
      HOST: '188.120.254.223'
    steps:
      - uses: actions/checkout@v4
        with:
          path: infra
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: grunvald91/Mnebyvpn
          ref: main
          path: vpn
          fetch-depth: 0
          persist-credentials: false
      - name: Require exactly green current source and isolated script
        shell: bash
        id: source
        run: |
          set -euo pipefail
          test -n "$SSH_PASSWORD"
          bash -n infra/scripts/mnebyvpn-purchase-notices-promote.sh
          sha="$(git -C vpn rev-parse HEAD)"
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]]
          test -f vpn/apps/service/src/purchase-notification-worker.ts
          test -f vpn/packages/notifications/src/vpn-trial-ready.ts
          test -f vpn/db/migrations/0106_telegram_trial_auto_ready.sql
          curl -fsSL --retry 2 --max-time 25 \
            'https://api.github.com/repos/grunvald91/Mnebyvpn/actions/workflows/offline-contracts.yml/runs?branch=main&status=success&per_page=8' \
            -o "$RUNNER_TEMP/ci.json"
          SRC_SHA="$sha" python3 - "$RUNNER_TEMP/ci.json" <<'PY'
          import json,os,sys
          sha=os.environ['SRC_SHA']
          runs=json.load(open(sys.argv[1])).get('workflow_runs',[])
          assert any(r.get('head_sha')==sha and r.get('event')=='push' and
            r.get('conclusion')=='success' and r.get('head_branch')=='main'
            for r in runs),'Exact main has no green CI'
          PY
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "purchase_notices_source=$sha" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify staged public app and install notification process only
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -qq -y sshpass
          export SSHPASS="$SSH_PASSWORD"
          opts=(-o ConnectTimeout=12 -o StrictHostKeyChecking=accept-new -o LogLevel=ERROR)
          sha="${{ steps.source.outputs.sha }}"
          sshpass -e scp "${opts[@]}" infra/scripts/mnebyvpn-purchase-notices-promote.sh \
            "root@$HOST:/tmp/mnebyvpn-purchase-notices-$sha.sh"
          sshpass -e ssh "${opts[@]}" "root@$HOST" \
            "bash /tmp/mnebyvpn-purchase-notices-$sha.sh '$sha'"
          echo "purchase_notice_release_sha=$sha" >> "$GITHUB_STEP_SUMMARY"
      - name: Clean deployment script
        if: always()
        shell: bash
        run: |
          if [[ -n "$SSH_PASSWORD" ]];then
            export SSHPASS="$SSH_PASSWORD"
            sshpass -e ssh -o ConnectTimeout=8 -o StrictHostKeyChecking=accept-new \
              -o LogLevel=ERROR "root@$HOST" \
              "rm -f /tmp/mnebyvpn-purchase-notices-${{ steps.source.outputs.sha }}.sh" || true
          fi
