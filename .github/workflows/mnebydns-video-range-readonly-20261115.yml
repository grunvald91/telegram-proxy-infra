name: MNEBYDNS X media range and YouTube video CDN read-only
on:
  push:
    branches: [diag/mnebydns-real-videoplayback-20261115]
    paths: ['.github/workflows/mnebydns-video-range-readonly-20261115.yml']
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Probe YouTube and X media DoT routing on public DE89
        run: |
          python3 - <<'PY'
          import sys,json
          sys.path.insert(0,'scripts')
          from mnebydns_reliability_monitor import dot_query
          for name in ('video.twimg.com','pbs.twimg.com','abs.twimg.com','x.com','www.youtube.com','youtubei.googleapis.com','rr1---sn-gxuo03g-ig3s.googlevideo.com'):
              record={}
              for typ,label in ((1,'A'),(28,'AAAA'),(65,'HTTPS')):
                  try:
                      ans=dot_query('89.125.90.101','dns.mnebyvpn.site',name,typ,timeout=5)
                      record[label]={'rcode':ans.rcode,'ips':list(ans.addresses)[:5]}
                  except Exception as ex:record[label]={'error':type(ex).__name__}
              print('MEDIA_DNS_'+name+'='+json.dumps(record,sort_keys=True),flush=True)
          PY
      - name: Compare actual X MP4 256KiB via public DE89 vs origin
        run: |
          set -Eeuo pipefail
          url='https://video.twimg.com/ext_tw_video/1876344715940880384/pu/vid/avc1/480x360/IIArnqwjtehdIN7W.mp4?tag=12'
          echo MEDIA_ROUTE_ORIGIN
          curl -4 -sSL --max-time 18 --range 0-262143 -o /dev/null -w 'ORIGIN_HTTP=%{http_code} BYTES=%{size_download} TOTAL=%{time_total} PEER=%{remote_ip}\n' "$url" || true
          echo MEDIA_ROUTE_DE89
          curl -4 -sSL --max-time 18 --resolve video.twimg.com:443:89.125.90.101 --range 0-262143 -o /dev/null -w 'DE89_HTTP=%{http_code} BYTES=%{size_download} TOTAL=%{time_total} PEER=%{remote_ip}\n' "$url" || true

      - name: Compare four independent public X MP4 video samples with byte ranges
        run: |
          set -Eeuo pipefail
          urls=(
            'https://video.twimg.com/amplify_video/2012668347305828352/vid/avc1/924x680/19Ttm-WDlu9p63hG.mp4'
            'https://video.twimg.com/ext_tw_video/1444247208514113546/pu/vid/640x360/39YEtqA_5lC88JYk.mp4?tag=12'
            'https://video.twimg.com/ext_tw_video/1912350520460689409/pu/vid/avc1/480x270/ur9xSviOdHMCLG4O.mp4?tag=12'
            'https://video.twimg.com/amplify_video/2005267882067001344/vid/avc1/720x1280/dkBErKNn6EyQqzcN.mp4'
          )
          for i in 0 1 2 3;do
            for route in ORIGIN DE89;do
              if [[ "$route" == ORIGIN ]];then
                result=$(curl -4 -sSL --max-time 16 --range 0-262143 -o /dev/null -w 'HTTP=%{http_code} BYTES=%{size_download} TTFB=%{time_starttransfer} TOTAL=%{time_total}' "${urls[$i]}" 2>/dev/null) || true
              else
                result=$(curl -4 -sSL --max-time 16 --resolve video.twimg.com:443:89.125.90.101 --range 0-262143 -o /dev/null -w 'HTTP=%{http_code} BYTES=%{size_download} TTFB=%{time_starttransfer} TOTAL=%{time_total}' "${urls[$i]}" 2>/dev/null) || true
              fi
              echo "X_MEDIA_SAMPLE=$i ROUTE=$route RESULT=$result"
            done
          done

      - name: Compare external IP-checker DNS records to selective SmartDNS routes
        run: |
          python3 - <<'PY'
          import json,sys
          sys.path.insert(0,'scripts')
          from mnebydns_reliability_monitor import dot_query
          sites=['api.ipify.org','ipinfo.io','ifconfig.me','2ip.ru',
                 'browserleaks.com','www.youtube.com','video.twimg.com']
          for host in sites:
            try:
              a=dot_query('89.125.90.101','dns.mnebyvpn.site',host,1,timeout=5)
              print('IPCHECKER_DOT='+json.dumps({'host':host,'rcode':a.rcode,'a':list(a.addresses)[:5]},sort_keys=True),flush=True)
            except Exception as ex:
              print('IPCHECKER_DOT_ERROR='+host+':'+type(ex).__name__,flush=True)
          PY
          echo RUNNER_PUBLIC_IP_BEGIN
          curl -4 -sS --max-time 7 https://api.ipify.org || true
          echo
          echo RUNNER_PUBLIC_IP_END

      - name: Transfer megabyte video ranges rather than headers or short clips
        run: |
          set -Eeuo pipefail
          media=(
            'https://video.twimg.com/ext_tw_video/1444247208514113546/pu/vid/640x360/39YEtqA_5lC88JYk.mp4?tag=12'
            'https://video.twimg.com/ext_tw_video/1912350520460689409/pu/vid/avc1/480x270/ur9xSviOdHMCLG4O.mp4?tag=12'
          )
          for j in 0 1; do
            for route in ORIGIN DE89; do
              options=()
              [[ "$route" != DE89 ]] || options=(--resolve 'video.twimg.com:443:89.125.90.101')
              echo "X_LARGE_VIDEO_SAMPLE=$j ROUTE=$route"
              curl -4 -sSL --max-time 25 --range 0-4194303 "${options[@]}" \
                --output /dev/null --write-out 'LARGE_VIDEO_HTTP=%{http_code} BYTES=%{size_download} TTFB=%{time_starttransfer} TOTAL=%{time_total} SPEED=%{speed_download}\n' "${media[$j]}" || echo 'LARGE_VIDEO_REQUEST_FAILED'
            done
          done

      - name: Test X MP4 transfer from Russian VPS to DE89 public TCP ingress
        shell: bash
        env:
          RU_PASS: ${{ secrets.SERVER188_SSH_PASSWORD }}
        run: |
          set -Eeuo pipefail
          test -n "$RU_PASS"
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass >/dev/null
          SSHPASS="$RU_PASS" sshpass -e ssh -T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts" -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR root@188.120.254.223 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          url='https://video.twimg.com/ext_tw_video/1444247208514113546/pu/vid/640x360/39YEtqA_5lC88JYk.mp4?tag=12'
          for route in foreign_public direct_origin;do
            opts=()
            if [[ "$route" == foreign_public ]];then opts=(--resolve video.twimg.com:443:89.125.90.101);fi
            echo "RU_ORIGIN_VIDEO_ROUTE=$route"
            curl -4 -sSL --max-time 18 "${opts[@]}" --range 0-1498841 -o /dev/null \
              -w 'RU_VIDEO_HTTP=%{http_code} BYTES=%{size_download} TTFB=%{time_starttransfer} TOTAL=%{time_total} REMOTE=%{remote_ip}\n' "$url" || echo "RU_VIDEO_FAILED_ROUTE=$route"
          done
          REMOTE
