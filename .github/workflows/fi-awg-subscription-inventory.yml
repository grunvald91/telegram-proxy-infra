name: RU188 subscriber worker and FI mixed subscription inventory (read-only)
"on":
  pull_request:
    branches: [main]
    paths:
      - nodekit/fi_awg_subscription_runtime_inventory.py
      - .github/workflows/fi-awg-subscription-inventory.yml
  push:
    branches: [main]
    paths:
      - nodekit/fi_awg_subscription_runtime_inventory.py
      - .github/workflows/fi-awg-subscription-inventory.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Compile read-only RU188 diagnostics
        run: |
          set -Eeuo pipefail
          python3 -m py_compile nodekit/fi_awg_subscription_runtime_inventory.py
          python3 - <<'PY'
          import ast
          from pathlib import Path
          source=Path('nodekit/fi_awg_subscription_runtime_inventory.py').read_text()
          tree=ast.parse(source)
          functions=[node.name for node in tree.body if isinstance(node,ast.FunctionDef)]
          assert functions.count('main')==1 and functions.count('db_status')==1
          assert functions.count('keys')==1 and functions.count('call')==1
          assert functions.count('staging_diagnostics')==1
          assert functions.count('trigger_owner_diagnostics')==1
          assert functions.count('fi_subscription_readiness')==1
          assert 'FI_AWG_SUB_VISIBILITY_' in source
          assert 'LINKED_ACK_STALE_PROOF' in source
          assert 'FI_AWG_SUB_TRIGGER_' in source
          assert 'vpn_awg_enforce_address_pool' in source
          assert 'FI_AWG_SUB_STAGE_' in source
          assert 'GRANT_OUTBOX_STALE' in source
          assert 'MAX_REQUEST_ATTEMPTS' in source
          assert "has_function_privilege('mnebyvpn_awg_delivery'" in source
          query=[n.value for n in ast.walk(tree) if isinstance(n,ast.Constant) and
                 isinstance(n.value,str) and
                 'public.vpn_awg_peer_allocations a' in n.value and
                 'public.vpn_awg_device_requests' in n.value]
          assert len(query)==1 and 'public.vpn_awg_device_requests' in query[0]
          assert 'FI_AWG_SUB_INVENTORY=READONLY_COMPLETE' in source
          assert 'FI_AWG_SUB_SEED_MATCH=' in source
          assert 'FI_AWG_SUB_WORKER_SOURCE=' in source
          assert "has_column_privilege('mnebyvpn_awg_delivery','public.provisioning_state','entitlement_id','SELECT')" in source
          assert "FI_REQUESTS_STAGED" in source and "FI_REQUESTS_BLOCKED" in source
          assert "len(fields)!=9" in source
          PY
          ! grep -En 'systemctl (restart|start|stop)|docker (rm|run|stop)|UPDATE public\.|INSERT INTO|DELETE FROM|PRIVATE KEY|AWG_INCY_SUBSCRIPTION_SEED=' nodekit/fi_awg_subscription_runtime_inventory.py
  inspect:
    needs: offline
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: node-fi
    timeout-minutes: 8
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: SSH pinned RU188 inventory without mutations
        id: live_inventory
        env:
          RU_PASSWORD: ${{ secrets.SERVER188_SSH_PASSWORD }}
        run: |
          set -Eeuo pipefail
          test -n "$RU_PASSWORD"
          grep -q '^188\.120\.254\.223 ssh-ed25519 ' ops/mnebydns-owner-ssh-known_hosts
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends sshpass >/dev/null
          output=$(SSHPASS="$RU_PASSWORD" sshpass -e ssh -T \
            -o HostKeyAlgorithms=ssh-ed25519 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$GITHUB_WORKSPACE/ops/mnebydns-owner-ssh-known_hosts" \
            -o GlobalKnownHostsFile=/dev/null \
            -o UpdateHostKeys=no -o BatchMode=no -o PasswordAuthentication=yes \
            -o PubkeyAuthentication=no -o KbdInteractiveAuthentication=no \
            -o ForwardAgent=no -o ClearAllForwardings=yes -o ProxyCommand=none \
            -o ConnectTimeout=12 -o LogLevel=ERROR root@188.120.254.223 \
            python3 - < nodekit/fi_awg_subscription_runtime_inventory.py)
          printf '%s\n' "$output"
          read_gate() {
            local label="$1" value
          printf '%s\n' "$output"
            [[ "$value" =~ ^[0-9]+$ ]] || exit 2
            printf '%s' "$value"
          }
          linked=$(read_gate ACTIVE_LINKED_ENTITLEMENTS)
          signed=$(read_gate LINKED_SIGNED_ACKS)
          pool=$(read_gate LINKED_ACK_POOL_VERIFIED)
          fresh=$(read_gate LINKED_ACK_FRESH_PROOF)
          stale=$(read_gate LINKED_ACK_STALE_PROOF)
          echo "summary=RU188 FI217 linked=$linked ack=$signed pool=$pool fresh=$fresh stale=$stale" >> "$GITHUB_OUTPUT"
      - name: Publish aggregate-only RU188 subscription diagnostic
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUMMARY: ${{ steps.live_inventory.outputs.summary }}
          INSPECT_OUTCOME: ${{ steps.live_inventory.outcome }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "$INSPECT_OUTCOME" == 'success' && "$SUMMARY" == RU188* ]]; then
            state=success
            desc="$SUMMARY"
          else
            state=failure
            desc='RU188 FI217 subscription audit unavailable; inspect workflow'
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state="$state" -f context="fi217/subscription-visibility-audit" -f description="$desc" -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/workflows/fi-awg-subscription-inventory.yml" >/dev/null

