name: RU188 subscriber worker and FI mixed subscription inventory (read-only)
"on":
  pull_request:
    branches: [main]
    paths:
      - nodekit/fi_awg_subscription_runtime_inventory.py
      - .github/workflows/fi-awg-subscription-inventory.yml
  push:
    branches: [main]
    paths:
      - nodekit/fi_awg_subscription_runtime_inventory.py
      - .github/workflows/fi-awg-subscription-inventory.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Compile read-only RU188 diagnostics
        run: |
          set -Eeuo pipefail
          python3 -m py_compile nodekit/fi_awg_subscription_runtime_inventory.py
          ! grep -En 'systemctl (restart|start|stop)|docker (rm|run|stop)|UPDATE public\.|INSERT INTO|DELETE FROM|PRIVATE KEY|AWG_INCY_SUBSCRIPTION_SEED=' nodekit/fi_awg_subscription_runtime_inventory.py
  inspect:
    needs: offline
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: node-fi
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: SSH pinned RU188 inventory without mutations
        env:
          RU_PASSWORD: ${{ secrets.SERVER188_SSH_PASSWORD }}
        run: |
          set -Eeuo pipefail
          test -n "$RU_PASSWORD"
          grep -q '^188\.120\.254\.223 ssh-ed25519 ' ops/mnebydns-owner-ssh-known_hosts
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends sshpass >/dev/null
          SSHPASS="$RU_PASSWORD" sshpass -e ssh -T \
            -o HostKeyAlgorithms=ssh-ed25519 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$GITHUB_WORKSPACE/ops/mnebydns-owner-ssh-known_hosts" \
            -o GlobalKnownHostsFile=/dev/null \
            -o UpdateHostKeys=no -o BatchMode=no -o PasswordAuthentication=yes \
            -o PubkeyAuthentication=no -o KbdInteractiveAuthentication=no \
            -o ForwardAgent=no -o ClearAllForwardings=yes -o ProxyCommand=none \
            -o ConnectTimeout=12 -o LogLevel=ERROR root@188.120.254.223 \
            python3 - < nodekit/fi_awg_subscription_runtime_inventory.py
