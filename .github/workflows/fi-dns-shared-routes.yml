name: FI DNS shared route bundle (private local canary)
"on":
  pull_request:
    paths: ["nodekit/fi_shared_routes*.py","nodekit/tests/test_fi_shared_routes.py",".github/workflows/fi-dns-shared-routes.yml"]
  push:
    branches: [main]
    paths: ["nodekit/fi_shared_routes*.py","nodekit/tests/test_fi_shared_routes.py",".github/workflows/fi-dns-shared-routes.yml"]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: mnebyvpn-fleet-fi
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify shared route compiler and safe local canary
        run: |
          set -Eeuo pipefail
          python3 -m py_compile nodekit/fi_shared_routes*.py
          python3 -m unittest discover -s nodekit/tests -p 'test_fi_shared_routes.py' -v
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('.github/workflows/fi-dns-shared-routes.yml').read_text().splitlines()
          i=lines.index('      - name: Read current shared DE rules and stage FI local route bundle')
          i=next(j for j in range(i+1,len(lines)) if lines[j]=='        run: |')+1
          rows=[]
          for line in lines[i:]:
              if line and not line.startswith('          '):break
              rows.append(line[10:] if line.startswith('          ') else '')
          Path('/tmp/fi-shared-routes.sh').write_text('\n'.join(rows)+'\n')
          PY
          bash -n /tmp/fi-shared-routes.sh
  stage:
    needs: offline
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: node-fi
    env:
      RU_PASSWORD: ${{ secrets.SERVER188_SSH_PASSWORD }}
      DE_PASSWORD: ${{ secrets.RELAY89_SSH_PASSWORD }}
      FI_PASSWORD: ${{ secrets.MNEBYVPN_NEW_NODE_SSH_PASSWORD }}
      FI_USER: ${{ secrets.MNEBYVPN_NEW_NODE_SSH_USER }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Read current shared DE rules and stage FI local route bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          [[ "$FI_USER" == root && -n "$RU_PASSWORD" && -n "$FI_PASSWORD" ]] || exit 2
          grep -q '^188\.120\.254\.223 ssh-ed25519 ' ops/mnebydns-owner-ssh-known_hosts
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends sshpass >/dev/null
          work="$RUNNER_TEMP/fi-dns-canary"
          mkdir -m 0700 "$work"
          cat > "$work/ru.cfg" <<CFG
          Host ru-controller
            HostName 188.120.254.223
            User root
            UserKnownHostsFile $GITHUB_WORKSPACE/ops/mnebydns-owner-ssh-known_hosts
            GlobalKnownHostsFile /dev/null
            HostKeyAlgorithms ssh-ed25519
            StrictHostKeyChecking yes
            UpdateHostKeys no
            PubkeyAuthentication no
            PreferredAuthentications password
            ForwardAgent no
            ClearAllForwardings yes
            ControlMaster no
            ConnectTimeout 12
            LogLevel ERROR
          CFG
          SSHPASS="$RU_PASSWORD" sshpass -e ssh -T -F "$work/ru.cfg" ru-controller \
            'test -f /root/mnebyvpn-controller/fi-known_hosts && test ! -L /root/mnebyvpn-controller/fi-known_hosts && test "$(stat -c "%u:%a" /root/mnebyvpn-controller/fi-known_hosts)" = 0:600 && cat /root/mnebyvpn-controller/fi-known_hosts' > "$work/fi-known"
          python3 - "$work/fi-known" <<'PY'
          import base64,pathlib,sys
          data=pathlib.Path(sys.argv[1]).read_bytes()
          assert len(data)<512 and data.count(b'\n')==1 and data.endswith(b'\n')
          name,kind,key=data.decode('ascii').strip().split()
          assert (name,kind)==('fi.mnebyvpn.site','ssh-ed25519')
          raw=base64.b64decode(key,validate=True)
          assert len(raw)==51 and raw.startswith(b'\x00\x00\x00\x0bssh-ed25519\x00\x00\x00\x20')
          PY
          cat > "$work/fi.cfg" <<CFG
          Host fi-node
            HostName 217.11.167.91
            User root
            HostKeyAlias fi.mnebyvpn.site
            UserKnownHostsFile $work/fi-known
            GlobalKnownHostsFile /dev/null
            HostKeyAlgorithms ssh-ed25519
            StrictHostKeyChecking yes
            UpdateHostKeys no
            PubkeyAuthentication no
            PreferredAuthentications password
            ForwardAgent no
            ClearAllForwardings yes
            ControlMaster no
            ConnectTimeout 12
            LogLevel ERROR
          CFG
          fi_node() { SSHPASS="$FI_PASSWORD" sshpass -e ssh -T -F "$work/fi.cfg" fi-node "$@"; }
          test -n "$DE_PASSWORD"
          grep -q '^89\.125\.90\.101 ssh-ed25519 ' ops/mnebydns-owner-ssh-known_hosts
          stage="/run/fi-shared-routes-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          [[ "$stage" =~ ^/run/fi-shared-routes-[0-9]+-[0-9]+$ ]]
          created=no
          cleanup() {
            set +e
            if [[ "$created" == yes ]]; then
              fi_node "rm -rf -- '$stage'" >/dev/null 2>&1
            fi
            rm -rf "$work"
          }
          trap cleanup EXIT
          SSHPASS="$DE_PASSWORD" sshpass -e ssh -T -o ConnectTimeout=12 \
            -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 \
            -o UserKnownHostsFile="$GITHUB_WORKSPACE/ops/mnebydns-owner-ssh-known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no \
            -o PubkeyAuthentication=no -o PreferredAuthentications=password \
            root@89.125.90.101 'test -f /opt/mnebydns-dot/Corefile && test "$(stat -c %u /opt/mnebydns-dot/Corefile)" = 0 && test "$(stat -c %s /opt/mnebydns-dot/Corefile)" -le 2000000 && cat /opt/mnebydns-dot/Corefile' > "$work/shared.Corefile"
          python3 nodekit/fi_shared_routes.py "$work/shared.Corefile" "$work/policy.json"
          rm -f "$work/shared.Corefile"
          fi_node "umask 077; mkdir -m 0700 '$stage'"
          created=yes
          SSHPASS="$FI_PASSWORD" sshpass -e scp -F "$work/fi.cfg" \
            nodekit/fi_shared_routes.py nodekit/fi_shared_routes_stage.py "$work/policy.json" "fi-node:$stage/"
          fi_node "chmod 600 '$stage'/*; PYTHONPATH=/opt/mnebyvpn-fi-dns-node python3 '$stage/fi_shared_routes_stage.py' '$stage'"
