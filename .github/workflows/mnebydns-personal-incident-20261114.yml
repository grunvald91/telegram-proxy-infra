name: 'MNEBYDNS incident: personal SNI, watchdog, route and owner counter (read-only)'
on:
  push:
    branches: [diag/personal-dot-incident-20261114]
    paths: ['.github/workflows/mnebydns-personal-incident-20261114.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    env:
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
      RU_PASS: ${{ secrets.SERVER188_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Probe both SNI hostnames from outside without any DNS credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import socket,ssl,struct,secrets,time
          def get(n):
              try:
                  started=time.monotonic()
                  with socket.create_connection(('89.125.90.101',853),timeout=7) as tcp:
                      tcp.settimeout(7)
                      with ssl.create_default_context().wrap_socket(tcp,server_hostname=n) as tls:
                          print('EXTERNAL_'+('LEGACY' if n=='dns.mnebyvpn.site' else 'PERSONAL')+'_TLS=PASS',round((time.monotonic()-started)*1000),flush=True)
                          if n=='dns.mnebyvpn.site':
                              qid=secrets.randbelow(65534)+1
                              for host in ('example.com','claude.ai','gemini.google.com'):
                                  q=struct.pack('!HHHHHH',qid,256,1,0,0,0)+b''.join(bytes([len(k)])+k.encode() for k in host.split('.'))+b'\0'+struct.pack('!HH',1,1)
                                  tls.sendall(struct.pack('!H',len(q))+q)
                                  hdr=tls.recv(2)
                                  if len(hdr)!=2:raise RuntimeError('no DNS frame')
                                  length=int.from_bytes(hdr,'big')
                                  if not 12<=length<=16384:raise RuntimeError('bad DNS frame')
                                  resp=b''
                                  while len(resp)<length:
                                      p=tls.recv(length-len(resp))
                                      if not p:raise RuntimeError('truncated DNS response')
                                      resp+=p
                                  print('LEGACY_DNS_'+host.replace('.','_')+'_RCODE='+str(resp[3]&15),flush=True)
                                  qid+=1
              except Exception as exc:
                  print('EXTERNAL_'+('LEGACY' if n=='dns.mnebyvpn.site' else 'PERSONAL')+'_ERROR='+type(exc).__name__,flush=True)
          for n in ('dns.mnebyvpn.site','aaaaaaaaaaaa.dns.mnebyvpn.site'):
              get(n)
          PY
      - name: Diagnose exact foreign DoT A mappings vs direct resolver without modifications
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import sys
          sys.path.insert(0,'scripts')
          from mnebydns_reliability_monitor import dot_query
          hosts=('chatgpt.com','auth.openai.com','claude.ai','api.anthropic.com',
                 'gemini.google.com','grok.com','x.com','www.tiktok.com',
                 'api.tiktokv.com','www.youtube.com')
          for host in hosts:
              result={}
              for label,ip,sni in (('MAPPED','89.125.90.101','dns.mnebyvpn.site'),
                                    ('DIRECT','1.1.1.1','one.one.one.one')):
                  try:
                      answer=dot_query(ip,sni,host,1)
                      result[label]={'rcode':answer.rcode,'A':list(answer.addresses)[:6]}
                  except Exception as exc:
                      result[label]={'error':type(exc).__name__}
              print('HOST_A_MAPPING '+host+' '+str(result),flush=True)
          PY
      - name: Test mapped HTTPS SNI via RU ingress vs DE edge (no changes)
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import socket,ssl,re,time
          names=('claude.ai','api.anthropic.com','gemini.google.com',
                 'grok.com','x.com','www.youtube.com','chatgpt.com')
          ctx=ssl.create_default_context()
          ctx.set_alpn_protocols(['http/1.1'])
          for name in names:
              for label,ip in (('RU_INGRESS','188.120.254.223'),
                               ('DE_EDGE','89.125.90.101')):
                  started=time.monotonic()
                  try:
                      with socket.create_connection((ip,443),timeout=6) as tcp:
                          tcp.settimeout(7)
                          with ctx.wrap_socket(tcp,server_hostname=name) as tls:
                              tls.sendall(('HEAD / HTTP/1.1\r\nHost: '+name+
                                '\r\nUser-Agent: MNEBYDNS-incident-diagnostic/1.0\r\n'
                                'Connection: close\r\n\r\n').encode('ascii'))
                              msg=tls.recv(384)
                              m=re.match(rb'HTTP/1[.]([01]) ([0-9]{3})',msg)
                              code=m.group(2).decode() if m else 'NO_HTTP'
                              print('HTTPS_SNI '+name+' '+label+'='+code+
                                    ' RTT_MS='+str(round((time.monotonic()-started)*1000)),flush=True)
                  except Exception as exc:
                      print('HTTPS_SNI '+name+' '+label+'='+type(exc).__name__,flush=True)
          PY
      - name: Inspect foreign SNI redirect, watchdog rollback, and private upstream (no writes)
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$DE_PASS" && test -s ops/mnebydns-owner-ssh-known_hosts
          sudo apt-get update -qq && sudo apt-get install -qq -y sshpass >/dev/null
          export SSHPASS="$DE_PASS"
          opts=(-o ConnectTimeout=12 -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts"
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR)
          sshpass -e ssh -T "${opts[@]}" root@89.125.90.101 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          for unit in mnebydns-dot mnebydns-personal-sni-stream.service mnebydns-personal-sni-redirect.service mnebydns-personal-sni-watch.timer; do
            printf 'DE_UNIT_%s=%s\n' "$unit" "$(systemctl is-active "$unit" 2>/dev/null || true)"
          done
          if iptables -w -t nat -C PREROUTING -i eth0 -d 89.125.90.101 -p tcp --dport 853 -j REDIRECT --to-ports 8854 2>/dev/null; then
            echo 'DE_PERSONAL_NAT_REDIRECT=PRESENT'
          else
            echo 'DE_PERSONAL_NAT_REDIRECT=MISSING'
          fi
          if grep -Fq '10.66.77.2:8856;' /etc/mnebydns/personal-sni/nginx.conf; then
            echo 'DE_PERSONAL_SNI_UPSTREAM=WG_PRIVATE_8856'
          else
            echo 'DE_PERSONAL_SNI_UPSTREAM=OTHER'
          fi
          count="$(cat /run/mnebydns-personal-sni-watch/failure-count 2>/dev/null || echo absent)"
          if [[ "$count" =~ ^[0-9]{1,3}$ ]];then
            echo "DE_SNI_WATCH_FAILURE_COUNT=$count"
          else
            echo 'DE_SNI_WATCH_FAILURE_COUNT=UNAVAILABLE'
          fi
          journalctl --no-pager -u mnebydns-personal-sni-watch.service --since '60 minutes ago' -o cat 2>/dev/null |
            grep -E '^PERSONAL_SNI_WATCH(_CONSECUTIVE_FAILURES)?=' | tail -45 || true
          python3 - <<'PY'
          import socket,ssl
          ctx=ssl.create_default_context()
          for ip,port,label in [('127.0.0.1',8854,'DE_LOCAL_NGINX_PERSONAL'),
                                ('10.66.77.2',8856,'DE_WG_RU_PERSONAL')]:
              try:
                  with socket.create_connection((ip,port),timeout=5) as tcp:
                      tcp.settimeout(5)
                      with ctx.wrap_socket(tcp,server_hostname='aaaaaaaaaaaa.dns.mnebyvpn.site') as tls:
                          assert tls.getpeercert()
                  print(label+'=TLS_PASS',flush=True)
              except Exception as e:
                  print(label+'='+type(e).__name__,flush=True)
          PY
          REMOTE
      - name: Inspect RU personal service and owner account metering (read-only)
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$RU_PASS"
          export SSHPASS="$RU_PASS"
          opts=(-o ConnectTimeout=12 -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts"
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR)
          sshpass -e ssh -T "${opts[@]}" root@188.120.254.223 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          for ctr in mnebydns-personal-dot-private mnebydns-personal-dot mnebyvpn-stage-postgres; do
            s="$(docker inspect -f '{{.State.Status}}' "$ctr" 2>/dev/null || true)"
            echo "RU_CONTAINER_${ctr}=${s:-missing}"
          done
          code="$(curl --noproxy '*' --max-time 4 -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8857/readyz || true)"
          echo "RU_PERSONAL_PRIVATE_READYZ=$code"
          ip -4 route get 10.66.77.1 2>/dev/null | sed -E 's/src [0-9.]+/src [redacted]/' | cut -c1-160 | sed 's/^/RU_WG_ROUTE=/' || true
          REMOTE
          sshpass -e ssh -T "${opts[@]}" root@188.120.254.223 'python3 -' < scripts/mnebydns-owner-personal-24h-meter-20261114.py
          echo 'INCIDENT_DIAGNOSTICS_MUTATIONS=false'
