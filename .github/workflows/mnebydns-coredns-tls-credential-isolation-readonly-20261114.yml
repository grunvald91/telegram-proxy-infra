name: MNEBYDNS check CoreDNS credential reuse for isolated old-DNS RU188 route
on:
  push:
    branches: [audit/mnebydns-legacy-all-via-188-readonly-20261114]
    paths: ['.github/workflows/mnebydns-coredns-tls-credential-isolation-readonly-20261114.yml']
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Check existing TLS cert source paths and available resources (no private key reads)
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$DE_PASS" && test -s ops/mnebydns-owner-ssh-known_hosts
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass >/dev/null
          export SSHPASS="$DE_PASS"
          sshpass -e ssh -T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts" -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR root@89.125.90.101 'python3 -' <<'PY'
          import subprocess,re,pathlib,ssl,os,datetime
          u=subprocess.check_output(['systemctl','cat','mnebydns-dot.service'],text=True,timeout=8)
          sources={}
          for line in u.splitlines():
              line=line.strip()
              if line.startswith('LoadCredential='):
                  key,source=line.split('=',1)[1].split(':',1)
                  sources[key]=source
                  print('TLS_CREDENTIAL_MAPPED='+key+'|'+source,flush=True)
          assert 'fullchain.pem' in sources and 'privkey.pem' in sources
          for key,source in sources.items():
              p=pathlib.Path(source)
              print('TLS_CERT_SOURCE_EXISTS_'+key+'='+str(p.is_file()),flush=True)
              print('TLS_CERT_SOURCE_MODE_'+key+'='+oct(p.stat().st_mode & 0o777),flush=True)
          x=subprocess.run(['openssl','x509','-in',sources['fullchain.pem'],'-noout','-dates','-subject','-ext','subjectAltName'],capture_output=True,text=True,timeout=7)
          assert x.returncode==0
          for line in x.stdout.splitlines()[:8]:
              print('TLS_CERT_METADATA='+line[:180],flush=True)
          m=subprocess.run(['free','-m'],capture_output=True,text=True,timeout=5)
          for line in m.stdout.splitlines()[:3]:print('HOST_MEMORY_MB='+line[:200],flush=True)
          assert not pathlib.Path('/etc/systemd/system/mnebydns-legacy-ru188-dot.service').exists()
          print('TLS_CREDENTIAL_REUSE_PRECONDITIONS=PASS',flush=True)
          PY
