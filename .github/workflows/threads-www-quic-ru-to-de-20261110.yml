name: Threads www QUIC public-path RU to DE (read-only)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths: [.github/workflows/threads-www-quic-ru-to-de-20261110.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      RU_PASS: ${{ secrets.SERVER188_SSH_PASSWORD }}
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Compare www Threads QUIC SNI versus equal-sized control in RU-to-DE direction
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/threads-www-udp-initial-diff-20261110.py self-test
          sudo apt-get update -qq
          sudo apt-get install -qq -y sshpass >/dev/null
          test -n "$RU_PASS" && test -n "$DE_PASS"
          id="$GITHUB_RUN_ID"
          [[ "$id" =~ ^[0-9]{9,13}$ ]]
          work="/tmp/threads-udp-readonly-$id"
          ru_ssh() {
            SSHPASS="$RU_PASS" sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=accept-new -o LogLevel=ERROR root@188.120.254.223 "$@"
          }
          de_ssh() {
            SSHPASS="$DE_PASS" sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=accept-new -o LogLevel=ERROR root@89.125.90.101 "$@"
          }
          cleanup() {
            code=$?
            trap - EXIT
            ru_ssh "rm -rf -- '$work'" || true
            exit "$code"
          }
          trap cleanup EXIT
          ru_ssh "test ! -e '$work' && mkdir -m 700 '$work'"
          tar -czf - -C scripts mnebydns-meta-quic.py test-mnebydns-meta-quic.py threads-www-udp-initial-diff-20261110.py |
            ru_ssh "tar -xzf - -C '$work'"
          ru_ssh "python3 '$work/threads-www-udp-initial-diff-20261110.py' self-test"
          ru_ssh "ip -4 route get 89.125.90.101 | grep -v tg-relay"
          de_ssh "ip -4 route get 188.120.254.223 | grep -v tg-relay"
          de_ssh 'bash -s' <<'SH' > "$RUNNER_TEMP/de_capture" &
          set -Eeuo pipefail
          iface="$(ip -4 route get 188.120.254.223 | sed -n 's/.* dev \([^ ]*\).*/\1/p' | head -1)"
          test -n "$iface" && test "$iface" != "tg-relay"
          echo 'de_ingress_capture_started=true'
          timeout -s TERM 31s tcpdump -i "$iface" -nn -tt -l -s 96 'udp and host 188.120.254.223 and port 443' 2>/dev/null | python3 -c '
          import sys,re,collections
          d=collections.defaultdict(lambda:[0,0])
          for line in sys.stdin:
              m=re.search(r"\bIP\s+([\d.]+)\.(\d+)\s+>\s+([\d.]+)\.(\d+):.*\bUDP,\s+length\s+(\d+)",line)
              if not m:continue
              src,sp,dst,dp,n=m.groups()
              if src=="188.120.254.223" and dst=="89.125.90.101" and int(dp)==443:
                  d[int(sp)][0]+=1;d[int(sp)][1]+=int(n)
          for p,row in sorted(d.items()):print("DE_INGRESS",p,*row,flush=True)
          ' || test "$?" -eq 124
          SH
          de_pid=$!
          ru_ssh 'bash -s' <<'SH' > "$RUNNER_TEMP/ru_capture" &
          set -Eeuo pipefail
          iface="$(ip -4 route get 89.125.90.101 | sed -n 's/.* dev \([^ ]*\).*/\1/p' | head -1)"
          test -n "$iface" && test "$iface" != "tg-relay"
          echo 'ru_egress_capture_started=true'
          timeout -s TERM 31s tcpdump -i "$iface" -nn -tt -l -s 96 'udp and host 89.125.90.101 and port 443' 2>/dev/null | python3 -c '
          import sys,re,collections
          d=collections.defaultdict(lambda:[0,0])
          for line in sys.stdin:
              m=re.search(r"\bIP\s+([\d.]+)\.(\d+)\s+>\s+([\d.]+)\.(\d+):.*\bUDP,\s+length\s+(\d+)",line)
              if not m:continue
              src,sp,dst,dp,n=m.groups()
              if src=="188.120.254.223" and dst=="89.125.90.101" and int(dp)==443:
                  d[int(sp)][0]+=1;d[int(sp)][1]+=int(n)
          for p,row in sorted(d.items()):print("RU_EGRESS",p,*row,flush=True)
          ' || test "$?" -eq 124
          SH
          ru_pid=$!
          sleep 5
          ru_ssh "python3 '$work/threads-www-udp-initial-diff-20261110.py' send --host 89.125.90.101 --repeat 4" > "$RUNNER_TEMP/trials"
          wait "$ru_pid"
          wait "$de_pid"
          python3 - "$RUNNER_TEMP/trials" "$RUNNER_TEMP/ru_capture" "$RUNNER_TEMP/de_capture" <<'PY'
          import pathlib,re,sys,collections
          a,b,c=[pathlib.Path(x).read_text() for x in sys.argv[1:]]
          def counts(s,prefix):
              out={}
              for line in s.splitlines():
                  m=re.match(prefix+r'\s+(\d+)\s+(\d+)\s+(\d+)',line)
                  if m:
                      port,pkts,size=map(int,m.groups());out[port]=(pkts,size)
              return out
          ru=counts(b,'RU_EGRESS');de=counts(c,'DE_INGRESS')
          results=collections.defaultdict(lambda:collections.Counter())
          tries=0
          for line in a.splitlines():
              m=re.match(r'udp_trial=(\w+) local_port=(-?\d+) sent=(\d+) error=(\S+)',line)
              if not m:continue
              host,p,sent,error=m.groups()
              tries+=1;p=int(p);s=results[host]
              s['attempts']+=1
              s['sent']+=int(int(sent)>0)
              s['ru_egress']+=int(ru.get(p,(0,0))[1]>0)
              s['de_ingress']+=int(de.get(p,(0,0))[1]>0)
          print('quic_ru_de_trials='+str(tries))
          for name,s in sorted(results.items()):
              print('quic_ru_de '+name+' '+str(dict(s)),flush=True)
          assert tries==36
          assert 'ru_egress_capture_started=true' in b
          assert 'de_ingress_capture_started=true' in c
          print('quic_ru_to_de_readonly_complete=true')
          PY
          echo 'quic_ru_to_de_no_server_settings_changed=true'
