name: Meta v24 DE DoT per-client DNS view support read-only review
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: meta-v24-dot-view-review
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Bounded pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$DE_PASS" && test -s ops/mnebydns-owner-ssh-known_hosts
          if ! command -v sshpass >/dev/null; then
            timeout 35s sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=7 update -qq || true
            timeout 55s sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sshpass >/dev/null
          fi
      - name: Does the running DE CoreDNS support split-DNS view by source IP?
        shell: bash
        run: |
          set -Eeuo pipefail
          export SSHPASS="$DE_PASS"
          opts=(-T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes
            -o HostKeyAlgorithms=ssh-ed25519
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts"
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR)
          echo '### DoT split DNS view plugin capability — READ ONLY' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          sshpass -e ssh "${opts[@]}" root@89.125.90.101 'python3 -' <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import pathlib,subprocess,re
          def cmd(argv,timeout=9):
              return subprocess.run(argv,capture_output=True,text=True,timeout=timeout,check=False)
          def show(name,value):
              print("meta_v24_"+name+"="+str(value),flush=True)
          pidstr=cmd(["systemctl","show","-P","MainPID","mnebydns-dot.service"]).stdout.strip()
          show("service_pid_valid",pidstr.isdigit() and int(pidstr)>0)
          if pidstr.isdigit() and int(pidstr)>0:
              executable="/proc/"+pidstr+"/exe"
              p=cmd([executable,"-plugins"])
              show("running_coredns_plugins_introspected",p.returncode==0)
              if p.returncode==0:
                  plugin_output=p.stdout+"\n"+p.stderr
                  show("plugin_help_stdout_bytes",len(p.stdout))
                  show("plugin_help_stderr_bytes",len(p.stderr))
                  # -plugins prints public plugin names only; no config or credentials.
                  show("plugin_public_listing",re.sub(r"\s+"," ",plugin_output).strip()[:650])
                  plugin_tokens=set(plugin_output.split())
                  show("coredns_plugin_tokens_count",len(plugin_tokens))
                  show("view_plugin_available","view" in plugin_tokens)
                  show("template_plugin_available","template" in plugin_tokens)
                  show("tls_plugin_available","tls" in plugin_tokens)
                  show("plugin_list_contains_view","view" in plugin_tokens)
              v=cmd([executable,"-version"])
              show("version_flag_success",v.returncode==0)
          core=pathlib.Path("/opt/mnebydns-dot/Corefile").read_text()
          show("native_dot_corefile",bool(re.search(r"(?m)^\s*(?:tls://)?[^\s{]*:853\s*\\{",core)))
          show("coredns_corefile_has_tls_plugin",bool(re.search(r"(?m)^\s*tls\s+\S+",core)))
          show("corefile_853_token_present",":853" in core)
          show("corefile_imports_present",bool(re.search(r"(?m)^\s*import\s",core)))
          show("server_block_header_count",len(re.findall(r"(?m)^\s*(?:tls://|\.)[^\n]*\\{\s*$",core)))
          ss=cmd(["ss","-H","-lntp","sport","=",":853"])
          show("dot_listener_present",bool(ss.stdout.strip()))
          show("dot_listener_owned_by_coredns","coredns" in ss.stdout.lower())
          show("no_configuration_changes",True)
          PY
          echo '```' >> "$GITHUB_STEP_SUMMARY"
