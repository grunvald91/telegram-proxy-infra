name: FI217 signed production AmneziaWG 3.1 bringup (RU188 plus FI217)
# Production preflight rerun after signed egress source cutover (issue #379).
"on":
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/fi-awg-production-start.yml'
      - 'nodekit/fi_awg_production_activate.py'
      - 'nodekit/fi_awg_production_approval_issue.py'
      - 'nodekit/tests/test_fi_awg_production_activate.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/fi-awg-production-start.yml'
      - 'nodekit/fi_awg_production_activate.py'
      - 'nodekit/fi_awg_production_approval_issue.py'
      - 'nodekit/tests/test_fi_awg_production_activate.py'
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('fi217-production-pr-{0}', github.event.pull_request.number) || 'mnebyvpn-fleet-fi' }}
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Validate strictly readonly inventory
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile nodekit/fi_awg_production_activate.py nodekit/fi_awg_production_approval_issue.py
          python3 -m unittest discover -s nodekit/tests -p 'test_fi_awg_production_activate.py' -v
          python3 -m unittest discover -s nodekit/tests -p 'test_fi_awg_production_policy.py' -v
          python3 -m unittest discover -s nodekit/tests -p 'test_awg_egress_production.py' -v
          python3 -m unittest discover -s nodekit/tests -p 'test_awg_watchdog.py' -v
          python3 - <<'PY'
          from pathlib import Path
          rows=Path('.github/workflows/fi-awg-production-start.yml').read_text().splitlines()
          marker='      - name: Sign and activate FI217 production AWG with persistent watchdog and NAT'
          start=rows.index(marker)
          start=next(i for i in range(start+1,len(rows)) if rows[i]=='        run: |')+1
          body=[]
          for row in rows[start:]:
              if row and not row.startswith('          '):
                  break
              body.append(row[10:] if row.startswith('          ') else '')
          assert body and 'trap cleanup EXIT' in body
          Path('/tmp/fi-awg-production-start-syntax.sh').write_text('\n'.join(body)+'\n')
          PY
          bash -n /tmp/fi-awg-production-start-syntax.sh
          rm -f /tmp/fi-awg-production-start-syntax.sh
  activate-fi:
    needs: offline
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: node-fi
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Install pinned-host password SSH transport
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -qq -y --no-install-recommends sshpass >/dev/null
      - name: Sign and activate FI217 production AWG with persistent watchdog and NAT
        shell: bash
        env:
          RU_PASSWORD: ${{ secrets.SERVER188_SSH_PASSWORD }}
          FI_PASSWORD: ${{ secrets.MNEBYVPN_NEW_NODE_SSH_PASSWORD }}
          FI_USER: ${{ secrets.MNEBYVPN_NEW_NODE_SSH_USER }}
        run: |
          set -Eeuo pipefail
          umask 077
          [[ -n "$RU_PASSWORD" && -n "$FI_PASSWORD" && "$FI_USER" == root ]] || exit 2
          grep -q '^188\.120\.254\.223 ssh-ed25519 ' ops/mnebydns-owner-ssh-known_hosts
          work="$RUNNER_TEMP/fi-awg-production-start"
          mkdir -m 0700 "$work"
          cat > "$work/ru.cfg" <<CFG
          Host ru-controller
            HostName 188.120.254.223
            User root
            UserKnownHostsFile $GITHUB_WORKSPACE/ops/mnebydns-owner-ssh-known_hosts
            GlobalKnownHostsFile /dev/null
            HostKeyAlgorithms ssh-ed25519
            StrictHostKeyChecking yes
            UpdateHostKeys no
            BatchMode no
            PasswordAuthentication yes
            PubkeyAuthentication no
            KbdInteractiveAuthentication no
            ForwardAgent no
            ClearAllForwardings yes
            ControlMaster no
            ProxyCommand none
            ConnectTimeout 12
            ServerAliveInterval 10
            ServerAliveCountMax 3
            LogLevel ERROR
          CFG
          ru(){ SSHPASS="$RU_PASSWORD" sshpass -e ssh -T -F "$work/ru.cfg" ru-controller "$@"; }
          SSHPASS="$RU_PASSWORD" sshpass -e ssh -T -F "$work/ru.cfg" ru-controller \
            'cat /root/mnebyvpn-controller/fi-known_hosts' > "$work/fi-known"
          [[ "$(wc -l < "$work/fi-known")" == 1 ]] || exit 2
          grep -Eq '^fi\.mnebyvpn\.site ssh-ed25519 [A-Za-z0-9+/]+={0,2}$' "$work/fi-known"
          cat > "$work/fi.cfg" <<CFG
          Host fi-node
            HostName 217.11.167.91
            User root
            UserKnownHostsFile $work/fi-known
            HostKeyAlias fi.mnebyvpn.site
            GlobalKnownHostsFile /dev/null
            HostKeyAlgorithms ssh-ed25519
            StrictHostKeyChecking yes
            UpdateHostKeys no
            BatchMode no
            PasswordAuthentication yes
            PubkeyAuthentication no
            KbdInteractiveAuthentication no
            ForwardAgent no
            ClearAllForwardings yes
            ControlMaster no
            ProxyCommand none
            ConnectTimeout 12
            ServerAliveInterval 10
            ServerAliveCountMax 3
            LogLevel ERROR
          CFG
          fi_node(){ SSHPASS="$FI_PASSWORD" sshpass -e ssh -T -F "$work/fi.cfg" fi-node "$@"; }
          ru_dir=""
          fi_dir=""
          cleanup(){
            set +e
            if [[ "$ru_dir" =~ ^/run/fi-awg-production-start\.[A-Za-z0-9]{8}$ ]]; then
              ru "rm -rf -- '$ru_dir'" >/dev/null 2>&1
            fi
            if [[ "$fi_dir" =~ ^/run/fi-awg-production-start\.[A-Za-z0-9]{8}$ ]]; then
              fi_node "rm -rf -- '$fi_dir'" >/dev/null 2>&1
            fi
            rm -rf -- "$work"
          }
          trap cleanup EXIT
          ru_dir=$(ru 'umask 077; mktemp -d /run/fi-awg-production-start.XXXXXXXX')
          fi_dir=$(fi_node 'umask 077; mktemp -d /run/fi-awg-production-start.XXXXXXXX')
          [[ "$ru_dir" =~ ^/run/fi-awg-production-start\.[A-Za-z0-9]{8}$ ]] || exit 2
          [[ "$fi_dir" =~ ^/run/fi-awg-production-start\.[A-Za-z0-9]{8}$ ]] || exit 2
          # Export only pinned hashes/public-key fingerprint; no private AWG key leaves FI217.
          SSHPASS="$FI_PASSWORD" sshpass -e scp -F "$work/fi.cfg" \
            nodekit/fi_awg_production_activate.py nodekit/fi_awg_signed_canary.py \
            nodekit/fi_awg_production_policy.py nodekit/awg_lifecycle.py \
            nodekit/install_components.py nodekit/awg_egress.py \
            nodekit/install_awg_watchdog.py nodekit/awg_peer_grants.py "fi-node:$fi_dir/"
          SSHPASS="$RU_PASSWORD" sshpass -e scp -F "$work/ru.cfg" \
            nodekit/fi_awg_production_approval_issue.py nodekit/fi_awg_signed_canary.py \
            nodekit/fi_awg_production_policy.py nodekit/install_components.py \
            "ru-controller:$ru_dir/"
          # The public release is explicitly gated off during the infrastructure bringup.
          released=$(ru "docker exec mnebyvpn-stage-postgres psql -X -q -A -t -v ON_ERROR_STOP=1 -U mnebyvpn_stage -d mnebyvpn_stage -c \"SELECT enabled::text FROM public.vpn_release_flags WHERE feature='vpn_awg_clients'\"")
          [[ "$released" == false ]] || exit 2
          fi_node "chmod 0600 '$fi_dir/'*.py; timeout 45s python3 '$fi_dir/fi_awg_production_activate.py' --mode export" > "$work/material.json"
          [[ -s "$work/material.json" ]] || exit 2
          SSHPASS="$RU_PASSWORD" sshpass -e scp -F "$work/ru.cfg" "$work/material.json" "ru-controller:$ru_dir/material.json"
          ru "chmod 0600 '$ru_dir/'*.py '$ru_dir/material.json'; timeout 45s python3 '$ru_dir/fi_awg_production_approval_issue.py' --material '$ru_dir/material.json'" > "$work/approval.json"
          [[ -s "$work/approval.json" ]] || exit 2
          SSHPASS="$FI_PASSWORD" sshpass -e scp -F "$work/fi.cfg" "$work/approval.json" "fi-node:$fi_dir/approval.json"
          fi_node "chmod 0600 '$fi_dir/approval.json'; timeout 180s python3 '$fi_dir/fi_awg_production_activate.py' --mode activate --approval '$fi_dir/approval.json' --source '$fi_dir'"
          fi_node "timeout 45s python3 '$fi_dir/fi_awg_production_activate.py' --mode verify"
          released_after=$(ru "docker exec mnebyvpn-stage-postgres psql -X -q -A -t -v ON_ERROR_STOP=1 -U mnebyvpn_stage -d mnebyvpn_stage -c \"SELECT enabled::text FROM public.vpn_release_flags WHERE feature='vpn_awg_clients'\"")
          [[ "$released_after" == false ]] || exit 2
          echo "FI_AWG_PRODUCTION_GITHUB_ACTION=VERIFIED;CUSTOMER_RELEASE=false"
