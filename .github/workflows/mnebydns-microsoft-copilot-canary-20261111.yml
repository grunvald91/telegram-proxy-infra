name: MNEBYDNS single Copilot Microsoft 60-minute guarded canary
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - '.github/workflows/mnebydns-microsoft-copilot-canary-20261111.yml'
      - 'scripts/mnebydns-microsoft-copilot-request-canary-20261111.sql'
  push:
    branches: [main]
    paths:
      - '.github/workflows/mnebydns-microsoft-copilot-canary-20261111.yml'
      - 'scripts/mnebydns-microsoft-copilot-request-canary-20261111.sql'
permissions:
  contents: read
concurrency:
  group: mnebydns-google-public-443-change
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prove one exact owner-approved hostname and rollback contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text=Path('scripts/mnebydns-microsoft-copilot-request-canary-20261111.sql').read_text()
          assert text.count("domain='copilot.microsoft.com'")==1
          assert "AND product='Microsoft'" in text and "AND status='PENDING'" in text
          assert "NOT EXISTS" in text and "status='APPLY_REQUESTED'" in text
          assert 'RETURNING domain' in text
          assert 'microsoft.com' not in text.replace('copilot.microsoft.com','')
          print('copilot_single_domain_guard=PASS')
          PY
          python3 -m py_compile scripts/mnebydns-owner-domain-controller-20261110.py
          python3 scripts/mnebydns-owner-domain-render-20261110.py self-test
          python3 scripts/mnebydns-owner-domain-controller-20261110.py self-test
          python3 -m unittest discover -s scripts/tests -p 'test_owner_domain_*.py' -v
          bash -n scripts/mnebydns-owner-domain-stage-20261110.sh scripts/mnebydns-owner-domain-rollback-20261110.sh
  live:
    if: github.event_name == 'push'
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      RU_PASS: ${{ secrets.SERVER188_SSH_PASSWORD }}
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Request exactly one Copilot route only if owner canary queue is idle
        id: request
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$RU_PASS" && test -n "$DE_PASS"
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sshpass >/dev/null
          export SSHPASS="$RU_PASS"
          opts=(-T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes
            -o HostKeyAlgorithms=ssh-ed25519
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts"
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR)
          request="$(sshpass -e ssh "${opts[@]}" root@188.120.254.223 \
            'docker exec -i mnebyvpn-stage-postgres psql -XqAt -v ON_ERROR_STOP=1 -U mnebyvpn_stage -d mnebyvpn_stage' \
            < scripts/mnebydns-microsoft-copilot-request-canary-20261111.sql)"
          if [[ "$request" != copilot.microsoft.com\|APPLY_REQUESTED\|* ]]; then
            echo 'copilot_canary=SKIPPED_EXISTING_TEST_OR_UNEXPECTED_STATUS'
            echo 'requested=no' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "copilot_canary=QUEUED"
          echo 'requested=yes' >> "$GITHUB_OUTPUT"
      - name: Run existing exact-host TLS+DoT guarded owner controller and independent rollback
        if: steps.request.outputs.requested == 'yes'
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/mnebydns-owner-domain-controller-20261110.py run
      - name: Read back exact domain status and test deadline, not other owners
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$RU_PASS"
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sshpass >/dev/null
          export SSHPASS="$RU_PASS"
          opts=(-T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes
            -o HostKeyAlgorithms=ssh-ed25519
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts"
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR)
          sshpass -e ssh "${opts[@]}" root@188.120.254.223 \
            'docker exec -i mnebyvpn-stage-postgres psql -XqAt -v ON_ERROR_STOP=1 -U mnebyvpn_stage -d mnebyvpn_stage' <<'SQL'
          SELECT domain || '|' || status || '|' || coalesce(last_error_code,'none')
            || '|' || coalesce(to_char(canary_expires_at AT TIME ZONE 'UTC',
               'YYYY-MM-DD HH24:MI:SS'), 'none')
          FROM dns_admin_domains WHERE domain='copilot.microsoft.com';
          SQL
          echo microsoft_copilot_status_readback=true
