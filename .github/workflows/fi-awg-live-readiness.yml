name: FI217 RU188 and Finland native AWG live release readiness (readonly)
"on":
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/fi-awg-live-readiness.yml'
      - 'nodekit/fi_awg_live_readiness.py'
      - 'nodekit/tests/test_fi_awg_live_readiness.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/fi-awg-live-readiness.yml'
      - 'nodekit/fi_awg_live_readiness.py'
      - 'nodekit/tests/test_fi_awg_live_readiness.py'
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('fi-awg-live-readiness-pr-{0}', github.event.pull_request.number) || 'ru188-awg-gateway-schema-stage' }}
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Validate strictly readonly inventory
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile nodekit/fi_awg_live_readiness.py
          python3 -m unittest discover -s nodekit/tests -p 'test_fi_awg_live_readiness.py' -v
          python3 - <<'PY'
          from pathlib import Path
          rows=Path('.github/workflows/fi-awg-live-readiness.yml').read_text().splitlines()
          marker='      - name: Inspect RU188 and FI217 without changing any release gate or customer'
          start=rows.index(marker)
          start=next(i for i in range(start+1,len(rows)) if rows[i]=='        run: |')+1
          body=[]
          for row in rows[start:]:
              if row and not row.startswith('          '):
                  break
              body.append(row[10:] if row.startswith('          ') else '')
          assert body and 'trap cleanup EXIT' in body
          Path('/tmp/fi-awg-live-readiness-syntax.sh').write_text('\\n'.join(body)+'\\n')
          PY
          bash -n /tmp/fi-awg-live-readiness-syntax.sh
          rm -f /tmp/fi-awg-live-readiness-syntax.sh
  inspect:
    needs: offline
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: node-fi
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Install pinned-host password SSH transport
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -qq -y --no-install-recommends sshpass >/dev/null
      - name: Inspect RU188 and FI217 without changing any release gate or customer
        shell: bash
        env:
          RU_PASSWORD: ${{ secrets.SERVER188_SSH_PASSWORD }}
          FI_PASSWORD: ${{ secrets.MNEBYVPN_NEW_NODE_SSH_PASSWORD }}
          FI_USER: ${{ secrets.MNEBYVPN_NEW_NODE_SSH_USER }}
        run: |
          set -Eeuo pipefail
          umask 077
          [[ -n "$RU_PASSWORD" && -n "$FI_PASSWORD" && "$FI_USER" == root ]] || exit 2
          grep -q '^188\.120\.254\.223 ssh-ed25519 ' ops/mnebydns-owner-ssh-known_hosts
          work="$RUNNER_TEMP/fi-awg-live-readiness"
          mkdir -m 0700 "$work"
          cat > "$work/ru.cfg" <<CFG
          Host ru-controller
            HostName 188.120.254.223
            User root
            UserKnownHostsFile $GITHUB_WORKSPACE/ops/mnebydns-owner-ssh-known_hosts
            GlobalKnownHostsFile /dev/null
            HostKeyAlgorithms ssh-ed25519
            StrictHostKeyChecking yes
            UpdateHostKeys no
            BatchMode no
            PasswordAuthentication yes
            PubkeyAuthentication no
            KbdInteractiveAuthentication no
            ForwardAgent no
            ClearAllForwardings yes
            ControlMaster no
            ProxyCommand none
            ConnectTimeout 12
            ServerAliveInterval 10
            ServerAliveCountMax 3
            LogLevel ERROR
          CFG
          ru(){ SSHPASS="$RU_PASSWORD" sshpass -e ssh -T -F "$work/ru.cfg" ru-controller "$@"; }
          SSHPASS="$RU_PASSWORD" sshpass -e ssh -T -F "$work/ru.cfg" ru-controller \
            'cat /root/mnebyvpn-controller/fi-known_hosts' > "$work/fi-known"
          [[ "$(wc -l < "$work/fi-known")" == 1 ]] || exit 2
          grep -Eq '^fi\.mnebyvpn\.site ssh-ed25519 [A-Za-z0-9+/]+={0,2}$' "$work/fi-known"
          cat > "$work/fi.cfg" <<CFG
          Host fi-node
            HostName 217.11.167.91
            User root
            UserKnownHostsFile $work/fi-known
            HostKeyAlias fi.mnebyvpn.site
            GlobalKnownHostsFile /dev/null
            HostKeyAlgorithms ssh-ed25519
            StrictHostKeyChecking yes
            UpdateHostKeys no
            BatchMode no
            PasswordAuthentication yes
            PubkeyAuthentication no
            KbdInteractiveAuthentication no
            ForwardAgent no
            ClearAllForwardings yes
            ControlMaster no
            ProxyCommand none
            ConnectTimeout 12
            ServerAliveInterval 10
            ServerAliveCountMax 3
            LogLevel ERROR
          CFG
          fi_node(){ SSHPASS="$FI_PASSWORD" sshpass -e ssh -T -F "$work/fi.cfg" fi-node "$@"; }
          ru_dir=""
          fi_dir=""
          cleanup(){
            set +e
            if [[ "$ru_dir" =~ ^/run/fi-awg-live-readiness\.[A-Za-z0-9]{8}$ ]]; then
              ru "rm -rf -- '$ru_dir'" >/dev/null 2>&1
            fi
            if [[ "$fi_dir" =~ ^/run/fi-awg-live-readiness\.[A-Za-z0-9]{8}$ ]]; then
              fi_node "rm -rf -- '$fi_dir'" >/dev/null 2>&1
            fi
            rm -rf -- "$work"
          }
          trap cleanup EXIT
          ru_dir=$(ru 'umask 077; mktemp -d /run/fi-awg-live-readiness.XXXXXXXX')
          fi_dir=$(fi_node 'umask 077; mktemp -d /run/fi-awg-live-readiness.XXXXXXXX')
          [[ "$ru_dir" =~ ^/run/fi-awg-live-readiness\.[A-Za-z0-9]{8}$ ]] || exit 2
          [[ "$fi_dir" =~ ^/run/fi-awg-live-readiness\.[A-Za-z0-9]{8}$ ]] || exit 2
          SSHPASS="$RU_PASSWORD" sshpass -e scp -F "$work/ru.cfg" \
            nodekit/fi_awg_live_readiness.py "ru-controller:$ru_dir/inspect.py"
          SSHPASS="$FI_PASSWORD" sshpass -e scp -F "$work/fi.cfg" \
            nodekit/fi_awg_live_readiness.py "fi-node:$fi_dir/inspect.py"
          ru_result=$(ru "chmod 0600 '$ru_dir/inspect.py'; timeout 40s python3 '$ru_dir/inspect.py' --mode ru")
          fi_result=$(fi_node "chmod 0600 '$fi_dir/inspect.py'; timeout 40s python3 '$fi_dir/inspect.py' --mode fi")
          export FI_RU_REPORT="$ru_result"
          export FI_NODE_REPORT="$fi_result"
          python3 - <<'PY'
          import os,re
          reports={}
          for name,mode in (('RU','RU'),('FI','FI')):
              line=os.environ['FI_'+('RU_REPORT' if name=='RU' else 'NODE_REPORT')]
              prefix='FI_AWG_LIVE_AUDIT_'+mode+'='
              assert line.startswith(prefix) and line.count('\n')==0 and len(line)<1800
              values=line[len(prefix):].split(';')
              result={}
              for item in values:
                  key,sep,val=item.partition(':')
                  assert sep and re.fullmatch(r'[A-Z_]{3,64}',key)
                  assert re.fullmatch(r'[a-z_]{2,40}|true|false|yes|no',val)
                  assert key not in result
                  result[key]=val
              reports[mode]=result
          ru,fi=reports['RU'],reports['FI']
          checks={
              'fi_enrolled':ru.get('FI_ENROLLMENT')=='enrolled',
              'queue':ru.get('DEVICE_QUEUE')=='true',
              'pool_verified':ru.get('POOL')=='verified' and ru.get('POOL_PROOF')=='fresh',
              'worker_active':ru.get('WORKER')=='active',
              'release_enabled':ru.get('RELEASE')=='true',
              'site_provisioned':all(ru.get(key)=='yes' for key in (
                  'WEB_NETWORK_PROVISIONING_VERIFIED','WEB_FI_AWG_REGISTRATION_ENABLED',
                  'WEB_FI_AWG_MATERIAL_ENABLED')),
              'site_keys':all(ru.get(key)=='present' for key in (
                  'WEB_FI_AWG_SERVER_PUBLIC_KEY','WEB_FI_AWG_HEADER_PROTECTION_KEY')),
              'site_awg_route':ru.get('WEB_AWG_PAGE')=='available',
              'fi_production_manifest':fi.get('NODE_MANIFEST')=='active' and fi.get('NODE_ACTIVATION')=='yes',
              'fi_awg_active':fi.get('AWG_SERVICE')=='active' and fi.get('AWG_WATCHDOG')=='active' and fi.get('AWG_INTERFACE')=='present',
          }
          for name,ok in checks.items():
              print('FI_AWG_READY_'+name.upper()+'='+('PASS' if ok else 'BLOCKED'))
          print('FI_AWG_CUSTOMER_TECHNICAL_GATES='+('PASS' if all(checks.values()) else 'BLOCKED'))
          # An audit that reports BLOCKED has itself succeeded. Never mistake
          # this for permission to enable release or touch the customer DB.
          PY
