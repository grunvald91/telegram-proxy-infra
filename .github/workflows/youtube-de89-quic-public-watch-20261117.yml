name: Check public QUIC ingress before peer filtering
on:
  push:
    branches: [diag/youtube-de89-quic-public-watch-20261117]
    paths:
      - .github/workflows/youtube-de89-quic-public-watch-20261117.yml
      - scripts/youtube-de89-owner-return-bypass-20261117.py
permissions: {contents: read}
concurrency:
  group: mnebydns-youtube-quic-public-watch
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Validate existing parser and prepare pinned SSH
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/youtube-de89-owner-return-bypass-20261117.py scripts/termux-youtube-libcurl-20261117.py
          test -n "$DE_PASS" && test -s ops/mnebydns-owner-ssh-known_hosts
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          cat > "$RUNNER_TEMP/de-phone" <<'SHELL'
          #!/bin/bash
          set -Eeuo pipefail
          export SSHPASS="$DE_PASS"
          exec sshpass -e ssh -T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=5 -o ServerAliveCountMax=3 -o HostKeyAlgorithms=ssh-ed25519 \
            -o "UserKnownHostsFile=$GITHUB_WORKSPACE/ops/mnebydns-owner-ssh-known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR \
            root@89.125.90.101 "$@"
          SHELL
          chmod 700 "$RUNNER_TEMP/de-phone"
      - name: Read prior unknown Initials and reopen the same bounded owner canary
        run: |
          set -Eeuo pipefail
          "$RUNNER_TEMP/de-phone" 'python3 -B -' <<'PYTHON'
          import json,os,pathlib,subprocess,time
          def cmd(a,check=True):
              p=subprocess.run(a,capture_output=True,text=True,timeout=12)
              if check and p.returncode:raise RuntimeError('COMMAND_FAILED_'+a[0])
              return p.stdout
          for l in pathlib.Path('/run/mnebydns-quic-watch-44098567495-1/result.log').read_text().splitlines():
              if l.startswith('OWNER_QUIC_INITIAL_RECEIPT='):
                  r=json.loads(l.split('=',1)[1])
                  if r['phase']=='final' and r.get('domain') is None:print('UNCLASSIFIED_QUIC_INITIAL='+json.dumps(r,sort_keys=True))
          base='/opt/mnebydns-h3-origin-diag-44096073096-1'
          cmd(['systemctl','is-active','--quiet','mnebydns-google-tcp-only-20261117.service'])
          timer='mnebydns-h3-extended-${{ github.run_id }}-${{ github.run_attempt }}'
          cmd(['systemd-run','--quiet','--collect','--unit='+timer,'--on-active=1800s','/usr/bin/python3','-B',base+'/canary.py','clean',base])
          cmd(['systemctl','is-active','--quiet',timer+'.timer'])
          cmd(['systemctl','stop','mnebydns-h3-clean-44096073096-1.timer'],False)
          os.chmod(base,0o755)
          for peer in json.loads(pathlib.Path(base+'/peers.json').read_text()):
              rule=['INPUT','-d','89.125.90.101/32','-s',peer,'-p','udp','--dport','443','-m','comment','--comment','MNEBYDNS_H3_OWNER_CANARY_20261117','-j','ACCEPT']
              if subprocess.run(['iptables','-C',*rule],capture_output=True).returncode:cmd(['iptables','-I','INPUT','1',*rule[1:]])
          cmd(['systemctl','restart','mnebydns-h3-canary-44096073096-1.service'])
          cmd(['systemctl','is-active','--quiet','mnebydns-h3-canary-44096073096-1.service'])
          print('OWNER_CANARY_EXTENDED_UNTIL_UTC='+time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime(time.time()+1800)))
          PYTHON
      - name: Observe all public UDP443 sources before INPUT filtering
        run: |
          set -Eeuo pipefail
          root="/run/mnebydns-quic-public-${{ github.run_id }}-${{ github.run_attempt }}"
          "$RUNNER_TEMP/de-phone" "umask 077; mkdir '$root'; cat > '$root/watch.py'" < scripts/youtube-de89-quic-public-watch-20261117.py
          "$RUNNER_TEMP/de-phone" "systemd-run --quiet --unit=mnebydns-quic-public-${{ github.run_id }}-${{ github.run_attempt }} --property=RuntimeMaxSec=640 --property=MemoryMax=128M --property=CPUQuota=20% --property=StandardOutput=append:$root/result.log --property=StandardError=append:$root/result.log /usr/bin/env PYTHONPATH=/opt/mnebydns-h3-origin-diag-44096073096-1/deps /usr/bin/python3 -B '$root/watch.py'"
          "$RUNNER_TEMP/de-phone" "for attempt in \$(seq 1 15); do if test -s '$root/READY'; then echo PUBLIC_QUIC_CAPTURE_READY=true; date -u +%FT%TZ; exit 0; fi; sleep 1; done; cat '$root/result.log'; exit 1"
