name: FI SNI dedicated egress guard (private)
"on":
  pull_request:
    paths: ["nodekit/fi_sni_egress*.py","nodekit/systemd/fi-sni-guard/*",".github/workflows/fi-sni-egress-guard.yml"]
  push:
    branches: [main]
    paths: ["nodekit/fi_sni_egress*.py","nodekit/systemd/fi-sni-guard/*",".github/workflows/fi-sni-egress-guard.yml"]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: mnebyvpn-fleet-fi
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Test real nftables rules in isolated network namespace
        run: |
          set -Eeuo pipefail
          python3 -m py_compile nodekit/fi_sni_egress*.py
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends nftables iproute2
          sudo unshare -n -- python3 nodekit/fi_sni_egress_ci.py
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('.github/workflows/fi-sni-egress-guard.yml').read_text().splitlines()
          i=lines.index('      - name: Activate dedicated FI SNI egress guard')
          i=next(j for j in range(i+1,len(lines)) if lines[j]=='        run: |')+1
          Path('/tmp/fi-sni-egress-stage.sh').write_text('\n'.join(line[10:] for line in lines[i:])+'\n')
          PY
          bash -n /tmp/fi-sni-egress-stage.sh
  stage:
    needs: offline
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: node-fi
    env:
      RU_PASSWORD: ${{ secrets.SERVER188_SSH_PASSWORD }}
      FI_PASSWORD: ${{ secrets.MNEBYVPN_NEW_NODE_SSH_PASSWORD }}
      FI_USER: ${{ secrets.MNEBYVPN_NEW_NODE_SSH_USER }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Activate dedicated FI SNI egress guard
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          [[ "$FI_USER" == root && -n "$RU_PASSWORD" && -n "$FI_PASSWORD" ]] || exit 2
          grep -q '^188\.120\.254\.223 ssh-ed25519 ' ops/mnebydns-owner-ssh-known_hosts
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends sshpass >/dev/null
          work="$RUNNER_TEMP/fi-dns-canary"
          mkdir -m 0700 "$work"
          cat > "$work/ru.cfg" <<CFG
          Host ru-controller
            HostName 188.120.254.223
            User root
            UserKnownHostsFile $GITHUB_WORKSPACE/ops/mnebydns-owner-ssh-known_hosts
            GlobalKnownHostsFile /dev/null
            HostKeyAlgorithms ssh-ed25519
            StrictHostKeyChecking yes
            UpdateHostKeys no
            PubkeyAuthentication no
            PreferredAuthentications password
            ForwardAgent no
            ClearAllForwardings yes
            ControlMaster no
            ConnectTimeout 12
            LogLevel ERROR
          CFG
          SSHPASS="$RU_PASSWORD" sshpass -e ssh -T -F "$work/ru.cfg" ru-controller \
            'test -f /root/mnebyvpn-controller/fi-known_hosts && test ! -L /root/mnebyvpn-controller/fi-known_hosts && test "$(stat -c "%u:%a" /root/mnebyvpn-controller/fi-known_hosts)" = 0:600 && cat /root/mnebyvpn-controller/fi-known_hosts' > "$work/fi-known"
          python3 - "$work/fi-known" <<'PY'
          import base64,pathlib,sys
          data=pathlib.Path(sys.argv[1]).read_bytes()
          assert len(data)<512 and data.count(b'\n')==1 and data.endswith(b'\n')
          name,kind,key=data.decode('ascii').strip().split()
          assert (name,kind)==('fi.mnebyvpn.site','ssh-ed25519')
          raw=base64.b64decode(key,validate=True)
          assert len(raw)==51 and raw.startswith(b'\x00\x00\x00\x0bssh-ed25519\x00\x00\x00\x20')
          PY
          cat > "$work/fi.cfg" <<CFG
          Host fi-node
            HostName 217.11.167.91
            User root
            HostKeyAlias fi.mnebyvpn.site
            UserKnownHostsFile $work/fi-known
            GlobalKnownHostsFile /dev/null
            HostKeyAlgorithms ssh-ed25519
            StrictHostKeyChecking yes
            UpdateHostKeys no
            PubkeyAuthentication no
            PreferredAuthentications password
            ForwardAgent no
            ClearAllForwardings yes
            ControlMaster no
            ConnectTimeout 12
            LogLevel ERROR
          CFG
          fi_node() { SSHPASS="$FI_PASSWORD" sshpass -e ssh -T -F "$work/fi.cfg" fi-node "$@"; }
          stage="/run/fi-sni-guard-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          [[ "$stage" =~ ^/run/fi-sni-guard-[0-9]+-[0-9]+$ ]]
          created=no
          verified=no
          cleanup() {
            set +e
            if [[ "$created" == yes ]]; then
              if [[ "$verified" != yes ]]; then
                fi_node "if test -f '$stage/guard-switch'; then PYTHONPATH=/opt/mnebyvpn-fi-dns-node python3 '$stage/fi_sni_egress_stage.py' rollback '$stage'; fi" || echo FI_SNI_GUARD_ROLLBACK_UNCONFIRMED=true
              fi
              fi_node "rm -rf -- '$stage'" >/dev/null 2>&1
            fi
            rm -rf "$work"
          }
          trap cleanup EXIT
          fi_node "umask 077; mkdir -m 0700 '$stage'"
          created=yes
          SSHPASS="$FI_PASSWORD" sshpass -e scp -F "$work/fi.cfg" \
            nodekit/fi_sni_egress_guard.py nodekit/fi_sni_egress_stage.py nodekit/fi_routed_stage.py \
            nodekit/systemd/fi-sni-guard/*.service "fi-node:$stage/"
          fi_node "chmod 600 '$stage'/*; PYTHONPATH=/opt/mnebyvpn-fi-dns-node timeout --signal=TERM --kill-after=60s 180s python3 '$stage/fi_sni_egress_stage.py' stage '$stage'"
          verified=yes
