# Reviewed: worker scope restricted to manual sales; no live user provisioning on initial rollout.
name: Launch owner-only Telemt worker on RU188 (private UDS)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/mnebyvpn-owner-telemt-worker-launch.yml'
      - 'scripts/mnebyvpn-owner-telemt-worker-install-188.sh'
  push:
    branches: [main]
    paths: ['.github/workflows/mnebyvpn-owner-telemt-worker-launch.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mnebyvpn-auto-public-deploy
  cancel-in-progress: false
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check fail-closed bootstrap, no external database or public Telemt API
        run: |
          set -Eeuo pipefail
          bash -n scripts/mnebyvpn-owner-telemt-worker-install-188.sh
          bash -n scripts/mnebyvpn-main-bot-promote.sh
          grep -Fq 'DNS_MT_PROXY_OWNER_ONLY=yes' scripts/mnebyvpn-owner-telemt-worker-install-188.sh
          grep -Fq 'dns_mtproxy_bonus_credentials' scripts/mnebyvpn-owner-telemt-worker-install-188.sh
          grep -Fq 'mnebyvpn_owner_telemt' scripts/mnebyvpn-owner-telemt-worker-install-188.sh
          grep -Fq '13096:13096' scripts/mnebyvpn-owner-telemt-worker-install-188.sh
          grep -Fq "{{.RestartCount}}" scripts/mnebyvpn-owner-telemt-worker-install-188.sh
          ! grep -Fq "{{.State.RestartCount}}" scripts/mnebyvpn-owner-telemt-worker-install-188.sh
          grep -Fq "already_running=yes" scripts/mnebyvpn-owner-telemt-worker-install-188.sh
          grep -Fq 'canonical_network=container:mnebyvpn-stage-postgres' scripts/mnebyvpn-owner-telemt-worker-install-188.sh
          grep -Fq 'owner_mtproxy_canary_database_network=verified' scripts/mnebyvpn-owner-telemt-worker-install-188.sh
          grep -Fq 'rollback_network' scripts/mnebyvpn-owner-telemt-worker-install-188.sh
          ! grep -Eq 'pg_hba.conf|iptables|nft add|ufw allow|systemctl restart telemt|docker rm -f mnebyvpn-bot-info' scripts/mnebyvpn-owner-telemt-worker-install-188.sh
  launch:
    needs: lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PASS_RU: ${{ secrets.SERVER188_SSH_PASSWORD }}
      PASS_DE: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare pinned SSH and non-mutating foreign Telemt preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$PASS_RU" && test -n "$PASS_DE"
          test -s ops/mnebydns-owner-ssh-known_hosts
          sudo apt-get update -qq && sudo apt-get install -qq -y sshpass >/dev/null
          export SSHPASS="$PASS_DE"
          opts=(-T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes
            -o HostKeyAlgorithms=ssh-ed25519
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts"
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR)
          sshpass -e ssh "${opts[@]}" root@89.125.90.101 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          systemctl is-active --quiet telemt-direct-ozon
          ss -H -lnt 'sport = :9446' | grep -q .
          ss -H -lnt 'sport = :9096' | grep -q .
          grep -Eq '^[[:space:]]*tls_domain[[:space:]]*=[[:space:]]*"xapi[.]ozon[.]ru"' /etc/telemt/direct-ozon.toml
          curl --noproxy '*' -fsS --max-time 6 http://127.0.0.1:9096/v1/system/info |
            python3 -c 'import json,sys;assert json.load(sys.stdin).get("ok") is True'
          echo 'foreign_telemt_existing_profile_unchanged=true'
          REMOTE
      - name: Create narrow PG role and start only the owner Telemt worker
        shell: bash
        run: |
          set -Eeuo pipefail
          export SSHPASS="$PASS_RU"
          opts=(-o ConnectTimeout=12 -o StrictHostKeyChecking=yes
            -o HostKeyAlgorithms=ssh-ed25519
            -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts"
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR)
          sshpass -e scp "${opts[@]}" scripts/mnebyvpn-main-bot-promote.sh root@188.120.254.223:/tmp/mnebyvpn-owner-mtproxy-bot-promote.sh
          sshpass -e scp "${opts[@]}" scripts/mnebyvpn-owner-telemt-worker-install-188.sh root@188.120.254.223:/tmp/mnebyvpn-owner-telemt-worker-install-188.sh
          sshpass -e ssh -T "${opts[@]}" root@188.120.254.223 'bash /tmp/mnebyvpn-owner-telemt-worker-install-188.sh'
          echo 'owner_mtproxy_worker_release_attempted=true' >> "$GITHUB_STEP_SUMMARY"
      - name: Clean up temporary worker installers
        if: always()
        shell: bash
        run: |
          if [[ -n "$PASS_RU" ]];then
            export SSHPASS="$PASS_RU"
            sshpass -e ssh -T -o ConnectTimeout=10 -o StrictHostKeyChecking=yes \
              -o HostKeyAlgorithms=ssh-ed25519 \
              -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts" \
              -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR \
              root@188.120.254.223 'rm -f /tmp/mnebyvpn-owner-{mtproxy-bot-promote,telemt-worker-install-188}.sh' || true
          fi
