name: Relay89 conntrack capacity repair and verification
on:
  push:
    paths: ['.github/workflows/relay89-egress-rootcause.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: relay89-egress-rootcause
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      SSHPASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - name: Repair confirmed conntrack exhaustion and verify DNS and TCP
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          command -v sshpass >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq sshpass; }
          sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=12 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 root@89.125.90.101 'python3 -u -' <<'PY'
          import subprocess,pathlib,time,json,collections,re,datetime,os
          def run(cmd,t=15):
           try:
            p=subprocess.run(cmd,capture_output=True,text=True,timeout=t);return p.stdout+p.stderr
           except subprocess.TimeoutExpired:return 'TIMEOUT'
          def val(n):return int((pathlib.Path('/proc/sys/net/netfilter')/n).read_text())
          def stats():
           d=collections.Counter()
           for l in run(['conntrack','-S']).splitlines():
            for k,v in re.findall(r'(\w+)=(\d+)',l):d[k]+=int(v)
           return dict(d)
          maxpath=pathlib.Path('/proc/sys/net/netfilter/nf_conntrack_max')
          old=val('nf_conntrack_max'); count=val('nf_conntrack_count')
          available=int(re.search(r'MemAvailable:\s+(\d+)',pathlib.Path('/proc/meminfo').read_text()).group(1))
          print('BEFORE',json.dumps({'max':old,'count':count,'available_kib':available,'stats':stats()}),flush=True)
          assert available>512000,'insufficient memory headroom'
          assert old<=262144,'unexpected conntrack limit'
          backup=pathlib.Path('/root/relay89-egress-fix-20261108')
          backup.mkdir(mode=0o700,exist_ok=True)
          orig=backup/'nf_conntrack_max.before'
          if not orig.exists():orig.write_text(str(old)+'\n')
          p=pathlib.Path('/etc/sysctl.d/99-z-relay89-conntrack.conf')
          if p.exists() and not (backup/'sysctl.before').exists():(backup/'sysctl.before').write_bytes(p.read_bytes())
          maxpath.write_text('262144\n')
          assert val('nf_conntrack_max')==262144
          temp=p.with_suffix('.tmp')
          temp.write_text('# Relay89: prevent conntrack exhaustion under Telegram connection churn.\nnet.netfilter.nf_conntrack_max = 262144\n')
          os.replace(temp,p)
          (backup/'rollback.sh').write_text('#!/bin/sh\nset -eu\n# Run only after checking current conntrack occupancy.\nsysctl -w net.netfilter.nf_conntrack_max='+orig.read_text().strip()+'\n')
          print('APPLIED',p.read_text(),flush=True)
          before=stats()
          print('PROCESS_CPU',run(['ps','-eo','pid,comm,pcpu,pmem','--sort=-pcpu']).splitlines()[:18],flush=True)
          units=run(['systemctl','list-units','--type=service','--all','--no-legend']).splitlines()
          for l in units:
           if re.search('telemt|mtg|mtproxy|tproxy|telegram|xray|socks',l,re.I):print('UNIT',l,flush=True)
          for i in range(5):
           s=run(['ss','-Hntp','dst',':8888'])
           proc=collections.Counter(re.findall(r'\("([^"]+)",pid=(\d+)',s))
           print('PORT8888_PROCESS_SAMPLE',i,json.dumps([(list(k),v) for k,v in proc.most_common()]),flush=True)
           time.sleep(.3)
          for name in ['telemt','telemt-direct','mtproxy','xray','tproxy-server']:
           print('SERVICE',name,run(['systemctl','show',name,'-p','ActiveState,SubState,NRestarts,ExecMainStartTimestamp']),flush=True)
          for host in ['api.telegram.org','www.cloudflare.com','example.com']:
           ok=0; times=[]
           for i in range(20):
            p1=subprocess.run(['curl','-4','-sS','-o','/dev/null','--connect-timeout','3','--max-time','6','-w','%{time_connect} %{time_total} %{http_code}','https://'+host+'/'],capture_output=True,text=True,timeout=8)
            ok+=p1.returncode==0
            times.append(p1.stdout if p1.returncode==0 else 'ERROR '+p1.stderr.strip())
           print('VERIFY_HTTPS',host,'success',ok,'total',20,json.dumps(times),flush=True)
          for resolver in ['8.8.8.8','1.1.1.1']:
           good=0
           for i in range(20):
            x=run(['dig','@'+resolver,'api.telegram.org','A','+tries=1','+time=2','+short'],4)
            good+=bool(re.search(r'^149\.154\.',x,re.M))
           print('VERIFY_DNS',resolver,'success',good,'total',20,flush=True)
          for i in range(3):
           print('POST_SAMPLE',i,'count',val('nf_conntrack_count'),'max',val('nf_conntrack_max'),'stats',json.dumps(stats()),flush=True)
           if i<2:time.sleep(20)
          after=stats();print('CT_STATS_DELTA',json.dumps({k:after.get(k,0)-before.get(k,0) for k in ['drop','early_drop','insert_failed']}),flush=True)
          print('PERSIST_READBACK',p.read_text(),flush=True)
          print('MEM_AFTER',run(['free','-m']),flush=True)
          
          PY
