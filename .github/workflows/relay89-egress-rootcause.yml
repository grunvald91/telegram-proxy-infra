name: Relay89 MTProxy connection churn diagnosis
on:
  push:
    paths: ['.github/workflows/relay89-egress-rootcause.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: relay89-egress-rootcause
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      SSHPASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - name: Identify MTProxy worker lifecycle and upstream failures
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          command -v sshpass >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq sshpass; }
          sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=12 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 root@89.125.90.101 'python3 -u -' <<'PY'
          import subprocess,pathlib,re,time,json,collections,os
          def run(cmd,t=15):
           try:
            p=subprocess.run(cmd,capture_output=True,text=True,timeout=t);return p.stdout+p.stderr
           except subprocess.TimeoutExpired:return 'TIMEOUT'
          def clean(s):
           s=re.sub(r'(?i)(password|passwd|secret|token|privatekey|presharedkey|uuid)\s*([=:]\s*|\s+)\S+',r'\1=<redacted>',s)
           s=re.sub(r'\b[0-9a-fA-F]{32,}\b','<hex>',s)
           return s
          for unit in ['mtproxy','mtproxy-ru']:
           print('UNIT',unit,run(['systemctl','show',unit,'-p','MainPID,ControlGroup,KillMode,NRestarts,ExecMainStartTimestamp,ActiveState']),flush=True)
           print('JOURNAL',unit,clean(run(['journalctl','-u',unit,'-n','65','--no-pager','-o','short-iso']))[:18000],flush=True)
           p=pathlib.Path('/etc/systemd/system')/(unit+'.service')
           if p.exists():print('UNITFILE',unit,clean(p.read_text()),flush=True)
          print('PS',run(['ps','-eo','pid,ppid,lstart,comm,pcpu','--sort=pid']),flush=True)
          for pid in [640,804,3024039,3024042]:
           p=pathlib.Path('/proc')/str(pid)
           if p.exists():
            print('CGROUP',pid,(p/'cgroup').read_text(),flush=True)
            print('EXE',pid,str((p/'exe').resolve()),flush=True)
          for path in ['/etc/mtproxy','/etc/mtproxy-ru']:
           p=pathlib.Path(path)
           if p.is_dir():
            for f in p.iterdir():
             if f.is_file():
              print('FILEMETA',str(f),f.stat().st_size,f.stat().st_mtime,flush=True)
              if 'config' in f.name and f.suffix!='.env':print('ROUTE_CONFIG',str(f),clean(f.read_text(errors='replace'))[:7000],flush=True)
          for port in [2398,2399,8888,8889]:
           s=run(['ss','-Hntp','state','established','sport',':'+str(port)])
           print('INCOMING',port,'count',len(s.splitlines()),'processes',collections.Counter(re.findall(r'\("([^"]+)"',s)),flush=True)
          print('COUNT',pathlib.Path('/proc/sys/net/netfilter/nf_conntrack_count').read_text(),flush=True)
          print('MAX',pathlib.Path('/proc/sys/net/netfilter/nf_conntrack_max').read_text(),flush=True)
          print('STATS',run(['conntrack','-S']),flush=True)
          backup=pathlib.Path('/root/relay89-egress-fix-20261108')
          rollback='#!/bin/sh\nset -eu\ncurrent=$(cat /proc/sys/net/netfilter/nf_conntrack_count)\nprevious=$(cat '+str(backup)+'/nf_conntrack_max.before)\n[ "$current" -lt "$previous" ] || { echo "Refusing rollback: current occupancy exceeds previous limit"; exit 1; }\n'
          rollback+='if [ -f '+str(backup)+'/sysctl.before ]; then cp '+str(backup)+'/sysctl.before /etc/sysctl.d/99-z-relay89-conntrack.conf; else rm -f /etc/sysctl.d/99-z-relay89-conntrack.conf; fi\n'
          rollback+='sysctl -w net.netfilter.nf_conntrack_max="$previous"\n'
          (backup/'rollback.sh').write_text(rollback)
          print('ROLLBACK_CORRECTED=true',flush=True)
          
          PY
