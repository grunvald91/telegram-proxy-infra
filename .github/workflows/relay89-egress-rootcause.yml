name: Relay89 verified clock recovery and conntrack observation
on:
  push:
    paths: ['.github/workflows/relay89-egress-rootcause.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: relay89-egress-rootcause
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      SSHPASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - name: Verify independent HTTPS time sources and recover MTProxy clock
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          command -v sshpass >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq sshpass; }
          sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=12 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 root@89.125.90.101 'python3 -u -' <<'PY'
          import subprocess,pathlib,time,urllib.request,email.utils,statistics,json,re,uuid,collections
          def run(cmd,t=15):
           try:
            p=subprocess.run(cmd,capture_output=True,text=True,timeout=t);return p.stdout+p.stderr
           except subprocess.TimeoutExpired:return 'TIMEOUT'
          def ct():return pathlib.Path('/proc/sys/net/netfilter/nf_conntrack_count').read_text().strip()
          print('TIME_BEFORE',time.time(),flush=True)
          print('TIMEDATE',run(['timedatectl','status']),flush=True)
          print('TIMESYNC',run(['timedatectl','timesync-status']),flush=True)
          print('TIMESYNC_JOURNAL',run(['journalctl','-u','systemd-timesyncd','-n','12','--no-pager']),flush=True)
          # Provide headroom during clock recovery; never flush active connections.
          limit=pathlib.Path('/proc/sys/net/netfilter/nf_conntrack_max')
          limit.write_text('524288\n')
          p=pathlib.Path('/etc/sysctl.d/99-z-relay89-conntrack.conf')
          p.write_text('# Relay89 conntrack headroom during MTProxy clock repair.\nnet.netfilter.nf_conntrack_max = 524288\n')
          def offsets():
           vals=[]
           for url in ['https://www.google.com/generate_204','https://www.cloudflare.com/cdn-cgi/trace','https://api.telegram.org/']:
            try:
             a=time.time()
             with urllib.request.urlopen(url+'?clockcheck='+uuid.uuid4().hex,timeout=6) as r:date=r.headers.get('Date')
             b=time.time()
             epoch=email.utils.parsedate_to_datetime(date).timestamp()
             offset=epoch-(a+b)/2
             print('HTTPS_CLOCK',url,'offset',round(offset,3),'rtt',round(b-a,3),flush=True)
             if b-a<3:vals.append(offset)
            except Exception as e:print('CLOCK_ERROR',url,type(e).__name__,flush=True)
           return vals
          vals=offsets()
          assert len(vals)>=2 and max(vals)-min(vals)<3,'HTTPS time sources disagree'
          offset=statistics.median(vals)
          print('CLOCK_OFFSET_MEDIAN',offset,flush=True)
          if abs(offset)>5:
           print('NTP_RESTART',run(['systemctl','restart','systemd-timesyncd']),flush=True)
           time.sleep(12)
           check=offsets()
           assert len(check)>=2 and max(check)-min(check)<3
           correction=statistics.median(check)
           if abs(correction)>5:
            assert abs(correction)<300,'clock correction exceeds bounded incident scope'
            print('TIME_STEP',run(['date','-u','-s','@'+str(time.time()+correction)]),flush=True)
          print('TIME_AFTER',time.time(),'COUNT',ct(),flush=True)
          print('NTP_FINAL',run(['timedatectl','timesync-status']),flush=True)
          for i in range(4):
           s=run(['conntrack','-S'])
           print('SAMPLE',i,'epoch',time.time(),'count',ct(),'stats',s.strip(),flush=True)
           print('PORT8888_OWNERS',collections.Counter(re.findall(r'\("([^"]+)",pid=(\d+)',run(['ss','-Hntp','dst',':8888']))),flush=True)
           if i<3:time.sleep(20)
          print('CLOCK_FINAL_OFFSETS',offsets(),flush=True)
          
          PY
