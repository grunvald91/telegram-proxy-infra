name: Threads www SNI QUIC Initial versus UDP controls (read-only)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths: [.github/workflows/threads-www-udp-initial-diff-20261110.yml]
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      RU_PASS: ${{ secrets.SERVER188_SSH_PASSWORD }}
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Offline validate 1252-byte QUIC v1 Initial fixtures and same-sized controls
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/threads-www-udp-initial-diff-20261110.py self-test
          test -n "$RU_PASS" && test -n "$DE_PASS"
      - name: Count RU ingress versus DE egress for matched-size UDP datagrams
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -qq -y sshpass >/dev/null
          id="$GITHUB_RUN_ID"
          [[ "$id" =~ ^[0-9]{9,13}$ ]]
          work="/tmp/mnebydns-udp-fixture-$id"
          ru_ssh() {
            SSHPASS="$RU_PASS" sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=12 -o LogLevel=ERROR root@188.120.254.223 "$@"
          }
          de_ssh() {
            SSHPASS="$DE_PASS" sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=12 -o LogLevel=ERROR root@89.125.90.101 "$@"
          }
          cleanup(){
            code=$?
            trap - EXIT
            de_ssh "rm -rf -- '$work'" || true
            exit "$code"
          }
          trap cleanup EXIT
          de_ssh "mkdir -m 700 '$work'"
          tar -czf - -C scripts mnebydns-meta-quic.py test-mnebydns-meta-quic.py threads-www-udp-initial-diff-20261110.py |
            de_ssh "tar -xzf - -C '$work'"
          de_ssh "python3 '$work/threads-www-udp-initial-diff-20261110.py' self-test"
          de_ssh "ip -4 route get 188.120.254.223 | grep -v tg-relay"
          ru_ssh "ip -4 route get 89.125.90.101 | grep -v tg-relay"
          ru_ssh "systemctl is-active --quiet nginx && echo ru_nginx_preserved=true"
          # Collect only packet header metadata for test address pair, no payload or PCAP saved.
          ru_ssh 'bash -s' <<'SH' > "$RUNNER_TEMP/ru_udp.log" &
          set -Eeuo pipefail
          iface="$(ip -4 route get 89.125.90.101 | sed -n 's/.* dev \([^ ]*\).*/\1/p' | head -1)"
          test -n "$iface" && test "$iface" != "tg-relay"
          echo 'ru_udp_capture_started=true'
          timeout -s TERM 33s tcpdump -i "$iface" -nn -tt -l -s 96 'udp and host 89.125.90.101 and port 443' 2>/dev/null | python3 -c '
          import sys,re,collections
          data=collections.defaultdict(lambda:[0,0,0,0])
          for line in sys.stdin:
              m=re.search(r"\bIP\s+([\d.]+)\.(\d+)\s+>\s+([\d.]+)\.(\d+):.*\bUDP,\s+length\s+(\d+)",line)
              if not m:continue
              src,sp,dst,dp,n=m.groups()
              if src=="89.125.90.101" and dst=="188.120.254.223" and int(dp)==443:
                  port=int(sp);side=0
              elif src=="188.120.254.223" and dst=="89.125.90.101" and int(sp)==443:
                  port=int(dp);side=2
              else:continue
              data[port][side]+=1;data[port][side+1]+=int(n)
          for p,row in sorted(data.items()):
              print("RU_UDP_PORT",p,*row,flush=True)
          ' || test "$?" -eq 124
          SH
          ru_pid=$!
          de_ssh 'bash -s' <<'SH' > "$RUNNER_TEMP/de_udp.log" &
          set -Eeuo pipefail
          iface="$(ip -4 route get 188.120.254.223 | sed -n 's/.* dev \([^ ]*\).*/\1/p' | head -1)"
          test -n "$iface" && test "$iface" != "tg-relay"
          echo 'de_udp_capture_started=true'
          timeout -s TERM 33s tcpdump -i "$iface" -nn -tt -l -s 96 'udp and host 188.120.254.223 and port 443' 2>/dev/null | python3 -c '
          import sys,re,collections
          data=collections.defaultdict(lambda:[0,0,0,0])
          for line in sys.stdin:
              m=re.search(r"\bIP\s+([\d.]+)\.(\d+)\s+>\s+([\d.]+)\.(\d+):.*\bUDP,\s+length\s+(\d+)",line)
              if not m:continue
              src,sp,dst,dp,n=m.groups()
              if src=="89.125.90.101" and dst=="188.120.254.223" and int(dp)==443:
                  port=int(sp);side=0
              elif src=="188.120.254.223" and dst=="89.125.90.101" and int(sp)==443:
                  port=int(dp);side=2
              else:continue
              data[port][side]+=1;data[port][side+1]+=int(n)
          for p,row in sorted(data.items()):
              print("DE_UDP_PORT",p,*row,flush=True)
          ' || test "$?" -eq 124
          SH
          de_pid=$!
          sleep 5
          de_ssh "python3 '$work/threads-www-udp-initial-diff-20261110.py' send --repeat 4" > "$RUNNER_TEMP/udp_trials.log"
          wait "$ru_pid"
          wait "$de_pid"
          python3 - "$RUNNER_TEMP/udp_trials.log" "$RUNNER_TEMP/ru_udp.log" "$RUNNER_TEMP/de_udp.log" <<'PY'
          import pathlib,sys,re,collections
          trials,ru_file,de_file=[pathlib.Path(x) for x in sys.argv[1:]]
          def load(path,prefix):
              out={}
              for line in path.read_text().splitlines():
                  m=re.match(prefix+r"_UDP_PORT\s+(\d+)\s+(\d+)\s+(\d+)\s+(\d+)\s+(\d+)",line)
                  if m:
                      p=int(m.group(1));out[p]=tuple(map(int,m.groups()[1:]))
              return out
          ru=load(ru_file,"RU")
          de=load(de_file,"DE")
          stats=collections.defaultdict(lambda:collections.Counter())
          n=0
          for line in trials.read_text().splitlines():
              m=re.match(r"udp_trial=(\w+) local_port=(-?\d+) sent=(\d+) error=(\S+)",line)
              if not m:continue
              label,sp,sent,error=m.groups()
              port=int(sp);sent=int(sent);n+=1
              st=stats[label]
              st["attempts"]+=1
              st["send_success"]+=int(sent>0)
              st["de_egress_seen"]+=int(de.get(port,(0,0,0,0))[0]>0)
              st["ru_ingress_seen"]+=int(ru.get(port,(0,0,0,0))[0]>0)
              st["de_egress_bytes"]+=de.get(port,(0,0,0,0))[1]
              st["ru_ingress_bytes"]+=ru.get(port,(0,0,0,0))[1]
          print("udp_differential_trials="+str(n),flush=True)
          print("udp_ru_capture_started="+str("ru_udp_capture_started=true" in ru_file.read_text()).lower(),flush=True)
          print("udp_de_capture_started="+str("de_udp_capture_started=true" in de_file.read_text()).lower(),flush=True)
          for label,st in sorted(stats.items()):
              print("udp_result "+label+" "+
                " ".join(k+"="+str(st[k]) for k in
                ("attempts","send_success","de_egress_seen","ru_ingress_seen","de_egress_bytes","ru_ingress_bytes")),flush=True)
          assert n==36
          assert "ru_udp_capture_started=true" in ru_file.read_text()
          assert "de_udp_capture_started=true" in de_file.read_text()
          print("udp_diff_complete_with_no_prod_config_changes=true",flush=True)
          PY
