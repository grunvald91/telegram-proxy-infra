name: MNEBYVPN DE to RU private inner-packet loss pinpoint read-only
on:
  push:
    branches: [audit/mnebyvpn-853-wg-rootcause-20261116]
    paths: ['.github/workflows/mnebyvpn-reverse-inner-packet-correlation-20261116.yml']
permissions: {contents: read}
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      RU_PASS: ${{ secrets.SERVER188_SSH_PASSWORD }}
      DE_PASS: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Two-sided passive ICMP flow correlation with unique test identifier
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$RU_PASS" && test -n "$DE_PASS"
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sshpass >/dev/null
          opts=(-T -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 -o "UserKnownHostsFile=$PWD/ops/mnebydns-owner-ssh-known_hosts" -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no -o LogLevel=ERROR)
          remote() {
            local pwd="$1" host="$2"; shift 2
            SSHPASS="$pwd" sshpass -e ssh "${opts[@]}" root@"$host" "$@"
          }
          remote "$DE_PASS" 89.125.90.101 'command -v tcpdump >/dev/null && ip link show dev tg-relay >/dev/null'
          remote "$RU_PASS" 188.120.254.223 'command -v tcpdump >/dev/null && ip link show dev tg-relay >/dev/null'
          cap="timeout -s INT 38 tcpdump -n -l -tt -i tg-relay -s 96 'icmp and host 10.66.77.1 and host 10.66.77.2' 2>/dev/null"
          remote "$DE_PASS" 89.125.90.101 "$cap" > "$RUNNER_TEMP/de-flow.txt" &
          de_pid=$!
          remote "$RU_PASS" 188.120.254.223 "$cap" > "$RUNNER_TEMP/ru-flow.txt" &
          ru_pid=$!
          sleep 4
          remote "$DE_PASS" 89.125.90.101 "ping -n -q -M do -e 31277 -c 45 -i 0.35 -s 1200 -W 1 10.66.77.2" > "$RUNNER_TEMP/ping.txt" || true
          wait "$de_pid" || true
          wait "$ru_pid" || true
          python3 - "$RUNNER_TEMP/de-flow.txt" "$RUNNER_TEMP/ru-flow.txt" "$RUNNER_TEMP/ping.txt" <<'PY'
          import pathlib,sys,re,json
          de,ru,ping=[pathlib.Path(p).read_text(errors="replace") for p in sys.argv[1:]]
          def extract(text,kind):
              out=set()
              for line in text.splitlines():
                  if "id 31277" not in line or "ICMP echo "+kind not in line:continue
                  m=re.search(r"\bseq (\d+)\b",line)
                  if m and 1<=int(m[1])<=45:out.add(int(m[1]))
              return out
          d_req=extract(de,"request");r_req=extract(ru,"request")
          r_rep=extract(ru,"reply");d_rep=extract(de,"reply")
          m=re.search(r"(\d+) packets transmitted,\s*(\d+) (?:packets )?received,\s*([\d.]+)% packet loss",ping)
          x={"source_de_requests":len(d_req),"dest_ru_requests":len(r_req),
             "dest_ru_replies":len(r_rep),"source_de_replies":len(d_rep),
             "lost_forward_de_to_ru":len(d_req-r_req),
             "missing_ru_echo_reply":len(r_req-r_rep),
             "lost_return_ru_to_de":len(r_rep-d_rep),
             "ping_loss_pct":float(m[3]) if m else None}
          print("DE_RU_INNER_PACKET_CORRELATION="+json.dumps(x,separators=(",",":")),flush=True)
          if not d_req or not r_req or not m:raise SystemExit("INSUFFICIENT_PACKET_CORRELATION")
          PY
          echo TWO_SIDED_REVERSE_PACKET_AUDIT_DONE=true
