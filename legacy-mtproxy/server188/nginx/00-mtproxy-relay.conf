# Sanitized snapshot from active server 188 config, audited 2026-10-01.
# TCP relay for MTProxy clients.

upstream s1_mtproxy {
    server 10.66.77.1:443;
}

server {
    listen 8443;
    listen [::]:8443;
    proxy_pass s1_mtproxy;
    proxy_connect_timeout 10s;
    proxy_timeout 1h;
    proxy_socket_keepalive on;
    tcp_nodelay on;
}

server {
    listen 2052;
    listen [::]:2052;
    proxy_pass s1_mtproxy;
    proxy_connect_timeout 10s;
    proxy_timeout 1h;
    proxy_socket_keepalive on;
    tcp_nodelay on;
}

server {
    listen 2086;
    listen [::]:2086;
    proxy_pass s1_mtproxy;
    proxy_connect_timeout 10s;
    proxy_timeout 1h;
    proxy_socket_keepalive on;
    tcp_nodelay on;
}

server {
    listen 8089;
    listen [::]:8089;
    proxy_pass s1_mtproxy;
    proxy_connect_timeout 10s;
    proxy_timeout 1h;
    proxy_socket_keepalive on;
    tcp_nodelay on;
}
