# Sanitized snapshot from active server 188 config, audited 2026-10-01.
# The original file comments indicate that firewall rules redirect a selected
# client subnet from public :443 to this listener.

server {
    listen 10443 so_keepalive=30s:10s:3;
    listen [::]:10443 so_keepalive=30s:10s:3;
    proxy_pass 10.66.77.1:9470;
    proxy_connect_timeout 5s;
    proxy_timeout 15m;
    proxy_socket_keepalive on;
    tcp_nodelay on;
}
