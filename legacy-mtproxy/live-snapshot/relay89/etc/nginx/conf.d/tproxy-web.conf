map $http_upgrade $tproxy_connection_upgrade {
    default upgrade;
    ''      "";
}

upstream tproxy_relay {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 127.0.0.1:3000;
    server_name _;
    root /var/www/cdn-servgo;
    index index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
