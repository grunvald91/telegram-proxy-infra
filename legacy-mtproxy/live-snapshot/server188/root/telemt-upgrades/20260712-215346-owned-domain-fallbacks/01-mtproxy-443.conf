# Added 2026-06-18: MTProxy entry on STANDARD port 443 via SNI dispatch.
# Operator filters non-standard ports on return path; 443 passes.
map $ssl_preread_server_name $mt443_upstream {
    cdn.bandbook.site   127.0.0.1:9460;
    sberbank.ru         10.66.77.1:443;
    petrovich.ru        10.66.77.1:443;
    www.sberbank.ru     10.66.77.1:443;
    yandex.ru           10.66.77.1:443;
    www.yandex.ru       10.66.77.1:443;
    gosuslugi.ru        10.66.77.1:443;
    www.gosuslugi.ru    10.66.77.1:443;
    xapi.ozon.ru        10.66.77.1:443;
    api.ozon.ru         10.66.77.1:443;
    www.ozon.ru         10.66.77.1:443;
    ozon.ru             10.66.77.1:443;
    m.ozon.ru           10.66.77.1:443;
    disk.yandex.ru      10.66.77.1:443;
    www.kinopoisk.ru    10.66.77.1:443;
    www.avito.ru        10.66.77.1:443;
    cloud.mail.ru       10.66.77.1:443;
    default             127.0.0.1:8444;
}
server {
    listen 443;
    listen [::]:443;
    ssl_preread on;
    proxy_pass $mt443_upstream;
    proxy_connect_timeout 10s;
    proxy_timeout 1h;
    proxy_socket_keepalive on;
    tcp_nodelay on;
}
