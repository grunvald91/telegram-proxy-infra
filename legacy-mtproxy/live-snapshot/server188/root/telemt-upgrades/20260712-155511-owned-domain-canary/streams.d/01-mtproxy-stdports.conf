# Extra relay listeners on LOW standard TLS ports (993/995/465/853).
# Rationale: some operators drop return traffic on high/non-standard ports
# (8443/2052/2086/8089) while passing standard TLS service ports.
server { listen 993;  listen [::]:993;  proxy_pass s1_mtproxy; proxy_connect_timeout 10s; proxy_timeout 1h; proxy_socket_keepalive on; tcp_nodelay on; }
server { listen 995;  listen [::]:995;  proxy_pass s1_mtproxy; proxy_connect_timeout 10s; proxy_timeout 1h; proxy_socket_keepalive on; tcp_nodelay on; }
server { listen 465;  listen [::]:465;  proxy_pass s1_mtproxy; proxy_connect_timeout 10s; proxy_timeout 1h; proxy_socket_keepalive on; tcp_nodelay on; }
server { listen 853;  listen [::]:853;  proxy_pass s1_mtproxy; proxy_connect_timeout 10s; proxy_timeout 1h; proxy_socket_keepalive on; tcp_nodelay on; }
