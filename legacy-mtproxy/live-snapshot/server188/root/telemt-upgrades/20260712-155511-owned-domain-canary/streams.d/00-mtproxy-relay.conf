# Auto-generated 2026-05-07: TCP relay for MTProxy clients.
# Phones connect to S2:8443; we forward bytes through WireGuard tunnel to S1:443.
# S1 then performs SNI preread + telemt FakeTLS + Telegram. SNI/ClientHello is
# preserved verbatim; we do not terminate TLS on S2.
upstream s1_mtproxy {
    server 10.66.77.1:443;
}

server {
    listen 8443;
    listen [::]:8443;
    proxy_pass s1_mtproxy;
    proxy_connect_timeout 10s;
    proxy_timeout 1h;
    proxy_socket_keepalive on;
    tcp_nodelay on;
}

