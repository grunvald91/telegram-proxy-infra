# MTProxy stability tuning — 20260601-143006
# Generated by Claude Code. Rollback: rm this file && sysctl --system

# === Backlog / connection limits ===
net.core.somaxconn = 8192
net.core.netdev_max_backlog = 16384
net.ipv4.tcp_max_syn_backlog = 8192

# === Keepalive — detect dead NAT sessions faster ===
net.ipv4.tcp_keepalive_time = 600
net.ipv4.tcp_keepalive_intvl = 30
net.ipv4.tcp_keepalive_probes = 3

# === PMTU discovery — fixes mobile upload hangs through carrier NAT ===
net.ipv4.tcp_mtu_probing = 1
net.ipv4.tcp_base_mss = 1024

# === Faster failure of dead TCP ===
net.ipv4.tcp_retries2 = 9
net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_slow_start_after_idle = 0

# === BBR upload smoothness (less bufferbloat) ===
net.ipv4.tcp_notsent_lowat = 131072

# === Conntrack capacity ===
net.netfilter.nf_conntrack_max = 262144
net.netfilter.nf_conntrack_tcp_timeout_established = 7440

# === Ports / sockets ===
net.ipv4.ip_local_port_range = 10000 65535
