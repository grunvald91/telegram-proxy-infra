# Public :443 stream dispatcher.
# Route real BandBook TLS by SNI to the local nginx HTTPS vhost;
# keep all other TLS/FakeTLS traffic on the existing MTProxy relay.
map $ssl_preread_server_name $stream_443_backend {
    bandbook.site 127.0.0.1:8444;
    www.bandbook.site 127.0.0.1:8444;
    flight-profile.bandbook.site 127.0.0.1:8444;
    default 10.66.77.1:443;
}

server {
    listen 443 so_keepalive=30s:10s:3;
    listen [::]:443 so_keepalive=30s:10s:3;
    ssl_preread on;
    proxy_pass $stream_443_backend;
    proxy_connect_timeout 5s;
    proxy_timeout 15m;
    proxy_socket_keepalive on;
    tcp_nodelay on;
}
