# Fixed media.bandbook.site path for the confirmed client subnet. iptables
# redirects only that subnet from public :443 to this listener. The TLS domain
# resolves to this RF server; the encrypted stream is relayed over WireGuard.
server {
    listen 10443 so_keepalive=30s:10s:3;
    listen [::]:10443 so_keepalive=30s:10s:3;
    proxy_pass 10.66.77.1:9470;
    proxy_connect_timeout 5s;
    proxy_timeout 15m;
    proxy_socket_keepalive on;
    tcp_nodelay on;
}
