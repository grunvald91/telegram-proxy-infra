[general]
use_middle_proxy = true
force_media_middle_proxy = true

[server]
port = 9461
bind_address = "127.0.0.1"
public_ip = "media.bandbook.site"
public_port = 443
workers = 1
max_connections = 256
log_level = "info"
middle_proxy_nat_ip = "89.125.90.101"
rate_limit_per_subnet = 0
handshake_flood_guard_enabled = false

[upstream]
type = "direct"

[censorship]
tls_domain = "media.bandbook.site"
mask = true
mask_target = "127.0.0.1"
mask_port = 9442
mask_relay_max_secs = 60
unknown_sni_action = "mask"
fake_tls_only = true
desync = true
desync_split_delay_ms = 3
desync_split_jitter_ms = 3
drs = true
fast_mode = true

[access.users]
media = "<HEX_REDACTED>"
